            snippet: '# 欧盟化工巨头联手“阻击”：要求欧盟调查中企英国收购案. 据欧洲新闻网4月18日报道，有消息人士透露，一个由来自美国、捷克、斯洛文尼亚等企业组成的投诉联盟希望欧盟委员会对中企龙佰集团的收购案展开调查，因为他们害怕龙佰将对他们构成竞争压力。这个联盟合计占欧盟钛白粉（也称二氧化钛）产量的约90%。. 据悉，钛白粉是一种白色无机颜料，广泛用于涂料、塑料、造纸、油墨、化纤等行业，在各种应用中提供优异的白度、遮盖和耐候性，也是一种用于绿色能源和航空航天的重要战略化工产品。. 这些在欧盟境内生产钛白粉的生产商，已于去年12月向欧盟委员会提交投诉，指控龙佰存在所谓“不公平补贴”行为。他们还声称，龙佰收购英国工厂，是为了规避“反倾销税”。. 英国化工厂Venator UK 资料图英国化工厂Venator UK 资料图. 公开资料显示，去年10月，龙佰集团公告称，公司下属子公司佰利联欧洲计划以支付现金的方'
