            extract_text: '![](//beacon.sina.com.cn/a.gif?noScript) ![](//i.sso.sina.com.cn/images/login/thumb_default.png) ![](//n.sinaimg.cn/finance/c30320b4/20190809/cj_sinafinance_app2x.png) # 欧盟化工巨头联手“阻击”：要求欧盟调查中企英国收购案 【文/观察者网 齐倩】 因担忧无法与中国企业竞争，欧盟厂商竟联合一起搞事情，试图干涉中企收购英国工厂。 据欧洲新闻网4月18日报道，有消息人士透露，一个由来自美国、捷克、斯洛文尼亚等企业组成的投诉联盟希望欧盟委员会对中企[龙佰集团](https://finance.sina.com.cn/realstock/company/sz002601/nc.shtml)的收购案展开调查，因为他们害怕龙佰将对他们构成竞争压力。这个联盟合计占欧盟钛白粉（也称二氧化钛）产量的约90%。 据悉，钛白粉是一种白色无机颜料，广泛用于涂料、塑料、造纸、油墨、化纤等行业，在各种应用中提供优异的白度、遮盖和耐候性，也是一种用于绿色能源和航空航天的重要战略化工产品。 这些在欧盟境内生产钛白粉的生产商，已于去年12月向欧盟委员会提交投诉，指控龙佰存在所谓“不公平补贴”行为。他们还声称，龙佰收购英国工厂，是为了规避“反倾销税”。 此前，欧盟委员会在2025年1月决定对龙佰集团征收“反倾销关税”。 根据欧盟和英国的贸易协定，中企收购英国生产工厂后，其产品可以免税出口到欧洲市场。 ![英国化工厂Venator UK 资料图](//n.sinaimg.cn/sinakd20260419s/250/w640h410/20260419/0755-2980d4d398ca5a57018efa90bd49764e.jpg)英国化工厂Venator UK 资料图 公开资料显示，去年10月，龙佰集团公告称，公司下属子公司佰利联欧洲计划以支付现金的方式，收购英国工厂Venator UK持有的与钛白粉业务相关的资产，交易对价为6990万美元，佰利联欧洲需承担的增值税、印花税等税费预计约1419万美元，本次收购的资金来源于自有资金或自筹资金。 Venator UK位于英格兰东北部的格里瑟姆。英国政府目前正审查这笔交易，预计将于5月作出决定。 欧洲新闻网提到，欧盟2022年通过的“外国补贴条例”允许委员会调查非欧盟企业，以评估他们是否因“扭曲性的外国补贴”而在欧盟进行收购或参与公共采购。该工具最初就是针对中国设计的，但迄今尚未在欧盟以外适用。 报道指出，如果欧盟委员会根据此条例启动调查，这将开创先例，并向全球发出强烈信号。 上述欧盟厂商嘴上冠冕堂皇，但本质就是为了“不公平竞争”，担忧无法承受来自中国竞争对手日益激烈的竞争压力。代表欧盟化工行业的欧洲化工理事会（Cefic）表示，自2022年以来，欧盟已损失约9%的生产能力，导致2万个直接就业岗位流失。 近年来，欧方鼓噪对华经济竞争，持续推进对华“去风险”，以维护“经济安全”“公平竞争”等为名，出台了一系列保护主义措施，在芯片、5G、电动汽车等许多中欧本可开展互利共赢合作的领域人为设限，对中国企业采取歧视性、限制性措施，扰乱全球产供链健康稳定运行。 欧盟不断动用政治工具，干涉企业运营。去年11月，欧盟中国商会发布《中国企业在欧盟发展报告》，指出中国企业对欧营商环境整体评分已经连续第6年下滑。 报告指出，81%的受访企业认为，当前营商环境“不确定性增高”；90%的受访企业表示，欧盟“去风险”政策和经济安全战略损害业务运营和市场信心；超四成中企表示曾遭受差异化待遇。“不确定性”成为当前在欧中企运营的“最大梗阻”。 “我们注意到这份报告，也注意到中国企业对在欧运营持续承压感到担忧。”外交部发言人林剑说。 林剑强调，有关做法不仅无助于提高欧方自身产业竞争力，还对外释放了欧盟市场开放程度不断倒退的消极信号，影响了中国企业赴欧投资信心，最终只会损害欧方自身利益。 本文系观察者网独家稿件，未经授权，不得转载。 ![](//n.sinaimg.cn/finance/cece9e13/20240627/655959900_20240627.png) ![](//n.sinaimg.cn/finance/transform/260/w880h180/20180326/zi4T-fysqfnf9377213.png) ## VIP课程推荐 ## APP专享直播 ## 热门推荐 ![新浪财经公众号](//n.sinaimg.cn/finance/72219a70/20180103/_thumb_23666.png "新浪财经公众号") 24小时滚动播报最新的财经资讯和视频，更多粉丝福利扫描二维码关注（sinafinance） ## [股市直播](http://live.finance.sina.com.cn) ## [7X24小时](http://live.sina.com.cn/zt/f/v/finance/globalnews1) ![杨伟民](https://n.sinaimg.cn/zhuanlan/transform/170/w85h85/20221230/f01f-b20f33f6583ea1f69aefeedf1b86f051.jpg) ![董明珠还能为格力奋战多久？|《至少一个小时》](//n.sinaimg.cn/finance/transform/525/w300h225/20201030/ecb0-kcaeqzy3436531.jpg) ![梁建章：中国人口衰竭的速度前所未有](//n.sinaimg.cn/finance/transform/525/w300h225/20201030/75b9-kcaeqzy3438114.jpg) ![冷友斌回应网友质疑：说价格高 对飞鹤不公平！](//n.sinaimg.cn/finance/transform/525/w300h225/20201030/c485-kcaeqzy3442305.jpg) ![王中军：我喜欢比较“江湖”一点的人](//n.sinaimg.cn/finance/transform/525/w300h225/20201030/a563-kcaeqzy3444360.jpg) [新浪财经意见反馈留言板](http://news.sina.com.cn/feedback/post.html) [新浪简介](http://ir.sina.com.cn/index.shtml)|[广告服务](http://emarketing.sina.com.cn/)|[About Sina](http://corp.sina.com.cn/eng/) [联系我们](http://www.sina.com.cn/contactus.html)|[招聘信息](http://corp.sina.com.cn/chn/sina_job.html)|[通行证注册](https://login.sina.com.cn/signup/signup.php) [产品答疑](http://help.sina.com.cn/)|[网站律师](http://www.sina.com.cn/intro/lawfirm.shtml)|[SINA English](http://english.sina.com) Copyright © 1996-2026 SINA Corporation All Rights Reserved 新浪公司 [版权所有](http://www.sina.com.cn/intro/copyright.shtml)'
