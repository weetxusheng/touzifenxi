                published_at: '2026-04-19'
                snippet: '# 华为将通过昇腾开源生态开发者计划发布超200项算子任务. 上证报中国证券网讯（记者 荆淮侨）华为常务董事、ICT BG CEO杨超斌4月19日在武汉表示，今年，华为将通过昇腾开源生态开发者计划发布200余项算子任务，并面向高校学生选拔超2000名优秀开发者并提供实习岗位。. 当天，第十届华为ICT大赛中国总决赛在武汉落幕。杨超斌在会上表示，自2013年启动ICT学院项目以来，华为与全球2000多所高校建立合作，累计培养超百万实战型ICT人才。华为将持续搭建创新实践平台，推动高校培养方向与产业需求对接，助力更多ICT青年成长为技术骨干。. 据介绍，本届大赛中国总决赛由华中科技大学与华为联合主办，重点设置了基于国产化算力平台的赛道，将模型迁移、算子开发等产业急需的“工程化”能力作为考核重点，解决“国产算力硬件已具备支撑大模型的能力，但软件生态与高校工程化培养相对滞后”的痛点。. 在开源推理'
