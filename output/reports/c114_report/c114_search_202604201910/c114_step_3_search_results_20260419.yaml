                domain: 'www.donews.com'
                published_at: '2026-04-19'
                snippet: '汽车 文娱 体育 专栏 直播 专题. 首页 快讯 商业 消费 游戏 3C 家电 汽车 文娱 体育 专栏 直播 专题 APP. DoNews > 公司新闻 > 华为ICT大赛十年收官：16万人参赛，聚焦AI与算子优化实战. 推荐 2026-04-19 10:51:02. 第十届华为ICT大赛中国总决赛于4月19日在华中科技大学落幕，华为常务董事、ICT BG CEO杨超斌出席闭幕式并致辞。本届大赛历时9个月，覆盖全国1400所高校，累计16万名选手报名，1430名选手组成475支队伍晋级总决赛，在六大赛道共产生319个奖项。. 杨超斌指出，人才是数字时代的核心引擎，产教协同是培育人才的关键路径。自2013年启动ICT学院项目以来，华为已与全球2000多所高校合作，累计培养超百万实战型ICT人才。合作模式涵盖课训、赛训及会实训，践行开放共赢生态理念。. 本届赛事技术内容紧贴产业前沿。挑战赛设置'
