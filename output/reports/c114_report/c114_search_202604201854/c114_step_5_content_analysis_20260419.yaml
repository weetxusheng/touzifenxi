        original_content:
          title: '杨超斌：华为ICT大赛十年新起点，为数字产业锻造实战型人才'
          summary: 'C114讯 4月19日上午消息（蒋均牧）第十届 华为 ICT 大赛中国总决赛在华中科技大学落下帷幕，华为常务董事、ICT BG CEO杨超斌出席闭幕式并致辞。本届大赛历时9个月，覆盖全国1400所高校，累计16万名选手报名参赛，最终1430名选手、475支队伍晋级总决赛，在六大赛道逐出319个奖项。 “人才是数字时代的核心引擎，产教协同是培育人才的关键路径。”杨超斌指出，自2013年启动ICT学院'
          text: 'C114讯 4月19日上午消息（蒋均牧）第十届 华为 ICT 大赛中国总决赛在华中科技大学落下帷幕，华为常务董事、ICT BG CEO杨超斌出席闭幕式并致辞。本届大赛历时9个月，覆盖全国1400所高校，累计16万名选手报名参赛，最终1430名选手、475支队伍晋级总决赛，在六大赛道逐出319个奖项。 “人才是数字时代的核心引擎，产教协同是培育人才的关键路径。”杨超斌指出，自2013年启动ICT学院项目以来，华为始终与高校深度合作，以课训、赛训、会实训的模式助力学子成长。13年间，华为与全球2000多所高校建立合作，累计培养超百万实战型ICT人才，践行开放合作共赢的生态理念。 本届赛事的技术比拼紧贴产业前沿。挑战赛设置4道算子优化赛题，累计收到120余个优化方案；在开源推理大模型赛题中，浙江大学、上海交通大学团队通过高效并行优化实现性能提升30%。创新赛环节，选手依托华为开源模型引擎及 AI 工具链，在模型精度仅损失1%的前提下，将端到端推理速度提升6倍。这些成果反映出高校学子扎实的技术功底，也验证了“以赛促学”模式在解决真实工程问题上的价值。 “00后是AI时代的亲历者，更是创新的主力军。”华为深耕AI产业，并将高端AI人才培养置于战略核心，与高校共建生态，致力于鲲鹏昇腾科教创新孵化中心的水平打造，探索课程共建、科教引导、项目化的新模式，引导学生在实践中锤炼能力。杨超斌在现场提及“张雪机车”的故事，指出这份扎根热爱、执着钻研的极客精神，正是新时代青年开发者最可贵的品质。 面向2026年，华为将通过昇腾开源生态开发者计划发布200余项算子任务，面向高校招募学子，选拔2000多名优秀开发者并提供实习岗位。杨超斌强调，华为将持续搭建创新实践平台，推动高校培养方向与产业需求精准对接，助力更多ICT青年成长为技术骨干，为我国新兴产业注入青春动能。 “不为胜负所限，只为突破而来。”这是大赛的精神，也是华为对人才培养的长期追求。可以看到，在AI浪潮席卷而来的背景下，华为正以十年ICT大赛为新起点，携手高校培育更多有理想、有技术、有担当的时代青年，为我国数字产业高质量发展贡献更多力量。 版权说明：C114刊载的内容，凡注明来源为“C114通信网”或“C114原创”皆属C114版权所有，未经允许禁止转载、摘编，违者必究。对于经过授权可以转载我方内容的单位，也必须保持转载文章、图像、音视频的完整性，并完整标注作者信息和本站来源。编译类文章仅出于传递更多信息之目的，不代表证实其描述或赞同其观点；翻译质量问题 请指正 。'
          source: 'aliyun'
          status: 'success'
