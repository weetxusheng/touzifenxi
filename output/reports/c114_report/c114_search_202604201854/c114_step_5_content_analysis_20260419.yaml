            text: '华为将通过昇腾开源生态开发者计划发布超200项算子任务|华为_新浪财经_新浪网 新浪首页 新闻 体育 财经 娱乐 科技 博客 图片 专栏 更多 汽车 教育 时尚 女性 星座 健康 房产 历史 视频 收藏 育儿 读书 佛学 游戏 旅游 邮箱 导航 移动客户端 新浪微博 新浪新闻 新浪财经 新浪体育 新浪众测 新浪博客 新浪视频 新浪游戏 天气通 我的收藏 注册 登录 滚动新闻 > 正文 行情 股吧 新闻 外汇 新三板 华为将通过昇腾开源生态开发者计划发布超200项算子任务 华为将通过昇腾开源生态开发者计划发布超200项算子任务 2026年04月19日 21:58 上海证券报 新浪财经APP 缩小字体 放大字体 收藏 微博 分享 MD 微信 腾讯QQ QQ空间 来源：上海证券报·中国证券网 上证报中国证券网讯（记者 荆淮侨）华为常务董事、ICT BG CEO杨超斌4月19日在武汉表示，今年，华为将通过昇腾开源生态开发者计划发布200余项算子任务，并面向高校学生选拔超2000名优秀开发者并提供实习岗位。 当天，第十届华为ICT大赛中国总决赛在武汉落幕。杨超斌在会上表示，自2013年启动ICT学院项目以来，华为与全球2000多所高校建立合作，累计培养超百万实战型ICT人才。华为将持续搭建创新实践平台，推动高校培养方向与产业需求对接，助力更多ICT青年成长为技术骨干。 据介绍，本届大赛中国总决赛由华中科技大学与华为联合主办，重点设置了基于国产化算力平台的赛道，将模型迁移、算子开发等产业急需的“工程化”能力作为考核重点，解决“国产算力硬件已具备支撑大模型的能力，但软件生态与高校工程化培养相对滞后”的痛点。 在开源推理大模型赛题中，浙江大学、上海交通大学团队通过高效并行优化实现性能提升30%。创新赛环节，选手依托华为开源模型引擎及AI工具链，在模型精度仅损失1%的前提下，将端到端推理速度提升6倍。赛事主办方表示，相关成果也验证了“以赛促学”模式在解决真实工程问题上的价值。 海量资讯、精准解读，尽在新浪财经APP 文章关键词： 华为 开发者 ICT VIP课程推荐 加载中... APP专享直播 上一页 下一页 1 / 10 热门推荐 收起 新浪财经公众号 24小时滚动播报最新的财经资讯和视频，更多粉丝福利扫描二维码关注（sinafinance） 相关新闻 财经头条作者库 股市直播 图文直播间 视频直播间 最近访问 我的自选 01 / 牛弹琴：伊朗被激怒，印度遭了殃 02 / 原油市场再现“绝妙”押注 神秘空头卡点下单 一小时盈利7000万美元 03 / 哥伦比亚总统：美国若一意孤行将激起拉美国家“反抗” 04 / 最高增长3773.77%！A股业绩利好来了 05 / 美媒说特朗普召开会议讨论与伊朗谈判的问题 06 / 海南这个岛，何以成为全球消费“磁吸场”？ 07 / 新华时评｜警惕日本“新型军国主义”危险动向 08 / 数说“新”变化丨创历史新高！一组电力数据，看懂新疆一季度经济活力 09 / 趁春天还没走远 10 / 伊朗外交部说霍尔木兹海峡无条件过境通行“已成历史” 01 / 价格大涨650%，国产光纤全球爆单，年内诞生3只翻倍股 02 / 全线大跌，近18万人爆仓！以色列，发动袭击！ 03 / 000703，火了！迎超180家机构调研，一季度业绩大增3774%！ 04 / 斯坦福刚发布的报告把所有人吓到了，中美顶级AI模型性能差距只剩2.7%，两年前还是31.6% 05 / 券商前十座次重排！“两超多强”格局显现，两大业务成新关键赛道 06 / 603699，拟10股派10.3元！多只A股，公布分红预案 07 / 50分26秒！2026人形机器人半马冠军出炉，超人类世界纪录 08 / 分析：特朗普在战事上对外尽显强硬狂妄，内心却深陷恐惧挣扎 09 / 百家机构调研股曝光（附名单） 10 / 普林斯顿AI研究员曝DeepSeek V4将于下周发布 01 / 工业面粉商品报价动态（2026-04-18） 02 / 食用玉米淀粉商品报价动态（2026-04-18） 03 / 破乳剂 商品报价动态（2026-04-18） 04 / 明矾 商品报价动态（2026-04-18） 05 / 聚合氧化铝（PAC）商品报价动态（2026-04-18） 06 / 重质碳酸钡商品报价动态（2026-04-19） 07 / 六载消博 金融赋能 中国银行支持勾勒消费开放新图景 7X24小时 徐小明 凯恩斯 占豪 花荣 金鼎 wu2198 丁大卫 易宪容 叶荣添 沙黾农 冯矿伟 趋势之友 空空道人 股市风云 股海光头 杨伟民 曹中铭 ： 创业板迎来第四套标准 任泽平 ： 此轮牛市十年一遇 李庚南 ： PPI同比转正背后的喜与