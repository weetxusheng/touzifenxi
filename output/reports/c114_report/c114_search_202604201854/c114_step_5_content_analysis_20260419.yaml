          text: 'C114讯 北京时间4月19日晚间消息（蒋均牧）继2025年10月启动 招标 程序后， 欧盟 委员会近日决定向四家公司授予总计最高达到1.8亿欧元的资金支持，将在六年内拨付。此举旨在通过云服务来加强数字主权。 获得资助的企业包括卢森堡Post Telecom、德国StackIT、法国 运营商 Iliad旗下数据中心部门Scaleway以及比利时Proximus。欧盟正寻求增强区域内部能力，以减少对外国技术的依赖。 欧盟委员会表示：“招标支撑了委员会为强化自身主权而做出的更广泛努力，从而能够更有效地掌控各项关键技术和基础设施。” Post Telecom将与合作伙伴CleverCloud和OVHcloud协作，而Proximus则与泰雷兹（Thales）、谷歌云合资企业S3NS、Clarence以及法国 AI 先驱米斯特拉尔（Mistral）联手。 欧盟委员会解释称，供应商的选择，基于其与委员会“云主权框架”的契合程度——该框架从供应链透明度、安全性及技术开放性等八项个方面来衡量各供应商的主权水平。 委员会同时授予四份合同，以确保“多样性和韧性，避免过度依赖单一供应商”。 欧盟委员会强调，大规模使用欧盟云服务是提升欧盟数字主权的“先决条件”，并补充说，此次招标将鼓励整个行业遵守欧洲标准。 欧盟委员会负责技术主权、安全与民主事务的执行副主席汉娜·维尔库宁（Henna Virkkunen）在X平台上表示，这笔资助“使欧盟各机构、团体、办公室和代理机构能够采购主权云服务。扩大欧盟云的使用范围，是加强欧洲数字主权的关键。”'
