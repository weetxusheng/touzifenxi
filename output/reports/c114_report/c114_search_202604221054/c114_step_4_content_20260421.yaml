            content_summary: '光明网北京4月21日电 （记者 刘吉东）在21日举行的国新办新闻发布会上，工业和信息化部新闻发言人、信息通信发展司司长谢存表示，今年是“十五五”开局之年，信息通信基础设施建设取得积极进展，经济社会数智化转型底座持续夯实。 对此，工业和信息化部用三个“更”来概括当前成效。一是网络能力更强。截至3月底，全国5G基站总数已达495.8万个，具备千兆网络服务能力的10GPON端口数达3201万个。全国86'
            content_text: '光明网北京4月21日电 （记者 刘吉东）在21日举行的国新办新闻发布会上，工业和信息化部新闻发言人、信息通信发展司司长谢存表示，今年是“十五五”开局之年，信息通信基础设施建设取得积极进展，经济社会数智化转型底座持续夯实。 对此，工业和信息化部用三个“更”来概括当前成效。一是网络能力更强。截至3月底，全国5G基站总数已达495.8万个，具备千兆网络服务能力的10GPON端口数达3201万个。全国86个城市的168个小区、工厂和园区已开展万兆光网试点部署，5G演进网络（5G-A）覆盖330个城市。移动物联网蓬勃发展，终端用户达29.48亿户。 二是网络覆盖更广。截至目前，全国已实现“县县通千兆、乡乡通5G”，行政村100%通宽带、95%以上通5G，边境管理及贸易机构实现100%通4G/5G网络。全国26.9万个重点场所实现网络深度覆盖，65.4万公里公路铁路和316条地铁线路实现网络连续覆盖，广大人民群众正深切感受到网络覆盖带来的便利与提升。 三是网络应用更好。5G、千兆光网已融入97个国民经济大类中的91个，融合应用广度持续拓展。在医疗领域，5G应用实现从院前急救到康复出院的全流程覆盖，在500多家三甲医院落地推广；在教育领域，5G应用覆盖教、考、评、校、管全场景，在近3000所中小学、职业院校和高等院校落地部署，数字惠民成效日益彰显。 此外，在拓展未来布局与发展路径方面，工信部将全面落实国家“十五五”规划《纲要》部署，重点从三方面持续发力。一是扬优势，推进5G、千兆光网深度覆盖，持续开展“信号升格”专项行动，深化“宽带边疆”“宽带林草”建设。二是促升级，加快5G-A规模商用，有序开展万兆光网试点，推动“双千兆”向“双万兆”演进，加快移动物联网“万物智联”发展。三是抓协同，系统布局6G、下一代互联网等前沿技术研发，推动信息通信业与垂直行业协同创新，持续巩固提升我国信息通信业的竞争优势和领先地位。 [ 责编：赵鹏超 ] 视觉焦点 三亚盛妆迎第六届亚洲沙滩运动会'
            content_source: 'aliyun'
