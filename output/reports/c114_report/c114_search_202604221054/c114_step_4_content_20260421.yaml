            content_text: '液冷10倍股英维克“一字跌停”！一季度净利同比下降超80%，近两年净利润“含金量”持续下降|英维克_新浪财经_新浪网 新浪首页 新闻 体育 财经 娱乐 科技 博客 图片 专栏 更多 汽车 教育 时尚 女性 星座 健康 房产 历史 视频 收藏 育儿 读书 佛学 游戏 旅游 邮箱 导航 移动客户端 新浪微博 新浪新闻 新浪财经 新浪体育 新浪众测 新浪博客 新浪视频 新浪游戏 天气通 我的收藏 注册 登录 滚动新闻 > 正文 行情 股吧 新闻 外汇 新三板 液冷10倍股英维克“一字跌停”！一季度净利同比下降超80%，近两年净利润“含金量”持续下降 液冷10倍股英维克“一字跌停”！一季度净利同比下降超80%，近两年净利润“含金量”持续下降 2026年04月21日 20:01 每日经济新闻 新浪财经APP 缩小字体 放大字体 收藏 微博 分享 MD 微信 腾讯QQ QQ空间 每经记者｜章光日 每经编辑｜吴永久 4月20日晚，A股液冷龙头 英维克 发布了2026年一季报，净利润同比降幅超过八成，不及市场预期。而在4月20日，英维克股价还一度涨停，相较于2024年低点，公司股价最大涨幅超过11倍。而在发布一季报后的首个交易日，公司股价一字跌停，截至收盘，跌停板上的封单数量超过54万手。 《每日经济新闻》记者（以下简称每经记者）注意到，2026年一季度，英维克信用减值损失、资产减值损失、财务费用等均大幅增加，导致公司净利润大幅下滑。而过去两年，尽管英维克业绩增长较快，但公司净利润的“含金量”持续下降。不过，由于业绩增长，英维克股权激励计划连续两期行权条件达成。 英维克是业内领先的精密温控节能解决方案和产品提供商，致力于为数据中心/智算中心、算力设备、电化学储能系统、通信网络、电力电网、电动汽车充电桩、工业自动化、电源转换等领域提供设备散热解决方案及精密环境控制解决方案，为地铁、多种电动商用车等领域提供相关车用的空调、冷机等产品及服务，并为人居健康空气环境推出系列的空气环境机等产品。 最近两年，由于业绩好转，叠加液冷服务器、储能等热门概念加持，英维克的股价持续走牛。 同花顺 显示，2023年至2025年，公司营业收入从35.29亿元增长至60.68亿元，净利润从3.44亿元增长至5.22亿元。 以前复权方式计算，2024年2月份，英维克股价最低跌至9.85元，随后开启持续上涨之路。2026年4月20日，公司股价一度涨停，盘中最高涨至121.74元，刷新新高纪录。相较于2024年低点，英维克股价最大涨幅超过11倍。 不过，最近两年英维克的盈利质量持续下降，其净利润的“含金量”呈现下降趋势。同花顺数据显示，2023年至2025年，公司经营活动产生的现金流量净额分别为4.53亿元、2亿元和1.57亿元，连续两年下滑；应收票据及应收账款总额分别为17.61亿元、24.72亿元和31.25亿元，连续两年大幅增加。 4月20日晚，英维克发布了2026年一季报等多份公告。英维克2026年一季报显示，公司实现营业收入11.75亿元，同比增长26.03%；实现净利润865.76万元，同比降幅高达81.97%。英维克净利润的“含金量”仍在下降，2026年一季度，公司经营活动产生的现金流量净额为-3.86亿元，而去年同期为-1.71亿元。 在发布一季报后的首个交易日（4月21日），英维克股价一字跌停，截至收盘，跌停板上的封单数量高达约54.54万手。以收盘价108.97元计算，公司当前市值约为1065亿元，动态市盈率高达220.7倍，市净率也有30.77倍。 从利润表来看，财务费用大幅增加、信用资产减值损失、资产减值损失大幅增加等原因，共同造成英维克净利润大幅下滑。2026年一季度，公司财务费用为2006.38万元，而去年同期为-26.19万元，该数据大幅增加的主要原因系汇兑收益下降以及利息支出增加所致。 2026年一季度，英维克信用减值损失约为3015.72万元，而去年同期约为752.69万元。公司表示，该数据大幅变化的主要原因系应收账款计提坏账准备增加所致。 2026年一季度，英维克的资产减值损失约为724.15万元，而去年同期约为366.90万元。公司表示，该数据大幅变化的主要原因系存货跌价准备增加所致。 （图片来源：截图自英维克2026年一季报） 而过去两年，英维克信用减值损失和资产减值损失规模也较大。同花顺显示，2024年和2025年，英维克信用减值损失分别约为4868.68万元和9362.44万元，资产减值损失分别约为5373.17万元和7318.01万元。 2025年上半年，英维克海外营收占比仅10%，今年一季度汇兑收益为何会下降？公司是否有计划通过金融工具等方式减少汇兑变化对公司净利润的影响？在算力建设热潮下，液冷需求高增长，公司应收账款计提坏账准备和存货跌价准备计提为何还会大幅增长？公司是否为了扩大销售而放宽了信用政策，导致回款困难？每经记者将上述问题发送至英维克董秘办邮箱，但截至发稿，尚未收到回复。 4月20日晚，英维克还发布了关于2024年股票期权激励计划第二个行权期行权条件达成的公告。该公告显示，符合行权条件的激励对象共267名，可行权期权数量为709.80万份，占公司总股本比例为0.73%，行权价格为11.332元/份。 每经记者注意到，该激励计划第一个行权期的条件此前也已成就，对应可行权激励对象275名，可行权期权数量111.6960万份，占公司总股本比例为0.15%，行权价格为14.931元/份。相较于当前股价，英维克参与股权激励计划的员工可谓获利丰厚。 事后来看，英维克2024年激励计划设置的业绩考核目标并不算高。根据计划，行权考核年度为2024年至2026年，公司层面业绩考核以2023年净利润3.44亿元为基数，要求2024年、2025年、2026年的净利润增长率分别不低于15%、32%、52%，即对应年度净利润需分别达到约3.956亿元、4.54亿元和5.23亿元。 值得注意的是，英维克2025年净利润已达5.22亿元，已接近2026年的考核目标。若公司2026年净利润保持小幅增长，即可满足第三个行权期的业绩条件。 （图片来源：截图自英维克公告） 在一季度业绩“遇冷”情况下，2026年全年公司是否还有信心完成2024年股权激励的业绩考核目标？每经记者同样将这个问题发送至英维克董秘办邮箱，但截至发稿，也未收到回复。 封面图片来源：每经媒资库 海量资讯、精准解读，尽在新浪财经APP 文章关键词： 英维克 净利润 液冷 股价 资产减值 VIP课程推荐 加载中... APP专享直播 上一页 下一页 1 / 10 热门推荐 收起 新浪财经公众号 24小时滚动播报最新的财经资讯和视频，更多粉丝福利扫描二维码关注（sinafinance） 相关新闻 财经头条作者库 股市直播 图文直播间 视频直播间 最近访问 我的自选 01 / 美方已与古巴会谈，要求古巴引入“星链”、赔偿被没收资产的美国个人与企业、释放政治犯等 02 / 西班牙提案、意大利变脸、百万民众联署：欧洲对以色列态度加速转向 03 / 事关算电协同、6G，工信部最新发声！ 04 / 美伊停火协议明天到期，外交部：中方支持继续保持停火和谈判势头 05 / 苹果换帅！特努斯将接棒 CEO，库克转任董事会主席 06 / 国内成品油价今年来首次下调 加满一箱油将花少22元 07 / 至少26艘突破美军封锁！涉伊朗航运船，最新消息！ 08 / 日本通过内阁决议正式允许出口杀伤性武器 09 / 爱奇艺AI艺人库争议背后：为何要推进，如何保证演员和观众权益？ 10 / 高温与油荒“迎头对撞”？ 超级厄尔尼诺或成5月“灰犀牛” 01 / 凌晨，全线下跌！美伊谈判，突变！美国航母，曝出大动作！ 02 / 财经早报：美国拦截了一艘中国驶往伊朗的油轮？外交部回应，特朗普称新一轮谈判21日开始丨2026年4月21日 03 / 操盘必读：影响股市利好或利空消息_2026年4月21日_财经新闻 04 / 外资转向加仓中国资产 05 / 4月21日收盘：美股小幅收跌，市场关注美伊局势不确定性 06 / 马斯克无视法国检方传唤，科技巨头与欧洲裂痕再加深 07 / 多国政要密集访华，背后信号很大 08 / 全线飘红，多地价格突破10元，猪市风向变了 09 / 年报季透视A股： 逾1700家上市公司拟分红 10 / 股票私募连续四周加仓，满仓状态占比创近15周新高 01 / 储蓄佣金抽血不止，资产质量持续恶化——邮储银行2025年年报点评 02 / 管窥国有大行净息差：交行垫底 低成本负债“蓄水池”定胜负 03 / 估值不再猜，责任不再甩 万亿理财市场加速“拆暗箱” 04 / 4月以来银行理财规模及收益双回升，近1月年化收益率飙升142BP 05 / 多家银行理财机构加强信息披露 实现理财产品“三清” 06 / 甘肃银行分红方案引关注：去年净赚5.88亿，拟分红17.78亿 07 / 周亮被免去国家金融监督管理总局副局长职务 08 / 国有大行港股创新高，哪些资金在买入？ 09 / 17.78亿元！拟一口气分掉近三年净利润，甘肃银行终结六年零派息 10 / 3000亿特别国债注资5月启幕 国有大行再迎资本补强 7X24小时 徐小明 凯恩斯 占豪 花荣 金鼎 wu2198 丁大卫 易宪容 叶荣添 沙黾农 冯矿伟 趋势之友 空空道人 股市风云 股海光头 杨伟民 曹中铭 ： 如何提升业绩预告披露质量 洪偌馨 ： 给银行AI万亿投入算算账 盛松成 ： 人民币走向全球最佳时机 何大勇 ： 重塑软件