          content_text: 'IT之家 4 月 21 日消息，OpenAI 为其 Codex 应用推出了 Chronicle 功能，该功能通过屏幕录制构建记忆库，Codex 可将这些记忆作为后续任务的上下文参考，从而无需用户每次重新说明，就能知晓其所指内容、使用的工具以及正在进行的项目。 据IT之家了解，Chronicle 会在后台运行，由智能体将录制内容整理为摘要，并以 Markdown 文件格式保存在本地设备中。录制文件仅临时存储，据 OpenAI 说明，会在六小时后自动删除。 该功能目前以可选预览版形式，面向 macOS 系统的 ChatGPT Pro 订阅用户推出，但暂不面向欧盟、英国及瑞士地区开放。用户可在 Codex 设置的“个性化”选项中，依次开启“记忆”与“Chronicle”功能，并授予 macOS 屏幕录制与辅助功能权限即可启用。 OpenAI 同时提醒：Chronicle 会快速消耗调用额度，还会增加提示词注入攻击风险（恶意指令可能通过显示的网页植入），且记忆内容在设备上以未加密形式存储。 广告声明：文内含有的对外跳转链接（包括不限于超链接、二维码、口令等形式），用于传递更多信息，节省甄选时间，结果仅供参考，IT之家所有文章均包含本声明。'
