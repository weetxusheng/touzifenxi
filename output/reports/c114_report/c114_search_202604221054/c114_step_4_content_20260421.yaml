            content_text: '打击“囤积居奇”，工信部回应存储器价格上涨！还解答了这些热点问题|工信部_新浪财经_新浪网 新浪首页 新闻 体育 财经 娱乐 科技 博客 图片 专栏 更多 汽车 教育 时尚 女性 星座 健康 房产 历史 视频 收藏 育儿 读书 佛学 游戏 旅游 邮箱 导航 移动客户端 新浪微博 新浪新闻 新浪财经 新浪体育 新浪众测 新浪博客 新浪视频 新浪游戏 天气通 我的收藏 注册 登录 滚动新闻 > 正文 行情 股吧 新闻 外汇 新三板 打击“囤积居奇”，工信部回应存储器价格上涨！还解答了这些热点问题 打击“囤积居奇”，工信部回应存储器价格上涨！还解答了这些热点问题 2026年04月21日 13:16 每日经济新闻 新浪财经APP 缩小字体 放大字体 收藏 微博 分享 MD 微信 腾讯QQ QQ空间 每经记者｜周逸斐 每经编辑｜杜宇 4月21日， 国务院新闻办公室 举行新闻发布会，介绍2026年一季度工业和信息化发展情况。 《每日经济新闻》记者注意到，近期，存储器价格上涨引发手机终端产品价格调整，受到各界广泛关注。 在发布会现场， 工业和信息化部新闻发言人、信息通信发展司司长谢存 表示，针对这一问题， 工信部 将多措并举支持存储器产业发展，保障产业链供应链稳定。 “一方面，增强供给能力，促进供需对接，鼓励内外资企业加大投资力度，提升产出能力。支持终端企业与存储器企业加强互动对接，拓宽多元化供应渠道。另一方面，通过多种手段维护市场秩序，引导存储器企业加强渠道管理，配合相关部门依法打击‘囤积居奇’等扰乱市场行为。” 图片来源：每经记者 周逸斐 现场拍摄 我国一季度电子信息制造业开局良好，下一步 工信部 有哪些工作计划？ 谢存 表示，我国一季度规模以上计算机、通信和其他电子设备制造业增加值同比增长13.6%，在主要工业门类中增速第一。1—2月实现营业收入2.6万亿元，同比增长14.3%，较工业增速高9个百分点。一季度，部分产品产量实现两位数增长，集成电路产量同比增长24.3%。上游产品出口金额实现大幅攀升，集成电路、液晶平板显示模组出口金额同比分别增长72.9%、12.5%。 2026年以来， 工信部 持续推动电子信息制造业技术创新与融合应用。集成电路、新型显示、高端电子装备、电子材料等领域持续取得技术突破，三维存储技术取得新进展。终端产品应用多元拓展。 “新产品、新模式、新场景不断涌现。比如，彩电产品推出基于电视的大模型，在提升音画体验的同时可自动调节亮度，保护用户视觉健康；北斗定位进一步融入景区动态监测、商圈室内外导航等场景；音频技术优化升级，智能设备可在远距离、嘈杂环境下过滤噪音、听清人声。” 谢存 表示。 谢存 强调，下一步， 工信部 将重点做好几方面工作。一是深入落实稳增长行动方案，发挥重大项目撬动牵引作用，保持产业运行在合理区间。二是加快产业数字化转型与智能化升级，加快北斗、先进计算、人工智能终端等融合应用，大力挖掘和培育能源、汽车、医疗、教育、文旅、体育等新应用场景。 三是提升行业治理效能，深入整治“内卷式”竞争，坚决遏制低价低质竞争。四是壮大产业发展生态，持续推进国产操作系统和RISC-V架构（ 一种开放的指令集架构） 的适配，加快人工智能产业链上下游协同创新，不断完善电子信息技术产品标准体系。 今年一季度，我国装备工业整体运行态势如何？下一步重点工作是什么？ 工业和信息化部新闻发言人、运行监测协调局局长陶青 表示，我国 一季度装备工业开局良好，呈现“生产稳、投资升、出口强”三大特点。 一是生产增势平稳。一季度，装备工业增加值同比增长6.2%，对工业增长的贡献率达到19.4%。 二是主要行业投资回暖。一季度，装备工业中5个主要行业的固定资产投资均实现正增长，其中，铁路、船舶、航空航天和其他运输设备制造业，以及通用设备制造业同比分别增长27.7%和12.5%。 三是出口贡献突出。一季度，以人民币计价的装备制造业产品出口额同比增长19.2%，占出口总值的比重超过六成。 陶青 进一步指出，我国在装备工业的高端化、智能化发展方面的表现，可以概括为“三个持续”。 一是创新能力持续增强。全球首款侵入式脑机接口医疗器械获批上市，填补世界临床空白；国产点焊工业 机器人 在汽车焊装线首次实现批量应用；全球首台可实现五轴联动的中走丝线切割机床成功研制，加工效率显著提升。 二是高端产品持续增多。50万元以上乘用车中，国产品牌车型销量同比增长97%、市场占有率达到69.5%；第二艘国产大型邮轮“爱达·花城号”顺利出坞；全球最大打桩船“铁建大桥桩1”号完成交付。 三是智能化水平持续提升。装备工业已建成197家卓越级智能工厂，推动产品不良率平均下降48.4%、生产效率平均提升22.3%。1—2月，具备L2级组合驾驶辅助功能的乘用车新车渗透率达到69.15%，较去年同期提升10个百分点。也就是说，新销售的100辆乘用车中，就有超过69辆具备L2级组合驾驶辅助功能。 下一步， 工信部 将重点抓好三项工作。一是顶层设计。加快编制智能网联新能源汽车等 “十五五”规划 ，研究出台加快智能装备创新发展的指导意见。二是稳定运行。落实机械、汽车、电力装备等行业新一轮稳增长工作方案，持续推进设备更新和汽车以旧换新，以钉钉子精神规范产业竞争秩序。三是聚力攻关。持续实施装备工业重点产业链高质量发展行动，加强标志性产品攻关和成果推广应用。 封面图片来源：每经媒资库 海量资讯、精准解读，尽在新浪财经APP 文章关键词： 工信部 VIP课程推荐 加载中... APP专享直播 上一页 下一页 1 / 10 热门推荐 收起 新浪财经公众号 24小时滚动播报最新的财经资讯和视频，更多粉丝福利扫描二维码关注（sinafinance） 相关新闻 财经头条作者库 股市直播 图文直播间 视频直播间 最近访问 我的自选 01 / 美方已与古巴会谈，要求古巴引入“星链”、赔偿被没收资产的美国个人与企业、释放政治犯等 02 / 西班牙提案、意大利变脸、百万民众联署：欧洲对以色列态度加速转向 03 / 苹果换帅！特努斯将接棒 CEO，库克转任董事会主席 04 / 至少26艘突破美军封锁！涉伊朗航运船，最新消息！ 05 / 日本通过内阁决议正式允许出口杀伤性武器 06 / 港媒热议梁家辉五夺金像奖影帝 07 / 高温与油荒“迎头对撞”？ 超级厄尔尼诺或成5月“灰犀牛” 08 / 爱奇艺AI艺人库争议背后：为何要推进，如何保证演员和观众权益？ 09 / 事关算电协同、6G，工信部最新发声！ 10 / 美劳工部长查韦斯-德雷默将离任 因涉与工作人员存在不当关系遭调查 01 / 财经早报：美国拦截了一艘中国驶往伊朗的油轮？外交部回应，特朗普称新一轮谈判21日开始丨2026年4月21日 02 / 操盘必读：影响股市利好或利空消息_2026年4月21日_财经新闻 03 / 凌晨，全线下跌！美伊谈判，突变！美国航母，曝出大动作！ 04 / 外资转向加仓中国资产 05 / 多国政要密集访华，背后信号很大 06 / 4月21日收盘：美股小幅收跌，市场关注美伊局势不确定性 07 / 全线飘红，多地价格突破10元，猪市风向变了 08 / 股海导航_2026年4月21日_沪深股市公告与交易提示 09 / 马斯克无视法国检方传唤，科技巨头与欧洲裂痕再加深 10 / 4月20日增减持汇总：中科飞测等12股拟减持，暂无A股增持（表） 01 / 储蓄佣金抽血不止，资产质量持续恶化——邮储银行2025年年报点评 02 / 管窥国有大行净息差：交行垫底 低成本负债“蓄水池”定胜负 03 / 甘肃银行分红方案引关注：去年净赚5.88亿，拟分红17.78亿 04 / 4月以来银行理财规模及收益双回升，近1月年化收益率飙升142BP 05 / 估值不再猜，责任不再甩 万亿理财市场加速“拆暗箱” 06 / 多家银行理财机构加强信息披露 实现理财产品“三清” 07 / 周亮被免去国家金融监督管理总局副局长职务 08 / 高盛称沪深楼市或2026年底触底，银行房贷数据仍待修复 09 / 最高法披露：南京银行原行长的4.8亿元“金融魔术” 10 / 2025银行年报观察室｜国有大行净息差谁的“血条厚”：邮储领跑，交行垫底 7X24小时 徐小明 凯恩斯 占豪 花荣 金鼎 wu2198 丁大卫 易宪容 叶荣添 沙黾农 冯矿伟 趋势之友 空空道人 股市风云 股海光头 杨伟民 盛松成 ： 人民币走向全球最佳时机 何大勇 ： 重塑软件工程未来 李德林 ： 一毛不拔，老板赢麻了 程实 ： 油价冲击的多维传导 管涛 ： 经济起步有力、金融平稳运行 交易提示 操盘必读 证券报 最新公告 限售解禁 数据中心 条件选股 券商评级 股价预测 板块行情 千股千评 个股诊断 大宗交易 财报查询 业绩预告 ETF期权 类余额宝 基金净值 基金对比 基金排名 商品行情 外盘期货 商品持仓 现货报价 CFTC持仓 期指行情 期指持仓 期指研究 行业指数 权重股票 期货名人 专家坐堂 高清解盘 期货入门 各国国债 期市要闻 期货研究 机构评论 品种大全 外汇计算器 人民币牌价 中间价 美元指数 直盘行情 所有行情 美元相关 人民币相关 交叉盘 拆借利率 货币分析 机构观点 经济数据 专家坐堂 分析师圈 国债收益率 全球滚动 CFTC持仓 比特币 外汇计算器 黄金资讯 白银分析 实物金价 ETF持仓 黄金TD 白银TD 金银币 专家坐堂 基础知识 现货黄金 现货白银 现货铂金 现货钯金 高清解盘 黄金吧 白银吧 黄金分析 CFTC持仓 叶檀 凯恩斯 曹中铭