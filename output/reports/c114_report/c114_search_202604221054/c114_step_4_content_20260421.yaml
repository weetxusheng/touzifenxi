          content_summary: 'C114讯 4月21日消息（颜翊）今日上午，国新办举行新闻发布会介绍2026年一季度工业和信息化发展情况。会上，工业和信息化部新闻发言人、信息通信发展司司长谢存介绍了我国一季度电子信息制造业整体发展情况和下一步的工作重点。 谢存表示，一季度电子信息制造业开局良好，今年有望延续增长态势。一季度规模以上计算机、通信和其他电子设备制造业增加值同比增长13.6%，在主要工业门类中增速第一。1—2月实现营业'
          content_text: 'C114讯 4月21日消息（颜翊）今日上午，国新办举行新闻发布会介绍2026年一季度工业和信息化发展情况。会上，工业和信息化部新闻发言人、信息通信发展司司长谢存介绍了我国一季度电子信息制造业整体发展情况和下一步的工作重点。 谢存表示，一季度电子信息制造业开局良好，今年有望延续增长态势。一季度规模以上计算机、通信和其他电子设备制造业增加值同比增长13.6%，在主要工业门类中增速第一。1—2月实现营业收入2.6万亿元，同比增长14.3%，较工业增速高9个百分点。一季度，部分产品产量实现两位数增长，集成电路产量同比增长24.3%。上游产品出口金额实现大幅攀升，集成电路、液晶平板显示模组出口金额同比分别增长72.9%、12.5%。 2026年以来，工信部持续推动电子信息制造业技术创新与融合应用。创新成果不断涌现。集成电路、新型显示、高端电子装备、电子材料等领域持续取得技术突破，三维存储技术取得新进展。终端产品应用多元拓展。新产品、新模式、新场景不断涌现，比如，彩电产品推出基于电视的大模型，在提升音画体验的同时可自动调节亮度，保护用户视觉健康；北斗定位进一步融入景区动态监测、商圈室内外导航等场景；音频技术优化升级，智能设备可在远距离、嘈杂环境下过滤噪音、听清人声。 下一步，工信部将重点做好以下工作：一是深入落实稳增长行动方案，发挥重大项目撬动牵引作用，保持产业运行在合理区间。 二是加快产业数字化转型与智能化升级，加快北斗、先进计算、人工智能终端等融合应用，大力挖掘和培育能源、汽车、医疗、教育、文旅、体育等新应用场景。 三是提升行业治理效能，深入整治“内卷式”竞争，坚决遏制低价低质竞争。四是壮大产业发展生态，持续推进国产操作系统和RISC-V架构的适配，加快人工智能产业链上下游协同创新，不断完善电子信息技术产品标准体系。 近期存储器价格上涨引发手机终端产品价格调整，受到各界广泛关注，针对这一问题，工信部将多措并举支持存储器产业发展，保障产业链供应链稳定，一方面，增强供给能力、促进供需对接，鼓励内外资企业加大投资力度，提升产出能力。支持终端企业与存储器企业加强互动对接，拓宽多元化供应渠道。另一方面，通过多种手段维护市场秩序，引导存储器企业加强渠道管理，配合相关部门依法打击“囤积居奇”等扰乱市场行为。'
