          content_summary: 'C114讯 4月21日消息（颜翊）今日上午，国新办举行新闻发布会介绍2026年一季度工业和 信息化 发展情况。工业和信息化部副部长张云明表示，今年以来，工业和信息化部全面落实全国两会工作安排，积极会同各地区、各部门靠前发力、主动作为，一季度，工业和信息化发展总体实现良好开局。 一是工业经济运行稳中有进，发展动力进一步增强。积极发挥“两重”“两新”等政策合力，指导各地加大政策落地和工作落实力度。一季'
          content_text: 'C114讯 4月21日消息（颜翊）今日上午，国新办举行新闻发布会介绍2026年一季度工业和 信息化 发展情况。工业和信息化部副部长张云明表示，今年以来，工业和信息化部全面落实全国两会工作安排，积极会同各地区、各部门靠前发力、主动作为，一季度，工业和信息化发展总体实现良好开局。 一是工业经济运行稳中有进，发展动力进一步增强。积极发挥“两重”“两新”等政策合力，指导各地加大政策落地和工作落实力度。一季度，规模以上工业增加值同比增长6.1%，31个省份全部实现正增长，行业增长面超八成，工业对经济增长的贡献率近四成。推进数字产业发展壮大，加快新型信息基础设施布局建设，电信业务总量一季度同比增长8.3%、增速较去年同期提高0.6个百分点，软件和信息技术服务业业务收入1—2月同比增长11.7%、增速较去年同期提高1.8个百分点。 二是产业科技创新走深走实，增长潜力进一步激发。推动科技创新和产业创新深度 融合 ，促进创新成果加快转化为现实生产力。截至目前，已遴选首批国家级制造业中试平台21家、卓越级科技型企业孵化器14家，搭建起从“实验室”到“生产线”的畅通桥梁。一季度，面向传统产业升级、新兴产业壮大、未来产业布局，发布行业标准304项，规模以上高技术制造业增加值同比增长12.5%。 人工智能 等新技术在电子、消费品行业应用加速拓展，无人机、 AI 眼镜等终端产品日益丰富，工业机器人、集成电路等产品产量同比分别增长33.2%、24.3%。 三是先进制造业步伐加快，产业活力进一步释放。持续推进产业结构优化，规模以上装备制造业占工业增加值比重较去年同期提高1.4个百分点。发布首批16个创建国家新型工业化示范区城市名单，国家高新区总数达179家。加力推动制造业智能化升级，完成37个智能制造系统解决方案“揭榜挂帅”项目验收，新发布智能制造国家标准7项、行业标准2项。着力引导工业领域节能降碳，开展氢能综合应用试点，新发布绿色工厂2038家、绿色工业园区128家，全国规模以上工业单位增加值能耗持续下降。 四是惠企服务提质增效，企业实力进一步壮大。完善优质企业梯度培育体系，印发《优质中小企业梯度培育管理办法》，开展“优企进校 招才引智”、中小企业人才服务等专项行动，加快加力清理拖欠企业账款。持续规范重点产业竞争秩序，深入整治汽车行业 网络 乱象，督促企业严格落实60天账期承诺。持续深入推进产能预警调控、规范价格竞争、加强产品质量监管等工作，新能源汽车、光伏等行业竞争秩序持续改善，光伏组件、碳酸锂、动力型磷酸铁锂等产品价格总体回升。 当前外部环境不确定性上升，但我国产业体系全、产业韧性强、市场规模大，工业经济平稳向好的基本面不会改变。下一步，我们将坚持稳中求进工作总基调，统筹国内国际两个大局，更好统筹发展和安全，着力稳增长、强创新、促融合、优治理、防风险，不断提升工业经济运行质效，实现“十五五”良好开局。 版权说明：C114刊载的内容，凡注明来源为“C114通信网”或“C114原创”皆属C114版权所有，未经允许禁止转载、摘编，违者必究。对于经过授权可以转载我方内容的单位，也必须保持转载文章、图像、音视频的完整性，并完整标注作者信息和本站来源。编译类文章仅出于传递更多信息之目的，不代表证实其描述或赞同其观点；翻译质量问题 请指正 。'
