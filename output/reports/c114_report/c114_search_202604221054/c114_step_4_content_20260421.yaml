            published_at: '2026-04-21'
            content_title: '股价新高后一字跌停!液冷龙头英维克Q1净利大降82%,采购扩产步伐加速'
            content_summary: '在股价创下历史新高的当晚，液冷大牛股新鲜出炉的业绩成为火热市场的“冷却剂”。 4月20日晚间，液冷龙头英维克（002837.SZ）披露了2025年年报和2026年一季报。公告显示，英维克2025年实现营业收入60.68亿元，同比增长32.23%；归母净利润5.22亿元，同比增长15.30%，延续了十余年双增长态势。 从产品来看，机房温控节能产品营收为34.48亿元，同比增长41.28%，不仅撑起英'
            content_text: '在股价创下历史新高的当晚，液冷大牛股新鲜出炉的业绩成为火热市场的“冷却剂”。 4月20日晚间，液冷龙头英维克（002837.SZ）披露了2025年年报和2026年一季报。公告显示，英维克2025年实现营业收入60.68亿元，同比增长32.23%；归母净利润5.22亿元，同比增长15.30%，延续了十余年双增长态势。 从产品来看，机房温控节能产品营收为34.48亿元，同比增长41.28%，不仅撑起英维克业绩的半壁江山，同时也成为公司最赚钱的单品——毛利率同比增长至28.36%；其次是机柜温控产品收入19.77亿元，同比增长15.30%，但由于收入的区域组合变化，该产品毛利率下滑至27.24%。 从地区来看，英维克2025年境外收入8.49亿元，同比增长28.70%；毛利率达52.64%，显著高于境内的23.83%，海外高毛利业务扩张贡献结构性优化。 然而在2025年仍营利双增的情况下，2026年一季度却出现营收增长、净利下滑的情况。 财报显示，英维克2026年第一季度营收同比增长26.03%至11.75亿元，归母净利润同比下滑81.97%至865.76万元；若与2025年第四季度数据相比，则出现营收、归母净利润分别环比下滑42.43%，92.95%。 从具体财务数据来看，英维克一季度净利大幅下滑的背后，是财务费用、信用和资产减值损失、税金及附加等多个因素影响。 其中变化最大的是财务费用，2026年一季度同比增长7761.24%至2006.38万元，主要原因系报告期汇兑收益下降以及利息支出增加所致；而由于应收账款计提坏账准备增加以及存货跌价准备计提增加，英维克的信用、资产减值损失，分别为-3015.72万元、-724.15万元，均同比大幅增加。 消息一出，液冷概念板块迎来了一场“急速降温”。在股价触及历史新高的第二天（4月21日），英维克开盘一字跌停，报收108.97元/股，仍有55.62万手封板，跌停封单额达59.43亿元。Wind数据显示，同日液冷服务器指数（8841247.WI）收于4632.25点，跌幅2.33%，成分股方面，佳力图（603912.SH）、高澜股份（300499.SZ）、飞龙股份（002536.SZ）等跌超5%。 值得注意的是，虽然净利大幅下滑，但英维克在今年一季度的材料采购款不断增加，扩产步伐也未曾暂停。 财报显示，截至一季度末，其预付款项期末余额为3361.69万元，较年初增长46.36%；在建工程期末余额为3.22亿元，较年初增长超20%。也因为机器设备和建设工程投入增加，英维克当期投资活动产生的现金流量净流出扩至1.58亿元，同比增长348.82%。 根据2025年年报，英维克主要有4个重要在建工程，其中精密温控节能设备华南总部基地的工程进度已达100%，而英维克精密温控节能设备中原总部基地、华南总部基地三期、研发中心及生产基地（深圳）仍在建设中，分别已投入2.61亿元、433.70万元、255.13万元，工程进度为90.92%、2.91%、0.46%。 对于2026年的经营计划，英维克提到，以中山、苏州、郑州等国内基地，泰国、美国等海外基地为依托，在液冷智算中心和液冷服务器两个领域加大拓展力度，迎接AI基础设施的建设热潮。持续拓展海外AI液冷算力市场，积极展开与全产业链主流客户的合作，实现业务规模落地。 事实上，随着算力需求的增长，液冷的市场空间正在获得更多确定性。华源证券发布研报称，液冷架构、系统价值量随芯片功率、机柜架构而变化，2025年出货的GB200、GB300计算托盘采用85%液冷和15%风冷的混合散热方式，预期2026年开始出货的VeraRubinNVL72计算托架将采用100%液冷散热，而RubinUltra及Feynman功率会更高，海外有望逐步进入全液冷时代。 据中商产业研究院数据，中国液冷服务器渗透率2021~2025年从不足3%快速突破至20%，2026年随着AI算力爆发和GB200等强制液冷方案落地将跃升至37%，此后进入高速增长期，预计2027年突破50%临界点。 “实现2027年渗透率突破50%的主要瓶颈，已从早期的技术可行性转向存量改造的工程复杂度与供应链交付毛利的博弈。”止于至善投资基金经理何理在接受时代财经采访时表示，英维克近期的业绩揭示了一个行业痛点，虽然GB200等高端AI算力强制要求液冷，但大规模交付初期的研发打样成本极高，且既有风冷机房在承重、管路排布及冷却液防泄漏方面的改造投入巨大，导致订单转化利润的周期拉长。 何理指出，AI服务器虽是（液冷）核心驱动力，但并非唯一。边缘计算、超算中心及高功率密度储能电站同样存在刚性需求。未来非AI的规模化应用引爆点，可能出现在储能液冷温控与通信基站的深度融合。随着储能单体容量迈向5MWh以上，液冷已成为提升系统安全性的标配，这种从计算端向能源端的技术外溢，将成为支撑行业长期增长的第二极。 但不论行业发展瓶颈如何，AI服务器、储能等下游市场爆发切切实实给液冷市场带来过无限遐想空间。Wind数据显示，截至4月20日，液冷服务器指数成份市盈率（TTM）为67.34倍，处于近三年来的历史高位。 何理表示，在当前液冷板块高PE背景下，最大的预期差在于市场低估了从非标定制向标准化量产过渡的阵痛期。英维克的业绩反映出，市场此前过度乐观地估计了短期业绩弹性，忽略了在技术快速迭代期，产业链龙头为保住市场份额而投入的巨额研发费用，以及大客户压价对毛利空间的挤压。 “未来板块估值上修因素主要关注头部厂商在GB200大规模交付后的毛利率修复情况。如果能通过模组化生产降低单位成本，证明其具备将技术溢价转化为财务报表的能力，估值将获得支撑。下修压力核心在于业绩兑现的一致性。如果类似英维克的利润不及预期成为行业普遍现象，或者风冷改良方案如高性能3D散热器截流了部分中低端AI算力需求，市场对高增长的确定性将产生动摇。尤其要警惕增收不增利的逻辑被坐实，这可能引发板块从主题投资向价值回归的剧烈波动。”何理说。'
            content_source: 'aliyun'
            fetch_status: 'success'
