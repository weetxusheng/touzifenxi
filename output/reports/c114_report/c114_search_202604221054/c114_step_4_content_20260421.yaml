          domain: 'www.c114.com.cn'
          content_title: '专访中信科移动王震：突围卫星互联网 赋能6G价值共创 - 卫星通信 — C114通信网'
          content_summary: '专访中信科移动王震：突围卫星互联网 赋能6G价值共创,C114讯 4月21日消息（岳明）本周，由未来移动通信论坛、紫金山实验室共同主办的2026全球6G技'
          content_text: 'C114讯 4月21日消息（岳明）本周，由未来 移动通信 论坛、紫金山实验室共同主办的2026全球 6G 技术与产业生态大会在南京拉开帷幕。大会以“极致连接·智能 融合 ·场景共创·产业共赢”为主题，围绕6G前沿技术突破、产业生态构建与应用场景探索，推动6G从实验室走向产业生态。&nbsp; 在大会现场，作为 中国信科 集团旗下无线移动通信产业的主导企业，中信科移动集中展示了多项6G技术研究及验证的最新成果，积极推动产业界与学术界的深度融合。中信科移动创新中心副总经理王震在接受C114采访时表示，中信科移动通过持续的技术攻关与协同创新，赋能未来6G 网络 的智能内核与全域能力，推动产业共识形成，构建开放、统筹、高效的创新生态。 技术预研与标准制定同时发力 当前，全球6G研究从“愿景需求定义”进入“关键技术收敛和预标准化”阶段。 在关键技术方面，王震表示，中信科移动当前重点布局星地融合、超维度 天线 、以用户为中心、内生智能等多个6G方向，目前已累计申请6G专利超1500项，牵头发布9本6G技术白皮书。在开展6G技术研究工作同时，中信科移动也同步打造了以用户为中心的端到端6G技术验证平台，先后完成了智能超表面、U6G频段超大规模天线、内生智能等多项6G技术的试验验证。 全球统一的6G标准是业界关注的重点。王震指出，中信科移动在国际通信标准领域扮演着重要角色，是 3G （TD-SCDMA）标准的发起者，也是 4G 和 5G 标准的关键贡献者。中信科移动自2019年就启动 了6G预研工作，始终立足国家战略，聚焦 “技术引领、标准主导、产业突破、生态构建”，全面推进 6G 研发、标准、专利、试验、产业化工作。 在国际电信联盟（ ITU ）中，中信科移动技术专家长期担任ITU-R无线技术评估组主席，主导了5G标准的制定，并正在6G技术性能要求（TPR）的定义中发挥关键作用。在国际标准组织 3GPP 中，中信科移动作为核心贡献者，先后领导了30多个项目，目前专注于“以用户为中心”的6G网络设计，推动以统一星地设计为特色的6G解决方案。 业界普遍预期，2030年6G将会走向正式商用。但产业链也在探索将部分6G潜在关键技术在5G网络中进行应用，帮助 运营商 提升现网性能，降低运维成本。王震告诉C114，中信科移动积极推进6G 关键技术的实用化发展，重点推进星地融合、通感一体、内生智能、智能超表面等技术在现有通信系统中应用，支撑现有移动通信系统能力增强，持续赋能千行百业的数字化发展。 突围 卫星互联网 赋能6G价值共创&nbsp; 当前通信行业正站在一个关键的十字路口，5G商用发展距离实现当初的预期目标还有一定差距。对于运营商而言，6G将不仅仅是通感算智深度融合，更是探索商业模式 转型 的新契机。 王震表示，6G 将从单纯“连接驱动”转向 “连接、算力、智能、感知”等融合的综合服务能力，商业模式将更强调价值共创。 目前产业界正在积极探索6G新应用、新业务、新模式，希望增加新的应用场景，如星地融合、通智融合、通感融合，提升未来6G网络的盈利能力。这要求6G研究不仅仅局限于技术自身研究，还需通过研究掌握6G新型应用、新型业态的发展规律，搭建6G试验网络开展6G新型应用研究与商业探索，构建在6G新应用、新业态商业闭环中的独特优势，为6G商业化提前布局。 比如在备受市场关注的卫星 互联网 领域，中信科移动在全球率先提出“5G体制兼容、6G系统融合”的星地融合发展路径，现已成为我国卫星互联网战略发展的主要技术路线之一。据王震介绍，自3GPP&nbsp;R18开始，中信科移动就代表中国首次牵头NTN立项，在网络架构、无线传输等核心领域，累计牵头23项立项，全球排名第一。 王震表示，中信科移动已构建空天地海一体化完整解决方案，已完成星载 基站 、星载相控阵天线、地面信关站、专用终端及 测试 仪表等全系列产品研发，实现NR-NTN 手机 直连卫星等关键技术突破，并完成了星地联试验证。中信科移动将围绕“天上卫星、地面网络、行业应用”协同推进，进一步强化卫星互联网系统能力建设，积极服务国家卫星互联网建设需求，持续巩固和提升核心产品供应能力。 在采访最后，王震强调，中信科移动始终坚持与运营商、行业伙伴、终端厂商深度协同，聚焦 低空经济 、工业互联、应急通信、沉浸式媒体等场景打造可落地方案，通过标准共研、联合研发、生态共建，推动网络能力与行业需求的精准匹配，构建可运营、可复制、可持续的6G商业模式，实现产业链的可持续发展和共赢。 C114中国通信网版权说明：凡注明来源为“C114通信网”的文章皆属C114版权所有，除与C114签署内容授权协议的单位外，其他单位未经允许禁止转载、摘编，违者必究。如需使用，请联系021-54451141（汪先生）。其中编译类仅出于传递更多信息之目的，系C114对海外相关站点最新信息的翻译稿，仅供参考，不代表证实其描述或赞同其观点，投资者据此操作，风险自担；如有翻译质量问题 请指正 。 给作者点赞 0 VS 0 写得不太好'
