            content_title: '总规模33.12亿元！南京6G产业链基金群亮相，资本助力打造“6G之城”'
            content_summary: '4月21日，2026全球6G技术与产业生态大会在南京启幕。在全球移动通信产业迈入6G技术探索向标准制定、产业孵化跨越的关键节点，这场汇聚全球产学研用各方力量的行业盛会，成为观察全球6G发展走向的核心窗口。 6G告别移动通信代际升级的“速率竞赛”，核心指标完成理性收敛，锚定可商用、可创造价值的产业真实需求；全球6G标准化进入中期，首个完整标准预计两年左右完成；国内首个覆盖9000平方公里的Pre6G'
            content_text: '4月21日，2026全球6G技术与产业生态大会在南京启幕。在全球移动通信产业迈入6G技术探索向标准制定、产业孵化跨越的关键节点，这场汇聚全球产学研用各方力量的行业盛会，成为观察全球6G发展走向的核心窗口。 6G告别移动通信代际升级的“速率竞赛”，核心指标完成理性收敛，锚定可商用、可创造价值的产业真实需求；全球6G标准化进入中期，首个完整标准预计两年左右完成；国内首个覆盖9000平方公里的Pre6G试验网落地南京，总规模33.12亿元的6G产业链基金群同步亮相，全球6G产业正加速从愿景走向产业现实。 6G告别“速率竞赛”锚定产业真实需求 过去移动通信代际升级，始终伴随着“十年一代、峰值速率千倍提升”的行业认知，而6G的演进，正在打破这一传统路径。 “6G曾经设想峰值速率为5G的百倍，国际电信联盟（ITU）已明确6G相对5G约提升20倍，相对5G—A仅2倍。体验速率方面，6G也曾经设想体验速率为1—10Gbps（千兆比特每秒），现ITU已明确6G体验速率为300—500Mbps+（‌兆比特每秒），相对5G约提升3—5倍，相对5G—A仅0.3—0.5倍。”中国工程院院士邬贺铨在大会上直言，6G正实现从“高速连接管道”向“原生智慧平台”的范式跃迁。 在邬贺铨看来，行业对6G的期待，正从“极限性能”收敛到“可商用、可落地、成本可控”的现实维度。但这并不意味着6G的技术升级打了折扣，他同时强调，6G的时延、定位精度与能效指标相较5G仍有十到百倍的改进空间，“6G更看重的是频效、能效、安全性、网络可运维性，最终要构建可持续的产业生态”。 这一理性转向，也是全球6G行业在实践中不断校准方向的必然结果。中国通信标准化协会（CCSA）理事长闻库接受包括证券时报在内的媒体采访时表示，当前行业最终确定的6G核心指标，与6G研发初期的设计指标已有显著差异，这正是全球行业在实践中不断贴合产业实际、网络现状与应用需求，逐步把技术方向“摸实”的过程。 围绕6G的核心技术能力，全球业界已形成多项基础共识。邬贺铨介绍，在载波带宽上，U6G（Upper6GHz）作为6G早期商用主力频段，基站最大400MHz信道带宽已形成共识；太赫兹频段锁定0.1—10THz（太赫兹），可支持100Gbps+超高速率；通感一体成为6G必选基础能力，可通过同一信号同时实现通信与测距、测速、定位、环境感知；NTN非地面网络纳入6G基础架构，实现地面、无人机、卫星的无差别接入与无缝切换；网络内生智能成为重要方向，数据与智能面将作为独立逻辑面，与控制面、用户面平等交互。 与此同时，6G标准化进程中仍有多项议题存在行业争议。邬贺铨指出，在6G前传接口开放、空口波形选择、基于GPU的RAN（无线接入网）架构、算力集中部署模式、云原生核心网的演进路径等关键问题上，全球产业界仍存在不同的技术路线分歧，而这些争议的最终收敛，也将决定6G标准的最终形态与产业落地节奏。 开放合作仍是6G全球发展的主线 作为连接技术与产品的桥梁，标准是移动通信技术实现规模化、规范化应用的基准，也是6G从实验室走向产业落地的前提。 中国在全球6G标准化进程中，始终坚持与全球行业同频共振、双向互动。闻库介绍，协会的工作分为两大方向：一是携手韩国、日本、美国、欧洲、印度等国家和地区的其他发起方，共同推动全球统一6G标准的制定，持续加大对国际标准组织运作的贡献力度；二是搭建国内产业主体参与国际标准制定的重要通道，依托数百家涵盖企业、高校、运营商的全产业链会员单位，将国内的技术创新成果提交至3GPP，推动国内技术成果转化为国际标准，同时将国际上形成共识的技术成果引入国内，搭建演示实验网开展技术验证，再将发现的问题反馈至国际标准组织优化完善。 中国科学院院士尤肖虎也表示，当前全球6G标准化工作已进入中期阶段，首个完整6G标准预计两年左右完成。我国6G领域坚持技术研发与标准研究同步推进的工作路径，待6G标准正式落地后，配套的示范系统、演示验证系统将快速部署。 Pre6G开启6G落地新周期 当6G标准仍在全球协同推进的过程中，产业界已通过先行先试的技术验证，开启了6G落地的探索之路，而南京落地的国内首个Pre6G试验网，正是这一进程中的标志性成果。 据了解，该Pre6G试验网依托无蜂窝大规模MIMO（多入多出技术）、光子太赫兹实时传输、确定性无线接入、通感一体、DOICT超融合等6G核心技术，已在紫金山科技城、江苏电视塔、江心洲等区域部署64个Pre6G节点，累计覆盖面积达9000平方公里，在5G网络中融入6G创新技术，相关能力可达5G的10倍，目前已在低空巡检、工业制造、具身智能、全息通信等领域开展系统性验证。 “Pre6G的核心含义，是超前预研的试验网络。”闻库表示，这类试验网的核心定位，是将6G潜在关键技术整合搭建为统一的技术平台，加载多场景、多环境下的应用需求，验证相关技术能否满足6G的场景化指标要求。 在尤肖虎看来，Pre6G试验网的价值，在于实现了“6G技术5G化”。“这套网络可以完全兼容接入现有的5G终端，一方面通过6G技术的注入，通过6G技术的注入，网络的容量、时延、可靠性等指标可能会有非常大的提升；另一方面也完成了通感融合、通智融合、天地融合等多维度的技术融合，搭建起能够支撑多元化应用场景创新的底层平台。” 更重要的是，这一试验网打造了完全开放的技术平台，打破了过去移动通信领域只有大型龙头企业才能参与技术创新的壁垒。尤肖虎介绍，该平台为开发者提供了完整的研发验证环境，配套了终端、网络与开发平台，并全面开放接口，开发者有新的场景创意，即可在环境中快速完成实验与验证，中小企业、创业团队乃至个人开发者，都能便捷地参与到6G应用创新与生态建设中。 6G应用场景的落地，始终遵循着价值导向的核心逻辑。本次大会上同步发布的6G十大典型应用场景，涵盖低空经济、工业制造、应急救援、智慧海洋、具身智能等领域，相关场景已在南京大胜关大桥、连云港海域、沈海高速如皋段等地开展实地验证。 产业生态的构建，也离不开资本的助力。本次大会上，总规模达33.12亿元的南京市6G未来产业链基金群正式亮相，将精准聚焦6G核心技术攻关、优质企业培育、场景融合应用、高端人才引育等核心方向，全方位助力南京打造“6G之城”。 对于产业未来的发展节奏，尤肖虎给出预判：目前6G产业培育已进入前期布局阶段，产业发展正从概念验证环节，逐步迈向技术应用落地的关键周期，6G手机的商用落地预计在2029—2030年即可实现。“6G将再次深刻改变人类的生产方式与生活方式。”'
