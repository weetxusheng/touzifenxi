          content_text: 'C114讯 4月21日消息（颜翊）昨日， 紫光 国微发布了2025年年度报告。报告期内，公司实现营业收入61.46亿元，较上年同期增长11.52%；实现归属于上市公司股东的净利润14.37亿元，较上年同期增长21.86%。 截至2025年12月31日，公司总资产为189.47亿元，较年初增长9.39%；公司归属于上市公司股东的净资产为137.37亿元，较年初增长10.83%。 报告期内，公司集成电路销售量较上年同比下降9.63%。从业务构成看，特种集成电路销售量同比增加49.08%，主要系下游需求有所回升，订单增加所致；智能安全芯片销售量同比下降9.7%，主要系上年度合并范围包含北京紫光青藤微系统有限公司在处置出表前的销售量，剔除该因素后，销售量基本持平。 同时，公司电子元器件业务下游新兴领域市场蓬勃发展，市场需求大幅增长，同时公司以销定产，实现产销量大幅提升。 研发投入方面，公司持续强化科技赋能，巩固行业领先优势。全年研发投入15.09亿元，占营业收入比例24.56%；全年取得发明专利52 项，实用新型专利17 项。 报告期内，公司高度重视市值维护，积极开展资本运作，持续提升信息披露质量，主动加强与广大投资者的互动交流，充分展示企业竞争优势和长期发展前景。期间，公司完成 2.00 亿元股份回购及 1.77 亿元现金分红，顺利推出 2025 年股票期权激励计划并完成首次授予登记；同时筹划发行股份及支付现金购买资产并募集配套资金暨关联交易事项。 报告期内，公司全面梳理并优化业务体系与管理体系，进一步聚焦核心主业、优化资源配置、调整组织结构、提升管理效率，更好地服务公司战略。期间，公司完成唐山捷准芯测信息科技有限公司注销；新设上海紫光同芯、锐视特、成都紫光同芯及紫光同芯科技，支持重点业务发展并积极开拓新的增长方向。同时，公司进一步梳理管理总部的职责定位，调整部门设置和人员配置，新设中央研究院，撤销战略规划部、投资管理部并设立战略投资部，撤销信息技术部，持续优化管理与审批流程，推动公司整体运营能力不断提升。'
