          content_title: '工信部谢存：我国累计建设2.5万余个“5G+工业互联网”项目'
          content_summary: 'C114讯 4月21日消息（颜翊）今日上午，国新办举行新闻发布会介绍2026年一季度工业和信息化发展情况。会上，工业和信息化部新闻发言人、信息通信发展司司长谢存介绍了我国“5G+工业互联网”典型应用场景的规模化推广进展和下一步的工作重点。 谢存表示，今年《政府工作报告》提出，打造“5G+工业互联网”升级版。工信部持续推动“5G+工业互联网”规模化发展，全面完成5G工厂“百千万”行动目标。推动基础电'
          content_text: 'C114讯 4月21日消息（颜翊）今日上午，国新办举行新闻发布会介绍2026年一季度工业和信息化发展情况。会上，工业和信息化部新闻发言人、信息通信发展司司长谢存介绍了我国“5G+工业互联网”典型应用场景的规模化推广进展和下一步的工作重点。 谢存表示，今年《政府工作报告》提出，打造“5G+工业互联网”升级版。工信部持续推动“5G+工业互联网”规模化发展，全面完成5G工厂“百千万”行动目标。推动基础电信企业利用云切片、软件定义网络（SDN）等技术建设完善面向工业企业的专网服务。累计建设2.5万余个“5G+工业互联网”项目，建成1260家分类分级、特色鲜明的5G工厂，打造100个技术先进、标杆引领的5G工厂，平均产品质量提升20.5%，运营成本降低18.4%，平均产能增加24.7%。工业级5G网关、路由器等产品款式全球占比近50%，发布了全球首个“5G+工业互联网”国际标准，攻关突破一系列软硬件解耦的工控系统、通用集成的智能终端。 下一步，工信部将着力打造“5G+工业互联网”升级版，推动“5G+工业互联网”在网络设施、技术产品、融合应用、产业生态、公共服务等方面能力全面提升，加速信息技术（IT）、通信技术（CT）、运营技术（OT）、数据技术（DT）相融合，打造5G为代表的新型工业网络，加快“5G+工业互联网”广泛融入实体经济重点行业领域，为制造业智能化、绿色化、融合化发展提供坚实支撑。 一是加强要素保障。加快出台《关于推动工业互联网高质量发展的实施意见》，统筹推进网络、标识、平台、数据、安全五大功能建设，着力完善政策、设施、技术、应用和生态五大体系发展。加快制定发布一批基础共性、关键技术、典型应用等标准。 二是做深协同创新。在原材料、装备制造、消费品等行业领域，组织开展工业5G独立专网试点工作。滚动发布新型工业网络产品目录，鼓励工业企业应用时间敏感网络、信息模型等技术开展网络化改造，实施5G工厂“量质齐升”行动。 三是推广规模应用。编制一批工业互联网与重点行业融合应用指南，以场景化牵引为抓手，推进工业互联网在各行业领域的规模应用。实施工业互联网和人工智能融合赋能行动，加速工业互联网设施升级、能力优化、应用创新，为人工智能在工业领域应用落地提供关键底座和基础支撑。 四是优化产业生态。组织工业互联网一体化进园区“百城千园行”活动，推动政策、设施、技术、标准、应用、企业和服务进园区、进集群、进基地。启动第二批“5G+工业互联网”融合应用城市建设，培育打造引领性、创新性的高水平产业集群。'
          content_source: 'aliyun'
