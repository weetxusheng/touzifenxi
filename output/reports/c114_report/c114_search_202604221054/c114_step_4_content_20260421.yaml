          content_summary: '首批6G典型应用场景、全球首个6G信号传输操作人形机器人同时亮相 扫码观看视频。 本报讯（记者 张安琪） 4月21日，国内首个Pre6G试验网在南京正式投入运行。当天，2026全球6G技术与产业生态大会开幕，紫金山实验室发布了这一具有里程碑意义的重要成果。首批6G典型应用场景、全球首个6G信号传输操作人形机器人同时亮相。（更多报道见A2版） 该试验网在5G网络中融入6G创新技术，具备高带宽、远距离'
          content_text: '首批6G典型应用场景、全球首个6G信号传输操作人形机器人同时亮相 扫码观看视频。 本报讯（记者 张安琪） 4月21日，国内首个Pre6G试验网在南京正式投入运行。当天，2026全球6G技术与产业生态大会开幕，紫金山实验室发布了这一具有里程碑意义的重要成果。首批6G典型应用场景、全球首个6G信号传输操作人形机器人同时亮相。（更多报道见A2版） 该试验网在5G网络中融入6G创新技术，具备高带宽、远距离覆盖、低时延确定性和AI内生融合等特点，相关能力可达5G的10倍。试验网的落地，标志着6G技术从关键技术验证迈入系统能力验证的新阶段，为未来6G标准化和产业化应用奠定重要基础。 目前，试验网已在低空巡检、工业制造、具身智能、全息通信等领域开展系统性验证。大会同步发布了首批十项6G典型应用场景。 “这是一个开放性平台，主要为开发者提供便利环境，让他们无须从头开发终端、网络、平台。”中国科学院院士、紫金山实验室主任兼首席科学家尤肖虎介绍，试验网将向开发者开放接口，开发者有新的场景设想时，可以在试验网的环境下快速实验和验证，这将有助于小企业、一人创业公司等创新主体参与。 “我们希望6G时代不仅是龙头企业能作贡献，而是每个人都能快速参与，将自己的创意融入开发环境，打造各类产品和服务，让6G生态更加开放创新。”尤肖虎说。 在大会现场，参会人员已可体验Pre6G的速度。在展区，紫金山实验室联合中国移动完成Pre6G网络覆盖，实现与5G终端无缝兼容，并围绕全息影像、具身智能、工业控制等重点场景，打造了沉浸式6G“黑科技体验场”。 全球首个采用6G信号传输操作的人形机器人S1也亮相展区。该机器人身高170厘米，与常人相仿，全身最高可达55个自由度，由江苏箸境智能科技有限公司联合紫金山实验室孵化企业南京鑫合通感科技有限公司部署。记者刚在其身旁站定，它便跟随远程操作员的动作，利落地拿起一瓶矿泉水递到记者手中。 “Pre的意思是‘稍微超前’，Pre6G试验网把未来可能用到的6G技术整合到一个平台上、组建网络，这对于6G发展非常有用。”中国通信标准化协会（CCSA）理事长闻库表示，网络的发展关键在于实践，而不是只停留在实验室内，这一试验网能积累实践成果和数据。 “期待下一步试验网不断滚动完善，逐渐和国际标准对接，最终形成符合国际标准的试验网络，这通过几年的技术迭代就能实现。”闻库说。'
