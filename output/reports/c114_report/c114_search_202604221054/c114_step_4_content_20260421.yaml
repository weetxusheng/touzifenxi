          content_summary: 'C114讯 4月21日消息（南山）资本市场“液冷龙头”英维克今日在A股开盘后，股价一字跌停。过去1年，该公司股价涨了超过4倍。 导火索来自英维克昨日晚间发布的2025年年度报告和2026年第一季度报告。年报显示，英维克2025年实现营收60.68亿元，同比增长32.23%；净利润5.22亿元，同比增长15.30%。但一季报显示，营收11.75亿元，同比增长26.03%；但净利润仅有866万元，同比'
          content_text: 'C114讯 4月21日消息（南山）资本市场“液冷龙头”英维克今日在A股开盘后，股价一字跌停。过去1年，该公司股价涨了超过4倍。 导火索来自英维克昨日晚间发布的2025年年度报告和2026年第一季度报告。年报显示，英维克2025年实现营收60.68亿元，同比增长32.23%；净利润5.22亿元，同比增长15.30%。但一季报显示，营收11.75亿元，同比增长26.03%；但净利润仅有866万元，同比大跌81.97%。 股价跌停引发资本市场密切关注。据中证报消息，英维克方面回应称：“公司毛利率出现下滑，主要是调整了产品结构。公司部分项目周期比较长，一些应收账款回款周期也比较长，因此计提了坏账减值准备。此外，公司财务费用方面有一些汇兑损失。公司目前经营正常，以后续公告为准。” 资料显示，在算力设备以及数据中心机房的高热密度趋势和高能效散热要求的双重推动下，液冷技术加速导入。液冷作为高热密度数据中心散热优化的重要技术，已经开始进入规模应用阶段。随着 AI 算力时代的到来，高功率算力芯片对 服务器 的热设计理念带来的新变化，也带来一系列新的挑战。 作为全链条液冷的开创者，英维克率先推出高可靠Coolinside全链条液冷解决方案。从冷板、快速接头、Manifold、CDU、机柜，到 SoluKing长效液冷工质、管路、冷源等“端到端”的产品覆盖；英维克还推出了五合一及六合一集成液冷服务器 测试 设备、XSpace 6S液冷算力仓、全预制化撬块数据中心、泵驱两相冷板式液冷系统等产品，实现了从服务器制造工厂，到数据中心运行现场的“厂到场”交付场景覆盖。'
