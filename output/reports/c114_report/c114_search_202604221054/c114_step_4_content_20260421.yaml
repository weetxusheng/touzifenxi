          content_summary: 'C114讯 4月21日消息（颜翊）今日上午，国新办举行新闻发布会介绍2026年一季度工业和 信息化 发展情况。会上，工业和信息化部新闻发言人、信息通信发展司司长谢存介绍了我国今年一季度信息通信基础设施建设情况和下一步的工作重点。 谢存表示，今年是“十五五”开局之年，工业和信息化系统推进信息通信基础设施建设取得积极进展，呈现出“能力更强、覆盖更广、应用更好”的发展态势。 一是 网络 能力更强。截至3'
          content_text: 'C114讯 4月21日消息（颜翊）今日上午，国新办举行新闻发布会介绍2026年一季度工业和 信息化 发展情况。会上，工业和信息化部新闻发言人、信息通信发展司司长谢存介绍了我国今年一季度信息通信基础设施建设情况和下一步的工作重点。 谢存表示，今年是“十五五”开局之年，工业和信息化系统推进信息通信基础设施建设取得积极进展，呈现出“能力更强、覆盖更广、应用更好”的发展态势。 一是 网络 能力更强。截至3月底，全国 5G 基站 总数已达495.8万个，具备千兆网络服务能力的10G PON 端口数达3201万个，全国86个城市的168个小区、工厂和园区开展万兆光网试点部署， 5G-A （5G演进网络）目前已覆盖330个城市。移动 物联网 蓬勃发展，终端用户达29.48亿户。 二是网络覆盖更广。截至目前，全国实现“县县通千兆、乡乡通5G”，行政村实现100%通 宽带 、95%以上通5G，边境管理及贸易机构实现100%通 4G /5G网络。全国26.9万个重点场所实现网络深度覆盖，65.4万公里公路铁路和316条地铁线路实现网络连续覆盖，大家应该都能深切感受到这种变化和提升。 三是网络应用更好。截至目前，5G、千兆光网已融入97个国民经济大类中的91个，医疗领域，5G应用已实现院前急救、院内急诊、住院治疗、康复出院全流程覆盖，在500多家三甲医院落地推广。教育领域，5G应用覆盖到教、考、评、校、管教育全场景，在近3000所中小学、职业院校、高等院校等教育机构落地部署。 下一步， 工信部 将全面落实国家“十五五”规划《纲要》部署，进一步加强信息通信基础设施建设，巩固提升信息通信业竞争优势和领先地位，持续夯实经济社会高质量发展的数字底座。重点开展三方面工作： 一是扬优势。推进5G、千兆光网深度覆盖，持续推进“信号升格”专项行动，深化“宽带边疆”“宽带林草”建设，不断提升网络覆盖水平和供给能力。 二是促升级。加快5G-A规模商用，有序开展万兆光网试点，推动“双千兆”网络向“双万兆”演进，加快移动物联网“万物智联”发展。 三是抓协同。系统布局 6G 、下一代 互联网 等前沿技术研发，推动信息通信业与垂直行业协同创新。'
