            content_text: '科技日报记者 金凤 “随着人工智能（AI）时代的到来，6G的首要使命是赋能AI的发展。”21日，在江苏南京举行的2026全球6G技术与产业生态大会中，中国科学院院士尤肖虎做出判断，随着AI智能体的发展，未来3至5年，AI与6G的融合将是6G最具前景的研究方向。 尤肖虎表示，当前，6G技术已进入从概念走向落地应用的关键阶段。预计再过两年，基于6G技术的应用示范将会出现。而当下发展迅猛的AI，为6G的应用提供了广阔蓝海。 “产业对AI时代的新型网络有迫切需求，现有网络在这方面仍有差距，这为6G技术与产业的融合提供了内生动力。”在尤肖虎看来，如何推动网络的内生智能发展，用6G赋能智能机器人、无人机、工业无人化、人机交互等领域，存在大量市场需求，也尚存技术挑战。 尤肖虎认为，目前AI部署多位于云端，比如大模型部署在云端，这造成网络传输存在时延大、影响用户体验等问题。同时，产业链也存在相对环节的薄弱，可能一时难以达到国际最先进的水平。 “但这并不意味着我们无所作为。”尤肖虎认为，“我们可以从系统层和网络层着手进行技术攻关，例如可以利用AI自动化设计，优化电路面积和功耗，使在相对落后的工艺条件下研发的芯片仍能用于手机和基站。目前我们正努力提升芯片、基础软件的性能，以满足6G的发展。”尤肖虎说。 相比5G，6G被寄予更高期待，但目前很多应用场景还在探索阶段，如何加速6G落地？尤肖虎认为，在行业应用及个人应用中，存在大量需要闭环处理的任务。未来需要将AI部署在6G网络内部，实现内生式的AI能力。这需要感知物理世界和用户需求，部署智能体，形成感知、通信、计算、决策、执行的技术闭环。 此次大会中，国内首个Pre6G试验网在江苏南京正式投入运行。这张网搭建的广阔空间，在验证6G技术成熟度的同时，也在为6G应用的商业闭环探路。尤肖虎说，过去移动通信有“十年一代、建好再试”的发展周期和模式，但6G未来的应用场景更为复杂、范围更宽，需要形成多个快速闭环。 “现在移动通信技术每18个月升级一个版本。让6G技术在应用中快速试错，可以加速从技术到实验再到场景落地的进程，确保6G技术真正满足客户需求、创造价值。”尤肖虎举了个例子，预计到2029至20230年，人们也许就可以用上6G手机了。 “当6G进入千行百业、千家万户时，它将再一次改变人们的生活方式与生产方式。”尤肖虎笃定地说。'
