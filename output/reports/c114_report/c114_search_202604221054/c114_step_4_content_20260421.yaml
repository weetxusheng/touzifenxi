            content_text: '“液冷龙头”英维克股价一字跌停 一季度净利润大跌82%|英维克|液冷|净利润_新浪科技_新浪网 新浪首页 新闻 体育 财经 娱乐 科技 博客 图片 专栏 更多 汽车 教育 时尚 女性 星座 健康 房产 历史 视频 收藏 育儿 读书 佛学 游戏 旅游 邮箱 导航 移动客户端 新浪微博 新浪新闻 新浪财经 新浪体育 新浪众测 新浪博客 新浪视频 新浪游戏 天气通 我的收藏 注册 登录 新浪科技 > 滚动新闻 > 正文 “液冷龙头”英维克股价一字跌停 一季度净利润大跌82% “液冷龙头”英维克股价一字跌停 一季度净利润大跌82% 2026年04月21日 11:22 C114通信网 新浪财经APP 缩小字体 放大字体 收藏 微博 微信 分享 腾讯QQ QQ空间 C114讯 4月21日消息（南山）资本市场“液冷龙头”英维克今日在A股开盘后，股价一字跌停。过去1年，该公司股价涨了超过4倍。 导火索来自英维克昨日晚间发布的2025年年度报告和2026年第一季度报告。年报显示，英维克2025年实现营收60.68亿元，同比增长32.23%；净利润5.22亿元，同比增长15.30%。但一季报显示，营收11.75亿元，同比增长26.03%；但净利润仅有866万元，同比大跌81.97%。 股价跌停引发资本市场密切关注。据中证报消息，英维克方面回应称：“公司毛利率出现下滑，主要是调整了产品结构。公司部分项目周期比较长，一些应收账款回款周期也比较长，因此计提了坏账减值准备。此外，公司财务费用方面有一些汇兑损失。公司目前经营正常，以后续公告为准。” 资料显示，在算力设备以及数据中心机房的高热密度趋势和高能效散热要求的双重推动下，液冷技术加速导入。液冷作为高热密度数据中心散热优化的重要技术，已经开始进入规模应用阶段。随着AI算力时代的到来，高功率算力芯片对服务器的热设计理念带来的新变化，也带来一系列新的挑战。 作为全链条液冷的开创者，英维克率先推出高可靠Coolinside全链条液冷解决方案。从冷板、快速接头、Manifold、CDU、机柜，到 SoluKing长效液冷工质、管路、冷源等“端到端”的产品覆盖；英维克还推出了五合一及六合一集成液冷服务器测试设备、XSpace 6S液冷算力仓、全预制化撬块数据中心、泵驱两相冷板式液冷系统等产品，实现了从服务器制造工厂，到数据中心运行现场的“厂到场”交付场景覆盖。 关键词 : 英维克 液冷 净利润 跌停 股价 新浪科技公众号 “掌”握科技鲜闻 （微信搜索techsina或扫描左侧二维码关注） 相关新闻 创事记 “不好看就退票”服务，能救电影院吗？ 微信封禁自家“兄弟”红包，打的什么牌？ 华住，比携程还会捞金？ 阅读排行榜 评论排行榜 20岁女儿挪用1700万打赏主播 亲爹无奈带其自首：坐牢才有可能追回钱款 爱奇艺去中心化转型 龚宇：AI风口期 我既焦虑又兴奋 近70款车集体降价：新能源均降3.8万 车企赔本赚吆喝已成常态 华为HarmonyOS 6.1正式发布！升级计划公布：今日起开推 重庆昨夜到今晨共出现8068次闪电：昨夜你被吓醒了吗 字节跳动净利润下滑超 70%引热议 抖音副总裁李亮紧急回应 注意！华为Pura 90标准版没有麒麟9030S 时隔三年回归：华为WATCH Buds 2发布！3488元起手表耳机二合一 月之暗面最强模型 Kimi K2.6 发布并开源：代码能力对标 GPT-5.4，Agent 集群支持 300 子任务并行 华为Pura 90系列 Pura X Max双旗舰发布 影像与设计双升级 大叔高铁上泣不成声：病危儿子已离世 吉利星越 L、星瑞 i-HEV 智擎混动开启预售，限时价 10.27 万元起 小卡扣断裂竟然要换整个电池包需掏13万 新能源车主崩溃了 雷军被人堵在车里维权引热议 小米高管回应后：网友感慨小米被黑的太狠了 蓝色起源新格伦火箭发射失败：未能将卫星送入预定轨道 黄仁勋：DeepSeek若在华为芯片上首发 对美国将是灾难！ 日本发生7.7级地震：专家称今年日本地震将更频繁 这些原因所致 张雪820RR爆缸后续：张雪宣布全国门店技师整改 不达标就关店 谷爱凌出席2026科学突破奖颁奖礼：与黄仁勋夫妇合影 气质拉满 网友爸爸2年前垃圾堆里捡回72条32GB DDR4内存：如今价值近14万 科学探索 威马递表港交所 累计售车不足10万去年亏... 科学大家 《科学大家》| 新冠疫苗接种已不是选择题... 苹果汇 因iPhone包装不含充电器，苹果在美国... 众测 华为路由X3 Pro体验评测 来电聊 2018新浪科技风云榜回顾 专题 海外周选——每周一个有趣故事 官方微博 公众号 新浪科技 新浪科技为你带来最新鲜的科技资讯 苹