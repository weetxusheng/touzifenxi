      - original_title: '中国科学院院士尤肖虎：DOICT超融合是非常有潜力的技术'
        topic: '前沿技术演进与试验'
        channel: '首页'
        original_url: 'https://www.c114.com.cn/news/16/a1308920.html'
        original_published_at: '2026-04-21'
        original_content:
          url: 'https://www.c114.com.cn/news/16/a1308920.html'
          domain: 'www.c114.com.cn'
          content_title: '中国科学院院士尤肖虎：DOICT超融合是非常有潜力的技术 - 推荐 — C114通信网'
          content_summary: '中国科学院院士尤肖虎：DOICT超融合是非常有潜力的技术,C114讯 4月21日消息在今天召开的“全球6G技术与产业生态大会”上，中国科学院院士、东南大学首席'
          content_text: 'C114讯 4月21日消息 &nbsp;在今天召开的“全球 6G 技术与产业生态大会”上，中国科学院院士、东南大学首席教授、紫金山实验室主任、未来 移动通信 论坛副理事长兼秘书长尤肖虎在报告中指出，6G将会为2B和2C的应用提供有力的支持，既有4K直播视频、云游戏这样的2C类业务，也有工业实时控制和 具身智能 等2B应用。 为了实现这些目标，6G必须要达到两个重要要求：第一是极致的连接性，比如时延性、容量、频谱效率、覆盖范围，都需要较 5G 大幅提升。第二是多元素 融合 ，通信将深度融入到感知、通信和控制计算，这对于2B应用来说特别重要。 尤肖虎指出，要做到这一点，就需要DOICT超融合架构。在5G时代， ICT 融合得到了较为广泛的应用，但5G是以连接为导向的，只是将设备间进行联动，并进行数据传输，这对于2C端来说足够，但对2B端来说，比如工业、生产制造，是远远不够的。在智能工厂当中， 网络 不仅仅只是传输数据，更重要的是对数据进行融合，同时做出决策，以及做好实时控制。“所以当前的5G ICT融合无法实现这个目标，因此6G的架构必须进一步 整合 数据技术和运营技术到ICT当中，以便更好的理解和应用数据。OT将会帮助我们实现实时使用和确定性控制，DT和OT一起联合ICT也就是DOICT超融合。” 尤肖虎指出，简单的功能堆叠集成，比如 MEC 移动边缘计算并不会带来实时融合，所以说通信、智能、计算是以独立的方式进行整合，这会导致资源利用率低下。从数据层面上来看，6G有望支持多样化应用，尤其是多元异构数据，如何来解决这种非结构化的、复杂的、耦合的数据？这意味着我们需要有更好的融合，因为这些数据本身是很难进行融合和高效利用的。 为了解决这些问题，尤肖虎提出了6G DOICT架构，包含了核心网络、边缘网络和终端网络。在这个架构当中，边缘网络扮演着非常重要的角色，更重要的是引入了数据规划。数据规划会对数据进行收集分析，而且实时进行智能优化和网络自洽。 “我们从各个不同层收集各种数据，它们可能是高度异构化的数据，对它进行利用和诠释是非常困难的。为了解决这个问题，我们提供了一个知识图谱用于数据平面，然后将通信的领域知识以及数据驱动的学习结合，从而构建一个知识图谱，对这些复杂的、耦合的关系或者数据，做知识图谱的构建或者表征。”尤肖虎指出。 “如果我们使用原始数据，可能是非常大的，我们对其进行关键特征的提取，和主要性能指标相关的特征提取，从而降低数据规模，提升 AI 的实时性，知识图谱同时可以提供知识的模型，可以用于未来的AI优化。所以我们也可以去获得超过93%的特征压缩，而且它的准确性能够达到99.5%。” 尤肖虎指出，DOICT可以提供一个实时的无线互联技术，提供微秒级的抖动，以及更优的延时表现，而且它的可靠性更好，能够实现我们的期望和要求。此外我们也可以实现不同细节技术的优化，和传统技术相比它的闭环调度技术是更优的，量级也更高，包括性能效率，以及与传统的开环调度方法相比，它的确定延时方面的表现更好，所以我们可以将这个技术应用到无线网络当中，以及可以使用到时间感知网络，这是非常有潜力的一个技术。 据尤肖虎介绍，紫金山实验室已经搭建了一个Pre 6G DOICT平台，这个平台是由一个核心网络、安全网络、以及四个AI部署的网络组成，这个网络和5G是兼容的，也能够获得卓越的连接性，以及提供实时的原生数据进行数据分析，并且基于这个平台，也能够进行一系列的技术验证和应用试验，包括智能多用户调度以及网络使用，这能够进行大规模的工业级应用。 版权说明：C114刊载的内容，凡注明来源为“C114通信网”或“C114原创”皆属C114版权所有，未经允许禁止转载、摘编，违者必究。对于经过授权可以转载我方内容的单位，也必须保持转载文章、图像、音视频的完整性，并完整标注作者信息和本站来源。编译类文章仅出于传递更多信息之目的，不代表证实其描述或赞同其观点；翻译质量问题 请指正 。 给作者点赞 0 VS 0 写得不太好'
