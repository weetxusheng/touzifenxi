            content_text: 'IT之家 4 月 21 日消息，据央视新闻报道，国内首个 Pre6G 试验网今日在江苏南京正式投入运行。 该试验网在 5G 网络中融入 6G 创新技术，具备高带宽、远距离覆盖、低时延确定性和 AI 内生融合等特点， 相关能力可达 5G 的 10 倍 。 目前，试验网已在低空巡检、工业制造、具身智能、全息通信等领域开展系统性验证。这一试验网的落地，标志着 6G 技术从关键技术验证迈入系统能力验证的新阶段，为未来 6G 标准化和产业化应用奠定重要基础。 工信部遵循“商用一代、研发一代”的规律，持续推动信息通信技术能力稳步提升。据IT之家此前报道，截至今年 1 月， 6G 研发已完成第一阶段技术试验 ，形成了超 300 项关键技术储备，已经启动第二阶段 6G 技术试验。 广告声明：文内含有的对外跳转链接（包括不限于超链接、二维码、口令等形式），用于传递更多信息，节省甄选时间，结果仅供参考，IT之家所有文章均包含本声明。'
