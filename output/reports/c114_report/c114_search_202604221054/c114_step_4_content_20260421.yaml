          content_title: '中国联通Q1营收1028亿元：净利润49亿元 同比下降17.6%'
          content_summary: 'C114讯 4月21日消息（颜翊）今日， 中国联通 公布了2026年首季度主要财务及经营指标，一季度，公司营业收入人民币1,028亿元，同比下降0.5%；税前利润人民币61亿元，本公司权益持有者应占盈利人民币49亿元，同比下降17.6%。 中国联通表示，2026年首季度，公司牢牢把握“守正创新 行稳致远”主基调，聚焦“连接”“算力”“服务”“安全”四大核心赛道，抢抓战略机遇，高质量发展取得新成效。'
          content_text: 'C114讯 4月21日消息（颜翊）今日， 中国联通 公布了2026年首季度主要财务及经营指标，一季度，公司营业收入人民币1,028亿元，同比下降0.5%；税前利润人民币61亿元，本公司权益持有者应占盈利人民币49亿元，同比下降17.6%。 中国联通表示，2026年首季度，公司牢牢把握“守正创新 行稳致远”主基调，聚焦“连接”“算力”“服务”“安全”四大核心赛道，抢抓战略机遇，高质量发展取得新成效。 守“连接”，夯实经营发展“稳定器”。 用户规模稳步增长，移动和 宽带 用户净增超过358万户；价值保有成效明显， 融合 ARPU 保持人民币百元以上；连接场景拓维升级， 物联网 连接数超过7.5亿，净增3,203万。 强“算力”，驱动收入提档“推进器”。 算力业务收入人民币154亿元，同比提升8.3%，其中智算中心收入同比提升11.7%，联通云服务近44万政企大客户。助力数字消费升级，云智产品付费用户超过1.1亿户，净增549万户。 优“服务”，打造收入增长“加速器”。 加快 5G 规模化应用，累计打造超5.3万个5G商业化项目，落地9,800余家5G工厂。加速国际市场拓展，国际业务收入同比增长14.9%。升级客服智能体，智慧客服智能服务占比达到85.6%，客户诉求解决满意率提升至96.5%。 保“安全”，筑牢行稳致远“护航器”。 激活产品动能，安全专线、联通盾、墨攻安全运营服务平台等特色产品实现规模发展，累计服务政企客户超过46万家；繁荣产业生态， 网络安全 产业链供需对接平台“安全荟”累计上架安全产品超240款；锻造安全业务增长极，收入同比提升14.2%。 中国联通表示，2026年是“十五五”开局之年。公司将不忘初心、牢记使命，走差异化道路，推动公司高质量发展迈出坚实步伐，努力为股东、客户和社会创造更大价值。'
