            content_text: '﻿ 工信部：将加快5G-A规模商用，有序开展万兆光网试点 — 新京报 北交所频道 新京号 电子报 千龙网 贝壳财经 北京BEIJING 新京雅集 专题 商务合作 爱心模式 线索报料 客户端 微博 微信 首页 视频 深读 公益 第一看点 时事 北京 国际 政事儿 观点 财经 消费 娱乐 文化 体育 汽车 房产 教育 图说 科技 智库 乡村 稿件组 视频组 工信部：将加快5G-A规模商用，有序开展万兆光网试点 2026-04-21 11:32 记者：陈维城 编辑：杨娟娟 新京报贝壳财经讯（记者陈维城）4月21日，国务院新闻办举行新闻发布会，介绍2026年一季度工业和信息化发展情况。工业和信息化部新闻发言人、信息通信发展司司长谢存提到，截至3月底，全国5G基站总数已达495.8万个，具备千兆网络服务能力的10G PON端口数达3201万个，全国86个城市的168个小区、工厂和园区开展万兆光网试点部署，5G-A（5G演进网络）目前已覆盖330个城市。移动物联网蓬勃发展，终端用户达29.48亿户。 截至目前，全国实现“县县通千兆、乡乡通5G”，行政村实现100%通宽带、95%以上通5G，边境管理及贸易机构实现100%通4G/5G网络。全国26.9万个重点场所实现网络深度覆盖，65.4万公里公路铁路和316条地铁线路实现网络连续覆盖，大家应该都能深切感受到这种变化和提升。 截至目前，5G、千兆光网已融入97个国民经济大类中的91个，在医疗领域，5G应用已实现院前急救、院内急诊、住院治疗、康复出院全流程覆盖，在500多家三甲医院落地推广。教育领域，5G应用覆盖到教、考、评、校、管教育全场景，在近3000所中小学、职业院校、高等院校等教育机构落地部署。 谢存表示，下一步，工业和信息化部将重点开展三方面工作：一是扬优势。推进5G、千兆光网深度覆盖，持续推进“信号升格”专项行动，深化“宽带边疆”“宽带林草”建设，不断提升网络覆盖水平和供给能力。二是促升级。加快5G-A规模商用，有序开展万兆光网试点，推动“双千兆”网络向“双万兆”演进，加快移动物联网“万物智联”发展。三是抓协同。系统布局6G、下一代互联网等前沿技术研发，推动信息通信业与垂直行业协同创新。 编辑 杨娟娟 校对 王心 109 +1 微博 微信 我要评论 登录 直播 直播中 直播丨第十三批在韩中国人民志愿军烈士遗骸归国 46950人参与 预 告 第21届文津图书发布暨国家图书馆4·23世界读书日特别活动 2026-04-23 10:00 热点 1 2026北京国际花展早鸟票预售 抢先解锁春日福利 40.8万 2 超级V8破局、GT3亮剑，长城汽车向高性能突围 22.1万 3 全新坦克700上市，社交平台“麒麟荟”发布 3.8万 4 4款新车全球首秀，大众汽车集团加速进入“AI定义汽车时代” 3.5万 5 贝壳财经会客厅｜菜百股份李洋：黄金价格波动下投资者需有"压舱石"思维 3.3万 最新 外交部发言人就台湾当局宣称赖清德“暂缓”窜访斯威士兰答记者问 7分钟前 “十五五”开局成绩单｜拉动国内经济，服务业“扛大旗” 8分钟前 国台办回应日方舰艇进入台湾海峡：严重损害中日关系政治基础 9分钟前 宁德时代首席技术官高焕：许多高端车企对凝聚态电池很感兴趣 10分钟前 一位宠物殡葬师眼中的生死离别 22分钟前 热议 “荣归50”“红鹰”！运-20B、歼-20用特殊呼号唤英烈回家 王毅将访问柬埔寨、泰国、缅甸并与董军共同出席中柬外长、防长“2+2”战略对话机制首次会议 贝壳财经会客厅｜菜百股份李洋：黄金价格波动下投资者需有"压舱石"思维 3岁男童被生父女友虐待致死案：被告人判死缓，生母称将申请抗诉 日本126名议员集体参拜靖国神社 想要发表评论，阅读更多精彩内容，快来下 载新京报客户端吧 新浪网 | 网易 | 搜狐 | UC头条 | 新华网 | 中新网 | 慧科讯业 | 今日头条 | 一点资讯 | 千龙网 | 贝壳财经 | 腾讯网 | 百度 经营许可证编号：京ICP证090533号 | 京ICP备18053894号 | 国新办网备字[2006]7号 | 广播电视节目制作经营许可证：(京)字第02592号 京公网安备11010102004542号 | 互联网新闻信息服务许可证11120180005号 关于我们 版权声明 联系我们 工作机会 友情链接 服务协议 Copy Right © 2004-2020 www.bjnews.com.cn All Rights Reserved'
