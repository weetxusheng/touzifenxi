            content_summary: '市场资讯 04.21 18:40 来源：上市之家 4月21日，A股千亿液冷龙头 英维克 （002837.SZ）以一字跌停开盘。该股开盘即报108.97元/股，较前一交易日收盘价121.08元下跌10%，跌停板上封单一度超过50万手，单日市值“蒸发”约119亿元，最新市值降至1065亿元。而就在4月20日，该股盘中一度触及涨停并创出121.74元的历史新高，收盘涨幅达9.41%，市值攀上1183亿元'
            content_text: '市场资讯 04.21 18:40 来源：上市之家 4月21日，A股千亿液冷龙头 英维克 （002837.SZ）以一字跌停开盘。该股开盘即报108.97元/股，较前一交易日收盘价121.08元下跌10%，跌停板上封单一度超过50万手，单日市值“蒸发”约119亿元，最新市值降至1065亿元。而就在4月20日，该股盘中一度触及涨停并创出121.74元的历史新高，收盘涨幅达9.41%，市值攀上1183亿元。 消息面上，4月20日晚间英维克披露的2026年第一季度报告。数据显示，公司一季度实现营业收入11.75亿元，同比增长26.03%，延续了近年来业务规模的扩张态势；但归属于上市公司股东的净利润仅为865.76万元，同比大幅下降81.97%；扣非净利润539.29万元，同比降幅更高达87.10%。从环比角度看，一季度净利润较2025年第四季度骤降93%，扣非净利润降幅达95.4%，呈现典型的“增收不增利”格局。 财报中虽未对利润断崖式下滑作出具体解释，但其他财务数据揭示了成本端的显著压力。一季度公司财务费用达2006.38万元，同比激增7761.24%，公司解释称主要系汇兑收益下降及利息支出增加所致。信用减值损失由上年同期的752.69万元攀升至3015.72万元，同比增长3倍，主要因应收账款计提坏账准备增加。与此同时，经营活动现金流净额为-3.86亿元，同比扩大126.25%，公司称主要系供应商款项到期支付与员工薪酬增加所致。 针对业绩大幅下滑，英维克方面回应称：“公司毛利率出现下滑，主要是调整了产品结构。公司部分项目周期比较长，一些应收账款回款周期也比较长，因此计提了坏账减值准备。此外，公司财务费用方面有一些汇兑损失。公司目前经营正常，以后续公告为准。” 综合市场分析来看，业绩下滑的核心原因集中于行业竞争加剧导致毛利率下滑、为抢占AI市场份额阶段性投入激增，以及客车、轨交空调等传统业务持续低迷拉低整体盈利水平。开源证券分析认为，公司利润大幅下滑或与液冷业务爆发式增长带来的产能扩张和大举备货导致费用端增长较大有关，若产能未来顺利转化为液冷产品交付确认，利润或迎来反弹。 国际投行 花旗银行 报告指出，英维克已连续三个季度业绩不及预期，表明市场对其的一致盈利预期过高。 花旗 重申“卖出”评级，并将目标价从50元上调至60元（仍远低于现价108.97元）。花旗认为，市场过度聚焦于其为 英伟达 ASIC供应液冷的光环，却忽视了其业务体量较小、国内竞争白热化以及未来更多新进入者冲击等现实压力。 事实上，英维克此前一直保持稳健增长态势。2025年年报显示，公司全年实现营收60.68亿元，同比增长32.23%；归母净利润5.22亿元，同比增长15.3%，创下历史新高。作为国内唯一实现液冷全链条自研的企业，公司拥有冷板、CDU、快速接头等核心专利，是中国大陆唯一获得英伟达NPN Tier1认证的液冷供应商。'
            content_source: 'aliyun'
