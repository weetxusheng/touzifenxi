          content_text: 'C114讯 4月21日消息（云青）日前，由香港城市大学发起的“量子智能产业联盟”于香港会议展览中心 Web3 Festival 2026 举行盛大启动仪式。香港立法会科技创新界议员邱达根、香港创新科技及工业局工业专员葛明博士到场见证。 香港作为高度发达的国际金融与物流枢纽，每天需应对极其复杂的业务场景，对风险对抗能力和密码安全有着最严苛的要求。联盟的成立正是基于这一战略考量——在国家“十五五”规划明确支持香港融入国家发展大局、强调科技自立自强的背景下，率先布局量子算力，抢占下一代计算范式的制高点。 国内量子公司纷纷参与： 香港城市大学与本源量子、国富量子、顺丰科技、中电信量子、国盾量子、上海量羲、深圳量旋、天工开物开源基金会及科大 硅谷 等多家机构签署合作备忘录 ，涵盖量子硬件、算法生态、通信安全及产业应用等多个核心领域，标志着联盟正式从科研共识走向工程协同。仪式上，城大宣布建设“先进算力中心”，部署香港首台 量子计算 真机。'
