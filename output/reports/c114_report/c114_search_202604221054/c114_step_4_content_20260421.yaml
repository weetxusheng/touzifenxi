            content_text: '4月21日，国新办举行新闻发布会介绍2026年一季度工业和信息化发展情况。会上发布的信息显示，截至3月底，智能算力规模达1882 EFLOPS。下一步工业和信息化部将持续推动算力产业体系化高质量发展，包括推动绿色电力与算力协同布局，支持开展太空算力技术前瞻性研究，探索“算力银行”“算力超市”等创新业务等。 当前，算力基础设施已成为驱动人工智能发展的关键底座。工业和信息化部副部长张云明表示，工业和信息化部“点、链、网、面”统筹推进算力产业高质量发展，近期围绕普惠算力赋能中小企业、算电协同等重点工作持续发力，算力产业发展呈现良好态势。 其中，产业创新更强劲，开展算电协同政策研究和标准制定，促进源网荷储、绿电直连加速落地。网络传输更顺畅，近两年围绕算力枢纽建成超70条算力大通道，落实城域“毫秒用算”专项行动，提升算力高效运载能力。 张云明表示，下一步工业和信息化部将按照“单点提质、创新强链、连算成网、全面赋能”的思路，持续推动算力产业体系化高质量发展。 在算力资源“单点提质”方面，引导算力基础设施按需有序建设，推动绿色电力与算力协同布局，推进算力自动化监测全域覆盖。完善中国算力平台，促进算力供需精准对接，提升算力资源利用效率。 在技术产品“创新强链”方面，深入实施算力强基“揭榜”行动，推动成果落地转化和创新赋能。完善算力标准体系建设。支持开展太空算力技术前瞻性研究，有序推动太空算力产业发展。 在算力传输“连算成网”方面，在全国范围内梯次推进“毫秒用算”网络建设，围绕“枢纽—区域—边缘”，打造高效畅通的算力传输通道，提升算力应用交互体验。 在产业生态“全面赋能”方面，深入开展普惠算力赋能中小企业发展专项行动，探索“算力银行”“算力超市”等创新业务，降低中小企业用算门槛和成本。'
