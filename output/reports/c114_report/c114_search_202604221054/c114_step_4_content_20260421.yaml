          content_text: 'C114讯 4月21日消息（颜翊）昨日，永鼎股份发布2025年年度报告。报告期内，公司实现营业收入52.87亿元，同比增长28.60%；实现归属于上市公司股东净利润2.34亿元，同比增长280.43%，主要因本期对联营企业权益法确认的投资收益较高。 主营业务具体情况如下： 光通信领域：本期营业收入同比有所下降，通过生产线智能化改造实现明显降本增效，叠加研发投入加大、产品结构持续优化，高附加值产品占比提升带动毛利率上行，板块利润同比增长。 电力传输领域：孟加拉电网改造项目推进带动营收增长，受原材料涨价、项目延期、人民币升值及结算收缩影响，整体毛利率下滑、汇兑损失增加，利润同比减少。汽车线束业务行业竞争激烈，公司新增项目带动营收大幅增长，但受新项目爬坡、毛利率下滑及海外业务费用增加影响，利润同比减少。线缆电线业务通过渠道拓展、结构优化与成本管控，实现利润增长。 新质生产力领域：公司激光器芯片业务进展顺利，70mW CW-DFB 芯片及100G EML 系列产品已完成产品开发与全流程可靠性验证，并通过客户光模块适配测试，现已实现供货，收入规模具备快速放量基础。公司正有序推进产能扩充工作，为规模化批量交付奠定坚实保障。高温超导带材方面，东部超导持续加大研发投入与产能扩张，现已具备高温超导带材规模化供应能力，业务整体处于快速发展期，收入及利润规模预计将迎来增长。'
