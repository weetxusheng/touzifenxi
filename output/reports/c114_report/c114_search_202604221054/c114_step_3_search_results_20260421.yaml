            source_tier: 'normal'
            extract_status: 'success'
            extract_text: '## [首页](https://www.jjckb.cn) >> 正文 有关太空算力、算力银行、算电协同……工信部最新部署 2026-04-21 记者 郭倩 来源：经济参考网 【[大](#) [中](#) [小](#)】 4月21日，国新办举行新闻发布会介绍2026年一季度工业和信息化发展情况。会上发布的信息显示，截至3月底，智能算力规模达1882 EFLOPS。下一步工业和信息化部将持续推动算力产业体系化高质量发展，包括推动绿色电力与算力协同布局，支持开展太空算力技术前瞻性研究，探索“算力银行”“算力超市”等创新业务等。 当前，算力基础设施已成为驱动人工智能发展的关键底座。工业和信息化部副部长张云明表示，工业和信息化部“点、链、网、面”统筹推进算力产业高质量发展，近期围绕普惠算力赋能中小企业、算电协同等重点工作持续发力，算力产业发展呈现良好态势。 其中，产业创新更强劲，开展算电协同政策研究和标准制定，促进源网荷储、绿电直连加速落地。网络传输更顺畅，近两年围绕算力枢纽建成超70条算力大通道，落实城域“毫秒用算”专项行动，提升算力高效运载能力。 张云明表示，下一步工业和信息化部将按照“单点提质、创新强链、连算成网、全面赋能”的思路，持续推动算力产业体系化高质量发展。 在算力资源“单点提质”方面，引导算力基础设施按需有序建设，推动绿色电力与算力协同布局，推进算力自动化监测全域覆盖。完善中国算力平台，促进算力供需精准对接，提升算力资源利用效率。 在技术产品“创新强链”方面，深入实施算力强基“揭榜”行动，推动成果落地转化和创新赋能。完善算力标准体系建设。支持开展太空算力技术前瞻性研究，有序推动太空算力产业发展。 在算力传输“连算成网”方面，在全国范围内梯次推进“毫秒用算”网络建设，围绕“枢纽—区域—边缘”，打造高效畅通的算力传输通道，提升算力应用交互体验。 在产业生态“全面赋能”方面，深入开展普惠算力赋能中小企业发展专项行动，探索“算力银行”“算力超市”等创新业务，降低中小企业用算门槛和成本。 ![](//www.jjckb.cn/top/150106/img/xl_ewm.jpg) 凡标注来源为“经济参考报”或“经济参考网”的所有文字、图片、音视频稿件，及电子杂志等数字媒体产品，版权均属《经济参考报》社有限责任公司，未经书面授权，不得以任何形式刊载、播放。[获取授权](http://101607190002448.bqy.pub) ![](//www.jjckb.cn/xl/20170727js/css/ewm.jpg) * [关于我们](//www.jjckb.cn/jc_ad.htm) * [版权声明](//www.jjckb.cn/2015-07/02/c_134375958.htm) * [媒体刊例](//www.jjckb.cn/2015-07/02/c_134375971.htm) * [信披平台](//www.jjckb.cn/xinpi/xinpipt.htm) * [商务合作](//www.jjckb.cn/2015-07/02/c_134375970.htm) 《经济参考报》社有限责任公司版权所有 本站所有新闻内容未经协议授权，禁止转载使用 新闻线索提供热线：010-63074375 63072334 报社地址：北京市宣武门西大街57号 JJCKB.CN 京ICP备2024066810号-1 新闻线索提供热线：010-63074375 63072334 JJCKB.CN 《经济参考报》社有限责任公司版权所有 本站内容未经协议授权，禁止转载使用 [京ICP备18039543号-1](https://beian.miit.gov.cn) 有关太空算力、算力银行、算电协同……工信部最新部署 ![](//www.jjckb.cn/images/fenxianglogo.jpg)'
