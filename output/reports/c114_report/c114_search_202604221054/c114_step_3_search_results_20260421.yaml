            snippet: '# 工信部谢存：深入整治“内卷式”竞争 持续推进国产操作系统和RISC-V架构的适配. C114讯 4月21日消息（颜翊）今日上午，国新办举行新闻发布会介绍2026年一季度工业和信息化发展情况。会上，工业和信息化部新闻发言人、信息通信发展司司长谢存介绍了我国一季度电子信息制造业整体发展情况和下一步的工作重点。. 谢存表示，一季度电子信息制造业开局良好，今年有望延续增长态势。一季度规模以上计算机、通信和其他电子设备制造业增加值同比增长13.6%，在主要工业门类中增速第一。1—2月实现营业收入2.6万亿元，同比增长14.3%，较工业增速高9个百分点。一季度，部分产品产量实现两位数增长，集成电路产量同比增长24.3%。上游产品出口金额实现大幅攀升，集成电路、液晶平板显示模组出口金额同比分别增长72.9%、12.5%。. 2026年以来，工信部持续推动电子信息制造业技术创新与融合应用。创新成果不断'
