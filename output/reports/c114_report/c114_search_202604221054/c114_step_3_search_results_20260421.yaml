            extract_text: '# 股价新高后一字跌停！液冷龙头英维克Q1净利大降82%，采购扩产步伐加速 头像 时代财经 2026-04-21 16:26发布于广东时代财经官方账号 本文来源：时代财经 作者：周立 图片图片来源：图虫创意 图片 在股价创下历史新高的当晚，液冷大牛股新鲜出炉的业绩成为火热市场的“冷却剂”。 4月20日晚间，液冷龙头英维克（002837.SZ）披露了2025年年报和2026年一季报。公告显示，英维克2025年实现营业收入60.68亿元，同比增长32.23%；归母净利润5.22亿元，同比增长15.30%，延续了十余年双增长态势。 从产品来看，机房温控节能产品营收为34.48亿元，同比增长41.28%，不仅撑起英维克业绩的半壁江山，同时也成为公司最赚钱的单品——毛利率同比增长至28.36%；其次是机柜温控产品收入19.77亿元，同比增长15.30%，但由于收入的区域组合变化，该产品毛利率下滑至27.24%。 从地区来看，英维克2025年境外收入8.49亿元，同比增长28.70%；毛利率达52.64%，显著高于境内的23.83%，海外高毛利业务扩张贡献结构性优化。 然而在2025年仍营利双增的情况下，2026年一季度却出现营收增长、净利下滑的情况。 财报显示，英维克2026年第一季度营收同比增长26.03%至11.75亿元，归母净利润同比下滑81.97%至865.76万元；若与2025年第四季度数据相比，则出现营收、归母净利润分别环比下滑42.43%，92.95%。 从具体财务数据来看，英维克一季度净利大幅下滑的背后，是财务费用、信用和资产减值损失、税金及附加等多个因素影响。 [...] 从具体财务数据来看，英维克一季度净利大幅下滑的背后，是财务费用、信用和资产减值损失、税金及附加等多个因素影响。 其中变化最大的是财务费用，2026年一季度同比增长7761.24%至2006.38万元，主要原因系报告期汇兑收益下降以及利息支出增加所致；而由于应收账款计提坏账准备增加以及存货跌价准备计提增加，英维克的信用、资产减值损失，分别为-3015.72万元、-724.15万元，均同比大幅增加。 消息一出，液冷概念板块迎来了一场“急速降温”。在股价触及历史新高的第二天（4月21日），英维克开盘一字跌停，报收108.97元/股，仍有55.62万手封板，跌停封单额达59.43亿元。Wind数据显示，同日液冷服务器指数（8841247.WI）收于4632.25点，跌幅2.33%，成分股方面，佳力图（603912.SH）、高澜股份（300499.SZ）、飞龙股份（002536.SZ）等跌超5%。 值得注意的是，虽然净利大幅下滑，但英维克在今年一季度的材料采购款不断增加，扩产步伐也未曾暂停。 财报显示，截至一季度末，其预付款项期末余额为3361.69万元，较年初增长46.36%；在建工程期末余额为3.22亿元，较年初增长超20%。也因为机器设备和建设工程投入增加，英维克当期投资活动产生的现金流量净流出扩至1.58亿元，同比增长348.82%。 根据2025年年报，英维克主要有4个重要在建工程，其中精密温控节能设备华南总部基地的工程进度已达100%，而英维克精密温控节能设备中原总部基地、华南总部基地三期、研发中心及生产基地（深圳）仍在建设中，分别已投入2.61亿元、433.70万元、255.13万元，工程进度为90.92%、2.91%、0.46%。 [...] 但不论行业发展瓶颈如何，AI服务器、储能等下游市场爆发切切实实给液冷市场带来过无限遐想空间。Wind数据显示，截至4月20日，液冷服务器指数成份市盈率（TTM）为67.34倍，处于近三年来的历史高位。 何理表示，在当前液冷板块高PE背景下，最大的预期差在于市场低估了从非标定制向标准化量产过渡的阵痛期。英维克的业绩反映出，市场此前过度乐观地估计了短期业绩弹性，忽略了在技术快速迭代期，产业链龙头为保住市场份额而投入的巨额研发费用，以及大客户压价对毛利空间的挤压。 “未来板块估值上修因素主要关注头部厂商在GB200大规模交付后的毛利率修复情况。如果能通过模组化生产降低单位成本，证明其具备将技术溢价转化为财务报表的能力，估值将获得支撑。下修压力核心在于业绩兑现的一致性。如果类似英维克的利润不及预期成为行业普遍现象，或者风冷改良方案如高性能3D散热器截流了部分中低端AI算力需求，市场对高增长的确定性将产生动摇。尤其要警惕增收不增利的逻辑被坐实，这可能引发板块从主题投资向价值回归的剧烈波动。”何理说。'
