            extract_text: '# 我国5G基站达495.8万个县乡全域实现“双千兆”覆盖 _光明网 ![Image 1](https://img.gmw.cn/pic/gmwLogo_share.jpg) 点击右上角![Image 2](https://img.gmw.cn/pic/mgmw/iconshare.png)微信好友 ![Image 3](https://img.gmw.cn/pic/mgmw/pengyouquan.png)朋友圈 ![Image 4](https://img.gmw.cn/pic/mgmw/layershare.png) 请使用浏览器分享功能进行分享 ![Image 5](https://img.gmw.cn/pic/mgmw/arrow.png) [![Image 6: 数字化频道](https://img.gmw.cn/pic/channelogo/shuzihua.png)](https://digital.gmw.cn/) ![Image 7](https://img.gmw.cn/pic/mgmw/mline.png)![Image 8](https://img.gmw.cn/pic/conimages/m_pc_btn.png)![Image 9](https://img.gmw.cn/pic/conimages/m_mobile_btn.png) [![Image 10](https://img.gmw.cn/pic/mgmw/mClose.png)](javascript:void(0);) # 全部导航 * [时政](https://politics.gmw.cn/) * [国际](https://world.gmw.cn/) * [时评](https://guancha.gmw.cn/) * [理论](https://theory.gmw.cn/) * [文化](https://culture.gmw.cn/) * [科技](https://tech.gmw.cn/) * [教育](https://edu.gmw.cn/) * [经济](https://economy.gmw.cn/) * [生活](https://life.gmw.cn/) * [法治](https://legal.gmw.cn/) * [专题](https://topics.gmw.cn/) * [ENGLISH](https://en.gmw.cn/) * [时政](https://politics.gmw.cn/) * [国际](https://world.gmw.cn/) * [时评](https://guancha.gmw.cn/) * [理论](https://theory.gmw.cn/) * [文化](https://culture.gmw.cn/) * [科技](https://tech.gmw.cn/) * [教育](https://edu.gmw.cn/) * [![Image 11](https://img.gmw.cn/pic/conimages/con_headIcon.png)](https://www.gmw.cn/map.htm) 正在阅读：我国5G基站达495.8万个县乡全域实现“双千兆”覆盖 [首页](https://www.gmw.cn/)>[![Image 12](https://img.gmw.cn/pic/contentlogo/149309.gif)](https://digital.gmw.cn/)[数字化频道](https://digital.gmw.cn/)>[地方实践](https://digital.gmw.cn/node_149311.htm)>正文 # 我国5G基站达495.8万个县乡全域实现“双千兆”覆盖 来源：[光明网](https://www.gmw.cn/)2026-04-21 16:53 [](https://digital.gmw.cn/2026-04/21/content_38722448.htm)[X](javascript:;)[](https://digital.gmw.cn/2026-04/21/content_38722448.htm) ![Image 13](https://imgdigital.gmw.cn/attachement/png/site2/20260421/2c56dc4c1d122b517fa942.png) **光明网北京4月21日电**（记者 刘吉东）在21日举行的国新办新闻发布会上，工业和信息化部新闻发言人、信息通信发展司司长谢存表示，今年是“十五五”开局之年，信息通信基础设施建设取得积极进展，经济社会数智化转型底座持续夯实。 对此，工业和信息化部用三个“更”来概括当前成效。一是网络能力更强。截至3月底，全国5G基站总数已达495.8万个，具备千兆网络服务能力的10GPON端口数达3201万个。全国86个城市的168个小区、工厂和园区已开展万兆光网试点部署，5G演进网络（5G-A）覆盖330个城市。移动物联网蓬勃发展，终端用户达29.48亿户。 二是网络覆盖更广。截至目前，全国已实现“县县通千兆、乡乡通5G”，行政村100%通宽带、95%以上通5G，边境管理及贸易机构实现100%通4G/5G网络。全国26.9万个重点场所实现网络深度覆盖，65.4万公里公路铁路和316条地铁线路实现网络连续覆盖，广大人民群众正深切感受到网络覆盖带来的便利与提升。 三是网络应用更好。5G、千兆光网已融入97个国民经济大类中的91个，融合应用广度持续拓展。在医疗领域，5G应用实现从院前急救到康复出院的全流程覆盖，在500多家三甲医院落地推广；在教育领域，5G应用覆盖教、考、评、校、管全场景，在近3000所中小学、职业院校和高等院校落地部署，数字惠民成效日益彰显。 此外，在拓展未来布局与发展路径方面，工信部将全面落实国家“十五五”规划《纲要》部署，重点从三方面持续发力。一是扬优势，推进5G、千兆光网深度覆盖，持续开展“信号升格”专项行动，深化“宽带边疆”“宽带林草”建设。二是促升级，加快5G-A规模商用，有序开展万兆光网试点，推动“双千兆”向“双万兆”演进，加快移动物联网“万物智联”发展。三是抓协同，系统布局6G、下一代互联网等前沿技术研发，推动信息通信业与垂直行业协同创新，持续巩固提升我国信息通信业的竞争优势和领先地位。 [ 责编：赵鹏超 ] 阅读剩余全文（） ![Image 14](https://img.gmw.cn/content_banner/content_840x120_qrcodes.jpg) ## 相关阅读 * [![Image 15](https://digital.gmw.cn/2026-04/21/content_38722448.htm)](javascript:;) * [![Image 16](https://digital.gmw.cn/2026-04/21/content_38722448.htm)](javascript:;) * [](javascript:;)[](javascript:;)[](javascript:;)[](javascript:;) ## 您此时的心情 [![Image 17: 光明云投](https://img.gmw.cn/pic/conimages/yuntoulogo.png)](https://vote.gmw.cn/) 新闻表情排行[日](https://www.gmw.cn/motionsdaytop.htm)/[周](https://www.gmw.cn/motionsweektop.htm) * [![Image 18](https://img.gmw.cn/pic/conimages/ico_motion_1.png)](https://digital.gmw.cn/2026-04/21/content_38722448.htm)开心 0 * [![Image 19](https://img.gmw.cn/pic/conimages/ico_motion_2.png)](https://digital.gmw.cn/2026-04/21/content_38722448.htm)难过 0 * [![Image 20](https://img.gmw.cn/pic/conimages/ico_motion_3.png)](https://digital.gmw.cn/2026-04/21/content_38722448.htm)点赞 0 * [![Image 21](https://img.gmw.cn/pic/conimages/ico_motion_4.png)](https://digital.gmw.cn/2026-04/21/content_38722448.htm)飘过 0 ## 视觉焦点 * [![Image 22](https://digital.gmw.cn/attachement/png/site2/20260421/f44d305ea12e2b511d3523.png)](https://politics.gmw.cn/2026-04/21/content_38720728.htm) 粤港澳大湾区首台“华龙一号”核电机组投产发电 * [![Image 23](https://digital.gmw.cn/attache