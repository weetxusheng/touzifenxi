            extract_text: '“新产品、新模式、新场景不断涌现。比如，彩电产品推出基于电视的大模型，在提升音画体验的同时可自动调节亮度，保护用户视觉健康；北斗定位进一步融入景区动态监测、商圈室内外导航等场景；音频技术优化升级，智能设备可在远距离、嘈杂环境下过滤噪音、听清人声。”谢存表示。 谢存强调，下一步，工信部将重点做好几方面工作。一是深入落实稳增长行动方案，发挥重大项目撬动牵引作用，保持产业运行在合理区间。二是加快产业数字化转型与智能化升级，加快北斗、先进计算、人工智能终端等融合应用，大力挖掘和培育能源、汽车、医疗、教育、文旅、体育等新应用场景。 三是提升行业治理效能，深入整治“内卷式”竞争，坚决遏制低价低质竞争。四是壮大产业发展生态，持续推进国产操作系统和RISC-V架构（一种开放的指令集架构）的适配，加快人工智能产业链上下游协同创新，不断完善电子信息技术产品标准体系。 今年一季度，我国装备工业整体运行态势如何？下一步重点工作是什么？ 工业和信息化部新闻发言人、运行监测协调局局长陶青表示，我国一季度装备工业开局良好，呈现“生产稳、投资升、出口强”三大特点。 一是生产增势平稳。一季度，装备工业增加值同比增长6.2%，对工业增长的贡献率达到19.4%。 二是主要行业投资回暖。一季度，装备工业中5个主要行业的固定资产投资均实现正增长，其中，铁路、船舶、航空航天和其他运输设备制造业，以及通用设备制造业同比分别增长27.7%和12.5%。 三是出口贡献突出。一季度，以人民币计价的装备制造业产品出口额同比增长19.2%，占出口总值的比重超过六成。 陶青进一步指出，我国在装备工业的高端化、智能化发展方面的表现，可以概括为“三个持续”。 [...] # 打击“囤积居奇”，工信部回应存储器价格上涨！还解答了这些热点问题 每经记者｜周逸斐 每经编辑｜杜宇 4月21日，国务院新闻办公室举行新闻发布会，介绍2026年一季度工业和信息化发展情况。 《每日经济新闻》记者注意到，近期，存储器价格上涨引发手机终端产品价格调整，受到各界广泛关注。 在发布会现场，工业和信息化部新闻发言人、信息通信发展司司长谢存表示，针对这一问题，工信部将多措并举支持存储器产业发展，保障产业链供应链稳定。 “一方面，增强供给能力，促进供需对接，鼓励内外资企业加大投资力度，提升产出能力。支持终端企业与存储器企业加强互动对接，拓宽多元化供应渠道。另一方面，通过多种手段维护市场秩序，引导存储器企业加强渠道管理，配合相关部门依法打击‘囤积居奇’等扰乱市场行为。” 图片来源：每经记者 周逸斐 现场拍摄图片来源：每经记者 周逸斐 现场拍摄 我国一季度电子信息制造业开局良好，下一步工信部有哪些工作计划？ 谢存表示，我国一季度规模以上计算机、通信和其他电子设备制造业增加值同比增长13.6%，在主要工业门类中增速第一。1—2月实现营业收入2.6万亿元，同比增长14.3%，较工业增速高9个百分点。一季度，部分产品产量实现两位数增长，集成电路产量同比增长24.3%。上游产品出口金额实现大幅攀升，集成电路、液晶平板显示模组出口金额同比分别增长72.9%、12.5%。 2026年以来，工信部持续推动电子信息制造业技术创新与融合应用。集成电路、新型显示、高端电子装备、电子材料等领域持续取得技术突破，三维存储技术取得新进展。终端产品应用多元拓展。 [...] 陶青进一步指出，我国在装备工业的高端化、智能化发展方面的表现，可以概括为“三个持续”。 一是创新能力持续增强。全球首款侵入式脑机接口医疗器械获批上市，填补世界临床空白；国产点焊工业机器人在汽车焊装线首次实现批量应用；全球首台可实现五轴联动的中走丝线切割机床成功研制，加工效率显著提升。 二是高端产品持续增多。50万元以上乘用车中，国产品牌车型销量同比增长97%、市场占有率达到69.5%；第二艘国产大型邮轮“爱达·花城号”顺利出坞；全球最大打桩船“铁建大桥桩1”号完成交付。 三是智能化水平持续提升。装备工业已建成197家卓越级智能工厂，推动产品不良率平均下降48.4%、生产效率平均提升22.3%。1—2月，具备L2级组合驾驶辅助功能的乘用车新车渗透率达到69.15%，较去年同期提升10个百分点。也就是说，新销售的100辆乘用车中，就有超过69辆具备L2级组合驾驶辅助功能。 下一步，工信部将重点抓好三项工作。一是顶层设计。加快编制智能网联新能源汽车等“十五五”规划，研究出台加快智能装备创新发展的指导意见。二是稳定运行。落实机械、汽车、电力装备等行业新一轮稳增长工作方案，持续推进设备更新和汽车以旧换新，以钉钉子精神规范产业竞争秩序。三是聚力攻关。持续实施装备工业重点产业链高质量发展行动，加强标志性产品攻关和成果推广应用。 封面图片来