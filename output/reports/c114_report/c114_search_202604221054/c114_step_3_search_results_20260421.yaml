            extract_text: '# 香港首个「量子智能产业联盟」正式启动 ![头像](http://inews.gtimg.com/newsapp_ls/0/2233046303_200200/0)![](http://inews.gtimg.com/newsapp_ls/0/14876051701/0) [证券之星](https://news.qq.com/omn/author/8QMf2Htb6oceuDvf) 2026-04-21 09:03发布于上海证券之星官方账号 日前，由香港城市大学(城大)发起的「量子智能产业联盟」于香港会议展览中心 Web3 Festival 2026 举行盛大启动仪式。立法会科技创新界议员邱达根、香港创新科技及工业局工业专员葛明博士亲临见证。是次盛会汇聚了中国顶尖的量子科技领军企业与科研机构，涵盖量子硬件、算法生态、通信安全及产业应用等领域。特别值得一提的是，香港本地量子技术研究院孵化的首家量子科技企业——Quantum Technology Group 亦重磅加盟，共同推动量子技术的本地创新与商业化落地。这不仅标志着香港在量子计算基础设施建设上取得新突破，更展现出量子技术正从实验室的物理验证，迈向真实产业应用的坚实步伐。 面对全球数字化转型与人工智能浪潮，传统算力已难以满足日益增长的庞大数据处理需求。香港作为高度发达的国际金融与物流枢纽，每天需应对极其复杂的业务场景，对风险对抗能力和密码安全有着最严苛的要求。联盟的成立正是基于这一战略考量——在国家「十五五」规划明确支持香港融入国家发展大局、强调科技自立自强的背景下，率先布局量子算力，抢占下一代计算范式的制高点。 城大校长梅彦昌教授在致辞中强调：「量子计算并非经典计算机的简单加速，而是以全新的逻辑去破解以往无法逾越的复杂问题——极大规模的物流调度、新材料的分子模拟、金融市场的深层概率计算。这种算力维度的跨越，将重构许多行业的底层逻辑，直接关乎未来社会的运转效率与信息安全。」他指出，城大一直致力于将学术洞见转化为能够落地的工程实践，成为连接顶尖技术与真实场景的桥梁。 随后，城大与本源量子、国富量子、顺丰科技、中电信量子、国盾量子、上海量羲、深圳量旋、天工开物开源基金会及科大硅谷等多家机构签署合作备忘录，涵盖量子硬件、算法生态、通信安全及产业应用等多个核心领域，标志着联盟正式从科研共识走向工程协同。仪式上，城大宣布建设「先进算力中心」，部署香港首台量子计算真机。这一举措不仅填补了香港在量子计算硬件领域的空白，更为本地学者和企业提供了一个触手可及的真实算力平台，加速量子算法在金融风控、物流优化、密码安全等场景中的验证与迭代。 同场亦宣布「AI 国际先锋大赛」正式启航，这是一场立足香港、辐射全球的顶级AI创新赛事，必将进一步激发全球创新动能。'
