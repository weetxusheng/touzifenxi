            extract_text: '# 我国智能算力规模达1882EFLOPS|工信部|光网|工业和信息化部|基础设施|通信_手机新浪网 [](https://sina.cn/?oid=HERMESKELLYBAG%E7%B2%BE%E4%BB%BF%E5%A4%9A%E5%B0%91%E9%92%B1%E3%80%88%E5%BE%AE%E4%BF%A1198099199%E3%80%89WKb5&vt=4 "手机新浪网") ## [新浪财经](https://finance.sina.cn/?oid=HERMESKELLYBAG%E7%B2%BE%E4%BB%BF%E5%A4%9A%E5%B0%91%E9%92%B1%E3%80%88%E5%BE%AE%E4%BF%A1198099199%E3%80%89WKb5&vt=4 "新浪财经")[股票](https://finance.sina.cn/stock/?oid=HERMESKELLYBAG%E7%B2%BE%E4%BB%BF%E5%A4%9A%E5%B0%91%E9%92%B1%E3%80%88%E5%BE%AE%E4%BF%A1198099199%E3%80%89WKb5&vt=4 "股票") [](https://sina.cn/Index/nav?oid=HERMESKELLYBAG%E7%B2%BE%E4%BB%BF%E5%A4%9A%E5%B0%91%E9%92%B1%E3%80%88%E5%BE%AE%E4%BF%A1198099199%E3%80%89WKb5&vt=4 "网站导航")[![Image 1](blob:http://localhost/a60b3ebabb24ca182698fd8650939101)](https://my.sina.cn/?oid=HERMESKELLYBAG%E7%B2%BE%E4%BB%BF%E5%A4%9A%E5%B0%91%E9%92%B1%E3%80%88%E5%BE%AE%E4%BF%A1198099199%E3%80%89WKb5&vt=4) # 我国智能算力规模达1882EFLOPS 市场资讯 04.21 14:33 （来源：新华社） 新华社北京4月21日电（记者周圆、高亢）工业和信息化部副部长张云明21日表示，算力基础设施已成为驱动人工智能发展的关键底座。截至3月底，我国智能算力规模达1882EFLOPS。 张云明在当日举行的国新办新闻发布会上说，近期，工业和信息化部围绕普惠算力赋能中小企业、算电协同等重点工作持续发力，算力产业发展呈现良好态势。产业创新更强劲，深入实施算力强基“揭榜”行动，开展算电协同政策研究和标准制定，促进源网荷储、绿电直连加速落地；网络传输更顺畅，近两年围绕算力枢纽建成超70条算力大通道，落实城域“毫秒用算”专项行动等。 下一步，工业和信息化部将引导算力基础设施按需有序建设，推动绿色电力与算力协同布局，支持开展太空算力技术前瞻性研究，在全国范围内梯次推进“毫秒用算”网络建设，深入开展普惠算力赋能中小企业发展专项行动，探索“算力银行”“算力超市”等创新业务。 在信息通信基础设施方面，工业和信息化部信息通信发展司司长谢存在会上介绍，截至3月底，全国5G基站总数已达495.8万个，全国86个城市的168个小区、工厂和园区开展万兆光网试点部署，5G-A（5G演进网络）已覆盖330个城市。全国26.9万个重点场所实现网络深度覆盖，5G、千兆光网已融入97个国民经济大类中的91个。 谢存介绍，未来将进一步加强信息通信基础设施建设，推进5G、千兆光网深度覆盖；加快5G-A规模商用，有序开展万兆光网试点，加快移动物联网“万物智联”发展；系统布局6G、下一代互联网等前沿技术研发，推动信息通信业与垂直行业协同创新等。（完） ![Image 2](https://n.sinaimg.cn/default/2fb77759/20151125/320X320.png) 加载中...[视频](https://video.sina.cn/?oid=HERMESKELLYBAG%E7%B2%BE%E4%BB%BF%E5%A4%9A%E5%B0%91%E9%92%B1%E3%80%88%E5%BE%AE%E4%BF%A1198099199%E3%80%89WKb5&vt=4 "视频")[直播](https://bn.sina.cn/?oid=HERMESKELLYBAG%E7%B2%BE%E4%BB%BF%E5%A4%9A%E5%B0%91%E9%92%B1%E3%80%88%E5%BE%AE%E4%BF%A1198099199%E3%80%89WKb5&vt=4 "直播")[美图](https