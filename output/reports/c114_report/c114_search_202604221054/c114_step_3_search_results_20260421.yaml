            extract_text: '## 新浪财经 正文 # 液冷10倍股英维克“一字跌停”！一季度净利同比下降超80%，近两年净利润“含金量”持续下降 芝麻AI为您解读全文APP内免费解锁 提取摘要 芝麻AI为您解读全文APP内免费解锁 每经记者｜章光日 每经编辑｜吴永久 4月20日晚，A股液冷龙头英维克发布了2026年一季报，净利润同比降幅超过八成，不及市场预期。而在4月20日，英维克股价还一度涨停，相较于2024年低点，公司股价最大涨幅超过11倍。而在发布一季报后的首个交易日，公司股价一字跌停，截至收盘，跌停板上的封单数量超过54万手。 《每日经济新闻》记者（以下简称每经记者）注意到，2026年一季度，英维克信用减值损失、资产减值损失、财务费用等均大幅增加，导致公司净利润大幅下滑。而过去两年，尽管英维克业绩增长较快，但公司净利润的“含金量”持续下降。不过，由于业绩增长，英维克股权激励计划连续两期行权条件达成。 英维克是业内领先的精密温控节能解决方案和产品提供商，致力于为数据中心/智算中心、算力设备、电化学储能系统、通信网络、电力电网、电动汽车充电桩、工业自动化、电源转换等领域提供设备散热解决方案及精密环境控制解决方案，为地铁、多种电动商用车等领域提供相关车用的空调、冷机等产品及服务，并为人居健康空气环境推出系列的空气环境机等产品。 最近两年，由于业绩好转，叠加液冷服务器、储能等热门概念加持，英维克的股价持续走牛。同花顺显示，2023年至2025年，公司营业收入从35.29亿元增长至60.68亿元，净利润从3.44亿元增长至5.22亿元。 以前复权方式计算，2024年2月份，英维克股价最低跌至9.85元，随后开启持续上涨之路。2026年4月20日，公司股价一度涨停，盘中最高涨至121.74元，刷新新高纪录。相较于2024年低点，英维克股价最大涨幅超过11倍。 [...] 不过，最近两年英维克的盈利质量持续下降，其净利润的“含金量”呈现下降趋势。同花顺数据显示，2023年至2025年，公司经营活动产生的现金流量净额分别为4.53亿元、2亿元和1.57亿元，连续两年下滑；应收票据及应收账款总额分别为17.61亿元、24.72亿元和31.25亿元，连续两年大幅增加。 4月20日晚，英维克发布了2026年一季报等多份公告。英维克2026年一季报显示，公司实现营业收入11.75亿元，同比增长26.03%；实现净利润865.76万元，同比降幅高达81.97%。英维克净利润的“含金量”仍在下降，2026年一季度，公司经营活动产生的现金流量净额为-3.86亿元，而去年同期为-1.71亿元。 在发布一季报后的首个交易日（4月21日），英维克股价一字跌停，截至收盘，跌停板上的封单数量高达约54.54万手。以收盘价108.97元计算，公司当前市值约为1065亿元，动态市盈率高达220.7倍，市净率也有30.77倍。 从利润表来看，财务费用大幅增加、信用资产减值损失、资产减值损失大幅增加等原因，共同造成英维克净利润大幅下滑。2026年一季度，公司财务费用为2006.38万元，而去年同期为-26.19万元，该数据大幅增加的主要原因系汇兑收益下降以及利息支出增加所致。 2026年一季度，英维克信用减值损失约为3015.72万元，而去年同期约为752.69万元。公司表示，该数据大幅变化的主要原因系应收账款计提坏账准备增加所致。 2026年一季度，英维克的资产减值损失约为724.15万元，而去年同期约为366.90万元。公司表示，该数据大幅变化的主要原因系存货跌价准备增加所致。 [...] 而过去两年，英维克信用减值损失和资产减值损失规模也较大。同花顺显示，2024年和2025年，英维克信用减值损失分别约为4868.68万元和9362.44万元，资产减值损失分别约为5373.17万元和7318.01万元。 2025年上半年，英维克海外营收占比仅10%，今年一季度汇兑收益为何会下降？公司是否有计划通过金融工具等方式减少汇兑变化对公司净利润的影响？在算力建设热潮下，液冷需求高增长，公司应收账款计提坏账准备和存货跌价准备计提为何还会大幅增长？公司是否为了扩大销售而放宽了信用政策，导致回款困难？每经记者将上述问题发送至英维克董秘办邮箱，但截至发稿，尚未收到回复。 4月20日晚，英维克还发布了关于2024年股票期权激励计划第二个行权期行权条件达成的公告。该公告显示，符合行权条件的激励对象共267名，可行权期权数量为709.80万份，占公司总股本比例为0.73%，行权价格为11.332元/份。 每经记者注意到，该激励计划第一个行权期的条件此前也已成就，对应可行权激励对象275名，可行权期权数量111.6960万份，占公司总股本比例为0.15%，行权价格为14.931元/份。相较于当前股价，英维克参与股权激励计划的员工可谓获利丰厚。 事后来看，英维克2024年激励计划设置的业绩考核目标并不算高。根据计划，行权考核年度为2024年至2026年，公司层面业绩考核以2023年净利润3.44亿元为基数，要求2024年、2025年、2026年的净利润增长率分别不低于15%、32%、52%，即对应年度净利润需分别达到约3.956亿元、4.54亿元和5.23亿元。 值得注意的是，英维克2025年净利润已达5.22亿元，已接近2026年的考核目标。若公司2026年净利润保持小幅增长，即可满足第三个行权期的业绩条件。'
