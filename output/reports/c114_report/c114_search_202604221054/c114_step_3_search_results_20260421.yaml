            extract_text: '谢存表示，工业和信息化部持续推动“5G+工业互联网”规模化发展，全面完成5G工厂“百千万”行动目标。推动基础电信企业利用云切片、软件定义网络（SDN）等技术建设完善面向工业企业的专网服务。累计建设2.5万余个“5G+工业互联网”项目，建成1260家分类分级、特色鲜明的5G工厂，打造100个技术先进、标杆引领的5G工厂，平均产品质量提升20.5%，运营成本降低18.4%，平均产能增加24.7%。工业级5G网关、路由器等产品款式全球占比近50%，发布了全球首个“5G+工业互联网”国际标准，攻关突破一系列软硬件解耦的工控系统、通用集成的智能终端。 下一步，工业和信息化部将着力打造“5G+工业互联网”升级版，推动“5G+工业互联网”在网络设施、技术产品、融合应用、产业生态、公共服务等方面能力全面提升，加速信息技术（IT）、通信技术（CT）、运营技术（OT）、数据技术（DT）相融合，打造5G为代表的新型工业网络，加快“5G+工业互联网”广泛融入实体经济重点行业领域，为制造业智能化、绿色化、融合化发展提供坚实支撑。 一是加强要素保障。加快出台《关于推动工业互联网高质量发展的实施意见》，统筹推进网络、标识、平台、数据、安全五大功能建设，着力完善政策、设施、技术、应用和生态五大体系发展。加快制定发布一批基础共性、关键技术、典型应用等标准。 二是做深协同创新。在原材料、装备制造、消费品等行业领域，组织开展工业5G独立专网试点工作。滚动发布新型工业网络产品目录，鼓励工业企业应用时间敏感网络、信息模型等技术开展网络化改造，实施5G工厂“量质齐升”行动。 [...] # 工信部：我国已累计建设2.5万余个“5G+工业互联网”项目|5G_新浪财经_新浪网 ) 新浪首页 新闻 体育 财经 娱乐 科技 博客 图片 专栏 更多 汽车教育时尚女性星座健康 房产历史视频收藏育儿读书 佛学游戏旅游邮箱导航 移动客户端 新浪微博 新浪新闻 新浪财经 新浪体育 新浪众测 新浪博客 新浪视频 新浪游戏 天气通 我的收藏 注册 Image 2登录 × 新浪微博、博客、邮箱帐号，请直接登录 加载中...换个账号登录 × Image 3: 人民日报批“领导没发话，我们不能动”：不沾责任、不沾风险、不沾矛盾 登录 - [x] 下次自动登录 忘记密码立即注册 使用QQ登录 请用最新版微博客户端扫码 Image 4 Image 5 Image 6 扫描成功！ 点击手机上的确认即可登录 Image 7 微信腾讯QQQQ空间 新华财经北京4月21日电（记者刘旭阳、李唐宁）工业和信息化部新闻发言人、信息通信发展司司长谢存21日在国新办新闻发布会上介绍，我国已累计建设2.5万余个“5G+工业互联网”项目，下一步将打造“5G+工业互联网”升级版，推动“5G+工业互联网”在网络设施、技术产品、融合应用、产业生态、公共服务等方面能力全面提升。 [...] 以下为热门股票 三峡能源4.11-0.24% 京东方Ａ4.24+0.47% TCL科技4.35+0.23% 中远海控14.48-0.96% 格力电器36.80-0.30% 01/美方已与古巴会谈，要求古巴引入“星链”、赔偿被没收资产的美国个人与企业、释放政治犯等 02/西班牙提案、意大利变脸、百万民众联署：欧洲对以色列态度加速转向 03/苹果换帅！特努斯将接棒 CEO，库克转任董事会主席 04/至少26艘突破美军封锁！涉伊朗航运船，最新消息！ 05/日本通过内阁决议正式允许出口杀伤性武器 06/事关算电协同、6G，工信部最新发声！ 07/港媒热议梁家辉五夺金像奖影帝 08/高温与油荒“迎头对撞”？ 超级厄尔尼诺或成5月“灰犀牛” 09/爱奇艺AI艺人库争议背后：为何要推进，如何保证演员和观众权益？ 10/美劳工部长查韦斯-德雷默将离任 因涉与工作人员存在不当关系遭调查 01/财经早报：美国拦截了一艘中国驶往伊朗的油轮？外交部回应，特朗普称新一轮谈判21日开始丨2026年4月21日 02/操盘必读：影响股市利好或利空消息_2026年4月21日_财经新闻 03/凌晨，全线下跌！美伊谈判，突变！美国航母，曝出大动作！ 04/外资转向加仓中国资产 05/多国政要密集访华，背后信号很大 06/4月21日收盘：美股小幅收跌，市场关注美伊局势不确定性 07/全线飘红，多地价格突破10元，猪市风向变了 08/马斯克无视法国检方传唤，科技巨头与欧洲裂痕再加深 09/股海导航_2026年4月21日_沪深股市公告与交易提示 10/年报季透视A股： 逾1700家上市公司拟分红'
