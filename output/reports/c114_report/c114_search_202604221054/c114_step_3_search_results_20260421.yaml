            snippet: '## 新浪财经 正文. # 液冷10倍股英维克“一字跌停”！一季度净利同比下降超80%，近两年净利润“含金量”持续下降. 4月20日晚，A股液冷龙头英维克发布了2026年一季报，净利润同比降幅超过八成，不及市场预期。而在4月20日，英维克股价还一度涨停，相较于2024年低点，公司股价最大涨幅超过11倍。而在发布一季报后的首个交易日，公司股价一字跌停，截至收盘，跌停板上的封单数量超过54万手。. 《每日经济新闻》记者（以下简称每经记者）注意到，2026年一季度，英维克信用减值损失、资产减值损失、财务费用等均大幅增加，导致公司净利润大幅下滑。而过去两年，尽管英维克业绩增长较快，但公司净利润的“含金量”持续下降。不过，由于业绩增长，英维克股权激励计划连续两期行权条件达成。. 英维克是业内领先的精密温控节能解决方案和产品提供商，致力于为数据中心/智算中心、算力设备、电化学储能系统、通信网络、电力电'
