            extract_status: 'success'
            extract_text: '![](//beacon.sina.com.cn/a.gif?noScript) ![](//i.sso.sina.com.cn/images/login/thumb_default.png) ![](https://n.sinaimg.cn/finance/cece9e13/20190517/0516_zwKeyWordBanner.jpeg) ![](//n.sinaimg.cn/tech/c30320b4/20190625/tech_5g.jpg) ![](//n.sinaimg.cn/finance/c30320b4/20190809/cj_sinafinance_app2x.png) # 577亿元！轨道辰光完成PreA1 轮股权、债权融资 C114讯 4月21日消息 商业航天“狂飙”不止。 近日，北京轨道辰光科技有限公司（以下简称“轨道辰光”）正式完成 PreA1 轮股权融资，本轮融资由海松资本、中信建投投资、凯辉基金、英诺天使基金、安徽新华集团、智科产投、昆仑资本、砺哲基金等多家机构联合参投。 同时，轨道辰光也在债权融资方面取得重大进展，先后与中国银行、农业银行、交通银行、浦发银行、中信银行、招商银行、民生银行、兴业银行、华夏银行、光大银行、北京银行、杭州银行签署战略授信协议或取得授信意向函，金额共计577亿元人民币。 轨道辰光负责人表示：“非常荣幸能获得投资机构和金融机构的信任和支持，资金将用于核心技术研发、天基算力平台迭代、关键组件研制以及后续卫星星座建设与市场拓展。本次股权和债权融资落地，进一步夯实了我们在太空数据中心与商业航天算力方向的领先地位，充分体现了资本市场对轨道辰光技术路线、团队实力及天基算力前景的高度认可与长期信心。太空不仅是人类探索的边界，也是实现AGI的关键基础设施的绝佳场地。我们将继续坚定立足北京这个商业航天和人工智能主战场，理性面对行业现状，聚焦关键技术的研发和验证，持续吸引优秀团队加入，共绘太空数据中心的宏伟蓝图。” 本轮投资机构代表——海松资本创始人陈立光表示：“当前空天经济蓬勃发展，天基在轨算力已经成为卫星互联网、空间遥感、星座组网、太空探测等领域的核心基础设施，自主可控星上算力发展潜力巨大，也是国家重要战略之一。轨道辰光致力于太空在轨算力的全链条技术研发，在能源系统、散热系统、在轨拼接等方向建立起独家底层技术壁垒，深度适配太空极端严苛空间环境，团队航天工程底蕴扎实、落地经验成熟，精准卡位卫星在轨实时运算、星上智能感知、天地一体化算力协同等刚需场景。海松资本长期聚焦硬科技赛道，坚持深度产业价值投资，我们高度认可轨道辰光的技术壁垒与团队执行力，未来我们将依托产业生态、上下游资源、资本平台全方位赋能公司技术迭代、在轨验证与市场化规模化落地，携手共筑天基数据中心底座”。 ![新浪众测](//n.sinaimg.cn/tech/zcapp2018/doc_qrcode1.png "新浪众测") ![新浪众测](//n.sinaimg.cn/tech/zcapp2018/doc_qrcode2.png "新浪众测") ![新浪众测](//n.sinaimg.cn/tech/zcapp2018/doc_qrcode2.png "新浪众测") ![新浪科技公众号](//n.sinaimg.cn/tech/content/tech_qr2x.png "新浪科技公众号") “掌”握科技鲜闻 （微信搜索techsina或扫描左侧二维码关注） ![](//n.sinaimg.cn/tech/content/tech_weixin2.png) ### 创事记 ### [阅读排行榜](javascript:;) ### [评论排行榜](javascript:;) ### 科学探索 ### 科学大家 ### 苹果汇 ### 众测 ### 来电聊 ### 专题 ### 官方微博 ![新浪科技](//n.sinaimg.cn/tech/content/iHmy-hfvkitx8939664.jpg) ![新浪数码](//tva4.sinaimg.cn/crop.0.0.1000.1000.180/74dcdb86jw8eqawsrbbcvj20rs0rsgn7.jpg) ![新浪手机](//tva1.sinaimg.cn/crop.0.0.180.180.180/61e89358jw1e8qgp5bmzyj2050050aa8.jpg) ![科学探索](//tva1.sinaimg.cn/crop.0.0.750.750.180/61e895aejw8fd5449k2rej20ku0ku0tt.jpg) ![苹果汇](//tva2.sinaimg.cn/cro