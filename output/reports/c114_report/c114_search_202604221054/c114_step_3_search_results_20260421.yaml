            extract_text: '![](//beacon.sina.com.cn/a.gif?noScript) ![](//i.sso.sina.com.cn/images/login/thumb_default.png) ![](https://n.sinaimg.cn/finance/cece9e13/20190517/0516_zwKeyWordBanner.jpeg) ![](//n.sinaimg.cn/tech/c30320b4/20190625/tech_5g.jpg) ![](//n.sinaimg.cn/finance/c30320b4/20190809/cj_sinafinance_app2x.png) # 工信部谢存：深入整治“内卷式”竞争 持续推进国产操作系统和RISC-V架构的适配 C114讯 4月21日消息（颜翊）今日上午，国新办举行新闻发布会介绍2026年一季度工业和信息化发展情况。会上，工业和信息化部新闻发言人、信息通信发展司司长谢存介绍了我国一季度电子信息制造业整体发展情况和下一步的工作重点。 ![](//n.sinaimg.cn/spider20260421/516/w775h541/20260421/88db-74bb98ad35f1944a8c6ad916895b4857.png) 谢存表示，一季度电子信息制造业开局良好，今年有望延续增长态势。一季度规模以上计算机、通信和其他电子设备制造业增加值同比增长13.6%，在主要工业门类中增速第一。1—2月实现营业收入2.6万亿元，同比增长14.3%，较工业增速高9个百分点。一季度，部分产品产量实现两位数增长，集成电路产量同比增长24.3%。上游产品出口金额实现大幅攀升，集成电路、液晶平板显示模组出口金额同比分别增长72.9%、12.5%。 2026年以来，工信部持续推动电子信息制造业技术创新与融合应用。创新成果不断涌现。集成电路、新型显示、高端电子装备、电子材料等领域持续取得技术突破，三维存储技术取得新进展。终端产品应用多元拓展。新产品、新模式、新场景不断涌现，比如，彩电产品推出基于电视的大模型，在提升音画体验的同时可自动调节亮度，保护用户视觉健康；北斗定位进一步融入景区动态监测、商圈室内外导航等场景；音频技术优化升级，智能设备可在远距离、嘈杂环境下过滤噪音、听清人声。 下一步，工信部将重点做好以下工作：一是深入落实稳增长行动方案，发挥重大项目撬动牵引作用，保持产业运行在合理区间。 二是加快产业数字化转型与智能化升级，加快北斗、先进计算、人工智能终端等融合应用，大力挖掘和培育能源、汽车、医疗、教育、文旅、体育等新应用场景。 三是提升行业治理效能，深入整治“内卷式”竞争，坚决遏制低价低质竞争。四是壮大产业发展生态，持续推进国产操作系统和RISC-V架构的适配，加快人工智能产业链上下游协同创新，不断完善电子信息技术产品标准体系。 近期存储器价格上涨引发手机终端产品价格调整，受到各界广泛关注，针对这一问题，工信部将多措并举支持存储器产业发展，保障产业链供应链稳定，一方面，增强供给能力、促进供需对接，鼓励内外资企业加大投资力度，提升产出能力。支持终端企业与存储器企业加强互动对接，拓宽多元化供应渠道。另一方面，通过多种手段维护市场秩序，引导存储器企业加强渠道管理，配合相关部门依法打击“囤积居奇”等扰乱市场行为。 ![新浪众测](//n.sinaimg.cn/tech/zcapp2018/doc_qrcode1.png "新浪众测") ![新浪众测](//n.sinaimg.cn/tech/zcapp2018/doc_qrcode2.png "新浪众测") ![新浪众测](//n.sinaimg.cn/tech/zcapp2018/doc_qrcode2.png "新浪众测") ![新浪科技公众号](//n.sinaimg.cn/tech/content/tech_qr2x.png "新浪科技公众号") “掌”握科技鲜闻 （微信搜索techsina或扫描左侧二维码关注） ![](//n.sinaimg.cn/tech/content/tech_weixin2.png) ### 创事记 ### [阅读排行榜](javascript:;) ### [评论排行榜](javascript:;) ### 科学探索 ### 科学大家 ### 苹果汇 ### 众测 ### 来电聊 ### 专题 ### 官方微博 ![新浪科技](//n.sinaimg.cn/tech/content/iHmy-hfvkitx8939664.jpg) ![新浪数码](//tva4.sinaimg.cn/crop.0.0.1000.1000.180/74dcdb86jw8eqawsrbbcvj20rs0rsgn7.jpg) ![新浪手机](//tva1.sinaimg.cn/crop.0.0.180.180.180/61e89358jw1e8qgp5bmzyj2050050aa8.jpg) ![科学探索](//tva1.sinaimg.cn/crop.0.0.750.750.180/61e895aejw8fd5449k2rej20ku0ku0tt.jpg) ![苹果汇](//tva2.sinaimg.cn/crop.0.0.319.319.180/7677825fjw1ek52a9uslqj208w08wjtr.jpg) ![新浪众测](//n.sinaimg.cn/tech/95fb5850/20180223/sinazcweibo.jpg) ### 公众号 ![](//n.sinaimg.cn/tech/content/GbMg-hfvkitx8910918.jpg) 新浪科技 新浪科技为你带来最新鲜的科技资讯 ![](//n.sinaimg.cn/tech/68acb9a7/20170522/PingGuoHui.jpg) 苹果汇 苹果汇为你带来最新鲜的苹果产品新闻 ![](//n.sinaimg.cn/tech/95fb5850/20180223/qrcode_for_gh_8309e9b233c7_258.jpg) 新浪众测 新酷产品第一时间免费试玩 ![](//n.sinaimg.cn/tech/2f51a701/20170522/2.jpg) 新浪探索 提供最新的科学家新闻，精彩的震撼图片 [新浪科技意见反馈留言板](http://news.sina.com.cn/feedback/post.html) [新浪简介](http://corp.sina.com.cn/chn/)|[广告服务](http://emarketing.sina.com.cn/)|[About Sina](http://corp.sina.com.cn/eng/) [联系我们](http://www.sina.com.cn/contactus.html)|[招聘信息](http://corp.sina.com.cn/chn/sina_job.html)|[通行证注册](https://login.sina.com.cn/signup/signup.php) [产品答疑](http://help.sina.com.cn/)|[网站律师](http://www.sina.com.cn/intro/lawfirm.shtml)|[SINA English](http://english.sina.com) Copyright © 1996-2026 SINA Corporation All Rights Reserved 新浪公司 [版权所有](http://www.sina.com.cn/intro/copyright.shtml) ![](//n.sinaimg.cn/tech/zcapp2018/tech_qrcode.png)'
