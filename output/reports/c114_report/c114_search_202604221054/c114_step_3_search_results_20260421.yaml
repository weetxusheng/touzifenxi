                snippet: '# 紫光国微2025年实现净利润14.37亿元 同比增长21.86%. C114讯 4月21日消息（颜翊）昨日，紫光国微发布了2025年年度报告。报告期内，公司实现营业收入61.46亿元，较上年同期增长11.52%；实现归属于上市公司股东的净利润14.37亿元，较上年同期增长21.86%。. 截至2025年12月31日，公司总资产为189.47亿元，较年初增长9.39%；公司归属于上市公司股东的净资产为137.37亿元，较年初增长10.83%。. 报告期内，公司集成电路销售量较上年同比下降9.63%。从业务构成看，特种集成电路销售量同比增加49.08%，主要系下游需求有所回升，订单增加所致；智能安全芯片销售量同比下降9.7%，主要系上年度合并范围包含北京紫光青藤微系统有限公司在处置出表前的销售量，剔除该因素后，销售量基本持平。. 同时，公司电子元器件业务下游新兴领域市场蓬勃发展，市场需求大'
