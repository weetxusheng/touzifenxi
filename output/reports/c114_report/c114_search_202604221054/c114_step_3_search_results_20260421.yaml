            snippet: '4月21日“全球6G技术与产业生态大会”上，尤肖虎指出6G将支持2B和2C应用，要达到极致连接性和多元素融合两个要求，需DOICT超融合架构。5G ICT融合对2B端不够，6G架构要整合'
