            snippet: '# 577亿元！轨道辰光完成PreA1 轮股权、债权融资. C114讯 4月21日消息 商业航天“狂飙”不止。. 近日，北京轨道辰光科技有限公司（以下简称“轨道辰光”）正式完成 PreA1 轮股权融资，本轮融资由海松资本、中信建投投资、凯辉基金、英诺天使基金、安徽新华集团、智科产投、昆仑资本、砺哲基金等多家机构联合参投。. 同时，轨道辰光也在债权融资方面取得重大进展，先后与中国银行、农业银行、交通银行、浦发银行、中信银行、招商银行、民生银行、兴业银行、华夏银行、光大银行、北京银行、杭州银行签署战略授信协议或取得授信意向函，金额共计577亿元人民币。. 轨道辰光负责人表示：“非常荣幸能获得投资机构和金融机构的信任和支持，资金将用于核心技术研发、天基算力平台迭代、关键组件研制以及后续卫星星座建设与市场拓展。本次股权和债权融资落地，进一步夯实了我们在太空数据中心与商业航天算力方向的领先地位，充分'
            score: 0.9553
