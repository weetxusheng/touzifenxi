            snippet: '# 中国智能算力规模达1882EFLOPS. 2026-04-21 13:11发布于北京中国新闻网官方账号. 中新社北京4月21日电 (陶思阅)中国工业和信息化部副部长张云明21日在北京表示，截至3月底，中国智能算力规模达1882EFLOPS(每秒百亿亿次浮点运算)。. 在当天的国新办新闻发布会上，张云明指出，近年来，算力基础设施已成为驱动人工智能发展的关键底座。工信部从“点、链、网、面”统筹推进算力产业高质量发展。算力供给更丰富，产业创新更强劲，网络传输更顺畅。. 张云明表示，下一步，工信部将持续推动算力产业体系化高质量发展。一是算力资源“单点提质”，引导算力基础设施按需有序建设；二是技术产品“创新强链”，支持开展太空算力技术前瞻性研究；三是算力传输“连算成网”，在全国范围内梯次推进“毫秒用算”网络建设；四是产业生态“全面赋能”，探索“算力银行”“算力超市”等创新业务，降低中小企业用算门'
