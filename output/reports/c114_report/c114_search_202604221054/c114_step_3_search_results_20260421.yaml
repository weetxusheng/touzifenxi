            snippet: '## 首页 >> 正文. 2026-04-21 记者 郭倩 来源：经济参考网. 4月21日，国新办举行新闻发布会介绍2026年一季度工业和信息化发展情况。会上发布的信息显示，截至3月底，智能算力规模达1882 EFLOPS。下一步工业和信息化部将持续推动算力产业体系化高质量发展，包括推动绿色电力与算力协同布局，支持开展太空算力技术前瞻性研究，探索“算力银行”“算力超市”等创新业务等。. 当前，算力基础设施已成为驱动人工智能发展的关键底座。工业和信息化部副部长张云明表示，工业和信息化部“点、链、网、面”统筹推进算力产业高质量发展，近期围绕普惠算力赋能中小企业、算电协同等重点工作持续发力，算力产业发展呈现良好态势。. 其中，产业创新更强劲，开展算电协同政策研究和标准制定，促进源网荷储、绿电直连加速落地。网络传输更顺畅，近两年围绕算力枢纽建成超70条算力大通道，落实城域“毫秒用算”专项行动，提升'
            score: 0.9031
