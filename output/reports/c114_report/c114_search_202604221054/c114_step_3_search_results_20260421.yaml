            extract_text: '數據顯示，一季度規模以上計算機、通信和其他電子設備制造業增加值同比增長13.6%，在主要工業門類中增速第一。1—2月實現營業收入2.6萬億元，同比增長14.3%，較工業增速高9個百分點。一季度，部分產品產量實現兩位數增長，集成電路產量同比增長24.3%。上游產品出口金額實現大幅攀升，集成電路、液晶平板顯示模組出口金額同比分別增長72.9%、12.5%。 謝存介紹，2026年以來，工業和信息化部持續推動電子信息制造業技術創新與融合應用。創新成果不斷涌現。集成電路、新型顯示、高端電子裝備、電子材料等領域持續取得技術突破，三維存儲技術取得新進展。終端產品應用多元拓展。新產品、新模式、新場景不斷涌現，比如，彩電產品推出基於電視的大模型，在提升音畫體驗的同時可自動調節亮度，保護用戶視覺健康﹔北斗定位進一步融入景區動態監測、商圈室內外導航等場景﹔音頻技術優化升級，智能設備可在遠距離、嘈雜環境下過濾噪音、聽清人聲。 謝存指出，下一步，工業和信息化部將重點做好以下工作。一是深入落實穩增長行動方案，發揮重大項目撬動牽引作用，保持產業運行在合理區間。二是加快產業數字化轉型與智能化升級，加快北斗、先進計算、人工智能終端等融合應用，大力挖掘和培育能源、汽車、醫療、教育、文旅、體育等新應用場景。三是提升行業治理效能，深入整治“內卷式”競爭，堅決遏制低價低質競爭。四是壯大產業發展生態，持續推進國產操作系統和RISC-V架構的適配，加快人工智能產業鏈上下游協同創新，不斷完善電子信息技術產品標准體系。 (責編：申佳平、高雷) 關注公眾號：人民網財經關注公眾號：人民網財經 分享讓更多人看到 ##### 客戶端下載 人民日報 人民日報少年 人民網+ 手機人民網 領導留言板 人民視頻 人民智作 ### 熱門排行 [...] + 毛主席紀念堂 + 周恩來紀念網 + 鄧小平紀念網 + 中央社會工作部 + 工會新聞網 + 中國僑聯 + 學習強國 + 中共中央黨史和文獻研究院 + 中組部12380舉報網 + 全國哲學社科工作辦 + 旗幟網 + 國家保密局 + 科普中國 + 文化企業社會責任報告發布平台 + 中國國民黨革命委員會 + “人民消費”中消協教育課堂 人工智能 + 傳播內容認知全國重點實驗室 + 人民審校 + 人民智媒 + 智能寫作 + 白澤 客戶端 無障礙) 舉報 登錄 退出 人民網+ 中國共產黨新聞網 領導留言板 強國論壇 人民視頻 ### 人民日報報系 人民日報 人民日報海外版 中國汽車報 中國能源報 健康時報 証券時報 國際金融報網 諷刺與幽默 中國城市報 新聞戰線 人民論壇 環球人物 中國經濟周刊 民生周刊 國家人文歷史 人民周刊 人民數字 ### 旗下網站 全國重點實驗室 環球網 海外網 人民圖片 人民網研究院 人民慕課 ### 創新服務平台 寫易智能創作引擎 人民網智慧黨建體驗中心 828企業服務平台 人民雲 人民網>>經濟·科技 # 工信部：電子信息制造業今年有望延續增長態勢 2026年04月21日10:56 | 來源：人民網222 訂閱已訂閱已收藏收藏小字號 點擊播報本文，約 人民網北京4月21日電 （記者申佳平）4月21日，在國務院新聞辦公室舉行的發布會上，工業和信息化部新聞發言人、信息通信發展司司長謝存表示，一季度電子信息制造業開局良好，今年有望延續增長態勢。 [...] 人 民 網 股 份 有 限 公 司 版 權 所 有 ，未 經 書 面 授 權 禁 止 使 用 Copyright © 1997-2026 by www.people.com.cn. all rights reserved 評論 []( 分享 關注 微信微博快手 報道全球 傳播中國 打開客戶端體驗更多服務 打開'
