            extract_text: '作为连接技术与产品的桥梁，标准是移动通信技术实现规模化、规范化应用的基准，也是6G从实验室走向产业落地的前提。 中国在全球6G标准化进程中，始终坚持与全球行业同频共振、双向互动。闻库介绍，协会的工作分为两大方向：一是携手韩国、日本、美国、欧洲、印度等国家和地区的其他发起方，共同推动全球统一6G标准的制定，持续加大对国际标准组织运作的贡献力度；二是搭建国内产业主体参与国际标准制定的重要通道，依托数百家涵盖企业、高校、运营商的全产业链会员单位，将国内的技术创新成果提交至3GPP，推动国内技术成果转化为国际标准，同时将国际上形成共识的技术成果引入国内，搭建演示实验网开展技术验证，再将发现的问题反馈至国际标准组织优化完善。 中国科学院院士尤肖虎也表示，当前全球6G标准化工作已进入中期阶段，首个完整6G标准预计两年左右完成。我国6G领域坚持技术研发与标准研究同步推进的工作路径，待6G标准正式落地后，配套的示范系统、演示验证系统将快速部署。 Pre6G开启6G落地新周期 当6G标准仍在全球协同推进的过程中，产业界已通过先行先试的技术验证，开启了6G落地的探索之路，而南京落地的国内首个Pre6G试验网，正是这一进程中的标志性成果。 据了解，该Pre6G试验网依托无蜂窝大规模MIMO（多入多出技术）、光子太赫兹实时传输、确定性无线接入、通感一体、DOICT超融合等6G核心技术，已在紫金山科技城、江苏电视塔、江心洲等区域部署64个Pre6G节点，累计覆盖面积达9000平方公里，在5G网络中融入6G创新技术，相关能力可达5G的10倍，目前已在低空巡检、工业制造、具身智能、全息通信等领域开展系统性验证。 [...] 责任编辑： 孙孝熙 校对： 赵燕 6G 6G产业链基金群 Pre6G试验网 声明：证券时报力求信息真实、准确，文章提及内容仅供参考，不构成实质性投资建议，据此操作风险自担 下载"证券时报"官方APP，或关注官方微信公众号，即可随时了解股市动态，洞察政策信息，把握财富机会。 为你推荐 全国首个Pre6G试验网在南京投入运行 据南京发布，全国首个Pre6G试验网在南京投入运行，该试验网在5G网络中融入6G创新技术，具备高带宽、远距离覆盖、低时延确定性和AI内生融合等特点，相关能力可达5G的10倍。首批6G典型应用场景，同步重磅发布。据悉，试验网是采用6G先进技术构建后向兼容5G的融合通信网络基础设施，已覆盖无线谷及周边区域，具备空地协同连续立体覆盖、极致连接、通感智算控融合等6G关键能力，已开展无人机集群、低空安防、工业无线控制、网联具身智能等6G典型场景应用示范，系统验证6G技术优势和应用创新。 Pre6G 6G 证券时报网 任丽珺 2026-04-21 21:26 尤肖虎院士解码6G：产业培育已进入前期布局阶段 创新应用将持续涌现 当前，全球6G标准化工作已进入中期阶段，首个完整6G标准预计两年左右完成。我国6G领域坚持技术研发与标准研究同步推进的工作路径，待6G标准正式落地后，配套的示范系统、演示验证系统将快速部署。目前，6G产业培育已进入前期布局阶段，产业发展正从概念验证环节，逐步迈向技术应用落地的关键周期，未来各类6G相关创新应用将持续涌现、加速迭代。中国科学院院士尤肖虎在接受包括证券时报在内的媒体采访时，围绕6G发展的技术变革、生态重构与产业机遇，解码6G发展逻辑。（中国科学院院士，紫金山实验室主任尤肖虎接受媒体采 6G AI [...] “Pre6G的核心含义，是超前预研的试验网络。”闻库表示，这类试验网的核心定位，是将6G潜在关键技术整合搭建为统一的技术平台，加载多场景、多环境下的应用需求，验证相关技术能否满足6G的场景化指标要求。 在尤肖虎看来，Pre6G试验网的价值，在于实现了“6G技术5G化”。“这套网络可以完全兼容接入现有的5G终端，一方面通过6G技术的注入，通过6G技术的注入，网络的容量、时延、可靠性等指标可能会有非常大的提升；另一方面也完成了通感融合、通智融合、天地融合等多维度的技术融合，搭建起能够支撑多元化应用场景创新的底层平台。” 更重要的是，这一试验网打造了完全开放的技术平台，打破了过去移动通信领域只有大型龙头企业才能参与技术创新的壁垒。尤肖虎介绍，该平台为开发者提供了完整的研发验证环境，配套了终端、网络与开发平台，并全面开放接口，开发者有新的场景创意，即可在环境中快速完成实验与验证，中小企业、创业团队乃至个人开发者，都能便捷地参与到6G应用创新与生态建设中。 6G应用场景的落地，始终遵循着价值导向的核心逻辑。本次大会上同步发布的6G十大典型应用场景，涵盖低空经济、工业制造、应急救援、智慧海洋、具身智能等领域，相关场景已在南京大胜关大桥、连云港海域、沈海高速如皋段等地开展实地验证。 产业生态的构建，也离不开资本的助力。本次大会上，总规模达33.12亿元的南京市6G未来产业链基金群正式亮相，将精准聚焦6G核心技术攻关、优质企业培育、场景融合应用、高端人才引育等核心方向，全方位助力南京打造“6G之城”。 对于产业未来的发展节奏，尤肖虎给出预判：目前6G产业培育已进入前期布局阶段，产业发展正从概念验证环节，逐步迈向技术应用落地的关键周期，6G手机的商用落地预计在2029—2030年即可实现。“6G将再次深刻改变人类的生产方式与生活方式。” 责任编辑： 孙孝熙 校对： 赵燕'
