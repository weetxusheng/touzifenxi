            extract_text: '![](//beacon.sina.com.cn/a.gif?noScript) ![](//i.sso.sina.com.cn/images/login/thumb_default.png) ![](//n.sinaimg.cn/finance/c30320b4/20190809/cj_sinafinance_app2x.png) # 股价“一”字跌停 业绩大幅下滑 液冷龙头股英维克最新回应 ![](//n.sinaimg.cn/spider20260421/54/w578h276/20260421/5d72-47986e9b04055a744358771b322d415f.png) 4月21日，液冷龙头股[英维克](https://finance.sina.com.cn/realstock/company/sz002837/nc.shtml)开盘“一”字跌停，股价报108.97元/股，跌幅为10%。 消息面上，英维克于4月20日晚间发布2026一季报。2026年第一季度，公司共实现营业收入11.75亿元，同比增长26.03%；归属于上市公司股东的净利润为865.76万元，同比下降81.97%。 经营活动产生的现金流量净额约为-3.86亿元，上年同期约为-1.71亿元。 此外，花旗最新报告显示，英维克连续三个季度业绩不及预期，这表明市场对其的一致盈利预期太高。市场仅关注其为英伟达专用集成电路(ASIC)客户供应液冷，但完全忽视了小业务敞口、国内价格竞争加剧以及未来更多新进入者带来的压力。花旗重申卖出评级。 对此，英维克方面独家回应中国证券报·中证金牛座记者称：“公司毛利率出现下滑，主要是调整了产品结构。公司部分项目周期比较长，一些应收账款回款周期也比较长，因此计提了坏账减值准备。此外，公司财务费用方面有一些汇兑损失。公司目前经营正常，以后续公告为准。” 对于经营活动产生的现金流量净额恶化的原因，公司方面解释称，主要原因系报告期供应商款项到期支付与员工薪酬增加所致。 东财图解·加点干货 ![](//n.sinaimg.cn/finance/cece9e13/20240627/655959900_20240627.png) ![](//n.sinaimg.cn/finance/transform/260/w880h180/20180326/zi4T-fysqfnf9377213.png) ## VIP课程推荐 ## [新浪直播](http://live.finance.sina.com.cn/) ![@@title@@]() ### @@title@@ ## APP专享直播 ## 热门推荐 ![新浪财经公众号](//n.sinaimg.cn/finance/72219a70/20180103/_thumb_23666.png "新浪财经公众号") 24小时滚动播报最新的财经资讯和视频，更多粉丝福利扫描二维码关注（sinafinance） ## [股市直播](http://live.finance.sina.com.cn) ## [7X24小时](http://live.sina.com.cn/zt/f/v/finance/globalnews1) ![杨伟民](https://n.sinaimg.cn/zhuanlan/transform/170/w85h85/20221230/f01f-b20f33f6583ea1f69aefeedf1b86f051.jpg) ![董明珠还能为格力奋战多久？|《至少一个小时》](//n.sinaimg.cn/finance/transform/525/w300h225/20201030/ecb0-kcaeqzy3436531.jpg) ![梁建章：中国人口衰竭的速度前所未有](//n.sinaimg.cn/finance/transform/525/w300h225/20201030/75b9-kcaeqzy3438114.jpg) ![冷友斌回应网友质疑：说价格高 对飞鹤不公平！](//n.sinaimg.cn/finance/transform/525/w300h225/20201030/c485-kcaeqzy3442305.jpg) ![王中军：我喜欢比较“江湖”一点的人](//n.sinaimg.cn/finance/transform/525/w300h225/20201030/a563-kcaeqzy3444360.jpg) [新浪财经意见反馈留言板](http://news.sina.com.cn/feedback/post.html) [新浪简介](http://ir.sina.com.cn/index.shtml)|[广