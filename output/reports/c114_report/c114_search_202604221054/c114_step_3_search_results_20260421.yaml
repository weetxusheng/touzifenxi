            extract_text: '[北交所频道](https://m.bjnews.com.cn/beijiaosuo/) [新京号](/hao) [电子报](https://epaper.bjnews.com.cn/) [千龙网](http://www.qianlong.com/) [贝壳财经](http://www.bkeconomy.com/) [北京BEIJING](https://h5.bjnews.com.cn/xjbh5/202309beijing_cn/index.html) [新京雅集](https://shop90373224.m.youzan.com/v2/feature/xie8IdUSkL) [专题](/subject) [商务合作](/site/business) [爱心模式](javascript:void(0);) [线索报料](https://m.bjnews.com.cn/exposure/) [微博](https://www.weibo.com/xjb) [首页](/) [视频](/video) [深读](/depth) [公益](/gongyi) [第一看点](/diyikandian) [时事](/news) [北京](/beijing) [国际](/guoji) [政事儿](/zhengshi) [观点](/point) [财经](/financial) [消费](/industrial) [娱乐](/entertainment) [文化](/culture) [体育](/sports) [汽车](/car) [房产](/estate) [教育](/education) [图说](/photo) [科技](/technology) [智库](/thinktank) [乡村](/country) [稿件组](/gaojianzu) [视频组](/shipinzu) # 工信部：将加快5G-A规模商用，有序开展万兆光网试点 2026-04-21 11:32 *记者：陈维城 编辑：杨娟娟* 新京报贝壳财经讯（记者陈维城）4月21日，国务院新闻办举行新闻发布会，介绍2026年一季度工业和信息化发展情况。工业和信息化部新闻发言人、信息通信发展司司长谢存提到，截至3月底，全国5G基站总数已达495.8万个，具备千兆网络服务能力的10G PON端口数达3201万个，全国86个城市的168个小区、工厂和园区开展万兆光网试点部署，5G-A（5G演进网络）目前已覆盖330个城市。移动物联网蓬勃发展，终端用户达29.48亿户。 截至目前，5G、千兆光网已融入97个国民经济大类中的91个，在医疗领域，5G应用已实现院前急救、院内急诊、住院治疗、康复出院全流程覆盖，在500多家三甲医院落地推广。教育领域，5G应用覆盖到教、考、评、校、管教育全场景，在近3000所中小学、职业院校、高等院校等教育机构落地部署。 谢存表示，下一步，工业和信息化部将重点开展三方面工作：一是扬优势。推进5G、千兆光网深度覆盖，持续推进“信号升格”专项行动，深化“宽带边疆”“宽带林草”建设，不断提升网络覆盖水平和供给能力。二是促升级。加快5G-A规模商用，有序开展万兆光网试点，推动“双千兆”网络向“双万兆”演进，加快移动物联网“万物智联”发展。三是抓协同。系统布局6G、下一代互联网等前沿技术研发，推动信息通信业与垂直行业协同创新。 编辑 杨娟娟 校对 王心 [109](javascript:;) +1 [微博](http://service.weibo.com/share/share.php?url=https://www.bjnews.com.cn/detail/1776739989129258.html&title=工信部：将加快5G-A规模商用，有序开展万兆光网试点) [微信](javascript:;) ## 我要评论 # 直播 * [![](https://media.bjnews.com.cn/cover/2026/04/21/5710758488347582822.jpeg?x-oss-process=image/resize,m_lfit,w_332)](https://www.bjnews.com.cn/detail/1776775307129812.html) 预告 [直播丨第十三批在韩中国人民志愿军烈士遗骸归国](https://www.bjnews.com.cn/detail/1776775307129812.html) 2026-04-22 10:30 * [预 告 第21届文津图书发布暨国家图书馆4·23世界读书日特别活动](https://www.bjnews.com.cn/detail