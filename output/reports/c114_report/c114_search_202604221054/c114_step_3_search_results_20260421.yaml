            snippet: '# 专访中信科移动王震：突围卫星互联网 赋能6G价值共创. C114讯 4月21日消息（岳明）本周，由未来移动通信论坛、紫金山实验室共同主办的2026全球6G技术与产业生态大会在南京拉开帷幕。大会以“极致连接·智能融合·场景共创·产业共赢”为主题，围绕6G前沿技术突破、产业生态构建与应用场景探索，推动6G从实验室走向产业生态。. 在大会现场，作为中国信科集团旗下无线移动通信产业的主导企业，中信科移动集中展示了多项6G技术研究及验证的最新成果，积极推动产业界与学术界的深度融合。中信科移动创新中心副总经理王震在接受C114采访时表示，中信科移动通过持续的技术攻关与协同创新，赋能未来6G网络的智能内核与全域能力，推动产业共识形成，构建开放、统筹、高效的创新生态。. 当前，全球6G研究从“愿景需求定义”进入“关键技术收敛和预标准化”阶段。. 在关键技术方面，王震表示，中信科移动当前重点布局星地融合'
            score: 0.9993
