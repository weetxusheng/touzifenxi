          content_text: '这届抖音年轻人，把短视频搞成了艺术大片-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 这届抖音年轻人，把短视频搞成了艺术大片 时氪分享 · 2019年07月10日 11:15 那些坚持用自己的方式探寻内容新鲜度与深度的普通创作者的故事。 文 | Kr Lab 设计 | 小小吴 栏目 | Kr Lab 新青年观察 电影导演挑战短视频，讲好一个故事的极限时长能有多短？ 导演宁浩在抖音影像节上发布了一支时长仅有1分钟的短片《不止一分钟》，影片通过猿人开始，经历人类，最终达到智能时代，轻巧有趣的展现了人类智力以及其产物之间的内在博弈。 1分钟的视频凝结了几百万年的人类发展史，但让影像更具艺术价值的是《不止一分钟》传递出的感觉、情绪和概念。 导演当然聪明地在有限的时间里埋了一个显而易见的“梗”——随着人类的进化，影像画面也从横屏视觉渐渐变成竖屏视觉。 移动端视频要步入“竖屏时代”了吗？答案不言而喻。2018年3月，流媒体巨头 Netflix 移动端上线以竖屏视频格式展示内容的预览功能，6月，社交平台 Instagram 发布竖屏分享平台IGTV。可别忘了，每天还有超过数亿的中国用户，在抖音上集中消费着短视频影像内容。 宁浩对《不止一分钟》给予更大的期待，“希望通过这部作品带动更多的创作者完成更具创新、更优质的内容。”从单一的横向构图过渡到多种构图其中就包括竖屏构图， 内容的载体在变，产品在变，用户的审美也在变。 过去一年里，抖音已经成为电影、电视等精良制作的内容产品最看重的的传播平台之一，电影、电视行业开始尝试用短视频的形式创作抖音专属的竖版内容。张艺谋导演也在新作《坚如磐石》拍摄期间，单独尝试创作了抖音版本的短视频。 DAU超过3.2亿的抖音，拥有丰富度极大的内容SKU。为引领优质竖屏影像内容创作，抖音为此次短视频影像节召集起宁浩、徐峥、沈腾、贾樟柯、陆川、张晋、李非、刘天池组成了大师级的评审团。 当我们谈论竖屏影视时，不仅仅止有影像大师，那些在抖音里坚持用自己的方式探寻内容新鲜度与深度的普通创作者们，力量不容小觑。 1 Boogie93 最早是一位街舞 dancer，单词 Boogie 是一种古老舞蹈的简称。Boogie93 上过正在热播的《这就是街舞》第一季，他自嘲自己是“人气淘汰选手”，第二位出场就被淘汰了。街舞的路没有走通，偶然的机会他为朋友拍摄了一个短片，朋友们都觉得拍得很帅。“既然街舞不挣钱，那就不如找找其他路子。” 从16年入驻到17年，他的视频基本上每条都是十几万的赞，他想发什么发什么，每一条视频的数据量都非常好。 2018年，Boogie93 以抖音短视频博主的身份，收到了苹果新品发布会的邀请函。“想过自己这辈子一定会去一次美国，但没想过是以这样的方式去了美国。” Boogie93 高兴懵了，“我也不知道为什么最后就选中了我，我也没问，选中了我就高高兴兴地去呗。” 这次美国之行给他带来的似乎是一场始料未及的冲击，发布会现场传统专业媒体记录事件的认真用心和方式态度带给他很大的震撼。 他对自己的作品有了更高的要求和标准。 “不能说国外百分之百都是好的，但给我的触动就是人家是真的很专业很认真很用心的，在做这个事情，做内容。国内的博主就吐槽又卖多贵，又割了几个肾这种，特别无聊的一些东西。” 2018年，有更多形式的短视频在抖音上走红，用户的注意力开始转移。 那段时期Boogie93 很迷茫，突然一下不知道自己应该拍什么了，硬着头皮发了几次流行的内容，数据反馈都不好，他感觉就像有团黑色的气体围着自己一样，全是负能量。 干脆不拍了。他决定过一个月自己的生活， “我生活都没有过好，怎么去拍东西？” 他给自己放了20天的假，但摄影机没停。回归之后的第一条视频，拍的就是这20多天的生活，看书、吃饭、看展，获得了200多万的点赞。他有了更大胆的一个想法， 他确定了大家喜欢什么，但是更确定了自己喜欢什么。 他不再逼迫自己要每天更新，而是当真的有好的想法时再去拍。 与此同时，Boogie93 下定决心向广告片、短片导演转型。 他很明白转型时自己的短板，画面的精美他敢和别人保证，但是一说到内容就变得没有自信。 “我拿杯子来比喻一下，内容就相当于里面装的液体，我是一个特别好看的杯子，但是里面只倒了一杯白水。” 转型的关键是学习和输入。为此，他在外网上学习新的拍摄技巧，大量重看经典电影。《星际穿越》他看了六遍，从最开始的只会发出感叹词NB，到慢慢关注电影的配色、整体的画面、剧情和节奏，再到后来 会思考结合手机竖屏拍摄时每一个镜头的调度、灯光的走位，如何形成一部节奏紧凑、效果炫酷的竖屏作品。 偶尔参与拍摄TVC时，他就利用空隙，观察导演的机位和机器，镜头是多大的，用的什么相机，现场调度是什么样的，导演的内心想法是什么，“就是不停地在现场跟导演沟通，问一些专业上的问题。”当他表明自己以后想往这方面转型时，导演们通常会非常耐心的告诉他行业是怎么样的。 他希望有一天可以在抖音上发布自己的 TVC，“ 让所有人眼前一亮。让大家看看从16年到20年， 这么长的时间跨度，这个少年经历了什么变化，他的成长和他的进步。 ”Boogie93 看来，是抖音成就了他，这个平台给予他的东西和他能回报给平台的东西，是不对等的。“一直在帮助我去成长，而我希望将来有一天可以回馈给这个平台更大的价值。“ 艺术性的表达要突破大众的圈层，从来就不是一件容易的事，在用户量不断扩充的抖音上，是一个更大的“挑战”。大部分MCN公司会通过揣摩用户喜好，来定制达人的内容产出。 这也是Boogie93 不想签约任何MCN的原因，“想尝试拍自己喜欢的东西。” 对于内容生产者来说，一个理想的状态是不断拓展自我创作的边界，同时可以引领他人，Boogie93 还在探索， 但是他的朋友戴美施，已经在二者之间找到了平衡点。 2 戴美施说话和她视频给人的感觉一样，酷酷的，话不多，和同是东北人的Boogie93 形成鲜明对比。 每个达人都有一个对自己来说意义特别的视频，对戴美施而言，印象最深刻的是她进入抖音的第一个作品，作品内容很简单，简单到没有提及的必要，但它的意义在于因为有了这一个，才有了后面那么多个，才有了现在的戴美施。 早期的她，风格以时尚、潮酷居多， 最开始拍视频时是一个非常坚持自我的人，不会做哪怕一点点的妥协。 “早期抖音上面什么BGM火，我就偏不用，会按照自己的喜好找一些大家可能听都没听过的歌。也没有给自己定位，想到什么就拍什么，喜欢什么就拍什么。” 数据的低迷是最真实的反馈。用户没有共鸣，不知道她想表达什么，流量自然不好。 而对于要把短视频作为事业的戴美施来说，势必要做出一些妥协。 到了后期，她慢慢学会了配合大众的口味做一些融合。“ 融合之后也一定是我自己喜欢的，不会完全没有自己喜欢的东西，视频的质感、创意、精致，我是一定不会变的。 ”看到了今年古风的流行，戴美施会尝试根据比较热门的古风歌曲，发散自己的创意进行创作，在大众喜好和自己的风格中，找到一些平衡。 很多人评论她“好看”，这个好看有的是称赞她的外表，有的是称赞她的内容。戴美施对好看有自己的见解，“好看的内容一定要完整的。完整的内容，一定要有创意，且不能重复。 内容、场景、图画以及人物的镜头、调度、光线等等都是经过精心设计的。 ” 能完成这样的作品，需要她每一个视频自己制作场景，制作一个场景可能需要花费数个小时。“ 里面如果一个很小的道具买不到的话，我就自己做。 所以有的时候更新的频率特别慢，我也不知道需要几天，可能七天，也可能是十几天。”制作的时间成本高、开销也大，但为了把视觉效果打造到最好，她愿意花费这些精力和时间。 对于创作的坚持不止体现在场景上，现场拍摄时也如出一辙。需要拍日出或日落时，“我凌晨三四点就去拍摄点，拍日出，就在那个地方一等等一天，再拍日落。我也会为了让风吹一下头发而等很久，等风来。” 有些人给她留言，说戴美施你做的内容是艺术。她自己倒从来没有这么认为过， 但这种创作的追求，还是有其他人感叹，很有艺术家的风范。 最夸张的一次，是她拍视频拍到直接吐了。戴美施曾经偶然看到狐狸被剥皮的一个视频，觉得很残忍，决定拍一个反对皮草的视频。视频里，她把淘宝买来仿生血浆，从脑袋上直接淋了下去，虽然不是真血，但那个刺激性的味道让她难以形容，在头发上又黏又厚重的滴滴答答。“我拍完就吐了，胃受不了。” 虽然辛苦，但能做自己喜欢的事情，并找到了它与商业之间的平衡，在她看来是一件极其幸运的事。 对于未来，她没有明确的规划，她享受现在的状态。但也不排斥尝试拍摄长内容，或做一些剧情的尝试。就像之前将大众口味和自己风格进行融合一样，无论外界什么变化，找到外界和自我双赢平衡的点对于戴美施来说，应该不难。 Boogie和戴美施未来的方向，聚焦于长片制作、TVC等等，均属编导的范畴。而导演则通常要借助演员来表达自己意图和想法， 在抖音的平台上，我们找到了一位追逐演员梦的少年。 3 在技术流达人们已经在抖音上面玩的风生水起时，周琦峰还没有找到自己的风格，偶尔拍摄一些搞笑的段子来让大家开心，但他心里很清楚，这种方式不能长久。 周琦峰自小爱看香港电影，八九岁的时候，周琦峰看隔壁哥哥天天看周星驰的电影，边看边笑，当时他不理解哥哥在笑什么，又为什么天天看。 现在他明白了，无厘头的电影里充斥着小人物的无奈。 周琦峰觉得自己就是个非常典型的小人物，小时候他的梦想是想做个歌手，准备去参加艺考时，因为5000块钱的学费太贵了，妈妈让他不要搞这些”不务正业“的事情而放弃了。 上学后，他不想再经常管家里要钱，捉襟见肘时，经常吃泡面度日；毕业以后做过服务员、当过工厂工人， 周琦峰认为自己的生活就是一部小人物的故事。 他曾拍过一个吃白米饭的视频，有人留言评论：“ 你拍的是什么，光吃米饭，弄点菜啊。”他很无奈，“当你真正穷过的时候，有饭就已经很开心了，还管里面有没有菜？要求这么高？ ”他想在自己的视频里呈现小人物的生活和情感，是希望每一个和他一样的小人物，看到这些视频是有共鸣的，也能收获一些力量。 再小的人物心里也一定有一个仰望的偶像，周琦峰一直很喜欢哥哥（张国荣），最爱的电影是《英雄本色》，小时候看《英雄本色》，他第一次感受到了一种还不太能理解的精神——义气，但暗暗下决定希望长大后可以成为像哥哥一样的人。 当下定决心在抖音尝试拍港风短视频时，为了更好的符合港片的形象和人设，他花了两个月时间从180斤减到了150斤，“真正的港风不是将视频色调变黄这么简单，而是从方方面面去琢磨、贴合、理解、表达港风的。 第一个是环境的营造，第二个是服装，还有拍摄的构图，有很多因素。人设也非常重要，一穿上那个衣服，就是那种感觉，直接能把观众带入进去。 ” 很多人看完周琦峰的港风视频，以为他是在香港长大的本地人，其实到现在他也没有去过香港。 他拿演员的标准去要求自己，“没有小角色，只有小演员”是他抖音的标签。“我对这句话的理解是，无论再小的角色，身为一个演员，也应该能把它很好的演绎出来。”当一个演员的演技发挥到炉火纯青的时候，就是演员本身和角色融为一体的时候。 周琦峰现在就试图把港风融入到自己生活的方方面面，交朋友看重志同道合，穿衣打扮复古有年代感，连说话都给人一种港风的感觉，“人生到头来都是一场空嘛。” 艺术的创作有时候是孤独的，播放量持续低迷的时候，他也迷茫过。但他还是做好了准备，要坚持这一个创作的风格，“因为它是有艺术价值的。” 艺术不一定要是高不可攀的那种才叫艺术，周琦峰眼中，能让大众开心，能让大众知道一些道理、让别人学习的，都可以称为艺术。 “在这个风格里面我还可以揉进去其他内容，它可以是多变的，就像水一样，承载万物。” “我觉得现在自媒体的时代是一个特别好的时代，每一个人都有机会展现自己的才华。 成为演员是我一直以来的一个大目标，我希望在抖音里实现这个梦想。 下一步要把小目标一个一个写清楚，才能完成大目标，所以我现在开始慢慢的尝试写剧本，进行更多的艺术创作。” 小人物在这个平台上有了自己的一方天地，慢慢地学习、成长、收获， 而有些人，一出场就是MVP级的大玩家。 4 2016年下半年，在温哥华读书的薛老湿接到国内各个短视频平台的入驻邀请，在国外生活多年的他，已经和朋友玩遍了国外各类短视频APP，对内容制作也是轻车熟路。 对于国内刚刚起步的短视频平台来说，薛老湿是资深的玩家和行家，自然是各家APP争夺的对象。 而在初次体验了抖音产品之后，薛老湿拒绝了抖音的入驻邀请。 最早的产品音画不同步，虽然这个误差可能只有0.1秒左右，但确实是不友好的用户体验，同类产品都存在这个问题，但没有一个能真正解决这个技术难题。抖音团队熬通宵做测试，出一版就拿去给包括薛老湿在内的早期用户去测一版，测一版再改一版，持续了大概一个月左右。终于， 用户薛老湿满意了，开始在抖音上发布原创视频。 要以什么突破口来获取这些用户的关注？薛老湿灵光一现，用技术流和运境。“ 这个东西会火，绝对，一定，百分之百。 ”当时的国内还没有技术流这样的玩法，而一直在国外生活学习的薛老湿很早就接触到了这些新形式，他认定把这种好玩的东西引到国内是个好主意。 “其实它是一种音乐表达形式，跟街舞一样。它可以现场 battle，可以比赛，可以用手机完成几十个转场的创意去表达音乐。” 薛老湿希望，大家不是停留在看上，而是能让更多的人来玩，来参与到真正创作中。“我所有技术流的视频都会加一个话题 #transition#，这个话题抖音官方从来没有特意推过，大家自发地参与，已经有17亿左右的播放量。 但是观众大于拍摄者，所以我希望更多的人可以真正的上手，去感受拍视频的乐趣。 ” 他评价自己是一个奇葩，自己在抖音上2、3年了，一直一个风格走到底，没爆火但也没有凉，他享受这种平衡。 有些人在抖音上展现创意， 有些人在抖音上记录生活 。 5 很多人对燃烧的陀螺仪熟悉又陌生，熟悉是因为他拍的视频大部分人都看过，不熟悉是因为没有人知道他长什么样子。 众所周知，他的身份是一位飞行员。对于飞行员来说，开飞机必须做得恪尽职守，严格执行各项规定，丁是丁卯是卯，容不得一丝马虎。而拍摄、剪辑视频则是天马行空的，可以按照个人的喜好想怎么来就怎么来。 看似截然相反的两件事情，但内核是一致的： 坚定，如同陀螺仪的运转原理一样。 陀螺仪是飞机里的一个部件，其中一个特性叫定轴性，它高速运转的时候，无论怎么给它施加外力，它都会保持一个旋转的方向不变—— 不轻易受外力改变自己的轴心，坚持做自己要做的事情，这也是燃烧的陀螺仪视频的创作原则。 2018年1月，在一次执行飞行任务后，因耳朵发炎，使他不得不申请了一个月的休假。突然从高强度、长时间的飞机任务中抽身，他似乎有些无所适从这突如其来的，完全属于自己的时间。 很偶然的一天，他无所事事的在家翻相册，记录下和家人相处瞬间的相纸，让他产生了不如把生活拍成视频的想法。“ 记录生活不需要前期策划脚本，随手拿起设备就能拍，和写日记一样。 ” 2019年之前，他拍了大概400多个视频， 开创了#幸福生活中的仪式感#这一话题 ，点击量不高不低，但在今年1月份，突然连着几条视频点赞破了百万。第一条视频破百万时，他在飞往珠海参加培训的飞机上，下了飞机打开抖音，第一反应是高兴，随之而来的是不太理解，“很日常的生活内容，为什么偏偏是这一条？” 他试着总结了这一条的视频内容，用30、40秒的时间表达清楚了一件事情，主题明确，节奏快。而之前拍的视频，信息比较杂乱，有很多个主题，剪辑也偏慢。从那之后，他开始坚持用更明快的剪辑方式来记录生活。 2019年春节期间，他在抖音拍摄的回家贴春联视频在春晚前被CCTV1播出，也让更多的人知道了燃烧的陀螺仪。“春节我一个人在北京，那天我妈特别高兴的给我打来电话，说我上电视了。” “我做的视频就叫幸福生活中的仪式感， 我想把我对仪式感的理解、态度传递出去，这是一个单纯的想传递的念想。分享，仅仅是这么简单。 ”燃烧的陀螺仪说，他没有想过因拍短视频走红就放弃飞行员的工作，视频是他的热爱，飞行也是，这两件事都是因热爱而在坚守。 快节奏的剪辑会带来更好的流量，但目前他又回到了自己最初的剪辑方式：一种慢的，叙事表达更清楚的方式。“ 有些东西你想要感受真切，可能真的要慢慢品味。 走马观花的看，只能看到表面，无法触达内心。” “我会守住做视频的初衷。”他的视频观看者里有数量不少的抑郁症患者，有些人会跟他分享自己今天的一些感想和片段，并提到自己受到视频的鼓舞变得更加热爱生活，这些留言和故事，是他拍视频后收获的力量。 “无论是生活还是个人，都在一天天的进步，总有一天我会形成自己的独特风格，拥有不被忽视的力量。” 想要在如此包罗万象的平台里有独特的辨识度不是一件容易的事情， 而有些内容则天生具备独一无二的属性——动画形象IP。 6 正逢中国的己亥年生肖属猪，一只拥有 3000 多万粉丝的猪猪，从社交媒体一路火到了线下。 2017年年底上线的猪小屁，赶上了抖音内容爆发期。在抖音上，动漫形象少之又少。团队敏锐地捕捉到了平台的红利期，决定先根据抖音的热门歌曲进行创作，让猪小屁跳舞。 第一条视频是当时抖音最热门的话题 #俄舞 。统一的音乐、统一的动作，不同的人在不同的环境表现。 而所有人都没想到会有一只小猪来跳舞，还跳得那么好。 猪小屁一上线就火了，目前这条视频已经累积400w赞，后台有近亿的播放量。 为什么它这么受欢迎？长得可爱长得萌的卡通形象那么多，为什么偏偏是猪小屁？ “ 因为所有的创作都是围绕猪小屁的人物特点去打造的。 ”猪小屁的定位是一个5岁的小男孩，他是个小暖男，默默陪伴在每个人身边的感觉。他暖萌、可爱、聪明。每一个小片段每一个创作，始终围绕这些特点进行创作。 创作的内容大多围绕有孩子的家庭里可能遇到的实际场景来发散创意，比如写作业、更爱爸爸还是更爱妈妈等等。 猪小屁的使命感是制造快乐，所有的创作都围绕“快乐”进行。他们希望中国的孩子们有自己喜爱的国漫形象，让猪小屁能够陪伴孩子们拥有一个积极快乐的童年。 7月10日就是猪小屁出道两周年的生日了，回首这两年，猪小屁的创作团队对自己和时代都有着清醒的认知。“我们所处的是一个不断变化的内容时代，而这样的时代就要求我们不断的拥抱变化。 两岁的猪小屁也会慢慢成长，家庭观世界观都可能会有变化，在现有的基础上团队会给它做加法，不断拓展它内容的广度。 ” 在视频语言下成长起来的年轻人，正在用他们最擅长的表达方式——短视频——做非常多元化的表达。 伴随着智能手机拍摄功能的丰富和5G技术的发展，未来，将会有更多人能在抖音这类平台上用短视频记录分享自己的生活，这无疑已经是一种确定的趋势。尤其是我们也观察到， 在传统影像行业与短视频载体碰撞后，抖音平台产生出了很多种有趣的类型， 比如竖屏短剧、vlog，脑洞大开的创意视频，音乐技术流……竖屏加强了这些新形式的沉浸感，让用户有一种对话的感觉。同时各种有趣的道具、滤镜也让短视频的可玩性、交互性更强，在1分钟内体现更多的细节信息量和互动性。 这背后是把生活中“有用”“有趣”的信息艺术化的呈现过程。 这些内容也让抖音意识到短视频在艺术性与创新性具有很大的挖掘空间。为了鼓励更多用户发挥出自己超凡的创造力， 抖音举办的短视频影像节意在鼓励有创作能力的用户在记录美好生活的同时，探索更多影像艺术的可能性。 作为短视频领域的头部玩家，抖音率先提出了“影像艺术化”的可能性。 7月9日，抖音宣布举办为期一个月的短视频影像创作挑战赛，加之与张艺谋、宁浩、张晋等传统影视行业权威人士的联动，将直接推动短视频影像艺术化的大跨度发展。 影像节共设立故事、记录、动画、音乐、创新等赛道，既包含了故事、记录、动画这些传统影像行业比较成熟的竞赛单元，又在短视频的语境下呈现了不同的特征，同时也有音乐、创新这两条非常具有短视频特色的赛道。鼓励创作者在不同赛道上发挥更多的创意，尝试短视频的更多可能。 在历经了风口、快速增长后，短视频逐渐进入到一个更加精细化、专业化的时期。“记录美好生活”的抖音决心设立短视频影像节， 在关于短视频影像艺术化潜力和趋势的探索中，等待更多创作者加入这场关于“美”与“好”的划时代影像实验。 本文由「 时氪分享 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 +1 34 好文章，需要你的鼓励 时氪分享 氪星运营 477 收 藏 +1 11 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 今日值得看——36氪全天热度文章（7/10） 36氪 今日值得看，为你盘点每天所有读者「最喜欢」、「值得看」的文章。今日最热文章【张一鸣和刘强东的有限战争】......其它热门推荐【国产手机大败局之魅族水逆：曾经的“小而美”，最终败给了任性】【朱洁离职，字节跳动在寻找怎样的“音乐理想”？】【为什么总有不认识的人要加我微信好友？】>> 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 抖音向美团开出第二炮：从错位竞争，到贴脸抢地盘 抖音“孵化”到店抖省省，美团又要承压？ 抖音生活加码中小商家，攻向美团的腹地 抖音生服架构大调整，浦燕子打响“二番战” 一个“小火人”，或将成全抖音的社交和游戏愿景 抖音“分家”干美团 下一个美团？抖省省背后的万亿野心 战火未停、流量先断，TikTok又崩了 2026年，抖音电商的风往哪吹？ 时氪分享 氪星运营 为创业者提供优质的产品和服务 发表文章 5399 篇 最近内容 普渡机器人完成近10亿元融资，估值突破100亿元 8分钟前 “还债骑手”被强制下线240次：“开始我很反感过劳提醒，影响赚钱” 22分钟前 广西在粤举办跨境电商与加工贸易推介沙龙 深化粤桂合作 共拓东盟市场 42分钟前 阅读更多内容，狠戳这里 提及的项目 查看项目库 一无二 BOO! APP 朋友玩 正解问答 展开更多 下一篇 优必选科技&清华大学斩获2019 RoboCup多项大奖，彰显人形机器人技术优势 优必选科技和清华大学联合组成的火神队（Hephaestus）与各国参赛队伍同台竞技，分享在人形机器人技术理论和应用领域的最新进展，并最终斩获人形组三项大奖，包括AdultSize的Technical Challenge 技术挑战赛亚军、Drop-in比赛亚军，以及2VS2足球比赛季军。 2019-07-10 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行