          content_text: '年轻人，你到底有多「硬」？-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 年轻人，你到底有多「硬」？ 36氪品牌 · 2020年09月18日 18:57 也许今年的水流尤其湍急，但他们仍在全力过好自己的人生。 编者按：本文来自微信公众号 “36氪”（ID:wow36kr） ，作者：Kr Lab，36氪经授权发布。 - 这是 新青年观察栏目 的第 19 篇文章 - 策划 | Kr Lab 文 | 木也 2019年结束时，36氪曾推送过一篇年度回顾的文章《2019，料你也不想再过一次》，文末留言区中点赞最高的一条评论是「结果明年这个时候，发现今年挺简单」。 而2020年开始不久后我们就知道，不用等到年底，这句话就已经应验了。 2020年无论在哪个维度上，很可能都是21世纪以来最难的一年： 疫情席卷全球，除南极洲外无一幸免； 澳洲的森林大火旷日持久，烧了整整5个月； 非洲蝗灾随着一场飓风蔓延到了西亚和南亚； 国内极端气候带来的洪涝灾害造成6千万人次受灾； …… 而时代的一粒尘，落在个人头上，就是一座山。在灾难不停袭来的时候，我们好像也只能被时代的洪流裹挟着向前，「难」这个词体现在生活中的方方面面，有太多人这一年都过得不顺利。因此，我们为你准备了一份表单，让你更直观地看看自己的2020年究竟有多难？ 你的2020难度指数 （点击符合你的选项查看难度） ○经历了一场全球范围的疫情 难度+10 ○失去了晋升机会或被降薪 难度+10 ○公司破产或自己被裁员 难度+15 ○放弃计划了很久的旅行 难度+5 ○失去了不少娱乐活动 难度+10 ○身边有朋友或亲人离自己而去 难度+20 而除了这份难度指数的表单，还有一份硬度指数的表单给你： 你的2020硬度指数 （点击符合你的选项查看硬度） ○熬过了疫情并且如今安然无恙 硬度+20 ○参与过抗疫的工作或活动 硬度+25 ○在今年找到了新的工作 硬度+15 ○自己开始了创业 硬度+20 ○学会了一项新的技能 硬度+10 ○做过一次无论什么形式的公益 硬度+5 对比自己的难度指数和硬度指数会发现，即使情况如此艰难，我们也并非只能坐以待毙。总还有一些不愿妥协、需要坚守的东西支撑我们在困境里寻找解决办法。 其实一直以来也都是如此，也许一件事的难度指数是90、是100，但总有一群人能拿出95、120的硬度来应对，以绝对硬核的方式去打破困境。我们愿意称他们为「硬派青年」，无论面对什么都能始终「以硬碰硬」，「硬」对自如。 这一次，36氪找到了3位科技创投领域的KOL，和他们深度聊了聊「硬派」这件事，在今年疫情大环境的恶劣影响下，如何寻求突破和改变？虽然三位KOL的经历与遭遇各不相同，但无一例外的是他们的故事都很「硬」。 解决问题的最佳办法就是解决问题 第一个是名词，第二个是动词 我开始创业的时候想法非常简单，原本只是打算几个老师凑点钱开个小厂，做出一个能让工业界比较认可的零配件，也能养活家里人。但后来发生的事情确实是我没想到的：短短不到两年的时间内，以前只能在新闻上看到的全球工业巨头公司，几乎都开始来联系我们了，他们需要我们的技术来解决各种各样的问题，而我们做的第一个案例就是全球最大的手机代工厂。 这项技术叫软体机器人，目前全球市场做软体机器人的成熟公司，一共只有两家，一家在美国，而另一家就是我们。 我之前的工作是在北京航空航天大学，也正是这份工作让我接触到了软体机器人。当时确实是让我眼前一亮：因为在过去将近50年的时间里，机器人行业很少有这样原理级的创新了。 不同于传统机器人对关节动物的仿生，顾名思义软体机器人是仿生软体动物的，比如海星、乌贼，它们的运动是无法用传统机器人的运动方程来描述的。软体机器人在某些方面具有传统机器人无法比拟的技术优势，但也面临巨大的技术挑战，这项技术需要机器人结构、材料、控制、制造的全面创新。这两者就好比帆船和核潜艇，虽然都是水中航行器，但属于完全不同的技术体系。 当时的软体机器人技术给我带来了一个巨大的惊喜，让我们觉得这件事太有意思了，我和现在公司的合伙人赵鑫同时萌生了出来做的想法，大家商量说要不试试？然后就真的辞掉了大学里的稳定工作开始放手去做。 我们在规模还很小的时候，就自建了材料力学和结构力学的实验室，投资购买实验设备，培养基础科研人员。我们的定位不仅仅是企业，而是定位成研究机构与企业的结合体，不仅做应用产品创新，也做科研技术创新。 在2017年，一家手机代工厂从一篇微信文章上看到了软体机器人的概念，非常周折地找到了我们，很着急地让我们去现场帮忙解决问题。通过我们的技术，很顺利地帮他们解决了手机边框、屏幕、电池等异形易损手机配件自动化上下料这个卡了很久的难题。之后我们也顺理成章地成为了供应商。而且他们公司给我们的是现结，可能他们99.99%的供应商都会有个账期，但我们没有，这就是技术的力量。 公司近几年的发展总体还是顺风顺水的，但在慢慢有了一些成绩、业务和规模逐渐扩大以后，接踵而来的就是困难和挑战。尤其是今年受到疫情的影响，难点被格外放大了。首先，因为内部不能开工，没有生产力自然无法产出；其次，外部的客户也受到了影响，尤其是年初用人比较多的工厂都没法上班，自动化或者是一些配件需求也因此降低。 在这个时候，我们选择了自认为比较「硬」的姿态来应对：农历新年后我就和团队开了会，当时定的基调就是不管有没有疫情，我们今年的目标不变。我告诉大家不会因为疫情的原因去调整，就是选择正面刚。而软体机器人是一个通用技术，我们还可以在食品生鲜、消费品，甚至是医疗行业上发力。 我们不会说因为湖北封城了，那我们就放弃了整个湖北的业务；或者我们放弃今年上半年的业绩，等下半年再说。于是在3月5号之前，全国五个子公司就已经全面复工了，公司的每一个环节都开始运作起来，这也给了我们的客户更多信心。 而整个疫情期间最让我印象深刻的一件事，就是在今年6月北京疫情复发的时候，我在外地出差，正巧需要我回北京签一份合作协议。原计划我在机场签完，乘下一班飞机飞走，结果飞机一落地就需要核酸检测才能离开了，导致我直接滞留北京。 于是我赶紧联系加急做了核酸检测，是阴性。但更让人心急的是，也许因为我们公司距离新发地比较近，我的身份证号被锁了，即使在有核酸检测结果的情况下，我也买不了从北京出发的机票或火车票。当时的我压力山大，打遍了北京所有的热线电话，但是那个时候北京也确实很紧张，没有一个人知道原因。 最后找到一个朋友，在北京高速封路前一天开车把我送到廊坊，我又从廊坊坐绿皮火车到天津，再从天津飞到上海，最后从上海打车回到我们苏州的工厂。整个「逃离」北京的过程花了3天时间，但这3天的奔波为我争取到了后面一个月的工作时间，业务没有因此停摆。 我对于困难的解决方案一直都是正面刚，因为解决问题的最佳办法就是解决问题，第一个解决问题是名词，第二个是动词。面对问题的时候，你不能一直停留在原地，那这个问题永远都是问题。这也是为什么当我们遇到疫情，大家都在想怎么办，而我不会去想怎么办，先开工再说，开了工就知道怎么办了。 总的来说，我们把疫情带来的影响转化成了机会。原本做生鲜行业的自动化包装和分选我们是打着三年的计划，但现在半年就完成了。我们今年的业绩相比去年也增长了10倍，今年的销售目标也已经完成了70%。 有积淀、有思考、有观察 做出突破和改变的行动，才配去应对挑战 投资这个行业最吸引我的地方就是，你永远都会跟领域里比较前沿的一群人打交道，也能关注到这个行业里面的新技术、新公司和新商业模式。 投资人跟创业者、企业家不一样，后两者是把东西从0做到1，从1做到100，他们要从一开始走到最后。但投资人接触的面更广，再加上职业本身的特质，要求他最后是退出、获利，跟你的LP（有限合伙人）做交代，所以这对投资人的观察和思考要求很高。 从我的职业来说，「硬派」这个词就体现在「坚持」这个要素上。其实真正的投资，从我产生投资行为到最后退出获利的过程是需要时间的。再好的投资人，哪怕到了巴菲特的量级，他也会说其实时间是最大的投资收益。所以时间的沉淀，直接决定了你能否熬到最后产生足够回报退出的那一刻。 这个过程对我们来说都是很煎熬的，因为过程中会产生很多不确定性：事情的发展永远在起伏动荡的过程中慢慢走向高峰，但是有高峰，就会有低谷。所以坚持、肯定自己最初的判断，然后在这个过程中不断地给所投的项目提供必不可少的帮助，辅助它成长。我觉得这对投资人和投资机构来说都是尤为重要的。 今年疫情爆发之后，我之前关注的一些领域和赛道发生了变化，尤其是线下经济这块。同时也会让我去重新审视自己的投资逻辑，比如过去看起来很好甚至已经出手的项目，但是随着疫情的到来，它的数据可能变得非常不好，这种情况本身就是一种困境。 那么原来看好的项目到底投还是不投？已经投了的项目，应该怎么样去帮助？是否要再去追加赌注？都是我真实需要面对的问题。 于是，我开始帮助一些项目做新的资金和融资的对接服务，同时帮他们在有区域性市场需求的城市和政府做对接，让他们获得新的市场，或者让新的客户生存下来。 比如之前关注的一个电动车的项目，需要做新的融资和区域市场。我们帮他对接了长三角地区的一个政府，他们将会在当地建设新的生产线和基地，同时获得一定的融资资金支持，在疫情期间能够把他过去想扩大规模的规划实施下来。 对工作足够专注、效率足够高，是我相信的「硬派」表现。因为做投资，其实要求你的反应要快一点，不管是对LP还是对项目，大家的时间都很宝贵，所以这就要求我们平时工作中会议要尽量简短，材料要尽可能做得快，跟人的联系要足够频繁。 5月有一次出差，我一早从北京飞杭州，见完一个项目后，马上赶到南京，在南京谈完两个潜在LP，转头又赶到常州，晚上还在常州跟人开会。不算北京，我一天跑了三个城市，干了三份不同的工作。 这样的影响不光体现在工作方面，在生活里我也面临着和大家一样的烦恼：因为疫情不开学，孩子只能待在家里，需要家长的陪伴。所以那段时间，我会在家庭问题中花费很多时间和精力，也导致了生活中的一些摩擦或矛盾。 有一次我和我爱人都在公司加班，儿子晚上要上课，但没人接送，这时候就出现了一个问题——我俩谁放下工作先回家。最后我妥协了，回家把儿子送到上课的地方，然后在那边开线上会议。诸如这类时间分配和子女教育问题，每个家庭都会产生，但在疫情中会被放大很多，也确实是我比较无奈的地方，但也只能直面问题去想解决办法。 所以2020年，我认为无论是对我们36氪基金来说，还是对我个人来说，「挑战」都应该是特征最明显的一个词。 整个环境变化了，各方面工作的开展难度也明显加大了。这个挑战有的是来自工作量，有的来自你对过去方向做出的突破和改变，两者可能更多是战略层面和思维层面上的区别。前者的挑战，我用勤奋和努力可以解决，但是后者的挑战，需要有积淀、有思考、有观察，同时要做出突破和改变的行动，才能应对。 现在的工作节奏很快、压力很大，夜间开会是常态，出差在外也是常态，相比以前会牺牲更多放在个人和家庭上的时间精力。但既然前面有挑战，那我能做的就是用「硬派」的姿态，全力去突破挑战。 「Try something new」 一直是我愿意做的事 回看今年的疫情，发现它带来的影响对我来说是很严重的，很多可以往下走的项目都被迫中断，我们深耕了很久的项目，也因为客户取消预算而流产。尤其在第一季度，我无法出差，无法接触新客户，也很难通过当时所谓的视频会议和客户建立起信任。 但公司的业务不能停，团队里还有那么多人要养家糊口，我该怎么办呢？只能逼迫自己先硬起来，去调整新的策略：从已有的客户入手，挖掘他们在疫情期间的新需求，帮助他们一起面对疫情带来的困难。这期间我不断地告诉客户：你现在碰到了什么困难？我们是不是可以帮忙解决？ 在不断地沟通探索后，我们终于发现了这个特殊时期中的新商机：疫情对线下实体销售冲击明显，大家普遍都在焦虑该如何创收、如何卖东西。而我们本身是做交互的，所以能提供很好的数字化营销工具，做虚拟的线上人机交互来帮助销售，丰富销售体验。 如今，我们的数字化营销方案已经在跟很多大型方案商合作，今年还会正式铺上好几个大型商场。为招聘行业和教育行业做的「智能外呼」、「人机协呼」也开始了产品测试并陆续投入市场，接下来会进行大规模实战。这些都是伴随着疫情，从客户端挖掘的新需求，创造出的新机遇。 「Try something new」一直是我很愿意做的事。 就像在2016年，我辞掉大疆北美地区工作的时候，公司已经准备给我办绿卡了，但我还是放弃了当时优渥的工作机会和生活条件，选择了回国加入小蓦。因为那时候，已经能看到自己未来3年、5年，甚至10年里的生活和事业是怎样的，但这种确定的生活似乎对我来说有些太早了。 所以当戴总找到我，有这样一个机会时，我知道是做选择的时候了。然后我也慢慢发现，那时中国企业发展非常好，原来中国这些年发生了这么多的变化，可是我之前都没有怎么在国内工作过。那么能在不同的地方、置身不同的行业、面对不同工作内容，一切对我都非常有挑战。几经思考之后最终确定了回国，想全身心地回来看一看、闯一闯，直到今天我也相信这是一个对的选择。 之后工作中的挑战是巨大的，最直接的一个就是需要我站出来去管理汽车的业务。虽然那个时候我感觉自己好像什么都不懂，但也什么都不怕。不同于以前的工作，管好业务需要我去挖掘客户的需求，去规划整条业务线，意料之外的困难随时都会发生。好在这4年里面，虽然困难无处不在，但至少我们在汽车业务上取得了巨大的成功，这是我们从零开始，一路披荆斩棘开辟出来的一条商业之路。 我想我对「硬派」的理解就是如此：有实力，负责任，能承受住孤独和压力，能在困境和僵局中寻求突破。而除去这些，作为一名在科技行业里的女性从业者，我觉得还应该有的一个特质应该是「温度」，这或许也是女性特有的优势。 我有一个很厉害的朋友，也是个技术硬派，他就做过一个精度很高的疲劳检测产品，在驾驶过程中一旦检测到驾驶员疲劳，就会提醒你不要疲劳驾驶。你会发现只要检测出自己疲劳了，它一会儿就提示，一会儿就提示。产品背后的算法本身很厉害，但这样不停地提醒，其实用户是会感觉到烦的，这其实就是还不够有温度的地方。 当人们在使用科技产品时，不会有人在意背后有多少台处理器在运算、它有多么快的反应速度、它用上了多少黑科技，更多人在意的还是使用时的感受。让你觉得爱上一件东西的那一刻，一定是与你的体验相关的。 像我们给汽车销售人员做过一个类似于助理的交互产品，帮助他们快速找到关于汽车的资料。当时其中的一款汽车有很多颜色，光是蓝色就有三种，而且蓝色的名字非常生僻拗口，不便于销售快速找到相关资料，于是我们在颜色名这一块的交互做了优化。类似于这样的小细节还有很多，最后整个产品出来的时候，甚至连我们的竞争对手也说，这是他见过的所有交互体验里最好的。 技术本身是冰冷的，所以在工作里我也一直试图去赋予它一些温度，在细节上留给人们更具人性化的体验。这是我不断追求的，也是我一直力图去成为的「硬派」。 我一直相信科技会是一件很浪漫的事情，就像望远镜让我们看见了太空，飞机让我们去到更远的地方旅行，网络让我们打破地域的界限，和更多的人联系在一起。 所以我希望人工智能，特别是我所做的人机交互领域，有一天可以真的改变我们的生活，哪怕只是其中的一个点，那我只要把这个点做好，就是我对自己在这条路上的最大期待。 无论是永争第一、遇到问题正面刚的高少龙；还是全力应对挑战，在沉淀中突破的裴杰；又或者是不断「Try something new」的龚思颖，我们都能在他们身上看到一种「坚硬」的力量：在时代的长河中，他们不甘心就这样被水流冲刷掉自己的棱角，变成一颗只能随波逐流的石子。 也许今年的水流尤其湍急，但如他们这样的「硬派青年」们仍然在全力过好自己的人生，在经历困境的过程中变得更加坚硬，试图保留住棱角。 即便对于每个人来说，面临的困难都不尽相同，要为此付出的努力和牺牲也有大有小。或许你的经历并不如3位KOL的故事那样精彩不凡，但「硬派青年」这个称谓，应该属于每一个正在看文章的你，因为「硬派」这个词适用于今年每一个中国人不放弃、不妥协、不断坚持的时刻： 医护人员第一时间奔赴疫情前线的时刻； 外卖骑手冒着感染的危险坚持在岗的时刻； 职场员工不能出门仍坚持线上办公的时刻； 老师们为了给学生开课第一次尝试直播的时刻； 中高考的考生们戴着口罩奋笔疾书的时刻； …… 在这个注定不太平的2020年里，还有如此多的「硬派」时刻存在，本身就让人感到格外的安心和可靠。 就像长城WEY品牌打造的全新智能豪华越野SUV坦克300，无论在怎样恶劣的环境、面对怎样的糟糕路况，都能带给你一份踏实的安全感。 如果说人的「硬派」在困境时显现光芒，那汽车的「硬派」时刻，往往与征服崎岖同义。我们都知道，「硬派越野」市场一直是国外汽车品牌的「游乐场」，再加之今年车市受疫情影响遇冷的大环境，发布一款越野新车而言可谓难上加难。 而作为WEY品牌进军越野市场的首款产品，坦克300仍选择了迎难而上，面对困境直接正面刚，以9种驾驶模式，配合三把锁、坦克转弯、蠕行模式等硬核配置，为国内汽车行业的「硬派」正名。 但就如龚思颖在自述中所说，拥有过硬的质量和技术还不够，真正的「硬派」还应该有的一个特质应该是温度。一辆「硬派」的越野车，还应该被赋予更多的温度，用更加人性化的设计给人带来更好的体验。 在WEY 坦克300身上，不仅能看到硬朗大气的造型和强悍性能之外，还能感受到内饰的柔美和优雅带来的舒适体验：12.3英寸互动双联屏、双温区自动空调、远程控制、日常服务等功能，满足不同乘客对舒适度的要求，让智能豪华充盈整个座舱。 就是这样一款SUV，为「硬派越野」烙上了「智能豪华」的标签，彰显出来自中国汽车品牌「刚柔并济」的智慧。 本文由「 36氪品牌 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 作者拍摄 、 采访供图 、 企业官方 +1 3 好文章，需要你的鼓励 36氪品牌 资深作者 11 收 藏 +1 1 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 艰难2020，坦克300与你一起硬对挑战 2020年无论在哪个维度上，可能都是21世纪以来最难的一年。但有一群“硬派青年”，不愿被时代的洪流裹挟着向前，他们在困境中变得更加坚硬。就像长城WEY品牌的坦克300一样，在恶劣环境中，始终与你一起“硬”对挑战。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 36氪品牌 资