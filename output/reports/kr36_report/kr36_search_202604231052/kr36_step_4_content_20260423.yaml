          content_text: '巴菲特加码投资日本股市，大举发行日元债券｜投资派-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 巴菲特加码投资日本股市，大举发行日元债券｜投资派 投资派 · 2024年04月26日 14:05 巴菲特对日本经济投下信任票。 作为全球投资人都膜拜的股神“巴菲特”，曾经做出很多预言，大部分都成为现实，所以他的言行，格外地引发大家的关注，成为指导人们投资的风向标。 无独有偶，4月19日巴菲特旗下的伯克希尔·哈撒韦公司再次引起了市场的广泛关注，这次他们大举发行了日元债券，总计筹集2633亿日元，成为自日本央行废除负利率制度以来，海外发行人最大的日元交易，此外，巴菲特在日本股市的投资也备受关注，特别是他对“五大商社”的持续加码。 前不久巴菲特在接受日本经济新闻时表示，未来20年或50年，日本的经济将更加强大，巴菲特的预测有什么依据呢？其以往对于日本股市和债市的投资策略如何呢？ 01.加码五大商社，推动日本股市新高 2023年4月，全球投资界的传奇人物——沃伦·巴菲特，时隔11年再次踏上了日本的土地，巴菲特此行的一个重要议题就是考虑加码投资日本股市，自2020年起伯克希尔在日本五大商社，即三菱商事、伊藤忠商事、丸红、三井物产和住友商事的持股比例已从5%左右升至7.4%，这一比例的提升充分显示了伯克希尔对于日本商社长期发展前景的看好。 巴菲特增持的消息传出来后，日本东证指数涨幅扩大，五大商社中的最大商社三菱商事股价一度上涨3%，三井物产一度飙升3.7%，丸红商事、住友商事和伊藤忠商事也小幅走高。 首先，巴菲特认为日本商社业务分散，所以可以分散投资风险，这些商社的业务结构类似一个投资组合，虽然其每年给股东发放3%-5%的股息不高，但是与日本的零利率相比绝对是高收益，另外五大商社的资产大多在日本以外的其他国家，能够使用日本极低的利率帮助他们拿到廉价的资金，从而产生持续不断地现金流收益。 这几年日本商社也开始利用闲置资金对自己的股票进行回购，前年三菱商社回购股票的资金是1000亿日元，回购后的股票都被注销了，巴菲特认为上市公司的流动股本越小越有投资价值。 其次，这五家商社都是业务高度多元化的公司，囊括了能源、机械、化工、食品、金融和银行等行业，经营较为稳健。目前日本上市企业平均整体股息率大概是2.6%，这五家商社里三菱商事、住友商事股息率达5%以上，丸红和三井物产股息率也在4%以上，伊藤忠股息率在3.5%左右。 多元化业务、高股息、高自由现金流和审慎增发新股是巴菲特青睐“五大商社”的重要原因。 今年2月，巴菲特透露伯克希尔已经持有这五家公司约9%的股份，这些公司的股价自伯克希尔开始投资以来，平均涨幅超过一倍，推动日本股市创出34年新高。数据显示，伯克希尔从五大商社获得的利润已超2万亿日元约合129亿美元。 02.发行日元债券，锁定当前较低利率 据悉，此次“股神”巴菲特发行的2633亿日元（约17.1亿美元）债券包括七期票据，期限从3年到30年不等，是自日本央行上个月废除全球最后一个负利率制度以来，海外发行人最大的日元交易之一。 该交易中最大的一笔是三年期债券，伯克希尔仅从该期限债券就筹集了1690亿日元，超过其去年11月份债券募集的总金额，定价在基准利率中点加51个基点。Asset Management One Co.驻东京基金经理Haruyasu Kato表示，作为一家海外发行人，伯克希尔在该期限上提供了近1%的票息，明显高于日本公司出售的类似期限票据。 自2019年以来，伯克希尔已经发行了8次日元债券，是日元债最大的海外发行商之一。同时，日元债也是伯克希尔发行最多的债券。截至去年9月份，伯克希尔发行的日元债券约为76亿美元。 分析认为，伯克希尔此次发行日元债，是为了锁定当前日元较低的利率，借日元持续加码日股。同时，发债还能规避外汇波动风险，增加资金使用效率。 此前，巴菲特在2月份的年度致股东信中表示，伯克希尔希望通过发行日元债券为其对日本公司的大部分投资提供资金。伯克希尔还曾表示，希望最终拥有其投资的伊藤忠商事、丸红、三菱商事、三井物产和住友商事五家主要贸易公司各9.9%的股份。 巴菲特此次加码日本股市和债市，不仅是对伯克希尔全球投资布局的深化，也是对日本经济和资本市场的有力支持。这一决策有望为日本股市带来更多的国际资本流入，进一步推动日本资本市场的开放与发展。 长按扫码关注36氪公众号 本文由「 投资派 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 视觉中国 +1 28 好文章，需要你的鼓励 新锐作者 14 收 藏 +1 3 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 2024年全球投资展望：巴菲特策略的影响与启示 随着2024年巴菲特股东大会的临近，这场投资界的年度盛事正吸引着全球投资者的目光。特别值得一提的是，这将是传奇投资者查理·芒格离世后，巴菲特首次股东大会。芒格与巴菲特长达数十年的黄金搭档关系，早已成为投资领域的传奇佳话，他们的智慧和决策深刻地影响了无数投资者。 在这个意义非凡的时刻，巴菲特股东大会不仅是对过去一年投资领域的全面回顾，更是对未来投资方向的深度展望。全球投资者都在热切关注，失去芒格的巴菲特将如何继续他的投资哲学，又将为我们带来哪些新的投资洞见和启示。 在此背景下，36氪以“2024年全球投资展望：巴菲特策略的影响与启示”为主题，策划了一场线上直播活动。我们邀请到星石投资副董事长杨玲，重阳投资合伙人舒泰峰，搜狐号财经优质作者、星图研究院高级研究员付一夫，他们将结合自身的经验和独特见解，深入解读这次历史性的股东大会，共同探讨投资的新方向、新趋势和新未来。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 2026有智青年挑战赛，报名通道全面开启！ 2026中国股权投资行业名册，调研启动！ 直击“宇宙行”业绩会：日赚10亿，分红超千亿！工行高管：股息率超5% 净利微增，投行收入几乎腰斩！中信建投业绩喜忧参半，董监高降薪超2600万 求购银河通用股份；求购宇树科技股份｜资情留言板第158期 90后女创始人被告了 路演报名！携手11个创新项目，引领新质生产力发展丨36氪 × 华映资本 消费降级的风终于吹到「金融消费」上了？ 马来西亚这六年：从没有一张二维码到无现金社会｜投资派 投资派 新锐作者 为投资者搭建行业分享舞台，帮助创业者和个人投资者掌握投资方法 发表文章 91 篇 最近内容 消费降级的风终于吹到「金融消费」上了？ 2024-07-15 安永：新“国九条”的执行情况将成A股市场关键 2024-06-13 体量小但增速快，国内OTA平台与国际巨头差在哪？ 2024-05-24 阅读更多内容，狠戳这里 下一篇 谷歌Meta离职团队4个月训出比肩GPT-4大模型，清华北航校友参与 半数亚裔的远程办公初创团队，用一个Gemini Ultra级别的多模态大模型震撼了硅谷 2024-04-26 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
