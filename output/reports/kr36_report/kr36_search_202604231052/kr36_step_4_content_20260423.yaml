          content_text: '想戒也戒不掉的奶茶，是留给打工人最后的甜 | 后浪白皮书-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 想戒也戒不掉的奶茶，是留给打工人最后的甜 | 后浪白皮书 后浪研究所 · 2021年09月05日 08:30 追逐0糖的年轻人，却不愿意放弃「高糖」奶茶。 继奈雪的茶上市之后，蜜雪冰城、茶百道也纷纷传出要上市的风声。尽管这两家都否认三连，但不可否认的是， 你一杯我一杯，千亿新茶饮市场，在座的各位都功不可没 。 喝奶茶为什么这么上头？ 各品牌花式推陈出新的吸引力到底有多大？ 奶茶里还藏着年轻人哪些不为人知的小心思？ 为此我们发起了一次 「奶茶行为学」 大调查，我们共收回问卷1021份。其中受访者以95后居多（41.43%），其次是90后、00后和85后（32.22%、13.61%、8.42%），而女性参与者占到了7成。 调查后我们发现，年轻人的「奶茶学」果然充满了独属于他们的 纵情与反转 。 留个小悬念：想知道当下年轻人最爱的奶茶是哪一款吗？ 文末还有一份独家奶茶搭配攻略 。 开心用它庆功，不开心借它消愁；独饮能颅内高潮，聚众能灵魂升华；工作学习时喝效率倍增，放松看剧时喝岁月静好……一位真 · 奶茶上瘾者如是说。 年轻人究竟有多爱喝奶茶？ 在我们的调查中， 有52.3%的年轻人每周至少喝一次奶茶 ，有13.52%的年轻人每周喝奶茶3-5次，而 真正能够拒绝奶茶的人只有12% 。 在「车厘子自由」前，一半年轻人轻松实现了至少一周一杯的10块~30块不等的 「奶茶自由」 。 奶茶的致瘾性当然不难理解。 经历了粉末时代和街头时代，进入到了现制时代的奶茶，大多由茶底和辅料（水果、奶盖、甜品、小料等）组成，茶底中的咖啡因叠加上辅料中的「甜蜜杀手」——糖，外加层层叠叠的口感，这谁扛得住。 香烟、酒精、游戏、盲盒、短视频 ……最赚钱的买卖，都逃不脱 “上瘾” 两个字。更何况，奶茶的“瘾”来得让人觉得，不但毫无压力，而且理所当然。 无时无刻不想来一杯，每个奶茶人都是 合理化饮茶大师 。 我们还发现， 当下追逐奶茶的主力人群是95后和90后 ，00后属于预备军实力也不容小觑。但从95后开始，随着年龄增大，喝奶茶的次数也越来越少。 生活中越来越多的事情需要忍耐、等待和积累，年轻人更需要说要就要的爽快。 想喝奶茶的时候就毫不犹豫地拿起手机点一杯，这样简简单单实实在在的快乐谁能拒绝呢？ 这份「瘾」是专属于年轻人的 「即时满足」 。 也许中年人的世界有钱又有权，却再也买不到这一杯简单的快乐了。 任何一种上瘾，都是满足了一种疗愈心灵苦闷的功能，《欲罢不能：刷屏时代如何摆脱行为上瘾》一书如是说。 从年轻人们喝奶茶的各种原因中可以发现 当代「奶茶经济学」的大行其道。 996、007，昼夜不停，忙碌不息。在我们的调查中， 为苦涩的生活加点甜，成了年轻人们买奶茶最重要的原因。 而「社交需求」是年轻人买奶茶原因的Top3。 不论是求同事帮忙，还是安慰气头上的女友，又或是与吵架的朋友求和，颜值高、口感好、料够多且价格可控的奶茶，是大多年轻人都认的 「社交货币」 。 奶茶是真正的社交密码当然不是什么秘密了，有时一个奶茶拼团群的活跃度要远高于任何一个工作群。相比于一人独享，他们更喜欢聚众群吸。 「三点几了，饮茶先啊」，饮茶哥早就告诉过我们——老板不会心疼你的，饮茶才是正经事！我们的数据也显示，午饭后的 下午茶时段是「奶茶高峰期」 ，有57%的年轻人选择在这个时间来一杯快乐水续命。 「和同事一起享用下午茶」仅次于「朋友聚会逛街」，成为年轻人第二喜欢的饮茶场景。 想必每家公司都有一个起头叫奶茶的小可爱，在微信群里一呼百应。仿佛500毫升的纸杯里装的不是奶茶，而是 社畜们放松摸会儿鱼的满足 。 有网友“严谨”调侃，奶茶经济学已经成为了一门专门的学科—— 从经济学的角度出发，以最小的经济成本来获得和享受尽可能高的幸福感 。 无论是低成本、高产出的甜蜜瞬间，还是低成本、轻操作的社交货币，用最少的成本撬动最大的幸福，是年轻人在 「奶茶学」 上的四两拨千斤。 既然快乐就是奶茶的代名词，那么，反转来了。 虽然抗糖越来越成为健康主旋律，但任性的年轻人才不会为了一杯奶茶难为自己。毕竟体重也许不会因为少喝一杯奶茶而减少，但甜甜的快乐会。 在奶茶加糖这个问题上，有的人心胸开阔，大彻大悟，有的人斤斤计较，畏畏缩缩。 我们发现， 少少糖/三分糖是大部分年轻人最爱的选择 ，但依旧有15.67%的人勇敢选择了标准糖。 在嗜甜这件事上，具体到不同年龄选择却大不相同。 00后选择标准糖的比例则高‍‍‍‍达 27.34% ‍‍‍‍，远超90后（13.16%）和80后（17.74%）。 结论很明显，年龄越大的人越倾向于饮用无糖奶茶，果然是 越年轻越嗜甜，越年轻越任性 。 另外，调查数据也显示，在对甜度的考虑上， 男生是潇洒先生 ， 女生是顾虑小姐 。 勇敢选择标准糖的男生占比27%，远高于女生的11%。而相比于肆无忌惮地放纵，21%的顾虑小姐们还是选择了不加糖的克制。 所以，综合来看，真正不惧糖的勇士正浮出水面—— 00后无所畏惧的boy们 ，糖分杀手，当之无愧！ 喝奶茶影响睡眠，喝奶茶会发胖，喝奶茶掉头发……关于奶茶的负面声音越来越多，那么，喝奶茶的年轻人会有罪恶感吗？ 本次调查中， 51.52%的年轻人表示喝奶茶完全心安理得 ，罪恶感是什么，能喝吗？ 面对喝奶茶增加的热量，他们并不会选择少吃饭来弥补，也不会通过运动来消耗。 即使微微有些不放心， 躺平什么都不做才是常态 。 而当问及是否想过戒掉奶茶时， 不少年轻人也诚实地表示「完全没有」， 也有人表示 「想戒戒不掉」 。 从零度可乐到气泡水，代糖也终于被放进了奶茶杯里。但是，面对奶茶店推出的「0卡代糖」，年轻人真的买账吗？ 调查发现，57%的年轻人买奶茶时不加代糖，33.2%的人声称， 「喝都喝了，谁还在乎那点儿热量？」 ，13.61%的受访者表示，不选择代糖是因为 「不相信代糖是0卡的」 。 而选择代糖的人群中，有36%的人并不相信代糖能够降低热量，只是 「求个心理安慰」 。 尽管无糖或代糖已经成了气泡水、碳酸饮料们的「政治正确」，但放在现制奶茶中反而有点吃力不讨好。 调查中我们发现， 「不喜欢代糖味道」的人占了10% 。没那么好喝了，正是年轻人不选择代糖的关键原因之一。 因为代糖和蔗糖对我们甜味受体的激活方式不同，这让代糖喝起来多少有点「怪怪的」，而现制奶茶中又没有碳酸或气泡来中和这种「怪」——对奶茶口感极度敏感的年轻人，若要他们牺牲掉口感，又干嘛要喝奶茶呢？ 网红营销、社区种草、短视频闪回、洗脑歌刷屏、狂推新品、品牌联名……到底哪种方式最让年轻人上头？看起来甚嚣尘上的「代喝代购代排队」到底能不能代表大多数？ 通过整理数据，我们发现了一个有趣的现象， 67.87% 的年轻人认为不会受到网红营销的影响，即便网红奶茶店开到家门口也不会为此排队。 其中 男生选择不排队的比例（77.33%）高于女生（63.94%） ，对排队时间的容忍度也更低，想指望男友去帮忙买网红奶茶的妹子要注意了！ 然后，重点又来了。 茶饮店推出的短视频、洗脑歌等营销方式，年轻人似乎也不怎么感冒。 近7成年轻人在选择奶茶品牌时，认为自己不会受到神曲营销的影响。 仅有17.34%的人因短视频/洗脑歌对品牌增加了好感度。 更让我们意外的是，尽管各大奶茶品牌将不断推陈出新当做吸引年轻人的法宝，但调查中超过70%的年轻人表示，并不会轻易被奶茶店推出的新品吸引。 他们的态度是： 奶茶店的新品是否有吸引力，取决于它对不对自己的胃口。 更有20.27%的人完全不会受到新品的吸引，只会坚持选择自己喜欢的口味。 比如，刚刚过去的这个夏天，各品牌为了吸引年轻人眼球，频频推出新品水果茶，各种平时没见过的小众水果占据C位。 根据调查，年轻人最喜爱的新品水果茶 top3: 手打柠檬、车厘子、油柑 。而今年被吹爆的黄皮接受度并不高，难道是因为名字听起来像药材？（误） 这也意味着，在激烈「内卷」的奶茶界，所有以往非常态的营销手段都已经渐渐趋于「标配」，想打动「见多不怪」的年轻人正变得越来越难。 正如哈佛大学营销学教授西奥多·莱维特（Theodore Levitt）所言：“ 消费者不需要一个1/4英寸的钻头，他们只想要一个1/4英寸的洞。” 对这届年轻人而言，更高明的奶茶营销可能是——奶茶不重要、糖分不重要、排队不重要，但经由奶茶，能让他们更轻松进入一个从日常琐碎中短暂逃离出来的 甜蜜瞬间才最重要 ！ 彩蛋来了。 当越来越多的配料、水果加入茶饮行列，各式各样奶茶的搭配也让人眼花缭乱。 我们扒遍了大量的网红推荐，结合 热量、口感、颜值 等多种因素，最终为大家筛选出了3种搭配攻略， 既适合点单参考，又适合动手党亲自来做， 相信总有一款会成为你的yyds！ 所以，今日份的奶茶你安排上了吗？云干杯~~ 本文来自微信公众号 “后浪研究所”（ID:youth36kr） ，作者：杨柳、大倪，36氪经授权发布。 本文由「 后浪研究所 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 采访供图 +1 59 好文章，需要你的鼓励 后浪研究所 新锐作者 326 收 藏 +1 55 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.65 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 年轻人最爱的「毛绒绒」品牌，迪士尼只能排第二｜2025毛绒玩具报告 涌入1688的年轻人，人均「厂牌主理人」 让我看看，这年头还有多少人在坚持健身？丨年轻人「健身」小调查 近7成年轻人偷偷消费升级，钱都败在了这里丨2024年度「消费升级」报告 2025年结婚最理想的彩礼金额，这个数丨年轻人谈婚论嫁报告 AI搭子，当代年轻人最铁的homie | 2024年轻人「拥抱AI」报告 最让年轻人疯狂的火锅菜，土豆能排第一吗？｜年轻人「吃火锅」小调查 不要AI恋人的年轻人，更期待的是「万能搭档」｜2024年轻人驯化AI指南 挣扎在通勤路上的职场人，耳机里悄悄播放大悲咒｜2023年轻人通勤报告 后浪研究所 新锐作者 36氪旗下年轻态公众号——后浪研究所（youth36kr） 发表文章 629 篇 最近内容 这届留学生，用AI看病省出一辆特斯拉 2026-04-13 囤货的快乐，全毁在一台不给力的冰箱上 2026-03-13 选择成为女司机后，她们这样说 2026-03-13 阅读更多内容，狠戳这里 提及的项目 查看项目库 奈雪的茶 蜜雪冰城 茶百道 引力智能 展开更多 下一篇 IPO留言板 | 深交所恢复比亚迪半导体创业板IPO发行上市审核；张小泉下周一登陆创业板；葛洲坝终止上市申请 全新栏目《IPO留言板》——带你紧追本周IPO热点。 2021-09-05 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
