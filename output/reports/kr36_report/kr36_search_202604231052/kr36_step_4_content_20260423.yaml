          content_text: '2023年金融数字化领域四大看点 | 数智前瞻-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 2023年金融数字化领域四大看点 | 数智前瞻 沈筱 · 2023年01月13日 20:06 金融机构数字化愈趋务实 编者按：本文为《2023年，To B行业看什么？》约稿计划约稿部分。本文来自读者投稿。作者：北京海致星图科技有限公司副总裁 宋攀 金融数字化看点一 《中华人民共和国反电信网络诈骗法》自2022年12月1日起正式施行。 描述： 《中华人民共和国反电信网络诈骗法》共7章50条，其中“金融治理”篇章，首次通过立法清晰界定了金融机构的反电信网络诈骗职责，对金融机构如何构建反电信网络诈骗风控体系提出了明确的要求。 意义： 2023年是该法正式实施的开局之年，金融机构一定会依照法律要求，落实风险防控责任，逐条对照法律条款建立反电信网络诈骗内部控制机制和安全责任制度，将反电信网络诈骗纳入工作环节和业务流程中去。 同时，近年来伴随数字化的不断深入，金融机构的智能风控体系已初步建成，在该法实施之后，如何将反电信网络诈骗纳入风控体系，如何通过数字化技术提高电信网络诈骗的反制技术，将是今后一段时间内，金融数字化的一项重要工作。 在过去的反电信网络诈骗工作中，金融机构主要通过可疑交易规则模型，在公安机关下发的涉案名单，进行异常交易线索、可疑账户的排查，协助公安机关阻断电信网络诈骗。 反电信网络诈骗法实施之后，立法明确了金融机构可以采取的必要阻断措施，金融机构能够依照法律进行交易异常行为监测，对涉嫌欺诈、洗钱的账户采取重新核验身份、下调交易额度、下调商户等级、延迟支付结算、中止交易、关停账户以及上报公安机关等举措，在阻断电信诈骗资金链的时候有法可依，更具主动性。从全社会来看，金融机构将与电信、互联网、公安机关形成联防联控、综合治理的打防管控格局，共同守护老百姓的“钱袋子”。 但是，这对金融机构的风控体系建设也提出了更高的要求，金融机构如何从过去防御性的上报，转化成主动性的阻断，数字化技术的引入是非常关键的一环。 反电信网络诈骗法明确提出了金融机构要建立客户尽职调查制度；建立企业账户相关信息共享查询系统；研究开发用于监测识别、动态封堵、处置涉诈异常活动的反制技术。要落实这些要求，都需要数字技术的支撑。 图计算技术在识别欺诈行为的时候具备技术优势，近年来已经在金融机构的反欺诈应用中得到了充分的验证，成为金融机构构建智能风控体系的核心技术之一。“图”能够把数据以相互关联的形式组成一个知识网络，在这个网络之上，数据之间的关联关系清晰可视，能够快速的进行关系的挖掘、群体的识别、个体的分析、事件的传导和知识的推理。 同样，图计算技术与机器学习相结合的应用在反电信网络诈骗中，能够用来提高金融机构发现异常交易的时效性、准确性并降低漏报率。在提升准确性方面，可以建立一个评分模型，通过对历史上报案例数据的训练，形成可疑交易/账户评分机制，过滤掉大量过往难以区分的正常交易，对于可疑评分较高的交易/账户进行针对性的核查，可疑交易上报的准确性和效率都会大幅提升；在降低漏报率方面，很多的欺诈都是团伙行为，团伙之间的关联关系极其隐秘复杂、作案手法难以发现，图技术能够通过关联关系的分析去主动发现洗钱团伙，挖掘出大量的潜伏账户，“拔出萝卜带出泥”，避免更大的损失。 传统的欺诈一般是指金融信贷类的伪冒申请，信用风险和坏账风险，电信诈骗则包括海外电话诈骗、洗钱、网络赌博、色情盘、杀猪盘等，涉及的欺诈方式更多、欺诈范围更广、关系形态更复杂，图计算会有更多可作为的空间。 在反电信网络诈骗法颁布实施之后，海致星图已经与多家金融机构确立了构建电信网络诈骗风控模型的合作协议，2023年是金融机构重拳出击反电信网络诈骗的一年。 金融数字化看点二 金融领域信创数据库替代会迎来集中上量期。 描述： 2023年是“2+8+N”行业信创政策落地的第三年，金融作为“8”大关键行业之一，按照规划，2023年，金融全行业预期完成一般系统的国产替换。经过两年的落地，金融信创将更加深入核心业务系统和基础软件层，会更加偏向核心系统的改造，尤其是信创数据库替代会迎来集中上量期。 意义： 未来3-5年，将是金融信创加速落地的黄金期，金融数字化转型正在逐步实现全面自主可控。按照规划，2023年，金融全行业预期会完成一般系统的国产替换。从海致星图目前的了解到的市场需求来看，信创数据库的需求量正在集中攀升。 过去两年，在政策的引导下，金融行业开始信创落地，并呈现出了两个趋势：一个是从试点范围大型银行、证券、保险等机构向中小型金融机构渗透；一个是基本完成了管理办公系统、一般业务系统的软硬件改造，以及部分新建系统的信创要求，从以往监管机构单方推动到金融机构、科技公司自觉自发投入，开始深入到核心系统的信创改造中。 数据库作为银行数据的“容器”，也是数据查询和计算的“引擎”，支撑着金融机构的关键核心业务如信贷、存款和结算等业务的运行，目前，这些核心业务所依仗的数据库仍旧以国外产品为主，但是伴随着时间的推移，应用场景深入复杂，数据量越来越大，客户对安全性和实时性的要求越来越高，叠加国外产品服务费高、反馈时效长等因素，数据库的国产替代需求越来越紧迫。 同时，图数据库技术的创新也是一个重要的驱动因素。当前金融机构大多使用的是Oracle、SQL server等关系型数据库，以行列式数据结构对世界进行了二维表达，优势在于简单、能够快速进行统计查询，但损失了结构和拓扑信息，这其实是对世界的简化。图数据库是一种新型的数据库类型，世界是复杂和关联的，如人与人之间、交易与交易之间、设备与设备之间有很多复杂的关系，图状结构能够更加恰当、真实的表达这些复杂关系和结构，是对真实世界的完整描述，在数据计算的响应速度、计算准确度、可挖掘的深度上更具优势。 投射到金融业务的应用，如企业、个人客户相关的诸如股权、地址、IP、MAC、设备、电话之类的静态关系，以及动态发生的如转账、贸易、担保、票据开立等，基于这些关系来进行洗钱网络、欺诈团伙的发现，信用风险的传导分析，上下游客户链式营销推广等，在这种多个体协同或关联的场景下，图数据库计算速度比关系型数据库有指数级提升。 海致与清华大学联合研发推出了一款国产新一代云原生分布式高性能图数据库AtlasGraph，目前已经在多个金融机构落地应用，能够支持更大范围内的实时计算场景，对于金融领域高频交易场景能够提供非常有力的支撑。 金融领域的数据库替代，不简单的是国产与非国产的替代，更是先进的技术之于传统技术的替代，图数据库市场会迎来一个集中的上量期。 金融数字化看点三 金融机构助力复工复产、纾困中小微企业政策会持续发力，银行信贷业务的数字化会继续深入。 描述： 受到疫情的以及国际环境的不确定性等多重因素的影响，一些中小微企业运行困难加剧。 2023年中国人民银行工作会议强调了要引导金融机构进一步解决好民营小微企业融资问题。这也是精准纾困中小微企业政策的延续，2021年，国务院促进中小企业发展工作领导小组办公室印发了《提升中小企业竞争力若干措施》，支持金融机构深化运用大数据、人工智能、区块链等技术手段，改进授信审批和风险管理模型，持续加大小微企业首贷、续贷、信用贷、中长期贷款投放规模和力度。这一政策在2023年将持续发力。 意义： 中小企业的发展是扩就业、改善民生、促进创新的重要力量，金融机构通过数字化提升信贷服务的质量，能够帮助中小微企业减负纾困，激发市场活力，促进国民经济复苏，在政策的鼓励之下，金融机构信贷业务的数字化将持续创新。 作为数字金融领域头部的数字化技术供应商，海致星图响应国家政策，与合作的金融领域的用户一同探索信贷业务数字化的创新，通过扩大供应链金融覆盖面、增加中小企业信用贷款发放、优化风控、缩短贷款审批流程等方式，精准纾困中小微企业的发展。 如将知识图谱技术引入供应链金融，搭建“企业评分模型”，从企业自身个体特征（基础要素、核心业务数据、风险信息等）、关联企业关系的紧密度和亲密度、在产供应链图谱网络中的重要程度、是否支持“双碳”政策等方面进行综合的评分，得分较高的企业会成为供应链上的潜在核心企业，其关联紧密的上下游中小企业也会获得相应的授信。 为进一步提供助力，海致科技为金融机构建立线上的用户画像数据模型及全面图析，借助大数据、知识图谱等技术支撑，分门别类，突出重点，筛选优秀公司，揭示风险公司，帮助金融机构快速、全面了解和掌握相关客户情况，以增加中小企业信用贷款发放，建立绿色通道，精准帮扶暂时遇到资金流转困难的优质中小企业办理“快速信贷、贷款增额、还款展期”业务，提升金融服务质效。 加大贷款发放同时，也要通过数字化的技术提升风控的精准度和效率，做好贷前的审核、贷中的监控和贷后的服务和风险预警，降低逾期坏账率。 目前，通过数字化技术提升金融机构的信贷效率仍有很大创新空间，海致星图也一直在与金融行业的用户一同推进信贷业务数字化的持续深入。 金融数字化看点四 知识工程是金融数字化的一个重要的方向。 描述： 经过多年的数字化，金融机构已经积累了足够的数据，如何沉淀数据、深挖数据价值是金融下一步的重点方向，知识工程是一个很好的解决方案，也是2023年金融数字化的一个重点趋势。 意义： 知识工程是指在数字化的过程中，从积累的数据里凝练出知识，用知识来指导工作，用知识来牵引进一步数字化的方法。 核心是企业可以构建一个自己专属的知识库，来沉淀企业的知识资产，比如行业政策法规知识、业务知识、模型知识、系统知识等各领域知识，从而作为企业数字化的一个“基础设施”，向整个组织提供知识服务，赋能各条业务线的发展。 一方面能够使得企业内的信息变得有序，信息的流动变得通畅，促进部跨部门之间的共享和交流，破除数据的壁垒。另一方面知识库通过智能问答、智能检索的方式，在常规业务中给出提示和信息推送、或者作出自动化的指令和指导，提升工作效率，帮助员工学习提升。最重要的是，在知识库中可以进行数据资产的深度挖掘，驱动数据资产的变现。 尤其在金融这个数据量极大、增长速度快、数据源丰富、结构复杂的领域，知识工程对于企业数字化一定能够起到“四两拨千斤”的作用。 目前，从国有大中型银行到具有地方特色的城商行都在布局构建自己的领域知识库，知识库内容十分丰富，大到国家的政策法规，小到属地的特色词条都能够及时的获取到。大型银行还会在知识库之下构建专业知识库体系，包含反欺诈知识库、审计知识库、合规知识库、运营管理知识库、信贷知识库、营销知识库、算法知识库等，去赋能相应的业务、提升效率。 2023年会有更多的金融机构开启知识工程，这也是今后一段时间内金融数字化的趋势。海致知识平台产品已经帮助了多家金融机构构建了自己的知识库体系，我们认为在2023年仍会有较大的市场增量。 但对于金融机构来说，知识工程是一个创新的路径，根本目标仍是如何深挖数据价值，如何将沉淀的数据资产变现，这是新的挑战，也是新的机遇，海致深耕金融数字化多年，会一直与用户共同探索价值变现的新路径。 金融数字化看点五 不重复造轮子，以更高效、集约的方式推进企业的数字化转型是金融数字化的一个新的趋势。 描述： 海致星图自2015年成立就一直深耕在金融行业，几乎经历了金融机构从开始探索数字化到步入深水区的全过程，我们非常真切的感受到，金融机构在进行数字化的时候会越来越务实，将数字化融入业务流程中，且具备了从点到面的全局观。 意义： 金融数字化进入深水区，从单点业务数字化趋向全局数字化能力的构建，越来越具备“点--线--面”结合的全局观。 海致星图已经服务了近百家金融机构数字化，我们看到行业的一个普遍的变化是，金融机构的用户会更加务实，会从如何解决业务痛点的角度出发来进行数字化，而不只是单纯的引入一个新兴的技术、新的系统这么简单。在解决业务问题的时候，也更趋向于全局化的视角。 以智能反欺诈场景为例，过去，系统能够对交易进行离线的分析，挖掘到欺诈团伙，但往往发现的时候欺诈已经发生了，对银行造成不可挽回的损失。现在的业务部门则在一开始就会考虑到，如何将系统无痕嵌入到作业流程中去，进行实时的分析决策，在发现欺诈行为、可疑交易、欺诈团伙之后进行有效的拦截，而不仅仅只是做事后的分析。 另外一个变化是，金融机构业务部门的数字化，在过去只是解决单点业务问题，现在则更加注重跨部门的协作，大家会探讨如何去构建属于企业的共性部分，如何去构建属于业务板块的共性部分，以及如何基于共性的部分衍生出更大的价值，这就会避免“重复造轮子”的事情发生。 现在，越来越多的金融机构在构建一个可以供多部门共用的企业级别平台。比如海致星图已经协助多家银行构建了企业级知识图谱平台和“全行一张图”规划，能够同时支撑多部门业务场景的应用，避免过去项目独立开发过程中存在数据重复建设、数据权限管控不规范、数据模型无统一设计、知识图谱建设与应用服务无法统筹规划等问题，也降低了数据过分暴露的安全问题，缩短了建设周期，减少了项目人力和费用成本。 该文观点仅代表作者本人，36氪平台仅提供信息存储空间服务。 本文图片来自： Pexels +1 46 好文章，需要你的鼓励 沈筱 新锐作者 48 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 GMI Cloud King Cui：AI企业如何补齐算力短板，保障GPU集群稳定性?｜WISE 2024 商业之王 零跑汽车朱江明：让所有消费者，以燃油车价格买到电动车 | 36氪专访 产业带计划｜中国新能源，迈