          content_text: '2022 年金融科技行业新闻Top 5 | 数智前瞻-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 2022 年金融科技行业新闻Top 5 | 数智前瞻 数字时氪 · 2023年01月13日 18:37 数据治理监管升级 编者按：本文为《2023年，To B行业看什么？》约稿计划约稿部分。 本文来自读者投稿。 作者：科技媒体撰稿人 史圣园。 编辑：沈筱 ** 01 “数据二十条”出炉，构建基础制度体系 一句话介绍 ：数据成为继土地、劳动力、资本、技术四大生产要素之后的第五大生产要素。 简介： 12月19日，《中共中央 国务院关于构建数据基础制度更好发挥数据要素作用的意见》发布。该意见提出 20 条政策措施，探索并构建了数据产权、流通交易、收益分配、安全治理等四项制度，被业界称为“数据二十条”。 意义解读 ：数据基础制度顶层设计正式推出，与刚刚召开的中央经济会议关于“大力发展数字经济”内容形成呼应，旨在降低数据的使用门槛，激活数据要素市场的供给侧改革。市场上，数据中心、数据概念股公司迎来涨停。机构上，数交所队伍或将步入洗牌。 参考链接 ： https://www.yicai.com/news/101628517.html 02 银保监会监管规范升级，推动金融数据治理 一句话介绍：《 银行保险监管统计管理办法》发布，促进监管科技（RegTech）进一步发展 简介 ：5月，银保监会发布《银行保险监管统计管理办法（征求意见稿）》。这是继 2004 年 9 月《银行业监管统计管理暂行办法》印发后，银保监会近 20 年来首次更新监管统计相关管理规范。新的管理办法对报送范围、报送要求、填报门槛、数据枚举值、脱敏规则等内容进行了补充修订，更加重视信息披露质量和数据隐私安全问题。 意义解读 ：《征求意见稿》的发布，标志着数字化金融监管新时代的到来。金融机构的数据管理上，存在数据源分散、数据规模大、纸质底稿难以沉淀为数据资产、数据检测耗时耗力等痛点。监管倒逼金融机构改革，开始拥抱人工智能、大数据等科技手段，提高数据治理能力。这也带动了国内监管科技相关公司的兴起。 参考链接 ： http://www.21jingji.com/article/20220527/herald/efa239b6c987f555d9805291096ae123.html 03 加密货币交易平台 FTX 破产 一句话介绍： FTX 平台 10天火速破产，引发加密货币价格集体跳水 简介 ：FTX 交易平台于 2019 年成立，3 年时间就做到了全球 TOP3，估值320亿美元，可以说是金融科技领域的明星公司了。11月，加密货币知名行业媒体CoinDesk 曝光了一份私人财务文件，指出 FTX 与其姊妹公司 Alameda Research 可能存在债务问题。这则新闻发酵后引发市场的恐慌情绪，FTX 发行的 FTT 价格暴跌。平台上的投资者纷纷开始提现，导致资金挤兑，出现 80亿美元的资金短缺。仅仅 10 天后，FTX 平台宣告破产。这件事触发了市场对于加密货币的信任危机，FTX 破产后，比特币、以太坊等主流加密货币的价格也遭遇了一轮暴跌。 意义解读 ：从风光无两，到光速破产，只用了 10 天。由于加密行业早期的野蛮生长以及监管缺位，导致了许多的不规范行为，缺少类似于银行中的“存款准备金制度”，风吹草动就可造成大崩盘。新兴的金融科技名词层出不穷，但是此前却鲜有人思考如何完善风控。此事之后，加密行业也开始建设规范化的存量资金信息披露制度。 参考链接 ： http://www.21jingji.com/article/20221123/herald/53d0da12d9ebe473f5b573366ece8387.html 04 ChatGPT 出圈，通用型 AI 或可应用到金融领域 一句话介绍 ：人工智能和机器学习的在金融科技中的应用更加广泛 简介 ：除了 AI 客户服务之外，金融科技公司正在使用先进的人工智能算法来评估申请人是否适合信贷，在某些情况下甚至是抵押贷款。 AI 可以预测消费者行为，并提供有针对性的产品推荐，让员工有时间专注于更高层次的客户服务需求。通过 AI 算法，企业可以过滤掉简单的查询，直接帮助人们定位到常见问题解答，或在需要时将其转移给人工顾问。作为联系客户服务团队的一种方式，聊天功能已成为 2022 年的标准配置。 意义解读 ：随着年末 ChatGPT 的出圈，通用型 AI 成为可能；同时也让人更期待可解释 AI 和 生成式 AI 在金融科技领域的进一步应用。生成式 AI、知识图谱、深度学习、区块链等等新兴底层技术的发展，以及它们之间的组合，让金融科技行业的发展值得期待。 参考链接 ： https://www.chinanews.com.cn/cj/2022/12-08/9910784.shtml 05 苹果将推出「先买后付（BNPL ）」信用服务 一句话介绍： 苹果想要绕过银行，自己做消费贷的生意 简介： 苹果公司在全球开发者大会上宣布，晚些时候将跟随 iOS 16 在美国推出“先买后付”（BNPL）服务。使用 Apple Pay 购物的消费者可分四次支付、隔周支付一次，并在六周内完成支付，无需支付额外的利息。苹果公司将绕过银行，直接向消费者提供贷款。目前，苹果公司的一家子公司已在美国多数州获得贷款执照。 意义解读 ：BNPL 已成为一个蓬勃发展的细分赛道，出现了 Klarna、Affirm、Afterpay 等独角兽公司。苹果、PayPal 也宣布推出自己的先买后付服务。不同于银行签发信用卡时的谨慎，先买后付服务无需严格的资质审查，主力用户是申请不到信用卡的年轻人。虽然赛道火热、资本下场，我们也不该忽视其背后的经营风险。 参考链接 ： https://news.stcn.com/sd/202206/t20220608_4625440.html 该文观点仅代表作者本人，36氪平台仅提供信息存储空间服务。 本文图片来自： Pexels +1 19 好文章，需要你的鼓励 数字时氪 新锐作者 26 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 GMI Cloud King Cui：AI企业如何补齐算力短板，保障GPU集群稳定性?｜WISE 2024 商业之王 零跑汽车朱江明：让所有消费者，以燃油车价格买到电动车 | 36氪专访 产业带计划｜中国新能源，迈向更有想象力的智能化未来 英伟达成立最壕AI实验室：Jim Fan领衔，专攻具身智能 推出供应链大模型产品「CubeAgent」，「壹沓科技」想构建“员工+AI Agent”的智能办公方式 | 新科技创业 吉利地图公司「朗歌科技」开放融资，想将高精地图和导航地图融合生产 早期项目 | 能源技术企业「鸿途智慧能源」打造通用换电体系，开发商乘换电车型 早期项目 | 物联网厂商爱云科技推出高精定位终端，已合作小鹏、吉利 大模型解决机器人专业技能学习问题？很难 | 数智来信 数字时氪 新锐作者 36氪旗下官方账号。记录中国产业故事，推动全球数智发展。 发表文章 130 篇 最近内容 传统数据中心，如何通过改造提升能效、节能减排？ 2023-08-16 求购Open AI股份；转让Shein、Space X专项基金LP份额｜资情留言板第105期 2023-08-09 专访恒生电子：人工智能、数据要素、业务服务中台化是金融数字化转型的最新关键词 2023-08-03 阅读更多内容，狠戳这里 提及的项目 查看项目库 火速科技 生意+ 下一篇 顶好，MCN机构有人年终奖拿百万豪车 年终有人拿3倍工资，有人收获保时捷。 2023-01-13 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，