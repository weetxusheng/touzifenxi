          content_text: '智界要打翻盘仗：V9给了年均12万辆指引｜36氪独家-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 智界要打翻盘仗：V9给了年均12万辆指引｜36氪独家 大福星 · 2026年04月21日 23:40 智界V9，重担在肩。 智界，这个华为与奇瑞联合打造的汽车品牌，将翻身的希望押注在了智界V9。 36氪获悉，智界V9给供应商下达了年均约12万辆的生产量纲，这一销量指引接近去年MPV市场“常青树”别克GL8全年的销量。 据36氪了解，目前宁德时代与中创新航两家电池供应商，共计为智界V9准备了过万套月产能，也有供应商按1.5万辆/月的峰值产能去备件。从供应链的备件情况来看，供应商初步认可了智界V9的销量指引。 另有接近智界的行业人士告诉36氪，智界正规划一款轿跑车型，计划达到一个较为极限的性能目标。这款车或将被送往纽北赛道，挑战一众国外豪华超跑车型。显然，智界此举与小米等主打性能的汽车品牌策略一致，意在通过纽北赛道的成绩，在消费者心中构建性能和高端的认知标签。 智界是华为与奇瑞通过智选车模式合作打造的整车品牌。智选车模式又称鸿蒙智行模式，在这种合作模式下，华为深度参与整车的产品定义、营销与渠道。 智界V9是智界品牌的第三款车型，也是鸿蒙智行品牌的首款MPV，搭载了华为乾崑 ADS 4高阶辅助驾驶系统，以及896线双光路激光雷达，将于今年5月正式发布。 在智界V9之前，智界品牌已有R7、S7两款车型。但根据奇瑞集团产销快报，2025年，智界品牌累计销量不到10万辆。因而智界V9无疑肩负着，带领智界销量突围、品牌向上的重任；但于鸿蒙智行体系而言，如何在最大程度上，避免智界V9与即将发布的尊界MPV之间的博弈，这考验着鸿蒙智行的产品节奏把控能力。 押注智界V9，智界寻觅销量支点 去年8月，华为与奇瑞在深圳举行签约仪式，宣布智界品牌进入2.0时代。根据协议，双方将在智界品牌投入超过100亿元资金，组建5000人规模的研发团队。 这场签约仪式的背景是，华为奇瑞联合打造的智界品牌，在销量上迟迟未有重大突破。相较尊界、问界等品牌，智界在它所处的生态位中，无疑还有较大的市场潜力待挖掘。2025年，奇瑞集团产销快报显示，智界品牌全年累计销量不到10万辆，因而智界品牌急需找到一个销量支点。 而智界V9正是智界进入2.0时代后的第一款全新车型，智界为了打赢V9这场翻身仗不可谓不煞费苦心。 首先是人事上的一系列调整。今年年初，智界品牌宣布，前腾势汽车总经理赵长江加入智界任执行董事，负责品牌、渠道等；今年4月，智界品牌又宣布前荣耀CMO郭锐担任智界CEO。赵长江曾操盘过同为MPV车型的腾势D9，2025年腾势D9累计销量约10万辆，仅次于别克GL8；而郭锐曾在荣耀主导构建了，覆盖全球100多个国家和地区的品牌营销体系。 与人事变动相伴随的，是智界在渠道和产线上的投入。赵长江曾告诉36氪，今年智界计划建成超200家专属智界的销售网络；郭锐也曾在接受媒体采访时表示：“为了确保V9的品质达到旗舰‘9系’的标准，智界投入10亿元，专门建造了一条全新的焊装生产线”。 除了带动品牌销量，智界V9还肩负着引领智界品牌向上的使命。华为常务董事长余承东曾公开表示：“V9将定位30万级市场，但配置水平超越百万级豪车”。 智界的前两款车型R7与S7，均定位30万元以下市场。但无论从华为造手机的过往，还是高端汽车品牌问界、豪华汽车品牌尊界的市场表现来看，高端市场才是华为的舒适区。靠着科技内核与奢华外壳，华为能够轻松获取品牌溢价和高端市场份额。 因而当智界寻求销量突破，仰攻华为更熟悉的高端市场似乎是理所必然。 此外，36氪还从接近智界的行业人士处了解到，智界正规划一款轿跑车型，并有想法将这款车送往纽北赛道。这款轿跑的推出或将加速智界品牌的高端化。 智界V9想成为MPV界黑马，优势与挑战并存 智界V9给供应商下达了年均约12万辆的量纲，这意味着这款车平均每月要实现约1万辆的交付。若再考虑到V9刚上市时的新车效应，智界给V9定下的峰值销量目标约1.5万辆。 宁德时代与中创新航两家电池供应商，共计为智界V9准备了过万套月产能，部分供应商为智界V9准备了1.5万套/月的产能。 就供应链备件情况来看，智界V9的供应商初步认可了智界下达的销量指引。 若智界V9真的实现了年均12万辆的销量，这是什么概念？ 去年，MPV市场的标杆车型别克GL8，全年销量约为12.24万辆，月均约1万辆。 从智界给供应商的销量指引来看，智界V9显然有撼动MPV市场现有格局的野心，余承东也曾在去年广州车展期间公开称，这款车会“超越市面上所有旗舰MPV”。 要想成为MPV界的黑马，拥有华为深度赋能的智界V9固然有其优势。但值得注意的是，在车市竞争更为残酷的2026年，智界V9也处在与一系列MPV车型激烈角逐的状态。 2026年，别克MPV家族迎来全产品线焕新。其中，按上汽通用官方数据，今年4月初，别克GL8陆尊燃油版上市第一周，大定已突破8200台。 在中国市场暂时沉寂的上汽通用，不会让别克GL8轻易折戟。有公开信息显示，今年年初，上汽通用总经理卢晓曾在内部表示，要“保持GL8在MPV市场的销量总量第一。MPV作为上汽通用的立身之本，公司必将持续投入，不遗余力”。 除了别克GL8，同在鸿蒙智行体系的多款MPV如何定位，也是企业需要思考的问题。今年尊界将推出标轴版和长轴版两款MPV，其中标轴版MPV侧重侧重家用取向，长轴版MPV侧重商用旗舰取向。目前来看，在华为与江淮的初步规划中，这两版MPV的市场价格，将大幅高于家用及商用MPV市场现有的代表车型。 同为鸿蒙智行品牌旗下车型，同样定位MPV这一细分市场，智界V9和尊界MPV这两款车，难免会被市场拿来比较。而一年发布两款MPV的鸿蒙智行，如何做好这两款车的区隔，使它们能合力收割更多MPV市场的份额，这对鸿蒙智行提出了考验。 可尽管MPV赛道竞品林立，优质产品的供给依然稀缺。而且在豪华新能源MPV市场，集齐科技、智能和空间场景体验的产品确实不多，而这或许正是智界V9试图改写MPV市场格局的底气。 4月21日，赵长江在社交媒体平台发文暗示，智界V9将弥补苹果汽车的遗憾。对于这款新车的市场表现，智界似乎已信心十足。 作者微信：luckg17305264638 本文由「 大福星 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： IC photo +1 16 好文章，需要你的鼓励 大福星 新锐作者 5 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 字节跳动2025年海外营收占比创新高，AI投入致公司净利大降70%｜独家 自变量机器人完成近20亿元B轮融资，小米战投、红杉中国领投丨智能涌现独家 小米汽车重磅任命：胡峥楠任CTO，宋钢任参谋长｜36氪独家 欣旺达装车特斯拉，供应全球车型｜36氪独家 阿里电商 AI 新动向：围绕 Token 重构电商，组织迎来新一轮调整｜独家 轻舟、元戎秘交上市资料，和Momenta冲刺港股IPO | 36氪独家 抖音生活服务组织架构大调整，中小商家更重要了｜独家 36氪企业全情报：AI 舆情大数据，让投资决策快人一步 云鲸联创吴一昊Hower即将离职创业 | 硬氪独家 大福星 新锐作者 TA没有写简介，但内敛也是一种表达 发表文章 11 篇 最近内容 最前线｜华为猛士深化战略合作，新技术将逐步落地4款以上全新车型 13小时前 智界要打翻盘仗：V9给了年均12万辆指引｜36氪独家 2026-04-21 空悬企业时驾科技获头部车企MPV车型独家定点 | 早期项目 2026-04-20 阅读更多内容，狠戳这里 下一篇 Anthropic逼急谷歌，布林下场亲自督战，组“追杀队”围剿Claude 谷歌再次进入「红色警报」状态！联合创始人谢尔盖·布林亲自挂帅，组建秘密攻坚队「追杀」Anthropic。 2026-04-21 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备