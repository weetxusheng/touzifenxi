          content_summary: '一名知情人士告诉36氪，在美团广告算法的优化上，智谱的算法已经有了较为出色的表现。'
          content_text: '美团再出手大模型，独家投资「智谱AI」| Long China 50独家-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 美团再出手大模型，独家投资「智谱AI」| Long China 50独家 阿菜cabbage · 2023年07月20日 16:16 一名知情人士告诉36氪，在美团广告算法的优化上，智谱的算法已经有了较为出色的表现。 文 | 周鑫雨 邓咏仪 编辑 | 苏建勋 杨轩 热钱翻涌的AI大模型创业，一笔围绕头部AI创业公司的关键投资已落下帷幕。 36氪从多个独立信源处获悉，AI大模型公司智谱华章（以下简称“智谱”）数月前已完成B-2轮融资，金额为数亿人民币，由美团战投独家投资，该轮投后估值为近5亿美金。据了解，智谱后续几轮融资也陆续完成。 对于以上融资信息，智谱官方暂未表态。 这也是近期少有的一笔数额破亿美金的融资。此前拿到融资的AI创业公司，数额大都在百万、千万美金级别，能够拿出自研模型的几家距离亿元俱乐部仍有一步之遥。 一名投资人告诉36氪，能拿到上亿美金的创业公司，需要兼具顶级团队和自研大模型的技术，且有成功的落地经验——而这样的公司，国内目前一只手都数得过来。 在AI大模型研究领域，智谱团队在业内始终备受瞩目，其成立于2019年、由清华大学知识工程实验室（KEG）技术成果转化而来。 出身清华自然语言实验室，智谱的核心团队阵容可谓豪华：国内首个中英文平衡的跨语言知识图谱系统XLORE设计和研发者张鹏担任CEO，团队研究成员也大都来自清华计算机系。 数据、算力、人才，是大模型创业者必备的入场券。而智源早在2021年，就基本集齐了所有要素。 一名内部人士告诉36氪，得益于近20年前就开始做的开源情报分析项目，团队不仅在2006年推出了科技情报大数据挖掘与服务系统平台AMiner，还为大模型研发积累了较丰富的中英双语数据，以及一线工程经验。而大规模的算力，又是靠租借超算平台、与智源等研究机构合作等“巧劲”解决的。 2022年8月，智谱联合KEG共同推出了千亿级中英文预训练语言模型GLM-130B。据观察，除却阿里等互联网企业外，智谱是彼时尝试千亿级语言大模型的首家初创企业。 GLM-130B的表现也得到了认可。斯坦福大学基础模型研究中心的一项研究表明，GLM-130B能在准确性和恶意性指标上与OpenAI发布的大模型GPT-3 175B接近或持平。这一奠定智谱业界地位的模型已被全球41个国家266家机构申请使用。据36氪了解，申请使用的机构就包括腾讯、字节跳动等头部互联网公司。 今年3月，智谱开源了62亿参数的中英双语对话的轻量模型ChatGLM-6B，支持用户在单张消费级显卡上进行推理使用。同时，基于GLM-130B基座的语言生成应用ChatGLM也同期推出，并开启了内测。 即便仍然存在数学处理、逻辑推理能力较弱等大模型的通病，但ChatGLM-6B却补上了ChatGPT至今仍未解决的时效性短板。一名知情人士对36氪介绍，源于此前团队在业务合作和研究中积累的技术，ChatGLM-6B知道推特现在的CEO是Elon Musk。 有多重资源和技术能力的加持，智谱在一众AI新势力中也尤为炙手可热。 2022年9月，智谱完成1亿元B轮融资，由君联资本和启明创投联合领投。而此轮互联网资本的入局，意味着大模型发展已从研究性的探索，快速进入应用落地阶段。 一名知情人士告诉36氪，在美团广告算法的优化上，智谱的算法已经有了较为出色的表现。 美团一直在寻求AI与业务的结合机会。早在2018年2月，美团点评就设立了Al平台部-NLP（自然语言处理）中心，为包括智能客服、场景化找店及搜索在内的各项业务提供文本语义理解服务。前Facebook（现Meta） Research Scientist和微软亚洲研究院主管研究员、现快手技术副总裁王仲远，则是成立NLP中心的牵头人。 在2020年中的组织架构调整中，美团点评搜索与NLP部门被纳入了新成立的AI平台，由曾任Google高级工程师、百度主任架构师的美团首席科学家夏华夏坐镇。 ChatGPT爆火以来，互联网企业靠投资创企共建AI生态的例子并不少见。比如知乎投资面壁智能，共同研发大模型“知海图AI”。牵手智谱，美团则是给自己找到了一个技术和业务更为成熟的盟友。 36kr制图 36kr制图 本文由「 阿菜cabbage 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 视觉中国 +1 373 好文章，需要你的鼓励 阿菜cabbage 新锐作者 106 收 藏 +1 4 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.154 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 智界要打翻盘仗：V9给了年均12万辆指引｜36氪独家 字节跳动2025年海外营收占比创新高，AI投入致公司净利大降70%｜独家 自变量机器人完成近20亿元B轮融资，小米战投、红杉中国领投丨智能涌现独家 小米汽车重磅任命：胡峥楠任CTO，宋钢任参谋长｜36氪独家 欣旺达装车特斯拉，供应全球车型｜36氪独家 阿里电商 AI 新动向：围绕 Token 重构电商，组织迎来新一轮调整｜独家 轻舟、元戎秘交上市资料，和Momenta冲刺港股IPO | 36氪独家 抖音生活服务组织架构大调整，中小商家更重要了｜独家 36氪企业全情报：AI 舆情大数据，让投资决策快人一步 阿菜cabbage 新锐作者 人工智能等前沿科技摸石者，zxycai728 发表文章 304 篇 最近内容 开年连融两轮的“可以玩的抖音”，又融了5000万美金｜涌现新项目 2小时前 一个对话框、一只青蛙、一周4万用户，Ribbi做对了什么？ 2小时前 杨植麟/张鹏/夏立雪/罗福莉/黄超，谈龙虾，谈“Token经济学” 2026-03-27 阅读更多内容，狠戳这里 提及的项目 查看项目库 面壁智能 下一篇 特斯拉卖一辆净赚4万，马斯克：还得降价 毛利率又创新低 2023-07-20 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
