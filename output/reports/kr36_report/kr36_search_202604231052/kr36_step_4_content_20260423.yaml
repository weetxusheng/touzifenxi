          content_summary: '坚守价值还是错失科技股盛宴？'
          content_text: '巴菲特与科技股的爱恨纠葛：保守还是错失机会？｜投资派-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 巴菲特与科技股的爱恨纠葛：保守还是错失机会？｜投资派 投资派 · 2024年04月23日 14:40 坚守价值还是错失科技股盛宴？ 北京时间2月24日晚间，巴菲特旗下公司伯克希尔哈撒韦公司公布了2023年成绩单。全年盈利高达962亿美元，但股价表现却不尽如人意，仅上涨15.8%，远低于标普500指数的26.3%。 这份成绩单不仅反映了伯克希尔哈撒韦公司过去一年的经营状况，更折射出巴菲特的投资策略与市场走势之间的微妙关系。作为一位传奇的价值投资者，巴菲特的投资动向一直是市场关注的焦点。尤其是在科技股方面的态度，更是引发了广泛的讨论和关注。 巴菲特对科技股的谨慎态度由来已久。他曾多次在公开场合表示，科技行业的日新月异和不确定性使得预测公司长期前景变得异常困难。正因如此，在2000年互联网泡沫时期，他选择了观望，从而错过了谷歌和亚马逊等科技巨头的早期投资机会。这一决策在当时引发了不少争议，但也从侧面反映了巴菲特对投资风险的严格把控。 随着时间的推移和市场的变化，巴菲特的投资策略也开始出现微妙的转变。2016年，伯克希尔公司开始大量买入苹果公司股票，这一举动被视为巴菲特对科技股态度转变的重要标志。尽管他强调买入苹果的原因是其作为消费品的属性，但市场普遍认为这是他对科技行业未来发展潜力的一种认可。 近年来，巴菲特对科技股的投资逐渐增多，除了苹果，还涉及亚马逊、Snowflake等科技公司。但他对科技股仍持谨慎态度，认为高科技企业变化太快，难以预测其长期竞争优势。这或许可以解释他对英伟达等科技股不感兴趣的原因。 然而，在2023年科技股欣欣向荣的时候，巴菲特却选择减持苹果股票，并增持了雪佛龙和西方石油两家能源企业。这一策略导致伯克希尔公司的股票表现落后大盘，引发了市场对巴菲特投资策略的质疑。 与此同时，巴菲特对人工智能的态度也备受关注。尽管他的投资组合中包含了一些与人工智能相关的股票，例如苹果和亚马逊，但他并未在这一领域进行大规模的投资。这反映出他对新兴技术的审慎态度。巴菲特曾明确表示，他并不认为人工智能将在资产配置和投资领域引发颠覆性的变革。这种较为保守的立场与他在股东信中的表述不谋而合。在信中，他以幽默的口吻谈及人工智能，却并未流露出对这一领域进行大额投资的明确意愿。 尽管巴菲特在科技股和AI股方面的投资策略引发了一定的争议，但无可否认的是，他依然是一位传奇的价值投资者。他的投资策略始终围绕着寻找具有长期价值的公司进行投资，并坚持自己的投资原则不受市场短期波动的影响。 扫码关注36氪财经 本文由「 投资派 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 视觉中国 +1 23 好文章，需要你的鼓励 投资派 新锐作者 8 收 藏 +1 1 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 2024年全球投资展望：巴菲特策略的影响与启示 随着2024年巴菲特股东大会的临近，这场投资界的年度盛事正吸引着全球投资者的目光。特别值得一提的是，这将是传奇投资者查理·芒格离世后，巴菲特首次股东大会。芒格与巴菲特长达数十年的黄金搭档关系，早已成为投资领域的传奇佳话，他们的智慧和决策深刻地影响了无数投资者。 在这个意义非凡的时刻，巴菲特股东大会不仅是对过去一年投资领域的全面回顾，更是对未来投资方向的深度展望。全球投资者都在热切关注，失去芒格的巴菲特将如何继续他的投资哲学，又将为我们带来哪些新的投资洞见和启示。 在此背景下，36氪以“2024年全球投资展望：巴菲特策略的影响与启示”为主题，策划了一场线上直播活动。我们邀请到星石投资副董事长杨玲，重阳投资合伙人舒泰峰，搜狐号财经优质作者、星图研究院高级研究员付一夫，他们将结合自身的经验和独特见解，深入解读这次历史性的股东大会，共同探讨投资的新方向、新趋势和新未来。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 2026有智青年挑战赛，报名通道全面开启！ 2026中国股权投资行业名册，调研启动！ 直击“宇宙行”业绩会：日赚10亿，分红超千亿！工行高管：股息率超5% 净利微增，投行收入几乎腰斩！中信建投业绩喜忧参半，董监高降薪超2600万 求购银河通用股份；求购宇树科技股份｜资情留言板第158期 90后女创始人被告了 路演报名！携手11个创新项目，引领新质生产力发展丨36氪 × 华映资本 消费降级的风终于吹到「金融消费」上了？ 马来西亚这六年：从没有一张二维码到无现金社会｜投资派 投资派 新锐作者 为投资者搭建行业分享舞台，帮助创业者和个人投资者掌握投资方法 发表文章 91 篇 最近内容 消费降级的风终于吹到「金融消费」上了？ 2024-07-15 安永：新“国九条”的执行情况将成A股市场关键 2024-06-13 体量小但增速快，国内OTA平台与国际巨头差在哪？ 2024-05-24 阅读更多内容，狠戳这里 下一篇 企业想拿融资，先见30家政府 找对方向，才有机会上牌桌。 2024-04-23 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
