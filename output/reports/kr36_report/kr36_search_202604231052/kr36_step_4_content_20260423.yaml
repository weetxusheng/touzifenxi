          content_text: '小米生态链模式十年来最大调整，提出分级管理策略丨Long China 50独家-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 小米生态链模式十年来最大调整，提出分级管理策略丨Long China 50独家 邱晓芬 · 2024年03月13日 14:44 生态链模式是过去流量时代的产物，如今小米终于进行大刀阔斧的改革。 作者丨邱晓芬 编辑丨杨轩 36氪独家获悉，小米生态链部门近期提出了“SAN分级管理策略”，并相应做了组织变革。知情人士称，这也是 小米生态链模式十年以来的一次最大改革 。 具体而言，小米将以S、A、N三个分类逻辑来划分众多的生态链品类。其中，S类将作为小米生态链未来最关键的品类，小米梳理出了 音箱、路由器、门锁、摄像头四个方向。 一位知情人士称， S类是未来有机会做到50-100亿市场规模的品类，由小米生态链和生态链公司共同负责。 S类当中，目前小米被选中合作的生态链公司还在持续确定中——小米音箱的合作方为此前负责过“米兔故事机”项目的小米生态链企业「机器岛」；门锁则选择了此前负责小米智能锁公司的「鹿客」；摄像品类则选择了六家；路由器品类暂时挂空挡。 另外，A类别为未来有机会 超过10亿元规模 的品类，包括空气炸锅、电饭煲、净水器、厨电、空气净化器等等。这一类别的产品运营方式和原来的生态链模式类似，没有出现太大的模式调整。 N类的模式变化较大，主要是锁定规模为 10亿元以下的品类 。36氪了解到，这一品类中，小米未来将会重点把握品质，但对于定价体系、立项标准等等，则会相应放松管控，把控制权交还给生态链公司。 目前，小米生态链公司已经基本完成了和小米方面的战略合作协议签署。对此，小米方面暂无官方回复。 出现这种调整其实也并不意外。在此之前，小米IoT业务的划分逻辑主要是按照产品大类—— 分为智能连接、清洁电器、IoT产品、厨卫电器、健康出行、数码消费、环境电器七个细分事业部， 看起来相对繁琐。 而生态链原先的这种划分模式，也得到了小米方面的反思。 36 氪了解到，不久前的一次会议上，小米方面表示，此前的分类模式，导致生态链项目执行过程中难免出现精力分散，业务缺少优先级。再加上，小米生态链各个品类近几年遭遇增长瓶颈，若继续坚持过于复杂的组织架构， 难免导致整体合作效率变低、项目之间的博弈增强。 为了适应这次生态链分类逻辑的转变，小米生态链部门近期在组织架构上也相应做了调整，三个新事业部的负责人重新明确—— S类体系负责人为程亮，A类为杨浩东，N类为刘迪。 一位知情人士解读称，从原来的7个事业部减轻为如今的“SAN”三个事业部，本质上为了是让” 重的变重，轻的变轻” 。 前述人士称，对于S类当中的关键品类，小米未来将会加强资源倾斜；而对于整体盘子没那么大的品类，小米则计划将整体流程变得更“轻”， 包括推进快速立项、弱化整体的过程管理，废除单品立项标准等等。 生态链模式是小米在流量时代诞生出的产物，在承接小米手机外溢的流量之余，小米对于生态链公司进行投资、业务孵化、模式输出。在过去的十年间，许多不起眼的蚂蚁市场，通过小米生态链模式也跑出了不少爆款。 对于小米来说，生态链模式的支持下，IoT业务不仅支撑起了小米账面收入的1/3，还贡献了不小的投资收入。只是，在小米如今全力押注“人车家全生态”的当下，精力逐渐向造车业务倾斜，过于纷繁复杂的的生态链模式也需要重新思考，以适应如今的生存阶段。 end 本文由「 邱晓芬 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 企业授权 +1 553 好文章，需要你的鼓励 邱晓芬 作者 192 收 藏 +1 17 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.183 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友