          content_text: '36氪独家专访 | 拿到大疆、美团投资后，智能派追赶拓竹，要打“老二”翻身仗-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 36氪独家专访 | 拿到大疆、美团投资后，智能派追赶拓竹，要打“老二”翻身仗 张子怡Leslie · 2026年04月20日 10:00 只要能留在牌桌上。 作者 | 张子怡 编辑 | 袁斯来 智能派的联合创始人兼副总经理陈波变了一个人。 三年前，你见到他，会觉得这人张扬到有些轻狂。陈波对于智能派产品和能力有绝对自信，至于对手，”没什么了不起”。 三年后，他告诉我们：有些事会尽力而为，如果几年后做不出想要的成绩，让更有能力的人来接管业务——甚至会引入职业经理人。 在“创始人崇拜”盛行的创投圈，这是一个让人震动的决定，却也有迹可循。 硬氪独家获悉，智能派已完成数亿元B+轮融资。由美团龙珠、美团、深创投、高瓴、银泰、国策、明荟致远、高新投等联合注资。本轮融资距离上一次大疆参与的轮次不到半年。 过去十多年，人们迷恋、追逐天才创始人，将其视作某种宗教领袖。TA不一定有好的口才，也不需要讨人喜欢，但必须有极强烈的个性和某一方面的天赋。哪怕TA的作风高压、独断、不近人情，也会被无数人膜拜。 从硅谷到中国，从乔布斯、马斯克到山姆.奥尔特曼，潮流从未褪去。而这群梦想家的确造就了一批足以载入史册的明星公司。 智能派显然不属于这个行列。他们从华强北起步创业，是深圳很常见的草根“老板”。智能派公司总部在工厂遍地的龙华，他们喜欢“做生意”，而不痴迷于改变世界——陈波从不会浪漫化创业这件事。 在智能派创始团队身上，你可以看到流淌在很多广东人血液中的企业家精神：如流水一样，去适应时代、市场、地域乃至文化的变迁。他们的身姿灵活，务实而接地气，当发现无法达到目的，可以承认自身不足，并迅速切换路径。 从引入投资这件事，就可以看到智能派行事的转变。很长一段时间，智能派三个创始人不接受外部投资，也不接受媒体采访。“闷声发大财”向来是潮汕老板们的特色。 那几年，他们砸钱、砸人搞研发，还放弃过一款产品，却发现自己的产品和对手差距还是越来越大。 “那一刻我意识到，我们的努力跟不上市场的强度了。“陈波回忆。 （图源/企业） 而解决办法很明确：“如果我们这三个人做不好，那说明我们自己的能力有问题。做不好就让更适合的人来做。” 他们主动寻找中间人接触大疆，三个月就谈妥了融资。过去连个人照片都不想公开的陈波，也开始逼迫自己去接触媒体。 作为“老板”，洪英盛和陈波当然有野心，他们认为3D打印市场还有几倍增量，市场远未到终局。智能派一定要留在牌桌，吃下红利，甚至成为第一。为了这个目的，他们愿意割去创始人团队本能的掌控欲、骄傲和情感。正如陈波所说： “做生意不是玩过家家。” 我们和陈波聊了近3个小时，交流了过往三年的经历以及对未来的规划。 人们容易被有着救世主气质的创始人吸引。智能派不擅长讲述引人着迷的故事，但毋庸置疑，这帮草根“老板”也是让人生畏的对手。 “Be water，My friend”。 01 “革自己的命” 硬氪：你们之前其实不想露面发声的。 陈波： 其实公司的文化风格是由创始人来定调的。我们为什么之前不经常出来讲？我们的创始人不属于那种过于活泼的类型。甚至在两年之前，我们都不想被媒体知道的，连只言片语都不要有。 这跟潮汕人的风格有关，他是潮汕人，我是客家人，其实性格是一样的。我们信奉的就是像马化腾那样最好，闷声赚钱、闷声发大财就好了。 硬氪：为什么选择在现在这个阶段发声？ 陈波： 本质上是发展的需要。我现在观察的是，世界已经进入新周期了。以前我们叫“跨境电商出海”，现在叫“品牌出海”。这是一个中国品牌去正面挑战旧世界品牌（如索尼、苹果）的阶段。谁能成为今后的全世界品牌？除了那些顶级硬核公司，我们这种中小公司在过程中也存在变数。 所以我们不能再“小家子气”地困在自己的圈子里了。 硬氪：您觉得智能派现在最大的短板是什么？ 陈波： 其实我们现在的短板是在软件。我们要明确一点，这块的软件不是互联网那种批量获客、做规模化效应、商业模式闭环的软件，而是要跟硬件强结合的。它包含两个层面：一个是机器本身的固件和切片软件，要驱动硬件工作；另一个是配合机器的生态软件，比如模型库、手机App等。 所以虽然只提“软件”，但最终它指的是你整一个3D打印软件硬件生态相互之间融合闭环的能力。目前来看，具备这样能力的其实只有我们这几家，做的最好的肯定是拓竹，我们做的也还不够好。 硬氪：大家以前总觉得3D打印是拼硬件参数。拓竹进场之后，它的软件优势到底体现在哪？是打印效率，还是简单的完成度？ 陈波： 拓竹的入场把这个标准拉到了现在的点。其实从行业拆解的角度看，他的硬件并非最优，但他的软件确实是护城河，其他家目前来说，包括我们，也很难在短时间内追得上的。 软件解决的核心其实就是“稳定性”。拓竹出来之前，大家的软件基本处于“刚刚能用”的程度，是作为辅助位的，硬件才是创新的大头。但你看后来的发展，你用一般的硬件，只要软件调得够好，在用户体验侧一样可以很丝滑。 硬氪：这种“稳定性”在用户端最直观的差异是什么？ 陈波： 最核心的点在于成功率，单次打印和持续打印的成功率。 我用一个直观的说法。如果是家庭用户购买使用3D打印T2梯队的品牌，这个机器设备可能每使用半个月，它要让机器重置、自我调平一下才能继续用。这在以前也没什么大问题，因为已经不需要用户手动去调嘛。但拓竹可以持续稳定超过一个月以上。 这就是一致性的差异。它不是硬件的问题，硬件复位都能恢复精度，但它是软件控制。你每打完一次，硬件产生的精度偏差，能不能被算法记住？能不能每一次都复原？这是算法的积累，我们确实还在努力追赶当中。 硬氪：所以你们现在才要用大疆的方法论？ 陈波： 我们确实在学习大疆开发产品的方法论。他的软件和算法是我们需要的，还有一点是大疆跟硬件结合的固件开发方法论。不是说看他开发出的固件是怎么样的，而是要看这套体系。整个行业包括拓竹都会出现这种情况：硬件产品做好了，但是软件调优跟不上。如果你把这套方法论拿过来，就能修正我们之前不断踩坑的过程 硬氪：你们之前想过自己做吗？ 陈波： 我们以前是尝试过组建团队自己做的。前几年，我们也招了一帮人来突围。有成效吗？肯定有，但相当于都在试错，效率极低。我们发现硬件是可以逐步积累迭代的，大家已经掌握了规律，但软件它是0和1的关系。我们之前的团队缺乏软件思维，你组建一个团队，他成长需要时间，而你的对手也是在进步的。所以我们现在调转头来，在改进这种方式。 硬氪：如果引入了这套体系，经过验证还是不能出好产品，你们会有更激进的调整吗？ 陈波：我们的表态非常明确，就是“革自己的命”。 如果2024年、2025年的产品做出来还跟不上市场的期待值，或者达不到跟竞对PK的程度， 那就说明管理能力确实在那，到天花板了。 我们的态度是开放的：做不好就让更适合的人来做。我们甚至会考虑引入职业经理人。说实话，如果我们这三个人做不好，那说明我们自己的能力有问题。我对我的管理部门也一样，如果无法带领前进，我就会退位让贤。 硬氪：那这种深度的合作甚至接管，怎么保证自己的掌控度呢？ 陈波： 还是那个逻辑：如果终止合作，你有没有其他的出路？没有。你虽然利润率降低了，但从利润总额来看，如果你以前赚一个亿，将来变成赚三五十亿，这有什么不可以？ 做生意不是玩过家家。 我们起家是华强北，这是非常深圳非常草根的创业，后面转型从跨境电商的模式变成产品开发。当时也是刚好有这个机会，赛道有很高的天花板，我们可以去追逐。但如果我们努力之后，还是不行，那肯定要调整。 Saturn+4+Ultra（图源/企业） 我打个比方，如果我给你20万块钱，你可以去买一辆很不错的车，马上就能开；但如果你拿这20万去自己研发一辆车，最后可能连个轮子都造不出来。那你说哪个更划算？你自己做不来的时候，就得有决断力。 只要能留在牌桌上，就好过被扫出去。 硬氪：这种转变具体是什么时候发生的？我记得23年见您的时候还挺意气风发的。 陈波： 转变发生在2024年底到25年初。理论上我们应该在24年底发一款产品去抓增量，当时有的友商已经两年没出新产品了，你要抢在他之前。 但是我们23年组的那个团队做出来的产品一直在延期。 那一刻我意识到，我们的努力跟不上市场的强度了。 当时非常煎熬，你分明就已经是all in心态去做了。所有的资源都调配在这个产品研发上，但是交出来的结果就是跟不上对手已经发布的产品。 硬氪：你们之前没有经历过这样的打击？会自我怀疑吗？ 陈波： 之前比较顺， 但自我怀疑不存在的 ，我们已经创业十年了。 我们是立刻去找路在哪，回过头去分析这些“优等生”的成功规律，会发现一个很有趣的现象：在硬件创新出海的领域，像拓竹、影石、EcoFlow这些头部品牌，他们的核心团队很大程度上都源自大疆。这说明大疆不仅输出产品，更输出了一套被市场反复验证过的、系统级的硬件工程能力。 这种基因的共通性，让我们意识到大疆就是那个能帮我们打破瓶颈的技术母体。既然看清了最优解就在眼前，那我们就直接去找大疆，这就是我们寻找的出路。 当时通过熟识的中间人一牵线，双方从初次交流到确定合作的速度极快。 硬氪：那当时那代产品延期的主要原因是什么？ 陈波： 还是工程量产的能力。你预研了很多技术，但把这些拼在一起放在一台机器上时，单点的Bug会影响整体。当时表现出来就是多色效率不达标，以至于我们最后被迫在海外只发了一版单色的机器。而国内我直接没卖这代产品，你想我多煎熬？ 02 当第二毫无意义 硬氪：其实我记得你们这些年有几款产品众筹成绩也挺好的。 陈波： 后面那台机器，去年在海外出货了20多万台。20多万台，从行业角度上来说这已经是一个爆款了。 但是，如果你是在第一名面前，你就啥也不是。 你就算单机已经是第二名了，但第一名如果是100万台，20万台就是5倍的差距。 那这种差距下，你就算做第二又有什么意思呢？第二第三第四有什么区别吗？跟第五、跟第十有什么区别吗？没有。怎么交替名次都是没有意义的。 所以说你确实做出了一定的东西，但是在外界观察你的时候，你就是不够分量。 硬氪：23年那会儿你们已经10亿规模了，去年23亿。这三年虽然在涨，但好像没有以前那种翻倍的高速了。 陈波： 如果按年化去看，我们其实还是保持住了30%到50%的增长速度。只是因为拓竹的进入，他的增量跟增速要快过我们这一波，以至于我本身的增速就不值得一提了。 在前期差距拉开一点点的时候，比如我是10亿，对手是25亿，我还可以判断说只要加倍努力，看能不能赶得上。但3年过去了，他100亿，我23亿， 那就说明我之前的努力是不够用的。你只有苦劳没有功劳。 硬氪：那你们的目标是多少？ 陈波： 今年目标要做35～40亿。未来跟拓竹的差距不能是现在的5倍，最多一两倍。 硬氪：很多投资人会觉得，我投个老二好像问题也不大，就像百事可乐和可口可乐的关系，智能派作为一个标的，在资本眼里价值在哪？ 陈波： 资本对我们的态度确实有你说的这个逻辑。老大投不进去了，或者估值太高性价比不高，那你智能派就是一个好的标的。起码创始人团队还在正经干事，市场又还在买单，万一后续有几项技术落地成了“X因素”，就能吃掉增量市场。 我们自己内部的交代也是这样：不是说两三年内就得超越。我们的态度是现在能不能留在牌桌到结算前。 结算前有几个判断要点，谁先上市是最早一个时间判断节点。 硬氪：但外界会担心，领先者在跑，你们也在跑，这个差距会不会就此固定下来，甚至越拉越大？ 陈波： 如果从短跑看，确实是这样。 但这个行业我认为至少还有10年的长期增长竞争。存量竞争才会让第一家吃掉全部利润，但现在还有增量，资本也会给你助力。 而且，这个行业的技术集成度并没有想象的那么高。现在的机器跟家用电器还存在非常大的门槛，不是立刻就能用的。在这个过程中，只有领跑者能解决问题吗？并不是。 硬氪：所以智能派的想法是，你们想让产品真正走入家庭？ 陈波： 大家都想走入家庭，都在推低售价、小体积的系列。我现在直接把大疆当老师，无缝对接去学习。我赌的就是在几年之内把这个技术工程能力继承过来。 现在的3D打印机，有点“傻大笨粗”。现状来说，海外差距真的很大，国内市场还要看它的潜力。海外市场源于DIY，包容性强，觉得“折腾”机器本身就是一种乐趣。 硬氪：感觉国内跟海外的产品定义思路完全不一样，国内市场是不是需要从底层形态发生变化？ 陈波： 对。如果按照打分制，国外你做80分的产品，他们就买单了；国内你得做到95分以上。90分可能才是及格线，95分才算优秀。如果你只有90分以下，国内用户到处都在吐槽你。 国内更强调实用主义。买这个投入成本是多少？多久收回成本？即使是个人用户也会想：我买来给孩子，他满意了，是不是可以搞个创客项目加分？海外没有那么多功利主义，最大的考虑是它能给我带来什么乐趣。 硬氪：五倍的差距，在中长期内是有可能弥补的吗？是不是要么对手犯了错，要么技术发展到某个拐点。 陈波： 指望对手犯错不是一个老板该有的思维。我们的判断是，技术本身都会经历发展曲线，最后会趋同的，就像手机一样。最终大家的硬件差距会被压缩在一定的空间里，那时候就会更考验你除了硬件技术之外的其他能力——比如市场成本、供应链。 这一块我们是有信心的。硬件部分到最后性能表现都会趋同。 特别是我们获得赋能之后，产品形态就会很拉近。剩下的就是时间积累的问题。 03 做生意是系统工程 硬氪：你们的生存之道，听起来跟领先者的风格完全不同。 陈波： 大家都有自己的生存之道。智能派不是一个新公司，我们15年就开始做海外线上电商和线下分销。我们对品牌和价格体系有极强的掌控能力，因为我们线上电商全是自营盘。 很多友商基本上是贸易起家，先卖货给分销商，品牌掌控力弱。我们不一样，我的分销商只做线下，不能做线上。这样虽然压缩了分销商的选择范围，但我掌控了全盘的市场品牌。 硬氪：听起来像一些手机厂的逻辑？ 陈波： 也是资本认可我的一个点。我可以不做出一个100分的产品，但我可以把这个产品卖得很好。 在我们看来，国内市场90分可能才是及格线，95分才算优秀。 硬氪：智能派一直强调成本优势，你们的成本思维和传统的模式有什么区别？ 陈波： 我们的成本优势不是偷工减料，而是通过工业方式和工程量化实现的。我们要推动行业内不成熟的量产技术通过规模化降本。 产业协作非常关键。洪总（洪英盛，智能派创始人兼CEO）经验非常深，我们经常开玩笑说 任何一个电子产品到他手里，30分钟内他能把BOM（物料清单）表估出来 。你想过他那一关很难。比如跨行业零部件整合，有些零件在别的大行业里只是辅料，用量有限；但我们通过整合把它变成主料，用量巨大，规模化优势就出来了。你必须认识足够多的供应链。 硬氪：供应链管理中，贪腐和费用控制一直是难题。 陈波： 体制运作的威力远超大家的想象。要看你体系是怎么样的，能不能撇除这块的问题。 我们的费用控制非常严苛，一直关注这一块。如果跟我说物流差价超过3毛钱，那你明天就不用上班了。差价3毛钱，我一个月几千吨货，那是几百万的差异。 财务算账不怕差十万百万，就怕差一分钱。这种从小项积累出的优势，是最难被察觉的。 硬氪：这种大规模的转型，团队内部会有分配和文化上的冲突吗？ 陈波： 肯定会有，我们认为产品在相当长周期内是最重要的，所以资源一定会向研发倾斜。我们的运营团队在北站，技术团队在办公条件更好的深圳湾，这就是一种布局上的“妥协”和重心偏向。 04 AI时代，最缺的是什么？ 硬氪：我记得23年拓竹刚起来那会儿，您对他们的态度和现在好像有一个挺大的转变？为什么会有这么大的转变？是因为AI吗？ 陈波： 我其实态度是一致的。当时采访的时候，我们光固化业务还是绝对的大头，FDM是新投入的战场，基础积累确实比较浅。现在虽然还有差距，但是已经在迫近。问题是，现在又碰上了AI时代。AI是以“天”为维度在进步的，那内容以前的积累还是不是正资产，今后也要打个疑问。 硬氪：您觉得AI会把以前的积累“洗掉”吗？ 陈波： 对。以前3D打印的内容靠设计师个体的能力来创作，然后给所有用户使用。因为普通用户不具备生产3D模型的能力，所以大家都在建设模型库，从数量、质量上去追，投了很多钱在烧。这纯粹是互联网的烧钱打法。 但现在回头看，AI进场后，以前的这些投资可能会被归零。AI生成内容（AIGC）会迅速冲击原有内容库。所以现在大家都在双线押注：既保留内容库的领先优势，也要投入AI生产模型。 硬氪：那现在训练这种3D垂类大模型的难点在哪里？是人才吗？ 陈波： 训练真的很难，人才极其难找。大厂的防御都很牛、很强，我们很难挖过来。我们想建设3D大模型的训练团队，但挖不来头部厂商最适配的AI人才。说实话，出不起钱，友商现阶段估计也出不起。那些核心团队都是年薪千万以上，还要再加上等额现金几倍的股权或者期权，你怎么挖得动？ 算力层面，我们也只能采买平台巨头的，你不可能自己布局，大家买的价格都没本质区别。现阶段只能专注自己，然后适时决策入场。 本文由「 张子怡Leslie 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 企业授权 +1 88 好文章，需要你的鼓励 张子怡Leslie 新锐作者 14 收 藏 +1 1 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 一个对话框、一只青蛙、一周4万用户，Ribbi做对了什么？ 专访Eight Sleep CTO：被马斯克们买爆的AI床垫，进中国先砍一刀订阅费 专访荣耀AI专家李向东：端侧AI方向还没收敛，但AI手机是最好的载体 半年融资近2亿，他要用AI发球机器人解决全球1亿人的训练难题｜硬氪专访 对话前阿里高管、天猫设计家CEO：这些年烧掉千亿，家装行业还能怎么做？ 36氪专访 | 前小米高管王腾的下一站：从睡眠入手，抓住AI硬件十年一遇的创业窗口 前迪士尼工程师和MJ联创，要做一款「会呼吸」的DIY仿生机器人｜硬氪专访 小牛电动胡依林：一家成立12年的两轮电动车厂商决定转型AI，“all in or nothing” 追觅生态链多了家清华系公司，要用AI储能融入智能家居体系｜硬氪专访 张子怡Leslie 新锐作者 关注华南创新公司，欢迎交流。 发表文章 212 篇 最近内容 36氪独家专访 | 拿到大疆、美团投资后，智能派追赶拓竹，要打“老二”翻身