          content_text: '马来西亚这六年：从没有一张二维码到无现金社会｜投资派-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 马来西亚这六年：从没有一张二维码到无现金社会｜投资派 王晗玉 · 2024年07月11日 15:40 电子钱包：马来西亚年轻人的“梦中情厂” 。 作者 | 王晗玉 编辑 | 潘心怡 5月底的一次前往吉隆坡的出差中，由于航班抵达时间晚了两个多小时，黎国威原定于下午2点需要到公司召开的沟通会，临时改为线上会议。 黎国威常驻新加坡，是蚂蚁数科国际业务相关负责人。他想在酒店完成电话会，不过最终由于异常卡顿的信号问题，只能取消。 受限于地理条件，马来西亚的数字基础设施不算发达。据RCR Wireless News报道，至去年9月，马来西亚5G网络覆盖率为68.8%，但5G采用率为4.2%。 慢慢吞吞的马来西亚人和追求效率的互联网也总显得不那么“搭介”，就在六七年前，整个马来西亚社会甚至没有一张二维码——这个在中国大街小巷早已普及的电子支付方式。 疫情加速了一切，实体经济发展空间逼仄的几年里，电子支付伴随网购的普及逐渐被马来西亚消费者接受。 黎国威此次拜访的客户之一，是马来西亚市占率最大的电子钱包公司TNG eWallet 。 目前马来西亚3200万人口中， 已有超过60%的用户注册了TNG eWallet ——它在生活中更被熟知的叫法是Touch''n Go。 搭上数字经济快车，马来西亚正正驶入“无现金社会”。当追求高效的互联网文化遇到热带城市的“不慌不忙”，一种温吞和疾驰的冲突油然而生。 如果去当地旅游，导游大概率会不止一次地提醒，遇到慢悠悠的服务人员时尽量不要着急上火催对方，因为一催他们就容易慌，一慌动作就更慢。 延伸到数字经济上，慢有时候就等于“卡顿”。典型的案例是2020年3月和4月，两次海底电缆故障，让马来西亚陷入全境网速变慢的困扰之中。 “慢”的对立面则是，如今马来西亚的城市居民基本可以不带钱包出门，背后的新零售电商、直播带货、网店和社交媒体销售平台一派欣欣向荣，加速向前。 尽管马来西亚数字经济的体验感时常出现“卡顿”，但经验告诉中国企业，一旦尝到便捷支付的甜头，消费习惯就很难回头了。 解决“卡顿感”，蚂蚁数科这样的科技公司在马来西亚能做些什么？ 空白：六年前没有一张二维码 马来西亚的电子支付故事要从政府一次性发放50多张电子支付牌照说起。 回忆起当时的场面，Touch''n Go CEO Alan Ni形容那像一场“百团大战”。首先，拿到牌照并最终推出的电子钱包就有38个，其中包括Touch''n Go、GrabPay、ShopeePay等。 其次，这38家竞争者不乏背景雄厚的股东，如Touch''n Go的第一、第二大股东分别是马来西亚第二大银行CIMB和蚂蚁集团，GrabPay的投资方有Uber、软银、滴滴出行，ShopeePay则背靠东南亚著名电商Shopee。 这一背景下，不少电子钱包在上线之初就各有自己的优势领域。如GrabPay天然就有网约车的场景优势，ShopeePay拥有电子商务的流量入口，Touch''n Go则借助国民度超高的预付卡（类似公交、便利店一卡通）率先在加油站、高速公路收费站等场景推广自己的电子支付。 如今在高速公路收费站、停车场等场所已有电子钱包专用通道 摄图：36氪 不过在习惯刷卡支付的马来西亚，真正深入线下推广电子钱包， 仍经历了走街串巷说服中小商户的“地推期”和利用补贴吸引用户的“烧钱期” 。 转折点出现在2019年，当年马来西亚财政部为减轻年轻人开支负担、支持实体经济，专门推出“ePemula计划”，通过四个本地电子钱包向特定年轻人发放津贴。 政府的财政补贴令正在艰难拓客的电子钱包短时间内迎来大量用户下载。以Touch ''n Go为例，用户下载完成后，需在线完成身份认证才能领取补贴。 这意味着电子钱包在短期内将面临一个流量高峰 。 Alan Ni回忆说，当时Touch''n Go几天之内就有上百万人要做身份认证。流量峰值下，如何维持系统流畅运行且保证较高准确度，成为Touch''n Go上线以来的大考。面对这项挑战，Touch''n Go选择与蚂蚁数科合作，借助后者ZOLOZ的核心产品eKYC（在线身份认证）技术，完成大量用户的身份认证。 据了解，eKYC可实现用户全自助、无人工干预完成“在线身份认证”，实人认证准确率达到 99.9%，将原本至少一周以上的注册时间，缩短至3分钟。 借助eKYC技术，Touch''n Go也在“ePemula计划”期间获得了领先超车的机会。据其CRO Foo Yeong Jin透露，Touch''n Go在这个项目中市占率占到70%，最终获客500万。 “我们向马来西亚央行证明了两件事， 第一我们能够接得住大流量 ，这个系统没有垮； 第二认证的准确率很高 ，没有用户抱怨。”Alan Ni补充说，Touch''n Go也成为马来西亚第一家获央行批准使用在线身份认证的电子钱包。 目前Touch''n Go在马来西亚市占率约为60%，在用户量这一层面，是马来西亚最大的电子钱包——在该国3200万人口中，已有超过2700万人注册Touch''n Go 。 而根据PayNet2022年的数据，当年马来西亚已有78%的人拥有多个电子钱包。 移动支付的发展在一定程度上加重了其他各个行业推动数字化转型的迫切心情。 黎国威对这一趋势感触颇深。最近几年，他的工作是把蚂蚁集团在中国大市场中磨练的最佳实践和技术能力以产品形式输出给海外客户。去年其负责的国际市场业务增速达到300%，东南亚六国是业务主力之一，马来西亚则聚集了一批标杆客户。 回想与当地客户建立合作的过程，黎国威说很多都是“一拍即合”， 双方决定合作的时间非常快 。 成立至今已有50年的Kenanga Investment Bank Berhad（肯纳格投资银行，以下简称“KIBB”）是马来西亚的头部投行。去年，黎国威在瑞士的一个研讨会上遇见该集团董事总经理谢伟良，谈及靠数字化方案提高投资者理财效率的想法时，双方“一拍即合”，当下即敲定合作意向。 “我们在6月见面，8月很快签订了合同。”谢伟良说。而签约后约4个月，黎国威的团队就完成了合作方案中底层技术的搭建。 目前，KIBB的综合金融服务APP KDI Go即将上线。这也是KIBB与蚂蚁数科此次合作的重要产品。 简单来说，KDI Go就是将KIBB过去几年陆续推出的股票经纪、智能投顾、电子钱包、外汇兑换等多项数字产品整合嵌入到一个超级APP中。用户通过一个KDI Go，就能使用KIBB的各项数字服务。 而此前的六七年间，KIBB的多个数字产品分散在各个独立的APP中，同一个用户使用KIBB的金融服务，需要注册、登录多个不同的APP来回切换。 反差：从“只有一个网站”到“超级APP” 一个一站式的金融投资平台，在马来西亚的金融行业数字化过程中，无异于一个行业超级APP。 谢伟良提到，如果用户投资多个资产类别， 以前需要用复杂的Excel来处理、统计整体收益 ，但通过KDI Go的整合APP，所有投资组合都能一目了然。 这种超级APP的概念在中国金融界并不陌生，但在马来西亚，KDI Go则将是第一个综合金融服务APP。 一方面，当地监管层需要投入更多时间了解超级APP的逻辑和潜在风险，以建立安全可控的审批规则；另一方面，金融机构也需找到一个既掌握了成熟技术又已经过高并发、高负载的市场条件验证的合作伙伴。 无独有偶，在另一个传统领域——房地产界——马来西亚也刚迎来第一个超级APP。 S P Setia是目前马来西亚销售规模最大的房地产集团，开发业务涉及住宅、基础设施、商业综合体等业态。今年5月，其与蚂蚁数科端云一体一站式移动开发平台mPaaS合作的智慧社区超级APPSetia Go 正式上线。 与国内房地产企业在2018年、2019年前后纷纷推出自家APP的想法类似，S P Setia也是希望借助Setia Go增强与业主、消费者的交互和情感联结，以此拓展房地产业务的边界。 目前这个APP内聚合了多个如家政服务等相关的初创公司，用户可一站式管理房产、参与开发商组织的优惠活动。 在技术层面， 蚂蚁数科mPaaS向S P Setia提供提供了一系列模块化工具和组件，使开发人员可对业务应用进行模块化改造。 据悉，原版本APP更新需要等待应用平台1-2周的上架流程，但因小程序架构带来的无感更新能力，现在更新时间已缩短至半小时。 而在业务层面，SP Setia将借助mPaaS优化房产管理、购房交易、营销推送、会员权益等功能，进一步活跃用户生态。未来， SP Setia对Setia Go的计划是能够为集团直接贡献营收 。 这个期待，即便在当下的中国，能实现的房地产企业也少之又少。除了技术层面的原因之外，两国数字经济发展阶段的不同， 也让马来西亚各行的头部企业更容易抓住第一波红利 。 如在中国，各领域占主要地位的APP大多是由独立的第三方成立，如聚焦房产经纪的贝壳找房、在线旅游服务的携程等，房企、文旅集团则几乎是在倒逼中开启自己的转型。相比之下，马来西亚似乎正好相反， 行业类APP先在头部企业中酝酿，其后才推动社会化转型 。 对于这样的差别，黎国威亦认为是发展阶段不同带来的现象。“目前东南亚也有综合性的超级APP，比如Grab、Air AISA，但行业APP还得由（头部）企业来带领这个趋势。因为他们有的是客户群、品牌、客户的信任，通过超级APP再让客户能去购买或者享用其他附加值服务或生态服务，会有带动效应。” 他认为当前阶段马来西亚多个行业的数字化转型路径还要靠当中的佼佼者来带动， 但后期不排除有类似行业综合性的超级APP出现 。 不过跳出“佼佼者”的视角，将目光投向马来西亚更广大的中小企业群体，他们对于数字化的认识还相对初级。 陈家兴是马来西亚区域策略研究所（CROSS）的智库署理主席，他就指出，根据马来西亚中小企业局的调研报告数据，在2020年， 有77%的中小企业对数字化的理解仍停留在只有一个公司网站这样最基本的阶段 。 这种反差或许是当地的狂奔与温吞共存的另一种体现。 快车：数字建设狂奔 如广大中小企业一样，现今马来西亚广大网民对于互联网的认知也相对初级。 尽管吉隆坡大街小巷的商户已经贴满Touch''n Go甚至是Alipay的支付标识，但除了移动支付外，马来西亚人对于数字应用的使用更多还是在娱乐层面。 陈家兴曾做过数字经济的调研项目，他也表示，目前马来西亚的家庭使用互联网， 主要都是进行一些如社交网络、下载图片、娱乐休闲、玩游戏等活动 。 “他们对于互联网的认知和应用还不太足够，虽然互联网、智能手机的普及率比较高，但是一些小程序还不太能掌握。”陈家兴说。 KIBB推出KDI Go后的关注点也是马来西亚用户对这个超级APP的熟悉度。“虽然金融服务是我们的重点，但（现阶段）我们会更加注重去教育用户使用超级APP，因为在我们金融行业没有太多人接触过这一块。”KIBB的董事总经理谢伟良坦言。 扩大到产业层面，Touch''n Go的Alan Ni也认为，马来西亚的数字支付已经相对成熟，但是用电子钱包或电子平台来做金融服务，还处在早期阶段。 此外，前述多位政府、企业人士均提到，当前制约马来西亚发展数字经济的一大障碍是人才储备不足，尤以AI类为甚。 如Touch''n Go就在中国的杭州、武汉设有两个基地，两地共有100多名员工。Alan Ni解释说：“我们想做的事情要在马来西亚当地找一些有经验的人才非常难，中国因为人才库比较大，招人相对容易一些。” 面对人才缺口，当地政府正投入更多资源试图改善这一现状。 去年，马来西亚成立了“数字化转型部”——目标是在未来10年将马来西亚打造成为跻身全球前30大经济体，并将该国发展成区域数字中心。今年，当地又成立了第一个人工智能院校。 过去五年，当地政府还曾先后出台《国家数码网络计划》《马来西亚数字经济大蓝图》《全国电子商务策略路线图2.0》《马来西亚数字催化计划》《数字游牧区域枢纽计划》等一系列数字经济促进计划。 另一方面，当地数字化应用的普及率则在近年快速提升。 此前在2019年，Alan Ni提到马来西亚的电子钱包普及率较低，信用卡相对稍高一点。但疫情之后，信用卡、借记卡普及率增长了约10%-15%。 电子钱包则增长了约40%-50% ，差不多是信用卡、借记卡的3-4倍。Touch''n Go基本每年以100%的速度增长。 根据马来西亚统计局公布的数据，马来西亚电子商务附加值产业市场规模已从2015年的891亿马币，至2021年扩大到2011亿马币。马来西亚数字消费人口在2022年也达到了2500万人。 同时， 数字科技企业正成为马来西亚年轻一代的“梦中情厂” 。 过去每年马来西亚都会组织大学生票选最想加入的公司，去年金融科技类公司中票选的第一名是Touch''n Go，第二名是Grab（东南亚网约车和送餐平台公司），第三名是Shopee（东南亚跨境电商平台）。 实际上，回看中国的数字化发展，市场中也是先出现阿里巴巴这样的公司，经历电子商务等业务的锤炼，才有蚂蚁集团这类将实践经验转化为产品输出给各行各业的金融科技公司。 对标到马来西亚，尽管当前网民习惯、数字金融服务还在初级阶段，但伴随数字应用普及率提升以及年轻一代的更多关注，未来也将产生更多如中国市场中已有的产品类似的服务。 Alan Ni即透露Touch''n Go后续还计划推出类似花呗这样的服务，目前公司内部技术层面已完成开发，主要需等待审批等外部流程；KIBB也透露，在接下来的两三年，公司将在KDI Go平台内继续推出7-10个产品。 Alan Ni说，“我觉得现在在中国看到的事情， 可能后面五六年在马来西亚也会变成现实 。” 在马来西亚，走过二维码空白的时代，更多政府资源、头部企业以及年轻人的目光投向了数字蓝海更深处。 关注获取更多资讯 本文由「 王晗玉 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 视觉中国 、 作者拍摄 +1 170 好文章，需要你的鼓励 王晗玉 新锐作者 57 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.198 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 2026有智青年挑战赛，报名通道全面开启！ 2026中国股权投资行业名册，调研启动！ 直击“宇宙行”业绩会：日赚10亿，分红超千亿！工行高管：股息率超5% 净利微增，投行收入几乎腰斩！中信建投业绩喜忧参半，董监高降薪超2600万 求购银河通用股份；求购宇树科技股份｜资情留言板第158期 90后女创始人被告了 路演报名！携手11个创新项目，引领新质生产力发展丨36氪 × 华映资本 消费降级的风终于吹到「金融消费」上了？ 寻求汽车领域上下游并购标的；转让伺服电机领域头部企业股份｜资情留言板第140期 王晗玉 新锐作者 TA没有写简介，但内敛也是一种表达 发表文章 162 篇 最近内容 蚂蚁终圆券商梦 2026-03-30 「泡泡玛特们」能回A股了？ 2026-03-11 B股，最后的金矿？ 2026-01-26 阅读更多内容，狠戳这里 下一篇 2024上半年，谁在小红书疯狂涨粉？ 美女失宠，消费沉寂，搞笑、游戏成最大爆款 2024-07-11 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
