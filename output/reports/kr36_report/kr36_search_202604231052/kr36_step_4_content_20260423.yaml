          content_text: '当00后开始做老板：佛系、平等、「无组织无纪律」-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 当00后开始做老板：佛系、平等、「无组织无纪律」 后浪研究所 · 2022年04月24日 09:30 00后老板，刷新职场上限。 封面图 2个月后，第一批00后即将走出校园，正式踏入职场。 在后浪研究所的上一篇新青年观察里，卷不动的00后，已经不再吃企业“画饼学”这一套。 他们一言不合就辞职，炒老板鱿鱼；讨厌刻板条规，厌恶官僚作风、等级分明的职场环境；不在乎赚多赚少，为了不加班，宁可降薪跳槽。也有段子说：不要随便惹一个20多岁刚毕业的年轻人，因为他们可以随时拍屁股走人。 但如今，95后也不再是稚嫩的“职场新人”，当他们成为管理者后，会给职场文化带来怎样的变化？ 当年轻的Z时代成为企业的管理者，这些年轻的老板，又会怎样把自己理想中的职场变为现实？ 后浪研究所找到3位20多岁的老板，聊了聊年轻管理者的心得与困惑。 她们来自完全不同的行业，不同的文化背景，但是在她们身上，我们看到了一些相似的品质，以及，初入职场、初为管理者的她们，经历过的迷茫与收获。 在这些故事里，你会看到一个被年轻人刷新的“职场”。 不需要打卡也不鼓励加班，管理上很佛但拿结果说话 张琳 26岁 坐标北京 内容创业公司巨有文化创始人兼CEO 2018年的时候，我还在清华读研，和合伙人通过一份综艺节目的策划案拿到了第一笔融资——就这样，巨有文化诞生了，我们做了自己的第一档综艺节目《你次饭没》。 起初，公司只有我和合伙人赵英男两个人，《你次饭没》第一季过后，我们才开始招人。现在，公司只有9个员工，其中4个同事是线上办公，分布在世界各地，最远的一位在多伦多。 我和合伙人开玩笑说，如果我们有一天上市了也只有9个人，那就太牛了。 张琳 我们团队成员都很年轻，年龄最大的同事是92年的，工作时间是中午12点到晚上8点。 每天正午，大家才会陆陆续续来到公司。一进门，公司的两只狗就会凑过来迎接我们，其中有一只狗特别灵，它会给人开门，而且只给它认识的人开门。 员工撸狗 到公司后，大家会一起喝个咖啡，等阿姨来做饭，聊聊新闻或身边的事，然后再各自工作。偶尔心血来潮，晚上也会一起煮热红酒。工作没有思路的时候，可以去小区遛狗、去露台望天、去厨房煲汤……八点一到，完成工作的同事就准时下班了。 我妈妈总觉得我们应该调整成上午上班，现在这个作息太不养生了。但我觉得这还挺符合年轻人习惯的，不用挤早晚高峰的地铁，上午也可以睡个懒觉。 我是个挺佛的管理者，不需要打卡，也不鼓励加班，上班的时候，我们也经常聚在一起聊天。 在内容行业，这并不是在浪费时间，反而更容易“出活儿”。我们在聊的很多困惑最终也变成了某期播客或者视频的选题，把日常生活记录下来做成新的内容板块。 虽然在管理上佛系，但我们是拿结果说话的。 不管是剪播客、剪视频还是做策划案，内容必须过关才能留下，试用期也是有可能走人的。 平时，我也会收到大量的简历，不乏一些被我个人吸引，或者被“清华北大”等花里胡哨的标签吸引来的求职者。曾经我有一位粉丝是互联网大厂的程序员，在微信群里加了我，跟我说很喜欢我们公司，想来这里工作。然后他就真的裸辞来应聘了，但是待了不到一周就走了。 张琳的办公环境 创业初期，我花了非常多的时间去判断哪些人能长期留在这里，哪些人仅仅是为了凑热闹。 识人并不是一件容易的事，看到很多新员工一波一波地来，又一波一波地走，我也很头疼。 最难受的是谈离职的时刻。 那个时候我还没大学毕业，很多人是为了我来到这个城市，租房子、过北漂的生活，但是我却要告诉对方，你试用期没有通过，可能要离开这里了，作为一个年轻的老板，我其实很难开口。 后来，我也逐渐学会如何筛选出优秀的同事—— 作品就是最好的试金石，让他留下来做一两期节目，很快就能看出来适不适合。 来到我们公司的更多还是天马行空、不走寻常路的年轻人，是那些希望为这个时代的人文主义做一些改变的人。 张琳和同事玩顶楼cos 我们的管理结构比镜子还扁平。 目前业务主要分为两块，一个是内容部，一个是商业部。内容部的工作模式就很像一个编辑部。虽然我是最终做决定的人，但所有内容的生产过程都是大家一起完成的，商务拓展也是我与大家一起协调。 虽然我是这个公司的CEO，但在我的定义里，我们更像朋友，在工作上我需要下达任务或者监督，但还是有商有量的。 CEO只是一个符号，它只是说明我在公司的时候大家会比较安心，我能给大家提供一些情绪价值，仅此而已。 这是我毕业后的第一份工作，也是第一次创业、做管理者。刚开始也会焦虑，毕竟要完成一个公司的营收，养这么多人。 但时间久了，我也逐渐学会如何把情绪和事实分开——这对管理者来说非常重要。 一些久经商场的前辈曾告诉我，在创业初期，你原本以为会与你紧紧站在一起的人，很可能在公司状况不好的时候，转身去其他公司。他说这是一种被“背叛”的感觉。后来，我也遇到了类似的情况，当对方离开的时候，我也升起了一种被抛弃的情绪。 但是那位前辈也告诉我，他又开启了新的项目，找到离开的伙伴，对方还是很愿意帮忙，马上辞掉了自己当下的工作。这个时候我就意识到，如果站在对方的立场上，这不过是权衡利弊后最正常不过的选择。 我们不要用“道义”来绑架个人职业选择。 员工晚餐日常 对初入职场的人来说，我们太容易把自己的情绪强加在事实上了。 我会刻意去提醒自己要把这两者分开，这是我在创业以来最大的成长。 我不太希望员工有很强的打工人心态，纯粹为打一份工、赚一分钱而来。毕竟我们还是一个小而美的创业团队，我希望每一个员工都有自己独立的精神和定位。我经常鼓励同事们去做一档自己的播客或者视频，最常说的一句话就是：“你太适合去当一个主播了”。 后来也确实有同事这样做了，不管是在公司期间，还是离职之后，我都由衷为他们感到开心。巨有文化是很多人毕业后的第一份工作，大家没有什么职场的概念，也不懂所谓的职场套路和规则，我不想把这些东西带给大家。 我很希望每个员工来到公司能够发现自我，或者解答了人生现阶段的某些困惑，就算离开了公司，也能找到喜欢的工作，持续保持热情。 这是让我最有成就感的事。 钱也是员工帮你赚的，我们应该平等 鲨鱼 23岁 坐标云南 剧本杀店老板 2021年4月，我大四，在距离毕业还有两个月的时候，和三个同学一起合伙开了剧本杀店。 开店的初衷很简单，大三开始，我和几个同学迷上了剧本杀，经常在学校附近的店里玩。我们的学校在武汉，那段时间我们能感觉到，武汉的剧本杀市场逐渐火热了起来。我有一位同学家里经商，也很有商业头脑，我们叫她小雨吧，她叫上了自己的室友小雪一起开剧本杀店。 我的加入也有一点莫名其妙。最开始，我只是想找一家剧本杀店兼职，她们听说了，就想和我一起转转。 因为我有电动车，能带着她们去选址、考察，后来，她们在宿舍讨论开店的事情都会叫上我。就这样，我加入了合伙人。 后来，我们的剧本杀店开在了居民楼里，主要面向附近的学生，有8个房间。租金一年8万多，我们直接付了一年的租金。装修上也投入了不少，我们需要根据场景重新装饰，壁纸、桌椅、装饰、人工费，算下来也有2万多。此外就是剧本支出，我们第一次在剧本上的投入就有2万多。 某剧本的人物设定 算下来，初期的投入也有10余万。这笔钱，一开始我们说要一起借、一起还，但是最后是小雪找了一位熟悉的老板去借的。 人力成本呢，除了我们仨，没有一个正式员工。店里20多位DM（Dungeon Master，剧本杀主持人）都是在校学生兼职。 在经营的时候，小雨是我们的总指挥，负责线上客服。我主要负责店里的安排和员工管理。我给DM订了三条铁律：拿到剧本后，需要自己顺一遍流程再带车，不能盲开；不能同时带两个房间的剧本；不能在带车的时候吃饭。 一旦违反铁律，马上开除。员工们都会严格遵守规则。 很多员工来店之前就是我们的朋友，兼职也并不是为了赚钱，纯粹是因为喜欢。DM带一场剧本杀的提成是15%-20%，我们的收费也不贵，一场每人收费只有50元左右。算下来，DM带一场的收入也就几十块。 我们跟员工之间的关系更像是朋友，没有什么阶级的界限，他们有什么事情都可以直接跟我说。 我们没有固定的打卡机制和排期表，基本上是谁有空，谁来店。如果有时来了客人，需要临时叫DM，员工大部分也会响应。 但是，这也导致了一些松散的情况。比如，有的员工会来蹭空调。 武汉的夏天非常热，24小时开空调，电费是一笔非常大的支出。有一个DM就每天早上6点带着他的学习资料来到店里。正常来说，我们是下午两点才开门，上午没有客人。他只是把店当成了自习室。 从管理者角度，我们觉得这样不太好。于是，纠结过后还是发了群公告，告诉大家以后两点之前不准到店。当然，这位DM后来没有上午来过店里了。我也知道员工的心理会不舒服，毕竟以前大家都是朋友，怎么突然就变了呢？ 但是，人一旦想往高处走，你就势必会抛下一些以前你所看重的东西。 玩家在读本 开了第一家店4个月后，我们就有了开新店的想法。因为第一家店赚了很多钱，最火的一个月营业额就有9万。有一天，我经过了大学城附近最火爆的广场，觉得这个地段不错，有很多新的客户群，回去就和她们提了一下，大家一拍即合，也想趁年轻去扩张一下，就马上决定借钱开新店。 但是，在筹划新店的过程中，我们三个也有了一些矛盾。 这个时候，小雨的妈妈介入了进来。 小雨的妈妈在经营理念上和我们有很大的分歧，她总是会用上一代人的思路来干涉我们。 比如，她觉得我们的工作不够健康，每天凌晨睡觉，下午上班，长期下去对身体不好。她还觉得我们不懂管理，所有事情都亲力亲为，不会把任务分配给下面的店长。她甚至会觉得，我们对员工太好了，压不住底下的人。 可是在我们看来，我们虽然是老板，但也没有牛到哪儿去呀？ 毕竟，你的钱也是员工帮你赚的，我们应该平等一点。 还有一个问题，因为我们和员工的关系的确非常好， 他们就把这里当成了自己的家，非常随意。 比如，我们租的是带浴室的民宿，有的DM就直接就来店里洗澡。再比如，我们店也会准备零食，放在厨房，员工和客人一样，都是想吃就吃，想拿就拿，我们把这当成员工福利。 后来，小雨妈妈知道了， 觉得这很没有纪律，是典型的占公司小便宜。 我们也听了她的话，不再让员工来洗澡，零食也放在仓库锁上了，停止开放供应。 这些我们眼中的小事，她妈妈都觉得不行。思想的冲撞越来越多，我感觉我们原本的计划被干涉了。就好像你嫁入了一个人家，婆婆对你指手画脚，你还是没有办法摆脱这个家。 剧本杀道具 最后，在股权划分上也出现了一些不明确的地方。我成了最小的股东，占比10%。一系列事情刺激下，我就直接退出了合伙人，也和她们断了联系，去了别的城市，不再关心店里的情况。 离开武汉后，我在别的城市自己开了一家线下店，是比较自由的状态。平日里也会带“线上剧本”，甚至赚得比自己开店还多。到现在，我也依然不想给别人打工。 上大学的时候，我就坚定了绝对不去办公室上班的想法，不想参与办公室政治。自由平等、以心换心的公司氛围是我最想要的。 20岁怎么“管理”近60岁的前辈？我们会平等地探讨 苏芮 22岁 坐标加州 生物科技公司NovaXS Biotech的创始人兼CEO 2020年末，我开始筹备自己的创业。当时我大二，在加州大学伯克利分校读生物工程专业。 疫情初期，我就观察到，线上医疗的赛道变得很火。 过去，传统的健康行业壁垒非常高，发展缓慢。美国的居民看一次病需要提前一个月去预约医生，等见到医生的时候，病可能都好了。 但因为疫情，很多人不敢冒风险去医院了，居家医疗的需求越来越大，催生了线上医疗赛道的多样化，比如问诊线上化，比如制药与人工智能的结合等等。 这其中，我注意到了药物递送环节的需求。 我的妹妹患有生长荷尔蒙缺失症，也就是俗称的矮小症，所以她从7岁开始就需要每天去医院打针，打了3年，一共3000多针。和妹妹一样，很多慢性病的患者会选择去医院进行注射，耗时耗力，这样的药物递送系统也是非常低效的。疫情后，这更变成了一个足够痛的痛点。 我就想，有没有什么办法能让患者在家里给自己扎针，并且获得和医院一样的治疗效果呢？ 就这样，我发现了无针注射器这一产品，开始了创业。 基于市场的反馈，我开始着手设计第一个产品，并获得了专利。我们的无针注射器让整个药物递送系统的流程标准化、智能化，在注射器前端加上传感器，确保病人在垂直90度且合适的压力下注射。 苏芮在实验室 同时，我开始思考，谁是适合我的合伙人呢？我先找到了发小，他毕业于南加州大学的商学院，在大学期间，他也尝试过创业，帮NBA球星做国内的商业拓展。当时，他刚卖掉了上一个公司，处在空档期。 医疗器械行业对他来说是完全新的领域，但是好在他也创过业，有快速学习能力，也愿意尝试新东西。 于是，我们开始合作，我负责技术，他负责商业拓展。后来，我又找到了朋友作为CTO，他在伯克利学电子机械与工程读博。联系了导师和一些投资人后，我组建起了团队。 刚开始，团队的核心成员只有7个，现在已经拓展到了15个人。 苏芮团队合照 刚开始创业的时候，我的时间几乎是一团乱麻，没有所谓的平衡，总会牺牲掉睡眠和社交的时间，全程专注在事业和学业上。 2021年，团队刚刚建立的时候，我需要一周飞三到五个城市，同时还要兼顾期末考试和论文。 最疯狂的一天，我上午在伯克利上完课，提着行李箱就去机场，下午就到底特律见了一位投资人。深夜的时候，还参加了一个国内创业比赛的演讲。结束以后，我睡了两个小时，凌晨5点钟到达机场，在飞机上开始复习、写论文。下飞机回学校的路上，我还在和另一个CEO打电话。 那段时间，我所有作业都是在飞机上写的，平均每天只睡4、5个小时。最忙的时候一整天都吃不上饭，晚上犯了低血糖就吃一颗糖。 后来有一次，我因为低血糖晕倒了。这件事被父母知道后，他们特别心疼，就和我说，芮芮，你不用这么拼，一定要好好休息。他们可能不太理解，但是，很多年轻人或许会有同感， 我们努力做一些事情，并不只是为了赚钱，更多是希望用自己的能力去影响更多的人。 我是创始人兼CEO，负责对外的商业拓展，和投资人的联系，管理产品部分。同时，所有的部门都向我汇报。团队的年龄其实很“两极分化”，我是团队里最小的人，也是00后。团队里还有一位美国大型连锁医院的总裁，他有30+年的从业经验，现在60多岁投身于大健康产业的创投。 很多人会好奇，一个20岁的创业者怎么“管理”近60岁的前辈呢？其实，我们的工作方式更多是平等地探讨。 在他面前，我不是一个上级领导，也不是一个后辈，年龄和层级都不是问题。我们在公司里也都是相互直呼其名的。 虽然我是CEO，但这也只是一个Title，我在做的事情并没有比团队其他人更高一层，更多是最苦最累的事情，也是一个团队坚强的后盾担当。 在医疗健康这个成长缓慢的行业，年轻的创业者很少，我经常要见的投资人都是头发花白的。 其实我也会感觉到压力。不管是年龄还是性别，我经常会被投资人问到，你没有足够的经验，要如何去领导一个团队？我的回答就是，把真正有经验的人引入我们的团队。 苏芮参加创业峰会 这两年，我也曾经历过管理团队的迷茫。中途有一段时间，我和合伙人在公司发展方向的意见上出现了分歧。这个时候我才意识到，每个成员加入团队的初衷都不一样。我希望能创造价值，合伙人希望通过这次机会来证明自己，也有团队伙伴希望通过这份经历积累产品研发的经验，有些希望可以支持自己及家人的日常开销。 作为管理者，如何让不同出发点的人为同一个大目标努力，是一个非常重要的命题。 我特别喜欢的一个例子就是，如果你去问NASA 一个扫地的工人，你在做什么？他会说我在送人类到宇宙。 我也曾试图和前辈寻求建议。小时候，我会观察长辈们怎么管理员工，我发现，他们有时候是靠吼、靠发脾气，来建立威严，让员工信服。父母有时候也会和我传授管理经验，比如“做不好就骂”。但我发现，他们的经验完全不适用了，年轻人管这种管理方式叫“职场PUA”。 毕竟不同于上一代人，同龄人没那么在意金钱上的东西了，年轻人会寻求实现自我价值，这是一个自我觉醒的时代。 这种情况下，如果我去吼员工，大家早就跑掉了，所以，如果我发现员工有一些问题，会去和他们聊天，问他们：“我能做什么来更好地帮助你完成你的工作呢？”我希望员工能知道，我不是后面拿着小皮鞭催促马车快跑的人，我们是同一条战线共同奋斗的人。 以前，我总觉得什么事情都要亲力亲为，做到最好。 但后来，我也意识到，管理就是通过真诚和激励让每个人把自己的专长发挥出来。 在和年长的成员聊天的时候，他们经常会说， 现在的年轻人真的比我们当时要快很多，可以获得很多资源，也会跳过很多中间的步骤。 同时，我们也会面临非常多不确定。 但是在这个时候，“年轻”也带给了我一些勇气，不要怕失败，要像不倒翁一样。 （文中第二位受访者为化名） 本文来自微信公众号 “后浪研究所”（ID:youth36kr） ，作者：SLOW、嘉婧，36氪经授权发布。 本文由「 后浪研究所 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 采访供图 、 作者拍摄 +1 741 好文章，需要你的鼓励 后浪研究所 新锐作者 730 收 藏 +1 301 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 00后在职场：重定义向上管理，不要惹我生气 近日，00后整顿职场，00后改写职场规则，00后面试时要求老板不可以对我发火……等话题陆续冲上热搜，引发众多网友热议。即将步入社会的00后为何与“前浪们”如此不同？迎接他们的会是现实的“毒打”，还是“职场新气象”？ 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 包容 探索 求真 守正｜2026光幕计划终审阵容与年度面孔公布 一场属于青年创业者的崇礼相聚，即将发生｜甲子光年 不花钱环球旅行？她们免费住进了陌生女孩的家 离开大厂的年轻人，后悔没早点走 日营收1万+，活动座无虚席，揭秘北京“心理咖啡馆”！ 极简过年后，我终于不焦虑了 男频甜宠，走进中华直男的隐秘幻想 4部大片空降春节档，今年稳不稳？ 在泰勒 · 斯威夫特再获格莱美之前，收藏她的吉他 后浪研究所 新锐作者 36氪旗下年轻态公众号——后浪研究所（youth36kr） 发表文章 629 篇 最近内容 这届留学生，用AI看病省出一辆特斯拉 2026-04-13 囤货的快乐，全毁在一台不给力的冰箱上 2026-03-13 选择成为女司机后，她们这样说 2026-03-13 阅读更多内容，狠戳这里 提