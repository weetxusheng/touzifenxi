          content_text: '今天，我们和科技圈的大佬们聊了聊ChatGPT | 数智前瞻-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 今天，我们和科技圈的大佬们聊了聊ChatGPT | 数智前瞻 数字时氪 · 2023年02月09日 10:55 你最近使用ChatGPT了吗？ 数字时氪（digital36kr） 你最近使用ChatGPT了吗？ 文 |数字时氪 封面来源｜IC photo 一款由人工智能实验室OpenAI发布的对话式大型语言模型ChatGPT近来受到火热关注，短短4天时间，其用户量就达到百万级，在2个月内就实现了用户量破亿。这样的火热程度着实让人惊讶。 ChatGPT正促使人们畅想着海量应用场景，引发AI产业变革。目前微软、谷歌等科技巨头纷纷下场，抢先布局AI新赛道。就在本月，微软宣布旗下所有产品将全线整合ChatGPT，而谷歌也正式发布下一代对话AI系统Bard。科技圈即将迎来一系列的重大动作。 在此背景下，我们找到了科技圈的一些朋友，和他们聊了聊备受瞩目的ChatGPT，以及他们对应用前景的看法。 海天瑞声副总经理兼技术负责人 黄宇凯： 在人工智能发展的几十年中，以往大家认为AI是一种效率工具，能够帮助人类提升各方面的生产力，以往AI没有涉及过内容创作领域。但随着DALL·E、Stable Diffusion、以及最近大火的ChatGPT的出现，AI正式进入内容创作领域。 内容创作领域从以往的专业人员生产内容为主的PGC时代，到逐步转变到大众生产内容的UGC时代，带来了很多商业上的突破。现在我们正经历ChatGPT的应用进入商业化落地阶段。 小库科技CEO 何宛余： 从22年末到23年初，ChatGPT以史上最快速度五天便俘获了一百万用户，并在两个月后实现了一亿的活跃度，目前已经火热到了学校必须禁止学生使用ChatGPT来写作业的程度。 小库在11月底至12月初第一时间试用了ChatGPT，并将得到的一些成果在深圳市绿色与智能建造学会的年会上进行了分享。我们针对当时正在参与的智能建造试点城市工作中对“智能建造”的定义进行了测试。无论中英文，ChatGPT都给出了以下具有一定参考价值的多轮对话答案。这样的成果是让人惊艳的，但对于行家而言，这些答案显然是不够的。 图源：小库科技 毋庸置疑，这类大型语言模型的应用场景确实非常广泛，已经非常接近于科幻中的“百事通”（随便问点什么，它都可以给出直接且相对准确的回答，而不再如搜索引擎一般给出成千上万的间接答案线索）。可以想象，这项技术用于众多消费领域是有广阔的前景的。比如撰写一篇广告，一段介绍，一个故事等等。 目前，我们也正在研究如何应用ChatGPT的API来实现建筑领域的垂直应用，特别是基于国内的业务场景。或许某天我们正在看的某个设计说明就来自于它的创作。 源码资本合伙人 黄云刚： ChatGPT在22年11月发布，标志着行业进入大众视野，但现在仍是非常早期的阶段。毋庸置疑的是大家的兴趣都是非常高的，这种兴趣可能来自AIGC是一个潜在的巨大技术变革，有可能有一个非常高的上限，这种变化是十分稀缺的。 从技术的角度，ChatGPT并不是一个明显的技术变化，它背后是2017年就提出的Transformer模型经过了OpenAI几年时间的打磨迭代，逐渐扩大模型规模，到今日进行的一个产品化的产出。AI历史上每次重要的技术面世给大众，都会引起一个巨大的讨论，但大多数时候，讨论过去不久，人们就把那次AI展现出来的能力当成一个AI可以轻易实现的功能。 但ChatGPT仍然可以被我们看成是一个标志性的事件，它代表着新的一波AI技术浪潮的起点，即生成式AI或者叫AIGC的产业化起点。通过ChatGPT的自然传播效应，大家对这件这个行业的认知加深，会明显的带动这个领域投资和参与度上升。进而拉动研发形成一波新的技术浪潮。 可以确定的是，越来越多的行业会在AIGC的赋能下提高效率，更多的垂类工具可能会逐渐出现。大家需要接纳、学习、使用这些工具，跟上时代。也可能大家期待有些更颠覆性的影响，但这个我们还不确定，AIGC可能有颠覆某些行业的潜力，不同领域速度有快有慢。 在infra、模型层上大家关注很多，希望挖掘到最优质的团队做上游的模型。在应用层上，也在积极探索，很多场景上拥有较大可能性，需要更多行业认知和技术的理解来完成PMF。 另外大家对核心技术的理解和重视也在加强，有更多的关于底层技术变化本质的思考。 肆拾玖坊CDO 张鹏： 其实我比较看好AI技术，因为AI技术其实可以改变很多运营方式和交互形态，ChatGPT其实可以改变很多的体验和沟通的形态，在业务上，它不光是一个聊天的机器人，它可以提供类人的客服能力，包括销售咨询能力，因为我们有很多的渠道咨询，其实也在大量的用人工来支撑这一业务。那这一部分其实是可以用ChatGPT来替换人完成对一些常规性问题进行解答。 那另外一点，我们可以通过这种技术改变导购服务体系和培训体系，之前做培训都是用人工来做，无论线上、线下都是人在讲，如果结合这种ChatGPT的AI技术和虚拟现实技术，其实完全可以通过AI在线上完成。这样我们可以更好对培训讲师进行运营和管理，因为对于AI，它的能力是均等的，只要把AI设置好，那无论做多少培训都是一样的。这无形中对整体的运营成本的降低会有很大的帮助。 除此之外，之前我们用RPA做审单，这其实是比较标准化的，但ChatGPT其实做了很多非标准化的动作。它不是公式化的，它可以进行技术学习再去执行。它更智能、更类人。其实我们可以把更多的流程化作业的业务，转由借助ChatGPT的这种技术去做成自动化的形式。这会对协同效能和运营效能带来极大提升，所以这方面其实我们还是蛮看好的。 另外其实还是有很多的利用空间和利用场景的，比如在后端的产线上的质检环节，目前是有部分是借助自动化手段在做，但中途有些地方还是通过人工或半人工来完成，其实也许未来再结台一些ChatGPT的这种非常强大的AI能力，我们也可以进行相应的提升。所以对于供应链优化这方面应该也能够通过这些技术去实现。所以这方面我现在也在研究和学习如何与实际业务进行结合。 综台来看，ChatGPT在用户体验的改善和用户体验模式的颠覆创新等方面，包括渠道运营和管理体系以及终端服务和培训体系的智能化层面，应该都有比较大的应用空间和场景。同时，我们也可以利用这种能力去探索一些对于后端供应链的能力提升，我觉得这种类人的学习能力和知识图谱的学习能力，其实是有很大应用空间的。 一流科技CEO 袁进辉： 技术发展在绝大部分时间都是渐进式的，而阶跃式发展非常稀缺，偶尔出现（如AlphaGo，AlphaFold等）。即便算上深度学习近些年发生的所有其它阶跃时刻，ChatGPT也可以说是最重大者。ChatGPT的突破不仅仅停留在学术意义，而且短短两个月时间发展到1亿用户，成为世界上增长最快的产品，展现了这项技术足够成熟已经可以产品化了。即使未来仍有改进空间，ChatGPT的突破第一次让让世人知道计算机理解和生成语言这一目标是可达的，而且给出一条路径。 其意义可类比数学家张益唐在孪生素数猜想上的研究突破，张益唐找到了距离不超过7000万的素数，和孪生素数要求的距离为2相距甚远，但这不重要，一位美国数学家评论说，从7000万到2的距离，相比于从无穷到7000万的距离来说是微不足道的。 事实上，张益唐论文发表后不久，那个距离就被改进到几百了，和2非常接近了。总之，计算机的语言智能不再仅仅是一个学术研究问题，已经可以成为未来的基础设施。 产业界应该已经意识到ChatGPT是所谓的 Game Changer，中期可导致相关产业重新洗牌，重塑产业格局 （微软和谷歌等相关投入）。 比尔盖茨认为：“这种人工智能技术的诞生有着重大历史意义、不亚于互联网或个人电脑的诞生，在2023年，人工智能将成为最受人们关注的热点板块，人工智能技术在未来，对社会的影响将不亚于个人电脑等技术。”。 ChatGPT代表了通用人工智能（AGI）的重大突破，很快将要发生的是，许多种类的工作效率得到极大提升，甚至会有相当多种类的工作岗位会被机器取代。 对于个体来说，能得到ChatGPT的助力和不能使用ChatGPT 将对个体发展潜力产生决定性影响（最开始人之间是体力的比较，再后来是对工具使用能力高下的竞争，直至今天是否能使用ChatGPT将在智力上产生差别）。 同样的，有ChatGPT能力的企业和国家相对于没有相似能力的企业和国家也必然在竞争中获得不对称优势。 newsletter 叭叭呜 于欣烈： ChatGPT 如此火爆的一个原因，是普通人能随便上手的交互界面，还能给出让人眼前一亮的高质量结果。那一下的感觉，很像以前我们第一次用上某些智能产品，哇的那一下。比如，我第一次点下手机，身前那辆自行车的锁就啪一声打开了。 「Chat」只是一种交互界面，ChatGPT 技术所提供服务的本质，是高效处理大量文本信息。通过海量的文本训练，它能飞快地归纳、总结、调整结构、引用历史故事、列举真实事例。 为什么很适合和搜索引擎结合？搜索引擎过去只是列出一堆内容链接。用户需要一个页面一个页面去打开、浏览。ChatGPT 技术的优势就是信息搜集、整合、总结输出的能力。它帮你把搜索过程中的脏活累活给干了，直接给你可以指导下一步行动的内容。（技术越成熟体验越好） 2008年时，谷歌一位高级副总裁给 Larry Page 展示 Gmail 一些新功能，他反问说，Gmail 为什么不能自动给我写邮件？今天 ChatGPT 这样的技术做到了。 今天早上，集成 ChatGPT 技术的 Bing 发布会上，微软展示了一个很有意思的应用场景：用 Edge 浏览器上打开 Gap 公司15页的财报 PDF，给 AI 助手发一句「提炼要点」，不到10秒就能得到一份 bullet point 总结。更厉害的是，再敲一句「列个表和 lululemon 对比下」，AI 助手还能给你做个财报要点对比表格。 所以 ChatGPT 技术擅长的就是文本信息处理，帮你汇总、整合信息，帮你写小作文。但要小心的是，目前这类技术的错误率不低，不要盲目相信它提供的事实内容。 ChatGPT 这类技术，会成为一种类似云计算的基础技术服务，越来越多的公司会把它嵌入到不同的应用场景中去，可以提升效率、提高用户体验。 在日常办公/内容创作领域，ChatGPT 这类技术将会对文本创作提供一些帮助，提高内容创作效率，降低常规内容的创作成本。现在已经有有些小公司、小团队在使用 ChatGPT 自动生成、对质量要求不高的内容。 ChatGPT 这类技术将会作为一种基础服务，嵌入到很多领域，比如搜索、办公软件。看好它的商业化前景，但局限性也很明显。 AI科普作者 虞喵喵： ChatGPT 是一个超大型语言生成模型，可以简单理解为它蕴含人类的语言和语言的内部逻辑。因此 ChatGPT 能很好地针对语言进行预测，给它一个词，它能预测下一个词是什么，通过预测下一个词是什么，再预测下下个词是什么，这是 ChatGPT 的基本原理。 但是现在普遍流行的说法是 ChatGPT 有创造能力，我认为这个是有很大争议。 ChatGPT 很像一个搜索引擎，里面包含了太多人类已有的语料。提出问题后，它就像搜索引擎一样寻找信息，不同的是它会对信息进行整合，以人类的进行输出。它更像一个生成器，很难称之为创造力。 如果说 ChatGPT 特别惊艳的地方，那就是优秀的自然语言处理能力：它能生成一段看上去很真实、很像人类写出的语言，足以以假乱真。但问题是它缺乏常识，生成的内容常常存在错误。也就是说它看上去好像很「对」，但其实是模仿了「对」的语气，内容上存在很多错误。特别是一些科学上的问题，如果人类没有在网络上写过这个问题的正确答案，它就没有办法给出正确答案，或者，它还会为了给出答案把不同的问题混淆。此前做过的测试显示，ChatGPT 给出的答案正确性存疑很难取信。 ChatGPT 是语言模型，由于训练数据中包含有图像、代码等内容，使得它不仅能根据问题和要求生成文章，它还能根据要求生成图片、网页、代码，这些都是它的应用。 如果用指的是商业应用，其实有点无解。目前它只能作为 ChatBot 或者生成器存在，它可以为研究工作收集信息提供帮助。它可以像 Grammaly 一样作为工具对用户进行收费，目前 ChatGPT 也确实是这样做的。但其他的商业应用形式可能比较难，这也是 AI 技术共同需要解决的问题：寻找商业场景。 互动话题 你怎么看待ChatGPT以及它的应用前景？欢迎留言与我们交流 数智前瞻-ChatGPT系列内容（在 数字时氪公众号（ID：digital36kr） 即可查看）： 《ChatGPT走红背后：苦熬五年，三次AI路线迭代｜行业观察》 《ChatGPT背后：一个天才、百亿融资和1亿月活 | 数智前瞻》 《最快月活过亿，但ChatGPT或终将被开源打败 | 数智前瞻》 THE END 我们正在建设 「TOB领域」主题交流社群 ，欢迎 扫码添加数字时氪小助手 ，并发送名片或者个人介绍，我们将为您持续推荐相关产业信息和活动。 更多活动信息及行业详情，请关注微信公众号“数字时氪”（微信 ID ：digital36kr），期待您的到来。 扫码入群 数字时氪（digital36kr） 本文来自微信公众号 “数字时氪”（ID:digital36kr） ，作者：数字时氪，36氪经授权发布。 本文由「 数字时氪 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： IC photo +1 9 好文章，需要