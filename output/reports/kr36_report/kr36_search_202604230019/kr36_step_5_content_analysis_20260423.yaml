          text: '野人先生崔渐为：“网红”标签对我们不公平丨厚雪专访-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 野人先生崔渐为：“网红”标签对我们不公平丨厚雪专访 钟艺璇 · 2026年04月13日 17:58 押中Gelato连锁化背后，一家创业公司的15年。 作者 | 钟艺璇 编辑 | 乔芊 如果你在一个意大利人面前，把Gelato等同于ice cream，他一定会难过。 16世纪，Gelato诞生于文艺复兴时期的佛罗伦萨，传说中一名炼金术师创造了它。在意大利语中，Gelato本就译为冰淇淋。但它和美式冰淇淋ice cream口感大有不同，Gelato使用口感更密实，也更新鲜、低脂和健康。 目前中国冰淇淋市场中，夫妻老婆店冷柜里卖的预制冰淇淋占据75%以上的市场份额，这个品类中的高端玩家是哈根达斯。现制冰淇淋只占约25%，以DQ、波比冰淇淋（原波比艾斯）乃至蜜雪冰城为代表的软冰（Soft Serve）以规模化优势，又占其半壁江山，Gelato由于手工现制、定位高端以及门店成本高，市场份额只有6%左右。 在欧洲，数百年来，Gelato都以家族传承、百年老店的形式分散存在——意大利4万家Gelato几乎都是小店，甚至只要10家连锁以上，就能称作大品牌。 但在中国，有一家公司却想把堪称“小众”的Gelato连锁化，它就是野人先生。 2025年，野人先生突然涌现在大众面前，从300多家到突破千店，这也是它爆发式增长的一年。但创始人崔渐为却说，自己创立野人先生已经15年，只是近期才被大众所看见。 15年千店的速度并不快，因为中国消费者对Gelato太陌生。“冰淇淋这个品类似乎20年来没有变化，20年前的哈根达斯、20年前的DQ，和今天都一模一样。每一个行业都在加速迭代，冰淇淋行业没理由停滞不前。”崔渐为说，是野人先生在国内开创了 Gelato 这个赛道。 上个时代，哈根达斯是工业化背景下，冰淇淋极度标准化的产物。要做品类升级，和对手拉开差距，野人先生一直在放大自己的现制属性——做试吃，让人们知道现制Gelato究竟是什么；拉丝带尖（员工在冰淇淋出品的最后一刻，拉出个性化的弧度），让人们对现制更感同身受；过去冰淇淋用玻璃柜展示，野人就用独立密封桶，解决串味和温度波动，让冰淇淋更新鲜；冰淇淋易化，顾客的手也容易被沾湿，就用玉米杯代替塑料杯，厚壁的杯具能保留风味。 这一切的目标都是让Gelato产品更标准，以放大连锁化的可能性。 这个可能性究竟是多大？崔渐为以茶饮行业类比，10年前瓶装饮料市场规模3千亿，现制茶饮只有200亿，10年后，现制茶饮也做到了3000亿。 “我觉得现制冰淇淋能做到跟预制冰淇淋平分秋色，达到2000亿规模。”崔渐为说。 截至目前，DQ在华门店总数超过1800家，是中国最大的现制冰淇淋连锁品牌，波比冰淇淋门店总数超过1200家，野人先生主打Gelato品类，门店规模超过1300家，在全球Gelato连锁领域规模第一。 15年过去，2026年春天之始，野人先生在上海开了一家全球旗舰店，这也是全球最大的Gelato旗舰店。崔渐为告诉36氪，过去野人先生只埋头做产品，品牌端几乎没有系统表达，“全球旗舰店是野人先生15年的里程碑，我们想把‘野自天然’的内核完整呈现出来”。 近期，36氪和崔渐为有一次对话，他向我们讲述了在连锁化前野人先生15年漫长的准备，自己又是如何抓住现制冰淇淋品类升级的机会，以及可替代选择那么多，中国人又何以需要一支好的Gelato。 以下是对话，经36氪编辑： 野人先生全球旗舰店，位于上海徐汇区东湖路 冰淇淋有清晰的好坏标准 36氪：这一年来野人受到很多媒体关注和报道，你心态上有变化吗？ 崔渐为： 变化谈不上，多了一些苦恼，也见到社会险恶（笑）。 我们是个理工男团队，连市场部都没有，产品和品牌都由我负责。这两个板块都是创造型的工作，我的灵感更多来自于向内求，去探店、去乡下找食材和农民聊天，或者和行业专业人士交流。15年都是这样。 野人火了以后，外界很多声音偏离了本质，“网红”、“割韭菜”、“第二个钟薛高”，这些标签被加注在野人身上，其实对我们不公平。可以说，野人对于冰淇淋行业的思考、理解和探索，在全世界都是领先的。 36氪：你最初怎么接触到冰淇淋行业？ 崔渐为： 大学毕业后，我去了一家意大利主权基金工作，当时我们投了一家85年历史的冰淇淋家族企业，在这个过程中，我深度参与也开始喜欢上冰淇淋行业。 几百年来，Gelato一直被公认为是最好吃的冰淇淋，无论是生产方式、原料、设备还是工艺，它都比工业化生产的ice cream更有优势。但意大利有四万家Gelato店，连锁化率却很低。当地很多店都是家族经营，还有不少百年老店，一家Gelato品牌能开10家左右门店，就已经算多了。 所以当时我们认为Gelato的全球化一定存在机会，就像曾经的星巴克把意大利咖啡带到全球一样。 36氪：在野人先生之前，没人尝试过中国的Gelato连锁化吗？ 崔渐为： 其实相反，中国最早做加盟的品类就是冰淇淋品牌，甚至比茶饮还早。冰淇淋本身太适合做加盟了，它标准化程度高，从美国的4大冰品品牌能看出来，它们在历史上都取得了很好的成就。 大概在世纪初，有一批中国加盟商盯上了冰淇淋品类，他们当然知道Gelato最好，也去意大利找了品牌谈战略合作。但他们做的事却和Gelato无关，只是拿上创始人的授权照片，贴在墙上背书，也不用人家的原料，就卖5块钱3个球的冰淇淋。 很快，整个行业对中国加盟商都建立了防火墙，意大利人听到是中国人，就不聊了。甚至有中国人再去意大利学习冰淇淋技术，对方都很排斥。 这也是为什么今天中国懂Gelato的人太少，因为关于Gelato底层的知识、技术传播都做得不好。我个人是因为刚好在意大利冰淇淋企业工作，才有机会深入内部，接触到更专业的原料、技术、设备原理等关键环节。 36氪：欧洲 Gelato 的连锁化率很低，为什么在中国会有这个机会？ 崔渐为： 欧洲不只是 Gelato 没连锁，很多品类都没有连锁，真正的连锁模式从美国开始。美国人更追求利益最大化，想把生意做到最大。 我们扫描行业时发现有几个长期确定的趋势——第一，有人的地方就有冰淇淋需求，这个品类不可能消亡；第二，冰淇淋消费和人均GDP正相关，经济越发达，人们吃的冰淇淋越多、品质要求越高。 再反观中国，单看DQ的规模就知道，DQ全球营业额超300亿，中国市场大概 30 多亿，只占 1/10，它最大的市场在美国，贡献200多亿营业额。这说明 DQ 在美国是很日常、很普遍的消费，而中国的市场空间还很大。 大家购物、逛街和闲聊的时候，总想喝点什么，那为什么不能是冰淇淋呢？如果野人不把一个更好的现制冰淇淋放在消费者面前，大家永远不知道自己有这个需求。 36氪：这个需求一定是30元的Gelato吗？ 崔渐为： 好产品需要消费者多体验，才能慢慢建立起标准。就像喝咖啡，只要喝的频次足够多，就能尝出花香、果香这些风味，形成自己的评判标准。 从专业角度说，冰淇淋的好坏非常清晰，有色香味、养料、温度等十大标准。只是这些东西对消费者来说，太专业。但消费者是最聪明的人群，没人能骗得过消费者的嘴巴。 36氪：需求只是开始，决定中国Gelato得以连锁化的客观条件是什么？ 崔渐为： 设备国产化是Gelato能在中国连锁化的大前提。意大利进口设备价格在60万，但国产只要6万。除了野人，过去中国没有这个市场，所以我们目前的两个供应商，都是陪伴野人成长起来的，野人是绝对的需求方，也只有我们这些使用者，才懂设备的细节和痛点，帮助上游实现研发迭代。 这也是为什么野人13年都不加盟的原因，如果机器还有bug，不够丝滑稳定，我怎么敢放加盟？ 36氪：为什么叫“野人”这个名字？ 崔渐为： “野”是不被世俗规则磨掉的初心。我们想呵护这种 “野”，因为它是野人品牌的核心。 从业务层面说，我们先养牛、再开店，自己建了牧场，坚持手工制作，这和天然、自由的感觉很契合；从精神层面说，去年我们和张伟丽联名，叫 “野力全开，为热爱而战”，张伟丽在 UFC凭一己之力拿了 6 条金腰带，过去没有亚洲人能做到，我们也想在西方强势的冰淇淋领域做出中国品牌。 36氪：你性格“野”吗？ 崔渐为： 性格里最大的“野”，是创业第一天就决定要把Gelato 做到极致，并且一辈子做这件事。 野人先生产品图 没有招商部，全靠口碑推荐 36氪：为什么决定在2024年放加盟？ 崔渐为： 放加盟不是选择，而是必然。 全球成熟的餐饮品牌，麦肯是加盟，DQ也是加盟。我们为什么要拒绝加盟？本质上，冰淇淋就是高度标准化的品类，而且是小店，非常适合加盟；对比海底捞这种大店、复杂中餐，就不太适合加盟。 36氪：野人的加盟商画像是什么样的？ 崔渐为： 我们选的是超级加盟商，都是职业选手。 36氪：为什么不是小的？ 崔渐为： 超级加盟商的优势在于，他们在食安、服务和门店一线操作上已经建立了很好的职业素养。让这样的人开店，一定能做好，小白就算再聪明，也得走很多弯路。今天野人选择加盟商时，我们首先会关注他是不是一个专业的门店运营者。 36氪：这些超级加盟商，开店规模一般在多少？ 崔渐为： 主流在5-10家，最多有50家的。我们毕竟开放加盟时间短，很少有加盟商是只开单一家的。 36氪：听说野人没有招商部，你会直接面试加盟商，他们和你表达最多的顾虑是什么？ 崔渐为： 顾虑太多了，核心还是对冰淇淋品类的质疑，冰淇淋能做长久吗？能不能像茶饮一样规模化开店？有季节限制怎么办？消费习惯还没养成，能做起来吗？ 我们也很直接，摊开来讲我们的创业历史，带他们去看野人8 年、10 年的老店，让他们感受老店的运营状态和产品，也会把我们对行业的思考、消费习惯培养的过程和他们沟通。 其实这些超级加盟商能力很强，行业也很透明，我们每家店的销售数据，他们自己就能拿到，甚至比我还熟。他们天天混在行业里，选址、运营的门道都懂。当他们来找我们的时候，已经经过反复对比和考察了，只是需要我们解答最后一些疑问，确认自己的判断。 野人之所以没招商部还能开这么快，全靠口碑和推荐。我们从来没做过加盟宣传，连加盟电话都很难找到，我们希望和专业、懂行的人合作——大家匹配度高，反而省了很多事。 36氪：不担心超级加盟商话语权太强、不好管理吗？ 崔渐为： 你有价值，他就追随你；你没价值，他自然会离开，不需要刻意管理。 36氪：能否讲述一下野人的选址逻辑？ 崔渐为： 选址是野人十几年踩坑最多的地方，一旦选错，就是血亏。有很多选址，看起来不错，比如商场负一楼、地铁口，这些地方人流多，但开店一定差。因为大家都在匆忙赶路，只会买奶茶、面包这种刚需快消品，买了就能带走；而Gelato需要坐下来慢慢吃。 这种选址哪怕我们一再强调不能开，还是有加盟商执意要开。人的惯性认知太难扭转了，但这就是我们要守的底线。我们踩过的坑，不能让加盟商再踩。 36氪：有没有看起来不行，实际却很好的选址？ 崔渐为： 比如商场二楼、三楼，很多人觉得楼层高、人流少，但实际转化率很高。尤其是女装层——大家是无目的闲逛，逛累了就想歇一歇，和闺蜜聊聊天，这时再看到Gelato，转化率极高。而且二楼租金还比一楼、负一楼便宜很多。 反倒商场五楼，看着人多，但大家去五楼是有明确需求的——约了人、或者想吃火锅或炒菜，很少会选择中途吃一支冰淇淋。而且现在人怕胖，吃饭前不会额外吃甜的，我们只能捡漏。 如果不是试吃，野人先生已经死掉了 36氪：从现制冰淇淋品类来看，DQ的规模最大，野人相对于他们做了哪些升级？ 崔渐为： 虽然都属于现制冰淇淋，但DQ是软冰（soft serve），和Gelato完全是两个门类。 软冰的优势是随手可得，只要装一台软冰机，把浆料倒进去，接出来就能卖。今天你看到的麦当劳、肯德基以及蜜雪冰城，他们的冰淇淋都属于软冰，简易化和低成本决定了软冰能成为万店的品类。软冰膨化率通常在100%以上，一半以上都是空气，牛奶本身的香味比较寡淡，所以需要添加香精色素。 并不是说软冰不好，产品定位和分类不同而已。只是Gelato走的是另一个极端。真材实料，追求低的膨化率，一切味道都来自于食材本身。 36氪：Gelato 的膨化率大概是多少？ 崔渐为： 大概在20%。对比软冰100%膨化率，Gelato只有1/5，这也意味成本有5倍的差距。 36氪：野人的单杯为什么定在130g？比对手要少。 崔渐为： 这是反复调研后的结果，我们发现，消费者需要“吃得舒服满足，又不过量”，测试后发现130g最合适。 36氪：野人的试吃很有名，时候开始的？ 崔渐为： 2015年，我们开第一家门店时，就有试吃了。只是早期比较简单，客人到柜台前，我们最多会问一句“要不要尝一尝”“先尝再买”。 后来店员主动走出去打招呼，成功率很低，还很尴尬。现在我们就设计了专门的试吃小冰箱，放在门店过道最显眼的位置，上面贴“免费试吃”的标识。客人知道这是专门让人试吃的，会大大方方地尝。 这对野人先生来说，是一个关键的转折。餐饮行业没有那么多石破天惊的创新，它是一种每天的精进，在于你能不能把一件繁琐枯燥的事坚持下去。 36氪：试吃也需要迭代。 崔渐为： 试吃从早期1.0，已经迭代到5.0了。野人的试吃，可能是整个冰品行业做得最彻底、花钱最多的那一个。 我的想法很简单，想让客人尝到我们的产品，根本不在乎他买不买。如果不是这种非常积极的试吃，我想野人先生已经死掉了。 开心果是转折点 36氪：很早就有投资人找你们，为什么一直没拿融资？ 崔渐为： 疫情前就不断有投资人找来，我们做到 50 家店时已经是国内第一，100 家时已是全球第一，资本很容易看到我们。但是拿了钱，前提是让钱真正发挥作用。如果不知道怎么花，或者花了也没有好结果，那反而会是一种灾难。 36氪：当时大家都在拿钱，估值被炒得很高，这种氛围里，你怎么保持理性？ 崔渐为： 和我之前做过投资有一点关系。但这不是主要原因，更核心的是做决策时更看重行业本质和规律，而不是跟风。说白了，当时我很清楚，拿了钱对我们来说是负担，发挥不了太多作用。 36氪：接下来有融资计划吗？ 崔渐为： 我们并不排斥资本，但前提是彼此契合。过去一些不好的惯例，很多投资人要求对赌、要求上市时间，有这些条款我们就不聊。现在投资人更理性，愿意尊重企业发展规律。 36氪：现在野人已经超过1300家，未来的扩张节奏上，有什么计划？ 崔渐为： 我们对规模没有很大的欲望。 36氪：为什么？ 崔渐为： 我当然希望品牌有更大影响力，只是它的排位靠后。假如我今天说要开多少店，各个部门一拆解，大家都会为数字努力，动作就很容易变形。野人的思路是，先把一个区域加密，做好口碑，再慢慢拓展。 36氪：但事实是2025年野人门店高速增长，这不是目标带来的结果吗？ 崔渐为： 完全是自然增长，因为门店生意确实变好了。直到今天，我们都在踩刹车开店。比如找上门的加盟商有一千个，我们会筛掉几百个，门槛很高。 36氪：生意变好的转折点是什么？ 崔渐为： 2023年下半年，开心果口味爆了，它让野人的同店业绩增长30%左右。之前野人许多的门店都在盈亏平衡上。 野人先生产品图 36氪：开心果口味是野人先生的里程碑？ 崔渐为： 一个餐饮品牌火与不火，很大程度上取决于有没有爆款大单品，比如霸王茶姬的伯牙绝弦，喜茶的多肉葡萄。大单品让品牌被记住。 对于野人来说，这个大单品就是开心果。现在野人所有的产品都是28元，只有38元的定价为开心果而生，因为原材料实在太贵。 当时我们在选择开心果原料的时候也纠结过，到底是选择意大利进口，还是日本（正荣）的原料，前者价格是后者的五倍。今天几乎所有烘焙品牌用的都是正荣开心果，但烘焙有面粉有糖，冰淇淋入口即化，对风味要求高。野人要追求品质，就要坚定选择意大利开心果。 其实开心果刚推出前两三年，市场表现并不好，直到2023年下半年，突然有很多人来店里点名要购买，各大平台上也开始有用户自发分享，到 2024 年就更火了，从野人扩散到整个冰淇淋行业，再到烘焙、茶饮行业，开心果口味成了全行业都在推的热门口味。 36氪：最早的灵感来自于？ 崔渐为： 没有特别的灵感，更多是一种预判。做研发时，通过判断它的浓郁度、香味和口感，我们就能感知到这款产品的潜力。 我们特别为开心果冰淇淋设计了很多出品仪式感，只有它会撒开心果碎，也只有它拥有独特的小翅膀托盒，如你所见，我们一直在海报上重点突出它，员工推荐时，也永远优先开心果口味。就这么坚持了将近5年，才突然爆发。 36氪：如果茶饮品牌都反过来做冰淇淋，你会担心吗？ 崔渐为： 挺好的，大家一起做。现在冰淇淋行业的上限还不太高，我们也不在乎它的上限在哪里，上限是自己做出来的。 36氪：不会是你们的对手？ 崔渐为： Gelato的整套系统很复杂，不是在门店加一台机器就能解决的，不仅投入大，对门店的水电条件要求也很高。 36氪：野人出品时的“拉丝带尖”很有意思，为什么会有这个设计？ 崔渐为： 拉丝带尖的壁垒不是技术，是创作感。我们不把打冰淇淋当成重复劳动，而是手艺活——往左歪一点像山，往右歪一点像树，每个冰淇淋都不一样。 我早期在门店的时候，就讨厌无趣的工作，所以想让打冰淇淋变得有意思，而不是用挖球器做规整的球。 本文由「 钟艺璇 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 企业授权 +1 167 好文章，需要你的鼓励 钟艺璇 新锐作者 56 收 藏 +1 2 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.279 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 告别增长空谈，营销幕后的落地推手 好商品时代：品质为王，文字游戏退潮 你用的避孕套，要变贵了 蜜雪冰城卖散酒，古井贡酒开小铺，打酒这门老生意，突然翻红了？ 海底捞为啥总在挨骂？ 论斤卖的蓝莓，猪都快吃腻了 年销10亿的“中产柚汁”，把中产给耍了 星巴克卖身5个月，全面看齐瑞幸？ 文案翻车，曾经爆火的内衣品牌，怎么不懂女性了？ 钟艺璇 新锐作者 关注消费品牌，也关注小红书公司 zzyyxxhhh 欢迎来聊 发表文章 84 篇 最近内容 野人先生崔渐为：“网红”标签对我们不公平丨厚雪专访 2026-04-13 元气森林2044创造营背后：创新要年轻，研发要更重 | 最前线 2026-04-03 大钲资本