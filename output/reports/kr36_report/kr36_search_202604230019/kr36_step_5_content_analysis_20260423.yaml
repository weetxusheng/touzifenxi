          text: '《明末》团队解散背后，国产单机究竟还缺什么？-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 《明末》团队解散背后，国产单机究竟还缺什么？ 果脯1166 · 2026年04月15日 08:00 胜败乃兵家常事，大侠还请重新来过。 文丨果脯 编辑丨刘士武 过去几天里，《明末：渊虚之羽》（后称：明末）制作组解散、制作人夏思源离职创业的消息，让不少人感到唏嘘。 这款由灵泽科技开发的国产类魂动作游戏，曾被寄予厚望，后续也取得了不错的成绩。 据统计，2025年上线后，游戏在Steam预估销量约120万套，主机平台PS5约30至40万套，加上其他渠道总计约200万套，销售额超过5亿元。这样的成绩，放在国内单机史上，已与《戴森球计划》《鬼谷八荒》等大火产品同处一个量级。 更重要的是，它把国产单机游戏的单价继续推到了3A级价位——Steam国区248元，海外49.99美元，又一次证明了国产单机也能站稳3A赛道。 《明末：渊虚之羽》的Steam界面 灵泽的故事也确实励志。这家从VR游戏起家、曾靠外包维持运转的团队，凭一腔热血熬出了《明末》，一度穷到只剩理想支撑。 然而热闹背后藏着尴尬。上线后的舆论风波、优化问题、定价策略失误，以及最致命的剧情方向与主流玩家预期的严重偏差，让这款产品 从“村里第二个大学生”一夜变成了“村里的第一个大学退学生”。 发行商505 Games虽仍以“Strong”形容游戏表现，但多方分账之后，项目首年仅能勉强打平研发成本，无法形成持续的利润闭环。 夏思源讲解《明末》关卡设计（36氪拍摄于2025年7月的灵泽科技） 去年游戏上线前，36氪游戏曾与灵泽科技几位核心创始成员进行过深入交流，彼时我们能感受到这个团队对于《明末》的信心与期待。 毕竟，这家成立于2016年的公司，初期大部分营收来源于外包——2021年正式上市的VR游戏《A.D.2047》并不足以证明灵泽制作大型游戏甚至3A级单机的能力。但对于几位创始成员来说，3A国单是梦想，也是《明末》能够坚持至今取得亮眼销量成绩的原因。 《明末：渊虚之羽》 然而，一系列的事件后，《明末》最终还是迎来了这样一个Bad Eding—— 灵泽股方要求团队全部转外包，团队拒绝，团队直接被解散，制作人夏思源带着不足5万元注册资本的工作室从零开始。前几天我们与夏思源简单沟通得知，他已经在专注于新的工作。 或许过去的就让它过去吧。 但唏嘘背后，一款销量约200万套、过了“成本关”的游戏，一棋下错，满盘皆输，最终落得物是人非的境地。这究竟是为什么？或者说，国产单机走到今天，我们究竟还缺什么？ 要回答这个问题，有必要先正视一个事实： 时至今日，国产游戏或许早已不需要向世界证明什么。 “人越炫耀什么，就越缺什么”这句俗语，大多数人都听过。它可能不完全对，但多少有几分道理。很长一段时间，当我们反复强调“中国游戏”如何如何，可能都依旧下意识把自己放在低位，试图向世界证明什么。但现在，这个命题或许已经悄然翻转。 论产品能力与文化传播力，国内诸多二次元游戏哪怕在二次元文化的发源地日本，都已建立起无可比拟的统治力。从《原神》开启的“文化输出”讨论，到《鸣潮》在海外掀起的热潮，再到《恋与深空》拿下TGA、App Store、Google Play等多个维度的奖项，中国游戏产品早已站上全球头部赛道。 《恋与深空》在东京电玩展 腾讯的《三角洲行动》则是在欧美最擅长的射击赛道，进一步拉高了此类产品的天花板。比起过去一味的模仿、追赶，这款产品基本是从"搜打撤"的玩法循环中，真真正正摸索出了一个属于自己的解法。 有部分人质疑它的优秀成绩仅限于国内，但不可否认，它比《逃离塔科夫》或《ARC Raider》都更先找到了理想化的商业化与玩法平衡的解法，甚至在这条路上走得更远。 而聚焦到更具体的产品，《黑神话：悟空》不论是技术力还是项目管理水平，基本得以比肩世界第一梯队的团队。2024年正式发售后，首月销量破2000万份，全球媒体评分均在90分以上，TGA年度游戏提名。2000万份的销量证明了"中国人也有做好3A"的能力。 它不仅是一款成功的游戏，更是一个文化符号——它告诉世界： 中国人，也能做出世界顶级的单机大作。 《很神话：悟空》 此外，国内游戏市场每年依旧会爆出一些足够惊艳的小产品。像去年上线的《苏丹的游戏》《逃离鸭科夫》《明末：渊虚之羽》，以及即将推出的《影之刃零》等等，都在不同路线上推动着国产单机的前行。基于这份成绩，国外甚至已经出现了有关"中国游戏"的专属词条。在Reddit上，r/ChineseGames小组的成员已经超过10万，他们讨论的不再只是"made in China"，而是那些真正由中国团队主导、有中国味儿的原创作品。 《影之刃零》 说白了，时至今日我们或许已经不用再向世界去证明什么。所谓"想要国产游戏崛起"的期望，更多是中国游戏人基于热爱、经历和遗憾，而对当下与未来生出的一股子心气。 那么，这股心气为什么最终又会聚焦于"国产单机"这一标签？ 明显能看到，即使在长线运营的多端互通产品上已成绩斐然，行业与玩家最寄望的，依然是更多的《黑神话：悟空》。玩家的这份希冀，甚至比下一个《王者荣耀》或《原神》来得更猛烈。 究其原因，一方面，单机游戏的商品属性更弱，内容属性更强。与粗暴的DAU、留存等数据化指标相比，这类产品具有更加强烈的设计导向和内容驱动。并且在这个一切都变成"长线服务"的时代，单机游戏难得保留着一股子完整性。它要求你坐下来，投入几十小时，与角色建立情感连接，最终在通关的那一刻，获得一种算法永远无法给予的"完成感"。 另一方面，时至今日，玩家都需要足够多的高质量产品去证明：比起纯粹的娱乐性，电子游戏作为走在科技前沿的产物，实际还能承载住更多意义与价值。并且如果游戏还需要被“正名”，国产单机游戏也是最有力的武器。 《古剑奇谭3》 只是，回看这批国产游戏开发者的成长路径，会有一个更深的体感：他们大多从小玩着千禧年前后的优秀国产作品长大，经历过国产游戏的辉煌，也见识了它的衰落，更经历过在不同公司打工赚钱的日子。游戏科学为了做出"黑神话"，必须先造出"斗战神"；灵游坊想要养家糊口，也得先放下"雨血"先做"影之刃"。一如冯骥所说："我们想做自己的游戏，想了很多年。" 于他们而言，做一款属于自己的单机游戏，无异于机车迷找到了哈雷。这不是高低之分，只是前两者中，很多人可能只是飞机上的一颗螺丝钉，受各类数据牵制，并不符合他们这代人最初对游戏的印象。 而从市场层面看，根据《2025年中国游戏产业报告》显示，包含了单机与网游的“客户端游戏”，其营收占比行业全年总营收的22.26%；而主机游戏则仅占比2.38%。当然，无论是客户端还是主机游戏，整体增长仍然强劲，从侧面证明了国单的崛起和玩家的期待。 《2025年中国游戏产业报告》 除了市场规模的增长以外，钱也是重要推手。 过去几年，随着游戏市场逐渐成熟，手游借助工业化模式已经变得相对稳定，越来越多的资本积累开始流向可能性更多的单机领域。腾讯投资了游戏科学、灵游坊等一大批单机团队；网易已着手开发《归唐》；米哈游的品质已逐步开始向单机的设计质感靠拢；鹰角也在逐步尝试各类不同方向的单机产品。 与其说是资本不再现实了，不如说是单机游戏的回报率让他们足以愿意为此投入。 同时，基于多年积累，中国玩家数量显著增多。2015年，Steam的中国用户数还只有几百万，而现在一度超过5000万，占了软件整体用户数量的半壁江山。中国已经有了一个巨大且愿意为正版付费的玩家群体。 而最后不可忽视的，还有国家政策各个维度的支持。从前几年版号回暖开始，国家层面对游戏行业的关注度明显在持续上升。2023年，中国音像与数字出版协会联合央视推出纪录片《中国游戏纪事》；2025年，教育部通过游戏艺术设计专业，将游戏学科正式纳入国家高等教育体系；国务院新闻办公室举办发布会，提及要发展游戏出海业务，布局从IP打造到游戏制作、发行、海外运营的整个产业链——这是国务院第一次在发布会上提及游戏。针对游戏开发者，北京、上海、深圳、广州各地也已开启了相应的政府扶持政策。 但《黑神话：悟空》的出现，会不会只是昙花一现？ 显然不是。但大家想要的，确实不只是一两款偶然成功的产品，而是一个"国产单机"不再需要被特意强调的时代。 去年11月，知乎上曾冒出个提问："2026年会是国产单机游戏更加百花齐放的一年吗？"问题并不具体，整体数据寥寥，没什么人关注。底下的回答只有一条，来自《太吾绘卷》制作人茄子： "这是必然的，大势所趋。" 茄子的知乎回答 这句话，或许是对未来几年国产单机游戏市场最好的预测与总结，就像《黑神话：悟空》的出现并非偶然，而是数十年积累沉淀而爆发的必然结果。况且， 当一个行业的从业者开始用"必然"而非"希望"来描述未来时，风向其实就已经变了。 于投资人而言，比起早几年偶然爆品时期，现在无疑是更好的入局时间。不论是玩家数量、官方关注度还是技术支持，都已能构建出一套足够完整、可持续的商业生态。一个明显的证据是：比起单独的某款新品，各大公司明显开始更加关注自身持有的IP，以及未来长线发展的可能。 中手游收购《仙剑奇侠传》全球IP版权，意图构建"仙剑宇宙"；网元圣唐围绕《古剑奇谭》打造影视、游戏、衍生品联动；就连一向被视为"手游大厂"的腾讯，也开始在年度发布会上给单机产品留出专门的版块。 《湮灭之潮》 长此以往，做单机游戏就不再是一件需要"卖房卖车，只为追梦"的事情，而是一件有利可图、有意义可寻的事情。 而往深了看，这同样意味着游戏作为娱乐媒介的价值正在被重新定义。在碎片化的信息时代，当短视频以15秒为单位切割着人们的注意力，当算法用无尽的推荐消解着深度思考的可能，单机游戏这种强沉浸感、高互动性的娱乐模式，反而成为了一种稀缺的"完整体验"。而对于国产游戏而言，这种"完整体验"的载体，恰好是我们自己那些尚未被表述、被传达出来的文化。 2022年，《原神》推出"神女劈观"章节，一段以京剧为基底、融合现代音乐创作的剧情短片，在海外引发热潮。外国玩家为了理解"云堇"的唱词，主动去查阅中国戏曲的历史；YouTube上出现了大量解析"京剧唱腔""戏词韵脚"的教学视频。《古剑奇谭三》则以"传承"为主题，将视角从个人爱恨情仇，拉升到种族存续、文明传承的高度，让无数人第一次从游戏身上感受到了游戏作为文化载体的表达使命。 《古剑奇谭3》最后的寄语 这些无法通过纯粹言语传递的情绪与精神，往往能借助视听互动的模式，让人更感同身受地理解。 这就是为什么，国产游戏剩下的路，是它自己的路。这条路没有现成的模板可以参考，因为我们要讲述的故事、要触达的玩家、要承载的文化，都是独一份的。欧美的魔幻史诗、日本的武士物语，都已找到了最适合自己的表达方式。而中国的武侠、仙侠、神话、历史，以及当代都市里那些细碎的日常，正在等待属于自己的游戏语言。 回到开头的那个问题：国产单机究竟还缺什么？ 或许缺的从来不是做出好产品的能力，而是一套能让好产品持续活下去的生态。《明末》的故事已经说明，一款销量约200万套的游戏，在海外成熟市场或许会被给予持续投入的机会，但在这里，团队在第一次"不够成功"之后就失去了一切。这是整个行业都需要回答的问题：当越来越多的团队选择走这条路，我们能不能给他们足够的支撑系统？ 《明末》的制作人夏思源，在离开灵泽后成立了自己的工作室，注册资本只有5万元。他需要的不是情怀式的惋惜，而是一个能够让他再次安稳做产品的环境。 这条路肯定还有曲折，会有人失败，会有团队解散。但这一次，站在牌桌上的并不是少数情怀人，而是一整代经历过断层的玩家和从业者。他们见过辉煌，也见过衰落；他们被现实打磨过，但心底那团火始终没灭。 毕竟，胜败乃兵家常事，大侠还请重新来过。 本文由「 果脯1166 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 作者拍摄 +1 91 好文章，需要你的鼓励 果脯1166 新锐作者 15 收 藏 +1 3 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.279 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 智元机器人，要做AI大模型平台和开放生态 AI PC下半场，荣耀想让所有人先用上消费级龙虾 新加坡的AI征途：孕育下一个“硅谷” 创业老炮vs00后，谁是下一代“一人公司”的标准样板 智能体“军团”进入临床试验，北大校友四个月融了2亿美金、估值翻6倍 一群00后极客和这家机器人公司共处72小时 “医药界英伟达”，花200亿买中国AI公司的减重药 高端纯电，车企苦寻破局「命门」 杨植麟/张鹏/夏立雪/罗福莉/黄超，谈龙虾，谈“Token经济学” 果脯1166 新锐作者 TA没有写简介，但内敛也是一种表达 发表文章 20 篇 最近内容 《明末》团队解散背后，国产单机究竟还缺什么？ 2026-04-15 6年磨一剑的《洛克王国：世界》，能否胜过当年的自己？| 产品观察 2026-03-27 沙特土豪超60亿美元收购沐瞳：公司架构不变，张云帆仍是CEO 2026-03-20 阅读更多内容，狠戳这里 下一篇 AI的递归自我进化：那个东西的轮廓正在越来越清晰 我们的现状，以及未来可能发生的变化 2026-04-15 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举