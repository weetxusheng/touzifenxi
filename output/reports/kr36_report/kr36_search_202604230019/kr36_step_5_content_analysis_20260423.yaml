          summary: 'AI工具降低了个体进入AI创业的门槛，但真正决定项目成败的，仍然是创业者的判断力、获客能力与产品品位。'
          text: '创业老炮vs00后，谁是下一代“一人公司”的标准样板-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 创业老炮vs00后，谁是下一代“一人公司”的标准样板 富充 · 2026年04月13日 12:06 AI工具降低了个体进入AI创业的门槛，但真正决定项目成败的，仍然是创业者的判断力、获客能力与产品品位。 文｜富充 编辑｜苏建勋 2026年春天，“龙虾”火热异常，也直接带火了另一个概念：OPC（One Person Company，一人公司）。 一人公司的概念最早源于2013年英国公司法，原指法律意义上的“一人有限责任公司”。在AI浪潮下，它被重新定义，演变为一种个人或极小型团队，借助AI工具，即可实现全链路闭环的新型创业模式。 越来越多的商业领袖为OPC概念站台。周鸿祎说，一人公司是 AI 时代“超级个体”的极端形态。本质是 1个人指挥N个AI智能体 ，人做决策、AI 做执行。美图创始人吴欣鸿则在内部设立专项基金，鼓励10人以下的小团队申请，同时美图也推出新产品Meitu CLI，明确喊出要让“一人公司和初创团队”也能像专业团队一样调用影像能力。 从创业圈到成熟企业，AI工具正在重塑产品开发的最小单元，其带来的效率杠杆，在OPC群体中尤为凸显。 一人创业加速社区鸿鹄汇Honghub近日发布《2026一人公司洞察报告·重力、杠杆与进化》，首次提出面向一人公司OPC的AI效能评估指标HACR（Human-AI Cost Ratio，人机成本比），并发布中国市场2026年基准值： 一人公司每投入1元AI成本，等效替代约72元开发人力支出 。 △图片来自 《2026一人公司洞察报告·重力、杠杆与进化》 2025年下半年以来，一人公司逐渐从创业圈的自发现象，演变为被政策体系正式接纳的新型经济单元。杭州、深圳、上海、苏州、北京纷纷出台专项扶持政策，据公开信息，目前全国已有23个城市发布OPC相关政策。 《智能涌现》对谈了这波浪潮中，两位颇具代表性的“超级个体”创业者： “遇见森林”创始人郑国俊已有多年创业经历，过去三年里，他把团队从30人压缩到3人，在AI工具辅助下效率不减；“龙虾”赛道爆火后，他们又在14天内搭出了可上线的Agent协作新产品。 “00后”创始人Arvin体现的则是AI降低创业门槛的典型样本，两人团队、十几万启动资金，在AI帮助下把原本资源有限的个人创业跑了起来；“龙虾”出现后，他在语音硬件新项目EinClaw中，补齐对供应链和创业判断力的认知。 这些极小团队积极撬动AI杠杆，迅速补足执行层和知识空白，跑完从想法到产品的全过程。 但看得越深，我们越确认一个判断： AI降低的是“入场”的门槛，而至少在现阶段，“成功”的天花板却并未降低。 Demo可以速成，但产品定位、审美品位、痛点挖掘——这些决定生死的判断力，AI无法代劳。即便跑通了业务闭环，能否把它复制成可持续的收入、扩大客群，考验的依然是人的商务能力。 Honghub鸿鹄汇发起人邹凌曾经对《智能涌现》表示，称职的极小团队Founder，要会找机会、有执行力、能自我营销能把一人公司或者这种极小组织公司良好经营起来的Founder，身上通常具备以下三种核心能力： 一，找机会的能力。他们往往在某个行业深耕多年，可以从自身行业经验中提炼真实痛点、找到可以用AI改进的低效环节。 二，快速执行力，能借助AI独立完成短时间内做出初版甚至多个Demo，然后迅速获得反馈，聚焦最有潜力的方向迭代。 三，AI时代，很多早期项目并不依赖ToB销售或获客团队，个人创业者还要擅长用社交媒体为自己“代言”。得有找到早期用户、验证需求，甚至带来现金流的能力。 这篇文章记录了两位OPC创业者的真实经历。我们想呈现的，不仅是一套小团队创业的方法论，更是他们在这一轮变革中，那些值得被记住的收获与反思。 郑国俊：AI代替了员工、客户、CEO，但商业化的关还得自己过 “龙虾”火了不到两个月，“遇见森林”联合创始人兼CEO郑国俊就决定关掉运营两年多的AI写真业务“45AI”，彻底转向“龙虾”相关的新项目。 关停旧业务并非因为“不赚钱”，今年2月，45AI还在稳定产生现金流，之前最火的时候零市场预算情况下，上线7天超10万付费用户。 但郑国俊判断：既然已经看到Agent是AI创业的未来方向，存量业务增长有限，要做就把有限的资源All In在新赛道。 郑国俊毕业自哥伦比亚大学数学系，做过投资；创业前在"出门问问"担任AI产品经理的经历，让他对用户需求和产品形态的变化更为敏感。 △郑国俊（左二）在一人公司社区HongHub的对谈活动现场，图片：采访对象提供 新项目名为Clawroom，让不同主人的Agent能在同一套协议下接活、协作、交付，这可以解决目前“龙虾”难以跨组织沟通协作的问题。 具体而言，现在的初步产品像个“龙虾”协作“聊天室”：甲方给自家“龙虾”下任务，它直接在这里对接乙方“龙虾”执行，人只负责验收和兜底。 比如，甲方说“下周发5篇小红书笔记”，自家“龙虾”就在Clawroom里指派给乙方“龙虾”，甲方等结果即可。 最初，郑国俊其实还没想清楚产品具体长什么样，只是看到B端客户有想让企业Agent之间更高效协作的诉求。产品思路是他和Claude一轮轮聊出来的，然后Claude Code完成多款Demo。从立项到第一版上线，3个人，14天。 郑国俊估计，放在前AI时代，这至少需要一个10人的团队，花费2个月；更大的可能是，团队会因为周期太长和不确定性直接放弃这个新业务。 这也是AI时代产品开发的明显变化：不再憋大招，而是可以先做出最小原型，放进真实场景里快速迭代。 过去三年，郑国俊的团队从近30人缩减到3人，AI几乎参与了公司事务的每一个环节。 最初的替代从实习生开始。问卷调研、用户需求挖掘——这些重复性高、创造空间小的工作，交给GPT-3.5后，一个实习生能完成过去几个人的活。 后来是程序员。GitHub Copilot让一天的工作量压缩到四小时，擅长AI编程的人能把三周的工作量四天干完。 替代不止于执行岗。郑国俊甚至让AI扮演CEO：拆解竞品功能、分配开发任务、制定迭代计划——AI完成得有条不紊。 最近，在“龙虾”承担起运营等工作的情况下，原本只负责写代码的CTO，也开始独立运营一个新的小红书账号，发布商品推广图文。最初有客人来询价时，CTO并不清楚该怎么报价，还是“龙虾”客服向对方提出了价格方案。 但效率的提升，并没有让创业变得更容易。 郑国俊越来越清楚：AI改变的是效率，不是商业的底层逻辑。团队可以更小，开发可以更快，Demo可以更容易做出来——但客户不会因此自动出现，获客这些市场行为，仍然离不开人。 而且，极小团队的项目，往往不是资本青睐的类型，就更要把商业化闭环跑通。 2022年之后，融资环境变差，郑国俊想明白一个道理：融资和做生意是两套逻辑。融资青睐的是可规模化、可上市退出的故事，但一人AI创业项目通常基于某个细分需求和创意，很难符合这个预期。 更重要的是，股东多了，转身就会慢。比如关停“45AI”这件事——郑国俊清楚，存量业务的增长已经到头，继续维持只会分散精力。在这个三个月就变一次的行业里，决策速度比钱值钱。但如果公司有多位股东，就难以执行：会有更多人劝他不要关掉一个赚钱的业务。 所以郑国俊反复强调：如果选择做生意，Day 1就要想好怎么赚钱。不要被热钱冲昏头脑。 从30人到3人，不只是一个“AI提效”的故事。它真正说明的是：AI让团队更轻了，让转身更快了，但商业这道关，最后还是得创始人自己过。 Arvin：一个不想做“牛马”的00后，在AI“一人创业”里迭代判断力 正是AI工具的出现，让EinClaw项目联合创始人Arvin意识到“我也能先把公司开起来”。 2025年10月，Arvin从上家公司离开，扎进AI创业，做截图管理App。他的基本盘并不“华丽”：“双非”大学延毕两年，国际商务专业，在区块链公司做过三年产品经理。十几万的启动资金，行业资源有限，团队只有他和合伙人Affe两人。 这样的起点，在过去很难撑起一个产品团队。但在AI时代，它变得可行了。开发、法务、财务、隐私政策——没经验的事，先问AI；有了产品想法，就让Vibe Coding工具执行开发，人不需要在大量沟通和会议中浪费精力。 这也是Arvin最初对“一人公司”的理解：不想在大厂做低效运转的“牛马“，而是尽可能无损地把自己的能力直接转化进业务。 但AI是帮手的同时，也是竞争者。 12月30日，Arvin留意到了当时还名为ClawdBot的“龙虾”，但判断这是一款有安全风险的Claude Code，没有过多关注。1月10日，他初次试用后，失眠到凌晨四点。那一晚他做出的判断不是“来了个新工具”，而是“之前的App功能会被“龙虾”覆盖，项目必须转向”。 后来的故事一路加速。 2月，Arvin开始考虑做一款能接入“龙虾”的语音硬件——像Plaud一样挂在身上，不用解锁手机，就能语音输入想法并传给“龙虾”执行任务。他和合伙人在3月初的上海DIIS 硬件黑客松上，把“语音+Agent+硬件”的想法完整串起来，获奖，项目开始启动预售。 △DIIS 硬件黑客松上，Arvin（左）和合伙人Affe的“龙虾”语音硬件创意获奖，图片：采访人提供 接下来才是真正的难点。因为他和合伙人都没做过硬件，供应链磨合一开始就走了弯路。熟人报来的硬件方案价格要20万元，对一个刚起步的小团队来说，这不是个小数目。 项目一度陷入停滞，直到Arvin的另一位朋友指出，其实上述方案在5万元以内就可以做下来并推荐了相应供应链，项目才得以继续。 在Arvin看来，创业至今，业务具体内容变了，但底层逻辑其实没变。无论是最早的截图App，还是后来的语音硬件，本质上都在解决同一个问题：帮用户沉淀日常产生的大量 context，并真正把它调用起来。 真正变化的，是Arvin对创业的理解。 他会反思自己对业务的研判有些“滞后“：为什么12月30日看到那个产品时，没有更早一点认真试用？为什么被供应链报出20万元后，没有再继续找其他供应链验证信息是否属实，导致项目陷入了短暂的停滞？ 他慢慢意识到，有了AI作为执行层之后，极小团队中真正稀缺的，是创始人的判断力。 如果说，Arvin眼中大公司的“苦”在于消耗，那么小团队创业的“苦”，就在于没有缓冲层。判断的后果，要自己承担；一个成员状态差，团队产能就会立刻打折；方向判断慢一步，窗口可能就没了。 AI的杠杆，让Arvin这样的年轻人有机会低门槛开启创业，也逼着他们更早面对创业里最硬的一层：能力不只是做得快，还包括想得对。 Arvin在过去8个月摸出了一套现实经验： 团队再小，也要有个“J”人能排优先级、搭框架； 合伙人最好先在黑客松这类高压协作里验一遍——能不能一起扛压力，比履历更重要； AI工具要多用，但也要知道它做不了什么——设计、审美、营销判断这些事，自己不够强就得尽快找专业人士帮忙； 办公环境不是小事，对极简团队来说，一个能迅速进入心流的空间，本身就是生产力。 △Arvin最近离开工作多年的深圳，入驻杭州HongHub办公室，他选择在办公室里搭帐篷住，图为和好朋友一起参观他的帐篷 ，图片：采访人提供 Arvin说起，自己创业的动力，也包括极强的、对运转效率低下的旧公司体系的厌恶，因此即使退回到起点，仍然会选择“极小公司创业”这条路。 “因为别的路也要吃苦，只是那些苦不是他想吃的，自己做创业，最差最差，也不过是一场白日焰火。”Arvin说。 封面来源｜AI生成 欢迎交流～ 👇🏻 扫码加入「智涌AI交流群」👇🏻 本文由「 富充 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： AI生成 +1 285 好文章，需要你的鼓励 富充 新锐作者 104 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.279 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 智元机器人，要做AI大模型平台和开放生态 AI PC下半场，荣耀想让所有人先用上消费级龙虾 新加坡的AI征途：孕育下一个“硅谷” 《明末》团队解散背后，国产单机究竟还缺什么？ 智能体“军团”进入临床试验，北大校友四个月融了2亿美金、估值翻6倍 一群00后极客和这家机器人公司共处72小时 “医药界英伟达”，花200亿买中国AI公司的减重药 高端纯电，车企苦寻破局「命门」 杨植麟/张鹏/夏立雪/罗福莉/黄超，谈龙虾，谈“Token经济学” 富充 新锐作者 TA没有写简介，但内敛也是一种表达 发表文章 56 篇 最近内容 创业老炮vs00后，谁是下一代“一人公司”的标准样板 2026-04-13 对话原力灵机唐文斌：我不喜欢讲我不信的话，也无法成为我不想成为的人 2026-03-30 松下发布中国事业新战略：明星单品、套系家电加码，强调“Made by China”出海丨最前线 2026-03-16 阅读更多内容，狠戳这里 下一篇 巨头集体出手涨价，AI涨价潮来了，龙虾员工要用不起了？ AI大模型集体涨价，算力需求激增致成本上升。 2026-04-13 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载