            - '公司半年内完成A轮系列融资，累计近2亿元，投资方包括神骐资本、明势创投等。2024年10月其网球机器人海外众筹超270万美元。'
            - '创始人张海波认为，训练中“忽略错误”以形成肌肉记忆比“实时纠错”更重要，因此机器人优先提供稳定、可重复的供球。'
          new_facts:
