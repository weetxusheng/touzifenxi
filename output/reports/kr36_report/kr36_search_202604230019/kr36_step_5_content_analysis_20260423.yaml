          title: ''
          summary: '巴菲特在当下持有天量现金的核心原因，除了看空美股外，也是出于他注重安全边际的投资理念。'
          text: '「美股例外」何时休？-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 「美股例外」何时休？ 黄绎达 · 2026年04月14日 16:33 巴菲特在当下持有天量现金的核心原因，除了看空美股外，也是出于他注重安全边际的投资理念。 作者 | 黄绎达 编辑 | 张帆 进入4月以来，受地缘关系缓和、“再通胀”预期走弱等利好的持续释放，美股三大指数持续走强。截至4月13日，标普500在4月的前8个交易日里实现6连阳，纳指的同期区间涨幅则相对更高，录得7.38%。 行业板块方面， 科技板块作为本轮美股短期上涨的“领头羊”表现相对强势 。细分领域中的半导体、芯片、AI、量子技术等方向的表现尤为突出；截至4月13日，万得美国半导体指数、万得美国芯片指数、万得美国AI指数4月以来的区间涨幅都超过了10%。 图：美股三大指数走势；资料来源：wind，36氪 回顾今年以来美股大盘的走势，进入2月以后，美股三大指数均出现了不同程度的持续调整，主要受到了中东地缘冲突、美联储政策预期、AI叙事切换等多方面因素的扰动；相较之下，科技板块受到的影响更大。从风格来看，价值的表现好于成长，同时中小盘的表现要好于大盘股。 值得注意的是， 尽管在进入4月后，美股迎来了一轮强势反弹，“股神”巴菲特在近期参加CNBC节目时表达了看空当前美股市场的观点 。作为历经多轮市场周期、深谙价值投资精髓的投资大师，巴菲特的观点对于股票投资者具有重要的参考意义。 01 当前美股估值吸引力不足 尽管今年一季度美股创下近四年来的最差季度表现， 但在巴菲特看来，经历本轮下跌后的美股估值水平，仍不具备显著的吸引力 。这一判断，既源于他漫长职业生涯积累的投资经验，也与其以长期投资价值为核心的理念一脉相承。 自巴菲特接手伯克希尔哈撒韦之后，不仅经历了三轮市场超过50%的暴跌，也见证过美股大盘单日重挫21%的极端行情。所以，在美股大开大合的交易风格之下，今年一季度美股大盘仅6~7%的跌幅实在不值一提，这样的折价程度自然也很难打动巴菲特，而4月以来的上涨行情则进一步强化了这一观点。 更为重要的是， 巴菲特的投资逻辑向来不看重短期涨跌，而是注重企业的长期投资价值，并通过长期持有优质资产来实现可观的收益 。苹果、美国运通、可口可乐、雪佛龙、西方石油等伯克希尔长期重仓的标的，都是这一理念的集中体现。 图：巴菲特股票投资组合部分重仓股；资料来源：Investing，36氪 在美股市场尚未出现足够诱人的大幅折价机会时，他依旧选择以耐心等待为主。伯克希尔2025年财报显示，公司持有的现金及现金等价物约3700亿美元，且主要配置为美国国债。基于美债高流动性的特征，伯克希尔资产端的这一布局，亦直观的反映出其当前的投资策略： 以防御为核心，同时兼顾灵活的攻守转换 。 02 “再通胀”风险的两面性 结合巴菲特一贯的投资风格，不少投资者将其手握3700亿美元现金的操作，简单解读为静待抄底的时机。然而，从更深的层次来看， 他当前的投资策略，主要是基于对宏观经济、货币政策、地缘政治风险等多重因素的综合研判，并非单纯等待市场大跌后的抄底机会。 在货币政策方面，巴菲特的态度比美联储更加激进，他认为应该把通胀的政策目标定在0，而非当前的2%。 其背后的核心逻辑，本质上是一笔简单的投资账：即便不考虑通胀的复利效应对财富的长期侵蚀，只要投资年化收益跑输通胀就等同于实际亏损。 从通胀预期来看，美国“再通胀”风险有持续升温之势，对美股等风险资产形成明显压制 。美国2026年3月CPI同比上涨3.3%，较前值2.4%的水平显著反弹。从结构来看，美国CPI权重最高（30~40%）的住房（含房租）分项目前已经回到了疫情前的水平，而能源价格走高则是推动3月CPI同比走扩的主要推手。 图：2026年3月美国CPI同比；资料来源：MacroMicro，36氪 本轮能源价格的短期大幅上涨，主要受美伊冲突的影响， 因此国际油价是观察美国“再通胀”风险的核心指标之一 。以油价变动趋势为核心变量进行情景推演可知：唯有美伊双方迅速达成和解，国际油价才可能快速回落，美国“再通胀”风险将应声解除；除此以外，最乐观的情况，也是油价维持在90美元/桶高位至少持续到今年二季度末。 图：美国能源CPI和布伦特原油期货价格；资料来源：wind，36氪 然而，美国“再通胀”风险持续升温，对于巴菲特投资决策的影响相对复杂，不局限于压制美股整体的预期。由于伯克希尔重仓了雪佛龙、西方石油等石油化工龙头，随着国际油价在今年一季度的暴涨，上述重仓股在同期也取得了不俗的收益，雪佛龙在今年一季度的涨幅高达31%，西方石油的同期涨幅更是接近60%。 从巴菲特长期价值投资的理念来看，他重仓雪佛龙、西方石油等石化龙头的核心逻辑，是对石化行业长期基本面的坚定看好。而这些能源股在今年一季度取得的可观收益，是其长期持有优质资产策略的自然结果。 根据当前市场的主流预期，国际油价维持高位至少持续到今年二季度末，巴菲特重仓石化龙头则有望为组合继续贡献可观收益。而他手握巨额现金的核心逻辑，不仅是对“再通胀”风险压制美股预期的审慎，也包含对金融系统潜在风险的担忧。 03 持有天量现金也是对冲潜在风险 巴菲特虽一贯强调不预测市场的短期涨跌，却始终对潜在风险保持高度警惕。在当前金融体系中，顶级投行的无担保业务规模持续扩张，由于金融机构之间高度关联，一旦某一环节出现风险，极易出现快速传导、扩散，这也正是当前金融系统脆弱性的突出体现。 正是基于对当前金融系统潜在风险的考量，巴菲特选择持有充足的现金（包括短期国债），甚至避开货币基金、票据等非极端市场条件下的高流动性资产。在他看来，极端的市场环境下，当市场出现流动性枯竭，只有现金与国债能够维持真正可靠的流动性，这也是巴菲特在其漫长的职业生涯中，经历过多轮市场周期后的经验之谈。 由此可见， 巴菲特在当下持有天量现金的核心原因，除了看空美股外，也是出于他注重安全边际的投资理念，意在对冲“再通胀”压力、潜在的流动性危机等多个方面的市场风险，凭借其数十年的投资经验，他或许已提前嗅到了潜在的危机信号。 图：2008年金融危机期间TED利差走势；资料来源：wind，36氪 04 “美股例外”或被终结？ 在CNBC与巴菲特的对谈中，他表达了对美元全球储备货币地位的担忧，其背后亦隐含了对未来美股长期前景的担忧。在全球的权益市场中，美股堪称“独一档”的存在，基于美国在经济、政策和科技发展等方面的优势，美股得以在全球周期中持续跑赢非美市场，这种“美股例外”的观点正是“美国例外论”在资本市场的集中体现。 美股之所以能够成为“例外”，核心根基正是美元的全球储备货币地位，美元资产因此而普遍受益，美股更是最直接的受益者。其内在的逻辑在于：凭借美元带来的全球资产定价权优势，叠加美股巨大的市场规模、成熟的市场生态与完善的交易制度，美股拥有了全球独一档的流动性优势，上述多重因素持续共振，由此构成了美股的核心竞争力。 然而，随着近年来逆全球化趋势的持续，美股“独一档”市场地位的根基已出现了一定的松动。在去美元化浪潮的冲击下，美元储备货币地位正被不断削弱，美股依托美元而建立的全球定价权、国际资本吸引力与充裕流动性等优势，均面临直接挑战。反映在投资交易上，从短期的趋势来看，全球资金已经连续两个季度减持美股。 日元近期的汇率波动对美股也形成明确利空，特别是高估值的科技股。自2025年二季度以来，日元整体上在持续贬值，近期日元汇率关键关口的失守，触发日本监管层“口头干预”；随着日本4月加息预期的升温，日元的市场预期出现转向，由此驱动日元短期走强。 由于日元长期0利率，甚至出现过长期负利率的情况，由于借贷成本极低，所以日元也逐步成为全球最大的融资货币。通过日元套利交易，即借入日元转投高收益资产，为美股市场提供了大量的流动性。 但是，日元套利交易对日元汇率波动极为敏感，随着近期日元的短期升值，驱动日元从海外回流；流动性“抽水”的同时，由于套利盘普遍带有一定倍数的杠杆，所以日元汇率波动的影响被放大，进而在一定程度上逆转日元套利交易，由此形成“卖美股→美股跌→日元进一步升值→更多套利盘平仓→美股再跌”的负向螺旋。 图：美元兑日元走势；资料来源：wind，36氪 根据央视新闻消息，当地时间4月13日，美国总统特朗普称已经开始军事封锁伊朗，并表示“不需要”霍尔木兹海峡；OPEC数据显示，主要受地缘冲突影响，该组织3月原油产量刷新史上最大单月跌幅。地缘冲突加剧与原油供给收缩预期，推升美国国内“再通胀”压力升温，一方面直接对美股估值形成新一轮压制，另一方面能源成本上行也将加剧企业盈利压力，利空美股基本面。 在滞胀风险与避险情绪共振下，市场风险偏好将显著下行，加之地缘局势反复带来的扰动，美股整体预期短期偏空。其中，此前依靠充裕流动性维持高估值的科技股，对流动性收紧与市场情绪变化更为敏感，随着美国国内的“再通胀”压力升温，叠加日元套利交易被逆转引发的被动平仓，美股科技板块或将面临更大的估值回调风险。 *免责声明： 本文内容仅代表作者看法。 市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。 本文由「 黄绎达 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 视觉中国 +1 73 好文章，需要你的鼓励 黄绎达 资深作者 28 收 藏 +1 1 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.279 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 从单季到全年盈利，知乎迎来估值重估 创想三维IPO：造物平权下的版权困境 腾讯不愿在微信里躺平 英特尔的「特斯拉困境」 xTool，下一个「影石」要IPO了？ 松果出行身上看到了ofo的影子 铲屎官养不活宠物医院 摩尔线程，冲得越高盘得越久 白银暴涨，锅在光伏？ 黄绎达 资深作者 医药行研起家，爱周期、爱消费，国债策略、宏观经济略知一二。 发表文章 116 篇 最近内容 「美股例外」何时休？ 2026-04-14 从单季到全年盈利，知乎迎来估值重估 2026-03-27 腾讯不愿在微信里躺平 2026-03-19 阅读更多内容，狠戳这里 下一篇 李想爆粗口那一刻，中国车企的“暗战”彻底摊牌 一边集体造大车，一边互相“下黑手”，车圈到底怎么了？ 2026-04-14 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
