          title: ''
          summary: '“小龙虾”时刻后，AI硬件开发范式已经改变。'
          text: '获韶音投资，一家AI公司做了“硬件版OpenClaw” | 36氪独家-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 获韶音投资，一家AI公司做了“硬件版OpenClaw” | 36氪独家 咏仪 · 2026年04月02日 12:25 “小龙虾”时刻后，AI硬件开发范式已经改变。 文｜邓咏仪 编辑｜苏建勋 当OpenClaw风暴席卷全球之时，无界方舟创始人曾晓东的反应不是兴奋，而是一种“终于被看见”的感觉。 “OpenClaw本质上是一个Agent框架，底层是一个会写代码的Agent，放在云端服务器或者电脑上。”他对《智能涌现》说，“我们的AIOS本质上也是一个Agent框架，但它是放在硬件端侧的OpenClaw——机器人、耳机、眼镜，都可以在这套OS上运行。” 无界方舟从2024年成立起，就在做这件事。曾晓东给这套范式起了个名字： Vibe Hardware ——用自然语言做硬件开发，AI就能自己写程序、调驱动、完成整个应用研发与部署。 目前，无界方舟已经建立起了从硬件产品到OS的产品体系，包括AIOS“EVA”，以及包括AI教育机器人“奇多多AI学伴机”在内的硬件和产品生态。 近期，无界方舟也完成连续两轮Pre-A轮融资。投资方包括全球知名穿戴式设备品牌韶音、国瑞源基金、恒松资本、上海天使会，易凯资本担任独家财务顾问。 过去一年内，无界方舟已经快速完成4轮融资，累计融资金额数亿元。 △无界方舟创始人曾晓东 无界方舟创始人曾晓东曾在阿里巴巴及蚂蚁集团任职10年，从0到1孵化了刷脸支付、支付宝盒（千万级销量）、淘咖啡（中国第一家无人超市）等硬件产品。 经历过AI 1.0时代从做硬件层产品到系统的全过程，曾晓东说：“我认为潜力最大的是做内核本身，也就是OS。但要做内核不可能凭空想象，所以我需要先端到端做完一款硬件。” 无界方舟的目标，也并不是做单一的大模型公司或硬件公司，而是去打造一套面向新一代智能终端的AI操作系统（AIOS）框架，让不同形态的设备都能在统一底座上运行、迭代。 “小龙虾”时刻后，AI硬件开发范式已经改变 “小龙虾”OpenClaw爆火后，Harness Engineering也成为硅谷热议话题。 当模型能力越来越强，真正决定Agent好不好用的不再是模型本身，而是模型运行的环境：它能调用什么工具？它怎么理解当前状态？反馈回路怎么设计？这套“环境”就是Harness。 EVA OS做的就是硬件领域的Harness Engineering。 “可以理解为，EVA OS 就是硬件版本的Context Model，是给OS做加法，而不是替代。”曾晓东说。 他对《智能涌现》多次强调，EVA OS不是要做另一个鸿蒙。上一个传统操作系统（Android、Linux、ROS）时代中，并不是AI能力不行，而是缺少一层——让AI能力原生地跑在硬件上的中间层。 这个“中间层”到底需要做什么？ 以前，调通一条完整的AI硬件链路并做到可服务，至少需要3个人、2-3个月的时间和成本。但安装了EVA OS之后，开发者只用自然语言描述需求，AI知道自己所在硬件的环境，自己把APP写出来。平均只需要半小时，就能让端侧变成一个可实时交互的AI，带记忆，可以实时调整。 这种开发范式建立在EVA OS和硬件强耦合的基础上。如果AI不了解它所在硬件的完整上下文——芯片算力多大、哪些传感器在线、内存还剩多少、外设连接状态如何——就不可能在上面研发任何APP。这是EVA OS最大的难点，也是核心壁垒。 近期，无界方舟就已经和一家机械手臂公司合作，将搭载EVA OS的开发板接上机械手臂后，AI先自己调通驱动、自己修Bug，然后开始自主探索。工程师发出指令“帮我拿起某个东西”，EVA OS就能够自己写程序、自己试错。 “EVA OS可以自己试错，是因为它知道开发板跟手臂之间的连接状态。这跟以前完全不同。”曾晓东说。以前，工程师得自己看驱动文档、排查各种硬件Bug，再一步步调通，让硬件摆脱从前的传统OS“预制APP+抽象硬件”的模式。 为了能够在算力有限的端侧跑通，EVA OS采取云端和本地协同的一种高效架构。EVA OS可以做到语音延迟小于250ms，多模态反馈小于350ms，这相较行业通用方案600ms左右的语音延迟提升非常多。 EVA OS的逻辑是，把能在硬件端侧做完的事情留在本地，只把复杂推理丢给云端。语音识别、TTS、视觉感知这些高频交互环节放在端侧，而不需要每次通过云端计算。 端侧模型则承担记忆、执行和交互三层能力——记住用户习惯、调用工具、提供交互界面；而云端保留通用知识和复杂推理，端侧负责将这些能力变成硬件上真正能跑的东西。感知模型完全跑在端侧，成本能降70%-92%。 △EVA OS的记忆能力，能够回忆影像的关键画面，回答相应问题，比如出现在视频中的某个物件的位置 本轮融资后，无界方舟还将发布一款新硬件终端EVA Pi。 曾晓东表示，这会是一台“可以自主写代码、自主更新的硬件终端”。 △图源：无界方舟 EVA Pi集成了EVA OS，能实时感知硬件侧全部上下文（传感器、驱动、链路状态、运行反馈），在端侧原生完成AI应用的开发、部署与迭代。 目前，EVA OS 1.0发布3个多月，已有超过2500家企业与研发单位将其应用于硬件产品研发， 品类则覆盖AI耳机、AI眼镜、桌面机器人、智能腕带、车载智能管家、机械手臂等多个品类，合作方包括全球知名的可穿戴设备和具身智能头部企业。 模型端到端，决定了AIOS能否存在 和曾晓东的交流中，你会强烈感觉到他对端到端路线的坚持。 2024年上半年，大模型领域尚处在语言模型的风暴当中，多模态交互的技术路线尚未收敛。唯一的参照物是GPT-4o的发布会演示——但当时的OpenAI甚至还没有开放API。 当时，绝大多数AI硬件公司都选择走“串联”路线——将ASR（语音识别）、大语言模型、TTS（语音合成）等模块像流水线一样接在一起，完成对应的任务。这条路线相对成熟、成本足够经济。“但问题也很明显：模块之间的信息损耗严重，比如情绪、语气、连续性全部丢失，延迟层层叠加，会有很多修理的Bug。”曾晓东说。 他并没有选择这个方向，而是带着7个人的团队，经过近一年时间，推出了可以跑在硬件侧的端到端多模态基座模型，这是EVA OS的基础。 这源于曾晓东此前在蚂蚁的多次“创业”经历——孵化刷脸支付、支付宝盒、淘咖啡的过程中，反复撞上同一堵墙： AI算法和终端硬件之间，存在一条巨大的鸿沟，中间层严重缺位。 从无界方舟的选择反推，本质是因为， 未来的端到端模型一定要以更小的成本跑在各种端侧设备上，这才是创业公司的机会。如果纯做软件侧的垂类模型，太容易被基模厂商吞噬。 一个例子是，无界方舟从2024年开始，就已经通过“奇多多AI学伴机”探索AI教育方向；而做基模的巨头们普遍在2024年下半年到2025年才入局AI+教育赛道，无界方舟就提早了半年到一年左右的窗口。 当前，无界方舟自研的端到端模型，用一个模型就同时处理语音识别、语音合成、视觉理解和语言推理，信息损耗大大减少。 自研端到端路线，首先是打开了更多硬件品类和场景。 “我们的一个端侧模型，语音识别加TTS合在一起，一个模型完成两个任务，不需要GPU，完全跑在CPU上，内存占用不超过1G。”曾晓东说。 在出海场景下，耳机、眼镜等设备面对的海外网络环境极不稳定，搭载EVA OS的硬件，能够做到不需要联网，就能完成语音识别、语音合成和基础翻译。 奇多多AI学伴机就是EVA OS的第一个落地案例——面向3-10岁儿童的AI教育机器人。 曾晓东把奇多多AI学伴机称为EVA OS的硬件“样板间”。目前，奇多多的用户使用不算APP使用，仅计算AI对话、AI阅读等硬件使用时长，当前奇多多AI学伴机的用户日均使用高达145分钟。 自研模型也会带来交互体验的差异化。这很大程度是因为端到端模型不经过各个模态间“翻译”，语音和视觉信号直接关联语言模型——它能感知情绪，能捕捉连续对话中的语境变化，回应因此更像一个真实的人。 成本优势同样关键。自研的端到端模型让语音成本降至行业通用方案的二十分之一。所以，奇多多AI学伴机能够做到千元级别售价，并且后续无订阅费。 两年前，曾晓东带着七个人押注了硬件端到端这条没有先例的路。两年后，EVA OS已经迭代到了第三版，无界方舟正在孵化更多To C的硬件品类，和越来越多的品类合作——AI眼镜和AI耳机等等。 模型的进化速度依旧远超人们想象。不过，曾晓东说，更大的赌局才刚开始。 做AI硬件的操作系统，这条路并不新鲜。2017年前后，国内曾涌现过一批机器人OS创业公司，试图像安卓一样构建生态。成功者寥寥。天猫精灵和小米音箱靠补贴迅速占领入口，但它们定义的是“音箱”这一品类而非“智能体”，直接挤压了垂直型OS的生存空间。 成本是更加致命的问题——当时追求高性能只能用手机级芯片，单颗成本高达几百美金，即便终端卖到两三千块，公司依然在赔钱。 曾晓东认为，大模型时代的机会和AI 1.0时代有本质区别。“AI硬件的操作系统，现在全球还没有一个真正意义上的赢家。窗口期可能就这两三年。” 某种程度上，大模型重新定义了硬件的交互方式——内容不再需要预先灌装，AI自己生成。低功耗AI芯片的成本降到了可商用的区间；端到端模型，则让一个创业公司有可能用极小的团队，把从模型到硬件的整条链路打通。“天时地利人和，上一波不具备的条件，这一波全齐了。” 现在，无界方舟内部已经全面Vibe Hardware，硬件迭代速度变成了每天一次。为了成为一家能把AIOS做出来的公司，曾晓东从去年开始推动一次组织变革——全员Vibe Coding，不论工程师、产品经理还是运营，所有人的工作都要汇集到代码层面。 “当一家公司全员的所有动作都汇集到Vibe Coding，你所有的数据就结构化了。结构化之后，真正的中间层优化才有可能发生。”他说。 欢迎关注 欢迎交流 本文来自微信公众号 “智能涌现” ，作者：邓咏仪，36氪经授权发布。 本文由「 咏仪 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 采访供图 +1 63 好文章，需要你的鼓励 咏仪 作者 24 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.277 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 具微科技两个月狂揽4轮数亿元融资，产业资本“天团”强势入局 | 36氪首发 智能锂电园林公司完成数千万元融资，出货量破万台｜硬氪首发 36氪首发 | 首创“玩偶+主机”模式，多智能体儿童AI玩具品牌获数千万元融资 36氪首发 | 前华为工程师创业，实现临时键合载板存量循环，龙头客户已验证 36氪首发 | “华为天才少年”创业连融超4亿元，做新一代推理芯片重构显存成本 要做电商Agent OS，前钉钉最年轻副总裁创立的「攀峰智能」再次完成数千万天使轮融资 36氪首发｜港中文博士和前大疆智能制造负责人创业，要做AI时代的“个性化乐高” 36氪首发 | 打破日本工业镜头垄断，松山湖团队融资数千万 36氪首发 | 深大教授AI芯片项目再融资近亿，主动式散热微系统服务传音 咏仪 作者 关注AI、云计算，交流+twiddly0309 发表文章 1125 篇 最近内容 获韶音投资，一家AI公司做了“硬件版OpenClaw” | 36氪独家 2026-04-02 2000万只“龙虾”进入企业，阿里的企业Agent新故事 | 最前线 2026-03-18 获近亿元融资，一家AI公司的两周转型小龙虾实战故事 2026-03-09 阅读更多内容，狠戳这里 下一篇 Claude Code 泄露的代码里，处处写着：这家公司人品不行 你的数据它都会留一份副本；你的设备，它能动的也远不止你以为的那点。 2026-04-02 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
