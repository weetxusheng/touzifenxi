          text: '全球硬件大爆款，生于中国｜深氪-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 全球硬件大爆款，生于中国｜深氪 袁斯来 · 2025年09月17日 12:17 中国硬件创业的黄金时代，万事俱备，呼啸而来。 作者 | 袁斯来 访谈 | 袁斯来 黄楠 张子怡 编辑 | 杨轩 特朗普挥动关税大棒的时候，却不知道，中国公司仍然在纽约时代广场的荧幕上抢占眼球。 巨幕下的匆匆过客中，一定有这款Plaud AI录音笔的用户。它纤薄小巧，能贴在iPhone背后，接入ChatGPT整理录音，售价不算便宜，159美元起，但销量却迅速突破了百万台。 （2025年6月，Plaud广告登上时代广场屏幕，图片来自Plaud.AI 公众号） 无论从产品、宣传，Plaud这家公司都看起来“中美莫辨”。但实际上，它成立在2021年的深圳。创立之初，创始人许高就表达过Plaud的愿景：“Day One（第一天）就要做一个全球化的企业”。 这样的口号放在十年前，没有多少人会当真。当下，却可能是许多野心勃勃年轻人理所当然的创业路径。不止一位创业者向36氪表达了这样的想法： 一个硬件创业公司，在2025年要是不盯着全球市场，不想做高溢价的品牌，那就太没想象力了。 在全球环境动荡不安的眼下，这样的“想象力”充满了珍贵的乐观主义勇气。 如果追寻这种勇气的源头，或许要将时间拨回到十年前。 2014年时，《华尔街日报》发文称赞一家产品刚上市两年的中国公司是“首个在全球主要的消费产品领域，成为先锋者的中国企业。” 赞誉背后的现实是：以中国加入WTO为标志的全球化十几年后，中国出口总值已达到14万亿人民币，但中国产品给世界留下的印象仍然是：性价比不错，但没什么趣味，更谈不上“酷”。 直到大疆出现。 很长一段时间中，北美最大的民用无人机制造商是3D Robotics。创始人Chris Anderson曾是连线杂志的总编，最初无论是资源还是人脉，都远胜大疆这样的中国初创公司。 但Chris Anderson清楚这个对手的凶猛。他2014年公开表示大疆是 “第一波我们在21世纪需要应对的中国公司，他们在执行力上是无可挑剔的。” 这一年，大疆的爆款Phantom（精灵）无人机推出了第二代，营收超过10亿美元。 一年后，3D Robotics撤离了消费级无人机领域。“我们意识到，一家位于硅谷、以软件为中心的公司，要和一家位于中国、垂直整合的强大制造公司竞争，这本身就很困难。”3D Robotics的前首席营收官科林·格温回忆。 在之后的十年中，大疆长期占据全球消费级无人机市场七成以上份额。这带来了可观的收入（业界认为大疆年营收已超500亿元），也带来了高利润率，一扫过去中国产品廉价利薄的处境。 “以前中国公司是不敢定高价，也没有能力定。接着，他们有能力定了，但还是不敢定。”星联创新的创始人毛汉勇对36氪说， “现在是又有能力又敢定出高价。” 大疆向世界展示了中国制造新的可能性，也启发了一代硬件创业者。 影石创新CEO刘靖康2017年接受采访时，希望自己的公司“能像大疆公司一样，被世界认可。” 2025年，90后刘靖康成为科创板最年轻的敲钟人——过去十年，影石不断吞噬硅谷明星公司Go Pro的市场，已经成为全景相机赛道的绝对龙头——上市后，影石创新市值只用了三个月就突破千亿，引发了整个市场的关注。 这是以小博大的奇袭，也是中国制造业积淀的点状爆发。 （36氪制图） 它们带来一个疑问：十年间，从大疆开始，为什么有安克、影石、正浩……新一代硬件公司接连不断出现？ 无论是许高、汪韬还是刘靖康，身上都有新一代硬件创业者共同的特质：拥有全球化的硬件产品视野，能够直接触达海外消费者的心智。 这些心怀猛虎的年轻人，早就厌倦靠山寨货赚取薄利，他们渴望造出全球领先的产品，获得世界用户的尊重和追随。 媒体曾报道，在影石办公楼挂上自家招牌的那一天，刘靖康在朋友圈写道：小子，你来到这里，就要把这变成自己的地方。 刘靖康的豪言并非年轻人的呓语，他们知道，自己实际上站在某个历史性的临界点。 “你问什么时间点中国开始引领创新？就是你的能力已经越来越强，强到压不住的时候，临界点就到了。”毛汉勇说。 “硬件工程师的红利在外溢，软件工程师的红利在外溢，供应链的也在外溢。谁能找到市场机会，弄到合适的团队，就能做起来。”一位投资人分析，“现在可不是机会多一点，是机会多多了。” 这是中国硬件创业者的黄金时代。对于许高、刘靖康们而言，寻找“金羊毛”的冒险已经开始。 大疆，一种方法，一种榜样 哪怕在大厂云集的深圳，西丽街道仍然有独特的意义。 西丽和桃源、粤海街道串联，构成一条“独角兽走廊”。在这片狭长地带，有20家独角兽企业，总估值超700亿美元。 任何一位投资人都不愿意错过这条走廊，正如你不可能错过西丽街道最醒目的建筑——大疆的总部天空之城。 2017年，苹果剧院设计师诺曼·福斯特决定参与设计大疆全球总部。6年后，两栋接近200米的超高建筑拔地而起，面积超过两万平米。玻璃体建筑倒映天光，一条羽毛状的钢结构悬索桥连接东西塔，奇特而轻灵。 搬入新总部时，大疆的营收已经跨入300亿元，是当年创业板公司平均营收的十倍以上。 新一代的深圳的硬件创业公司大都绕不开大疆：它展示了硬件公司创业的另一种产品方法论，而“大疆系”创业者，又一次次将其验证。 在中国，以往硬件公司最便捷的路径是：以中国的供应链能力做平替。最有代表性的是一批电动牙刷企业，一旦押中爆款，两三年就能冲到数亿营收。 但大路很快变得拥挤。以电动牙刷为例，几乎没有门槛，差异更多在于营销技巧，很难建立起品牌堡垒。一旦更多入局者下场厮杀，行业增长迅即见顶。 而大疆代表另一种产品方法论：在一个细分赛道，做有技术门槛、客单价高的产品，不吝惜营销费用，在全球利基市场拿下统治地位。 但在大疆成立头十年，它的成功仍是孤例。 “大疆方法论有个问题，就是前期投入很高，且做大单品，市场看起来很小，是个浪漫主义的方式，所以有些投资人算不过来账。” 高速吹风机“物种起源”的创始人林源告诉36氪。他也是大疆的前员工。 不过，大疆播下的种子，还是萌动了。 “天空之城”动工那一年，大疆电池研发部的负责人王雷决定离职。他在大疆总部900米外成立了正浩创新，做当时还小众的便携储能电源，还挖来了老同事陈熙当CTO。 正浩很长一段时间一直亏损。直到2019年，正浩都没做出一个爆款。王雷只能反复读《三体》缓解焦虑，也做好了要坐十年冷板凳的心理准备。 但哪怕在这些时刻，正浩仍然没失去某种“大疆气质”。比如王雷坚持要开发双向逆变技术，因为他认定理论上是可行的，哪怕研发新同事直接断言“不可能”。没有爆款，正浩该花的钱还是要花，坚持投放媒体广告，坚持将产品铺到线下渠道。 2019年，正浩发布了一款重要产品DELTA 1300。王雷对技术的执著最终在产品力上得到回报：其他产品自充都在8小时以上，DELTA 1300只要1.6小时。 靠这一个爆款，2020年正浩扭亏为盈，收入翻了十倍以上。2023年，乘上欧洲能源危机风口，正浩市占率超过老牌公司华宝新能，成为全球第一，公司的估值也来到10亿美元——这是迈入独角兽的门槛。 正浩翻盘那一年，王雷的老同事陶冶离开大疆。他是大疆消费级无人机事业部负责人，已经36岁了，在公司内部位置不低。决定创业时，陶冶告诉来劝说的同事：“这是我这辈子最后一次做大事的机会，我能感觉到我的青春正在逐渐离我而去，所以我要赌这个。” 陶冶选择了3D打印这个当时看起来不太性感赛道，成立了拓竹科技。 拓竹的爆款产品Bambu Lab X1也经历了研发期漫长的煎熬，但一上市就击爆了现有产品：当市面上产品还在单色打印时，拓竹可以同时实现16色打印，打印时间相比同类产品少70%。 Bambu Lab X1众筹就达到700万美元，打破了众筹平台有史以来的记录。对于一台售价数倍于同类产品的机器来说，算得上一道奇观。 只用了4年，拓竹营收就从0做到50亿元。在很长一段时间中，除了令人惊叹的增长，拓竹没有什么大事发生。用一个投资人的话说，“只是单纯地赢。” 当正浩、拓竹相继成为现象级公司后，投资者开始相信，大疆的产品方法论也许有着更好的风险报酬比，哪怕它代表的“饱和投入”策略会让一家初创公司的CFO心惊肉跳。 以大疆风格鲜明的拓竹为例，它创立初期，就和其他硬件创业公司打法明显不同。“别人招一个人，拓竹招十个人，把所有的机会都探索一遍，挑最好的开花结果。”一位3D打印机行业人士解释。 这些人力最终会扑在几款产品上并行开发，“别的公司三五个人做个项目，拓竹可能一两百人做一款产品。我们拿两把狙击枪放子弹，人家端的冲锋枪。”上述同行表示。 而且拓竹和对手的另一个核心差异在于 ：它不做通板组装货，而是承袭大疆对供应链的全程把控。 攒一台3D打印机不算复杂。硬件层面，Klipper这样的开源3D打印固件问世多年。至于生产，创想三维、智能派这类大卖打磨多年后，珠三角供应链早已成熟，150元就能买到驱动电机，最基础的芯片不到十块钱。 和拓竹同期，不止一家公司在做类似的高速打印机，通常做法是由工厂买料代工。但根据上述业内人士介绍，拓竹直接在代工厂租下一块区域，自己招聘工人和厂长，自己采购材料。据说他们还换了门锁，派专人看管大门。“工厂老板都不能进去，工人进入都要录指纹的。” 这是典型的大疆式管理。在大疆，关键零部件“小到几分钱都是自己采购的。”一位大疆前员工告诉我们。 在正浩和拓竹身上，都有对生产和产品细节近乎苛刻的把控。拓竹的“门中门”管理，很容易让人联想到汪韬的一个故事：他会告诉员工，要用几个指头拧到什么样的感觉时，螺丝松紧度才是对的。 拓竹、正浩短时间估值蹿升，无疑是大疆方法论的完胜。以至于最近两三年，大疆的员工成了资方争抢的对象，尤其类似陶冶这样负责过核心产品供应链、市场、研发的“大产品经理”，哪怕还没做出产品雏形，就有投资人排队等着给钱。 “这就是榜样的力量。”林源总结道。 “再过几十年，回望中国科技企业史，会发现大疆是一个分水岭”，参与大疆投资的香港科技大学教授高秉强说，因为大疆最早证明了“中国的年轻人可以做出世界级的产品，和科技超前的公司。” （36氪制图） 全球品牌，全球视野，全球创新 公元前50年，恺撒在一次决定性的战争后，给元老院发出一份只有三个单词的捷报：我来，我见，我征服。 从某种意义上看，这一批硬件创业者面对全球市场有着同样的眼界和雄心。 2012年，大疆投资人李泽湘问红杉资本全球合伙人莫里茨：“要做国际品牌应该从哪里切入？”——当时国内投资人都把大疆产品当玩具，但莫里茨却赞誉有加——他建议：美国，美国硅谷，美国硅谷高科技公司的“头儿”。 他们通过微软前全球副总裁沈向洋，把样品给到了比尔盖茨，又通过莫里茨送给其他硅谷科技大佬。从来不用苹果产品的比尔盖茨为了体验，不得不破例用了iPhone（或iPad），因为当时大疆只支持iOS。 大佬背书无疑是一次顶级的营销。这样的方式对上一代许多草根出身，几乎不会英语的老板们来说，太过陌生和奇特。 从2001年加入WTO后，中国很快出现了一批全球经营的企业。代表性的联想、华为、TCL在世纪之初就已经在海外派驻了很多员工。 然而，早期中国硬件公司在全球市场中很难建立起品牌影响，只能靠收购打开市场。2004年的冬天，联想用30亿美元收购百亿美元IBM PC业务的并购案，仍是全球商业史上浓墨重彩的一笔。此后海尔、TCL陆续斥巨资，收购了不少海外老牌公司。 很多时候，中企虽然是花钱的主，却比卖方身段还柔软。2010年吉利收购沃尔沃时，李书福半开玩笑地形容那次交易：“如同一个农村来的穷小子追求一个世界顶级的明星。” 但最近十来年诞生的许多硬件创业公司，却表现出全然不同的姿态。 这一批80、90后创业者，大多出生于中产家庭，受过良好的教育，“见过好东西”，不少人在香港或欧美拿学位，伴随全球化浪潮起伏成长。 刘靖康在2014年Google Cardboard发布后，就能从海外淘一副试玩。他反复讲述的人生格言“You Only Live Once”（你只活一次），在欧美年轻人中同样流行。大疆更是在十年前就开始启用外籍高管——这在当时的中国公司中极其罕见。 “这一代创业者，有全球化的格局和眼界。而且基本都是高学历、高认知，做的都不是传统生意，基本都会偏科技创新。”运动健康硬件AEKE的联合创始人Loong如此分析。 这种选择其实也是市场倒逼的结果。当这代人开始创业时，传统大品类已经饱和。早在2018年，中国就能给全球供应18亿部手机、3亿台计算机、2亿台彩电。中国制造的这三大类产品，占全球总产量的90%、90%和70%以上。 “大家显而易见先做钱很大的事情。主干道一定要雍塞不动的时候，才会去看有没有小路和旁边的小路去走。”毛汉勇解释。 以3D打印机行业为例，某家老牌头部公司很长一段时间没有品牌部门，年终奖拿最多的是做亚马逊渠道和管生产的负责人。创始人学历不高，和技术团队开会时提不出太多想法，很多时候只能保持沉默。 但这个创始人有胆量、能吃苦，公司背靠庞大的供应链一年做到10多亿营收，拿到上亿的利润。 但陶冶2020年创业时，不可能再复刻这样的路径。即便在消费级3D打印机这样看似小众的硬件赛道，中国每年产量也能达到近400万台，占全球九成以上。 拓竹最后拿出领先于对手两代的产品，才得以杀出重围。陶冶本人据说在海外和用户同吃同住了几个月。 “最早的时候供应链能做什么东西出来，就往外卖什么东西。”毛汉勇表示，但“最近五、六年，大家开始了解海外有什么需求，再去做出来。 中国企业家开始真正看世界，而不是看自己。 ” 新一代创业者勇于进入自己并不熟悉的场景，开创全新的品类。比如庭院机器人。 一个泳池公司创始人，此前没什么出国经历，家里也没有泳池。他和合伙人花了近半年，到美国考察了上百家独栋别墅，有时还得伪装成买家进入后院。 摸清需求后，他们很快推出了定价上千美元的泳池机器人。有用户告诉他们，自己两套房子的泳池各配了一台，花了近5000美元。 探索外部世界的回报也是可观的：公司成立两年营收数亿。 类似的故事也发生在割草机器人行业。大疆前高管魏基栋创立的库犸动力，割草机器人定价比老牌割草机器人厂商富世华、嘉丁拿等高出三分之一以上。多位投资人告诉36氪，库犸动力目前营收或已超过20亿元。 这正体现出中国硬件初创公司出海的代际差异：第一代出海靠B端大订单，不用研究用户，没有品牌露出；第二代靠亚马逊等跨境电商，有用户和产品研究、有品牌露出，但是更适合卖通用品；第三代先走全球众筹平台Kickstarter、Indiegogo等做验证，讲求测试全球用户的反馈，产品要有新颖的亮点。 全球视野，以及技术创新，成为这一代硬件创业的关键词。 一个典型的案例是xTool，它靠着小众的激光雕刻机，营收已经突破20亿。 xTool的创始人王建军2014年做教育机器人时，就在Kickstarter上靠单品拿过百万美元众筹。此后每一款新品，几乎都会先到Kickstarter验证。 2021年，王建军成立了新品牌xTool，做中国人很少接触的激光雕刻机。当时公司副总裁都看不懂这个产品，“觉得很难实现，甚至很难成功”。 激光雕刻机的众筹成绩出乎所有人预料。该年其激光切割雕刻机众筹超过260万美元，在所有科技类目众筹中排名第七。接下来几年，xTool的营收几乎每年都在翻倍增长。 如果分析xTool的用户群，它的成功又不太突兀。Kickstarter汇聚了欧美最先锋、视野最开阔的一群人，他们乐于为有创意的硬核产品支付溢价。 而新一批中国公司，越来越善于击中欧美用户的七寸。 十年前，王建军在众筹时，百万美元就称得上是个里程碑式的成果。到2025年中，安克旗下子品牌eufyMake一款消费级UV打印机，众筹了超4000万美元。 2014年到2024年间，Kickstarter上来自大中华区的项目众筹总金额翻了20多倍。 （36氪制图） 至此，硬件创业公司开始形成一条发布创新产品的轨迹：拿一笔天使轮融资-研发样品-到Kickstarter或Indiegogo上众筹验证-改进并扩大产量。如果顺利交付第一批货，雪球就能顺利滚动下去。 纵观全球市场，一把卖价60元的筋膜枪和用最好材料、供货价500元的筋膜枪都有自己生存的空间。 但即使是靠性价比横扫市场的那些老板，也都能感受到海外市场对中国廉价商品日益增长的敌意。他们清楚，“60元筋膜枪”的生意，将越来越难做。 “大家都在转型。但是彼此基因和认知很不一样。”林源告诉我们， “一个时代有一个时代的企业家。” 华米OV能量外溢，中国供应链中万物生长 一个不争的事实是，如果不是背靠中国供应链，不会有大疆、影石这样的明星公司诞生。 2025年，一名硬件创业者，如果站在华强北商圈中心，方圆1公里之内，可以从1350家公司中找设计，3200家公司里找研发。小样测试有1260个选择，3480个供应商能做量产。 如华强北博物馆蓝色展板上所写：“上午设计、下午打样、次日量产、一周出海”。 这种速度实际上是深圳十来年的常态。2015年，如果你到深圳创业，两天就能在这里找到400种手机零部件，在美国硅谷，至少需要两个月。 在这个信奉嗅觉、胆量和取巧的新兴城市，头脑灵活的人到华强北三尺档口采购点半散装件、运到非洲组装成山寨机和电脑，卖给当地政府，就能赚上一大桶金。 “（那时）大家都只是做东西，没有很强烈的品牌观念。”硬件公司蚯比创始人Kooon对我们回忆。 有意思的是，就在“山寨帝国”华强北22公里外，龙华富士康每天向全球输送几十万部iPhone手机。苹果公司以要求严苛著称，iPhone铝合金边框及后盖仅允许0.02毫米以内的划伤——这比正常人一根头发丝还细。 这实际上是中国供应链强大力量的一体两面。中国有最顶尖硬件供应链，但普通创业者能触达的，只有廉价粗糙的那一面。 直到一段“手机传奇”诞生，供应链的界限被打破，万物生长的时代来临。 2010年，雷军创办“小米”，想做出“全球最好的手机，只卖一半的价钱。”次年，小米一代上市，由富士康和英华达代工，用上当时旗舰机的配置，售价1999元，最终卖掉近800万部。 同一年，低调的东莞公司OPPO、vivo各自推出智能机，还在做运营商业务的华为，也准备发力智能手机。 短短5年后，中国公司在全球智能机出货量前六中拿下四席，仅次于苹果和三星。 这是中国制造神话第一次出圈。 智能手机是最精细复杂的消费电子产品。巨量出货的背后，是中国供应链的快速迭代和膨胀能力。 “中国供应链发展这么好，有一个原因就是手机供应链能力的外溢。手机形成的整个产业链，外溢到了其他智能硬件那里。”Kooon说。 所谓“外溢”，是因为手机产量太庞大，只要手机行业开始下单，任何一个零部件的价格就会在短时间直线下降。 2018年，还在北京做方案商的创业者高望书关注到，小米推出了第一款支持双频GPS定位的手机小米8。 这成为他后来做智能割草机器人的起点。“在这之前，双频的GPS芯片是一个非常小众、高端、高价的专用芯片，它不太适合民用。”他对36氪回忆道。 2022年，当他南下深圳创业时，全套芯片组合已经降到300多元。除了双频芯片，曾经旗舰机才有幸用上的NPU芯片，经过手机到平板、机顶盒的大量应用，价格已经低到“烂大街”的地步。 所以，中国公司能批量推出一种欧美人从未见过的产物：无边界智能割草机器人。 从电脑、家电，到智能手机、智能汽车……中国供应链被喂养成一头巨兽之后，降维攻击成为了诸多产业的常态。 比如，不到5年，以徕芬为首的国产“平替”吹风机，就把戴森市占率从36%打到7%。林源告诉我们，2017年他创业时，定制高速马达要几百块。经过企业和供应链一起打磨，到2025年，高速马达价格就降到十分之一，良率超过95%。 “中国供应商变得越来越优秀。他们高质量、低价格的零部件催生了新的、本土的、极具侵略性的竞争对手。”美国记者费晓闻20多年前已经如此描述。 中国供应商似乎被一种无法遏制的力量驱使，永远在为自己的产能寻找新客户。 费晓闻时代，产品洪流涌向中国消费欲望旺盛的城市人口。2015年开始，极具性价比的“Made in China”商品，通过跨境电商平台开始涌入欧美家庭。 那是草根创业者赚快钱的美好时刻，根本不需要关注所谓的品牌，供应链老板们也不太会在一些“小而美”的公司身上花费时间。 然而大路货的潮水很快褪去了，传统外贸卖家的钱越来越难赚。供应链老板不得不开始重视起过去忽视的小客户。它们或许会才是产能的下一个出口。 毕竟，在珠三角闯荡几十年，老板们除了大进大出赚钱，也不时见证很多“从1到N”的传奇。比如一家做电源的老工厂，一年卖个几十万台，因为一家3D打印机创业公司下单，产能直接翻倍；或者松山湖Xbotpark创业基地几个大学生做出点新东西，突然有一天单量开始暴涨，代工厂随之从小厂长成中厂甚至大厂。 以影石供应商弘景光电为例，这家在广东中山的公司2015年，就见到还没成立公司的刘靖康。 弘景光电的创始人赵治平是行业老人，在舜宇做过总经理，而刘靖康还在南京大学读大四。2016年，影石第一款产品Nano发布后，弘景光电决定押注这家公司。 影石这样的新一代公司，让合作的供应链们获得了丰厚的回报。2021年，弘景光电前五大客户销售金额为1.2亿元。2022年时，影石一家就下了1.4亿元订单，弘景光电营收直接翻倍。到2023年，弘景光电营收已经超过7亿，影石作为第一大客户，贡献近一半的营收。 而且，弘景光电的扣非后净利率在2024年达到15%，这在供应链企业中是了不起的高利润。相较之下，以手机光学器件业务为主的舜宇光学净利率只有7.3%。 2025年3月，弘景光电在创业板上市，比影石还早3个月。从营收刚破亿的小厂到上市公司，弘景光电只用了3年。 影石另一个供应商能率，在接触影石创新前，客户都是欧美和日本的头部品牌。他们至今还记得，2017年影石第一代全景相机ONE X上市后，不到一年月销量翻了近3倍，厂里模具都不够用了。 （图说：影石供应商的利润率不逊于苹果供应链公司） 过去20多年，生产过全球顶级品牌产品的中国工厂，最不缺少制造实力。全球30%小家电都在慈溪这个不到200万人的县级市生产，全球16%的大家电在广东佛山生产。 “中国工厂特别擅长的事情，就是你给本手册，越具体越好，厚到100页都行。他们能按照你的手册百分之百完成。” 跃然创新创始人李勇告诉我们。 而与十年前相比，中国供应链的能力已经向上突破到更远。长期被韩国厂商把持的OLED屏幕，中国公司只用了5年，就把市场份额从3%做到45%。深圳汇顶科技发明了屏下光学指纹传感器，成为全球安卓机的标配。 中国供应链在全球市场拥有更多的关键元器件定价权后，开始渴求真正的“新”公司出现：更有想象力、更有质感的公司，这些新人的产品将卖出过去中国公司难以想象的价格，并且畅销全球。 但要完成这样的征途，显然很难靠一腔孤勇。年轻人需要更有力量的支持者。 为梦想买单的人 2025年夏天，AI玩具公司跃然创新（英文名Haivivi）完成累计近3亿元融资，破了行业记录。但两年前这家公司差点破产倒闭。 2023年，Haivivi濒临绝境。李勇在北京已经融不到任何钱，公司欠了几百万，社保断缴一年。最感无力的时刻，他打算给估值打个对折，拿些钱清算关门。 最终李勇还是心有不甘，融资中介告诉他，有个香港教授正好在找AI硬件项目，他决定再南下碰碰运气。 李勇飞去深圳，见到一个叫高秉强的天使投资人。 不久后李勇会知道，高秉强是深圳创投圈无人不知的伯乐。他和李泽湘、甘洁同为港科大教授，共同创立了松山湖XbotPark基地，有很多知名的投资案例，包括大疆和上市公司固高科技。 见面时，李勇只看到办公室里坐着一个笑咪咪的老人，和想象中严厉古板的教授不太一样。“高老师有各种天马行空的想法，特别幽默。”李勇告诉36氪。后来，李勇看到高秉强微信介绍是一句粤语：“最紧要好玩”，意思是“好玩最重要”。 李勇和教授聊了一个小时，高秉强“情绪特别饱满”，说得比李勇他们还多。 李勇心头稳了，估摸总能拿到百八十万人民币投资，没想到高秉强一口给了100万美元。他告诉李勇：“你们自己准备一个协议给我签吧。”——没有被尽调、没有来回审核，钱一个月内就打到了账上。 李勇接触过不少投资人，碰过很多壁，还是第一次这样爽快地拿到了钱。“高老师真的是‘天使’投资人。”李勇对我们感慨， “或许世界上真有这样的人，不缺钱，就是有情怀。” 两年后，Haivivi已经成了投资人口中“融资挺顺利”的一家公司。李勇依然难忘绝处逢生的那一天，“我们特别感激高老师，没他公司就死了。” 在十年前，对于硬件初创公司来说，遇见高秉强这样“贵人”的机会，实际上并不多。 投资人普遍认为， 投硬件和买彩票没什么区别。“赌性很强，因为它的不确定性很高。”一位投资人表示。 十年前，一位看硬件赛道的投资人带着自己看好的项目上内部投决会，但是合伙人一句话就否决了他辛苦找来的项目：做硬件成本高，失败率高，回报低，为什么不把钱投给互联网？这话也没错，当时正是移动互联网高速成长的节点。 很长一段时间中，愿意投资硬件初创公司的，只有极小一撮“理想主义人士”。 2014年，香港科技大学教授李泽湘北上，联合高秉强、甘洁，在东莞松山湖发起了XbotPark基地。 李泽湘身上有些朴素的家国情怀，在他眼里，靠模仿、抄袭的产品之路很快会走入死局。他想推行“新工科教育”，找到一群“能用科技创造新东西的人”，并帮助这些年轻人在世界分工体系中，赚取头部利润。 松山湖Xbotpark基地走创业孵化器路线，他们初期投资金额一般几百万，金额不算高，但足以支撑一家公司做出原型机，不至于被扼杀在初生期。除了大疆，后来成为投资人追逐对象的云鲸、Liberlive、松灵机器人、逸动科技，都是在松山湖Xbotpark拿到早期投资。 “李老师还是比较相信梦想。”一位投资人评价。 在基地当时尚未装修的厂房里，云鲸是第一批孵化的项目。 初生的云鲸差点没活下来。 成立早期，云鲸融资很不顺利，张峻彬创业时26岁，学生气未退。有投资人记得当时张峻彬常常“被疯狂diss，觉得你就是个小孩、书生，懂什么供应链。”似乎所有人都在问张峻彬：“你知道现在石头有多牛吗？你知道科沃斯有多大吗？” 云鲸做第一次对外融资时，资方一定要对赌。李泽湘曾对媒体回忆，最后是他和几个老师掏钱领投，“顶了他一轮。” 2019年，云鲸推出初代扫拖机器人J1，当年销售额就破了2000万。从它之后，“可自动洗拖布”这个功能逐渐成为扫地机器人的标配。 云鲸很快成了普通基金“高攀不起”的独角兽。2020年开始，云鲸在5年中完成8轮融资，名单里不乏南山新战投、腾讯、字节等头部基金，最新估值已经突破百亿。 此时，互联网红利已经消失，而新一代硬件公司一次又一次证明了赚大钱的能力，投资市场的偏好开始转向。 但硬件投资市场，很长一段时间一直有种“错配”：很容易从早期“看不懂”，到产品火了之后“投不进”。 以一位做机器人的创始人为例。他很早就开始创业，但业务一直没有爆发，最苦的时候，创业早期的兄弟都走了大半。那几年，他受了投资人不少冷眼。 这个创始人靠自己死扛，熬出了一个大爆款。公司只用了两三年，就冲到细分领域头部。现在投资人去搭话，他会回复：“滚蛋”。 同样的故事还发生在Plaud身上。许高拿出第一代产品时，因为“智能”体验提升不大，一级市场对Plaud反应普遍冷淡。“就觉得他就是一个硬件，也没什么特色。”一位投资人告诉我们。 2023年夏天Plaud爆火后，它的大门几乎没有为国内投资人打开过。有投资人告诉我们，有不少机构找上门想参股，最后连许高的面都没见到。它唯一一次公开可见的融资，来自一家日本背景的硅谷基金Carbide Ventures。 一次又一次，新一代硬件公司用真实的业绩，推翻了此前投资市场对硬件公司的成见。5年前上市的安克创新市值突破700亿元，掀起第一波热潮。今年影石创新上市后股价狂飙、市值目前已超1200亿元，又把投资市场对硬件的追捧推上高峰。 过去看消费、看游戏的投资人，纷纷都看起硬件。一位原本关注半导体赛道的投资人，现在看起了AI眼镜。有投资人直言：“再不关注，就要掉队了。” 沉寂已久的市场开始躁动。某头部机构现在每个月上会15个早期项目，大多数是硬件产品。 “今年是硬件的小阳春，把整个市场都盘活了。” 一位投资人告诉36氪，“一部分资金在平衡配置回到亚洲，而中国最有特色，又能在海外看到销售成绩的就是消费硬件。” 曾经在互联网、消费行业才会出现的狂欢，现在终于发生在硬件赛道。“好项目都是挤破头进去。”一位投资人告诉36氪。一家创始人背景不错的割草机器人项目半年融了三轮，累计上亿，最近的一轮份额根本不够分。 还有一家头部硬件公司没有大范围路演，架不住很多机构听到消息找上门。老股东能优先认购，很多腰部机构连创始人面都没见上。 这种繁荣背后是一段艰辛的岁月。在过去十年，没有李泽湘、高秉强这样的投资人，很多明星公司早已夭折。他们给予硬件创业者最宝贵的，就是试错的机会。 “就像走夜路，你一个人会很害怕，两三个人或三五个人一起，然后再给你一个手电筒，一个打狗棍，你就不害怕了。”李泽湘曾经这样说。而现在，走硬件创业这条路的队伍正快速壮大。 当新一代创业者克服了恐惧，更自在地服从内心愿力的驱使，他们面前会展开无比广阔的世界。 八十多年前，在战后废墟中创立的索尼，尚未拿下日本市场，却已放眼海外。当时创始人盛田昭夫也表达过相似的愿景： “外国人的固有观念是日本制造=粗制滥造，我们则一心想改变这种现状。”他始终坚信一点：模仿只会造就二流地位与二流利润。 盛田昭夫的坚信造就了一家年销售收入十三万亿日元（约合6332亿元），营业利润达一万四千亿日元（约合人民币676亿元）的全球巨头。 八十年后，大疆创始人汪滔在朋友圈写道：“文化、价值观、产品的二等公民，我做腻了，期待我们的产品也可以早日让美利坚五体投地。” 这种信念跨越了时间和国界，如今在中国年轻一代企业家身上重现。 他们也有了让自己理想生长的土壤。强大的供应链、一群仍有情怀的投资人，以及丰沛的全球市场，足以筑造出一个宽广的新舞台。 中国硬件如猛虎下山，势不可挡。 参考资料： [1]《大疆汪滔：世界笨得不可思议》，中国企业家 [2]《对话正浩EcoFlow 王雷：创新的信仰要靠一层层追问》，极客公园 [3]《Who Builds the World’s Most Popular Drones?》，华尔街日报 [4]《Chinese Drone Maker DJI in Talks to Raise Funding at Valuation of $10 Billion》，华尔街日报 [5]《The World’s Top 10 Most Innovative Companies Of 2015 In Consumer Electronics》，快公司 [6]《海龟博士从大疆离职创业，风投排队塞钱》，品牌工厂 [7]《对话李泽湘：孵化大疆、云鲸后，怎么培养更多科技创始人》，晚点LatePost [8]《Plaud 创始人访谈：AI录音硬件，全球超20万用户，如何做到的？》，九谦资本 [9]《Plaud AI CEO 许高：全球出货近70万台设备背后，Plaud 想用AI重塑对话价值链》，有新Newin [10]《影石十年：走进那片硬件的迷雾森林》，饭统戴老板 [11]《揭秘李泽湘：一个工科教授和他的最佳位置》，36氪 [12]《影石敲钟，与刘靖康复盘创业十年》，卫诗婕商业漫谈 [13]《这个90后破解周鸿祎手机号走红，借15万创业一年两登福布斯》，南方都市报 [14]《拓竹凶猛》，雷锋网 [15]《80后徽商出海，从年亏千万到营收几十亿》，品牌工厂 36kr 36kr 36kr 36kr 本文由「 袁斯来 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： Unsplash +1 468 好文章，需要你的鼓励 袁斯来 资深作者 188 收 藏 +1 8 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.255 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 月薪3000的职校生，正在「干掉」北影导演 2026医疗展望：百家公司港股排队，医疗板块能否再创「神话」 千问的1000万杯奶茶：阿里大发赛博鸡蛋始末 狂飙的中国IP，掏空全球年轻人钱包丨36氪年度回眸 智谱、MiniMax港股IPO，熬过孤独的人和500亿奖赏 | 深氪lite Manus数十亿美元卖身，中国AI应用的关键词只有一个｜深氪 我的男友是虚拟的，但他很快就会变成现实｜深氪 七天挣百万，短剧演员的改命之路｜深氪lite 第一批喜茶加盟商，迎来史上最艰难的一年｜深氪 袁斯来 资深作者 yuansl_306 ，注明