          text: '欣旺达装车特斯拉，供应全球车型｜36氪独家-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 欣旺达装车特斯拉，供应全球车型｜36氪独家 大福星 · 2026年04月09日 21:02 特斯拉寻求降本。 特斯拉在中国的供应链布局还在扩大。 36氪汽车从多位产业人士处获悉，欣旺达旗下专注动力电池业务的子公司——欣旺达动力，已进入特斯拉全球供应链，成为特斯拉全球第五家动力电池供应商。 接触到项目的产业链人士透露，这款电池已从欣旺达浙江义乌工厂出货，搭载在特斯拉上海工厂销往海外的车型上，“已经出货有一阵子了。” 至于这款电池何时搭载于国内车型，目前还无定论。“通常来说，特斯拉上新的零部件，会有小一年的观察期。”有电池行业人士向36氪分析，但是不排除其他决策因素。 一直以来，特斯都在寻找宁德时代之外的第二家中国动力电池供应商，以探索降本空间。比亚迪曾向特斯拉欧洲工厂出货，但此后未有明确进展。欣旺达是在此之后，特斯拉在中国寻求的另一个主力动力电池供应商。 据36氪了解，此次特斯拉和欣旺达的动力电池合作，也采用了新的模式，直接向欣旺达采购电芯，由特斯拉自制模组、PACK（电池包）。相较于此前从宁德时代手中采购模组，这也是特斯拉在方形电池上的新尝试。 此前，特斯拉全球已有宁德时代、松下电池、LG新能源、比亚迪等动力电池供应商，引入欣旺达，意味着特斯拉全球动力电池供应链进一步多元化，体现了特斯拉迫切的降本需求。 特斯拉全球引入欣旺达，试水超快充 尽管动力电池技术已相对成熟，其原材料成本也趋于平缓，但动力电池的采购成本，但仍占整车成本超过30%。因而任何一家车企想要降本时，都会率先向电池开刀。特斯拉亦是如此。 今年1月份，特斯拉公布了2025年全年财报。其中，汽车业务的各项财务数据仍在走低。 2025年，特斯拉新车交付量连续两年同比下滑，全年总交付量为163.6万辆；汽车业务营收695.26 亿美元，同比下降 10%；剔除碳积分后，汽车毛利率仅15.4%，较2021年27%的高点下降近四成。因此，尽管特斯拉储能业务颇有起色，特斯拉2025年营收仍同比下降3%至948.3 亿美元，归母净利润同比下降 26.4%至58.6亿美元。 靠着Optimus人形机器人、Robotaxi、xAI等对于未来AI世界的宏大构想，特斯拉市值仍维持在万亿美元。但这些业务似乎难以在短期内变现，相反，它们还需要特斯拉及资本的长期输血。 也就是说，汽车业务在今后相当一段时间内，仍是这家企业的主要收入来源。由此，如何在供应链、尤其是电池处获取更高议价权，以推高毛利和净利润，是特斯拉汽车眼下必须回答的问题。 长期以来，特斯拉的电池供应，主要依赖宁德时代、松下、LG新能源。宁德时代为特斯拉供应磷酸铁锂电池模组，适配入门级及中端车型；松下、LG新能源聚焦高端三元锂电池，支撑特斯拉高性能车型需求。 而其中，宁德时代素来秉持高毛利策略，降价力度自然有限。 特斯拉全球的另外两家电池供应商，松下和LG新能源，它们供应的三元锂电池，其成本天然高于磷酸铁锂电池，加之松下电池毛利率近年仅徘徊在5%左右，因此特斯拉汽车似乎也很难在这两家供应商处，争取到更多的毛利。 而以欣旺达为代表的国内二三线动力电池厂商，拿下定点的主要战略正是“便宜又大碗”——提供有竞争力的价格，却用更新的材料。 有知情人士告诉36氪，欣旺达给特斯拉供应的动力电芯采用了第三代磷酸铁锂等材料，支持充电倍率提升到3C。 3C乃至5C等超快充技术，是中国市场正在普遍推行的补能方案，也是行业认为的趋势之一，特斯拉似乎也有意试水，而欣旺达提供的产品正命中了这一点。 此外，特斯拉仅向欣旺达采购电芯，模组和PACK的定价权与定制权，皆掌握在特斯拉手中。这也有利于特斯拉对电池成本进行更深入管控。 而从特斯拉的全球布局上看，身位二线厂的欣旺达，配合度也会更高。据公开信息显示，特斯拉正在建设墨西哥工厂，规划的年产能为百万级。 这些工厂要想顺利投产，离不开整车上的每个零部件，而让供应商一同出海建厂，是更经济的选择。 但头部电池厂密切跟随特斯拉步伐的制约因素通常较多。例如，松下早在特斯拉上海工厂动工时，就拒绝与之一起在上海建厂。 相较之下，只要给够订单，欣旺达这样二线动力电池厂商，更有动力与主机厂一起远渡重洋。 欣旺达，用性价比和服务撬动客户 根据欣旺达今年1月底向港股提交的新版招股书，截至去年三季度末，这家企业超50%的营收仍由消费电池业务贡献，动力电池业务的亏损也同步收窄，至10亿元级别。 进入特斯拉动力电池供应链，于欣旺达而言，意味着得到了一个极好的突围机会。 在极强调规模的汽车制造业，规模在某种意义上等于盈利能力。而眼下国内动力电池产业的格局是，宁德时代动力电池出货量长期占据约一半的市场份额；弗迪电池，凭借母公司比亚迪每年数百万的新车销量，其装车量也长年居于高位。 除这两家企业之外，中创新航、国轩高科、欣旺达等一众二三线动力电池厂商的装机量差距较小，因此某款明星车型的订单，往往就是它们出货量、市场份额向上跃迁的契机。 特斯拉的新车交付量，尽管连续两年同比下滑，但一年仍有约200万辆的规模。因而特斯拉这个客户，在某种程度上，是欣旺达动力电池业务的一个重要转折点。 何况，在可量化的营收、净利润等业绩指标之外，进入特斯拉供应链，无疑将使欣旺达得到一份较有说服力的产品力背书。 而特斯拉也不是欣旺达撬动的第一个重磅客户。 在特斯拉之前，欣旺达已和头部新势力理想成立合资公司，今年理想自研、欣旺达代工的“理想牌”电池即将装车；搭载欣旺达电池的小米新车也将在今年发布。 打动这些车企的，一方面是欣旺达产品的性价比；另一方面，欣旺达的低姿态，也使主机厂乐于与之合作。 有行业人士告诉36氪，欣旺达曾专门组建了个30-50人的团队，就驻扎上海金桥的小米汽车办公室旁边，等着随时响应客户的需求。 在欣旺达和理想的合作中，电芯开发、电池设计等核心环节皆由理想把控，欣旺达更多的是扮演代工厂的角色。 在汽车行业竞争日趋白热化的今天，车企更迫切地想拧干毛巾里的最后一滴水，这令一众二三线动力电池厂商，看到了从龙头企业口中撬动客户的希望。而欣旺达无疑是在这方面取得了较为明显进展的企业。 作者微信：luckg17305264638 本文由「 大福星 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 企业授权 +1 96 好文章，需要你的鼓励 新锐作者 24 收 藏 +1 2 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.278 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 智界要打翻盘仗：V9给了年均12万辆指引｜36氪独家 字节跳动2025年海外营收占比创新高，AI投入致公司净利大降70%｜独家 自变量机器人完成近20亿元B轮融资，小米战投、红杉中国领投丨智能涌现独家 小米汽车重磅任命：胡峥楠任CTO，宋钢任参谋长｜36氪独家 阿里电商 AI 新动向：围绕 Token 重构电商，组织迎来新一轮调整｜独家 轻舟、元戎秘交上市资料，和Momenta冲刺港股IPO | 36氪独家 抖音生活服务组织架构大调整，中小商家更重要了｜独家 36氪企业全情报：AI 舆情大数据，让投资决策快人一步 云鲸联创吴一昊Hower即将离职创业 | 硬氪独家 大福星 新锐作者 TA没有写简介，但内敛也是一种表达 发表文章 11 篇 最近内容 最前线｜华为猛士深化战略合作，新技术将逐步落地4款以上全新车型 3小时前 智界要打翻盘仗：V9给了年均12万辆指引｜36氪独家 2026-04-21 空悬企业时驾科技获头部车企MPV车型独家定点 | 早期项目 2026-04-20 阅读更多内容，狠戳这里 下一篇 重回千亿梯队的安信基金：营收连降三年，名将出走后谁撑大局？ 元老级高管卸任，百亿固收名将出走。 2026-04-09 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备1101050205732