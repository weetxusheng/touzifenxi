          text: 'Manus数十亿美元卖身，中国AI应用的关键词只有一个｜深氪-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 Manus数十亿美元卖身，中国AI应用的关键词只有一个｜深氪 阿菜cabbage · 2025年12月31日 09:00 “做AI产品已经到了一个i人必须e起来，e人必须‘骚起来’的阶段。” 只有一个 A轮 北京市 2015-12 专注于消费级文玩商品的聚合分发平台 36氪报道 消费电商 我要联系 文｜周鑫雨 编辑｜苏建勋 杨轩 把AI产品搞出海：i人e起来，e人骚起来 12月底的新加坡，30℃的空气里仍是潮热的味道。位于新加坡Funan商场旁的一家WeWork里，经常能遇到讲着中文的华人面孔。这里的工作环境和国内没什么不同，负一层能吃到不到5新币（不到30元）的吉野家和麻辣烫，4楼就有纯K。 AI明星公司Manus就在这里。这家由中国人创办的AI公司，迎来了历史性的一刻。 北京时间2025年12月30日，Manus的公司“蝴蝶效应”，被彭博社等媒体曝出，以超过20亿美元的价格，被Meta收购。收购完成后，蝴蝶效应将继续保持独立运作，创始人肖弘出任Meta副总裁。 据《智能涌现》了解， 肖弘将直接汇报给Meta COO Javier Olivan，在Meta内部主要负责部分商业化产品；在保留原有业务的同时，“蝴蝶效应”团队将负责为Meta内部开发Agent工具。 这笔收购的意义，不仅在于极短的时间周期、庞大的资金规模，还在于证明了中国AI应用，在全球舞台上拥有和巨头议价的可能——成立不到一年，Manus就获得了Meta历史上第三高的收购报价。 BAI资本合伙人汪天凡在即刻上直言：“大概率近期所有港股上市之后的投资人回报都不如这一笔现金收购。” 中国AI应用出海，至此有了一个辉煌的注脚。 这一年来，可以说，中国AI应用的关键词只有一个： 出海 。 深圳的一个秋天，300多个AI创业者挤在一间会议室，AI Coding公司“Trickle”的创始人徐明站在讲台上，分享怎么做出海增长。他的方法简单又直接： 1、海淘一本大佬的书，比如A16Z创始人Marc Andreessen的新作； 2、拍一张自己看书的照片上传X，配文“我创业做的产品Trickle，受到这本书的启发”； 3、@Andreessen本人。 接下来就是等待。帖子发布没一会儿，Andreessen就给他点了赞。随后，不少“吃瓜用户”涌入了Trickle网站。 △徐明近期用Trickle复刻了Andrej Karpathy（前特斯拉AI总监、OpenAI创始成员）的AI工具，在X上得到了AK本人的点赞。图源：受访者供图 “产品在海外冷启动最简单的办法，就是蹭海外大佬的流量，想办法和他套近乎。”徐明告诉观众，“这些事我干过好多次，大佬100%给你转发，100%给你点赞，流量就来了。” 当天，深圳罕见被三个台风接连席卷。但直到傍晚六点多沙龙结束，几乎无人提前退场。 “比我上学时都认真。”一名当天的参与者这样形容。 在这场由出海社区Linkloud组织的线下沙龙，一群AI应用的创业者，来学习如何出海，如何寻找PMF（产品市场适配度）。 2024年下半年，是AI应用创业者们集体受到感召的时间点。Claude 3.5 Sonnet、Gemini 2.0等一众推理、Agentic能力跃升的模型发布，让行业看到了AI从“玩具”真正变成生产力的可能。 在一次访谈中，Lovart创始人陈冕提到，Claude等模型能力的提升，让AI可以串联所有的工具和工作，并执行出来。 后来的事，大家也都知道了。基于Claude、Gemini等模型，陈冕做出了AI设计Agent Lovart，而这些高性能模型，也成为被“套壳”的对象，用到了Manus、Genspark、Youware等如今的AI明星应用上。 为了吃上全球最先进模型的技术红利、快速寻求商业化机会，扬帆前往欧美、日本等高付费能力、收并购生态成熟的市场，又成为AI应用创业者的共识。 Linkloud曾对参与者做过几组问卷调查：2025年初，对海外市场并不了解的参与者还有30%。等到9月的这次沙龙，比例已经降低到了5%，超过1/5的参与者，甚至在海外已经有了一定的收入。 当大量创业者站上AI全球化的潮头，竞争便会不可避免地加剧。 在平均每天都有大约1.3万家（数据源：美国人口普查局）企业申请成立的美国，曝光资源争夺之激烈可想而知。 如今是一家华人AI企业海外市场负责人的Eric，在美国待了近20年。一名从国内转去旧金山媒体的记者告诉他，在美国每天接到的pitch book（项目建议书），是国内的十倍有余。 想打入美国舆论场，中国企业要付出成倍的努力。参加一场湾区的科技展会之前，Eric“打了不少德扑和高尔夫”，花了几年的时间，和主办方交朋友。 “说白了，在美国做PR，你需要去‘舔’，去花时间了解美国本土媒体需要怎样的大新闻。”他总结。 出海竞争的焦虑，转化成了学习的动力。 △Linkloud深圳场活动现场。图源：Linkloud官方 在Linkloud深圳场沙龙的300多名参与者中，不乏估值上亿美元的明星团队。比如，在日本年入千万美金的AI会议转录产品Notta，前月之暗面产品负责人王冠创立的AI视频创作公司ONE2X。 活动结束前，Linkloud联合创始人钱觐开对全场AI创业者振臂一呼： “做AI产品已经到了一个i人必须e起来，e人必须‘骚起来’的阶段。” 台下笑声、掌声雷动。 三明治、DeepSeek、在硅谷到处加微信的华人CEO 今年，一个强共识已经在AI应用创业圈中形成： AI应用的未来是全球化；全球化的第一站，是硅谷。 在国内抱团学习后，中国创业者没有太多练兵的时间。他们要立刻坐上前往旧金山的飞机，加入最激烈的AI战场。 在硅谷近8年的Ying，是Manus Fellow（Manus的社区项目）和Lovart等AI项目的海外增长顾问。今年6月，在AGI House（硅谷7位AI创始人租下的别墅）举办的一场Hackathon上，Lovart创始人陈冕，主动邀请Ying出任增长顾问，“他需要一个熟悉硅谷生态、理解当地市场和用户的人”。 很快，Ying帮Lovart在硅谷策划了一场Launch Party。 中国AI应用想要吸引硅谷的目光，必须要有“Silicon Vibe”，一种追求品牌和个性的氛围。Ying特地将Lovart Launch Party的场地，选在了旧金山的一家设计工作室，参会者可以在天台上自由交流。 连餐食也是有讲究的。Ying选择了几口大小的三明治，不拉低活动格调，又方便食用。 △Lovart Launch Party。图源：受访者供图 在这一场Launch Party上，Ying认识了AI浏览器Fellou AI的创始人谢扬，后者在这场活动上，也结识了Lovart的创始人陈冕。 “来硅谷，得逼自己多认识一些人。”“i人”谢扬告诉Ying。 2025年以来，Ying强烈感受到，中国AI应用创业者在硅谷的存在感变强了。 在大大小小的硅谷科技活动上，Ying见到过Manus的联合创始人张涛、从清华辍学的00后创业者陈春宇、AI多模态公司AVAR的创始人胡雅婷。 硅谷对中国AI应用的脸色，也在2025年，有着180度转弯。 直到2025年之前，中国AI应用在硅谷，还是不入流的存在。“Copycat”，Eric听过不少硅谷科技圈从业者直白地称呼中国的AI产品，“也很好理解，当时中国的AI产品照搬的就两个：ChatGPT和Character.ai”。 直到DeepSeek和Manus的出现。 创新了模型训练架构的DeepSeek V3和R1，发布至今都没有掉出过模型API平台OpenReuter的调用量前10，还因其极低的训练成本，一度让英伟达的股价下跌17%。 至于Manus，Meta数十亿美金的收购价，是其在美国资本市场拥有姓名的最好证明。 半年来，Eric在硅谷见了不下百名美国投资人，十有八九都会主动提及DeepSeek和Manus。 后来，他感觉DeepSeek成了中国人在硅谷名利场上吸引目光的硬通货。在一个酒局上，他看到一名中国创业者对着一圈白人自我介绍：“我公司在北京，离DeepSeek办公室就3英里远。” 越来越多全球化的成功案例，在今年为中国AI应用打开了局面。 在美国著名风投机构A16Z每一季度评选的产品榜单上，2025年8月，移动端Top50的中国AI应用有22款——但一年半之前，同样榜单上的中国AI应用数量不到10个。 △A16Z“The Top 50 Gen AI Mobile Apps”2025年8月榜单，标红为华人团队开发的AI应用。图源：A16Z 太平洋两岸，中国AI应用创业者和全球市场正在双向奔赴。一名中国AI创业者告诉我们：“三年前被问出不出海，是个选择题。现在没人再问这个问题。” 全球游戏，中国卷法 想要在硅谷识别出从中国远赴而来的AI创业者，最简单的办法，就是找那些每天在各个展会、Party、闭门会、Hackathon上辗转的亚洲面孔。 Base在美国近10年的出海中介Neil，曾经一周连续在三场活动上见到同一个做AI教育的中国创业者。他随身带着一台iPad，用于随时给投资人展示BP。“太卷了，美国本地没那么卷的。”Neil评价。 2025年7月，在旧金山举办的科技大会VentureBeat Transform上，Eric见到了忙着发传单的景鲲（前百度集团副总裁、小度科技CEO，AI Agent公司MainFunc创始人兼CEO），以及数名旗下产品GenSpark的成员。 这张白底黑字印着“$36 Million ARR in 45 Days, 8 Products in 10 Weeks”的A4纸，铺满了一整场全是投资人和媒体的闭门会。 这种略带侵略性、炫耀感的营销方式，被Eric评价为和注重chill（松弛）的“Silicon Vibe”背道而驰。美国创业者私下爱聊的，往往不是商业，而是最近在健身房练了什么项目，或者某位圈内大佬的八卦。 他眼中的中国创业者，有绝对的好学生心态：“来了就必须认识点什么人、学到点什么方法论。” 但Eric也理解这一种紧绷。 面对一个完全陌生的市场，中国玩家想要同桌竞技，必须比欧美玩家卷得更狠，或者花功夫找到自己独特的生态位。 今年这一轮AI创业潮中，不少中国玩家都看得很清楚：不要在欧美玩家擅长的垂直领域硬碰硬。 无法深入产业链，那就卷通用场景，卷产品体验。 在美国，想要和本土玩家在B端同台竞技，无异于以卵击石。三年前，出海AI应用创业者刘宁替一家AI企业在美国开拓B端业务时，就认清了一个现实：中国人很难打入美国产业链——这不仅关乎资源，也关乎地域、文化造成的信任差距。 当时，刘宁带着10多人的销售、工程团队，登门拜访客户，“大厅都走不进去”。就算多次强调数据本地化部署，美国客户依然更愿意相信本土企业。最初一年里，刘宁几乎每天都在吃闭门羹。 但在ToB基因薄弱的另一面，中国产品化的深厚家底，成了征战全球的利器。 “过去20年，中国在移动互联网积累了大量的产品经理的能力，同时我们对技术又跟得很快。”在一场大会上，明势资本的创投合伙人黄明明提到，“这恰恰是中国创业者在全球无可比拟的优势和能力。” 其中一个为人乐道的例子，是文生图公司Fotor的发家史。2022年底，Fotor抓住文生图风口的同时，比Midjourney（当时只能在Discord上体验）更快上线了PC端工具。 人有我优的回报是可观的：几个月内，Fotor的用户规模翻了7倍，并实现了规模化盈利。 另一个典型的案例，则是用工程化能力，将“套壳”玩到极致的Manus。 2025年3月6日，哈希增长的联合创始人庞舜心试用完刚发布的Manus后，立刻推荐给了在X上拥有56万粉丝的美国科技KOL Rowan Cheuang，后者又在X上给出了极高的评价：“I think China''s second DeepSeek moment is here.” 随后，这条博文引爆了美国科技圈，一周内获得了近300万的转发量。 Manus “Less structure, more intelligence”的产品设计理念，也被不少中国AI应用创业者奉为圭臬。后来，Lovart创始人陈冕坦言，“让我们激进地去准备、觉得方向确定的时刻，还是在Manus火了之后”。 这也正是这一代中国AI应用公司的出海路径： 沿着“Manus们”全球化的成功路径，快速形成自己的方法论。 这些被验证的方法论，又在中国创业者聚集的各个线上群聊、线下沙龙被慷慨分享。 这种强劲的社群文化，Eric在硅谷创业者身上鲜少看到，“他们获得资源相对太容易了”。但中国AI创业者不同。面对天然具有资源优势的欧美玩家，大家需要 “用集体经验形成的优势，做全球化的竞争” 。 Linkloud的深圳场沙龙上，出现了几名香港AI创业者的身影。其中一名告诉我们，其他地方找不到内地这样丰富的创业者社区，“聚在一起都是自己人，大家会帮忙介绍资源、解决问题”。 类似的场景出现在了一个300多人的AI创业者交流群中。一名创业者提到自己产品的Stripe账号被封了，群友们立刻开始“摇人”。不到两分钟，Stripe的一名华人员工被拉进了群。 出海一年：狂飙的营收，失速的ARR 2025年以来，你很难不被中国AI应用的财富增长故事吸引注意力。 近乎夸张的金钱流速并不少见。据支付平台Stripe的统计，全球最顶尖的100家AI公司，实现500万美金的年化收入，平均只需要24个月，速度是顶尖SaaS公司的1.54倍。 其中最受瞩目的中国AI应用，有9个月实现1亿美金ARR的Manus，还有用9天把营收做到1000万美金的GenSpark——后来，他们实现3600万美金ARR，仅用了45天。 △最顶尖的100家AI公司和SaaS公司，实现500万美元年营收所用时间的中位数，图源：Stripe 加入AI应用创业团队后，Ying感觉自己的时间被加速了。身边的AI应用创业公司，在2、3个月内实现1000万美金ARR的不在少数。据她观察，移动互联网时代，一家创业公司达到1000万美金的ARR，一般要3-5年。 “AI应用，尤其是工具类，对生产效率的提升是立竿见影的。一旦付费后获得明显的回报，用户很容易形成强依赖，商业化的飞轮很容易转起来。”一名AI投资人告诉我们。 但繁荣背后，其实掺杂着不少水分。 ARR，Annual Recurring Revenue，年度经常性收入，用于衡量一年当中公司稳定的、可依赖的收入部分。AI投资人Ariel解释，ARR之前更常用于衡量SaaS业务的健康程度，因为SaaS的商业模式十分清晰，业务形态也更成熟。 但ARR是否能照搬到快速变化的AI领域，需要打个大问号。Ariel见过不少因为市场、技术变化，在一个季度内就频繁改变产品形态的AI公司，显然，“业务每次变化产生的营收，不是经常性的”。 这一现象，很快成为创投圈广为流传的梗： 大多数AI应用有revenue（营收），但不recurring（经常性）。 Ariel把如今AI应用的ARR，戏谑地称作“Vibe ARR（氛围感ARR）”。最近几次见创业者，她会直接告诉对方：“ARR这数，对外PR的时候说说就算了，别放在BP上。” 赚大钱的，是少数金字塔尖上的人。在美国近10年的出海中介Neil，见过不少败兴而归的中国AI创业者。其中不乏叫做“Manners”“GenSpeak”的山寨名牌，实则“只能当普通ChatBot用”。 但更多的人，不了解海外市场和创投生态，落地美国后不知从何入手，“交了来回机票钱的学费，啥都没得到”。 但AI应用行业，仍然无可救药地沉溺于ARR创造的营收神话。 极个别爆发性的营收数据，在社媒上吸引着流量，在一级市场吸引着金钱。很快，ARR被作为衡量成功的标尺，创业者们不得不面临“X个月，实现从0到1000万美金ARR”的叙事、融资压力。 The Information的一篇报道中，曾提到了不少计算ARR的离谱真实案例： 将某一天的收入，乘以365天；用补贴、打折等方式，短期内拉高订阅量；把待回款的合同金额，纳入经常性营收。还有投资人发现，一些ARR虚高的创业公司，收入往往集中在一两个大客户上。 “不这么做，你都融不到资。”一名AI应用创业者告诉我们。最近，他忙着给亲友们发产品年度会员的兑换码，拉高订阅量。之后，订阅量*年度会员费造就的“ARR”，会成为他的融资故事。 投资人也有自己的苦衷。Ariel所在的美元基金，最近两年“募资状况是近10年最差”。这让他们的投资策略变得无比现实：要投立马能商业化、一年内能规模化的。 每次见创始人前，Ariel都提醒自己，要耐心，“A轮之前更重要的是增长和留存”。但见到项目脱口而出的却是：“现在营收规模怎么样？” Ariel承认，心态失衡是创投圈普遍的问题。“但很无奈，我们要向上管理LP的预期。”她说。 摆正心态，成了创业者和投资人的必修课。 高盛最新的一份研究报告指出，截至2025年8月，全球AI应用的ARR约为300亿美元。其中，中国AI应用的ARR，为15亿美元。 这意味着，如今市面上ARR达到1000万美金的中国AI应用，不会超过150个。现实是，Ariel估算，去水后的“1000万美金ARR俱乐部”成员，中国AI应用不会超过20个。 在Ying看来，愿意狠刷ARR的硅谷初创公司，都有种待价而沽的心态：For融资，或者For收购。但这一动机传导到国内创业者，就成了向上攀比的焦虑。“事实上，少数‘尖子生’的成绩，不能成为强加在普遍创业者身上的要求”。 最近几个月，Eric选择“拔掉网线”。 他喜欢在日落时分，暂时不看工作消息，漫步在斯坦福的校园里。这里没有ARR、MRR，没有For PR或者融资的巨大压力。学生们三三两两走在棕榈大道上——他们当中，或许正在诞生像OpenAI、World Labs这样的AI独角兽。 “学校能让你从商业世界中暂时抽离出来。”学生时代创业的纯粹，让Eric觉得自己能思考更本质的东西，“很多时候，指标会让产品偏离最初的方向。你要时刻提醒自己，最初创业的目的是什么？你的目标是为了满足哪些人的需求？” 抓住一张有时限的船票 2025年3月，科技圈很难不被Manus的发布视频吸引目光。在那一则视频中，戴着黑框眼镜、长相颇具亲和力的Peak（季逸超，Manus首席科学家），说着一口流利标准的英语，介绍Manus的性能。 不少人将Peak的出镜，视作Manus发布视频走红的头号功臣。一家AI Coding公司的创始人曾对我们评价，顶着一张中国脸庞，说着接近母语水平的英语，这样的人在大洋两岸都具有“稀缺性”。 促成Peak加入Manus的伯乐，是股东真格基金的管理合伙人戴雨森。一名知情者告诉我们， 在创始人肖弘、张涛的背景都不够国际化的情况下，真格知道Manus需要一个熟知美国创投生态的“引路人”。 这个人就是4岁前往美国、高中独立开发出猛犸浏览器的Peak。 “当你有好的想法、做出好的产品，一定会有人来帮你做全球化。” 在Ying看来，不少这一波露出锋芒的AI应用创业者，英语本身并不好，甚至今年才第一次出国——但没关系，投资人、FA、出海机构、本土的双语人才，都来帮他们递船票、搭舞台。 三年前，肖弘跟着Linkloud加速营，第一次去了美国。彼时聊起出海、全球化，肖弘更多的是学习和探索。高宁记得，肖弘主动找到自己，“他们想要学习海外SEO的知识，这些人才在国内是很稀缺的”。 如今，这帮深谙海外增长渠道、创投环境的人，主动走向了中国AI应用创业者。 在Linkloud深圳场上，来自Linkedin、谷歌的几名中企海外BD负责人，在Q&A环节做了一番业务宣讲。随后，数十名在场的创业者冲上去加了微信。 Linkedin一名负责企业海外增长的员工告诉我们，就在几年前，他们还不知道去哪儿触达中国的AI应用创业者，“只能一个个找投资人去问”。直到今年，中国AI应用创业者在X上、线下社区里，雨后春笋般涌现。 让中国AI应用创业者焦虑的，还有签证。为了能长期待在美国处理业务，每次入境后最多只能停留6个月的商务签证是远远不够的。 这让入美不限时长的EB1A人才签证，成了一项炙手可热的办理业务。2024年之前，Base在纽约的Neil，主营业务还是办理留学签证。之后，他的业务转向了帮中国AI出海创业者办理人才签证。开展新业务一年，他的签证中介项目，甚至有机构想投资。 两年前，质疑AI应用浪潮是否到来，是一种审慎的态度。如今再提这个问题，反而显得不合时宜。 但一个亟待回答的问题是：这场潮水会持续多久？ 素来以前瞻性著称的创新工场联合CEO兼管理合伙人汪华，曾提前3年预测了移动互联网大潮的到来。 在这一波AI应用大潮中，他给出了一个并不余裕的创业红利期： 一年之内——这是“模型红利增长的黄金期，是喝头一口汤的黄金期”； 等一年之后，大家面临的会是同质化竞争。 在有限的时间窗口中，没有人想错过征战全球的机会。 “我们大胆地预测，未来全球的最顶尖的、最top使用的Agent里面，虽然最后这家公司可能headquarter到硅谷、新加坡、伦敦，但是它originally有2/3一定来自于中国的创业者。”在外滩大会上，明势资本合伙人黄明明下了一个乐观的判断。 10月27日，Linkloud组织创业者，去了湾区调研和访学。高宁在微信朋友圈写下：“今年湾区第二站，首破200人。”但在两年前，参与者规模还只有50人。 他还记得2023年的美国加速营。由于对海外市场感到不确定，不少AI创业者还对访学存有犹疑。“今年不会了。市场就是在那边。” Neil也切身感到水温的变化。今年8月，迫于美国财政部的审查压力，Manus撤出了中国，将总部迁设在了新加坡。这条消息足以让中国AI创业者对美国望而却步，也让Neil为业绩焦虑了三天。 即便局势依然紧张，但面对中国AI创业者带来的巨大利益，没有人愿意拱手让人。 根据彭博社报道，今年6月，Emergence Capital的GP Santi Subotovsky，出席了在北京朝阳区的一场AI投资沙龙。 几乎同一时间，Thrive Capital也以考察AI业务为由，组团前往中国。 Neil的业务不减反增。对全球性机会的渴求，足以跨过政策的阻碍。Manus被Meta收购后，Manus早期投资人、真格基金合伙人刘元，在公众号写到：“怀揣梦想的年轻人，经过时间的磨砺与积累，终将有机会在国际舞台上成就最不凡的事业。属于中国这一代年轻创业者的时代，已经到来。” 拿到人才签证，是中国AI创业者们常驻美国的第一步。Neil面向中国AI应用创业者的人才签证承办业务，已经排到了来年开春。 一名做AI招聘应用的创业者，向我们展示了一个有四五十名中国AI创业者的群聊。群聊建立的初衷，是为了帮助各自的AI产品，在北美权威产品榜单Product Hunt上取得不错的名次。一旦登上热榜，就能给产品带来大量的曝光。 每日，群友们都在给对方的产品点赞冲榜，或者分享自己的冲榜经验。比如，注册填写姓名时，不要用中文拼音，否则容易审核不过。 后来，上述创业者的产品冲到了Product Hunt日榜第一。他在群里发了个500元的红包，但没有一人领取。一名创业者回复：“出海不易，不要客气。” （文中Eric、Neil、Ariel、刘宁为化名） 欢迎交流！ 本文由「 阿菜cabbage 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： AI生成 +1 311 好文章，需要你的鼓励 阿菜cabbage 新锐作者 96 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 月薪3000的职校生，正在「干掉」北影导演 2026医疗展望：百家公司港股排队，医疗板块能否再创「神话」 千问的1000万杯奶茶：阿里大发赛博鸡蛋始末 狂飙的中国IP，掏空全球年轻人钱包丨36氪年度回眸 智谱、MiniMax港股IPO，熬过孤独的人和500亿奖赏 | 深氪lite 我的男友是虚拟的，但他很快就会变成现实｜深氪 七天挣百万，短剧演员的改命之路｜深氪lite 第一批喜茶加盟商，迎来史上最艰难的一年｜深氪 惊天反转：辞职41天，宗馥莉重新启用「娃哈哈」| 深氪 阿菜cabbage 新锐作者 人工智能等前沿科技摸石者，zxycai728 发表文章 302 篇 最近内容 杨植麟/张鹏/夏立雪/罗福莉/黄超，谈龙虾，谈“Token经济学” 2026-03-27 「龙虾」火热，硬件掘金，这里有10个最新的硬件项目 2026-03-27 腾讯挖来多位字节Seed骨干，向姚顺雨汇报丨智能涌现独家 2026-03-24 阅读更多内容，狠戳这里 报道的项目 只有一个 我要联系 专注于消费级文玩商品的聚合分发平台 下一篇 德国海归博士创业，钠远新材NFS系统料量产，将开启万吨级产能丨36氪首发 规模化提供NFS主材及核心“硬质”添加剂。 2025-12-31 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
