          text: '小米汽车重磅任命：胡峥楠任CTO，宋钢任参谋长｜36氪独家-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 小米汽车重磅任命：胡峥楠任CTO，宋钢任参谋长｜36氪独家 徐蔡钰 · 2026年04月17日 19:23 人才是小米的必争之地 36 氪从多个独立信源获悉，4月17日，小米集团通过内部邮件宣布：胡峥楠出任小米集团副总裁、汽车部 CTO；宋钢出任小米集团汽车部副总裁、参谋长。这是小米汽车自 2021 年宣布成立以来首次设立 CTO 岗位。 据 36 氪了解，两位新任高管在汽车行业均有超过二十年的从业积累，履历横跨传统车企与新能源赛道。 截至目前，小米汽车研发人员接近万人。一大批各有所长的汽车行业专家的加入，小米汽车正加快形成覆盖研发、设计、制造、安全、供应链等全链条人才体系。 顶尖人才也渴望更大舞台 胡峥楠加入小米，是一个经过长期观察与验证的双向选择。 胡峥楠 1997 年进入汽车行业，至今已有近三十年从业积累，是中国汽车工业自主崛起这一代里最具代表性的整车工程专家之一。 他的履历，几乎是一部浓缩的中国汽车自主品牌进化史：1997 年进入上海汽车工业技术中心担任工程师，2000 年联合创立上海龙创汽车设计公司，参与主导了比亚迪F3的整车开发——这款车曾连续多年蝉联中国 A 级轿车销量冠军，是比亚迪从电池企业切入整车制造的奠基之作； 参与了长城哈弗 H6 的工程研发——这款车开创了中国紧凑型 SUV 市场，累计超过 100 个月拿下国内 SUV 销量冠军，被业内称为"国民神车"；也曾主导吉利博越项目——这款车奠定了吉利在 SUV 市场的主流地位。 同一位工程师的名字，与中国汽车工业三次关键突破同时出现，这在整个行业里都是极为罕见的履历。 2021 年离开一线整车岗位、加入顺为资本之后，胡峥楠从产业投资的视角进一步拓展了对全球汽车技术演进路径的判断。 公开信息显示，早在 2021 年，胡峥楠便已加入顺为资本担任投资合伙人，并以小米汽车顾问身份参与早期工作。从 SU7 上市发布会、2024 北京车展，到 SU7 Ultra 挑战纽北赛道的现场，胡峥楠均有公开露面。 将一位主导过多款国民级车型的资深整车专家请入核心管理层，雷军没有操之过急。 这次任命标志着经过近五年的体系磨合之后，深得团队信任的胡峥楠正式成为小米集团的核心高管以及小米汽车最核心的技术掌舵人。 宋钢的履历同样跨越了中国汽车工业的两个时代。 早在加入特斯拉之前，他已经在全球顶级车企体系中积累了深厚的制造与供应链管理经验。从 1999 年起，他曾长期在上汽通用、福特任职，是中国合资车企黄金时期培养出来的本土专业制造管理人才。 2018 年，宋钢加入特斯拉上海超级工厂。这座工厂 2019 年 1 月开工、当年即实现Model 3 量产交付，创造了被全球汽车业反复研究的"特斯拉速度"。 宋钢历任生产制造高级总监、生产制造副总裁及上海工厂厂长，并赴美国参与工厂建设与业务规划，随后主导建立了特斯拉上海储能超级工厂。2024 年，他加入远景能源担任集成供应链高级副总裁，将其制造体系经验延伸至更广阔的新能源产业版图。 而对胡峥楠、宋钢这样的顶尖人才而言，选择小米，是选择一个更广阔的舞台。 从中国走向海外，人才是小米的必争之地 据了解，目前小米汽车团队规模已经超过一万人，其中研发人员就接近一万。 胡峥楠与宋钢之外，小米汽车高管团队与核心业务部门中，既有长期跟随小米的老员工，也有大量汽车行业的资深专家。 前者如自动驾驶事业部总经理叶航军，2012 年加入小米，曾先后担任人工智能部总经理、技术委员会主席等职务。 后者则分布在小米汽车的多个关键部门，包括智能驾驶端到端技术负责人陈光、认知大模型团队负责人陈龙、L3 项目负责人王乃岩，以及现任小米汽车工业设计总经理、首席设计师的李田原。 小米汽车的人才布局，也已延伸至全球。 2025 年以来，小米在德国慕尼黑正式设立汽车研发中心，小米官方已确认该研发中心的存在。据 36 氪此前报道，中心负责人Rudolf Dittrich 曾在宝马任职 15 年、出任宝马限量车型部门负责人，并拥有威廉姆斯（Williams）与索伯（Sauber）两支 F1 车队的工程管理经验。 团队成员中，Jannis Hellwig 为前宝马电动方程式（FE）性能管理与仿真主管，Ricard Aiguabella Macau为前法拉利 F1 新车空气动力专家，Dusan Sarac 则拥有宝马与劳斯莱斯的研发背景。据公开信息，全球首款奔驰 Vision GT（VGT）内饰设计师 Jean 近期出任小米汽车慕尼黑设计中心（Studio）负责人。 这个人才密度，在全球新能源汽车行业都属少见。放在更大的产业坐标里看，小米汽车此次的组织升级，也指向中国汽车工业正在面对的下一道命题。 过去二十年，中国汽车工业完成了从代工到自主、从燃油到电动的两次跨越。下一个跨越的命题是：能否在本土市场成熟的基础上，走出真正意义上的世界级智能电动车企。 这个命题的答案，取决于中国车企能否在产品能力之外，补齐与全球竞争相匹配的"工业级专业体系"——从技术底座到制造体系，从组织能力到人才密度。 对用户而言，这一轮组织与体系升级最终会落地为三个层面的直接体感：车会更好，交付会更稳，长期保障会更扎实。而对行业而言，小米汽车真正意义上的第二程，才刚刚开始。 本文由「 徐蔡钰 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： IC photo +1 61 好文章，需要你的鼓励 徐蔡钰 新锐作者 10 收 藏 +1 2 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.279 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 智界要打翻盘仗：V9给了年均12万辆指引｜36氪独家 字节跳动2025年海外营收占比创新高，AI投入致公司净利大降70%｜独家 自变量机器人完成近20亿元B轮融资，小米战投、红杉中国领投丨智能涌现独家 欣旺达装车特斯拉，供应全球车型｜36氪独家 阿里电商 AI 新动向：围绕 Token 重构电商，组织迎来新一轮调整｜独家 轻舟、元戎秘交上市资料，和Momenta冲刺港股IPO | 36氪独家 抖音生活服务组织架构大调整，中小商家更重要了｜独家 36氪企业全情报：AI 舆情大数据，让投资决策快人一步 云鲸联创吴一昊Hower即将离职创业 | 硬氪独家 徐蔡钰 新锐作者 汽车 发表文章 132 篇 最近内容 小米汽车重磅任命：胡峥楠任CTO，宋钢任参谋长｜36氪独家 2026-04-17 高端纯电，车企苦寻破局「命门」 2026-03-31 电池企业EnerVenue完成3亿美元新融资，将在华建首条吉瓦级生产线｜36氪独家 2026-03-31 阅读更多内容，狠戳这里 下一篇 用不起Token的我，成了AI时代的下沉市场人群 仿佛回到早期互联网，号主一不留神就会流量超额、欠费停机。 2026-04-17 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
