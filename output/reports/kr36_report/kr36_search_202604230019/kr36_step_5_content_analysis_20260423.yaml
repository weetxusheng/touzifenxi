          text: '投资派 | 投资越南，机遇还是陷阱？-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 投资派 | 投资越南，机遇还是陷阱？ 黄绎达 · 2024年06月05日 10:31 全面解读越南资本市场。 作者 | 黄绎达 丁卯 范亮 编辑 | 郑怀舟 近年来，出海是产业投资、向外拓宽销售渠道最热门的话题，而作为我国邻居的越南则是全球最热门的出海目的地之一。 经过多年的高速发展，越南已然成为了小一号的“世界工厂”。特别是近年来随着国际贸易环境趋于复杂，越南在已有的制造业基础上，叠加人口红利和地理优势，一跃成为亚太地区价值链建设的重要避风港。在这个过程中，越南不仅承接了我国的部分产业转移，同时也是其他国家/地区出海的重要目的地。 受益于产业转移的推进，越南近年来的经济增速在绝大多数时间都稳居东南亚榜首，2022年的GDP同比甚至高达8.02%。作为东南亚经济增长最快的经济体，越南股市也表现得相当火爆，以胡志明指数为例，在近20年的时间里最大涨幅竟然超过了1000%。 图：东南亚国家GDP同比增速；资料来源：wind，36氪整理 然而，巨大的涨幅之下，越南股市的波动也非常剧烈。近五年来，胡志明指数的深度调整就不下五次，呈现出大起大落的趋势。与此同时，2023年以来，越南的政治局势也显得颇为动荡，高层的频繁更迭，反腐运动之下大批官员的纷纷落马，甚至已经影响到了政府的正常运作，以至于国际社会都表达了对越南前景的担忧。 图：胡志明指长期走势；资料来源：wind，36氪 尽管当下国际市场对越南的前景产生了一些分歧，但从全球资产配置的角度看，某种程度而言，全球资产荒已经延续了很久，而越南亮眼的经济数据、股市良好的历史表现、产业持续迁移带来的经济高速增长预期、跨境资本进出便捷等多重利多因素，均使得越南股市成为当下经济环境中，全球资金关注的重点资产。 虽然我国与越南有着深厚的历史渊源，两国之间的文化、习俗也颇为接近，但受限于语言、信息获取等问题，实际上国内投资者并不熟悉越南及越南股市，而本文正是试图通过回答以下三个问题，意在为投资者呈现出一个越南投资的全景图。 1. 越南资本市场现状如何？ 2. 越南投资的机会在哪？又该如何计价潜在风险？ 3. 越南投资中哪些板块值得关注？ 01 股市结构介绍 资本市场一直广泛流传着一个理论——股市是经济的晴雨表，其中一个重要的原因是，股市的行业结构往往与国家产业结构紧密挂钩。 但对越南来说，情况可能有点不同。 在2000~2009的十年间，越南核心股指胡志明指数的涨幅约3.9倍，同期名义GDP总量的增幅则约为3.5倍，二者增速基本匹配； 然而，自2010年起至2023年底，胡志明指数上涨了约120%，同期越南名义GDP总量增幅则超400%，二者拉开差距的核心原因则来自胡志明指数行业结构的变化。 要理解这一现象，就要先来对越南资本市场建立一个宏观的认识。 从时间线来看，越南的资本市场始于1996年，以越南国家证券委员会成立为标志，开始初步建立资本市场基本制度。2000年7月，胡志明证券交易中心（胡志明证券交易所HOSE）正式投入运营；2005年，河内证券交易所HNX正式成立。 从两家交易所的具体定位来看，胡志明交易所主要负责股票交易，河内交易所则承担较多的衍生品、债券交易的职能，同时也包括一部分股票交易；而且，越南也拥有类似中国新三板的股转交易中心UPCoM。 截至2024年5月24日，胡志明交易所一共拥有410家上市公司，总市值约5139万亿越南盾（1.5万亿人民币），河内交易所则一共拥有316家上市公司，总市值约163万亿越南盾（500亿人民币）。 由于河内交易所上市公司市值明显偏低，因此我们后续的分析主要以胡志明交易所展开。 从越南上市公司的数量变化情况来看， 2009-2011年间，越南有过一波上市热潮 ，但在随后的十余年里，越南对上市公司的扩容表现出相当谨慎的态度， 仅在2017~2018两年间累计推动了五十多家公司上市，随后越南上市公司总数就一直保持平稳，几乎没有再增长。 图：越南上市公司数量；资料来源：世界银行、Wind、36氪整理 图：胡志明交易所上市公司数量；资料来源：彭博、胡志明交易所、36氪整理 不过，在行业结构方面，越南资本市场呈现出一个明显的趋势：金融行业的占比越来越高。 2008年时，胡志明交易所共有上市公司170家，其中上市金融机构仅3家，金融板块的市值占比也仅有8.6%。但在2009-2011的上市潮中，越南将上市金融机构的数量提升至14家，金融板块的市值占比也随之提升至20%以上。 2011-2024年，胡志明交易所净增上市公司约97家，其中上市金融机构的净上市数达到31家，随着大量的金融机构上市，使得金融板块在胡志明指数的市值占比一路突破至40%以上，从2019年开始就一直稳居第一大权重行业。 此外，地产也在胡志明指数中也有过“巅峰时刻”。 随着近年来产业迁移的持续，特别是2015年越南放松外国人购房限制后，越南房地产也迎来一波黄金发展期，2018年房地产一度成为胡志明指数第一大权重行业。 然而到2022年后，在一系列金融、地产反腐的作用下，地产板块的市值大幅缩水，但其2023年底在胡志明指数中的权重占比依然高达到15%。 2023年底，越南金融和地产行业在胡志明指数的权重合计近60%，对越南股市有着举足轻重的影响。 如果单看市值结构，就会产生越南经济主要依靠金融和地产拉动的错觉，然而实际上，越南金融和地产在GDP中的占比并不高。 图：胡志明指数行业市值结构；资料来源：彭博、36氪整理 图：胡志明指数行业公司数量结构；资料来源：彭博、36氪整理 02 金融占据半壁江山，实则是无奈之举 越南股市中金融板块的总市值占比如此之高的内在逻辑，其实还是源于越南长期以来已经基本定型的经济结构，其结构特征可以简单地概括为以出口为导向、以制造加工为核心，因此现在的越南可以说成为又一个“世界工厂”。 然而，越南成为 “世界工厂”的过程是以外商直接投资为主要驱动，同时自身却又几乎没有发展民族工业， 这就导致了在越南数量庞大的制造业企业中外资是主要贡献方 ，根据2021年的统计数据，外资部门在越南经济中的占比高达到20%。 资本市场方面，以外资为主导的制造业在越南股市中的占比却始终相对不高。 胡志明指数中，制造业长期的总市值占比的中位数仅有9%，而且这一比例长期稳定、变动很小。 论及制造业在越南股市的占比大幅落后于金融板块的原因，首先是外资对相关的制造业资产在越南资本市场IPO的意愿不高，其主要原因有以下四点： 1.外资来越南投资，主要看重的是越南的地理、人口等方面之于制造业的相对优势，越南资本市场并不是吸引外资来越投资的主要原因； 2.越南并不是限制跨境资本的自由流动，外资更倾向于在欧美日等更发达、更规范的资本市场融资，再以跨境资本的方式流入越南； 3.越南作为新兴市场国家，资本市场的定价权相对较弱，外资资产可能在越南拿不到理想的估值； 4.长期来看，越南盾相比美元一直在贬值，汇率因素也是影响外资在越南IPO意愿的主要原因之一； 再来看本国金融业在越南资本市场的发展，尽管越南不限制跨境资本的自由流动，但是越南本地的金融机构在债权融资上却也有着明显的属地优势与政策扶持，特别是随着制造业规模的扩大，对资金融通的需要也在随之增长，叠加越南自身城镇化水平也在逐步提高，在这一过程中，有好需求的驱动，越南金融业的证券化水平亦得到了大幅提升。 反映在数据上，2008年时，胡志明指数中，越南金融业的总市值占比仅有9%，还不及同时期的制造业（10%）。到2016年，越南金融业的总市值占比提升到了23%，已大幅领先同期的制造业（11%）；再到2024年这一比例则攀升至45%，可以说金融板块目前已经占据了越南股市的半壁江山，远远地把制造业甩在身后。 2016-2024年间，大量的金融机构在这段时间里扎堆上市。 2016年，胡志明指数中的上市金融机构只有18家；到2024年，上市金融机构数量则上升到41家。所以， 越南金融板块总市值占比在近年来的大幅提升，既有估值上涨的驱动，同时也是得益于越南金融业证券化水平的大幅提升。 越南以制造业为重心的经济结构特征，且作为当今的又一大“世界工厂”，很容易将越南与我国的经济及发展历程做一番对比，在不少人看来，越南是“摸着中国这块石头过河”。其中，越南在近年来上市金融机构数量的大幅提升（主要是银行），从形态上与我国资本市场历史上的几波银行上市潮颇为相似，但论其内在逻辑是既有相似、亦有不同。 回溯我国银行板块的发展历程，在经历了1999-2003年、2005-2007年、2015-2016年这三轮银行上市潮后，包括五大行、股份制行、大型城商行在内的所有大中型商业银行均实现了上市。从宏观维度来看，第三轮银行上市潮伴随着我国经济的快速增长；从企业基本面来看，前两轮的银行上市潮正好是我国第一轮不良资产剥离之后，银行资产质量得以修复，并通过股份制改革实现了“浴火重生”；第三轮银行上市潮则是解决了此前长达8年的银行IPO堰塞湖问题。 越南金融机构在近年来的扎堆上市，从宏观背景来看，2016-2023年间，在不考虑疫情的影响下，越南的经济总体也保持了高速增长，这一点与我国的那几轮银行上市潮的宏观背景有一定的相似性，但是由于越南对自己民族工业漠视的态度，导致越南金融板块的总市值占比在23年末达到了惊人的45%，我国同期大金融板块（包含银行券商和保险）的总市值占比则只有14%。 越南与我国股市结构上的差异，其实本质上反映的是两国经济结构的差异。 相比于越南，我国的经济更具多样性，特别是我们拥有一整套完善的民族工业体系，这是目前越南所不具备的。所以，相比于越南，我国股市的行业分布要更加均衡，即便金融与地产在过去10多年里扮演了经济增长核心动能的角色，但是这两个行业的总市值占比远没有越南那么极端。 再看越南现在的经济结构，其特点可以简单地概括为消费占优、制造业主导、进出口庞大且两头在外的外向型经济。 其中，越南的进出口贸易规模相对其GDP总量而言十分庞大，2022年越南进口与出口规模占GDP总量的比例分别高达88%和91%。从产业结构的维度来看，2022年越南制造业占 GDP 比重为24.8%，其次为批发零售业9.6%和建筑业6.2%， 房地产业和金融业的比重则仅分别为 3.5%和4.8%。 由此可见，越南的金融板块占据其股市的半壁江山的现状，实则也是无奈之举，毕竟大量的制造业资产掌握在外资手中，而且外资对于在越南IPO明显缺乏热情。那么，越南资本市场若要实现扩容，相对而言选择并不多，只能从银行、地产这些掌握在越南自己手中且相对优质的资产入手。 03 大起大落的房地产 再来看胡志明指数中市值权重第二大的地产板块，自2005年以来，越南地产行业经历了两轮明显的周期波动，以胡志明、河内等为代表的核心城市房价亦随之大起大落。 千禧年后的越南地产起步于2003年，要说真正意义上的第一轮腾飞则是发生在2005年左右，越南楼市进入第一轮快速上涨周期，其背后的主要推动因素 ，一个是经济前景的持续向好，另一个是国内信贷的扩张。然而随着房价的持续走高，地产泡沫也在不断积聚。 为了防止泡沫破灭带来连锁反应，从2009年开始政府有意识地调低信贷规模，控制楼市成交。与国内类似，越南地产市场也对政府政策具备高度敏感性，在一系列政策压制下，越南房市的成交量受到了抑制。 到2011年前后，越南的房价水平已经明显地偏离了当地人均购买力以及平均薪资水平，地产泡沫也在那时开始破裂，房价随之大幅下跌，甚至腰斩。不仅如此，受房价下行和成交量走低的冲击，前期大量流入地产市场的贷款也开始违约暴雷，导致大批坏账的产生，因此给金融系统带来了较大的压力。 第二轮地产周期发生在2015-2022年间。在上一轮的地产泡沫破裂后，越南地产长期处于低迷状态。随后，越南政府通过一系列积极的政策措施以刺激地产市场，特别是在2015年对《住房法》进行了修改，放宽了外国人在越南的购房条件。至此，在内部金融环境改善叠加外资流入的刺激下，越南地产开始走出低谷，2016年再度进入新一轮景气周期。 在本轮地产周期中，外资起到了关键作用，2015年外资限制取消后，来自韩国、中国的投资客开始涌入越南地产市场，越南楼市因此不断狂飙。 按照越南地产服务公司CBRE的统计，2018年，通过该公司在越南购房的客户中，外国买家占到了72%；在外国买家中，中国与韩国的占比分别为45%和22%。 图：海外投资客的越南地产投资占比；数据来源：CBRE，格隆汇，36氪整理 2020年疫情暴发后，美联储开启放水模式，同年越南政府修订新《投资法》，允许越南房企自由发行债券，并鼓励外资进入。 在全球货币政策超宽松的环境下，大量外资向越南地产市场加速流入，推动越南房价持续走高 。2020-2022年连续三年的房价年均涨幅在25%以上，2022年上半年，胡志明市、河内房价涨幅双双冲进亚洲前10，其中胡志明的平均房价一度涨到了3300美元/平方，在高基数下的同比增速甚至高达27%。 图：越南胡志明和河内新房均价；数据来源：国海证券，36氪整理 然而狂欢并没持续多久，高企的越南地产在2022年底开始崩盘了。 在新皇明事件爆发后，越南政府开始对地产、金融进行一轮严厉监管和反腐风暴，多名地产大鳄、官员锒铛入狱，市场情绪陷入紧张和低迷状态。不仅如此，疫后全球经济陷入低迷，使得外需大幅受损，作为出口导向型经济体的越南受到极大影响。 同时，美国为了遏制通胀，开启了加息模式，大量外资开始从越南楼市撤离。而且，由于越南实施紧盯美元的汇率制度，也被迫跟随加息，对越南地产而言，金融环境的快速收紧无疑是雪上加霜。最终在多重因素共同作用下，越南地产市场从2022年底开始进入了新一轮下行调整周期。 图：越南限制地产企业发债；数据来源：VN Land Notes，国海证券，36氪整理 综合来看，越南地产大起大落的根本原因与我国2000年前后那一轮地产周期的逻辑颇为相似，但细节处又略有不同。 首先，与国内相似的点在于良好的经济环境前景为地产提供了优良的发展土壤。 2005年以来，随着第一轮劳动密集型产业转移，越南经济迎来飞速发展阶段，经济前景持续向好，尤其是2018年后，越南的第二轮产业转移逐步扩大至技术密集型产业，制造业的飞速发展使越南一跃成为东南亚增长最快的新兴经济体。 其次，地产成为外资优质的货币载体。 2015年越南放开商业地产外资限制后，外资开始流入越南地产市场；2020年《投资法》的修改叠加全球宽松的货币环境，进一步促使大量热钱流入越南地产，不断推升越南地产的泡沫。 而与国内不同的是，2015年作为本轮越南房地产周期的起点，彼时的房价已经与居民薪资产生了较大偏离，普通人购房需求被抑制，导致越南地产市场开始严重依赖外资，中美韩的投资客成为越南地产的关键力量 。当美联储进入加息周期后，外资的不断流出，叠加越南本土对金融、地产的反腐和整顿，导致了2022年开始的越南地产崩盘。 伴随着两轮地产热潮，地产上市公司的数量和市值占比得以快速扩张 。目前，胡志明指数中的地产上市公司数量有50个，而2008年时仅有7个。在第二轮地产热潮之中，地产上市公司的市值快速扩张，带动地产板块在胡志明指数中的市值占比增长，2018年地产和金融并列为第一大权重板块，2019年一度达到了27%。 2022年后，尽管地产进入下行周期，叠加金融、地产反腐，地产板块市值权重占比有所下降，但目前仍是胡志明指数中的第二大权重板块，占比接近15%。 展望未来， 短期来看越南地产的表现仍取决于越南政府政策的支持力度 。据报道，2023年9月，越南房地产部门的国内直接投资超过了140亿美元（同比增长15.5%），约占整体的70%，显示出了积极的改善迹象。与此同时，越南房地产协会预计，从2024年4月-6月期到7月-9月期，房地产市场将会持续回暖。 长期来看，目前越南仍然处于人口快速增长时期，且人口结构非常年轻化，整体处于人口红利的中期阶段；与此同时，当下越南的城镇化率仅为38%左右，较其东盟国家明显偏低，当前越南的人口结构、城镇化率水平仅与我国2002年左右相当，且地产在GDP中的占比仅为4%左右。 所以，人口的快速增长尤其是适龄人口占比的提升和城镇化水平的加速上升，仍有望为越南房产的长期发展提供稳定的基础。 图：越南劳动力人口与总人口对比；数据来源：wind、36氪整理 图：2022年越南和中国人口金字塔对比；数据来源：国海证券，36氪整理 图：越南和中国城镇化率对比；数据来源：国海证券，36氪整理 随着本轮地产的大调整趋近尾声，外资过度介入引发的房价非理性上涨、高端住宅过剩低端住宅不足等结构性问题将有望终结。未来，经济前景稳定向好，随着人均收入的不断提升， 以城镇化率提升驱动下的住房刚性需求释放将有望成为下一轮刺激越南房地产市场的主要力量。 当好预期反映在越南股市的地产板块上，在短期政策回暖、长期宏观背景稳定的支撑下，预计地产板块的市值有望从低点恢复，考虑到地产在胡志明指数中的较高市值占比，未来地产板块市值的企稳，仍有望为越南股市的良性发展提供稳定的支撑。 04 未来值不值得投资 虽然，目前越南的股市结构不能充分反映越南的经济，但是经济始终是股市的晴雨表， 未来越南经济增长的强劲与否，直接决定了越南股市的投资价值 。 投资者之所以看好越南的投资机会，主要还是对其未来稳定乐观的经济前景有所期待， 更直白地来说，投资者是对越南未来是否可以进一步承接东南亚产业转移，进化为更大、更高级“世界工厂”的概率进行押注。 回顾越南的两轮产业承接之路， 第一阶段是在2005年左右，主要开始承接来自中国的家具、地板、光伏、轮胎、纺织服饰等劳动密集型产业 。尤其是在2007年加入WTO后，越南广泛地与各主要经济体签订自贸协定，友好的贸易环境叠加人力成本的优势，加速了上述行业向越南的产业迁移。 图：2009年以来越南与各国的贸易协定；数据来源：国元证券、36氪整理 图：越南税率和关税优势；数据来源：国元证券、36氪整理 2018年，越南迎来了第二轮产业转移， 以2019年《全面与进步跨太平洋伙伴关系协议》（CPTPP）在越南正式生效为标志性事件，为规避贸易争端，以消费电子为主的相关产业加速向越南转移，外商直接投资项目数量在2018 、2019两年再度增长 。这一轮产业转移进一步强化了越南的制造能力，丰富制造业的覆盖范围，同时也使得制造业的价值量得以明显提升。 受益于两次产业转移的承接，越南制造业得以快速扩张，逐渐成为驱动经济增长的最关键动力 。根据世界银行的数据，2010年越南制造业增加值为252亿美元， 2022年上升至1012亿美元，CAGR为12.3%，制造业扩张速度远高于同期GDP平均增速（8%）。2022年越南制造业占GDP比重提升至24.8%，与二三名的批发零售业9.6%和建筑业6.2%均有着较大差距。 图：越南各产业在经济中的占比；数据来源：wind、36氪整理 从对外贸易的口径来看，目前的越南与我国2000年初时有着极高的相似性，表现为在国际产业链上仍处于制造业的初级阶段，以低附加值的组装加工为主，并主要进行的是出口导向的加工贸易。 通俗来讲，当前的越南还是一个相对初级的“世界工厂”，它从中、韩等国进口中间品，依靠人力成本优势进行加工，再通过友好的关税政策和贸易协定将制成品出口到欧美等发达国家，从中赚取低廉的加工费。 两轮产业链转移给越南带来了大规模的外商投资，也奠定了越南的制造业基础，尽管当下越南的制造业规模可观，但以初级加工为主的制造业结构明显含金量不高，而且由于越南重工业基础薄弱，基础设施建设匮乏且对民族工业的支持力度不强，因此现在还不具备完善的制造业供应链。 图：部分国家商品出口价值占全球比重；数据来源：世界银行，国元证券，36氪整理 与此同时，这种出口导向的加工贸易，也直接造就了越南在外贸领域典型的大进大出、两头在外的经济模式，因此对外贸的过度依赖加剧了越南经济的短期波动性 。2023年，受外需疲弱的影响，越南的出口增速大幅转负，贸易逆差明显，极大冲击了越南经济的表现，最终在地产和贸易双双走弱的情况下，越南2023年的GDP增长出现了明显降温。 图：支出法下越南经济结构；数据来源：wind、36氪整理 如果说人口红利所形成的成本优势和贸易摩擦下的贸易优惠政策是此前越南承接产业转移的关键催化剂， 那么制造企业配合下游客户在东南亚进行产地配套将成为越南当下乃至未来继续承接产业转移的重要动力。 最典型的例子是近年来电机及电子产业在越南制造业出口中的占比持续提升，即从2015年的29.4%提升到了2021年的39.6%，背后的一大关键原因是三星和苹果等消费电子巨头开始在东南亚布局后，在产地配套的驱动下，引发了相关上下游供应商在越南的新一轮大规模建厂配套。 图：越南产业占比变化；数据来源：国元证券、36氪整理 图：果链企业的越南布局；数据来源：国元证券、36氪整理 考虑到东南亚目前已经形成了较为成熟的产业集群，比如越南、马来的电子；越南的纺服；泰国、印尼的汽车；马来的机械；印尼、泰国、马来的石化产业等。 越南作为东南亚的重要一环，人口红利占优、政治环境相对稳定、贸易环境极其友好，未来越南的产业承接有望进一步向汽车、机械、半导体等部分环节扩张。 那么，在产地配套要求下，越南在未来一段时间内仍然是相关产业进行产业转移的重要目的地之一，而制造业的稳步扩张无疑会使其经济增长的前景继续乐观。 但是，越南同时也存在基础设施配套落后、技术人才匮乏、企业管治水平有限、社会效率较低等问题。 回顾我国2000年以后的制造业发展之路，从加入WTO后开始承接大量低附加值的加工贸易，到政府产业规划及扶持政策、人口素质提升、基础设施配套快速发展等多重因素作用下的产业升级，随着竞争力的显著提升，助推我国制造业的自有品牌和自主知识产权出现爆发式增长，国产替代加速，最终我国发展成了世界级制造强国。 根据我国的历史经验， 长期的产业升级离不开政策支持、大力的财政投入、人口素质的提升、民族企业的崛起和企业管治水平的不断提升等诸多要素 。而上述这些要素也将成为考量越南长期产业承接能力的关键变量，尤其是在当下越南的人力成本不断提升、建厂成本持续走高的背景下，这些问题能否得到有效解决，无疑是越南能否从“世界加工厂”向“世界工厂”升级的直接驱动力。 回到股市投资，总量维度关键还是看越南未来经济增长的预期。 短期来看，随着全球经济的企稳，预计在出口需求的提振下，越南经济有望迎来触底回升 。其中，美国对于来自越南的出口货物有着相对强劲的需求，是短期内越南经济增长的强支撑之一，其背后的逻辑在于： 1.本轮美国通胀韧性颇强，为了达成通胀数据的政策目标，需要来自越南的便宜货物； 2.随着美国的制造业周期的启动，由价值链分工将驱动对越南部分加工品的需求； 中长期来看，顺着产地配套的大趋势，越南产业承接范围和规模有望继续壮大，越南大概率仍然具备长期快速增长的能力，稳定的经济增长前景为其资本市场的表现提供了坚实的背景支持。 策略方面，前文提到越南股市中金融和地产占据着较大的市值比例，这两大板块也是投资越南的主要方向。之前的一个利空点，是在2022年地产严监管和金融反腐下，地产和金融板块的走弱给越南股市带来了较大冲击。 目前，经过一系列的整顿后，地产和金融板块的风险已经得到加速释放，考虑到当下两个板块的估值均处在较低的水平，未来随着行业逐步重回正轨，较高的估值安全垫无疑会增加越南股市的投资吸引力。 与此同时，考虑到美联储降息预期的不断强化， 跨境资本有回流新兴市场的动力，而越南作为新兴和前沿市场中增长确定性较强的经济体，未来仍将会是外资流入的重要承接地 ，这部分预期中的增量流动性也是驱动越南股市上涨的动力之一。 从股市结构上看，在产地配套要求下，为越南制造业在未来的进一步丰富提供了坚实的基础，随着制造业的不断强壮以及本土企业的崛起，未来越南股市也有望迎来一批本土制造企业上市，从而有助于优化股市结构，为股市中长期的稳定发展提供基础。 05 谁在买越南股？ 前文提到，外资在越南经济结构中的占比相当之高。那么，外资在越南股市的参与度又如何呢？ 公开数据显示， 外资机构可以投资并持有越南证券交易所公司的股权上限分为100%、50%、49%、30%、0%等多个档位，大部分企业的持股比例限制为49%。 其中，银行板块外资持股限制一般为30%，农业、石化、基建等领域的部分上市公司则不允许外资持股。而像可降解塑料生产商安发（股票代码：AAA）、涂料制造商A Dong Paint Joint（股票代码：ADP）等制造业属性较强的上市公司，则没有持股限制。 而就外资持股比例来看，根据胡志明交易所公布的数据， 在剔除外资禁买的股票，截至6月3日 ， 外资对越南股市的持股比例约在17%左右。 交易层面，国海证券此前统计，2020年以前，外资在越南股市的成交额占比一般在25%左右，且一度超过30%；但从2020年后便开始下降，到2023年中时仅有10%出头。 不过，今年以来外资情绪交易活跃度有所提升，根据胡志明证券交易所发布的数据显示， 截至2024年5月，外资今年在胡志明交易所的总成交额占比约为18%，成交量占比则约14%。 图：胡志明交易所外资成交情况；资料来源：胡志明交易所，36氪整理 当然，2020年后外资成交额占比整体下降并不完全是因为外资流出，最主要的原因是散户的爆发式涌入。 根据越南股市的投资者结构，2018年时，越南国内个人投资者214万户，机构9298家，海外个人投资者2.5万户，海外机构3319家。 而到2022年，越南国内个人投资者数量已大幅上升至684万户。 当然，在2018-2022的几年里，海外个人投资者、海外机构投资者数量也分别增加约50%和30%，但增幅明显不及越南散户。 图：胡志明交易所投资者数量统计；资料来源：胡志明证券交易所，36氪整理 散户的涌入大大提高了越南股市的活跃度。 拉长时间周期来看，2010-2020年，胡志明指数日均成交额从1.5万亿越南盾增长至6万亿越南盾，而在2021到2024三年多的时间里，胡志明指数日均成交额则直接从6万亿越南盾飙涨至21万亿越南盾。 图：胡志明证券交易所每日成交量；资料来源：Wind、36氪整理 图：胡志明证券交易所年度日均成交额；资料来源：Wind、36氪整理 散户涌入的一大原因是，2020-2021年间越南出口向好、房地产繁荣带来的上市公司净利润的大幅增长。 特别是2021年，根据Mirae asset的统计数据，彼时越南上市公司平均的利润同比增幅高达38%。当然，散户的涌入确实给越南股市带来了比较大的波动，但是如此庞大的流动性还是对越南股市起到了相当的支撑作用。 从实际交易的情况来看，越南散户的操作方向与外资、越南本土机构基本相反 。例如，在2021年胡志明指数暴涨超30%时，主要就是靠越南散户推动，同期外资和本土机构基本是净流出状态。而2022年，在金融、地产反腐的影响下导致胡志明指数暴跌时，外资又开始有所流入，但散户资金却在快速流出。2023年，海外资金在美元高利率环境下继续流出，但此时越南散户又起到了托底作用，并支撑胡志明指数小幅上涨。 图：胡志明交易所资金动向；资料来源：Mirae Asset、36氪整理 通过拆解胡志明指数（VNI）的涨跌幅可以发现，越南投资者在过去整体的交易逻辑主要还是依靠估值来驱动股票涨跌，而非盈利驱动。 2020-2021年，全球流动性宽松+散户流入，推动胡志明指数的估值（PE）从底部的10倍左右推高至17倍。2022年，美联储加息、越南反腐等一系列操作使得胡志明指数的PE再次回落至10倍左右。但从2023年起，越南经济修复预期下越南散户资金的再次流入，推动股市估值开启了缓慢修复，由此也带动了市场回暖。 2024年以来，胡志明指数累计涨幅超10%，市盈率则从年初的12.38提升至当前的13.79，指数与估值涨幅也基本相匹配。 当然，在今年4月份，越南政局的频繁变动令胡志明指数出现了急跌，期间最深跌幅超8%，但5月份后指数已经基本修复至前期高点，目前胡志明指数的交易逻辑整体仍围绕经济修复预期下的估值抬升而展开，经济修复本身则还是要看出口链和房地产。 根据越南建设证券数据，24Q1越南货物进出口总额达1780.4亿美元，同比增长15.5%。房地产方面，自去年下半年起，越南房地产销售在跌入近十年的低点后开始好转，房地产行业信贷增长高于总信贷增速，显示地产企业融资正在恢复。 因此，地产+出口的双重回暖，以及美联储的降息预期，是总量层面支撑越南2024股市继续上涨的重要动力。 图：VNI指数走势、市盈率走势；资料来源：Wind、36氪整理 06 胡志明指数高估还是低估？ 就越南当前的估值情况来看，胡志明指数的市盈率约为14.4倍，处于近10年的40%分位，近五年的46%分位。 和其他新兴市场国家市盈率作对比，越南股市的市盈率水平目前整体处于居中水平，与上证指数接近，然而在结构上却分化明显。 越南股市目前低估值的主要原因，还是金融板块的市值占比太高，由于其目前偏低的估值水平，以至于拉低了整体的估值。 根据中金公司统计，VNI指数中金融行业市盈率仅约12倍，同时材料、消费、工业，房地产行业的市盈率均处于40-80倍的高估值区间。 与当下的上证指数对比来看，上证指数金融板块估值同样偏低，但高估值的行业分布与胡志明指数完全不同。 目前上证的金融板块平均市盈率约6-7倍，同样拉低指数整体的市盈率，但是当前上证指数中工业（14倍）、材料（20倍）、消费（25倍）、地产（9倍）板块的估值水平与胡志明指数对应的板块相比都不高，而上证指数的估值主要依靠信息技术（55倍）拉动。 图：新兴市场国家主要指数估值水平；资料来源：Wind、36氪整理 图：胡志明指数行业回报与估值情况；资料来源：中金、36氪整理 如果与上证指数的历史做对标，那么胡志明指数中工业、材料、地产等行业的估值水平与我国2006-2008的状态则非常相似。 在2006-2008年那一轮A股牛市中，普涨行情下，材料、工业、地产等板块的估值水平同样处于高位，但随着彼时那轮牛市的终结，在此后的多年时间里，上述板块一直处于估值消化中。 那么，这是否意味着胡志明指数那些估值过高的板块也将会长期处于估值消化状态中呢？ 这一点上越南与我国的情况大不相同， 越南材料、工业、地产等板块高企的市盈率并不完全是源自市场暴涨，而在很大程度上是由分子端相关企业归母净利润（NPATMI）的大幅下滑所致 。以材料板块为例，2022-2023年该板块累计下跌28%，板块整体的归母净利润在2022和2023Q3（TTM）分别下滑高达48%和58%，由于分子端下滑得更快使得估值被动抬高。 进入2023年后，随着越南经济的逐步企稳，这些业绩滑坡导致高估值的板块也迎来了边际向好，投资者情绪也随之改善。仍以材料板块为例，2023年该板块的涨幅高达40%，其原因是市场提前布局业绩反转，而2023Q3以来的财报数据也确实印证了这种反转预期。 基于目前对越南的经济增长预期，即出口恢复、房地产触底已经成为今年越南经济的整体基调， 那么在细分行业本身估值偏高的水平下，未来越南股市的表现可能会从估值驱动转向盈利驱动。 对投资越南股市的投资者而言，把握地产链、出口链中细分行业的困境反转、利润修复两个方向，将会是一个不错的选择。 在中金证券对越南2024年一季度的经济分析中，其认为，越南的工业活动有望在出口拉动下在今年二季度展现出更活跃的表现。反映在二级市场上，则可以关注消费、制造业等板块的投资机会。此外，越南年内延长增值税下调时间、公职人员薪酬改革等措施，也会对消费板块构成比较明显的利好。 图：胡志明交易所各行业涨跌、利润表现；资料来源：Mirae Asset、36氪整理 *免责声明： 本文内容仅代表作者看法。 市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。 36氪财经 本文由「 黄绎达 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 视觉中国 +1 363 好文章，需要你的鼓励 黄绎达 资深作者 124 收 藏 +1 2 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.193 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 2026有智青年挑战赛，报名通道全面开启！ 2026中国股权投资行业名册，调研启动！ 直击“宇宙行”业绩会：日赚10亿，分红超千亿！工行高管：股息率超5% 净利微增，投行收入几乎腰斩！中信