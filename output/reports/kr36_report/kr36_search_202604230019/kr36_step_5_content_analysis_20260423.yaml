        analysis:
          summary: '提炼标题：AI时代“一人公司”的创业样本；内容要点：AI工具大幅降低了个体创业的执行门槛，但项目成功仍依赖创始人的判断力、获客能力和产品品位。文章通过“遇见森林”郑国俊和“00后”Arvin的案例，对比了创业老炮与年轻一代在AI杠杆下的不同实践与挑战。'
