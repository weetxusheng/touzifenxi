          text: '大年初一聊聊天，愿你23年野蛮生长 、无拘无碍-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 大年初一聊聊天，愿你23年野蛮生长 、无拘无碍 后浪研究所 · 2023年01月28日 14:39 2023你好 各位后浪们，新年快乐，兔年大吉！ 日历翻开新的一页，今天是值得庆祝的一天。很开心，「后浪研究所」又陪伴大家走过一年。在过去的时间里，我们一直渴望成为年轻群体的课代表，拥抱多元文化，观察并陪伴每一位勇敢先锋的新青年。 我们在乎每一位后浪的所思所想，在大时代下努力挖掘那些属于年轻人的涓涓细流。 在过去一年里，我们一共发布了 145 篇文章。尽可能地在潺潺时间里，抓住那些独属于年轻人的奇思妙想、特立独行与温暖印迹。 在往期文章里，我们用文字、数据和漫画，从小而美的具体故事出发，从生动的个人经验出发，为我们所处的社会空间和时代，留下响亮的新青年声音。 在这里，你能看见 年轻人的新主张 ，数字游民、不爱结婚的年轻人以及女装出行的男孩，他们打破常规，用新的生活方式，掷地有声地发出个性和自由的口号；当然，浪花们的动向，一样可以被理性的数据所洞察， 「后浪白皮书」 栏目，从攒钱、买房到生活压力、读书报告，也同样捕捉年轻人感兴趣和关注的话题；除此之外， 「尺度」 栏目，和新时代的创新者们碰撞思维火花，记录了姜思达、半佛仙人等新锐们的大冒险； 新职场 也是我们努力进入的一个奇妙场域，助浴师、职业伴娘，被大厂辞退的姑娘与逆行择业的其他后浪，都给了我们新的启示：在躺平与内卷之外，还有无数条路可走； 新新人类 也是我们的重点关注对象，做老板的00后，在校做兼职月入十万的大学生，后浪们的威力不可小觑。 今天，我们精选了 2022年「后浪研究所」那些好玩又有意思的文章 ，更重要的是，我们还选取了可爱的读者们的留言，并附上后浪编辑部的回复，这是一份新年礼物，更是我们一起走过2022的年度共振。 新一年开始了，祝你，兔 Be Better，兔 Be Yourself。 还请继续关照哟。 （前排提示：以下内容点击文章标题即可跳转至原文。） 新主张 比起按套路出牌，他们更是反套路的提倡者。 1、《一个90后不用手机的365天》 @哈希不可逆 让普通人远离手机，正如让美国人远离垃圾食品一样。不是个人选择的问题，而是在社会环境上的阻力，是成体系的问题。即使是web3时代实现，没有专业知识的普通人可以做出的选择也不过是随波逐流。我认为社会环境的改变应该是大众意识的觉醒，技术永远在，可是使用者呢？ @6+7💤 戒断的第58天，卸载了微博、知乎、豆瓣，关掉了朋友圈。由最开始的强制切断对外界的关注到现在的不好奇外界发生了什么，最大的感受是“净”：纷杂的信息流减少了，信息引发的焦虑减少了，欲望也减少了。但同时也有一些尴尬的事情发生：比如安倍遇袭这件事是在一个运动相关的app上得知的；再比如聊天时对方经常会发出“你难道不知道XX事情吗？” 离开了社交媒体，一个现代人变成了山顶洞人。 @YANG 我以为是诺基亚的广告：） 杨柳回复： 第一次听到“数字极简”的感念，感觉如获至宝，是当下信息过载的一剂良药。仔细了解才知道，“数字极简”的意义，并不在于完全戒断智能手机或社交媒体，而是通过一个阶段的“断舍离”实践，逐渐找到科技带来益处的刚刚好的平衡点。哪怕是一周或一个月的体验，也是迈出了改变的一小步。 2、《一个男生的「女装实验」：穿裙装出门会发生什么？》 @陈强Johnny 作为男性以及3岁女儿的父亲，看了这篇文章之后开始反思自己日常生活当中是否有不自知对女性的傲慢无礼。希望我们共同努力让这世界如小寇所说，往美好的方向推一点点。 @慎独 前两天穿短裙和爸妈去火锅店吃饭，次日妈妈说好多男的来回盯着我的腿… 我大大咧咧的，根本不在乎异样眼光，但是看到妈妈一脸担忧的样子还挺心疼 现实环境总让女生们时不时产生犹疑，短裤短裙到底能不能穿出门呢？ @一点都不生动形象的描写阿犀的小月 看哭了，真的很感动有男生愿意用这样的方式去感同身受，试图与我们女生共情。想说一些话，有些凌乱。 1、在座有女朋友的男生，你们应该都不希望自己的女朋友穿吊带裙露脐装超短裙超短裤等出门吧？ 然而你们却又希望看见满大街的女孩们穿着清凉“供”你们“把玩”，有可能你们尊重自己的女朋友，这只是因为这是属于你的（说得难听一点打个比喻）物品被他人亵玩，好听点叫爱，难听点叫占有欲。扪心自问，你们是不是这样觉得的？ 2、而我们女生，只有和男朋友或者靠谱的男生朋友一起出去玩的时候才敢穿自己喜欢的短一点、露一点的漂亮裙子，才敢把自己的身材大大方方的秀出来，因为我们怕，我们怕在地铁上公交上被猥亵后还被指责说：“是你自己要穿这么暴露，要怪就怪你自己。” 我们的心理压力甚至比生理压力还要大。 3、多少女孩子长大了还含胸驼背，都是源于青春期的女性特征的“羞耻感”，多少女孩子在青春发育的时候被男同学嘲笑，为了躲避这种“玩笑”开始含胸，再也没有提胸抬头大大方方的走过路。衣服的胸围越做越小，腰围越做越小，网购的时候看到最离谱的一件衣服腰围58胸围75，这是什么？这是做给人穿的衣服吗？这是当今社会做给成年女性穿的衣服。 玉米回复： 这是一个很尖锐的话题，在文章发出前我还一直跟小寇聊，会担心他的行为被误解和攻击。但很感谢的一点的是，后浪的读者们对于这个话题都很有共鸣， 而且都能够理性地讨论，在评论区也看到了很多男性朋友的反思，这一点很重要。在现在这个充满矛盾和斗争的舆论场，包括男性凝视在内的女性话题，其实想要去和和气气地讨论是一件很困难的事情。但有这样的一个故事，一个人物的行为，能够去触动到大家，作为作者，我是非常感激的。也很希望小寇的故事能够让大家对于不同性别之间存在的差异和要逾越的鸿沟多一些认知和改善的努力。 3、《厌恶婚礼的年轻人：只领证，不办席》 @太阳当空赵 重要的不是收份子钱吗？ @心悦拾怡 说份子钱的，实际上浙江这边婚礼都是亏钱的，收到的红包根本抵不了开支....我妈说，这不是份子钱，叫送人情，如果结婚不请亲戚，等于默认断来往了。 @秋水无尘 以后都不大吃大请就好了，没多少人是真正祝福你的， 传统婚礼的目的一是收债，二是通告，三是面子，真没有多少是给自己的。 嘉婧回复： 逐渐发现身边有很多不想办婚礼的新人，大家达成一个共识，办婚礼，从物质上说收不回来钱，从精神上说也得不到真诚的祝福，只有从面子上说，是为了给父母亲戚朋友一个交代。婚礼这个议题，最终还是要回到两代人之间的博弈上。 4、《在四线城市生活，拿一线城市工资，是种怎样的体验？》 @打酱油的三哥 风险太大，其实数字游民话说白了就是线上自由职业者，但是在当前全球经济不景气的大环境下，收入不稳定的劣势会被放大，不仅会对自身收入及生活条件造成影响，也同时会对心理产生不利的影响。 @luo xinyuan 有这个能力的我觉得真的可以试试的。说白了孩子长大了也不过是重复你现在的生活而已。 @方方 有点故意营销的意思，其实这种概念劳动人民早就想明白了。 那些西部偏远 农村乡镇的人背井离乡去北上广打工，再把钱拿回家里给老婆孩子用，不也是一个逻辑吗？用高收入 低成本来提升生活质量。 另外个人感觉 其实不用特别区分什么行业工作，当经济能力足以支撑正常开销的时候，任何工作都是值得的。 长辈或许觉得铁饭碗是最好的，但你创业能一年挣一个小目标，他们还会这么认为吗？ 小彤回复： 2021年的时候就在豆瓣上看过Jarod创建的“数字游民部落”小组，那时候的我也以为数字游民不就是换着地方旅游的远程办公吗？直到开始操作选题，和几位受访者聊过之后，才意识到远程办公只是一种工作形式，而数字游民追求的是生活方式。在我们都在被稳定的工作、高昂的薪资、属于自己的房子和未来养老环境而裹挟的时候，还有这样一批人可以不被束缚地去做自己真正喜欢的事情。 新选择 浪花们的新动向，数据都看到了。 1、《压力最大的城市，北京排不进前五｜2022年轻人解压报告》 @吭吭吭～ 别来成都，现在卷的一批，工资还低，6月份离职至今没有找到工作。 @陈式坚 居然没有厦门？？？房价全国第四、工资还低得很。每年还吸引一堆的年轻人来，4000的工资，住2000块的城中村。我觉得真的很可怜……这压力不爆表？还是说已经是温水青蛙了？ @RockyJay 在深圳经常能看到街头吵架。 嘉婧回复： 自己所在的城市永远是“解压陷阱”，别人家的城市永远是诗和远方，这就是围城啊。 2、《攒钱目标最猛的城市，北京只能排第三｜2022年轻人攒钱报告》 @zmf-Johhny 我25岁的时候，月薪也没过万，然后我妈说我的性子存不住钱的，不如你买个买个房，就当定投了。然后我就带着父母给的钱和自己打工一年存的2w在老家付了首付，紧接着就开始月月还贷。 现在我这套房子比我买时 亏了大概15w的样子，我还欠银行几十万。 @大露 深圳挣钱深圳花，一分别想带回家。 @Nina 有没有可能， 慢慢的消费主义已经骗不了现在的年轻人了， 所以才会出现很多花不完的情况， 消费越来越理性， 才会越来越多人会知道攒钱。 文聪回复： 都说一个成年人最顶级的自律就是存钱，但更多时候， 存款数的多少真的无法和自律与否强关联，生活中总有太多的变数和不确定性。 但令人欣慰的是，越来越多的年轻人将攒钱视为这个年龄段的重要计划。攒钱这个行为本身，就是我们面对未来的一份努力。 3、《2022年轻人买房报告：「30岁买房」的梦想，六成90后没能实现》 @xiao_full 90的，15年的时候，爸妈在一线核心区全款给买了一套新房。16年打算自己多供一套小的二手，结果突然开始了单身限购。至今还被限着哈哈哈哈！ @星星泡饭 想买房，被催婚时候的底气，我可以一个人过的很好，虽然2个人可能更好，但我有足够的底气等待。 @Achi 网络上：父母皆祸害，现实里：买房靠父母。 杨柳回复： 已经30岁的我，是六成没能实现买房梦想的年轻人中的一员，边做买房选题我边在想，已经北漂三年的我离买房依然遥遥无期，但是看到这么多人和我一样，又感到深深共情。 4、《2022读书报告：年轻人最爱的畅销书，《活着》《三体》都没能超过它》 @菌猿 恭喜《乌合之众》成为乌合之众最爱看的书。 @文默 真有这么多人看书咩，一直以来高中大学工作身边都没几个，而且人均二十本，不低的耶，我平均每年阅读250小时吧，每天午休和晚上睡前看会，三年也才看了80来本这样~很多时候找到个能分享的人都难！ @MoHn 其实能关注后浪的，并且会去填这个问卷的人，大部分还是愿意去读书去思考的，所以这个数据不中肯。不过我爱看~ 嘉婧回复： 感谢读者朋友们的肯定，怀疑参与后浪调查的人都是爱读书的人，或者没有读完一整本也算作读过，算出人均20本的数据我们也很惊讶哈哈哈~ 新冒险 记录新生代创新者的真心话和大冒险。 1、《姜思达，「匪徒」创业》 @龙树 看到有人这么勇敢，为他感到高兴啊。也为自己有这样的内容工作者感到高兴。 @小鱼子子 从奇葩说开始关注的姜思达，比起以前的锋芒锐利，如今思达看起来确实是收敛了不少。每次看到他，我都觉得 “原来人生是不需要条条框框的”自由的灵魂最高贵！ @何万凌 加油姜思达，不过不加油也没关系。 巴芮回复： 姜思达算不上传统意义上典型的创业者，他最出彩的地方在于内容的独特性，他们因此在内容领域活的自在而精彩，收获了许多高质量受众。而更幸运的是他有一个适合管理团队的稳定的好搭档。 2、《半佛仙人：骚人有骚福》 @twotwo 四个字形容半佛，那就是“人间清醒”。 @达拉崩浩然 不只是半佛的文章，他的采访都是这么的有趣。 @ioi 绝了，发到群里我说这是我老婆结果大家都在问这是不是打电竞的。 巴芮回复： 一个灵活柔软满嘴骚话却将行业道理人间世事讲得通透的“胖子”，擅长自黑，因为他太了解人性，当自己的姿态足够低的时候，他总能赢得别人的谅解与喜爱。 3、《二代接班，一场父与子的「明争暗战」》 @Cancer 其实一句话“距离产生美”真的很适合，在职场上由于亲情关系可能更会掣肘到需要考量利益的场景，因此二代接班家族往往没有想象中那么简单。 @程和生 二代们还是太年轻，觉得成事太容易，不知一代爹们帮他们挡了多少不必要的废动作。 @多肉槑槑 为什么我一个工薪阶层出身大学生看这种“豪门困扰”看得津津有味。 巴芮回复： 一个真实且精彩的当代豪门商场战事，从父子亲情到公司决策，两代人之间的关系在多个维度拉扯较量。主人公包东升是我今年遇到的最为坦诚的受访者，也是在接班这件事上思路比较清晰的二代。猜测接下来的几年这种企业换帅的故事会成为商业世界中的重头戏。 新职场 在躺平和内卷之间，确有无数条路。 1、《给300多位老人洗澡后，我所感受的尴尬、疾病与衰老》 @J. 不了解助浴师，但是非常愿意购买这样的服务~确实老人需要得到更多的关怀。 @则宁ZN 在衰老面前，没有谁能活得有尊严。 @Miller 老人认准的不仅仅是机构，更是那个能给予他慰藉的人，从商业的角度，机构如何能将助浴师的个人软实力转化成机构本身的软实力呢？ @清丹 我看到一半就流眼泪了。同时感慨文章中的从业人员的坚持和爱心。真诚希望全国每个大小城市、乡镇都普及推广这项事业，造福更多失能老人，活得舒服和有尊严。另外，我很愿意从事这项工作！ 玉米回复： 助浴师这个职业关乎的是每一个人类老去的尊严问题，我们总有那么一天，也会面临着行动不便、疾病产生的问题。但总是因为这样或者那样的原因，失能老人的洗澡问题是没有被重视的。采访当天和助浴师们去体验了一次，现场给我带来了很大的震撼，我想到了自己的爷爷奶奶，也想到了未来的父母和自己，正是基于这样的共情，在采写中我也投入了一些自己的情感。不过粉丝朋友们也在评论区讨论了很多，关于收费与一些可能存在的法律问题，在后续的了解中，文章采访的助浴师团队也在各方面有了新的升级和改进。我相信，未来会有更多专业的助浴团队，为晚年生活，带来洁净和有尊严的服务。 2、《00后职业伴娘：出租自己40次后，我成了伴娘们的幕后老板》 @不染 找朋友做伴郎伴娘，结完婚友情走到尽头的也不少。不必考虑人情，找一个有职业素养的“婚礼助理”挺不错的！ @June. 有没有一种可能:随着初婚年龄推迟，婚礼不需要伴娘伴郎了。 @Tony-Yu 长期看这个业务应该发展成to B的比较好，就是为大的婚礼策划公司一类的企业公司来提供人力，而不要长期对个人，否则收入不稳定，累且麻烦多。 杨柳回复： 随着社会职业向细分化发展，未来任何事情都可以交给更专业的人去做。生活处处皆机会，只是缺少发现的人。 3、《逃离大厂、二胎博士、985毕业捡破烂：躺平和内卷之间，还有无数条路》 @美穗miho： 25-30是这些年轻人认为的最佳结婚年龄吗？？看来中国圈层果然不相通啊。 @mycidea： 如果总想让别人理解你，那会很痛苦；如果试着理解别人，那会很平和。 @Hz： 每到晚上我就会习惯性抬头望向月亮。但白天睁眼后，又会去低头捡那六便士。 永旺回复： 如果你的大部分选择与多数人一致，冲在人流中争先恐后，这没问题，更无可厚非，你正行走在多数人支持的道路上，你不是孤身一人。但，如果你的选择跟大多数人不一样，看起来好像所有人都顺着一个方向走，你却孤零零逆着人群走，我们想说， 你没有落后，而是正生活在自己的时钟里。 4、《一切好运，从被大厂辞退开始》 @Amrin 第一次出国就是去清迈，住鱿鱼家民宿，还记得她给我推荐好玩的，带我去吃当地好吃的，联系好多小伙伴参加宋干节，打水仗，开朗活波又有主见印象特深刻。我想以后有机会一定会再去她那，去他们的木目！ @Ron Liu 人生长着呢，想想我们初入职场的时候不都觉得未来有无限可能吗？这才过了几年呀？大家都要鼓起勇气，努力追求自己的梦想呀！ 杨柳回复： 故事的主人公鱿鱼是我朋友圈里活得最精彩的那一类人，跟她聊天总觉得能量满满。而她讲述的这篇故事几乎囊括了她的多彩人生：被大厂辞退后自己创业，在异国他乡遇见命中注定另一半，经营的民宿经历疫情后又恢复生机。现实版《去有风的地方》大概就是这个样子？ 新人类 不被定义的00后，惊喜不断。 1、《当00后开始做老板：佛系、平等、「无组织无纪律」》 @Pharmer 我看到了统一的一点：有金可氪，无家要养！ @杰 Leo 这些都是创业初期的样子，中期、后期看看，创业一次路过，前面都是大家来做朋友，后面压力大了，效益不好世界就是灰暗的。 嘉婧回复： 当00后整顿职场时，00后老板已经在创造一种新的工作模式了。 2、《职场吵架真相：超半数年轻人正面硬刚，00后不敢「整顿职场」》 @石齐岸 别说正面吵架 以前见过两个精英业务员（年薪百万+）打架。其中一个还是打副总经理，后来那个副总经理私底下夸奖他说这个人有真性情，怪不得业务做得好…… @宁夏 怎么说呢？你是去打工的，不是交朋友的，不要妄想和同事做朋友，亲测有效，少加群，不说话，没朋友，职场困扰至少降低80%。 @盛凱利的理想世界 还00后整顿职场，那是因为00后还不害怕没工作，等车贷房贷还需要养家的时候，就忍气吞声了。 大倪回复： 成年人的职场不存在「整顿」，到处都是「妥协」。也许职场关系的本质就是共赢，无论是冲突矛盾还是正面沟通，达成目标、解决问题才是最关键的。 3、《00后兼职大学生：靠爱好赚钱，走出校园前已月入10万》 @程瑶 我是按部就班读书毕业进公司工作的，看到这四位同学的故事很受启发啊，我有很热爱的隐藏技能或许可以发展一下。 @琳达 作为一个95后已经深深感受到后浪带来的巨大威力，我不觉得是赚快钱，任何一个赚到钱的技能都需要长期练习，能做、想做、做得好都需要投入精力，工作了两年以后发现，赚钱能力才是最稀缺的能力！ @黄章苏（放假回复慢） 我，00后，玩加密货币赚了上百万，正纠结买什么车的时候，闹钟响了，该死！ 杨柳回复： 我，90后，北漂多年没啥存款，报道月入10万00后，啥都不说了，今年好好挣钱！ 本文来自微信公众号 “后浪研究所”（ID:youth36kr） ，作者：后浪编辑部，36氪经授权发布。 本文由「 后浪研究所 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： IC photo +1 41 好文章，需要你的鼓励 后浪研究所 新锐作者 30 收 藏 +1 2 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.132 有数据，有观点，有真相，带你回顾过去一周商业大事