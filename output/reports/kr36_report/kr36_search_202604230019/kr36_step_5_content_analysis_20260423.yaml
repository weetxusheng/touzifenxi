          summary: '2025年以来，深度智耀销售订单额已近10亿元；公司连续多年实现盈利。'
          text: '智能体“军团”进入临床试验，北大校友四个月融了2亿美金、估值翻6倍-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 智能体“军团”进入临床试验，北大校友四个月融了2亿美金、估值翻6倍 胡香赟 · 2026年04月13日 08:30 2025年以来，深度智耀销售订单额已近10亿元；公司连续多年实现盈利。 文｜胡香赟 编辑｜海若镜 “医疗健康产业正在经历它们的chatGPT时刻。”3月结束2026GTC大会上，黄仁勋再次提及AI落地新药开发场景，正带来巨大机会。 近日，据外媒报道百图生科、华深智药已启动IPO进程；中国创新药产业链上，拿到阶段性结果的“AI原生公司”受到资本青睐。其中，AI临床研发服务公司深度智耀的融资节奏更引关注。 去年12月至今年3月，这家公司接连官宣3笔D轮系列融资，累计募资接近2亿美元。 据了解，当前深度智耀估值已达到数十亿美金，与去年年中相比，估值涨幅超6倍； 且正在推进新一轮Pre-IPO融资。 另据公司介绍，公司近两年拿单量、业绩增速很快。2025年以来，销售订单额已近10亿元；2026年前两个月的订单已超过了25年全年。且公司已连续多年实现盈利 。近期的融资中，红杉、鼎晖百孚、新鼎资本等老股东几乎全员加注，每一轮都“实现超募、交割迅速”。 在药物早期发现环节，用AI优化药物分子结构，已广泛嵌入药企研发的工作流。为了提高药物开发成功率，业内渴求AI能在中后期的临床试验环节发力。时至今日，AI智能体的技术与能力，让行业感受到了“硅基科学家”加速临床试验的潜能。 深度智耀成立于2017年，创始人、CEO李星毕业于北京大学药学院，曾供职于强生、辉瑞等企业，拥有10余年在跨国药企做新药开发的经验。初期，深度智耀从医学写作场景切入，为药企提供临床试验文件撰写等服务。十年间，公司历经了技术演进和资本周期的跌宕。 有早期接触过深度智耀的行业人士提及，2022年大语言模型横空出世之前，医学文件经“机器处理后还需要人工校验，客单价低、经营效率不算高”。但如今，“AI智能体”驱动下的AI+CRO业务面貌，已截然不同。 “一直以来，李星有个理念：‘一切皆文本’。药物研发的全流程，是靠知识、文本和数据贯穿，递交临床试验申请、注册上市等各环节，交互的载体也是文本。但我们真正关注的，不是某一份文档写得更快，而是这条证据链如何被更高效、更准确地组织起来。”深度智耀业务副总裁陈舸告诉36氪。 当前，深度智耀构建了“AI智能体系统”，尝试自主执行、交付临床试验方案等多种文本。更具想象空间的是：临床任务交付过程，也是训练迭代AI、使其在海量临床试验数据中具备自进化和强洞察的过程。 AGI的东风到来之前，深度智耀曾沉寂多年。而当技术窗口打开，此前沉淀的数据和对行业痛点的理解，让它恰好坐上了牌桌。那么，深度智耀为什么获得资本追捧？它当前的业务模式和核心能力是什么？ 临床试验AI智能体“军团” 回到根源上，临床试验业务涉及大量数据采集、分析和管理，需要众多有经验的专业人员配合，反复打磨。协同复杂、耗时长、成本高，是药企临床开发的主要痛点。 AI技术浪潮中，“临床试验数字化”一直是重要应用场景。过去数年间，临床试验领域已走完初始的信息化、数字化阶段，只是由于参与者众多，以及法规严格约束下的产品同质化，市场严重内卷。 但药企的需求持续存在。如果能利用AI模型，挖掘海量临床试验数据价值，减少重复而繁琐的人力劳动，提高产出效率、加速研发，药企仍有付费意愿。市场调研机构Market Research Future称，到2035年，全球AI临床试验市场将突破243.7亿美元。 尤其是2022年之后，ChatGPT为代表的生成式AI爆发，技术奇点到来。深度智耀也开始接入大模型、自研AI原生多智能体系统，既往通过交付医学文本类项目所积累的know-how，被进一步工程化为系统能力。 深度智耀方面提供的数据称，目前累计已服务超1000家药企，交付项目40000余个。 “这是个比较巧妙的思路，”一位跨国药企研发人士评价：“ 临床文本服务团队能接触到的临床研发相关数据文件非常丰富；且临床文本服务团队介入时，药企已完成更核心的科学论证和策略制定部分，单个项目工作周期并不长。这意味着他们能持续、快速接触不同研发领域的标准化Protocol（临床试验方案）和CSR（临床研究报告）文本，基于此做AI系统，逻辑是顺畅的。 ” 2025年，从技术架构上，深度智耀搭建了一套“仿人脑思维的AI原生多智能体系统”。彼时，这是医疗企业鲜少会提到的概念。 原本，AI公司主要依靠扩大参数量、丰富数据库提高预测准确率，但制药领域存在大量普通数据库覆盖不到的信息，这就容易造成“幻觉”。 为此，深度智耀换了个思路，不只是靠堆砌数据量，而是仿照人脑“拆解任务-持续反馈”的思维过程搭建系统，并设置训练、推理、交叉验证和后处理四层防护机制，从流程设计上避免“幻觉”发生。 在这套框架下，传统临床试验包含的注册申报、试验设计、临床运营、数据管理、统计编程等一系列复杂临床医学逻辑，被拆分成以“万”为单位的模块，并逐一开发相应的智能体： 比如负责整体临床方案设计的Protocol Agent、执行统计分析的Statistical Agent、保障合规的Regulatory Agent等，参与临床试验方案等内容的生产。 以Protocol撰写为例，它是整个临床试验的核心。传统方法中，这是由临床专家/主要研究者（PI）、统计学家、CMC专家等合力完成的任务，需要数月时间完成。深度智耀的多智能体系统则是将撰写Protocol任务拆解后，直接交给承担不同专家角色的Agent，由它们来理解试验背景及目标、设计方案框架，接着完成自动撰写、格式校对，并按需完成多语种适配。 这个过程中，不仅人力和时间成本得以缩减，AI智能体系统也可能凭借数据积累，为人类专家提供新思路，比如自动生成有利于监管沟通会议的论述材料等。 由AI智能体提供know-how，这是深度智耀的技术亮点所在。很多新药研发项目失败，并非是科学设想不够先进，或缺少数据，而是 因为从临床前机制研究到临床试验之间存在大量断层，导致该药物没被用在正确的人群、正确的终点，或通过正确的方案将其潜在有效性验证出来。 从这个意义上说，AI临床CRO的真正价值，并非单纯的降本增效，而是深度嵌入患者分层、入组预测、研究中心选择、终点优化等关键临床环节，帮助整个临床开发更早暴露错误，并改正。其本质不是简单替代人工，而是降低关键决策节点的错误率，提高证据生成、整合的效率，进而增强从分子到患者、从机制到临床获益之间的闭环能力。 陈舸介绍，早期，深度智耀曾专门设有“AI架构师”职位，负责根据具体项目调用不同Agent，但如今已逐步实现由系统自主调用Agent、参与交付，“最终由专业人员审阅、签字、放行”。 按结果付费，中位客单价数千万元 随着AI多智能体系统的落地，深度智耀可承接的业务范围也随技术成熟大幅扩容。陈舸介绍，2023年左右，公司的AI系统已可以交付Protocol、CSR等比较典型的单个场景的文本内容，输出结果“准确率达到90%以上”。随后便逐渐切入临床试验“整包业务”，承接CRO类订单。 这种承接临床试验全流程“整包服务”的模式，直接给深度智耀带来了商业模式转变，公司得以开始执行按交付结果收费。 从最直观的角度，这首先意味着客单价提升。创立之初，深度智耀的单点位服务的订单体量较低，从几万元到几十万元不等。因为它本质上没有脱离传统AI辅助研发服务的逻辑，虽具备一定拓客优势，但收入天花板明显。 但如今，AI技术带来的服务体验和效率提升，让药企客户愿意把“管线的整体研发工作交给我们”， 中位客单价也随之突破至数千万元 。同时，2025年下半年开始，这种“整包业务”量也开始大幅增长，且“交付概率高，效率远超传统人力密集型的CRO服务”。 医疗行业天然带有强监管的底色，因此无论企业还是医疗机构，在面对创新技术时，态度往往都比较审慎。前述跨国药企人士也提到，AI模块化写作虽已是比较现实的应用，大药企内部如今都在用，但现阶段实操中，更倾向让它撰写重复性内容，如内容填写、前后文中的专业表述对应等。“涉及描述性内容还不是很信任AI，对于AI直接生成的Protocol初稿类内容，使用时会比较谨慎。” 那么，深度智耀是如何快速取得合作方信任、实现订单增长的？ “我们不打价格战，”陈舸表示：“而是通过提高售前体验取得客户的信任。”比如，在与药企客户初步接触时，深度智耀会先利用AI智能体为客户提供做出临床方案决策所需的资料，比如管线调研报告、初步方案论述及具体分析对比，甚至可以根据反馈继续修订方案。“这些方案不是模板化输出，而是结合项目实际情况来定，个性化程度高、完整度也高。我们的系统通常几小时就能完成一轮高质量迭代，不会显著增加内部负担，也能让客户更快建立对我们效率和质量的信任。” 这种先交付价值、再谈合作的方式，在一定程度上降低了合作方的决策门槛。陈舸提到，不少潜在客户原本只是计划将优先级不高的管线交给深度智耀试水，但在接触和验证之后，却“愿意达成全面战略合作，甚至把所有管线下一阶段的相关需求整包出来”。 陈舸透露，近期，公司刚刚拿下一笔接近2亿元的大订单，负责药企客户多条管线的全球多中心临床CRO业务。“我们预计当年确认收入的比例可以达到七成以上，这将直接带动今年的业绩增长。” 与此同时，跑通临床试验阶段整包业务只是第一步，深度智耀也已将服务向临床开发的前后两端延伸。“技术能力是共通的，只是商业场景有变化。理论上，如果AI知道临床试验阶段的哪类药物更有希望获批，那它在临床前靶点发现阶段也一定足够聪明；在营销端，也会知道怎样指导医生合理用药。”陈舸解释。 近日，深度智耀还表示，2014年诺贝尔生理学或医学奖得主、挪威神经科学家Edvard Moser将以非执行董事身份加入公司，意在“从更多维度探索AGI时代公司模型和智能体的能力边界”。 “当前，不少头部AI公司都在探索核心业务之外的跨界方向。 因为，AI时代的业务服务边际成本相对较低、赢家通吃效应更明显，其核心成本是token消耗量，而非传统企业那样的异地扩张，或牵扯更繁琐的管理问题。 在制药领域，我们相信未来的新药上市成本和链路会逐渐缩短，很多原本难以改变的传统会被颠覆，这是我们对行业竞争和未来发展的判断。”陈舸表示。 本文由「 胡香赟 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： AI生成 +1 0 好文章，需要你的鼓励 胡香赟 新锐作者 12 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.279 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 智元机器人，要做AI大模型平台和开放生态 AI PC下半场，荣耀想让所有人先用上消费级龙虾 新加坡的AI征途：孕育下一个“硅谷” 《明末》团队解散背后，国产单机究竟还缺什么？ 创业老炮vs00后，谁是下一代“一人公司”的标准样板 一群00后极客和这家机器人公司共处72小时 “医药界英伟达”，花200亿买中国AI公司的减重药 高端纯电，车企苦寻破局「命门」 杨植麟/张鹏/夏立雪/罗福莉/黄超，谈龙虾，谈“Token经济学” 胡香赟 新锐作者 这个人很懒，她没有写简介 发表文章 232 篇 最近内容 押注AAV体内CAR-T，「西湖云谷智药」即将启动IIT研究 16小时前 智能体“军团”进入临床试验，北大校友四个月融了2亿美金、估值翻6倍 2026-04-13 耀速科技获2亿人民币融资，将“AI+器官芯片”嵌入新药开发流程 2026-04-09 阅读更多内容，狠戳这里 下一篇 中年创业者困在债务里 他们曾抓住过时代的红利，也迎面撞上了时代的风浪，最后在远离年轻、靠近退休的40岁上下，负债前行。 2026-04-13 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
