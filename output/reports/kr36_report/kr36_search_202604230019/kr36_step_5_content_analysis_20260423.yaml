          text: '七天挣百万，短剧演员的改命之路｜深氪lite-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 七天挣百万，短剧演员的改命之路｜深氪lite 兰芥 · 2025年12月08日 12:21 从赘婿到刘萧旭，短剧行业三年巨变。 作者 | 兰杰 编辑 | 乔芊 11月25日的太原武宿机场，被人群围得水泄不通。 他们为了短剧平台红果的创作者大会而来。机场行李转盘处的十余块大屏上，是短剧演员王格格的应援海报——这里的广告只能一周起投，价格需要数万元；还有粉丝花费数千元换取一个进场名额，但这次活动其实根本没有开放售票。 一辆车身贴满演员张翅写真的红色大巴，从上午十点半到下午六点半一直在活动场外绕行。它是粉丝们豪气包下的，并不用于载客，只为了能让更多人看到车身上的演员。 王格格和张翅，是受邀参加红果创作者大会的数十位短剧演员中的两位。他们之中，如今最声名鹊起的是刘萧旭，他凭借9月上线、播放量突破40亿次的新晋爆款短剧《盛夏芬德拉》，成为短剧界顶流。主办方红果特意安排刘萧旭在红毯环节压轴出场。 相似的追星场景还出现在了11月初横店的微短剧之夜上。 将时间的指针往回拨三年，这幅景象是难以想象的。那时候，没有任何一个奖项、晚会或是长剧，会让短剧演员们成为主角。 主角们仿佛咸鱼翻身。有过爆款剧集傍身的短剧演员，日薪从数千元提升到了数万元，并且开始接数百万元的商务代言。长剧行业也开始向这些曾经并不在意的存在，抛出橄榄枝。 粉丝们也为之冲锋陷阵。《盛夏芬德拉》大热，作为另一位短剧顶流柯淳的忠实粉丝，浅夏在网上发现了大量拉踩的帖子，充满了“柯淳凉了”、“柯淳比不上刘萧旭”的论调。她的工作之一就是举报这些负评，同时发布好评。她所在控评群有近200人。 一位资深影视行业人士向36氪表示，如今短剧顶流的地位，与传统影视行业的二线乃至一线演员相当——相较于以往短剧与长剧乃至电影有“壁”的状态，破圈的爆款作品为短剧演员贡献了一块敲门砖，“把握住了又能抗流量，就可以成为一线演员。” 三年前，在强行“降智”的短剧时代，演员只是流水线上微不足道的人。直到好的剧本、角色和镜头语言出现，短剧演员才真正拥有了姓名，以及声名。 无人在意的短剧演员 历史总是惊人的相似。 1910年，电影已经开始受到华尔街资本的青睐，但演员在美国乃至世界的地位却很低，以至于有旅店公然悬挂"狗与演员不得入内"的告示。这种歧视性待遇迫使演员们拒绝在影片中署名，制片厂老板们乐见其成，因为这能有效遏制演员片酬的上涨。 但这些无法阻止观众们对于演员的喜爱，他们干脆用制片厂的名字给自己喜欢的演员命名，“维太格拉夫女郎”“比沃格拉夫女郎”等称号应运而生，弗洛伦斯·劳伦斯就是当时的“比沃格拉夫女郎”。 精明的美国电影制片人卡尔·莱姆勒由此嗅到了商机，这位深谙营销之道的策划者，先是炮制出弗洛伦斯“意外身亡”的虚假新闻，待舆论发酵后，又安排本尊现身辟谣。这场精心策划的“生死闹剧”成功引起了整个美国的关注，好莱坞首位真正意义上的明星就此诞生。 回看短剧明星崛起的过程，与电影行业颇有些相似之处。 2023年初，短剧行业的草莽之色还未褪去，靠着粗制滥造但足够爽的内容，创造了一个新的风口。 也是这一年，脱胎于番茄小说的红果短剧横空出世，凭借免费模式和大力出奇迹的投流手段，验证了字节模式的又一次成功。 有接近红果短剧的人士向36氪表示，番茄小说和红果短剧业务负责人张超的风格，是谋定而后动，他喜欢做那些被行业验证过的、成功的生意，短剧就是这样一门生意。为了抢夺用户，彼时的红果短剧团队成功申请下来了1000万元/天的消耗预算，不计亏损。 后来的故事已经行业皆知——番茄小说用了四年的时间，实现了近亿的日活和近2亿的月活，而红果短剧追上这一成绩的时间，不过一年多。 对比之下，2023年的电影市场还未从疫情的打击中恢复过来。长剧行业押注需要重金投入的S级剧集，却被短剧这一七天完成拍摄、月余就能回本的新事物，打了个措手不及。 演员刘博洋就是在那时候进入短剧行业的。 对于科班出身、有过传统影视拍摄经验的刘博洋来讲，那是一个落差极大的场景。 以往拍电视剧时往往有上百号人参加的开机仪式，在短剧这里变成了十几人，蛋糕、水果、幕布、红包和专业的拍摄设备都没有，只有两台单反相机孤零零地立在那里。一股巨大的恐慌感涌上他的心头，“我是不是在退步？”刘博洋如此想到。 开机仪式上的合照环节，摄影师大喊“3！2！1！”，刘博洋却第一时间低下头，他当时最怕的就是拍照，怕合照被发到朋友圈里后有熟悉的人认出来。 这还只是一个开始。“非常之离谱”，刘博洋回忆那时候的短剧剧情，他需要对女主扇巴掌、掐脖子，还要让女主给女二女三换肾换血。 到现场的第一天，他就向导演抗议，说这个本子不合理。导演回应他，“我也知道不合理，但没办法，这就是一个任务。” 无数任务落到剧组里，让刘博洋难以消化，也成就了行业的黄金时刻。 将节奏调到最快，以情绪为核心的短剧，在2023年创造了8天流水破亿的商业奇观，整个行业规模相较于去年同期膨胀了近3倍。 但那时候短剧的商业模式并不健康，80%-90%的收入要用来投流，制作方和发行方分剩下的为数不多的那部分，为了多挣点，大家只好尽可能压缩拍摄时间。 这背后是整个行业的过劳，包括演员。 从2020年毕业到2023年，刘博洋经历了整整三年无戏可拍的情况，进入到短剧行业之后，他不敢停下来，也不敢挑本子。 2023年年中，每天只能睡两三个小时的生活，刘博洋过了三个月。拍短剧之初，为了完成繁重的拍摄任务，他需要凌晨五点起床，拍到晚上快十点甚至半夜两点，回到酒店还要看剧本准备第二天的戏份。 那时候恰逢歌手李玟去世，他形容彼时的状态——极度疲惫之下，“脑子是空的，没有情绪，也没有任何欲望。” 同为演员的李婧也有类似的感受。她戏称，短剧演员是没有“拉屎自由”的——在拍摄现场，去厕所是需要请假的，久一些就会有人来催。怕耽误拍摄进程，她宁愿少吃点东西，尽量不在拍摄的时候上厕所，或者挤在十几分钟的吃饭时间里一起解决掉。 与这种繁忙、高产的状态形成对比的是，人们记得2023年充值过亿的短剧叫《无双》，但却记不住屏幕里做出夸张表情的演员们姓甚名谁，更重要的是下一个巴掌何时响起。 与传统娱乐圈普遍用老师互相称呼的情况不同，短剧拍摄现场更多是用女主、男主、女二、男二这样的称谓叫人。那时候短剧拍摄的时间太短，平均七天可以拍完一部，工作人员也在不停地换，演员可能要同时跑多个组，记住名字太难。 一位短剧编剧还告诉36氪，在短剧创作过程中，有着不成文的权力排序，除了离钱最近的投资方以外，编剧是最具有话语权的，因为付费时代每一个刺激用户拿钱的“钩子”都是编剧埋下的，演员则排在这个链条中的最末端。 但从2024年下半年到现在，一些情况正在改变。 超级明星的诞生 在弗洛伦斯·劳伦斯的故事里，粉丝的喜爱是巨星诞生的起点，短剧行业也不例外。 11月初横店短剧活动的现场有过这样一幕——四五位从外地赶来、看起来已经五十余岁的中年女性，围守在短剧演员离场的通道出口，她们手捧大束鲜花，身旁还放着装满应援物料的行李箱。 黑车已经往返接送了五六批客人，她们依然耐心等待。当被问及喜欢的是哪位明星时，一位粉丝亮起的手机屏幕已经给出了答案。 数小时后，目标演员终于出现。她们开始大喊“乖乖”，无视保安的询问，灵活地绕进场内，将那位演员团团围住。 横店微短剧之夜散场后，几位中年女性与偶像正在合影，作者拍摄 作为短剧演员的白野，今年以来也有过被追的经历。 一开始，白野还以为是隔壁剧组相识的工作人员在叫她，但是穿过人群，她看见的是两个陌生的、打扮精致的女生。 这是两位从杭州到横店来探班的粉丝，她们一直安静地隐在人群中。直到白野结束了一场戏的拍摄，准备换场的时候，她们才开口叫“小野”，白野的昵称。 这些改变出现的过程中，有一个节点性的人物——柯淳（本名“赵柯淳”）。 2025年2月，春节刚刚在电影市场过于冷清的讨论声中结束，刘博洋正在剧组里拍戏，突然有人喊有部剧爆了，叫《好一个乖乖女》。没多久，组里的演员、摄影老师甚至是场务都开始讨论这部剧。 上线7天，《好一个乖乖女》总观看量突破10亿，主演柯淳的粉丝暴涨超150万，有关他的词条开始与传统影视明星一样频繁登上微博热搜。 浅夏去年9月就已经开始喜欢柯淳，但是在偶像爆火以后，她甚至挤不进粉丝群。 相较于传统影视明星多在微博上和粉丝互动，短剧明星和粉丝的大本营在抖音。今年2月以来，为了能获得一手资讯，浅夏曾连续三个月，几乎每天都在尝试进群。但有相同想法的人太多，上限1000人的抖音群，柯淳建了五六十个，浅夏一回都没申请成功过。最后她只好支付上千元的年费，进了付费群。 更引人注目的是，柯淳还像一位传统影视明星那样，获得了时尚杂志、长剧综艺乃至品牌方的认可。 今年以来，柯淳先后成为综艺《无限超越班》第三季的学员，担任了护肤品牌FunnyElves的“品牌挚友”，登上了《时装男士》的杂志封面，11月还进组了赛车题材长剧《炽夏》，在其中饰演男二号。 据业内人士估计，柯淳的片酬大概在数百万元左右，相当于他按照顶流短剧演员的片酬拍上数十部短剧的收入。 刘博洋如此形容看到短剧明星出现的感受，“挺替他高兴的，觉得拍短剧有希望了，我们这个行业的演员也是能被人看到的。”从前，他拍短剧只是为了生计，但现在，他希望可以成为这个行业的头部。 更远的未来，短剧演员们仍希望可以回到传统影视行业，那里承载着真正的明星梦，在那之前，更重要的是可以拿到好本子，拍出下一部爆款。 柯淳之前，不是没有过被记住名字的短剧演员。2023年7月，一部名为《哎呀，皇后娘娘来打工》的短剧上线，随后取得了累计充值流水超2亿元的成绩，也捧出了“短剧女王”徐艺真。 只是那时候，作为初代短剧“顶流”，徐艺真的飞升不过是日薪从数千涨到了数万元。直到柯淳的出现，一个具有综合商业价值的短剧明星才是真的诞生了。 柯淳与《好一个乖乖女》出现的时间也颇为巧妙。今年年初，正是短剧市场大盘从付费模式转向免费模式的节点。“《好一个乖乖女》证明了免费（短剧）的盘子足够大，也证明了短剧演员可以破圈。”一位从业者如此表示。 追溯这些剧变的原点，监管是一个绕不开的原因。 2023年年底以来，广电总局针对短剧中存在的问题出台了一系列管理政策，粗制滥造的内容逐渐成为历史，行业开始向精品化转型。精品短剧保留了长剧难以企及的情绪密度，同时补上了剧情的短板，成为可以承载用户们复杂情感的产品。 在这一过程中，行业开始寻求更专业的演员和更完整的人物塑造。 头部短剧厂牌听花岛负责人在分享会中表示，今年以来短剧的趋势之一，就是剧中的角色从工具人变成了人物，“我们最重要的使命是塑造人物”。 与此同时，以红果短剧为代表的免费模式降低了受众观看门槛，短剧的用户规模仍在上涨。根据QuestMobile的数据显示，截至今年9月，红果月活达到2.36亿，正式超越B站和优酷。 当基本盘足够大，大浪淘沙之下，能脱颖而出的是足够好的作品、角色和演员。 抢人大战开始了 拥有了流量的演员们，开始拥有话语权。 对于短剧演员来说，谋求更好的职业发展，会去拍长剧；想要更多的流量，会选择红果自制剧。如此一来，短剧公司们想要约到合适演员的档期，变得越来越难。 一位短剧行业的从业者向36氪表示，他们8月筹拍的一部短剧，合适演员的档期已经排到了明年。即便是非头部的演员，都需要提前两三个月预约。以至于现在短剧行业内普遍存在的情况是，没有自己的演员，就开不了新剧。 专业素质好且自带流量的演员，对于短剧公司来讲也越来越重要。 与精品化趋势一起到来的是抬升的成本，和仍旧难以捉摸的爆款定律。想要花费了上百万元的精品短剧不扑街，短剧明星成为了诸多不确定性中的确定性。 “观众消费情绪，来得快去得也快，但是他消费一个角色，会持续更久，对应的产品也更有价值。”艺粲传媒的CEO加菲向36氪表示 。 如今许多剧组发通告，会直接要求短剧演员自身的粉丝数量，尤其是红果平台上的。更不必提，短剧明星的商业价值也已经得到了验证。 一位“卖粉丝”商家的朋友圈，受访者供图 于是，行业内的抢人大战拉开了序幕。 河马星驰艺人经纪负责人春子找上刘博洋的时候，已经是今年7月，那时候最头部的短剧演员已经被抢完了。 签下刘博洋，本是志在必得的事情，因为前者拍过多部河马星驰的短剧，与公司的合作由来已久。 但谈判期间，刘博洋突然告知春子，还有十几家行业头部的短剧公司和MCN机构找上来，询问他的签约意愿——位于行业中腰部的演员，也炙手可热。 听完后，春子心里“咯噔”一下，但他很快冷静下来，明白这是一场必须要面对的竞争。 一周的时间，春子和刘博洋打了四通电话，最后一次终于把签约的事情敲定。怕生出变故，确认签约的第二天，春子就把连夜修改好的合同发了过去，给出了几乎是行业内最好的条件，还将原本承诺的个人IP宣传提前了半个多月。 李婧也同样感受到了这场抢人大战的激烈。从今年年初到现在，陆续有近二十家公司和个人找上来，想和她签约。就在和36氪沟通的过程中，李婧也小红书个人账号上还收到了一条私信，询问她是否有合作意愿。 有一次几乎要谈成了，两人电话聊了一个多小时，但最后还是没能达成一致，“对方甚至连我面都没见过，就说要线上签约。”这让李婧也心中警铃大作。 麦芽传媒的短剧经纪负责人琴声声向36氪表示，那时候行业里很多公司为了抢到人，甚至会“画饼”，许诺自己根本做不到的条件，“总之先想办法和这个人绑定。” 那时候她去聊演员的时候，对方会表示：我不缺戏、不缺资源，更不缺想和我签约的公司。 拥有庞大流量的红果短剧，还在加速这一进程。 今年9月，红果自制推出了针对短剧演员运营机构和演员的分账激励政策。11月20日，官方首次对外公布了详细的演员分账数据——有三位短剧演员分账超百万元。 红果通过高额分账拉拢演员、编剧等创作端的人才以服务自制内容，本质上是因为不想只赚平台这一份钱，而是瞄准了整条产业链。这条路径早在番茄小说崛起的过程中，就已经走过一遍。据接近字节人士消息，如今后者的内容供给中，原创占比已经达到了85%。 即便签约了公司，短剧演员仍可以选择拍摄外部的项目，此时红果短剧抛出了诱人的分账，让行业本就不富裕的演员产能更加紧张，片方们都绷紧了神经。 对此听花岛负责人表示，现在行业内S+级别的演员，与红果短剧的分账比例可以达到18%，A和A+级演员，分账比例在5%-10%之间。按照这样的比例，头部短剧演员可以像拍长剧那样轻松拿到百万片酬，也会更倾向于将有限的时间贡献给红果自制的项目，而非自家公司剧集。“让人崩溃，制作公司成了给演员打工的。” 但为了有剧可拍，没有公司可以避开布局经纪业务的大势。 新的爆款，新的希望 各大短剧厂牌还在积极布局经纪业务时，新的超级明星又出现了。 9月，《盛夏芬德拉》创下了最快破30亿播放量的记录。 30亿播放量意味着什么？以《盛夏芬德拉》82集的体量计算，其集均播放量高达3659万，足以与长剧领域的头部作品并肩。根据云合数据信息，9月上新的长剧集中，《盛夏芬德拉》的集均播放量仅次于爆剧《许我耀眼》，大幅领先位列TOP2的《沉默的荣耀》。 这是又一部精品短剧，光成本就有约200万元，成功塑造了隐忍、克制又深情的周晟安一角。饰演者刘萧旭的人气也随之飙升，社交媒体账号涨粉超百万，还在机场遭到了粉丝的围堵。另据业内人士消息，红果曾为这部短剧追加了200多万元的宣发。 爆剧《盛夏芬德拉》，红果App截图 一个新的流量神话又诞生了，随之而来的是扑面的财富机会。 刘萧旭所属的公司是艺粲传媒，其CEO加菲与36氪交流时，穿着半小时前刚从优衣库买的羽绒服，一脸疲惫——10月底的北京已经很冷，但他前一天晚上才从成都飞过来，一天要见上五个人。 剧火了之后，找上艺粲传媒洽谈的商务数量有几百个，包含了美妆、个护和饮料等品类。甚至还有一个新兴的汽车品牌。但对方要求的档期和刘萧旭进组的时间撞了，还是推掉了。 期间加菲还拒绝了不少销售属性重的商务邀约，“感觉不太符合老刘的气质，不想什么钱都挣。” 相较于从“草根”状态出来的柯淳，刘萧旭成名的背后，有一套成熟的运营体系。 加菲告诉36氪，过去一年间，刘萧旭的背后，有一个专门的运营团队，包含编导、拍摄、剪辑、账号运营和粉丝运营共计五人。包括人员成本在内，公司过去一年间在刘萧旭身上的投入，迄今没能回本。 艺粲传媒在短剧经纪上走的是“小而精”的路线，在今年4月正式成立之后，签约的演员还未超过十人，新签下的两人还是刘萧旭上一部爆剧《幸得相遇离婚时》的男二和女二。 这在其他公司是难以想象的。大多数短剧公司的经纪业务更贴近中台性质——让十余人的团队一起服务数十个艺人。 加菲本人也有着丰富的IP创作和运营经验。早在2016年，他就做出了全网粉丝量达1.5亿的IP——“一禅小和尚”。这让他在运营刘萧旭这一IP时，很得心应手。 一年前，刘萧旭参演的《深情诱引》上线，只出场了五分钟，却受到很多观众的好评。加菲敏锐地捕捉到这一点，在短剧上线的第二天就亲自下场做了一个角色混剪视频，发在了公司和刘萧旭的个人账号上，积累了第一批“原始股”粉丝。 接下来的一整年，加菲及其团队都在围绕这一角色更新小剧场，主打“人夫感”，这也是周晟安（剧中角色）与刘萧旭本人共通的特质。加菲精准地意识到了这一点，“从内核上来讲，他就是一个很传统的山东男人，那种克己复礼的感觉是流淌出来的。” 因为这一整年的铺垫，粉丝们在《盛夏芬德拉》出来之后，对演员和角色的情绪到达了一个峰值，也捧出了又一颗新星。 刘萧旭爆红的背后，也让已经走出草莽时代的短剧行业，不再等待幸运与奇迹的降临。公司们期望可以摸清流量的规律，创造出下一颗短剧新星。 11月初的微博视界大会上，走上红毯的有杨幂、王鹤棣等知名明星，以及柯淳、余茵以及艺粲传媒旗下的王格格等短剧顶流。加菲为她请来了数万元一天的明星化妆师和摄影师，“很贵，但是格格值得！” 河马星驰则为刘博洋打出了“短剧渣男第一人”的称号，因为过去他扮演的许多角色都是“追妻火葬场”类型。刘博洋本身是一个相对谨慎的人，但他还是同意了这一冒险的宣传策略，因为比风险更可怕的是，在一众“霸总”里没有差异化和辨识度。 仍有一些阴影盘踞在这些闪耀明星的头顶。 短剧明星的更新迭代极快，不过一年多的时间，初代短剧顶流徐艺珍、孙樾等已经淡出观众视野。红果App上演员热度榜单的前十名，也几乎是月月更新。 还有多位短剧行业的从业者和观众向36氪提及，相较于传统影视圈人设靠包装、日薪达百万的明星们，短剧明星具有的竞争力是更接地气，只是这一优势伴随着行业造星的趋势也在减弱。 但在真正的危机到来之前，这些“微不足道”的波折并不影响大家期待“下一个柯淳”、“下一个刘萧旭”的诞生。 曾经灰暗的日子已经被抛到了脑后。 刘博洋笑着分享了一个小故事——一位同行曾经带着恶意询问他：“怎么拍起了短剧？”如今对方问的是：“还有机会进来吗？” （应受访者需求，浅夏、春子、加菲为化名。） 本文由「 兰芥 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： IC photo +1 381 好文章，需要你的鼓励 兰芥 新锐作者 120 收 藏 +1 2 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.265 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 月薪3000的职校生，正在「干掉」北影导演 2026医疗展望：百家公司港股排队，医疗板块能否再创「神话」 千问的1000万杯奶茶：阿里大发赛博鸡蛋始末 狂飙的中国IP，掏空全球年轻人钱包丨36氪年度回眸 智谱、MiniMax港股IPO，熬过孤独的人和500亿奖赏 | 深氪lite Manus数十亿美元卖身，中国AI应用的关键词只有一个｜深氪 我的男友是虚拟的，但他很快就会变成现实｜深氪 第一批喜茶加盟商，迎来史上最艰难的一年｜深氪 惊天反转：辞职41天，宗馥莉重新启用「娃哈哈」| 深氪 兰芥 新锐作者 欢迎交流：woaixiuxiuzha 发表文章 86 篇 最近内容 一款运营三年的模拟经营游戏，是如何活力依旧的？ 2026-04-03 泡泡玛特，风光不再？ 2026-04-03 阅文“AI拟真人大讲堂”：好故事才是AI时代的未来 2026-04-03 阅读更多内容，狠戳这里 下一篇 超百亿，范思哲又被卖了 普拉达的一次大胆冒险。 2025-12-08 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
