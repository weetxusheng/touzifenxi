          summary: '落地场景不明晰的当下，AI还不是小红书布局的重点。'
          text: '小红书内测自研大模型“小地瓜”，社交和搜索是落地方向 | Long China 50独家-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 小红书内测自研大模型“小地瓜”，社交和搜索是落地方向 | Long China 50独家 阿菜cabbage · 2024年04月29日 18:53 落地场景不明晰的当下，AI还不是小红书布局的重点。 文 | 周鑫雨 杨典 编辑 | 杨轩 36氪从多个独立信源获悉，由小红书AI创新负责人张德兵（薯名：宇尘）牵头的大模型团队，在部分内部产品灰度测试自研通用大模型基座“小地瓜”。小红书AI产品的探索，则主要由小红书产品和设计负责人邓超（薯名：樱木）负责。 截至发稿前，小红书并未对上述信息做出回应。 小红书想要用大模型做什么？ 此前， 36氪曾独家报道过小红书成立大模型团队的消息 。2023年10月，在小红书REDtech青年技术沙龙上的分享中，张德兵第一次较为公开地提及了小红书大模型的两个落地方向：多模态技术，以及AI内容创作工具。 这两个方向，对于以图文内容生态见长的小红书而言，无异于是“舒适区”。一年来，小红书AI产品的布局也紧紧围绕着这两个大方向。比如在2023年7月，AI涂鸦功能和AI配图功能“此刻”上线笔记发布板块。 几名知情者告诉36氪，小红书对上线新AI产品的态度非常谨慎，原因是害怕破坏现有的内容生态。一名知情者说：“ 小红书的内容生态是活人种草，AI在里面怎么样才不违和，这是困扰小红书的一个问题。 ” 社交和搜索，则是小红书希望走出图文种草的舒适区，用AI触达更多用户的新场景。 用大模型重构搜索和信息流推荐，对小红书而言是不破坏生态的保守一步。2023年9月，小红书先基于大模型公司MiniMax的大语言模型，上线了生成式搜索对话助手“DAVINCI 达芬奇”并进行内测。用户可以通过自然语言表达，获得大模型总结提炼的结果。 当然，AI重构搜索之意，更在为电商引流。一名知情人士对36氪表示，小红书的AI搜索将会带有更浓厚的种草性质，这对于小红书电商来说，也是一个重要的流量入口。 走出舒适区，用AI新玩法触达更多的用户群体，则是小红书想用AI社交达成的目标。2024年春节期间，小红书又上线了“AI宠物小伙伴”等社交玩法，还在群聊中上线了可以智能创建角色的AI群聊搭子。 AI，还不是小红书布局的重点 若是以外界的视角旁边小红书布局AI的一年，会得出“声量未起、一波三折”的结论。比如，对话助手“DAVINCI 达芬奇”、AI群聊助手等应用，在用户中没有太大的声量。 但对应用属性突出的小红书而言，AI大模型的价值在于支持自身应用，但在应用场景还不明晰的当下，AI大模型的价值在内部尚未得到验证。 可以说，当下AI还没有成为小红书的布局重点。 “AI创企做产品的思路是，先看手里有什么牌，再考虑对外输出什么。 但小红书的思路是先看用户需要什么、新的场景能不能跑通，再去调用手里的资源。 ”一名知情者告诉36氪。 与此同时，目前小红书产品侧的业务重心仍在短视频，这也占据了大部分的人力和金钱资源，留给AI探索的资源并不多 。多名知情人告诉36氪，对于去年刚刚实现盈利的小红书来说，商业化能力还需要再进一步被证明，在尚未验证落地场景前，入局大模型这场花费高昂的游戏有着极高的风险。 当然，小红书也必须要对技术变革做出快速响应。他们的解法是在自研模型的同时，以股东的身份，战略投资了MiniMax和月之暗面两家大模型独角兽，同时基于MiniMax“abab”等第三方大模型做产品。比如，“DAVINCI 达芬奇”和“AI宠物小伙伴”，就是基于MiniMax的模型基座推出的。 但在数据安全的考虑下，应用层大厂自建大模型又是必然趋势。 2023年10月24日，小红书为自研大模型申请注册了“小地瓜”商标。多名知情人对36氪表示，多款AI产品已经接入小地瓜的API进行了测试。据一名知情人士反馈，小地瓜在应用上的表现，已经达到国内主流大模型的水平。 延伸阅读： 小红书布局大模型：多媒体算法负责人牵头、上线AI绘画应用｜智涌独家 欢迎交流！ 欢迎交流！ 本文由「 阿菜cabbage 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 视觉中国 +1 307 好文章，需要你的鼓励 阿菜cabbage 新锐作者 126 收 藏 +1 6 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.189 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 智界要打翻盘仗：V9给了年均12万辆指引｜36氪独家 字节跳动2025年海外营收占比创新高，AI投入致公司净利大降70%｜独家 自变量机器人完成近20亿元B轮融资，小米战投、红杉中国领投丨智能涌现独家 小米汽车重磅任命：胡峥楠任CTO，宋钢任参谋长｜36氪独家 欣旺达装车特斯拉，供应全球车型｜36氪独家 阿里电商 AI 新动向：围绕 Token 重构电商，组织迎来新一轮调整｜独家 轻舟、元戎秘交上市资料，和Momenta冲刺港股IPO | 36氪独家 抖音生活服务组织架构大调整，中小商家更重要了｜独家 36氪企业全情报：AI 舆情大数据，让投资决策快人一步 阿菜cabbage 新锐作者 人工智能等前沿科技摸石者，zxycai728 发表文章 302 篇 最近内容 杨植麟/张鹏/夏立雪/罗福莉/黄超，谈龙虾，谈“Token经济学” 2026-03-27 「龙虾」火热，硬件掘金，这里有10个最新的硬件项目 2026-03-27 腾讯挖来多位字节Seed骨干，向姚顺雨汇报丨智能涌现独家 2026-03-24 阅读更多内容，狠戳这里 下一篇 城镇化率突破66% 城市为谁而更新 怎么做更新？ “2024第二届中国城市更新创新发展高峰论坛”召开，会议主题是“更未来——城市更新中的新质力量”。 2024-04-29 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
