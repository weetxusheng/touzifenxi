          text: '智谱、MiniMax港股IPO，熬过孤独的人和500亿奖赏 | 深氪lite-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 智谱、MiniMax港股IPO，熬过孤独的人和500亿奖赏 | 深氪lite 阿菜cabbage · 2026年01月09日 09:00 这是一群少数派信仰的坚守者，熬过孤独的犒赏。 MiniMax 已上市 上海市 2021-11 人工智能技术研发商 36氪报道 物联网/硬件 智能硬件 WISE2025 商业之王 年度AI应用场景突破企业 我要联系 文｜周鑫雨 编辑｜苏建勋 浪来了，大家都站起来了 作为智谱AI的B轮投资人，启明创投主管合伙人周志峰、执行董事胡奇，还记得这家大模型公司尚在襁褓中的样子。 那是2021年6月，北京智源AI研究院的发布会上，他们第一次在国内看到参数量万亿级的预训练模型，“悟道2.0”。 经过一番辗转介绍，周志峰和胡奇知道了“悟道2.0”的带头人，是来自清华知识工程实验室的唐杰，他背后的公司，叫做“智谱华章”。 不同于大模型今日之高光，那时的AI，是个在角落里沉寂的赛道。 2021年，最火的投资主题是碳中和与元宇宙，OpenAI在国内还是个小众公司，大模型和Scaling Law，更是只在少数大厂和研究院中默默进行的实验。 启明创投还是投了。几名智谱创始成员口中的“泛化性”，和已经推进的模型API服务，让他们看到大模型可以走出实验室，是个能改变千行百业的“big story”。在启明创投最早的内部讨论里，李飞飞等斯坦福大学AI团队成员当时对Foundation Model的判断，还被胡奇特意注明。 在启明创投悄然狙击智谱的2021年底，明势创投创始合伙人黄明明、合伙人夏令、董事总经理徐之浩，见到了计划创业的MiniMax创始人闫俊杰。 这场会面没有BP（商业计划书）和PPT，没有产品demo，只有闫俊杰近三小时的输出。 “我的目标是要实现AGI（通用人工智能）。”从闫俊杰的口中，明势的几名投资人第一次听到这个陌生却宏伟的愿景。“当时我不确定AGI的准确定义，现场还搜了一下。”夏令记得。 但闫俊杰“用端到端数据驱动做NLP（自然语言处理）”的方法论，让明势“眼前一亮”。2015年，明势投过理想汽车，明白“端到端的数据驱动”对自动驾驶的变革意义——同样的，他们看好这项技术在AI对话系统中的潜力。 见完闫俊杰的3个月后，黄明明决定投资。2022年中，他还分别引荐了王兴、李想，目的是让闫俊杰能“和超一流的企业家和产品经理交流碰撞”。在MiniMax后续的融资中，明势最终连投了6轮。 △闫俊杰（左）和黄明明（右）。图源：36氪 稀缺性，是两家基金分别对智谱和MiniMax开枪的理由。 可“稀缺”的另一面，是少数派信仰的孤独 ——彼时，离ChatGPT将大模型迅速拉齐为共识，还有足足一年多的时间。 没有人知道自己是否做了正确的决定。夏令形容，明势当时在“bet（赌）”。周志峰则将对智谱的投资，称作“快了半步”：“不管我们的投资方法论讲得多么漂亮， 我们在市场共识形成前投资，孤独感和自我质疑是一直萦绕在团队身上的。 ” 黎明前的黑暗总是漫长，不论是智谱、MiniMax，还是早早选择他们的启明创投、明势创投，在2021年底之后的一年里，都在沉默中探索、试错。一年之后，ChatGPT横空出世，后面的故事，大家都知道了。 2026年，在“大模型六小虎”中最早成立的智谱、MiniMax，摘下了创业至今极其重要的一颗果实： 1月8日，智谱CEO张鹏敲响了港交所的铜锣，宣告挂牌上市，市值一度超过570亿港元；1月9日，MiniMax紧随其后，也将以超过500亿港元的预估市值走向二级市场。 近五年来最热的赛道上，两家最热的公司，几乎在同一时间登陆港交所——市场的情绪瞬间被点燃。 短短7天的招股期，智谱公开发售部分认购达1159.46倍。市场的火热，触发了回补机制，智谱在香港公开发售的比例从最初的5%，提升到了20%——截至发稿，智谱股价一度超过130港元，较发行价上涨了约12%。 MiniMax也一样火热。即便公开发售部分仅2.2亿港元，MiniMax却吸引了超过2533亿港元的孖展资金（保证金），多达42万人认购，相当于每1港元的股票，同时有1209个人在抢。 一位打新者对我们感叹：两家公司的中签几率之低，不亚于抢五月天演唱会的门票。 IPO尘埃落地的这几天，周志峰心中萌生了一种感觉：无论是智谱、MiniMax，还是早期投资人，都水到渠成，所有人手里始终都拿着一块冲浪板。 而2026年初，浪来了。“大家都站起来了。”周志峰感慨。 △智谱总裁王绍兰（左）、启明创投主管合伙人周志峰（中）、启明创投执行董事胡奇（右）。图源：启明创投官方 港股大门常打开 智谱和MiniMax的上市，让港股在2025-26新年交替之际迎来高潮。 两三年前，分析师何辉所在的投行曾因业绩下滑多次裁员。如今，他觉得光景似乎回到了小米、美团集体排队登陆港交所的2018年，“有活干，加班也是甜蜜的”。 “2025年以来，港股在科技企业中的认知度完全盖过了A股。 一是标的足够热，包含消费、AI、半导体领域的多家热门公司，二是速度足够快。 ”何辉告诉《智能涌现》。 这也是2025年下半年以来，港股资本奇观的一个鲜活缩影。 宏观数据印证了港股的火热。根据港交所数据，2025年港股新上市的公司有119家，是近5年最多。Wind数据显示，截至2025年10月13日，2025年共有269家公司向港交所递交IPO招股书，数量比前三年的总量还高。 △2015-2025年港交所新上市公司数量。图源：智能涌现制图 港股能有今日之盛况，两股显性的力量至关重要。 一头，是加速南下的资金，和主动示好的港股。 为了招商引资、盘活资金的流动性，港交所开始频频向内地企业抛出了橄榄枝。 2025年以来，港交所来内地宣传的积极性明显变高了。2025年11月，港交所的成员现身明势资本的AGM（年会），向被投企业介绍IPO流程和政策。 他们在宣讲中强调港股回暖的一个案例，是2025年年初势如破竹的消费板块。当时，由于散户认购倍数超过5000倍，蜜雪IPO触发了港股的回拨机制，公开发售的份额从原计划的10%，增加到了50%。 “港股‘上市即破发’的刻板印象已经被扭转了。”夏令告诉《智能涌现》。 在种种示好动作中，港交所《上市规则》“18C”章的条款，对不少科技企业而言，意义重大。这项在2023年针对“特专科技公司”推出的上市制度，允许未盈利或收入较低的科技企业，在港交所主板上市。 2025年5月6日推出的“科企专线”，是进一步释放出友好的信号。这项制度，让符合要求的科技公司，可以在筹备阶段获得上市指导，而且能够选择以保密的形式，提交IPO申请。 新一代AI大模型公司赶上了好时候。这是上一代“AI四小龙”（商汤、旷视、云从、依图）没有体会到的光景。 自2019年8月起，旷视科技数度对IPO发起冲刺，但均折戟。对旷视科技CEO印奇而言，2025年港股的回暖带来了圆梦的机会——2025年10月，他出任董事长的智驾公司千里科技，宣布向港交所主板，递交了IPO申请。 当然，今年AI公司赴港IPO的“快”，也是各方努力的结果。MiniMax和智谱，一南一北两家公司登上港股， 从此全球资本市场上，也有了中国基座模型的代言人。 某家六小虎的前高管对《智能涌现》表示，任何战略型的前沿领域，国内必须要有对标海外的标的，“任何标的缺位，都会导致全球二级市场的资金倾斜向海外公司。”在这一意义上， “海外有OpenAI和Anthropic，国内就必须要有智谱和MiniMax”。 另一头，是加速发展的AI赛道。 “AI赛道三个月的迭代速度，相当于很多传统行业一年的迭代速度。”夏令评价。 超乎想象的技术迭代和资源消耗速度，催生的是更高的融资需求。从2023年到2024年中，六小虎纷纷从独角兽，迈入200亿元估值俱乐部；仅仅一年后，200亿元，又快速变成了300亿元。 “至少在2024年底，六小虎就意识到，一级市场快要承托不住估值了。”一名六小虎的前高管记得，2024年底，几乎所有六小虎，都将IPO提上了日程。 比如，据《智能涌现》了解，按照某家六小虎的计划，2025年3月，公司会再融30-40亿元，只要当年再完成10个亿的营收，就有望上市。但由于创始人的战略调整，该公司砍掉了营收最大的业务，上市计划也成为泡影。 “（如果不上市）大模型公司在一级市场只能按照40亿美金的估值小额融资，效率会非常低。”夏令告诉我们，“筹资最快的路径，就是上市。” 一面，是迫切需要囤积长线弹药的AI公司，一面，是对AI、科技主题张开怀抱的的港股市场，多股浪潮，最终成了助推中国大模型公司前赴后继赴港上市的合力。 夏令所在的明势创投，2026年预计在港股启动上市的被投企业，差不多有6家。加上即将敲钟的MiniMax，“名副其实的收获之年。”他总结。 熬过孤独的人 在大模型“六小虎”中， 智谱和MiniMax的特殊性在于，这是两家成立在“前ChatGPT时代”的中国大模型公司 ——智谱成立于2019年，MiniMax诞生在2022年。 这是一个不乐观的时间节点。 “当时很多人认为AI就是‘四小龙’，都不愿意看。”一名错过智谱和MiniMax的投资人告诉我们。2022年，市面上也有人给他推MiniMax，说闫俊杰要做多模态。他的第一反应是：多模态？这年头谁还做CV（计算机视觉）？ 即便在2023年上半年，要不要投大模型初创公司、投哪家，一级市场依然没有共识。 光合创投在2023年5月投资了智谱，光合创投合伙人蔡伟坦言，在此之前，内部也有过讨论：如果大厂下场，初创公司还有没有生存空间？大模型的商业模式到底是ToB还是ToC？ 一级市场的集体沉默，像是一种审判。 当我们去询问智谱和MiniMax的早期投资者，为何愿意在沉默中开枪时，答案统一指向两家公司背后的缔造者：唐杰和闫俊杰。 蔡伟记得，2022年8月第一次见到智谱团队时，对方没有展示PPT，而是直接打开了模型GLM-130B的对话框。这一动作提升了蔡伟对团队的好感度，“这是个很极客的团队，不是花架子”。 在他眼中，智谱最难得的是“没有在模仿，而是有自研的GLM架构，大模型是完全自主可控的”。那次会面，成了光合投资智谱的关键。 △智谱CEO张鹏。图源：智谱官方 2022年底，在上海古北的一家茶室，绿洲资本创始合伙人张津剑见到了闫俊杰。 当时，MiniMax已经是估值10亿美金的水上项目，相比同期估值约3亿美金的月之暗面，并不算专注早期阶段的机构的理想标的。 米哈游总裁兼董事长刘伟，推了张津剑一把，促成了这次茶馆会面。刘伟告诉他：“既然你相信AGI，MiniMax是一家好公司，那就不要过度关注它今天的估值。” 这“一推”，促成了绿洲成立以来的最大单笔投资。 “一个创业者的出发点，很重要。”在茶馆的大部分时间，相比业务模式，张津剑更想了解的是闫俊杰创业的意图。其中，两个点打动了他： 第一，Intelligence with Everyone不是闫俊杰的一句空谈，商汤的经历让他意识到，传统范式的AI泛化性不够，只能服务ToB的一小部分人；第二，担任商汤科技研究院副院长期间，闫俊杰就试图提高图像识别的泛化性和通用性——经过无数失败，他花了三年把面部识别算法做到了行业第一。 “这两点，让我觉得这个人很‘真’，他是真的相信AI能走向通用、真正相信 AGI。”张津剑决定bet on这种“真”。和闫俊杰聊了4个小时后，他几乎当场敲定了对MiniMax的投资。 △MiniMax办公室贴着Slogan：“Intelligence with Everyone”。图源：网络 闫俊杰另一个常被人提及的评价，是“不妥协”。 第一次见到闫俊杰，黄明明和夏令对他的印象是和气，“总是笑眯眯的”。但随着更深入的了解， 他们发现闫俊杰的底色是“狠”、足够“Sharp”。 令几名投资人刮目的其中一件事，是闫俊杰对暂缓产品投流的超前决策。 2024年8月，闫俊杰做了一个在当时令人意外的决定：暂缓对产品的投流，将资金聚焦在模型迭代上——即便当时激进的投流让Kimi和豆包获得不错的数据表现。甚至因为这个决策，部分不理解的员工选择离开MiniMax。 “俊杰想问题很Sharp，他知道AI技术还在快速迭代，应该让技术驱动产品，而不是营销驱动产品。”夏令评价。 MiniMax和智谱，背后的两位创始人背景不同、性格迥异。 但最重要的是，这两名创始人的特质，与公司发展模式所需的能力不谋而合。 在很多人眼中，出身清华计算机系的唐杰，有AGI的野心和调动资源的能力，不是典型的只会发论文的高校教授。 早在2021年，智谱已经和阿里云、曙光达成合作，在云上为企业提供模型API服务。这在胡奇看来，是提早想清楚商业模式的表现。 他记得，2022年智谱的战略会上，清华大学人工智能研究院院长张钹做了40多分钟的演讲。之后的议题，就围绕着智谱应该做To B还是To C。最终，他们得出的结论是：ToC的竞争会很激烈，中国有不少企业对应用大模型很感兴趣，智谱当时应该往B端走，但也要持续保持对C的关注。 在那个时间点，智谱的算力储备已经达到千卡，在AI企业中规模最大，“都是创始团队一点点‘化缘’来的”。 彼时，做大模型，以及投资大模型，都是孤独的赌注。 如今我们褒扬的先发优势，在2023年之前，更像是两波孤独的投资人和创业者的双向奔赴。 他们熬到了现在。 港股，凿壁偷光的一扇窗 2022年底，在和闫俊杰的茶馆会面中，有一句话让张津剑印象深刻——闫俊杰提到，MiniMax要做Day 1就全球化的AI公司。 这句在2022年还颇具野心的话，已经成为当下AI赛道最确定的共识。如今看来，MiniMax的产品矩阵中，无论是角色陪伴应用Talkie，还是视频生成模型Hailuo AI，都是有营收的成功出海产品。 立足国内市场的智谱，2025年也开始放眼海外。招股书显示，2025年上半年的境外收入，占到了同期总营收的11.6%。一名知情者告诉我们，智谱的海外营收规模，在2025年下半年会有更明显地提高。 但让股东们有些许遗憾的是， 两家账上的钱还不够全球化 ——智谱背后是国资的托举，MiniMax的起步则主要靠国内美元基金的合力。 在融资历程中，智谱和MiniMax都曾引入境外资本，但一来资金规模不大，二来集中在中东、东亚。 一名投行分析师对《智能涌现》直言：说白了，主流资本还没真正出手， 中国模型公司的海外影响力还不够大。 对智谱和MiniMax的股东而言，登上港股的另一个期待在于，两家公司的估值可以更高。 明势的估值标尺，是收入体量差距不大的法国大模型公司Mistral AI。据彭博社报道，这家成立于2023年4月的公司，估值在2025年9月的融资后，达到了140美元（约980亿元），差不多是智谱和MiniMax Pre-IPO估值的3倍。 “ MiniMax和智谱的估值，显然是被低估的。” 夏令告诉《智能涌现》。周志峰也有类似的观点：“OpenAI每轮融资的金额，比中国这几家AI公司的估值加起来还大。” 中国科创企业想要走向世界。但在大洋彼岸，围城外的资本，也亟需一条通道进入中国科创市场。 不乐观的政治环境，成为横亘在中美科技行业之间的一堵墙。2025年以来，智谱被美国列入《出口管制清单》，Manus又迫于美国财政部的审查压力，撤出中国市场。 但近几年来，大疆、宁德时代等一众中国科技企业在全球市场上表现亮眼，让中国市场对美国资本拥有持续的吸引力。 据彭博社报道，2025年夏天，一辆载着8名欧美顶级VC投资人的商务车，沿着中国东部的超级工业带北上，逐站停靠在宁德时代、慕帆动力、协鑫光电等企业的总部。他们来访的目的，是了解中国最先进的科技。 在某种意义上，背靠内地、面朝外海的港交所，成了打开围城的一扇门。 “ 中美之间之间横着一堵墙。中国科技企业的IPO，就是在不断凿开中间那堵墙。 ”张津剑打了个比方，“IPO把光打进来，让世界看到，原来有那么多中国企业在推动全球创新，它们的很多收入也来自全球。” 港股IPO对海外影响力的提升，是立竿见影的。MiniMax通过聆讯当天，明势团队收到了不少海外LP、GP的消息，询问是否能参与基石投资。 这是一个让夏令感到乐观的变化：“IPO让智谱和MiniMax被更多国际投资人看见， 也能获得新的估值锚点，被全球市场更公允的评估和认可。 ” 对两家企业而言，上市也有助于留住人才。 《智能涌现》了解到，DeepSeek发布后，智谱曾经给部分员工发放股权激励。这在不少内部员工看来，是“稳定军心”的表现。 “IPO把激励从‘画饼’变成了实际的好处。”一名六小虎的投资人表示，“未来一年，字节阿里等大厂会让竞争更激烈，公司需要给员工一些信心。” 能确定的是，港股的回暖，智谱和MiniMax们的快速IPO，是给科技创业者和一级市场，注入的一剂强心针。 “对早期非共识的事，我们更敢bet了。”在这波港股IPO潮中，明势几名投资人看到的，是科技企业更公允的国际定价，基金更顺畅的退出渠道。 “ 这些事实都会反哺到一级市场 ，让我们更积极地去投真正创新的科技公司，以及有野心的创业者。”夏令对我们总结。 （文中何辉为化名。） 欢迎交流！ 本文由「 阿菜cabbage 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： AI生成 +1 245 好文章，需要你的鼓励 阿菜cabbage 新锐作者 46 收 藏 +1 1 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.268 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 月薪3000的职校生，正在「干掉」北影导演 2026医疗展望：百家公司港股排队，医疗板块能否再创「神话」 千问的1000万杯奶茶：阿里大发赛博鸡蛋始末 狂飙的中国IP，掏空全球年轻人钱包丨36氪年度回眸 Manus数十亿美元卖身，中国AI应用的关键词只有一个｜深氪 我的男友是虚拟的，但他很快就会变成现实｜深氪 七天挣百万，短剧演员的改命之路｜深氪lite 第一批喜茶加盟商，迎来史上最艰难的一年｜深氪 惊天反转：辞职41天，宗馥莉重新启用「娃哈哈」| 深氪 阿菜cabbage 新锐作者 人工智能等前