          text: 'AI大牛杨红霞离职创业，曾为字节和阿里大模型研发主力 | Long China 50独家-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 AI大牛杨红霞离职创业，曾为字节和阿里大模型研发主力 | Long China 50独家 阿菜cabbage · 2024年05月24日 10:43 又一“字节系”AI大牛出山。 文 | 周鑫雨 编辑 | 苏建勋 杨轩 36氪从多个独立信源处获悉，字节跳动大语言模型研发技术专家杨红霞，已于近日从字节跳动离职，并开始筹备AI创业项目。 截至发稿前，字节跳动并未回应上述消息。 2023年3月，36氪曾独家报道过杨红霞加入字节的消息。 此前，杨红霞担任阿里达摩院超大规模多模态预训练模型M6的技术负责人，是M6大模型从百亿、千亿参数量进化到万亿规模的主要功臣。2022年9月，杨红霞因个人家庭原因离开了达摩院。 2023年初，ChatGPT在国内卷起了大模型的竞速，大厂组建战队，技术大牛出山，全行业进入了对技术型人才的渴求期。彼时的字节，也开始招兵买马，并快速在智创、搜索、AI Lab组建团队，试水语言和多模态大模型。 最终，杨红霞选择加入字节AML（Applied Machine Learning，机器学习系统）团队，汇报给字节跳动AML和豆包大模型Foundation团队负责人项亮，在美国西雅图从事大语言模型的研发。 自2023年下半年起，行业的重心开始从模型的研发，转移到了应用的落地。2024年，随着音频模型Suno、视频模型Sora的“炸场”，资本市场再度燃起了对AI的热情。乘着东风创业、融资的技术大牛不在少数。 “字节系”的技术大牛，也成了AI创业的主力军。2021年离职的视觉技术负责人王长虎，在2023年4月出山，创立了视频智能生成企业“爱诗科技”，如今也是完成超亿元A2轮融资的明星项目。 2023年9月离开的字节游戏AI项目负责人Jesse，则于2024年2月就在Steam上线了自己的AI游戏“言灵计划”。 入职一年后，杨红霞也踏上了创业之路。作为研究型技术人才，当她走入创业的丛林，将要面对的则是团队组建、公司经营、产品打磨、市场营销等更为复杂的考验。 欢迎交流！ 本文由「 阿菜cabbage 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 视觉中国 +1 326 好文章，需要你的鼓励 新锐作者 94 收 藏 +1 2 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.191 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 智界要打翻盘仗：V9给了年均12万辆指引｜36氪独家 字节跳动2025年海外营收占比创新高，AI投入致公司净利大降70%｜独家 自变量机器人完成近20亿元B轮融资，小米战投、红杉中国领投丨智能涌现独家 小米汽车重磅任命：胡峥楠任CTO，宋钢任参谋长｜36氪独家 欣旺达装车特斯拉，供应全球车型｜36氪独家 阿里电商 AI 新动向：围绕 Token 重构电商，组织迎来新一轮调整｜独家 轻舟、元戎秘交上市资料，和Momenta冲刺港股IPO | 36氪独家 抖音生活服务组织架构大调整，中小商家更重要了｜独家 36氪企业全情报：AI 舆情大数据，让投资决策快人一步 阿菜cabbage 新锐作者 人工智能等前沿科技摸石者，zxycai728 发表文章 302 篇 最近内容 杨植麟/张鹏/夏立雪/罗福莉/黄超，谈龙虾，谈“Token经济学” 2026-03-27 「龙虾」火热，硬件掘金，这里有10个最新的硬件项目 2026-03-27 腾讯挖来多位字节Seed骨干，向姚顺雨汇报丨智能涌现独家 2026-03-24 阅读更多内容，狠戳这里 下一篇 iPa