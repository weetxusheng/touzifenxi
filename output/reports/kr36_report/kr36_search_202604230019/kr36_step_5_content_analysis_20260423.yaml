          summary: '一个正在被打开的千亿蓝海。'
          text: '半年融资近2亿，他要用AI发球机器人解决全球1亿人的训练难题｜硬氪专访-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 半年融资近2亿，他要用AI发球机器人解决全球1亿人的训练难题｜硬氪专访 黄 楠 · 2026年04月14日 09:10 一个正在被打开的千亿蓝海。 作者｜黄楠 编辑｜袁斯来 如果你想找庞伯特创始人张海波，大概率得去公司附近的各种球场。 张海波早把自己训练成了各种球类的高手。 2025年10月，公司网球场刚建成不久，他就拎着自家的发球机器人，从零开始学球。见到张海波时，他告诉硬氪，经过半年训练，现在已经打到了NTRP 3.0——相当于普通用户通常要练一两年才能达到的进阶水平。他没请私教，也没有陪练，唯一的老师，就是那台被自己反复击打的发球机器人。 张海波很早就精通乒乓球，他是国内最早一批将强化学习用于乒乓球对打的工程师。早年在上市公司任职期间，他就做出了一套能与人进行“人机对战”的具身机械臂方案。这套系统成本高达20多万元，曾为国家队提供数据分析，甚至能与专业选手抗衡。但张海波很快意识到，能击败人类的机器人是一种景观，不可能成为大众真正需要的产品。 比起用炫酷的demo展示技术上限，张海波更愿意钻进国内外大大小小的球馆，观察那些最挑剔的深度爱好者。 他发现，运动人群真正缺的不是一个机器人对手，而是缺教练、缺陪练、缺高效的自主训练方式。而市场上大部分发球设备多还停留在机械吐球阶段：无节奏、无旋转、无指导，几乎谈不上训练价值。 长期被技术忽略的用户痛点和巨大的行业空白，让张海波下定决心走出实验室。2019年，张海波创立庞伯特，希望以智能发球机器人为载体，为用户提供随时可用、专业稳定的AI Coach（运动助教）。 这条路径很快得到了市场的验证。2024年10月，庞伯特PACE系列智能网球发球机器人上线Kickstarter，众筹金额超270万美元。2025年黑五期间，海外单月销售额突破数千万元；目前公司全球用户已超30万。 硬氪独家获悉，庞伯特日前完成了A轮系列融资、三轮累计近两亿元，神骐资本、明势创投、蓝驰创投、锦秋基金、华创资本等机构集体参投，高鹄资本担任独家财务顾问。 资本的信心源于一条清晰的增长逻辑。根据国际网球联合会（ITF）2024年11月数据，全球网球参与人数达到1.06亿。其中，美国网球活跃用户与教练配比高达800：1，专业教练供给严重不足；在中国，网球正快速成为都市白领与中产家庭的主流运动，但动辄数百元一小时的私教课，把绝大多数初学者挡在门外。而庞伯特希望用AI技术，给出一种解法。 以下是硬氪与庞伯特创始人兼CEO张海波的对谈实录，内容经编辑： 训练场景下的AI Coach 硬氪：你最早开始做机器人是在十年前。 张海波： 我做的第一代机器人是一款乒乓球对打机器人，它和目前常见的发球机器人或使用人形机器人打球不同，采用机械臂结构进行人机对打，是一个具备自主判断和决策能力的具身智能系统。 我们从图像中获取信息，输入到模型里，由它控制机械臂把球打到我们期望的位置。这个过程中，乒乓球会旋转，因此我们做了很多关于球怎么飞行、怎么预测、怎么拦截的专利，给国家队也做过不少数据分析。 但我们当时追求的不是产品化，而是更高、更快、更强，要打赢别人，所以设备成本也很高，单台要达到20多万元。 硬氪：体育运动领域是一个高度依赖行业Know How的赛道。 张海波： 那四年里，我们掌握了大量对体育的理解，从初学者到深度爱好者、再到专业运动员的全过程理解，很少有人能看到这个完整的路径。 我能感受到那些爱好者对科技产品的渴求，每次交流时他们都非常兴奋。这让我萌生了创业的想法，不再做20多万的高价设备——这类产品很前沿、但用户面有限，只能解决极少数人的痛点。我想做一款广大爱好者买得起用得上的运动科技产品。 硬氪：市面上各类体育智能硬件存在鲜明的定位差异，我们该如何理解不同运动场景与产品定位的界定？庞伯特出于哪些考量最终锁定了产品方向？ 张海波： 通常来讲，我们可以将泛体育划分为四个方向。一种是Sports，即具备完整竞技规则、可开展专业赛事的运动，比如足球、篮球、网球等，这也是庞伯特所瞄准的赛道；第二种叫Recreation，偏向休闲娱乐属性的活动，例如飞镖、飞盘、桌球等，在海外，有些乒乓球场景也可以归属到这一活动品类中，更多用于聚会消遣；三是Outdoor，追求自我突破的户外运动，比如登山、划船等，用户更注重挑战身体极限、刷新个人纪录；第四类是Fitness，即以塑形、体能提升为目标的健身运动。 这四个品类不能说不相通，但从面向爱好者的专业化产品角度，界限是分明的。庞伯特做的是Sports，以及部分与Sports相关的Recreation娱乐化呈现，跟Fitness、Outdoor类运动目前没关系。 庞伯特PACE系列智能网球发球机器人（图源/企业） 硬氪：从产品形态上来看，传统发球机出现了几十年，但大多仍停留在机械吐球阶段，用户体验几乎没有革新。庞伯特想解决的核心矛盾是什么？ 张海波： 运动场景里，用户只有三种状态——纯玩、训练、比赛/对战。三个场景互斥，用户在球场上只能做其中一件事。这也就决定了我们在做产品时要选侧重点。 庞伯特专注的是训练场景。 用户真正需要的并不是一个机器对手。 对战本身带有强烈社交属性，即便机器能陪打，用户最终还是会回归人与人之间的对抗。很多人觉得机器人接球很新鲜，但其底层需求并不是 “陪打”，而是 “可以借助机器来辅助自己练习”。练习，才是核心需求。 在大众运动里，找对手很容易，甚至不缺免费的伙伴。但好教练却很难得：要么找不到、要么风格不合适、时间难约，成本还高。即便用户每周请一次教练，其余大部分自主训练时间，不管是颠球、空挥、使用发球机还是对墙练习，大家都希望身边能有一个 “教练”。他可以不用一直喂球，但能持续观察、给出实时指导。而这些需求，目前几乎没有产品能够真正满足。 硬氪：这些用户画像有什么特点？ 张海波： 国内外运动人群的训练习惯存在明显差异。 在海外，大多数运动几乎不存在“纯娱乐”的阶段，要么不参与、要么从开始就接受专业教练指导，训练意识普遍更强。 而国内用户往往先从兴趣玩乐切入，再逐步转向系统性训练。 这也决定了我们初代产品是主要服务于资深运动爱好者，即面向掌握特定技巧、提想升运动能力的用户。这类人群熟悉运动本身，他们渴望在真实比赛里赢更多球，但缺乏明确的训练目标，需要借助设备辅助练习。 对这类用户而言，成本账很容易算清：线下教练课时费即便偏低也要100美元/小时，进阶课程更是高达200至500美元不等。庞伯特的发球机器人价格段覆盖1000–5000美元区间，无论是作为日常辅助训练工具，还是替代部分教练功能的AI Coach（运动AI助教），对长期训练的用户来说都是很高的性价比。 「手-眼-脑」一体化架构 硬氪：从乒乓球到网球、再到匹克球、羽毛球等，庞伯特在运动场景拓展上是如何选择的？ 张海波： 庞伯特定位是一家做多运动的AI机器人公司。运动本身没有国界，首选乒乓球是因为这项运动我们最熟悉，团队有充足的运动数据和技术积累，能迅速推出产品帮公司起步。 庞伯特智能乒乓球发球机器人（图源/企业） 在第二项运动选择时，我们的标准只有一个——必须是全球化运动。 相比于羽毛球受众主要集中在中国及东南亚地区，棒球偏向美国、日本等单一区域市场，网球具备高度全球化属性。后续我们也会围绕全球化赛道陆续单点突破，包括面向美国的匹克球、欧洲的板式网球及日本市场的棒球等。 硬氪：不同运动的动作模式与击球逻辑有明显差异，其背后的算法是否具有可迁移性？ 张海波： 乒乓球、网球、匹克球、板式网球、羽毛球等均可归为隔网类运动。这类项目底层逻辑高度相通，场地环境相对固定，上网、退台、进攻、防守的技战术框架基本一致，界内界外判定、正反手动作与攻防转换时机等规则也高度相似。 但乒乓球是其中最难的场景。它的运动变量复杂，旋转维度、转速差异大，回合节奏极快，攻防转换发生在数百毫秒中。 相比之下，网球的旋转变化更少，单回合时长接近2秒，控制难度明显更低。因此，在我们解决了乒乓球的发球控制、视觉感知与AI模型等技术难题后，再切入网球等其他隔网运动时，是能迅速形成降维打击的。 硬氪：具体到产品端，AI能力如何体现？ 张海波： 我们将AI Coach拆解为手、眼、脑三个核心能力模块。“手”对应发球与供球系统，能够精准复刻专业教练的出球线路与旋转；“眼”是视觉感知系统，负责实时捕捉运动场景与动作数据；“脑”则依托大模型实现自然语言交互，对用户击球动作、战术思路进行分析与反馈。 具体到实际场景中，AI Coach主要提供两大能力，一是对用户运动能力定级，并制定个性化的训练计划；二是提供实时动作指导与语音反馈。 它的训练过程对标真实教练的工作流程，喂球、纠错、喊话、撰写训练报告等，复刻专业人员的教学行为，并增加了设备同步的优势；同时，我们也会防止出现冗余的创新设计分散用户注意力。当用户认为，使用庞伯特的产品能获得与数百元一节的私教课程相近的体验时，这款产品就是成功的。 硬氪：“手、眼、脑”三个能力模块在实际训练里，现阶段哪一个技术成熟度最高？ 张海波： 我们积淀最深厚的还是“手”，也就是发球与供球系统。 多球训练是网球、乒乓球、羽毛球等隔网运动里最核心的训练方式。通常我们看到，教练站在固定位置，拿着球筐或球车，给你喂出不同落点的球：左边一个、右边一个、往前一个、底线一个。 在这个过程里，教练真正关键的作用其实是不纠结于单次失误，默认动作有效，持续稳定地送出下一球。 这个逻辑听起来可能有点反直觉，很多人会觉得AI Coach就该实时纠错 。但事实上，基础训练阶段的“忽略错误”远比“纠正错误”更重要。 训练的本质，是通过固定球路的大量重复形成肌肉记忆，而不是被随机击球打断节奏。 庞伯特PACE系列智能网球发球机器人（图源/企业） 我们的发球机器人也是按照这个原理设计的，在固定位置按既定线路与节奏稳定出球，不追球、不打乱节奏，帮助用户高效完成成千上万次标准化重复练习。 “手”的发球能力是一切智能指导的基础。没有稳定、精准、可重复的供球能力，后续的视觉感知与智能分析也就无从谈起。只有把球喂对、喂稳，用户才能进入有效训练状态，视觉系统捕捉到有意义的动作数据，大模型才能基于正确的上下文进行分析和反馈。 所以我们坚持先做“手”，铺开产品，积累球路数据和用户训练行为，再逐步加入“眼”和“脑”的能力并持续迭代。 硬氪：从一项运动拓展到另一项运动时，产品定义层面的核心难点是什么？ 张海波： 每进入一项新的运动，对运动本身的理解至关重要。不同运动挑战的是人的不同极限：网球侧重折返跑动与力量，乒乓球考验瞬时反应和手上细微动作，羽毛球则需要高低切换的协调性和跳跃能力。 核心在于，我们要用AI交付什么？AI Coach的脑子、眼睛、手，分别在这项运动中提供哪些能力。 以网球发球机器人为例，我们没有选择摄像头， 而是自研了传感器来实时跟踪用户的跑动状态 ：因为网球场的跑动范围达几百平方米，教练喂球时，需要根据用户的跑动位置来决定下一个球的时机与落点。这正是我们挖掘出的关键差异点，也是产品能获得用户认可的原因，只是把上一代功能简单放大搬过来是行不通的。本质还是对场景的理解和定义。 硬氪：硬件方面的壁垒体现在哪些方面？ 张海波： 体育赛道的硬件壁垒其实很高，但用户的感知度没有那么强。 我们的网球发球机器人采用了定制电机与自研驱动方案，能做到60转的上下旋，高度还原职业选手级别的旋转强度与真实击球弧线，实测球速达到130公里/小时。此前市场上部分产品的实际球速约为80公里/小时。但对普通用户而言，这些参数是抽象的，很难直观感受到差异。 庞伯特PACE系列智能网球发球机器人（图源/企业） 硬氪：考虑到用户运动能力的差异，对“有效训练”“能力提升”的判断标准也不相同。从哪些维度来判断，你们的产品对不同用户都能真正有效？ 张海波： 用户其实只关心一件事——我能不能涨球？涨球就是练习更高效。 过去，庞伯特的平台里已经积累了100万组球路，网球也有超过20万组。数据量大了，我们就能让发球机器人发出的球像真人在发球。具体来说，这种“真人感”体现在它发出的球能匹配用户的当前水平，让TA接起来舒服，但又不会太舒服。 在此基础上，我们的AI Coach会在每次练习后，细致地告诉用户进步在哪里、哪里需要改进，比如脚再往前一点、重心再高一点。用户只要跟着练两三天，就能明显看到进步，同样一个球打起来的稳定性会显著变好，这种感知非常直观。 用户要的就是这种实实在在的提升，而不是一个花哨的概念。最终落脚点很简单，用了这台机器，运动能力确实在提升。 「把蛋糕做大」 硬氪：这两年市场上出现了很多新形态的发球机器人，比如移动底盘、网兜接球、全自主跑动等，跟庞伯特有哪些区别？ 张海波： 行业里出现一些结构新颖的产品，初期确实足够吸引眼球。但用户的新鲜感褪去之后，这类产品终究要回答一个核心问题，它是否真的能帮助用户提升运动水平？ 如果答案是否定的，就无法获得长期使用与复购。市场数据也能印证这一点，不少同类产品的个人用户复购率和活跃度并不高，更多是球馆采购作为体验式项目。 因此，在多运动产品矩阵中，我们每开拓一个新的运动品类，首款产品都会坚持从专业训练场景切入，优先服务职业选手与资深爱好者，以稳定可靠的性能、可量化的训练效果，建立核心人群的认可与信任。 体育行业的一个鲜明特点是，不存在一款产品能通吃整个市场，它的人群需求是高度分化的。如果第一个产品没有占领这个心智，很快就会被别人取代。 不管面向什么市场、用户是哪个年龄段，运动人群的核心诉求始终是专业可靠。就像今天选购网球球拍时，用户更倾向费德勒签名款，因为它代表着权威。这与是否拥有签名无关，而是专业定位本身，就能为用户带来认同感与信任感。 硬氪：反映到具体产品与价格布局上，你们采取了怎样的定价策略？ 张海波： 以乒乓球为例，我们的产品线是从高端往下延伸的。最早做的是10万元级设备，先立住标签；再逐步推出6000多元的中端机型，再到1000多元的大众款，价格不断下探。 网球发球机器人也是同样的路径。我们对每一款产品的定位和边界都定义得十分清晰，让不同用户在对应的价位段内，都能获得适配且专业的体验。 愿意选择10万元设备的职业选手，看重的是动作还原度与训练真实性；购买5000元价位的深度爱好者，更关注旋转、速度与数据分析能力，希望借助设备持续提升水平；而2000元左右的机型，既能满足初学者练习，也适合家庭休闲与亲子陪伴使用。 硬氪：目前来看，整个AI+体育市场的发展速度，跟你创业初期所设想的一致吗？ 张海波： 我觉得比预期要慢一些，但依旧很开心。过去，各种发球机在专业用户与运动爱好者中的渗透率不足10%，因为传统产品体验不好，技术陈旧、功能单一，几十年没更新过。但到了现在，数字化、AI技术的融入，加上中国成熟的供应链能力，增量空间被彻底打开。 硬氪：大量创新公司涌入智能体育硬件赛道，你怎么看待这一波热潮？ 张海波：以前搞体育创业的人很少，它为什么不能成为科技密度最高的产业之一？ 我觉得这个趋势正在发生，最近两年明显多了起来。 一个产业的科技密度，本质上是科技人才的密度，这是很重要的指标。体育应该被更多人重视，尤其是被科技圈重视，这样才能通过技术研发的力量催生新方案、提供好产品给用户，形成正向闭环。 有越来越多的企业在进入这个行业，这是好事。大家一起拱增量、把蛋糕做大，这是我们一直等的第一个milestone。 本文由「 黄 楠 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 企业授权 +1 11 好文章，需要你的鼓励 黄 楠 新锐作者 19 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.279 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 专访Eight Sleep CTO：被马斯克们买爆的AI床垫，进中国先砍一刀订阅费 36氪独家专访 | 拿到大疆、美团投资后，智能派追赶拓竹，要打“老二”翻身仗 专访荣耀AI专家李向东：端侧AI方向还没收敛，但AI手机是最好的载体 对话前阿里高管、天猫设计家CEO：这些年烧掉千亿，家装行业还能怎么做？ 36氪专访 | 前小米高管王腾的下一站：从睡眠入手，抓住AI硬件十年一遇的创业窗口 前迪士尼工程师和MJ联创，要做一款「会呼吸」的DIY仿生机器人｜硬氪专访 小牛电动胡依林：一家成立12年的两轮电动车厂商决定转型AI，“all in or nothing” 追觅生态链多了家清华系公司，要用AI储能融入智能家居体系｜硬氪专访 36氪专访 | 秘密递表后认购超5000倍，华沿机器人CEO说想再低调一点 黄 楠 新锐作者 关注智能硬件、具身和出海。欢迎交流 发表文章 271 篇 最近内容 智能锂电园林公司完成数千万元融资，出货量破万台｜硬氪首发 2026-04-21 半年融资近2亿，他要用AI发球机器人解决全球1亿人的训练难题｜硬氪专访 2026-04-14 OBSBOT寻影新品发布，在口袋直播摄像头中实现AI智能跟踪与4K画质｜最前线 2026-04-09 阅读更多内容，狠戳这里 提及的机构 蓝驰创投 为下一个变革而生 下一篇 痛缴百亿与放弃继承，日韩遗产税为何如此夸张？ 有钱继承，没钱交税 2026-04-14 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀