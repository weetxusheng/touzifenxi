          text: '字节再试AI硬件：用收购补充团队、两条产品线共发力丨 Long China 50独家-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 广东 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 字节再试AI硬件：用收购补充团队、两条产品线共发力丨 Long China 50独家 邱晓芬 · 2024年05月29日 17:33 内部分为O线和D线两条产品线，负责人恰好都为字节此前收购的公司CEO。 作者丨邱晓芬、邓咏仪 编辑丨苏建勋 字节跳动正在AI领域倾注极大力量，除了在大模型应用等软件侧发力，其对AI+硬件的探索也未曾停止。 36氪从多位知情人士处获悉，字节AI硬件方向的探索，在内部分为两条产品线： 一条产品线代号为“D线”，负责人为李浩乾，其为OWS（Open Wearable Stereo，开放式可穿戴立体声耳机）耳机品牌Oladance创始人。不久前，字节收购了这一品牌。 目前，Oladance团队正在融合进字节体系， 整体归在字节跳动移动OS中台业务部下，李浩乾向邹伟汇报 ——邹伟曾经为锤子手机的软件负责人，在锤子手机被收购后加入字节，曾经是字节Smartisan OS的负责人。 另一条产品线为O线，负责人也是字节曾收购公司的创始人， 其向字节跳动技术副总裁洪定坤汇报。 36 氪向字节方面求证，豆包相关负责人表示： 1、豆包业务正在探索与智能可穿戴设备相结合，为用户提供更自然和便捷的交互体验。同时， 我们也会把豆包能力开放给各种硬件厂商 ，希望能够为硬件厂商和豆包大模型/豆包AI助手的合作提供设计参考； 2、组织人事及相关汇报信息不实。 36氪了解到，O线是一个跨组织的团队，不仅承担起字节AI硬件的探索工作，其和字节的AI应用团队Flow也有紧密合作关系。事实上，O线早在疫情期间就已成立，承载着字节高管对硬件终端探索的期待。 一位知情人士告诉36氪， 字节高层重点参考了微软的产品思路和业务体系， 产品布局也颇有相似之处——微软在底层的消费级硬件产品有个人电脑，而到软件层面，建立了从Windows系统、到Teams等办公协作软件的“全家桶式”生态； 类比下来，字节体系的O线，对应面向To C的硬件入口，而字节旗下的办公协作软件飞书，则对应微软的Teams。 据36氪了解，从品类来看，字节在AI硬件的探索上目前分为两大类： 其中，D线的重点将放在 带有AI能力的可穿戴设备上 ，延续此前Oladance团队在耳机上的经验——李浩乾在创业前曾经是耳机厂商BOSE高管；而O线当下的重点则是研究 手持类AI硬件设备 。 此前曾有媒体消息称，Oladance团队后续将探索和此前Pico类似的头显产品。不过36氪经求证发现， 这一消息不实。 尽管手持类设备并没有成型的形态，但36氪获悉，字节跳动在O项目开始之时，曾尝试与小米、金立等厂商寻求合作，但并未谈拢。 一位知情人士称，O线未来也将寻求多个场景中的落地，其中或许包括教育。 有接近这两项目的知情人士告诉36氪， 张一鸣对于AI硬件的探索保持高度关注 。此外，36 氪了解到，为了补充团队核心力量，字节近期正在密切关注手机行业的候选人。 行业对AI硬件的探索热情，源于PC、手机称霸多年后，如今正面临创新与出货量的双重瓶颈，亟待探索下一代通用计算设备的新形态。 字节虽在应用领域负有盛名，但其在硬件的探索并不成功，过往来看： 2019年，字节宣布收购锤子手机，并推出了坚果手机、TNT显示器套件等产品； 2020年，字节又成立“大力教育”品牌，开始布局教育场景台灯产品，并且在锤子手机探索两年无果后，字节很快宣布放弃手机品类的研发，将原锤子团队并入教育硬件团队； 2021 年，字节又高调以90亿元收购头显厂商 Pico，但不到两年，Pico OS团队被整体并进字节跳动产品研发和工程架构中台，市场、游戏、视频部门出现大裁员。 对字节来说，此轮再试水全新的AI硬件研发，不仅仅是产品形态本身的变革，本质上更勾连着交互方式（新的操作系统）、内容获取方式（从APP到AI Agent）的大变革。 而对于字节来说，此前不管是在锤子手机、大力教育硬件、Pico，都储备了一定的硬件项目管理认知，也有交互操作系统的经验储备。 不过，后续字节如何在AI硬件上取胜，还考验着他们对于硬件方向的投入意愿、耐心、以及软硬件结合的能力。 补充阅读： 《Pico裁撤，字节VR大力没有出奇迹丨深氪lite》 我们将持续关注字节在AI领域的进展，如果你愿意交流，欢迎添加文末作者微信。 end end end 本文由「 邱晓芬 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 采访供图 +1 164 好文章，需要你的鼓励 邱晓芬 作者 80 收 藏 +1 1 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 相关专题 36氪编辑精选丨一周重磅商业报道盘点 Vol.192 有数据，有观点，有真相，带你回顾过去一周商业大事件。 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 智界要打翻盘仗：V9给了年均12万辆指引｜36氪独家 字节跳动2025年海外营收占比创新高，AI投入致公司净利大降70%｜独家 自变量机器人完成近20亿元B轮融资，小米战投、红杉中国领投丨智能涌现独家 小米汽车重磅任命：胡峥楠任CTO，宋钢任参谋长｜36氪独家 欣旺达装车特斯拉，供应全球车型｜36氪独家 阿里电商 AI 新动向：围绕 Token 重构电商，组织迎来新一轮调整｜独家 轻舟、元戎秘交上市资料，和Momenta冲刺港股IPO | 36氪独家 抖音生活服务组织架构大调整，中小商家更重要了｜独家 36氪企业全情报：AI 舆情大数据，让投资决策快人一步 邱晓芬 作者 关注科技，交流加微信：13750430427 发表文章 849 篇 最近内容 自变量机器人完成近20亿元B轮融资，小米战投、红杉中国领投丨智能涌现独家 2026-04-20 专访荣耀AI专家李向东：端侧AI方向还没收敛，但AI手机是最好的载体 2026-04-17 小牛电动胡依林：一家成立12年的两轮电动车厂商决定转型AI，“all in or nothing” 2026-04-01 阅读更多内容，狠戳这里 下一篇 把握“换新”机遇 三方面着力促产业创新升级 以旧换新的策略不仅要着眼于“换”，更要注重“质”与“智”的提升。 2024-05-29 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
