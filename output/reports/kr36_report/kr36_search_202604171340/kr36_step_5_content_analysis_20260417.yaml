          summary: '如果把心脏当成一个机械泵是一个社会的悲哀'
          text: '北大医学博士：80%猝死的人，平时看起来都很正常-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 北大医学博士：80%猝死的人，平时看起来都很正常 一条 · 2026年04月17日 08:55 如果把心脏当成一个机械泵是一个社会的悲哀 今年3月，年仅41岁的教育博主张雪峰因心源性猝死在苏州离世，引发了全网对“心源性猝死”的关注。随后，全国多地三甲医院的心内科门诊量显著增加。 社交媒体上，不少年轻人分享了自己挂号“查心”的经历： “半夜胸闷气短睡不着， 紧急去医院做心电图”， “36岁看完演唱会手脚发麻， 打120去医院发现是急性心梗”。 我国院外的猝死生还者不足1% 社交媒体上，分享在心内科挂号经历的年轻人 根据权威医学杂志《柳叶刀》的一项研究，心血管疾病稳居中国居民的“头号杀手”，致死率高于癌症。而当加班、熬夜、精神高压、高脂饮食成为日常，当“拼命工作”、“自我超越”被越来越多的人当作人生信条，作为生命中枢的心脏，正在承受沉重的负担。 杨进刚是中国医学科学院阜外医院的副主任医生，健康教育中心主任 杨进刚（右）在急诊室 3月底，一条在北京见到了心内科医生、北京大学医学博士杨进刚，他工作于“全世界诊疗量最大的心脏专科医院之一”的中国医学科学院阜外医院的心内科。从业32年，他发现患者中的年轻面孔越来越多：“现在三四十岁做支架开始常态化”。 拍摄当天，他的门诊里近一半患者是80后、90后，“头痛胸闷”、“连续熬夜”是大家频繁提及的关键词。 我们如何关注心脏健康？猝死可以预测吗？多运动就一定对心脏有益吗？杨进刚给出了一个有力的警示：心脏不仅仅是一个医学问题，“它是一种感应，是一个社会协作的结果。如果只把心当成一个机械的东西，是一个社会的悲哀。” 01 80%猝死的人， 都是看起来正常的人 Q：您是什么时候开始关注猝死的？ A： 我最早关注猝死是在2013年，当时我的一个同事猝死离开了我们，只有48岁。他是一个非常和蔼善良的神经科医生。因为心脏病和脑血管的病人是重合的，所以我们经常在夜里见面，一块值夜班，去会诊同一个病人。 我们那会儿平均每周至少要工作72小时，工作紧张、高压力，生活也不规律，当时我就想，我们医生都猝死了，那么对公众来讲是不是更可怕？ 这些年我见过太多的高管、精英，他们总有一种观点：我是最好的，我还能做得更好，所以无限制地加班，无限制地追求利益。他们还有一个普遍的特点：自己都是对的，不听劝。 电视剧《都挺好》中疲惫的程序员 作为医生，我们建议他你要多休息，不要太高强度地工作，他们会说“我的身体没问题”，因为过去经验里，都是超强的精神信念支撑他们做得更好。我曾经见过一个非常厉害的高管，掌握着上千亿的资金规模，血压很高。熬夜之后又拿起一根烟，后来他因为猝死离开了，去世以后一条生产线就没了。 Q：猝死可以分为哪几类？什么是猝死人群的“二八定律”？ A： 猝死可以分为两大类，第一类：“心源性猝死”，包括心梗，主动脉夹层肺栓塞这一类跟心脏血管疾病有关的。心源性猝死占所有猝死人群的80%以上； 还有一大类：脑血管疾病，像脑梗脑出血，大面积的脑疝，可以导致猝死。 在猝死的病人中，我们有一个概念叫“二八定律”，意思是80%猝死的人都是平时看起来正常的人；相反，重病病人，包括心梗、心衰、做过支架、搭过桥的病人，在所有猝死的人群里占比连20%都不到。 Q：这些年，城市中产群体里有一股健身热、马拉松热，但也时不时有新闻爆出：有人在大量运动后猝死。怎么看待这种运动猝死的现象？还是说，这是一种认知偏差？ A： 适度的运动对我们的心脏有益，但不是强度越高越好，也不一定非得是“力竭”的程度。其实，从心脏病预防的角度，我们不提倡持续的、超高强度的运动。 我们最近有一个跑马拉松的病人，在发现他有心脏病的三个月之内就去世了。这个病人有很严重的心肌病，不能耐受高强度的活动，但在这种情况下，他的跑步成绩竟然还很好。 在来医院前，他晕厥过一次，突然地意识丧失，还是他妻子压着他来检查的。我们当时就告诉他，不能再跑了，但他自己不信邪，还要再跑。所以我们不鼓励所有人都不限制地去跑马拉松。运动是需要个体化的，尤其是高强度的竞技运动，需要进行身心的专业评估。身体很多时候给我们的一些信号，你要能够理解、体会。 Q：心源性猝死、心脏骤停和心梗的关系是什么？ A： 心梗是一种心脏的疾病，我们心脏是靠冠状动脉供血的，如果冠状动脉里发生了问题，比如斑块破裂（ 注：斑块是血管壁上像粥一样的脂质沉积物，它破裂后就会形成血栓、堵塞血管） ，让血管变得更为狭窄，甚至使冠状动脉完全闭塞、使血流一下中断，就会导致心肌坏死，进一步可能会引发心脏骤停。如果心脏骤停没有及时抢救成功，最终会发展为心源性猝死。 但不是所有的心梗都会导致心源性猝死。 Q：通常哪些原因会导致心源性猝死？ A： 生命八要素其实能够涵盖心源性猝死的主要风险，分别是血压、血脂、血糖，就是我们俗称的“三高”，缺乏运动，不健康饮食，睡眠压力，肥胖，吸烟。如果能管理好这几个要素，虽说不能100%预防猝死，但一定能大幅降低它的风险。 敌意的情绪也是诱发心梗的一个重要原因。有越来越多的研究表明，敌意情绪、偏执的性格会让身体发生多重变化，第一就是血压升高，第二就是心率加快，第三就是身体内的炎症水平增加。 炎症是身体里免疫自我修复的过程。但经常生气会持续推高炎症水平，导致更多组织被破坏，身体不得不派更多修复物质，结果反而让血液处于高凝状态，有害的因子增加。久而久之，就会促使动脉粥样硬化越来越大、斑块越来越大，斑块也更容易破裂，更容易长血栓，增加心血管疾病的风险。 02 猝死像地震一样： 无法预测，可以预警 心内科门诊中的年轻患者显著增多 Q：猝死有年轻化的趋势吗？在您的门诊里，来看心血管疾病的年轻人越来越多了吗？ A： 这些年，猝死人群的数量发生了显著的增长。国家心血管中心做过一个统计，2005-2006年，当时我国约有54万人死于心源性猝死。2026年，随着我们社会的进程加速，这个数字还在增加。 心血管疾病确实在经历年轻化的趋势。90年代，我还在当小大夫的时候，都是四五十以上的病人，现在三四十的人得心梗，甚至做支架都已经开始常态化。甚至十几岁的孩子也有心律失常、高血压的情况。 我还记得1994年，我上班的第一年，那会儿医院里一年也就来一两位急性心梗的病人。但到了现在，我们阜外医院每年经手的急性心肌梗的、做介入的有1000多例。 Q：猝死人群中，性别比例是怎样的？ A： 心源性猝死存在明显的性别差异，不同年龄段的男性发生风险都高于女性。北京安贞医院的一项研究表明，45岁以下的心梗人群里95%都是男性。 Q：在中国，发生心脏骤停的存活率是多少？ A： 心脏骤停的黄金抢救期非常短，心脏停跳6秒，人的意识就丧失了，超过4分钟就开始出现心脏坏死和脑坏死，这就是“黄金4分钟”。人的自救是不可能的，猝死心肺复苏的生命链，是由别人启动的。 北京有个调查，院外心脏骤停患者的存活出院率是1%。而在美国最好的城市，这个数据能达到10%。 急性心梗患者通过120救护车去医院的比例只有15% 全世界心脏骤停抢救成功概率最高的地方是在拉斯维加斯的赌场，他们的心肺复苏成功率能达到50%。为什么？因为赌场是高危区域，到处都有监控，一旦有人倒地会被第一时间发现；此外，保安都是经过了严格的心肺复苏的培训，而且身强力壮，同时意味着按压的效率很高；最后，赌场的AED的配置率很高，所以总体来说救治成功率很高。 Q：院外心脏骤停的存活出院率为什么这么低？ A： 中国有2/3心梗的病人都死在了医院外。我们为什么院前猝死比例那么高？首先大多数心梗的病人不知道自己发作的时候是心脏病，通过120救护车来医院的比例只有15%；还有1/3的病人是超过12小时才到达医院，已经失去了再灌注、介入和溶栓的机会，救治的意义就很小了。 AED覆盖率低是一个问题，但我们不要去神化AED。心脏骤停的时候有两种情况，第一种是心电图完全成直线，这个时候只能做心肺复苏；另外一种叫室颤，心电图上它是一种乱放火花、紊乱的状态，只有这个时候AED是有效的。 当陌生人突然倒地，周围人的响应也取决于这个社会的信任度 此外还有一整个社会救治链条的缺失，以及人和人之间的信任问题。我曾经在医院里边见过突然有人倒地的情况，周边的人都是呆住了，没有反应。如果一个人没有接受过心肺复苏的训练，或者是担心救不活患者惹上麻烦，就会造成“周围没人响应”的情况。 现在，我们中国有好人法了，就是说你去救了人，但是出了问题可以不去负责，这就是一个很大的进步。 “我为人人，人人为我”，如果你只想着自己在倒地的时候别人来摁你、让你能活过来，但你自己不会心肺复苏这个技能的话，那么当你倒地的时候，很可能也没人来帮助你。事实上，当猝死发生的时候，能救你的大概率都是普通人。 Q：猝死可以预测吗？ A： 预测猝死就跟预测地震一样是很难的，因为猝死具有很大的偶然性。 我们医学上有一个完美风暴理论，意思是需要很多因素和风险叠加在一起才会导致猝死的情况。如果你心脏有结构问题，比如血管狭窄、有斑块，但是你生活方式健康，那么即使斑块破裂，身体也能自我修复；但如果你有一系列的不健康外因，比如抽烟、熬夜、经常生气、吃高脂餐、肥胖、糖尿病，再加上心脏的基础问题，就会导致血液处于一种高凝状态，那么斑块破裂就会成为一个导火索，引发心梗。 Q：猝死前会有什么征兆吗？ A： 猝死的预测很难，但是猝死的预警是可以的。比如胸骨后或左胸部突发持续的剧烈疼痛，手掌大小，并同时伴随出汗。放射痛，也是心脏病的一个比较典型的特点。如果这种胸痛持续到十几分钟，甚至二十分钟，大概率就是心梗了，下一步就是要叫救护车，送你到正确的医院。 如果你日常生活里经常胸闷气短，其实身体已经给了你一个警示信号。如果不是立即去医院做检查，也要思考一下，要不要休息或者改善一下生活方式？ 03 如果把心脏当成一个机械泵 是一个社会的悲哀 Q：我们的常规体检可以预防猝死的发生吗？ A：我们现在常规的体检报告，心电图、抽血、心脏超声，都是看不到斑块的。目前，做冠脉 CT是可以发现斑块的，但对于检查的效价比在学术上尚有争议。因为做一次冠脉CT要花1000元左右，另外还会对人产生一定的辐射。 但是对于预防心脏疾病的人来说，体检里的血压、血脂、血糖异常，是可以去控制的。 Q：对于保护心脏健康，我们可以做什么？ A： 很多时候我们做科普，实际上是跟人性作斗争，跟商业作斗争。最难管的就是我们的生活方式，饮酒、吸烟、看小视频，血液都会处于高凝状态，交感神经兴奋，血压特别高。 人性对刺激的这种追求，跟我们作为养生的心灵平静是不和谐的。比如，对我们心脏最好的可能不是撸铁，而是慢跑，八段锦，太极拳。 心脏是我们生命的中枢，它是一种感应。一种社会协作的失调才导致了这个人发生问题，如果我们只把心当成一个机械的东西，忽略它的情感、社会意义，实际上就是一个社会的悲哀。 年轻时的杨进刚 Q：您作为心内科医生，平时有什么养生护心的方法？ A： 养生不是说我去泡个枸杞、不喝奶茶就能养生了。我觉得养生是一种生命的愉悦，如果你觉得身边也没有什么好事，但是你换一个视角，走到路上看一看地上的小花，也可以是一种生命的愉悦。如果进一步说，你做的事情对自己好、对别人也好，顺其自然，心态平和，而不只是严密地计算自己的利益，权衡得失，就是一种养生。 04 心肺复苏教程步骤 第一步：判断患者是否为心脏骤停 解开患者的衣领，立刻判断患者的循环和呼吸，双手触摸患者的颈动脉，颈动脉位于喉结旁开的两指三指，通过视线以及耳朵观察呼吸，判断过程持续5~10秒。如果发现脉搏无法触及或无法判断，患者没有正常的呼吸，立刻开始心肺复苏。 第二步：心肺复苏 解开衣服，暴露胸部。选择胸骨下1/3处，可以使用两侧乳头连线中点作为按压点，掌根作为按压部位，另一手覆在左手上，双臂伸直垂直下压，使用髋部作为一个支点，使用全身的力量发力，而不是只使用手臂。 按压的频率每分钟100~120次，深度为5~6厘米。30次按压后，进行人工通气。人工通气前，首先确认口鼻无异物，将头偏向一侧，如有异物，清除口鼻分泌物及异物，使用仰额抬颏法开放患者气道，捏住鼻子，用口唇包住患者的口唇进行吹气，持续一秒钟，连续两次吹气后，再次重复胸外按压。（注：公众在进行急救时可以不进行人工呼吸，只要胸外按压，就能将猝死的救治成功率增加一倍） 30:2是一次的心肺复苏循环，连续5个循环后，再次进行呼吸的判断。 第三步：使用AED 在进行心肺复苏的同时，AED到场，要立刻开始心率评估，并使用AED除颤。 当我们打开包装，会看到包装内配有主机，以及一套成人、儿童通用的LED除颤电极片。 打开主机的一刻，它会发出指示，插入电源线后，按照电极片所指示的位置，其中一个极板粘贴在胸骨右缘的锁骨下，另一个电极板粘侧粘贴在心尖的位置，也就是左侧的腋中线。 粘贴后，AED提示请大家离开患者。AED将自动进行心率分析，确保任何人不要接触患者。 当AED发出提示，判断为可除颤心率，即将进行充电。 当AED发出提示充电完毕，点击除颤按钮。完成后，要立刻恢复心肺复苏循环。 如此再进行5个循环后，再次判断心率、循环和呼吸，如患者恢复自主意识、手脚开始活动，尤其触摸脉搏和呼吸已恢复，提示复苏成功，经120转运到就近医疗单位继续治疗。 本文来自微信公众号 “一条”（ID：yitiaotv） ，作者：一条，编辑：韩嘉琪，36氪经授权发布。 该文观点仅代表作者本人，36氪平台仅提供信息存储空间服务。 +1 68 好文章，需要你的鼓励 一条 特邀作者 14 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博