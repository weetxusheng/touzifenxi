        original_content:
          title: ''
          summary: '生意社指出，近期，受多重不可抗力因素集中冲击，全球尿素供应链遭遇严重扰动，供应告急态势持续升级，直接影响全球农业春耕生产及相关产业链稳定。业内数据显示，目前全球尿素现货供应紧张，多个核心产区装置关停或降负荷运行，供应缺口持续扩大。业内分析指出，此次不可抗力引发的尿素供应短缺具有突发性和持续性，当前北半球正值春耕备耕关键期，尿素供应紧张已导致全球尿素价格大幅上涨，中东颗粒尿素价格较3月初涨幅达73%，欧洲尿素价格一周暴涨三成，后续若产能无法及时恢复，将进一步冲击全球农业生产及粮食安全，相关产区产能恢复进度值得持续关注。（证券时报）'
