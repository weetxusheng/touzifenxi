          title: ''
          summary: '在国务院新闻办公室今天举行的“开局起步‘十五五’”系列主题新闻发布会上，国家发展改革委副主任王昌林表示，“十五五”首季经济实现平稳良好开局，投资、消费、价格等指标明显改善。国家发展改革委副主任 王昌林：今年一季度国内生产总值同比增长5%，改变了去年二季度以来的下行态势，在主要经济体中处于前列。有三个指标明显改善：固定资产投资由降转增；服务消费较快增长；价格总水平温和上涨，3月份工业生产者出厂价格上涨0.5%，结束了连续41个月的下跌态势。（央视新闻）'
