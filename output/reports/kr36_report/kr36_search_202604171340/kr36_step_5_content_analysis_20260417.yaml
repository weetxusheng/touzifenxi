      - original_title: '广汽本田型格部分版本停产，涉手动挡车型'
        topic: '产业动态与公司战略'
        channel: '快讯'
        original_url: 'https://36kr.com/newsflashes/3770345723429634'
        original_published_at: '2026-04-17'
        original_content:
          title: ''
          summary: '据媒体报道，继新飞度后，广汽本田型格部分版本也将停产。记者从多个消息源处独家获悉，广汽本田调整了旗下型格INTEGRA部分版本的排产计划，涉两款手动挡（MT）车型停产。其中，型格轿跑MT后续仅生产MT冠军版，该车型5月份仍有少量排产。目前，广本已通知旗下各门店停止接收前述相关车型订单，并要求提前做好客户沟通与解释工作。该消息获广本方面知情人士证实，其表示，型格其他普通版本还是正常销售的，“这两个派生都是很小众的，本身排产就比较少或者是订单式生产的。”（界面）'
