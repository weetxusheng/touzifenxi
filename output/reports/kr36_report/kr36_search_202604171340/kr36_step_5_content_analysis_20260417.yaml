          text: 'AI大模型吞噬软件路径推演-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 AI大模型吞噬软件路径推演 锦缎 · 2026年04月17日 08:55 模型吞噬软件，本质是先进生产力对落后商业模式的替代。 2023年AI爆发以来，绝大部分人都没敢如此设想，大模型有一天可能会吞噬一切——软件、互联网、工作机会；而对比鲜明的是，AI原厂年化收入ARR呈现指数级上升趋势。 图：海外AI原厂年化收入快速增长资料来源：epoch.ai 今年以来，软件行业成为市场对“被吞噬”担忧的焦点领域，美股软件ETF（IGV 指数）年初至今跌幅已达 24%。由于软件产业以 2B 业务为主，且国内市场空间相对有限，其背后的产业变革逻辑，往往难以被市场理解。 事实上，以北美为主导的全球软件产业体量庞大，当前产值已接近 5000 亿美元，IDC 更是预测2029 年全球 SaaS 市场规模将逼近 1 万亿美元。但这片广阔的增量市场，正面临被 AI 原厂分食的局面。 2026年被定义为 AI Agent 元年，大模型能力持续突破并深度融入企业工作流，传统软件厂商的核心护城河被逐步瓦解，“模型吞噬软件”不再是行业猜想，而是正在发生的产业现实。 理解这场变革的深度与广度，是每一个人都无法回避的课题。 01 聚光灯外的质变：Anthropic精准狙击 1.软件商业逻辑在被从根本上动摇 "模型吞噬软件"这一担忧的核心，并非指软件产品会从市场上消失，而是大模型通过自然语言交互大幅降低了软件的使用门槛，形成"民主化"。 当任何软件都可以通过接入大模型来提升交互体验时，传统软件公司的前端界面优势便急剧贬值，其付费逻辑在AI时代正在逐一瓦解： ●一方面，大模型的技术能力已能实现传统软件的绝大多数核心功能，且在交互效率、流程优化、灵活适配性上胜过传统软件； ●另一方面，传统软件行业的商业模式、价值评估体系仍停留在信息时代，难以适配 AI 时代的生产力需求。 SaaS行业的订阅制模式是过去十年软件产业最重要的商业模式创新，核心是软件企业提供持续更新的产品和服务，客户按月或按年支付固定费用获得使用权限。 这种按席位付费的模式，本质是客户为“使用权利”付费，而非为“实际价值”付费——无论实际使用效率如何，客户都需支付等额订阅费。 这种模式为软件公司带来了可预测的现金流和较高的客户生命周期价值，这也正是此前SaaS公司享受高估值的关键支撑。 但从企业客户端来看，席位制订阅存在两大核心痛点：一是闲置浪费突出，北美大企业调研显示，企业购买的软件席位实际仅 40%-50% 被有效利用，却仍需支付全额费用；二是价值难以精准量化，软件对生产效率、运营成本的实际影响，企业只能主观判断。 与传统 SaaS 形成鲜明对比的是，AI 原厂普遍采用基于使用量、基于效果的定价模式：Claude Opus4.5 以百万 tokens 为计费单位按实际使用量收费，Sierra 等厂商更是直接按问题解决、任务完成效果收费并进行价值分成。 这种贴合企业实际需求的定价模式，动摇了传统 SaaS 厂商的商业模式根基，也让市场对“模型吞噬软件” 的担忧达到顶峰——这不仅是技术层面的功能替代，更是对行业底层商业模式的彻底颠覆。 也正因如此，即便最新财报季 SaaS 企业业绩基本都未下修，市场仍将整个板块估值打了 7 折。 图：IGV指数2026年至今跌幅超24%资料来源：Wind 2.Anthropic的成功表明这些担忧不无道理 市场对 OpenAI 的认知更为深入，源于其 2C 的业务定位；而要判断 “模型吞噬软件” 是否具备商业现实性，坚定走 2B 路线的 Anthropic，才是最具参考价值的研究样本。 三年前，大模型训练领域曾出现明显路线分歧：OpenAI 押注 “大力出奇迹”，先打造高性能模型再通过人类反馈优化；Google 侧重打造模型全家桶赋能自身生态；Anthropic 则坚持模型需从底层架构实现可控、讲逻辑、守规则，由此选择从编程场景切入，坚定2B路线。 Anthropic在商业上还抓住了企业级市场的核心需求：企业需要的不是单一的 AI 工具，而是能融入现有工作流、提升生产效率、交付实际价值的解决方案。 比如Anthropic 跳出对话框调用模型的基础形态，将模型能力封装为可复用工作单元，嵌入Excel、PowerPoint 等办公工具，与传统 SaaS厂商的 “功能叠加、席位收费”截然不同。 标志性事件体现在： ●2025 年，Anthropic 在企业编码市场份额高达 42%，成为企业级 AI 市场 TOP1； ●Claude Code的上线更是标杆事件，开发者可以通过自然语言指挥AI完成代码编写、调试、重构等全流程工作，上线后短期即实现约10亿美元年化收入，成为Anthropic企业级业务的核心增量； ●后面的Claude Cowork 通过 11 款开源插件覆盖法律、销售、数据分析等多个领域，直接切入企业日常工作流。 最终这种技术突破直接转化为商业价值，2026 年 3 月初，Anthropic的 ARR 正式突破 190 亿美元，成为企业级 AI 赛道的核心玩家，也让市场看到了大模型重构软件行业的实际路径。 图：Anthropic ARR（亿美元） 资料来源：The information，国信证券 紧随其后的是OpenAI，也开始把企业级市场作为核心增量来源：25年收入占比达到40%，今年有望继续提升到60%。 图：OpenAI 来自企业端的收入比例 资料来源：The information, Open AI 02 AI吞噬软件路径推演 1.标准化浅层功能率先被覆盖 大模型对软件的第一层替代，是针对标准化、浅层化的基础功能，这类功能无需深度领域知识，仅需完成数据整合、信息展示、固定流程执行，是大模型最易替代的领域。 例如，基础的文本编辑与生成、市场营销文案创作、基础翻译与配音、简单数据汇总与报表生成等，这些功能均可通过大模型快速实现，且无需企业额外部署软件、培训员工，使用成本远低于传统软件。 以编程领域为例，Anthropic 的 Claude Code 能实现代码生成、调试、优化，覆盖了传统编程工具的核心基础功能，2025 年企业级 AI 支出中，编程领域占比达 55%，成为最大的应用类别，传统编程工具的市场份额被快速挤压。 在办公领域，大模型能直接完成文档整理、报告撰写、表格处理，替代了传统办公软件的部分基础功能（如基础的营销、翻译、邮件回复机器人、简单的数据汇总），用户无需掌握复杂的操作技巧，仅通过自然语言指令即可实现需求。 这类被替代的软件，普遍具备三个特征：一是功能单一，仅聚焦某一个浅层场景，缺乏深度价值；二是交互逻辑简单，决策树清晰，无复杂的流程设计；三是边际成本低，大模型通过一次训练即可覆盖大量同类需求，无需像传统软件那样进行个性化开发。 比如Atlassian产品功能无独特性，无不可替代的核心价值，AI原生厂商可快速复制其核心功能；传统终端如Capital IQ，随着Anthropic、Perplexity等通用AI工具加速发展，价值快速被冲淡。 2.企业工作流开始遭遇替代风险 传统软件的核心价值之一是承载企业的标准化工作流，通过固定的流程设计，规范企业的业务操作，例如 CRM 软件承载客户管理流程，ERP 软件承载企业资源管理流程，OA 软件承载日常办公流程。 但大模型通过 Agent 技术，能直接嵌入企业的工作流，实现流程的自主规划、执行与优化，替代传统软件的流程承载作用。 Anthropic的 Claude Cowork 是工作流替代的典型代表，它能在 macOS 隔离沙箱中操作文件，跨应用完成整理报表、编写代码、跨平台同步等复杂任务，还能通过 MCP 协议连接第三方工具，实现自主规划、读写本地文档及调用浏览器的能力，可替代传统OA、办公协同软件的工作流承载功能。 传统软件的工作流是固定的，企业需要适应软件的流程设计，若要调整流程，需进行复杂的定制化开发；而大模型的工作流是动态的，能根据企业的实际需求自主调整，无需额外开发，大幅提升企业的运营效率。 比如Claude Opus 4.5时代，用户可以通过构建各类型Skills的方式完成过去应用层的功能，而无需再去学习每个软件的复杂操作，大幅降低了使用门槛——用户不再需要成为软件专家，只需用自然语言表达需求，模型便会自动编排合适的工具组合来完成工作。 图：skills的本质是工作流和专业能力以文件夹形式封装 资料来源：Anthropic，国盛证券 3.远期担忧是模型成为生态枢纽 大模型对软件的第三层替代，体现在生态层面，也是吞噬的终极形态——大模型成为连接用户、工具、服务的核心枢纽，整合传统软件的分散功能，形成一站式的生态闭环，传统软件则沦为生态的底层基础设施，失去价值主导权。 传统软件行业的格局是“分散化、垂直化”的，不同的软件聚焦不同的领域，企业需要部署多个软件才能满足不同的需求，例如用 CRM 管理客户、用 ERP 管理资源、用 BI 进行数据分析、用办公软件处理日常工作。 这些软件相互独立，数据无法互通，流程无法衔接，形成了数据孤岛与流程孤岛。 而大模型作为通用技术底座，能打通不同软件的数据与流程，整合分散的功能，用户无需在多个软件间切换，仅通过自然语言指令，即可在大模型生态中完成所有操作。 例如，Claude 能嵌入 Excel、PowerPoint等办公工具，直接实现数据处理、文档编辑功能，所有传统软件的功能都被整合进这个入口，传统软件的流量入口价值被大幅削弱，最终沦为大模型生态的功能模块，失去行业主导权。 图：Cluade in Excel和PPT资料来源：Anthropic，财通证券 如果这是终局，那模型将主导软件生态重构与价值再分配。大模型将成为软件行业的核心枢纽和通用技术底座，所有软件都将围绕大模型生态展开，价值分配将向具备核心能力的玩家倾斜，形成“模型厂商 + 核心软件厂商 + 生态参与者” 的全新格局。 数据也能说明问题。市场预测到2029年，Anthropic的年收入将达到1500亿美元，假设企业SaaS市场规模届时达到1万亿美元，意味着Anthropic的市场份额达到15%。 与之形成鲜明对比的是，传统SaaS厂商股价持续承压。Salesforce、SAP和ServiceNow等在数据、应用场景、客户黏性上都拥有较高壁垒的公司市值大幅缩水，市场将其归为AI时代的失败者，而这种下跌不断扩散至基础软件与网络安全、甚至微软这种生态型厂商。 03 行业真实图景：转型求生为主流，部分企业已深陷困境 厘清大模型对软件行业的替代逻辑后，我们通过大量案例研究和市场调研发现，面对大模型冲击，传统软件厂商并非坐以待毙，主动转型求生成为行业主流。 传统大型SaaS厂商，其核心转型路径是将大模型能力融入现有产品，打造“软件+AI”的复合解决方案，同时改革定价模式，从“席位制”向使用量制和效果制转型。 如SAP、Oracle将AI嵌入ERP系统，提升流程自动化程度；ServiceNow将AI融入工作流编排，提升效率；Adobe将Firefly AI嵌入创意软件，增强产品竞争力。 客观来看，部分企业的转型取得了一定成效，核心在于构建了大模型难以复制的核心壁垒，主要分为三类： 1.强数据壁垒： 企业长期积累的行业数据、用户行为数据具备不可替代性。Snowflake 凭借大规模数据处理能力和海量企业数据，成为 AI 时代核心数据基础设施，预计 2029 年年化收入将突破 30 亿美元；MongoDB 作为非结构化数据存储解决方案，AI 仅改变上层交互方式，底层使用逻辑不变，反而因 AI 新需求实现增长。 2.复杂流程壁垒： 部分行业工作流具备高度复杂性和定制化特征，大模型难以仅凭通用能力精准适配。ServiceNow的核心价值在于企业端到端的工作流编排，连接多部门业务；SAP、Oracle的 ERP 系统承载企业核心业务流程，融合财务、供应链等多个环节，大模型仅能作为辅助工具融入，无法完全替代。 3.深度行业 know-how 壁垒： 在能源、工业等垂直领域，软件的核心价值在于对行业知识的深度理解和精准应用，需结合行业监管、业务特点、操作规范开发，而大模型缺乏足够的行业训练数据和深度理解能力，难以实现替代。 不过从行业整体来看，传统软件厂商的应对效果仍较为一般，部分企业甚至陷入转型困境。 Workday这类软件，此前依靠产品界面不直观、用户学习成本高形成临时护城河，而当 AI 智能体可通过接口直接对接数据时，用户无需依赖原前端界面即可完成任务，这类企业长期面临被 AI 原生厂商替代的风险。 Salesforce的案例更具行业警示意义：其 AI 能力宣传远多于实际落地，旗下 Agentforce 产品被 CEO 称为 “公司历史上增长最快的产品”，但实际付费客户占比不足 5%，上线使用的客户不到 1000 家；产品存在严重的 bug 和幻觉问题，合作伙伴缺乏实施经验，企业内部支持也严重不足。 Adobe则陷入了独特的转型困境：AI 功能做好了是威胁，做不好同样是威胁。Adobe Creative Cloud 占据全球创意应用市场约 66% 的份额，却面临 Canva 等 AI 原生工具的持续侵蚀；其 AI 产品 Firefly 因基于授权数据训练，数据集偏保守导致输出质量不足，仅能完成 70% 的生产级需求，后续需大量人工优化；更关键的是，AI 提升创作效率可能导致企业减少订阅座位数，直接影响其核心收入。 我们根据工作流的复杂度、合规要求、数据依赖性和重复性，将当前SaaS行业面临的AI冲击风险分为三类总结如下表： 资料来源：锦缎研究院总结 04 结语：本质是先进生产力对落后商业模式的替代 模型吞噬软件，不是一场突如其来的行业风暴，本质是先进生产力对落后商业模式的替代。 Anthropic的成功路径更是让市场看清了传统 SaaS 订阅制的落后性，也让 “模型吞噬软件”的担忧逐渐成为现实。 这场变革并非传统软件的消亡，而是万亿美元软件行业的底层重构与价值再分配。对于整个行业而言，这场变革是一次洗心革面的升级，它将推动软件行业从信息时代走向 AI 时代，从功能驱动走向价值驱动，最终实现生产力的大幅提升。 图：全球SaaS市场规模（亿美元） 资料来源：emarketer,国信证券 对于传统软件厂商而言，放弃被动防守、主动拥抱变革，是唯一的生存之道：要么构建大模型难以复制的核心壁垒，要么改革落后的商业模式，要么找到与大模型的互补点实现协同共生。 万亿美元规模的软件，仅仅是大模型重构产业的起点；AI最终颠覆的，是所有落后的生产力与商业模式，更大规模的互联网产业，乃至传统劳动力市场，莫不如是。 那些能够跟上时代步伐、主动进化的市场玩家，终将在这场行业重构中，占据价值重配的有利位置，重新赢回未来发展的主动权。 本文系基于公开资料撰写，仅作为信息交流之用，不构成任何投资建议。 本文来自微信公众号 “锦缎”（ID：jinduan006） ，作者：海星，36氪经授权发布。 该文观点仅代表作者本人，36氪平台仅提供信息存储空间服务。 +1 2 好文章，需要你的鼓励 锦缎 特邀作者 3 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 Kimi的问题不在对手，而在起点 美国AI，怎么也搞实名制了？ Opus 4.7 压根没想做“最强模型”：各位吹Claude的速度都跟不上Anthropic 的节奏了 一张坐标系，拆解国产大模型玩家“明牌”与“暗牌” 老黄可能开始焦虑了 世界模型元年启示录：动机、乱战与暗礁 A16z Speedrun最新一期全解析：1/3公司直接在简介展示收入数字 Token 工厂经济学，正在重构整个 AI 产业 超级战舰，智元裂变 锦缎 特邀作者 专注上市公司价值发现、创造与传播。 发表文章 814 篇 最近内容 台积电的利润率赶上茅台了 4小时前 AI大模型吞噬软件路径推演 4小时前 羊毛出在AI身上：鞋厂没了，赌场开了，股价上天了 昨天 阅读更多内容，狠戳这里 下一篇 大厂资深程序员，“未来码农的优势可能是比AI更便宜” AI取代人类工作岗位，早已不是大新闻。 4小时前 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
