          text: '2026年你真正该专注的事，其余全是噪音-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 2026年你真正该专注的事，其余全是噪音 神译局 · 2026年04月17日 07:06 把精力用在真正重要的地方。 神译局是36氪旗下编译团队，关注科技、商业、职场、生活等领域，重点介绍国外的新技术、新观点、新风向。 编者按：我们要想清楚人生的核心任务，分辨并区分自己能掌控的事和不能掌控的事，划清这条界限，然后专注于能掌控的部分。本文来自编译，希望对您有所启发。 我们不知道 2026 年会发生什么，但几乎可以肯定：一定会有事发生。那我们该想些什么？该做些什么？ 斯多葛学派的观点是：我们要想清楚人生的核心任务，分辨并区分 自己能掌控的事 和 不能掌控的事 。划清这条界限，然后专注于你能掌控的部分，你会更快乐、更强大、更成功。至少，你能把精力用在真正重要的地方。 2026年，我只专注这 13 件能完全由自己决定的事 ： 1. 管好自己的 “信息饮食” 身体不舒服、疲惫、易怒、迟钝，往往是因为吃得太差。同理，思绪混乱、无法专注时，就该清理自己的信息来源了。 去读经典旧书，读哲学，读历史，读传记。学心理学，看历史规律。 2. 主动挑战自己 塞内卡说：“我们严苛锻炼身体，是为了让它服从于意志。”我们刻意磨炼自己，因为生活本就艰难。斯多葛主义的核心，就是主动接受身心挑战，这样无论生活抛来什么，我们都能像爱比克泰德说的那样坦然：“我为此训练过。” 所以我坚持体能训练，哪怕讨厌也依然洗冷水澡。从 2018 年起，我每年都会开启《每日斯多葛》，和全球各地的 CEO、作家、艺术家、父母、学生、创业者、运动员一起迎难而上。无论如何，我们都要主动挑战、严格要求自己。 这样，2026 年乃至以后无论发生什么，我们都能说：“我为此训练过。” 3. 每天都做一点正向积累 很长一段时间，我的写作习惯都非黑即白，要么写很多，要么干脆不写。后来我降低了门槛，只问自己一句话：“今天我为写作做了一点积极积累吗？” 有时是写新内容，有时是编辑、增删；有时在家在办公室，有时在路上、在飞机或酒店；有时贡献很大，有时只是微小一步。 “改善” 的哲学就是，持续精进，每天进步一点点，享受微小成长的快乐。 4. 做只有我能做的事 《每日斯多葛》越做越大，模仿者也越来越多。于是我们不断自问： 什么是只有我们能做的？只有我们能写的？只有我们能创造的？ 比如我们的书店，常有作家来录播客，现场签名、做活动。这些书、这些体验，是别处买不到的。 这条建议本就重要，在 AI 让复制、抄袭变得越来越容易的今天，更是重中之重。很多事谁都能做，但有些事，你的位置、家庭、独特技能，只有你能做。 那就去做这些事。 5. 只和自己比 爱比克泰德说： “只参加输赢由自己决定的比赛，你就永远不会输。” 我能掌控的只有：到场、全力以赴、按自己的流程走、坚守原则、追求真正让我心动的事。 我可不可以写更通俗的内容多卖书？可不可以炒币多赚钱？可不可以像别的播客那样，为了流量请各种离谱、极端的人博争议？ 也许可以。但哲学才是我真正热爱的，加密货币我一窍不通，博眼球也不是我的目标。所以我屏蔽杂音，专注我能做的、我懂的、让我兴奋的、我珍视的事。 如果这能带来成功，那很好，而且事实上通常都会；如果能带来职业认可，那很棒，而且通常也会。 6. 主动放下焦虑 有人为政治焦虑，有人怕坐飞机，有人担心孩子。所有焦虑的共同点是什么？ 是我们自己。 机场不会让你焦虑，是你在机场里让自己焦虑。马可・奥勒留在《沉思录》里写：“今天我摆脱了焦虑，不，是我主动抛弃了焦虑。因为它在我心里，在我的认知里，不在外部。” 这听起来有点扎心，但也让人解脱： 你可以随时停止焦虑，可以选择放下。 7. 好好养育孩子 我每天最享受的事之一，就是写《每日父亲》邮件。每条智慧都来自历史、科学、文学和普通父母，发给全球约 10 万家长。 但其实，我更是写给自己。我阅读、研究、收集最好的理念，只为做更好的父亲：更有耐心，做好榜样，给孩子应对世界所需的智慧与韧性。 养孩子是我这辈子最重要的事。所以我像研究哲学、历史、商业一样认真研究育儿。想要影响几代人，想要让未来更好，就先把孩子养好。 8. 用自己的影响力支持真正重要的事 我有自己的平台，就想好好用它，传播有价值的思想、声音和事业，而不只是追流量、赚快钱。 每年 “黑色星期五”“网购星期一”，我们都会放弃巨额营收做公益。今年我们筹到了 30 多万美元，提供了超过 300 万份餐食。爱比克泰德说，任何事都有两个 “把手”。我可以抓住 2025 年所有糟糕、不满、失望的事；也可以抓住我们完成的目标、筹到的善款、帮助过的人、做过的好事。 我选择后者。 9. 保持长期视角 很多人 2026 年会沉迷趋势、热点、短暂危机。而我只专注五年、十年、五十年后依然重要的东西：品格、自律、耐心、智慧、踏实努力。 这些是永恒不变的，不管政策、头条是什么，都不会改变。 世界永远混乱，永远充满噪音。唯一能站稳脚跟的方法，就是专注长期真正重要的事。 10. 善待他人 我控制不了世界的残酷，控制不了别人的行为、不公、轻率、自私。但我能掌控如何管理团队，如何对待家人，如何对待陌生人。 世界永远不乏粗鲁、虚伪、冷漠，但我不必加入其中。 善良、耐心、公正，永远在我的掌控之中。 11. 少发表无谓观点 马可・奥勒留说： 你完全可以不发表意见。 有必要对当下的丑闻评头论足吗？它能改变什么？有必要对孩子的发型指指点点吗？别人吃素又怎么样？ 马可写道：“这些事并不需要你来评判，放过它们就好。”何况这些无谓看法常常让我们痛苦。爱比克泰德说：“让人困扰的不是事情本身，而是我们对事情的看法。” 对他人、对自己无法掌控的事，观点越少，人越快乐。 当然不是完全没有立场，而是把判断留给真正重要的事：是非、正义、道德。把精力耗在鸡毛蒜皮上，就没力气关注真正重要的事了。 12. 为社区做贡献 社区正在空心化：大型连锁店取代小商户，线上取代线下。现代很多所谓成功，都在做减法：榨取、优化、以更少成本攫取更多利益。 我想做相反的事。2021 年，我和妻子买下了镇上从 1940 年营业至今的小杂货店，又在街边开了一家小书店。从商业上看，这都不理性：有风险、成本高、极度本地化。 但如果成功只是为了更成功，那成功又有什么意义？我们做这些，是因为它们有价值，是真实的存在。 13. 别让烂人把你也变成烂人 这可能是当今世界最难的事： 不要因为别人混蛋，你也跟着混蛋； 不要因为别人冷酷，你就变得坚硬； 不要因为别人愚蠢，你就变得怨毒； 不要被愤怒拖入同一层次。 马可・奥勒留在《沉思录》里写道： “最好的报复，就是不变成那样的人。” 我对一些人的言行感到失望，但我更专注于： 绝不效仿 。 译者：Teresa 本文来自翻译, 如若转载请注明出处。 +1 157 好文章，需要你的鼓励 神译局 资深作者 37 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 智能体时代 AI 选择指南 AI的递归自我进化：那个东西的轮廓正在越来越清晰 编程智能体如何重塑工程、产品与设计 性格太 “好说话”，正在毁掉你的职业前途 职业在崩塌，工作在消亡，最聪明的人在做这件事 告别“提示词工程”：为什么说.md文件和“技能”才是AI进阶的正确打开方式？ 植入脑机设备 5 年是种什么体验？ 个人提效10倍，公司颗粒无收：AI时代的“电力悖论”正在重演 这些声音，能安抚你躁动不安的大脑 神译局 资深作者 36氪旗下翻译团队。 发表文章 8051 篇 最近内容 智能体时代 AI 选择指南 6小时前 2026年你真正该专注的事，其余全是噪音 6小时前 AI的递归自我进化：那个东西的轮廓正在越来越清晰 2026-04-15 阅读更多内容，狠戳这里 下一篇 智元旗下觅蜂发布一站式物理 AI 数据服务平台｜最前线 未来理想的采集者工作模式可能会类似于“美团骑手”——“大家可以兼职来做，但同时也要经过驿站的培训才能上岗。” 15小时前 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP