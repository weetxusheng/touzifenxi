          text: '大厂资深程序员，“未来码农的优势可能是比AI更便宜”-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 大厂资深程序员，“未来码农的优势可能是比AI更便宜” 新周刊 · 2026年04月17日 08:54 AI取代人类工作岗位，早已不是大新闻。 码农的处境，或许也预示着所有知识型工作者的未来——当AI工具比人更擅长“做事”，人还能做些什么？ AI取代人类工作岗位，早已不是大新闻。 过往两年内，我们不断经历并且似乎已经习惯了这样的消息：某科技巨头宣布全球裁员几万人，某初创公司因为引入AI而砍掉了整个BU，某广告公司用AI替代了部分设计师岗位…… 在AI的侵门踏户之下，最先感受到寒意的是文科类工作——翻译、文案、插画师、配音师，那些曾被视作创造性、审美性的岗位，正在被AI大模型一点点蚕食。 但谁也没想到，下一个被推上“待优化名单”的，很有可能是程序员。 程序员们很焦虑，一边焦虑于积极拥抱AI，用肉身帮助大模型成长的“码奸”；一边焦虑_地随大部队“上岛”养AI智能体，在巨大的变革中寻找自己的位置。 相关数据显示，2025年，84%的开发者已在或计划使用AI工具；AI工具使基础编码效率提升55%以上，重复性任务耗时减少70%；与此同时，初级程序员岗位需求同比下降约30%。这些数字背后，是一个正在被自己创造之物重构的行业。 张玮（化名）是上海某互联网大厂的前端开发程序员，入行将近十年，他见证了这个行业从“人肉编码”到“人机协作”的变迁。他的经历和感受，或许能让我们看清：当AI开始生成代码，那些创造了AI的人，正在经历什么。 （图/《社交网络》） 01 效率翻倍了，然后呢？ “目前来讲，AI大模型对我们公司，包括我本人的冲击还没那么大。”采访一开始，张玮就给出了一个意料之外的回答。 过去两年里，AI编程工具迅速席卷行业。尽管这几年张玮也听到很多网传的消息：因为AI被广泛使用，程序员招聘名额开始缩减。但他感受到的变化，更多发生在行业边界处。 “真正受影响的是那些初创公司、小公司。没有AI之前，公司如果想做一款产品或者一个网页，需要前端、后端、设计、测试……每个岗位至少各招一个人，前前后后花费几个月时间。AI介入之后，一个初级程序员用AI，可能一两天就能做一个简单的产品出来。” 这意味着，那些原本需要靠初级程序员去填补的“编码体力活”，那些我们在项飚《全球“猎身”》中读到的“技术外包劳工”，正在迅速萎缩。 （图/《社交网络》） 职业社交平台LinkedIn 2025年第四季度数据显示，初级程序员岗位需求同比下降约30% ；美国劳工统计局数据亦显示，过去两年美国编程类初级岗位减少了27%。而这种趋势，并非只发生在大洋彼岸。 当岗位在缩减，仍在岗的程序员日子就好过了吗？ “业务倒不会变得更加复杂，但你其实需要做的事情更多了——原来需要花三五天的活，现在有的人使用AI，可能一两天就能干完。”张玮说，随之而来的，是更多的需求、更快的工作节奏，“对于我们这种职业来说，本身要做的事情一直是源源不断的，只不过AI提效之后，你会有更多的想法、接到更多的需求。但其实，每个月的平均工作时长没有多大的变化，只不过从原来一个月能做3个需求，变成现在或许能做10个。” （图/《真实的人类 第一季》） 那么问题来了：效率提升的收益，最后进了谁的口袋？ 张玮分析道：如果你所在的公司正处于业务扩张期，产品经理带着需求、排着队等开发人员，那么AI带来的效率提升是皆大欢喜的——你能在同样的时间里做更多的事，公司能用更快的速度抢占市场，每个人都觉得自己在“创造价值”，这是一个正循环。 但如果员工的工作效率提升了，公司业务没有提升，情况将截然不同。“很多领导刷到AI迅速发展的新闻之后，下意识觉得AI能把公司很多岗位替代掉。”张玮说这话时，语气里带着一丝无奈。 这种公司决策层的认知错位，或许正成为整个行业里最隐秘的焦虑源头。 02 当考生成为阅卷老师 最关键的问题是：AI到底能替代多少人类的工作？ “初级工程师90%的工作，AI都能做。”张玮给出了自己的判断，“前提是那些简单的、定式的代码。”比如写一个标准的CRUD接口、生成API文档、测试。这些在过去需要初级程序员花时间磨的“基本功”，现在AI可以一秒完成，准确率极高。 但张玮认为，对于许多复杂的场景需求和业务逻辑，AI辅助编程仍然存在许多问题。“它刚开始可能可以达到70%-80%，但总会有20%到30%的出入，暂时还达不到百分之百。” 这时候，人的价值就体现出来了。 （图/pexels） “如果你完全不懂代码，你可能都看不出来问题在哪、应该微调哪个部分。你只能反复告诉AI：‘你还是没有达到我的目的’，然后等它一遍遍地试、一遍遍地改，直到某一遍改对了。 但精通代码的高级程序员，瞬间就能看出来缺了哪些东西，他可以在第二次生成时告诉AI：‘哪里有问题，你应该结合什么，再改一下哪里。’”或许我们可以这样简单理解：以前程序员是“写代码的人”，现在正变成“审代码的人”——或者说，“阅卷老师”。 “高级程序员与普通程序员的区别，不在于谁更会用AI，而在于当AI的成果没有达到预期时，你知道怎么让它改。”张玮的这个总结，或许是对当前阶段人机协作最精准的概括，而这个结论，似乎也不只应用在写代码，而是大部分创意产业上。 （图/pexels） Scrum中文网的一篇文章提到，今年2月，人工智能公司Anthropic发布的《2026年智能体编码趋势报告》指出，软件开发正从“以编写代码为中心”的活动，转向“以协调智能体为中心”的活动。 单一智能体将演变为协同团队，任务时间从几分钟扩展到数天，人类从“写代码的人”变成“带团队的人”。 “不会带团队，你就只能干到死”，这句曾经让无数职场人焦虑的“上升之道”，如今似乎加码了，已经变成“不会带团队，你就只能出局”。 张玮担忧的是另一件事——这种转变正在无形之中重塑程序员的成长路径。 过去，一个程序员要从初级走到中级，需要花几年时间写代码、看系统设计、积累业务经验。但现在，“AI可以帮一个初级程序员直接跳到中级以上”——它可以直接生成一个看似完整的方案，让你不用费劲去琢磨细节。 “为了快，大家可能会跳过前期试错、修正、积累经验的阶段。”张玮说。但有些跳过的坑，迟早是要填的。 03 人类的核心竞争力，只剩便宜了吗？ “按照现在AI的进化速度，再过两年，它能不能替代人类90%甚至99%的工作？” 张玮没有否认这种可能性：“从现在AI的发展速度来看，未来它一定能达到这种程度。” 可他话锋一转，聊起了一个更现实的东西：成本。 成本总是存在的，只是它被科技发展转嫁到了其他地方，从纯粹的堆叠人力，变成了堆叠算力。张玮说，市面上写代码能力最牛的模型收费并不便宜，而且还在涨价。他们有些同事现在一个月在AI上面花的钱，已经足够公司雇用一个实习生了。 （图/pexels） 这指向了一个深层悖论：如果AI的成本持续上涨，而人的成本被不断压缩，两者之间会不会在某个节点上达到平衡？到那时，企业是选更贵的AI，还是选更“便宜”的人？这个问题，暂时还没人能给出答案，或者说，还没到得出答案的时候。 即便AI真的能完成人类99%的工作，剩下的那1%，依然是人与机器的护城河。“AI差了1%的时候，如果业务受损，或者出现严重漏洞，你怎么办？如果代码都是AI写的，你看不懂、看不出问题，那你连解决它的能力都没有。” 张玮坚持认为AI只是人类的辅助工具，在他看来，就跟这世上大部分的工作一样，未来的程序员，核心竞争力其实还是那几种：对业务的理解、对复杂系统的把握以及在关键节点上“完善那1%”的能力。 “软实力方面，比如对业务、对市场、各个环节的沟通能力……这些AI帮不了你。硬实力方面，当你碰上问题，AI没法帮你完全解决，就差1%的时候，你得有能完善那1%的能力。” （图/pexels） 张玮还有个有意思的观察：根据他的经验，AI虽然能写出代码，但它不一定能选出最优解。“完成某个功能，可能有两三种方式。AI可能会选一种它认为对的，但一个资深程序员可能很快就能判断哪条路最简单。” 这就像一个有经验的厨师，面对AI给出的菜谱，知道哪个步骤可以简化、哪个调料可以替换，而新手只会照单全收。 “手工软件工程师的时代已经过去了。”这并非某位技术博主在社交平台上的一句夸张断言，而是来自Tessi.ai 公司CTO Ben Greene的观点。他认为，未来工程师需要把精力从单纯编码转向理解问题、设计系统以及连接真实业务场景。 也就是说，“未来最有价值的工程师，不是写代码最快的人，而是能够理解复杂系统、协调 AI 与人类协作并真正解决现实问题的人。” （图/pexels） 采访最后，我问张玮：“如果真的有一天，老板觉得AI可以完全替代你们了，你会如何去说服他？” “解释不了。大环境就是这样，当大家都很焦虑的时候，只能去提升自己的能力，让老板看到你其他不一样的能力。如果你没办法在这家公司证明自己，也只能尽早离开。” 参考资料 [1]《2025全球开发者工具报告》IDC [2]《GitHub2025报告：近半代码由AI生成，初级程序员遇冷，AI架构师成新宠》小熊财经 [3]《2026年智能体编码趋势报告：AI智能体如何重塑软件开发？》Scrum中文网 本文来自微信公众号 “新周刊”（ID：new-weekly） ，作者：皖西，编辑：腾宇，36氪经授权发布。 该文观点仅代表作者本人，36氪平台仅提供信息存储空间服务。 +1 48 好文章，需要你的鼓励 新周刊 特邀作者 7 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 Kimi的问题不在对手，而在起点 美国AI，怎么也搞实名制了？ Opus 4.7 压根没想做“最强模型”：各位吹Claude的速度都跟不上Anthropic 的节奏了 一张坐标系，拆解国产大模型玩家“明牌”与“暗牌” 老黄可能开始焦虑了 世界模型元年启示录：动机、乱战与暗礁 A16z Speedrun最新一期全解析：1/3公司直接在简介展示收入数字 Token 工厂经济学，正在重构整个 AI 产业 超级战舰，智元裂变 新周刊 特邀作者 一本杂志和一个时代的体温。 发表文章 1572 篇 最近内容 大厂资深程序员，“未来码农的优势可能是比AI更便宜” 4小时前 “对自己差点吧”，留子菜翻红火成最新流量密码 昨天 2026年了，超过10块钱的牛奶别想再套路我 昨天 阅读更多内容，狠戳这里 下一篇 不收华纳照样“暴雷”，奈飞真已“江郎才尽”？ 资金太渴望奈飞重回“好学生”正轨了。 4小时前 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
