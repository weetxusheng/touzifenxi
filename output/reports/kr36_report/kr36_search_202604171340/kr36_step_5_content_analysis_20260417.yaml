          text: '最高涨463%，算力全面涨价后，老板开始考核“谁用的Token最少”⋯⋯-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 最高涨463%，算力全面涨价后，老板开始考核“谁用的Token最少”⋯⋯ 36氪的朋友们 · 2026年04月17日 09:29 “零成本创业幻象散去”：专家预判Token经济将出现明显分化。 “抱歉了，团队没钱了。”凌晨四点多，鹤芽漫剧创始人杨浩被一条消息惊醒。发来消息的是一家9人漫剧制作团队，四天前曾承诺交付一集样片，此刻却因资金链断裂无法履约。 这并非个例。近期，OpenClaw（俗称“龙虾”）爆火掀起的全民AI（人工智能）创业热潮，在头部云厂商集体涨价的浪潮中出现降温——腾讯云部分AI模型涨价幅度高达463%，阿里云、百度智能云亦跟进涨价，AI算力成本短期内大幅上升，不仅击碎了“零成本AI创业”的幻象，更引发全行业洗牌。 《每日经济新闻》记者（以下简称“每经记者”）调查发现，随着头部云厂商大幅上调AI算力价格，中小创业者开始将Token（词元）使用量纳入员工考核，大厂则借机出租闲置算力增收，国产大模型企业加速架构优化降本。随着“零成本创业”的泡沫散去，AI产业从盲目跟风回归理性深耕，而真正的竞争才刚刚开始。 1 “凌晨三点开工控本提效”： 算力涨价463%，Token使用量被纳入考核 4月15日，阿里云宣布，自7月15日起DDoS高防（中国内地）弹性95费用上调50%，即从100元/Mbps/月调整为150元/Mbps/月。这是阿里云一个月内第三次调价。 连续涨价的还有腾讯云。4月9日，腾讯云发布价格调整公告，宣布将于5月9日起对AI算力、容器服务TKE-原生节点及弹性MapReduce（EMR）相关产品价格统一上调5%。 此番涨价，也是腾讯云一个月内的第二次调价。3月11日，腾讯云宣布自3月13日起调整部分模型计费策略，其中混元系列模型Tencent HY 2.0 Instruct的输入价格从0.0008元/千tokens大涨至0.004505元/千tokens，涨幅高达463%。同时，腾讯云还终止了GLM-5、MiniMax 2.5、Kimi 2.5等第三方模型的限时免费公测。 腾讯云之后，百度智能云也于3月18日同步官宣调价，自4月18日起，AI算力相关产品服务价格上调约5%~30%，并行文件存储等价格上调约30%。4月8日，智谱发布GLM-5.1的同时，再度提价10%，从而完成今年第三次调价。调价后，其GLM-5.1模型在Coding编程场景的缓存命中Token价格，已接近海外头部厂商Anthropic旗下Claude Sonnet 4.6水平，标志着国产大模型首次在核心应用场景实现与海外领先者的价格对齐，而这一对齐是成本端补涨而非降价追赶。 集体涨价直接导致AI创业成本翻倍。“原来做一分钟AI漫剧的算力成本低于100元，现在几乎涨到200元/分钟。”杨浩告诉每经记者，为控制开支，他不仅给每个小组分配算力额度，将Token使用量与绩效挂钩，还带着团队凌晨三点开工。“白天出一条视频要40多分钟，凌晨10分钟以内就能完成。” 鹤芽漫剧凌晨开工 图片来源：受访者提供 面对算力价格上涨，创作出爆款作品的杨浩团队仍有能力支撑，但业内众多微型团队和“一人公司”已然陷入倒闭困境。 “我们合作了一个9人制作团队，他们承诺四天出样片，但现在该团队负责人给我发微信说‘资金链断裂、项目彻底停摆’。”杨浩向每经记者透露，这类小团队月均仅能制作一部精品漫剧，收入根本无法覆盖运营成本。而算力涨价进一步推高制作成本，“崩盘或者洗牌只是时间问题”。 杨浩算了一笔账：“一人公司做完一部精品漫剧需要2到3个月，期间无任何收入却要持续投入算力成本，上线后还得面对几万部新增作品的竞争，生存难度极大。” 每经记者实测发现，AI工具的使用成本也显著上升。现在用即梦生成一条15秒视频的积分，约为两个月前的1.6倍至3倍。今年2月即梦上线Seedance 2.0时，刊例价为8积分/秒；4月8日涨价后，基础会员、标准会员和高级会员单月积分分别从1080、4000和15000下调至725、2210和6160。这也意味着，用户花同样的钱，到账积分却大幅缩水，如高级会员积分降幅达58.9%。 即梦4月8日涨价前（上图）后（下图）对比 图片来源：即梦官网 优刻得科技股份有限公司企业事业部架构中心总监孙飞同样感受到了算力成本增长的压力。他向每经记者透露，自己用“小龙虾”从事相关工作，从晚上9时到凌晨1时共4小时，花费了近5000元Token费用。 2 “供需缺口短期难以弥合”： 芯片受限、人才短缺，算力涨价周期至少1至2年 本轮算力集体涨价并非偶然，而是供需失衡、芯片管制、人才短缺等多重因素叠加的结果。 北京前沿未来科技产业发展研究院院长陆峰向每经记者分析，需求端，AI智能体应用爆发带动Token消耗量指数级增长；供给端，高端GPU（图形处理器）与HBM（高带宽内存）产能受限，上游采购成本居高不下，供需缺口短期难以弥合。 算力租赁厂商核心竞争力 数据来源：东吴证券研究所 “今年算力已出现明显供不应求，局部结构性短缺尤为突出，此前过剩的算力、闲置集群与算力卡，基本被大厂悉数扫货。”上海财经大学特聘教授胡延平补充道，需求的爆发式增长与供给的刚性约束形成尖锐矛盾，直接推动算力价格上涨。 中国电子首席科学家、中国电子云总工程师朱国平则向每经记者指出，美国对华芯片管制导致高端GPU进口受阻，而国内芯片产能不足，为算力涨价提供了阶段性支撑，短期内产业链上下游成本均面临上行压力。广东维云信息科技总监季凌霜提供的数据显示，2025年销往中国的高端AI训练芯片超150万颗，新一代旗舰算力芯片出货量预计超2000万颗，但仍难以匹配爆发式增长的算力需求。 此外，核心算力芯片的高故障率也加剧了成本压力。季凌霜提到，相关厂商公布的核心算力芯片故障率已接近10%，这进一步放大了算力依赖型企业的隐性损失。同时，算力产业存在明显人才短板，从初级运维到高级硬件工程师均供给不足，叠加技术封锁影响，算力基础设施运维难度加大；而高端设备上架的政策限制、备件供应紧张等问题，也间接推高了企业的算力使用成本。 对于涨价周期，陆峰预判：“短期涨势会逐步趋缓，但整体涨价周期至少维持1至2年。”星网信通创始人、深圳市CIO协会智库AI专家贺鹏程则预测，2至3年后，随着国产AI芯片技术优化与成本下降，相关价格将逐步回归合理区间。 3 “闲置算力面向C端开放”： 大厂出租算力赚外快，创业者深耕垂直赛道 面对持续上涨的算力成本，产业链各环节纷纷寻找破局之道。 国产大模型企业率先通过技术创新降本，MiniMax AI架构师冯雯告诉每经记者，公司自2023年下半年布局MOE模型架构（混合专家模型），2024年1月推出国内首个MOE大语言模型，相较传统架构训练成本更低，同时通过优化注意力机制，实现了降本与性能提升的双重目标。 大厂则瞄准闲置算力资源挖掘增收空间。孙飞向每经记者透露，公司正通过产品设计缓解用户成本压力，“例如设置算力资源消耗天花板、按天/月限制用量，同时将闲置算力面向C端开放，结合B端大客户服务提升算力使用率”，既盘活了存量资源，也为用户提供了更灵活的成本控制选择。 图片来源：每经媒资库 对于承压严重的中小创业者，专家给出了针对性生存建议。陆峰表示，短期可积极申领各地算力券补贴，借助共享算力平台降低即时成本；长期来看，应放弃通用模型赛道竞争，聚焦金融、医疗、工业质检等垂直领域，建立数据与应用壁垒，走差异化深耕路线。 部分创业者已开始实践这一策略。杨浩的鹤芽漫剧聚焦AI漫剧这一细分场景，通过优化内容生产流程、提升作品品质，在成本上涨的背景下仍能维持运营。“谁家工具是满血版、出片效果稳定，我们就优先选用，价格只是第二考量。”他认为，垂直领域的优质内容仍能获得市场认可，从而有效转嫁部分成本压力。 每经记者了解到，近期多地政府推出算力券补贴政策，对符合条件的中小微企业、创业团队给予算力使用费用减免。目前，北京、上海、山东、四川等20多个省市积极响应，截至2026年3月，全国算力券补贴总规模已突破10亿元。 4 “零成本创业幻象散去”： 专家预判Token经济将出现明显分化 算力涨价不仅引发行业短期洗牌，更推动AI产业进入结构性调整阶段。专家普遍认为，随着“零成本创业”幻象散去，行业将从技术竞赛转向成本与规模的博弈，Token经济也将向“高质低价”转型。 “算力涨价戳破了‘AI创业零门槛’的泡沫，开启行业淘汰赛。”陆峰指出，仅靠套壳大模型API（应用程序编程接口）、无核心技术壁垒的轻量应用公司，因算力成本占比普遍高达六七成，涨价会直接吞噬微薄毛利，这类企业将率先出局；而手握核心技术、深耕垂直场景的创业者，才能在成本博弈中站稳脚跟。 对于是否会形成算力寡头垄断，专家认为行业不会出现头部通吃的绝对格局。陆峰认为：“若涨价长期持续，算力资源可能向少数头部云厂商及其生态企业集中，形成‘算力寡头+应用依附’的结构性垄断，压制产业创新活力。”但他同时强调，深耕垂直领域的创业公司（如垂直模型、AI+医药等），凭借高附加值可有效转嫁成本，仍能找到生存空间。 朱国平表示，当前大模型、智能体的全面爆发推动算力需求长足增长，使其成为数字经济、科技创新与产业升级的核心推力，Token也已成为AI产业的核心生产资料。值得关注的是，中国已连续五周超越美国成为全球最大算力存储市场，高并发（指能同时承接海量AI调用）、大带宽（指数据传输速度快，不拖GPU后腿）、低成本成为算力建设的核心诉求。 国内“芯片—模型—应用”正形成闭环 资料来源：各公司官网、华泰研究 “未来能赢得市场的Token，必须兼具‘高确定性+低成本’双重属性。”陆峰进一步分析，胜出的Token需满足两大核心要素：一是具备工业级稳定性与可用率，解决AI生成不可控的核心痛点，让专业创作者敢于付费；二是通过工程优化实现可控低成本，以高性价比构建用户黏性与生态壁垒。胡延平也认为，Token是计量单位而非计质单位，产业不能只看Token数量，更要关注背后的能力质量，“未来Token经济会出现明显分化，高能力Token实现盈利，低质Token持续亏损甚至被淘汰”。 从“龙虾”爆火后的全民创业，到算力涨价后的理性回归，AI产业在短短数月内完成了一轮快速迭代。在业内看来，真正聚焦技术创新、深耕垂直场景的企业，才能在成本博弈中站稳脚跟。当“零成本创业”的幻象散去，AI产业的真正竞争才刚刚开始。 本文来自微信公众号 “每经头条” ，作者：宋欣悦 陈荣浩，编辑：魏文艺，36氪经授权发布。 该文观点仅代表作者本人，36氪平台仅提供信息存储空间服务。 +1 46 好文章，需要你的鼓励 特邀作者 9 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 Kimi的问题不在对手，而在起点 美国AI，怎么也搞实名制了？ Opus 4.7 压根没想做“最强模型”：各位吹Claude的速度都跟不上Anthropic 的节奏了 一张坐标系，拆解国产大模型玩家“明牌”与“暗牌” 老黄可能开始焦虑了 世界模型元年启示录：动机、乱战与暗礁 A16z Speedrun最新一期全解析：1/3公司直接在简介展示收入数字 Token 工厂经济学，正在重构整个 AI 产业 超级战舰，智元裂变 36氪的朋友们 特邀作者 TA没有写简介，但内敛也是一种表达 发表文章 48603 篇 最近内容 刚刚，又一明星半导体公司IPO了 2小时前 “买瘦肉搭骨头”的时代结束了：印尼镍矿新政影响全球上下游 2小时前 如果在法国只看一座教堂，我不选巴黎圣母院，而是选它 2小时前 阅读更多内容，狠戳这里 下一篇 最前线｜大疆发布 Pocket 4 并预告双摄版本，起售价下调500元 手持影像设备行业正从单纯的“卷参数”转向“卷价格与专业化转型”并行的下半场。 4小时前 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
