          text: '一线房价，全面转涨-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 一线房价，全面转涨 乐居财经 · 2026年04月17日 10:05 北上广深涨幅全部为正。 70城最新房价数据出炉。 4月16日，国家统计局网站发布2026年3月份70个大中城市商品住宅销售价格变动情况。整体来看，70个大中城市中，一线城市商品住宅销售价格环比上涨，二三线城市环比降幅收窄或相同。新建商品住宅和二手住宅销售价格环比上涨城市个数均比上月增加。 先看新房，3月份，一线城市新建商品住宅销售价格环比 由上月持平转为上涨0.2% ，其中，北京持平，上海、广州和深圳分别上涨0.3%、0.3%和0.2%。二、三线城市新建商品住宅销售价格环比分别下降0.2%和0.3%，降幅均与上月相同。 从城市数量看，70个大中城市中，新建商品住宅销售价格环比上涨城市有14个， 比上月增加4个 ，除一线三城外，还包括大连、杭州、宁波、合肥、青岛、银川、吉林、牡丹江、烟台、宜昌、惠州。 新房价格同比仍普遍下跌。3月份，一线城市新建商品住宅销售价格同比下降2.2%，降幅与上月相同。二线城市新建商品住宅销售价格同比下降3.3%，降幅扩大0.2个百分点。三线城市新建商品住宅销售价格同比下降4.0%，降幅与上月相同。 具体看，一线城市中：北京3月新房价格环比0.0%，同比-2.1%；上海3月新房价格环比+0.3%，同比+3.7%；广州3月新房价格环比+0.3%，同比-4.7%；深圳3月新房价格环比+0.2%，同比-5.5%。 二手房方面，3月份，一线城市二手住宅销售价格环比 由上月下降0.1%转为上涨0.4% ，北上广深四城涨幅全部为正。二、三线城市二手住宅销售价格环比分别下降0.2%和0.4%，降幅分别收窄0.2个和0.1个百分点。 从城市数量看，70个大中城市中，二手住宅销售价格环比上涨城市有13个， 比上月增加11个 ，包括：北京、上海、广州、深圳、沈阳、南京、合肥、厦门、济南、海口、重庆、无锡、徐州。 不过，各线城市二手房价仍处于调整区间。3月份，一线城市二手住宅销售价格同比下降7.4%，降幅比上月收窄0.2个百分点。二线城市二手住宅销售价格同比下降6.2%，降幅与上月相同。三线城市二手住宅销售价格同比下降6.4%，降幅扩大0.1个百分点。 具体看，一线城市中：北京3月二手房价格环比+0.6%，同比-8.3%；上海3月二手房价格环比+0.4%，同比-6.2%；广州3月二手房价格环比+0.2%，同比-8.1%；深圳3月二手房价格环比+0.4%，同比-7.0%。 交银国际研报指出，春节假期后，3月份楼市如期迎来“小阳春”，前百开发商销售额环比大涨。我国房地产政策延续宽松导向、地方落地的协同发力格局，核心围绕财税优惠延续、金融支持加码、公积金改革深化、城市更新推进等方向展开。预计二级市场的需求将持续改善并好于一级市场，今年新房市场将保持基本稳定。 普睿数智董事长丁祖昱表示，从3月至今重点城市部分刚需项目的热销来看，在市场需求不断升级的当下，“位置好、产品好、价格好、实景好”的多边形项目才能真正激活市场主流刚性需求释放。当前诸多开盘表现不俗的项目已为市场打开了一条成功路径，市场需求仍在，只是要求正在变得越来越高，这对企业而言，既是挑战也是机会，未来用心做好产品也将变得更为重要。 本文来自微信公众号 “乐居财经” ，作者：刘治颖，36氪经授权发布。 该文观点仅代表作者本人，36氪平台仅提供信息存储空间服务。 本文图片来自： AI生成 、 企业授权 +1 0 好文章，需要你的鼓励 特邀作者 0 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 只有2个商场，上海这里凭什么吸引爱马仕？ 上海第一批限售解禁的房子，现在都怎么样了 从场景到生态：大悦城