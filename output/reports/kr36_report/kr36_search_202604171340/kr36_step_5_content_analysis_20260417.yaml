        original_content:
          title: ''
          summary: '据生意社现货通，4月上半月，丙二醇市场呈现“冲高后高位缓跌”的走势。截至4月16日，山东地区丙二醇生产均价为11433元/吨，半月累计上涨10.65%。展望后市，短期预计丙二醇市场将继续维持高位窄幅震荡格局。需关注环氧丙烷价格波动、供应端变化情况及下游需求变化，若高价持续抑制下游采购积极性，价格可能面临小幅回调压力。（证券时报）'
