        original_content:
          title: ''
          summary: '4月17日，国新办举行“开局起步‘十五五’”系列主题新闻发布会介绍“十五五”时期推动经济社会高质量发展有关情况。国家发展改革委副主任王昌林表示，“十五五”规划纲要提出了很多开创性、引领性的创新举措。下一步，要重点把握4个突出。第一，更加突出夯实实体经济根基，培育发展新质生产力，一方面要巩固提升矿业、冶金、化工、轻工、纺织、机械、船舶、建筑等产业竞争力，提升产业链自主可控水平，稳住实体经济基本盘。另一方面要立足实体经济，加强原始创新和核心技术攻关，提高体系化创新能力。第二，更加突出建设强大国内市场，加快构建新发展格局；第三，更加突出解决人民群众急难愁盼问题，着力保障和改善民生；第四，更加突出统筹发展和安全，增强经济和社会韧性，要确保粮食能源这两个饭碗牢牢端在自己手中。下一步，要深入实施“十五五”规划纲要，推动国家级专项规划出台，加快推进109项重大工程项目实施，不断巩固拓展经济稳中向好的态势'
