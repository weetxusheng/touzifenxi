        original_content:
          title: ''
          summary: '阿联酋迪拜16日宣布启用全球首个综合空中出租车垂直起降场，标志着阿联酋在发展先进、可持续城市交通体系方面迈出重要一步。该起降场位于迪拜国际机场附近，占地约3100平方米，为一座四层建筑，设有两处电动垂直起降飞行器专用起降平台，并配套停车设施，是在迪拜王储谢赫哈姆丹·阿勒马克图姆支持下推进的。项目预计年接待能力约17万人次，空中出租车商业运营计划于2026年底启动。根据规划，到2026年底将建成包括迪拜国际机场、市中心、棕榈岛和迪拜码头在内的四个起降场。（央视新闻）'
