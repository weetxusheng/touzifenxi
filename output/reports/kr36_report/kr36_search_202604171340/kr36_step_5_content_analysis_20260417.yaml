          title: ''
          summary: '4月17日，国新办举行“开局起步‘十五五’”系列主题新闻发布会，介绍“十五五”时期推动经济社会高质量发展有关情况。国家发展改革委副主任王昌林表示，今年以来，经济运行呈现积极变化，供需两侧均有明显改善，更好发挥了全球经济稳定器作用，好于国内外许多机构和专家学者的预期。下一步，要突出抓好5个方面的工作。一是要打好宏观政策组合拳，提前储备一批综合性政策措施，根据形势需要及时出台；二是要着力扩大国内有效需求，制定2026年—2030年扩大内需战略实施方案，推动符合条件的重大工程项目尽早开工建设；三是要加强科技创新，加快新兴产业发展，深入实施人工智能+行动，打造智能经济新形态，深入贯彻落实全国服务业大会精神，推进服务业扩能机制；四是要加力稳就业、促增收，实施好稳岗扩容提质行动，制定实施城乡居民增收计划，加强普惠性、兜底性民生建设，加强困难群体社会保障；五是要夯实安全发展基础，全力做好能源资源和粮食等'
