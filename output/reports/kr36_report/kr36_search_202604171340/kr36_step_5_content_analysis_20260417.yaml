          text: '4平米的经济型酒店，真的赚钱吗？-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 4平米的经济型酒店，真的赚钱吗？ 空间秘探 · 2026年04月17日 10:07 “极简超经济酒店”，会不会成为一个全新的细分赛道？ 在北京的核心商圈和地段，80到150元的预算能住进什么样的地方？答案不再只有青旅床位和合规存疑的民宿。一家名为“住小叮”的极简超经济酒店品牌，正逐渐填补北京市中心300元以下住宿市场的空白。它将单房面积压缩至4至8平米，取消独立卫浴，将房价定在80—150元区间，直营店常年入住率保持在96%。更让人吃惊的是，传统经济型酒店单房造价普遍维持6万元以上，住小叮将这一数字压到了2.5万至3万元。 单房造价3万不到 住小叮给自己的定位是“极简超经济酒店”，这是一个全新的细分赛道。与传统经济型酒店相比，极简在哪里呢？ 空间秘探调查发现，传统酒店做预算，大堂、会议室、走廊公摊等这些往往占据了可观的开支，并且单房面积通常在15-25 平米，标配独立卫浴、电视、书桌。而住小叮的客房面积被压缩到了4-8平米，大胆砍掉了每个房间独立的卫浴，转而采用集中式、隔间化的公共洗漱区。单房造价随之骤降，而省下的资金被重新投入到选址和核心体验上。床上铺着对标亚朵的零压床垫，公共区域配备徕芬、飞科等品牌吹风机，甚至智能马桶、化妆镜也被保留，这些“看不见的成本”反而得到了强化，仅保留了一张高品质的床、独立空调和新风系统。 这一调整带来了惊人的效率提升，同样1000平米的物业，传统经济型酒店最多能隔出 40-50间房，而住小叮可以塞下近100间房。面积利用率和坪效直接翻倍，这才是它能把单房造价压到传统酒店1/2甚至1/3的核心密码。 用创始人刘佩明的话来说，就是把省下来的钱“全砸在了选址和硬件上”。因此，传统经济型酒店单房造价普遍维持6万元以上，住小叮将这一数字压到了2.5万至3万元。这样做的好处很明显，即便是有限的预算，也能在北京三里屯、鸟巢等黄金地段找到落脚点。据住小叮的官方数据，截至2026年初，含签约及筹建项目在内，住小叮门店已达30余家，并完成上海杭州首批门店布局。一间没有独立卫浴的小房间，用这种方式重新获得了市场竞争力，直营店常年入住率保持在96%，续租率高达40%。 谁会为4平米的房间买单 住小叮的走红，与其说是价格低到令人心动，不如说是它恰好踩中了新一代消费者消费观念的转变。 很多人会自然地认为，选择这种极小空间的，一定是预算有限的穷游客。但住小叮的用户调研数据却给出了完全不同的答案。品牌方对超过1000份用户进行问卷调研，其客群构成比想象中更丰富：刚毕业来京求职的大学生、因培训或考试短暂停留的“在职青年”，特种兵式的年轻游客，甚至也不乏追求极致效率的商务差旅人士。从出行目的来看，旅游观光占50.5%，商务出差占16.9%。 更有意思的是，当被问及选择住宿的决策因素时，“干净卫生条件好”以44.6%的绝对优势成为第一要素，重要性远超“价格绝对便宜”（14.5%）。Z世代现如今逐渐成为消费主流，贡献了40%的消费决策权重，他们的消费逻辑正在发生根本转变，愿意为品质付费，不少人拒绝为溢价买单，消费并未降级，而是转向了更精明的价值选择。这也是典型的Z世代“消费态度”，在娱乐、社交上一掷千金，但在住宿这种功能性消费上，极度理性。他们要的不是便宜，而是“刀刃上的性价比”。住小叮恰好切中了这种“Z世代的消费观”，对于特种兵游客来说，酒店只是一个存放行李和睡眠的地方，位置必须在地铁口，但不需要豪华大堂；对于求职大学生，需要的是安全的低价成本，而不是高级的香氛气味和昂贵的装饰画，甚至有一些求职者把住小叮“平替”出租屋，零押金、随时换房。 仅以北京为例，每年涌入的应届毕业生超过15万人，其中大量需要在求职期间寻找短期过渡住宿。此外，全国三甲医院周边的陪护住宿需求更是一个被长期忽视的市场，住小叮的敏锐之处，在于它看到了这些被主流酒店遗忘的角落，并为其设计了一套接地气的解决方案。 在北京的住小叮门店里，折叠着许多真实的都市故事。一位毕业生把这里当成了比长租公寓更灵活的家，“公寓押一付三，还有水电费。这里零押金、随时换房，面试去哪我就住哪”。在医疗资源集中的区域，有陪父亲看病的儿子坦言：“我不需要大堂经理的微笑，我只需要一个安全、干净、能让我们安心过夜的地方。”这正是住小叮客群最真实的一面，它不是为“穷”而生的产品，而是为“刚需”提供了一种体面、高效且负担得起的解决方案。在行业里，常有人把住小叮比作住宿业的“蜜雪冰城”，咖啡业的“瑞幸”。这个比喻点出了新消费时代的一个本质变化：人们选择平价产品，未必是因为消费能力下降，而是在某些场景下，一杯高性价比的柠檬水就是最聪明的选择。 这种对“高效刚需”的精准捕捉，在全球市场都可以得到验证。比如日本的9h（Nine Hours）胶囊酒店，几乎是住小叮的“前辈版本”，它将住宿拆解成了极致的时间公式——1小时洗漱+7小时睡眠+1小时准备，砍掉所有非核心的空间与服务，用睡眠舱+集中式公共卫浴，在东京、京都的核心商圈，卖出了370元人民币的均价，常年保持90%以上的入住率。它的客群和住小叮高度重合：赶早班机的旅客、进城看病的陪护、短期出差的白领，甚至是加班到深夜的上班族。这群人要的从来不是“大房间”，而是一个安全、干净、能好好睡一觉的地方，住小叮的用户逻辑几乎和其如出一辙。如今9h已经在日本开出了13家连锁店，还计划扩张到54家，用十几年的时间验证了这个模式的可持续性。 能否冲击传统经济型酒店 极致的成本压缩，确实带来了极高的效率和较快的回本周期，但是，任何商业模式必须多元视角考虑战略。住小叮在收获效率和口碑的同时，也必须面对一系列结构性的挑战与代价。 最直接的代价，就是客群范围的缩小。当砍掉了独立卫浴，砍掉了大空间，意味着就自动放弃了那些家庭出行、商务宴请、或者对隐私有极高要求的客群。住小叮的核心客群画像已经非常清晰：年轻、预算敏感、追求效率、对独立卫浴无刚性需求，但反过来看，这套画像之外的客群，几乎是被天然排除在外的。这样的模式，虽然在一线城市核心区跑得通，但它无法复制到所有区域。比如对于家庭出游而言，带着老人和孩子在公共区域洗漱、如厕，不便程度可想而知。对于商务差旅者而言，即便追求极致效率，也往往难以接受与陌生人共用卫浴设施的现实。同样，4至8平方米的房间面积，对独行旅客来说是“刚刚好”的效率空间，但对于携带大件行李或需要一定活动空间的人来说，则显得过于迷你。即便房价只有80到150元，那些愿意为舒适度支付更高溢价的客群，也不会将其纳入考虑范围。 还有就是管理的难度，极致效率意味着极致的管理。比如住小叮的公共卫浴，理论上可以通过高频保洁来保持干净。但这对运营的要求极高。一旦管理跟不上，公共区的卫生一旦出问题，口碑就会崩塌。再比如无人化运营，自助入住机虽然省了人力，但一旦客人遇到问题，比如门锁坏了、空调坏了，远程客服能不能及时响应？如果响应慢了，用户体验就会大打折扣。 住小叮的出现，并没有立刻引发行业的波动，但它带来的改变，正在一点一点地渗透进酒店人的思维里。具体来说，至少改变了两件事。 首先就是改变了对“存量物业”的看法。全国超过一半的存量酒店已经开业五年以上，其中经济型酒店占了将近八成。这些老酒店面临着同一个尴尬：想改造，没钱；不改造，客人嫌旧。传统经济型酒店的单房造价大约六万起步，还要做大堂、做通道、做独立卫浴，老房子的结构往往改不动、改不起。很多这样的物业最终要么租给了别的店，要么常年空置。 住小叮给出了另一种答案：不用改结构，不用做大堂，甚至不用做卫生间。把房间做小，把公共洗漱区集中，把省下来的钱用来换好床垫、做隔音、选好位置。这样一来，原来改不起的老房子，变得“有账可算”了，回本周期也大大缩短，位置还在市中心，这对很多中小投资人来说，是一条看得见的路。 其次，过去几年酒店行业发生了一个微妙的变化，曾经遍地开花的经济型酒店，正在悄悄“撤退”。不是关门，而是升级，很多原本卖一百多块钱的房间，被改造成了中档或高档酒店，房价涨到了两三百甚至更高。巨头们的扩张重心也早已不在经济型板块，几乎所有酒店品牌都在忙着“向上走”——经济型升级成中档，中档升级成高端。当整个行业都在向上走，向下看的需求是否正在被遗忘？当几乎所有人都把资源投向中高端市场，那个最基础、最朴素的需求市场，是不是反而出现了一个价值洼地？住小叮正是在这个结构性缺口中找到了自己的位置。 那么，它对传统经济型的酒店有没有冲击呢？ 一位资深酒店专家在接受空间秘探采访时表示，住小叮与传统的经济型酒店，并非是在一条赛道上的竞争对手。两者的客群从一开始就是错位的：住小叮接的，是那些被传统经济型酒店“忽略”的基础刚需客，其中有相当比例的住客此前会选择住青旅床位或民宿，甚至网吧、洗浴中心过夜。这批人原本就不是传统经济型酒店的客人；而传统经济型酒店的核心客群，是愿意为独立卫浴、私密空间付费的用户，两者的需求不完全重叠，根本不存在谁抢谁的生意。与其说是“冲击”，不如说是一种“提醒”，并不是让传统经济型酒店去学住小叮砍掉卫浴，而是提醒它们重新审视自己的价值锚点。比如汉庭4.0将造价压到7万元以内，海友6.0把人房比降至0.13，这些动作背后，其实与住小叮的底层逻辑是一致的，在消费者不敏感的地方做减法，在消费者敏感的地方做加法。 但它的出现，却悄悄给传统经济型酒店，带来了两个方向的思考： 第一，它给所有想开酒店的投资人，算了一笔新账。过去，投资人想开个经济型酒店，默认的逻辑是“投几百万，等4至5年甚至更久回本”，但住小叮的模型告诉他们：原来投250 万，3年就能回本的生意，也能做的很稳，也能做成标准化。这会让传统的经济型酒店品牌，开始重新优化自己的投入模型，不然，加盟商就会转头去开这种投入更低、回本更快的店了。 第二，它也给整个行业提了个醒，原来酒店的成本，不是只能越涨越高。过去，整个行业都默认，酒店必须要有独立卫浴、必须要有大堂、必须要有15平以上的房间，不然就不是标准化的酒店。但住小叮证明了，只要客群匹配，把那些非核心的配置砍掉，把钱砸在用户真正在乎的床垫、卫生、位置上，也能做到96%的入住率。说到底，这不是谁取代谁的问题，而是住宿行业走向多元与成熟的一个信号。 正如餐饮界有高端餐厅也有快餐连锁，零售界有精品超市也有折扣便利店，酒店行业同样需要不同层级的供给来满足不同场景下的需求，大家各做各的客，各守各的赛道，把那些原来被忽略的、非标准化的需求，变成标准化的生意。所以，住小叮带来的冲击，并不是抢走了多少客人，而是让整个行业逐渐意识到，那个被大家遗忘的“基础住宿”市场，其实比想象中要大。 当然，也有酒店专家表示，住小叮这种模式到底能不能赚钱，或者能否成为一种新类型的经济型酒店产品还待市场考验，毕竟它的样本体量都还小。对传统经济型酒店而言，下一轮竞争的答案，或许不在于焦虑地模仿极简模式，而在于更坚定地回答一个问题：服务的客人是谁？他们愿意为什么付费？有没有把每一分钱都花在他们的真实需求上？市场永远不会拒绝新面孔，只会淘汰那些迷失方向的旧身影。 本文来自微信公众号 “空间秘探” ，作者：李佳茹，36氪经授权发布。 该文观点仅代表作者本人，36氪平台仅提供信息存储空间服务。 +1 0 好文章，需要你的鼓励 空间秘探 特邀作者 0 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 如果在法国只看一座教堂，我不选巴黎圣母院，而是选它 5年猛追70万！2000万人口城市俱乐部，要洗牌了？ 中国第一经济大省，人口已达1.65亿 目标“2万亿”，这个省会“跳起摸高” 数亿元堆出的“最贵”酒店，为何3年就倒了？ 当酒店大堂挤满“金发碧眼”… “霸王”归来！江苏最不起眼的小城，要火了 北京积分落户开始申报！全市落户指标6000人 半年内省委书记再次调研，为何又是它? 空间秘探 特邀作者 一个艺术与财经并重的商业空间内容平台！ 发表文章 514 篇 最近内容 4平米的经济型酒店，真的赚钱吗？ 3小时前 数亿元堆出的“最贵”酒店，为何3年就倒了？ 昨天 当酒店大堂挤满“金发碧眼”… 昨天 阅读更多内容，狠戳这里 下一篇 老黄可能开始焦虑了 只做卖铲人，已经不能让 Nvidia 高枕无虞了。 3小时前 关于36氪 城市合作 寻求报道 我要入驻 投资者关系 商务合作 关于我们 联系我们 加入我们 36氪欧洲站 36氪欧洲站 36氪欧洲站 Ai产品日报 网络谣言信息举报入口 热门推荐 热门资讯 热门产品 文章标签 快讯标签 合作伙伴 36氪APP下载 iOS & Android 本站由 阿里云 提供计算与安全服务 违法和不良信息、未成年人保护举报电话：010-89650707 举报邮箱：jubao@36kr.com 网上有害信息举报 © 2011~ 2026 北京多氪信息科技有限公司 | 京ICP备12031756号-6 | 京ICP证150143号 | 京公网安备11010502057322号 意见反馈 36氪APP 让一部分人先看到未来 36氪 鲸准 氪空间 推送和解读前沿、有料的科技创投资讯 一级市场金融信息和系统服务提供商 聚焦全球优秀创业者，项目融资率接近97%，领跑行业'
