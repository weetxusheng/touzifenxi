          text: '最前线｜大疆发布 Pocket 4 并预告双摄版本，起售价下调500元-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 最前线｜大疆发布 Pocket 4 并预告双摄版本，起售价下调500元 张子怡Leslie · 2026年04月17日 09:00 手持影像设备行业正从单纯的“卷参数”转向“卷价格与专业化转型”并行的下半场。 文｜张子怡 编辑｜袁斯来 4月16日，大疆正式发布全新一英寸口袋云台相机Osmo Pocket 4。 作为大疆影像产品线中的现象级单品，本代产品在维持便携形态的基础上，通过提升影像规格并降低售价，以应对日益激烈的短视频硬件市场竞争。 影像性能是此次升级的核心。Pocket 4搭载了全新一英寸CMOS，动态范围提升至14级，并支持10-bit D-Log专业色彩模式。 最显著的性能跨越体现在高帧率拍摄上，设备支持4K/240fps慢动作录制，这一指标已媲美万元级专业影像设备。针对人像拍摄这一核心场景，Pocket 4优化了肤色调校算法，并新增内置美肤滤镜以及支持三级色温调节的外置补光灯配件。 此外，针对前代产品存储依赖存储卡的痛点，大疆此次内置了107GB存储空间，并支持800MB/s的导出速度。 在智能功能上，升级后的智能跟随7.0算法配合2倍无损变焦，解决了远距离追焦的精准度问题。智能对焦系统也引入了“登记主角优先”模式，确保在复杂环境下已登记的拍摄主体始终处于焦点中心。 大疆同步预告了2026年的新品计划——搭载双摄影像系统的Osmo Pocket 4P。有分析认为，4P版本的推出意在通过物理焦段的覆盖，彻底解决口袋云台相机在长焦端的劣势，以此防守影石（Insta360）Luna等潜在竞品的冲击。 价格策略是本次产品发布的另一大重点。Pocket 4标准套装售价为2999元，全能套装售价3799元，分别较上一代Pocket 3的首发价格降低了500元和700元。这种“增配降价”的打法在云台相机市场极其罕见。 此次定价调整背后也是行业格局的剧变。IDC数据显示，2025年度全球云台相机出货量同比增长超100%，这一高增速市场已吸引了包括影石、GoPro在内的实力厂商跟进，甚至手机厂商如OPPO也已立项对标产品。 大疆选择在此时主动挑起价格战，旨在利用其成熟的供应链规模效应压低行业利润率，拉高新入局者的门槛。随着Pocket 4的发布，手持影像设备行业正从单纯的“卷参数”转向“卷价格与专业化转型”并行的下半场。 本文由「 张子怡Leslie 」原创出品， 转载或内容合作请点击 转载说明 ；违规转载必究。 寻求报道 本文图片来自： 企业授权 +1 41 好文章，需要你的鼓励 张子怡Leslie 新锐作者 5 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 参与评论 评论千万条，友善第一条 登录 后参与讨论 提交评论 0/1000 你可能也喜欢这些文章 智元旗下觅蜂发布一站式物理 AI 数据服务平台｜最前线 王子杰逝世：创办丝芭、久游网，引进《劲舞团》 最前线｜追觅生态企业娲宝科技发布宠物智能项圈，布局“项圈+宠粮”数据闭环 网易互娱架构调整，市场负责人王怡调任海外 最前线 | 远见智存发布HBM3/3e高带宽存储芯片，带宽迈入800GB/s级别 荣耀做了个“养虾本”，预制5大主虾，要重新定义AI PC｜最前线 图速科技发布三款新品：其具身打磨机器人全栈自研，打磨效率为人工3-4倍丨最前线 OBSBOT寻影新品发布，在口袋直播摄像头中实现AI智能跟踪与4K画质｜最前线 INAIR完成千万美元融资，便携空间主机适配多款 AR 眼镜｜最前线 张子怡Leslie 新锐作者 关注华南创新公司，欢迎交流。 发表文章 211 篇 最近内容 最前线｜大疆发布 Pocket 4 并预告双摄版本，起售价下调500元 4小时前 36氪首发｜港中文博士和前大疆智能制造负责人创业，