          text: '海底捞最有号召力的女人，又回来了-36氪 账号设置 我的关注 我的收藏 申请的报道 退出登录 登录 搜索 36氪Auto 数字时氪 未来消费 智能涌现 未来城市 启动Power on 36氪出海 36氪研究院 潮生TIDE 36氪企服点评 36氪财经 职场bonus 36碳 后浪研究所 暗涌Waves 硬氪 氪睿研究院 媒体品牌 企业号 企服点评 36Kr研究院 36Kr创新咨询 企业服务 核心服务 城市之窗 政府服务 创投发布 LP源计划 VClub VClub投资机构库 投资机构职位推介 投资人认证 投资人服务 寻求报道 36氪Pro 创投氪堂 企业入驻 创业者服务 创投平台 AI测评网 首页 快讯 资讯 推荐 财经 AI 自助报道 城市 最新 创投 汽车 科技 专精特新 直播 视频 专题 活动 搜索 寻求报道 我要入驻 城市合作 海底捞最有号召力的女人，又回来了 中国企业家杂志 · 2026年04月17日 08:41 一个仰望星空，一个低头拉车 海底捞 F轮 北京市 1994-01 川味火锅连锁品牌 36氪报道 本地生活 我要联系 这两年，海底捞增长放缓的态势愈加严峻。这一次，难题又交到了杨利娟的手上。 在海底捞创始人张勇重新担任CEO三个月后，辞任海底捞CEO不到2年的杨利娟又回来了 4月15日晚，特海国际发布公告称，杨利娟辞任公司执行董事兼CEO，并将加入海底捞国际控股有限公司， 统筹推动“红石榴计划”实施。 4月16日，海底捞股票收盘价对比前日上涨7%。 “红石榴计划”是海底捞在2024年8月启动的新战略，意在推动多元品牌的发展，也是海底捞目前的一个发展重心。 年报数据显示，截至2025年年底，除主品牌之外，海底捞集团同时运营了20个餐饮品牌，涵盖海鲜大排档、寿司、西式轻食、小火锅及中式快餐等细分领域，共计207家餐厅，包括这些子品牌在内的创新业务收入相比2024年增加了214.6%。不过另一方面，这些品牌多处于从0到1的孵化阶段，大多数增收不增利，未来的规模化扩张面临考验。 两位合作超过30年的“老搭档”再次联手，给面临增长难题和管理挑战的海底捞带来了新的想象空间。 两人各有所长，自称“给自己安排了海底捞最好干的活——仰望星空”的张勇，善于战略和用人；杨利娟则更强于执行，务实严谨，推动了海底捞历次变革的落地。两人在管理风格上也互补长短，容易动怒的张勇更偏感性，也容易心软；相比之下，杨利娟则是海底捞大家庭中的“虎妈”，外表温和，却更加理性坚定。 一位海底捞的内部创业者回忆，当时在子品牌孵化最艰难的时候，她曾向两人都表达过放弃的想法——“我可能不是创业方面的人才，是不是回来上班？”张勇的回复是，“一定要让自己舒服，如果觉得不适合创业，可以随时回来。”而杨利娟则鼓励她坚持，“其实我觉得你可以，不要担心经济负担的问题，大不了我先借给你。”最后，这位创业者选择了继续，并且推出了一个更具竞争力的新品牌。 值得一提的是，身为海底捞董事会主席的张勇兼任CEO，本来就是权宜之计。香港联合交易所证券上市规则中对企业管治守则的要求之一为，“主席与行政总裁的角色应有区分，不应由一人同时兼任”。 目前（截止到4月16日），海底捞并未公告明确杨利娟的具体职务，但一位接近海底捞的知情人士向《中国企业家》透露，“毫无疑问，回来肯定要掌管大局。” 01 老将出马 杨利娟是海底捞的创业元老。1995年，在张勇创办公司的第二年，杨利娟就成为其中一员。海底捞发展初期，她用尽办法“磕”下西安第一家店，让海底捞“开向全国”真正迈出了第一步；2018年海底捞上市之后，张勇逐步退出一线，也是杨利娟带领数万名海底捞员工，从当年的466家门店一路扩张，高峰期数量超过1500家。 “杨姐是海底捞最务实的一个人，她的号召力和威望是二十多年来一点一滴沉淀下来的，没有任何人比得上。”一位加入海底捞十几年的高管曾对《中国企业家》表示。 当时是2021年，海底捞正遭遇历史上最艰难的一次生死考验——全年亏损41.6亿元，几百家门店经营未达预期；也是在那一年，43岁的杨利娟正式走到台前，接替张勇成为海底捞CEO。两年之后，海底捞业绩从谷底反弹，冲到历史新高。功成身退的杨利娟调任特海国际掌门人，继续攻克海外“新战场”，过去两年，特海国际的营收分别实现了13.4%、8%的同比增长。 杨利娟 她的威望，正是在一次接一次的硬仗中奠定的。海底捞奉行师徒制的管理模式，她和张勇两人是师徒，上下级，更是配合默契的搭档。海底捞的老员工都知道，张勇经常会突发奇想，而把想法落地为现实的，则是杨利娟。 这个过程中面对的，可能是来自几万名，甚至十几万名员工的不解和压力。比如当年张勇宣布对员工实行计件工资制度，取消底薪，按件计薪。据说，当时很多员工都不接受，杭州一家店里三十多名员工甚至以“集体辞职”相要挟，杨利娟当机立断地决定，将这些人在当天下午3点之前全部开除，改革才得以继续推进。 在改革阻力面前毫不妥协的杨利娟，同样也顶得住来自创始人的压力。张勇曾向《中国企业家》回忆了一件往事，当年海底捞一位教练向其辅导的店长借钱买房，被店长举报了，他得知后“气坏了，要是我干（来处理），（我）肯定开除（教练）”，但杨利娟却不同意，理由是当时海底捞的制度里并没有列明这种情况，所以不能按贪污论处。张勇最后接受了她的意见。 “方向上我和董事长是永远一致的。”杨利娟在接受《中国企业家》采访时曾表示，“方法和意见上的分歧也是正常的工作讨论中不可避免的。”而在那次争论后，海底捞马上完善了制度，加上了一条“不能向下级、供应商借钱”的规定。 类似的事情不止一次，海底捞员工也越来越了解这位管理者的风格，“杨姐雷厉风行，杀伐决断，对外开疆拓土，对内捍卫制度，是说一不二的执法者。” 02 多元化的急与难 如今的“红石榴计划”，正需要这样一位坚定而有力的统筹者。因为 对于此时的海底捞来说，多元化已经不是一个可选项，而是一道必答题。 这两年，海底捞增长放缓的态势愈加严峻。2025年，海底捞总营收同比增长1.1%，而由于餐厅翻台率下降及加盟模式的引入，海底捞餐厅经营收入减少了7.1%；与此同时，核心经营利润也同比下降13.3%。 “双手改变命运”的价值观是推动海底捞崛起成为“火锅一哥”的燃料，而保证其持续燃烧的条件就是不断增长。 “未来的增量，一方面来自加盟撬动的下沉市场，一方面就是发展第二品牌。”一位海底捞高管对《中国企业家》表示。从这个角度来看，“红石榴计划”事关海底捞未来安危。 所以，相比2020年内部员工自发的创业潮，海底捞此次的多元化已经上升到战略高度，更加有组织、有计划。 2024年，“红石榴计划”启动之初，海底捞就同步组建了“运营五虎将”负责具体事项——包括负责增长业务的副总经理邵志东、负责供应链和产品管理的常务副总经理宋青、负责门店运营的轮值COO苗喜庆、负责场景营销的营销部长张关平，子品牌焰请创始人杨华也以创业委员会主教练的身份加入其中，他们首要的任务就是批量筛选、孵化、扶持海底捞的未来创业者们；对于创业项目，海底捞会在启动资金、供应链资源、门店管理等方面给予赋能和支持。 一位来自大型连锁餐饮品牌的业内人士就对《中国企业家》表示，这也是目前连锁集团的普遍打法，“ 现在餐饮市场变化很快，大型企业可以依托自身的供应链优势和品牌优势，复制市场上经过验证的产品和业态，这样不仅节省了试错成本，也能借助自身规模优势迅速把这一品类做大。 ” 不过，目前“红石榴计划”中的第二品牌大多处于从0到1的孵化阶段，增收不增利。特海国际的年报中特别提到了这一点：集团其他销售收入同比增长61.4%，部分由第二品牌餐厅的表现所推动。不过 新品牌孵化还处于投资阶段，这也导致了集团层面的成本增加。 海底捞也意识到了这个问题，根据官方说法，“红石榴计划”已由内部孵化转向市场扩张。在此背景下，各业务板块之间的协调、资源共享与战略一致性成为新的管理重点。 这一方面需要系统支撑。就像海底捞在年报中指出的，数字化技术会成为支撑海底捞多品牌规模化扩张的核心引擎。目前， 海底捞已经打造了覆盖集团全品牌的餐饮生态智能中台，包括顾客服务、员工管理、产品研发、品牌营销、拓店选址等各个板块的能力，短期内会为海底捞各个门店进行赋能；中长期，将把赋能推广到“红石榴计划”中的各个子品牌 ——根据此前公告，上一任CEO苟轶群将继续在集团统筹推动管理流程的智能化与自动化规划，推动运营模式升级和智能中台建设。 另一方面，则需要拉通千余家门店的运营协同。比如此前海底捞推出的“双管店”政策，即经验丰富的店长可以兼管多家门店，这样就可以帮扶到处于起步阶段的第二品牌门店。构想不错，但实施起来则会触碰到各种现实的问题：资源如何协调？考核如何设置？合作模式如何建立？这不仅关系到店长个人，而且涉及到不同品牌之间的利益分配，甚至海内外业务的综合统筹。多元化发展，对于任何餐饮集团来说都是一个待解的难题，海底捞也只能慢慢摸索，谨慎权衡。 这一次，难题又交到了杨利娟的手上。她曾在接受《中国企业家》采访中表示，“面对每天出现的新问题甚至挑战，第一反应都是如何解决；挑战成功，会感到无比的兴奋。”这一次，她又能否闯关成功？ 本文来自微信公众号 “中国企业家杂志”（ID：iceo-com-cn） ，作者：梁宵，编辑：米娜，36氪经授权发布。 该文观点仅代表作者本人，36氪平台仅提供信息存储空间服务。 +1 4 好文章，需要你的鼓励 中国企业家杂志 特邀作者 1 收 藏 +1 0 评 论 打开微信“扫一扫”，打开网页后点击屏幕右上角分享按钮 微 博 沉浸阅读 返回顶部 举报 参与评论 评论千万条，友善第一条 登录 