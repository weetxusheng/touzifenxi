          text: 'FBIF2026食品饮料创新论坛_FBIF食品创新展_FBIF展览 首页 论坛 议程 演讲嘉宾 展览 我要参展 展位图 食品创新展 展商指南 特装推荐搭建商 FBIF2026展商名录 赛事 购票 购票 参会&观展指南 常见问题 赞助 FBIF2026赞助商名录 赞助我们 新闻 新闻资讯 合作媒体 关于我们 关于我们 资源中心 联系我们 EN 47000+ 观众规模 3500+ 参会人数 650+ 展商 论坛 查看全部议程 演讲嘉宾 查看全部嘉宾 侯孝海 中国区COO 正大集团 Christoph Schwaiger（魏客礼） 奥乐齐南部集团前CEO Olivier Jakubowicz 业务执行官 雀巢日本 蒋薇薇 联席总裁 东鹏饮料 Stephan Czypionka 全球首席营销官，希杰食品（CJ Foods）顾问，可口可乐前全球副总裁 Kenneth Lau 全球数字商务营销负责人 亿滋国际 Taous Lassel（乐新涛） 亚太及中国研发创新副总裁&全球研发创新数字化副总裁 达能 Zbigniew Lewicki 首席研究、设计与创新官 梦龙冰淇淋公司 徐宇淙 亚洲首席市场营销官 梦龙冰淇淋公司 冯罡博士 专家 国家乳业技术创新中心 朱玺 董事长 优诺乳业 余俊贤 产品开发及进口总经理 麦德龙商业集团 佘咸平 副总裁兼首席产品官 永辉超市 吴姝 中国董事兼首席市场执行官 MUJI無印良品 黄露云 供应链管理部副总监 Olé精品超市 吴健 创始人，迈胜 营养健康业务部总经理，蒙牛集团 肖高求 中国区总裁 卡夫亨氏 Fumi James 全球品牌设计卓越中心及全球多力多滋品牌高级创意总监 百事公司 Julia Luscher 全球市场副总裁 利乐 信跃升 高级合伙人 信宸资本 张晶 合伙人 春华资本集团 Julien Bourdinière 高级合伙人兼亚洲区消费品及零售行业负责人 罗兰贝格 杨立 董事总经理、全球资深合伙人、消费者领域专项中国区负责人 波士顿咨询公司（BCG） 吴隽婧 采购经理 city''super集团 肖慧超 数字化首席增长官 全家便利店 申强 副总裁兼研究院院长 叮咚买菜 韩微文 全球资深合伙人，亚太区零售和餐饮业务主席 贝恩公司 Renan Vizzotto 全球高级设计负责人 百事公司 杨劭铭 创始人 New Sailing 虞坚 总经理 央视市场研究（CTR） 郑政焕 品牌创始人&总经理 蒲妈妈 王正齐 创始人 莫小仙 李树森 产品研发中心总经理 蒙牛集团 George Kovoor（乔国富） 百事公司印度饮料业务前高级副总裁兼总经理 范立冬 副会长，中国包装联合会；主任委员，中国包联包装智能装备委 中国区名誉董事长，康美包 客户评价 FBIF，是 OATLY 在过去三年最重要的合作伙伴之一，在过去三年我们一起推动了植物基的发展。在 2019 年，FBIF 协助我们组织了 Beyond Meat、Just Egg、OATLY 的肉蛋奶植物基三驾马车的论坛和阿里巴巴一起推起来植物基新赛道；2020 年组织了中国植物基论坛和行业一起发布了中国燕麦奶行业白皮书行业里出现了“万业竞植”的繁荣现象。 David Zhang OATLY噢麦力-亚洲区总裁 一群有想法，有活力，勇于实践的年轻人做着一件对行业有意义的事。 鲁秀琼 贝恩公司-全球专家合伙人 FBIF是我们经历的在论坛和会议组织方面最专业的团队。他们有良好健全的工作标准，坚持这些标准以及高标准的原则，又能友善高效地与合作伙伴沟通，真不晓得是什么样的训练让他们达到这样的工作水准的。可能，用心，特别用心是让他们与别人不一样的地方。 王航 厚生投资-创始合伙人 FBIF 是一场链接前沿科技、市场、品牌、消费者的行业盛会，背后是一支积极可靠专业的团队在有力推动，带给行业更多的创新与发展。 马海华 薄荷健康-创始人 我特别想提到的是FBIF已经发展成为一个非常专业又具影响力的创新平台，我相信这与这个年轻团队中每个年轻人渴望发展和充满激情的工作态度是分不开的。我也非常希望在FBIF这个平台上食品饮料行业能够聚焦创新的初心，提高大众的生活品质贡献于更健康的未来。 王军宽 华绿园-CTO 我认识贝拉应该是在2016年吧，2017年她们邀请我到FBIF会议上进行了一个分享，进一步爱上了这支团队，年轻、有活力善于思考学习，规划能力、执行能力强。令我印象深刻的是团队对于食品饮料行业的专业性、行业的洞见非常之深。因此，我一直密切关注着贝拉和她团队的动向。这种对事业充满热爱，对他人乐于分享的团队 , 一定能够在所耕耘的领域不断成就，不断激发更多创新，推动人才的成长、推动行业的进步。祝愿贝拉祝愿你们。 颜卫彬 澳优乳业-董事局主席 认识了 FBIF 和贝拉多年，非常欣赏 FBIF 这一支充满梦想的年轻团队。他们正在用创造力和活力见证和陪伴中国食品饮料行业的蓬勃发展，非常有意义。 麦伟坚 玛氏箭牌中国区-前总裁 FBIF is by far "the" leading platform for food innovation in China and perhaps beyond. I am especially impressed about the speed of growth and innovation within the company and its employees, very inspiring. Alfa Laval provides a keynote speech about innovative protein processes during the FBIF2020 in Hangzhou. This event took place in the midst of the COVID crisis. The forum was converted from a pure physical event to a hybrid physical and virtual event in a couple of weeks. Impressive how this was managed by their young professional and tech savvy team. Frederik Van Moer 阿法拉伐NEA食品系统-副总裁 这是一个有梦想敢于颠覆创新的年轻团队，他们用热情和激情为食品饮料行业带来了活力和不一样的富有价值的洞察。 曹永梅 旺旺集团-生产研发群总处长 我觉得FBIF是一个很棒的食品饮料行业交流活动。他强调信息共享、创新和建立一个更强大的食品饮料行业社区。FBIF是一个经过考验和值得信赖的模式，为好创意和成熟品牌提供了很好的机会。 冯广晟 Ventech China-管理合伙人 作为连续两年的评审团成员，我期待看到比去年更多精彩的作品，期待FBIF奖成为你在全球舞台上展翅的平台! 高木悠子 设计经理-可口可乐 主办方：Simba Events 上海辛巴商务咨询有限公司 联系我们 公司：上海辛巴商务咨询有限公司 地址：上海市闵行区七宝镇新镇路1459弄6号宝龙城T9号楼801室 邮箱：info@fbif.com 联系我们 相关链接 上海辛巴商务咨询有限公司 FoodTalks全球食品资讯网 FBIF Wow食品创新奖官网 FBIF食品饮料创新公众号 FBIF会展小程序 关于我们 Simba Events（上海辛巴商务咨询有限公司）是一家专注服务食品行业的市场调研、咨询、会议和新媒体公司，成立于2013 年, 位于上海，Simba 的发展始于会议，目前覆盖会议、赛事、媒体、咨询和培训等多个版块。Simba的会议理念是：会议的价值在于通过分享与互动，让想法产生更多想法，创新激发更多创新，会议应承担起推动行业进步的使命。 © Copyright 2023 Simba. All rights reserved. 沪ICP备19035501号-1 加载中，请稍后...'
