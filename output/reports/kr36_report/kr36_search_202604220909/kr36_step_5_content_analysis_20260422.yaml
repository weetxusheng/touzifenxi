          text: '主题诠释 INTERPRETATION 品牌衰退与崛起正在周期穿越中并发，功能主义叠加情绪疗愈，科技与美学成为品牌构筑新竞争力的核心锚点。科技具象为材料原料黑科技、运营数智科技；美学具象为千年文化种子的苏醒拔蕊、新世代情绪诉求的觉醒悦己。 在左脑、右脑和AI三脑交汇的品牌星河，代表未来的品牌在想什么，在做什么？科技能为品牌助力什么，美学能为品牌点燃什么？从大师哲思中挖掘美学启示，从商界导师研判中校准品牌战略，从东方美学品牌中找到传承之法，预见科技美学带来的品牌模式基因改变，解码新世代的用户审美。 品牌、平台、数智服务、渠道伙伴， 2026亿邦新竞争力品牌大会，是科技与美学品牌的觉醒和生态集结行动。 组织机构 ORGANIZATION 主办单位: 亿邦动力 协办单位: 马蹄社、亿邦智库、未来生活方式大赏 会议日程 AGENDA 04.24 09:00-17:00 2026亿邦新竞争力品牌大会 查看议程 04.23 13:30-18:00 科技美学品牌营销游学私董会暨分众总部游学 查看议程 04.24 09:00-17:00 《东方美学的哲思》——蔡志忠画作展 查看议程 2026亿邦新竞争力品牌大会: 2026.04.24 09:00-17:00 【第一篇章】感知东方美学品牌传承 09:00-09:30: 【序幕】“科技与美学”主题视频 【大师分享】东方美学的哲思 著名漫画家 蔡志忠 09:30-09:50: 【原研之美】从源头产研搭建护肤品牌高阶竞争力 林清轩创始人、董事会主席 孙来春 【第二篇章】见证科技美学模式大爆炸 09:50-10:10: 【生态之美】生态化点燃品牌大梦想 基诺浦董事长 裴非 10:10-10:30: 【算法美学】让品牌与AI共鸣：科学GEO驱动的企业营销升维 PureblueAI清蓝创始人、CEO 鲁 扬 10:30-10:50: 【慢闪店】2026年线下确定性的增长之道 可计算开店科技合伙人 谢培松 10:50-11:40: 【品牌对谈】品牌如何在新周期被看见、被选择、被记住 亿邦动力副总裁、视频播客《下班了》制作人 贾昆 美的中国区CMO 徐行 观夏副总裁、古建筑修复店负责人 赵健雄 BJHG不计后果品牌主理人、联合创始人 许多 11:40-12:00: 【AI创想】超越“技术下限”的科技之美 乐奇Rokid联合创始人 蔡国祥 13:30-14:00: 【大咖开场】对抗碎片化流量，品牌科技与美学的中心化传播方法 分众传媒创始人、董事长 江南春 【第三篇章】解码新世代用户审美 14:00-14:20: 【非遗之美】马面裙高奢之境：在世界重塑东方美学定价权 生活在左品牌创始人 、林栖文化董事长 林栖 14:20-14:40: 【松弛之美】慢下来就很美 慕尚集团零售副总裁、GXG总经理 吴磊 14:40-15:00: 【疗愈之美】将太空科技融入恒温深睡新美学 三问家居集团创始人、德国Outlast董事长 王耀民 15:00-15:20: 【效果之美】从“流量内卷”到“美学量产”：AI 内容资产Agent如何打造新竞争力？ 柚柚兔科技创始人兼CEO 吴奕钊 第四篇章：科技美学的品牌叙事 15:20-15:30: 【报告发布】《2026亿邦新竞争力品牌洞察报告》 亿邦动力董事长、亿邦智库院长 郑 敏 15:30-16:00: 【增长对谈】AI 抢跑期，品牌怎样全域交付科技美学体验 亿邦动力董事长、亿邦智库院长 郑 敏 有赞创始人、董事长 白 鸦 16:00-17:00: 【文化对谈】品类品牌怎样接住历史留给我们的美 著名漫画家 蔡志忠 当代作家、编剧 南派三叔 《长安十二时辰》制片人 梁超 吴茶创始人、收藏家 吴克之 科技美学品牌营销游学私董会暨分众总部游学: 【签到入场】 江南春 《东方美学的哲思》——蔡志忠画作展: 参会嘉宾 SPEAKERS <quark-image aesthetics_score_v2="2" available_status="3" efficiency_score_v2="1" fetch_status="0" ori_height="1733" ori_width="1200" phash="15289210517827866063" relevant_score_v2="2" render_height="260" render_width="180" url="http://s2.zimgs.cn/ims?at=ori&amp;kt=url&amp;key=aHR0cHM6Ly9pbWdzLmVicnVuLmNvbS91bml0L3Bob3Rvcy8yMDIyMDUvMDYveGFNSzV5TU1EU3QxM0toQnZaWTNaUmtLUGJ2U1ZwbXBMZ3I1NjVsSy5qcGVn&amp;sign=yx:R-h8E5ypatVQ4id6KrqkmY7UIWw=&amp;tv=0_0&amp;p="></quark-image> 鲁扬 PureblueAI清蓝创始人、CEO <quark-image aesthetics_score_v2="2" available_status="3" efficiency_score_v2="1" fetch_status="0" ori_height="1197" ori_width="829" phash="14240066677259642738" relevant_score_v2="1" render_height="260" render_width="180" url="http://s2.zimgs.cn/ims?at=ori&amp;kt=url&amp;key=aHR0cHM6Ly9pbWdzLmVicnVuLmNvbS91bml0L3Bob3Rvcy8yMDI2MDQvMDMvdzdSVHNQYjJzVHcwem1tVlVmTmN0bnp1SmJDTERCaWMxSVR6eEkwOC5qcGVn&amp;sign=yx:_ZX0yqgH4qRKW7MOEovYuLevcbg=&amp;tv=0_0&amp;p="></quark-image> 深耕线下企业服务领域九年，专注流量运营与门店数字化转型。现负责零售及门店数字化业务，主导构建「可计算开店」全流程服务体系，融合大数据算法与一线经验，打造开闭店全链路决策能力。曾服务数十个新锐品牌，通过慢闪店模式提升线下布局与营销效率，助力实现可持续增长，推动线下商业数字化升级。 谢培松 可计算开店科技合伙人 <quark-image aesthetics_score_v2="2" available_status="3" efficiency_score_v2="1" fetch_status="0" ori_height="1376" ori_width="952" phash="17978760479434892386" relevant_score_v2="1" render_height="260" render_width="180" url="http://s2.zimgs.cn/ims?at=ori&amp;kt=url&amp;key=aHR0cHM6Ly9pbWdzLmVicnVuLmNvbS91bml0L3Bob3Rvcy8yMDI2MDQvMDIvTDJYV0E4ZXZEdkd6Tk43RFFOelYzcHFQU0o3dTY0aUdzUmNFVndqSy5qcGVn&amp;sign=yx:u2qLRry99yA3njZBb2bDoO7n9QY=&amp;tv=0_0&amp;p="></quark-image> 复旦大学本科及美国芝加哥大学布斯商学院MBA学历背景，职场履历兼具深度与跨度——从贝恩咨询积累专业经验，到出任必胜客CMO深耕品牌管理，再到执掌美的中国区CMO，负责推动美的在数字生态中的品牌建设与渠道共生增长。经验横跨咨询、餐饮与家电行业，以“用户共创”理念驱动品牌增长 徐行 美的集团中国区CMO <quark-image aesthetics_score_v2="2" available_status="3" efficiency_score_v2="1" fetch_status="0" ori_height="1734" ori_width="1200" phash="11164817597038769100" relevant_score_v2="2" render_height="260" render_width="180" url="http://s2.zimgs.cn/ims?at=ori&amp;kt=url&amp;key=aHR0cHM6Ly9pbWdzLmVicnVuLmNvbS91bml0L3Bob3Rvcy8yMDI2MDQvMDIvRWZvRVNsODllS1pVcGdKdVBJUHdMcXhiZkE0TGdYdXY0eDVmTUJtVi5qcGVn&amp;sign=yx:qTUkmzLqZ5V5C7WcKp6s5Tb_b3U=&amp;tv=0_0&amp;p="></quark-image> 赵健雄主导品牌走出了一条独特的“文化古建修复”之路。不同于常规开店，他推动了对北京国子监四合院、上海湖南路老洋房及广州东山口逵园等百年建筑的修缮式改造，坚持“修旧如旧”，将东方香气与在地建筑历史深度融合 。在他的操盘下，每一家门店都成为不可复制的文化地标，不仅重塑了品牌的高端调性，更让观夏在商业扩张中成功走出了以结合“文化”“建筑”“美学”的差异化道路 。以古建筑修复为根基、推动品牌跳出同质化竞争，助力观夏成为东方美学消费领域的标杆品牌。 赵健雄 观夏副总裁古建筑修复店负责人 <quark-image aesthetics_score_v2="2" available_status="3" efficiency_score_v2="1" fetch_status="0" ori_height="1734" ori_width="1200" phash="10123212916044583810" relevant_score_v2="1" render_height="260" render_width="180" url="http://s2.zimgs.cn/ims?at=ori&amp;kt=url&amp;key=aHR0cHM6Ly9pbWdzLmVicnVuLmNvbS91bml0L3Bob3Rvcy8yMDI2MDQvMDIvdU5maU1KSUhlV3Y2Y0hPNEdJWDFzeHdYVXVOdUdhYmhnaU5OSVA2ZC5qcGVn&amp;sign=yx:AoIk3F8EIsRGA_tqWh5GG63TWws=&amp;tv=0_0&amp;p="></quark-image> 自2016年创立品牌以来，许多作为品牌创意主脑，推动视觉体升级新与品牌人群重塑，实现销售额5年增长近5倍，并引领BJHG完成从潮牌单品向潮流文化品牌的战略转型。近年发起多场跨界联名与大型营销事件，带动品牌全域曝光超1.7亿。同时，通过公益巡展等项目拓展品牌社会影响力，助力BJHG成为Z世代共鸣的风格符号。2025年，品牌荣获第十五届 Hiiibrand Awards「最受欢迎品牌奖」等。 许多 BJHG不计后果品牌主理人、联合创始人 <quark-image aesthetics_score_v2="2" available_status="3" efficiency_score_v2="1" fetch_status="0" ori_height="1733" ori_width="1200" phash="14821401689528190927" relevant_score_v2="1" render_height="260" render_width="180" url="http://s2.zimgs.cn/ims?at=ori&amp;kt=url&amp;key=aHR0cHM6Ly9pbWdzLmVicnVuLmNvbS91bml0L3Bob3Rvcy8yMDI2MDQvMTUvZE9rRGI3eUdGQXFwMU9LbzRPQzh4Sk0yeWdCRFBCVU53MXZ5V05HaS5qcGVn&amp;sign=yx:1_m6T8yDcFRraaOuVC9x6dQFybU=&amp;tv=0_0&amp;p="></quark-image> 北大光华硕士，人工智能行业从业10年以上，先后在腾讯，网易，百度等公司任职，主导AI技术在B端全周期产品化，成功上线3个千万级AIaaS/Maas平台。对大语言模型和业务场景的结合有丰富的落地经验。现在正在积极推动生成式视频大模型在影视，营销，游戏，动漫等行业新的生产方式和商业模式。 王川 生数科技副总裁 <quark-image aesthetics_score_v2="2" available_status="3" efficiency_score_v2="1" fetch_status="0" ori_height="1734" ori_width="1200" phash="12025037653083718682" relevant_score_v2="2" render_height="260" render_width="180" url="http://s2.zimgs.cn/ims?at=ori&amp;kt=url&amp;key=aHR0cHM6Ly9pbWdzLmVicnVuLmNvbS91bml0L3Bob3Rvcy8yMDI2MDQvMTMvOXhudDJGMGlQWEdrU2MxT1ZFMnl6ZVdBaENZaldOVnFNVXNSRmtLNC5qcGVn&amp;sign=yx:fwy5Kfj93Xz_UyTKUBCvcYPq1f4=&amp;tv=0_0&amp;p="></quark-image> 乐奇Rokid联合创始人、副总裁。手机淘宝初创团队成员、前阿里巴巴M工作室产品运营负责人、前钉钉智能硬件生态高级专家 蔡国祥 乐奇Rokid联合创始人 <quark-image aesthetics_score_v2="2" available_status="3" efficiency_score_v2="1" fetch_status="0" ori_height="1635" ori_width="1132" phash="14742043243777786723" relevant_score_v2="2" render_height="260" render_width="180" url="http://s2.zimgs.cn/ims?at=ori&amp;kt=url&amp;key=aHR0cHM6Ly9pbWdzLmVicnVuLmNvbS91bml0L3Bob3Rvcy8yMDI2MDQvMDIvV2NMMTdreDM0RE9iT2dkSnExRjN6eTFydEpFMXJxNndZWE0yb2hNOC5qcGVn&amp;sign=yx:_MoJZHJf1EUhHhor4XPjXVUuelM=&amp;tv=0_0&amp;p="></quark-image> 毕业于华东师范大学中文系，逾30年广告营销经验。2003年创办电梯媒体集团分众传媒。分众电梯媒体覆盖超过300个城市， 300万个电梯终端，覆盖4亿中国城市主流消费人群。中国TOP100品牌，87家投分众。分众传媒电梯媒体具有“高触达、高关注、高频次、高完播”的独特优势价值。通过多项场景创新，分众媒体广告已具备行业领先的可精准、可归因、可互动、可优化的持续迭代能力，被评为【中国广告最具品牌引爆力媒体】。 江南春 分众传媒创始人、董事长 <quark-image aesthetics_score_v2="2" available_status="3" efficiency_score_v2="1" fetch_status="0" ori_height="1135" ori_width="786" phash="17218530328812028291" relevant_score_v2="1" render_height="260" render_width="180" url="http://s2.zimgs.cn/ims?at=ori&amp;kt=url&amp;key=aHR0cHM6Ly9pbWdzLmVicnVuLmNvbS91bml0L3Bob3Rvcy8yMDI2MDQvMDgvWGZDRmhLMnl6OWN5a2t4aEtKQlBzMjZKVFg4WUFwSXNQWjdBcnYzTy5qcGVn&amp;sign=yx:ArCB4Oayj1wQPaJuazvBGd-KxSw=&amp;tv=0_0&amp;p="></quark-image> 生活在左品牌创始人、林栖三十六院 CEO、中国十佳时装设计师、中国纺织非遗推广大使、2025中国十大品牌女性、2022中国纺织服装优秀品牌人物、中国首个马面裙技艺传承人。<br />林栖担任汇美集团执行董事，于2014年成立独立设计师原创品牌生活在左 在2017年成立生活在左传统生活文化研究所，以传统工坊的形式研究、传承、发展传统技艺。同时亲身实践 ，成立林栖三十六院，推动非遗文化产业赋能乡村共富发展 、并积极推动中国非遗走向世界，品牌多次参与上海国际时装周、中国国际时装周、伦敦时装周、巴黎时装周，向世界展示中国传统非遗技艺的美。2022年，林栖入选“2022中国纺织服装优秀品牌人物” 获得中华人民共和国文旅部颁发“2022年度乡村文化和旅游带头人» 荣誉2023年推动马面裙制作技艺成功申遗 2024年1月评定为中国首个马面裙技艺传承人<br /> 林栖 生活在左品牌创始人 、林栖文化董事长 <quark-image aesthetics_score_v2="2" available_status="3" efficiency_score_v2="1" fetch_status="0" ori_height="932" ori_width="645" phash="16898235028157858948" relevant_score_v2="1" render_height="260" render_width="180" url="http://s2.zimgs.cn/ims?at=ori&amp;kt=url&amp;key=aHR0cHM6Ly9pbWdzLmVicnVuLmNvbS91bml0L3Bob3Rvcy8yMDI2MDQvMDIvUHRxa0c4Y3l3NmhhU3dwQ3NJNVJLUlNTcUp2WVVUaTlyemhVdTR1RC5qcGVn&amp;sign=yx:fmUweGRwvlZPVoyoqyG7LOC3hs0=&amp;tv=0_0&amp;p="></quark-image> 吴磊先生现任慕尚集团副总裁兼GXG总经理，全面负责GXG（线上及线下）的战略升级、运营管理及品牌形象塑造，同时统筹集团旗下电商业务的多品牌运营。吴磊先生主导了品牌的数字化升级与全渠道战略布局，多次带领团队在电商大促中斩获男装品类销售冠军，并成功推动GXG品牌定位升级，进一步巩固了品牌在时尚零售市场的领先地位。 吴磊 慕尚集团零售副总裁，GXG总经理 王耀民先生出生于1971年1月，安徽池州九华山人，中共党员。1989-1993年就读于安徽大学外语系，毕业后进入安徽省服装进出口总公司工作。2003年创立三问集团。2008年创立i-baby品牌。2016-2018年就读于长江商学院，获EMBA硕士学位。<br /><br />王耀民先生是全球特色家居产业的创新领军者。在其带领下，从海外科技并购到全球战略重构，三问集团不断创新发展。公司以“材料创新×原创设计×全球供应链管理”为核心竞争力，全球70%的披巾原创设计源自于三问，被誉为“世界披巾之王”。同时，采用数智化系统助力创意管理和产品开发，构建覆盖全球的高效供应链网络，用极致产品力定义全球家居美学的新高度。今天，他又将宇航科技引入民用领域，全力打造一个恒温深睡、自然疗愈生活方式品牌——Outlast，用宇航科技改善人类睡眠，享受健康人生。<br /><br />定位于“世界级美学家居科技创新和创意设计领导者”，王耀民先生正以“科技创新×创意设计”双轮驱动三问的“品牌国际化、运营全球化”发展规划，实现2030年100亿营收、2035年300亿营收的战略目标，致力于成为“万分之一中国有三问”的中国梦践行者和贡献者！<br /> 中国作家，编剧 ，中国作家协会会员 ，南派投资董事长，橙瓜见证·网络文学20年十大悬疑作家，百强大神作家，百位行业人物。 当代作家、编剧 中国内地导演、演员、主持人、制片人，毕业于北京舞蹈学院，担任电视剧《长安十二时辰》总制片人。 梁超 《长安十二时辰》制片人 高洪庆先生于2020年创立百联挚高资本，他拥有逾20年创业和风险投资经验，曾担任达晨创投董事总经理以及联创资本管理合伙人兼首席执行官。<br />高洪庆先生被誉为最懂创业者的投资人，2016年全球创业周被评为“最受创客青睐投资人”，2018年被新华网评选为“ 中国双创年度创投人物”，获评福布斯中国的“2024大消费年度投资人物”、沙利文中国“2026大消费年度投资人物”。<br />投资代表案例包括：泸溪河、微康益生菌、帅克宠物、万物新生、玛士撒拉、洛可可、网鱼网咖、佳沃蓝莓、新榜、华人青年、嘉驰国际等。<br />高洪庆先生拥有上海财经大学金融学学士学位、美国威斯康星康考迪亚大学工商管理硕士学位，是上海财经大学商学院兼职教授，以及华东师范大学研究生导师，目前担任上海财经大学金融校友会执行副会长。<br /> 高洪庆 百联挚高资本创始合伙人兼首席执行官 新锐战略咨询专家，累计管理企业规模超1000亿，助力企业累计营业额增长超200亿，成果创造多个行业第一。代表案例波司登、猫人、GXG、拉夏贝尔、劲仔、爱棵米等。 孙晓黎 云杉咨询创始人 商务部电子商务专家咨询委、国家电子商务示范城市专家咨询委专家。2000 年以来，长期从事电子商务媒体及研究工作，作为产业及政策研究者先后参与或主持了我国多项重 大电子商务政策、法规及规划的研究工作，是《电子商务“十三五”发展规划》专家编写组牵头人，数字丝 绸之路研究的参与专家，也是发展跨境电子商务的早期倡导者之一。郑敏创办的亿邦动力是国内具有影响力的电商知识平台，包括电商媒体亿邦动力网、电商服务商超市思路网、亿邦动力研究院和亿邦商学院。 郑敏 亿邦动力董事长、亿邦智库院长 多年媒体从业经验，专注于零售消费电商、跨境电商、产业数字化内容报道及行业研究。主导并策划历届双11直播专题报道，电商行业特大事件调查及追踪报道。主导并策划多届亿邦未来零售大会。<br />主要作品：《Agent就是下一代的平台》、《一人公司，正在偷家大厂》、《予牛马以时间，给欲望以土壤》、《忘掉预制GMV，找回烟火寻常》、《唯有情绪，拯救消费》、《变量：中国平台影响世界电商》、《破天荒|双十一哑火》、《致被互联网深深影响的30年》 贾昆 亿邦动力副总裁、视频博客《下班了》制作人 漫画家。1976年创办龙卡通公司，其执导的动画《老夫子》获1981年金马奖最佳卡通片奖。1983年转型四格漫画创作，开创性将《庄子说》《老子说》等古籍改编为漫画，作品被译为多国语言并在59个国家和地区发行。2013年其260则漫画故事入选人教版传统文化教材。2022年担任中华慈孝文化大使，2024年任杭州国家版本馆顾问。陆续推出《漫画道德经》等新作，作品累计全球发行量超5000万册。2025年9月，获评为2025福布斯中国当代艺术名家。 蔡志忠 著名漫画家 上海林清轩化妆品集团股份有限公司创始人、董事会主席、执行董事兼总裁，高级经济师，松江区第六届人大代表，中国香料香精化妆品工业协会特邀副理事长，上海日用化学品行业协会副会长。<br />2023年，获评“全国商业优秀企业家”。<br />2022年，获评“全国商业科技创新人物”。<br />2021年，获“感动松江先进典型人物”称号，同年担任首届上海日用化学品行业协会化妆品企业家专业委员会主席。<br />2020年，获评“上海商业优秀创业企业家”。<br />先后担任北大光华管理学院、复旦大学管理学院、交大南洋文创学院、上海财经大学MBA、上海大学MBA等高校专家讲师<br /><br /> 孙来春 林清轩创始人、董事会主席 浙江同心妇幼产品发展有限公司董事长、基诺浦品牌创始人。他深耕母婴童行业20余年，以“科技”与“爱心”引领机能鞋品类成为行业标杆。作为“帮助妈妈，成就宝宝”的践行者，他推动建设了“觉察型育儿”课程与服务体系，帮助千万父母正确育儿。 裴非 基诺浦董事长 鲁扬 PureblueAI清蓝创始人、CEO 谢培松 可计算开店科技合伙人 复旦大学本科及美国芝加哥大学布斯商学院MBA学历背景，职场履历兼具深度与跨度——从贝恩咨询积累专业经验，到出任必胜客CMO深耕品牌管理，再到执掌美的中国区CMO，负责推动美的在数字生态中的品牌建设与渠道共生增长。经验横跨咨询、餐饮与家电行业，以“用户共创”理念驱动品牌增长 徐行 美的集团中国区CMO 赵健雄主导品牌走出了一条独特的“文化古建修复”之路。不同于常规开店，他推动了对北京国子监四合院、上海湖南路老洋房及广州东山口逵园等百年建筑的修缮式改造，坚持“修旧如旧”，将东方香气与在地建筑历史深度融合 。在他的操盘下，每一家门店都成为不可复制的文化地标，不仅重塑了品牌的高端调性，更让观夏在商业扩张中成功走出了以结合“文化”“建筑”“美学”的差异化道路 。以古建筑修复为根基、推动品牌跳出同质化竞争，助力观夏成为东方美学消费领域的标杆品牌。 赵健雄 观夏副总裁古建筑修复店负责人 自2016年创立品牌以来，许多作为品牌创意主脑，推动视觉体升级新与品牌人群重塑，实现销售额5年增长近5倍，并引领BJHG完成从潮牌单品向潮流文化品牌的战略转型。近年发起多场跨界联名与大型营销事件，带动品牌全域曝光超1.7亿。同时，通过公益巡展等项目拓展品牌社会影响力，助力BJHG成为Z世代共鸣的风格符号。2025年，品牌荣获第十五届 Hiiibrand Awards「最受欢迎品牌奖」等。 许多 BJHG不计后果品牌主理人、联合创始人 北大光华硕士，人工智能行业从业10年以上，先后在腾讯，网易，百度等公司任职，主导AI技术在B端全周期产品化，成功上线3个千万级AIaaS/Maas平台。对大语言模型和业务场景的结合有丰富的落地经验。现在正在积极推动生成式视频大模型在影视，营销，游戏，动漫等行业新的生产方式和商业模式。 王川 生数科技副总裁 乐奇Rokid联合创始人、副总裁。手机淘宝初创团队成员、前阿里巴巴M工作室产品运营负责人、前钉钉智能硬件生态高级专家 蔡国祥 乐奇Rokid联合创始人 合作伙伴 PARTNER 战略合作 合作伙伴 大会特邀汽车合作伙伴 大会礼品合作 合作媒体'
          source: 'aliyun'
