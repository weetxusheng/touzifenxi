事局主席 认识了 FBIF 和贝拉多年，非常欣赏 FBIF 这一支充满梦想的年轻团队。他们正在用创造力和活力见证和陪伴中国食品饮料行业的蓬勃发展，非常有意义。 麦伟坚 玛氏箭牌中国区-前总裁 FBIF is by far "the" leading platform for food innovation in China and perhaps beyond. I am especially impressed about the speed of growth and innovation within the company and its employees, very inspiring. Alfa Laval provides a keynote speech about innovative protein processes during the FBIF2020 in Hangzhou. This event took place in the midst of the COVID crisis. The forum was converted from a pure physical event to a hybrid physical and virtual event in a couple of weeks. Impressive how this was managed by their young professional and tech savvy team. Frederik Van Moer 阿法拉伐NEA食品系统-副总裁 这是一个有梦想敢于颠覆创新的年轻团队，他们用热情和激情为食品饮料行业带来了活力和不一样的富有价值的洞察。 曹永梅 旺旺集团-生产研发群总处长 我觉得FBIF是一个很棒的食品饮料行业交流活动。他强调信息共享、创新和建立一个更强大的食品饮料行业社区。FBIF是一个经过考验和值得信赖的模式，为好创意和成熟品牌提供了很好的机会。 冯广晟 Ventech China-管理合伙人 作为连续两年的评审团成员，我期待看到比去年更多精彩的作品，期待FBIF奖成为你在全球舞台上展翅的平台! 高木悠子 设计经理-可口可乐 主办方：Simba Events 上海辛巴商务咨询有限公司 联系我们 公司：上海辛巴商务咨询有限公司 地址：上海市闵行区七宝镇新镇路1459弄6号宝龙城T9号楼801室 邮箱：info@fbif.com 联系我们 相关链接 上海辛巴商务咨询有限公司 FoodTalks全球食品资讯网 FBIF Wow食品创新奖官网 FBIF食品饮料创新公众号 FBIF会展小程序 关于我们 Simba Events（上海辛巴商务咨询有限公司）是一家专注服务食品行业的市场调研、咨询、会议和新媒体公司，成立于2013 年, 位于上海，Simba 的发展始于会议，目前覆盖会议、赛事、媒体、咨询和培训等多个版块。Simba的会议理念是：会议的价值在于通过分享与互动，让想法产生更多想法，创新激发更多创新，会议应承担起推动行业进步的使命。 © Copyright 2023 Simba. All rights reserved. 沪ICP备19035501号-1 加载中，请稍后...'
