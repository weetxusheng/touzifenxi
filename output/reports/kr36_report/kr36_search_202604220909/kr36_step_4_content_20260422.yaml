        topic: '中国科技公司战略与资本运作'
        channel: '36氪独家'
        original_url: 'https://36kr.com/p/3773892499096068'
        original_published_at: '2026-04-22'
        original_content:
          url: 'https://36kr.com/p/3773892499096068'
          domain: '36kr.com'
          content_title: '36氪独家专访|拿到大疆、美团投资后，智能派追赶拓竹，要打“老二”翻身仗'
          content_summary: '作者 | 张子怡 编辑 | 袁斯来 智能派的联合创始人兼副总经理陈波变了一个人。 三年前，你见到他，会觉得这人张扬到有些轻狂。陈波对于智能派产品和能力有绝对自信，至于对手，”没什么了不起”。 三年后，他告诉我们：有些事会尽力而为，如果几年后做不出想要的成绩，让更有能力的人来接管业务——甚至会引入职业经理人。 在“创始人崇拜”盛行的创投圈，这是一个让人震动的决定，却也有迹可循。 硬氪独家获悉，智能派'
          content_text: '作者 | 张子怡 编辑 | 袁斯来 智能派的联合创始人兼副总经理陈波变了一个人。 三年前，你见到他，会觉得这人张扬到有些轻狂。陈波对于智能派产品和能力有绝对自信，至于对手，”没什么了不起”。 三年后，他告诉我们：有些事会尽力而为，如果几年后做不出想要的成绩，让更有能力的人来接管业务——甚至会引入职业经理人。 在“创始人崇拜”盛行的创投圈，这是一个让人震动的决定，却也有迹可循。 硬氪独家获悉，智能派已完成数亿元B+轮融资。由美团领投，深创投、高瓴、银泰、国策、明荟致远、高新投等联合注资。本轮融资距离上一次大疆参与的轮次不到半年。 过去十多年，人们迷恋、追逐天才创始人，将其视作某种宗教领袖。TA不一定有好的口才，也不需要讨人喜欢，但必须有极强烈的个性和某一方面的天赋。哪怕TA的作风高压、独断、不近人情，也会被无数人膜拜。 从硅谷到中国，从乔布斯、马斯克到山姆.奥尔特曼，潮流从未褪去。而这群梦想家的确造就了一批足以载入史册的明星公司。 智能派显然不属于这个行列。他们从华强北起步创业，是深圳很常见的草根“老板”。智能派公司总部在工厂遍地的龙华，他们喜欢“做生意”，而不痴迷于改变世界——陈波从不会浪漫化创业这件事。 在智能派创始团队身上，你可以看到流淌在很多广东人血液中的企业家精神：如流水一样，去适应时代、市场、地域乃至文化的变迁。他们的身姿灵活，务实而接地气，当发现无法达到目的，可以承认自身不足，并迅速切换路径。 从引入投资这件事，就可以看到智能派行事的转变。很长一段时间，智能派三个创始人不接受外部投资，也不接受媒体采访。“闷声发大财”向来是潮汕老板们的特色。 那几年，他们砸钱、砸人搞研发，还放弃过一款产品，却发现自己的产品和对手差距还是越来越大。 “那一刻我意识到，我们的努力跟不上市场的强度了。“陈波回忆。 （图源/企业） 而解决办法很明确：“如果我们这三个人做不好，那说明我们自己的能力有问题。做不好就让更适合的人来做。” 他们主动寻找中间人接触大疆，三个月就谈妥了融资。过去连个人照片都不想公开的陈波，也开始逼迫自己去接触媒体。 作为“老板”，洪英盛和陈波当然有野心，他们认为3D打印市场还有几倍增量，市场远未到终局。智能派一定要留在牌桌，吃下红利，甚至成为第一。为了这个目的，他们愿意割去创始人团队本能的掌控欲、骄傲和情感。正如陈波所说： “做生意不是玩过家家。” 我们和陈波聊了近3个小时，交流了过往三年的经历以及对未来的规划。 人们容易被有着救世主气质的创始人吸引。智能派不擅长讲述引人着迷的故事，但毋庸置疑，这帮草根“老板”也是让人生畏的对手。 “Be water，My friend”。 01 “革自己的命” 硬氪：你们之前其实不想露面发声的。 陈波： 其实公司的文化风格是由创始人来定调的。我们为什么之前不经常出来讲？我们的创始人不属于那种过于活泼的类型。甚至在两年之前，我们都不想被媒体知道的，连只言片语都不要有。 这跟潮汕人的风格有关，他是潮汕人，我是客家人，其实性格是一样的。我们信奉的就是像马化腾那样最好，闷声赚钱、闷声发大财就好了。 硬氪：为什么选择在现在这个阶段发声？ 陈波： 本质上是发展的需要。我现在观察的是，世界已经进入新周期了。以前我们叫“跨境电商出海”，现在叫“品牌出海”。这是一个中国品牌去正面挑战旧世界品牌（如索尼、苹果）的阶段。谁能成为今后的全世界品牌？除了那些顶级硬核公司，我们这种中小公司在过程中也存在变数。 所以我们不能再“小家子气”地困在自己的圈子里了。 硬氪：您觉得智能派现在最大的短板是什么？ 陈波： 其实我们现在的短板是在软件。我们要明确一点，这块的软件不是互联网那种批量获客、做规模化效应、商业模式闭环的软件，而是要跟硬件强结合的。它包含两个层面：一个是机器本身的固件和切片软件，要驱动硬件工作；另一个是配合机器的生态软件，比如模型库、手机App等。 所以虽然只提“软件”，但最终它指的是你整一个3D打印软件硬件生态相互之间融合闭环的能力。目前来看，具备这样能力的其实只有我们这几家，做的最好的肯定是拓竹，我们做的也还不够好。 硬氪：大家以前总觉得3D打印是拼硬件参数。拓竹进场之后，它的软件优势到底体现在哪？是打印效率，还是简单的完成度？ 陈波： 拓竹的入场把这个标准拉到了现在的点。其实从行业拆解的角度看，他的硬件并非最优，但他的软件确实是护城河，其他家目前来说，包括我们，也很难在短时间内追得上的。 软件解决的核心其实就是“稳定性”。拓竹出来之前，大家的软件基本处于“刚刚能用”的程度，是作为辅助位的，硬件才是创新的大头。但你看后来的发展，你用一般的硬件，只要软件调得够好，在用户体验侧一样可以很丝滑。 硬氪：这种“稳定性”在用户端最直观的差异是什么？ 陈波： 最核心的点在于成功率，单次打印和持续打印的成功率。 我用一个直观的说法。如果是家庭用户购买使用3D打印T2梯队的品牌，这个机器设备可能每使用半个月，它要让机器重置、自我调平一下才能继续用。这在以前也没什么大问题，因为已经不需要用户手动去调嘛。但拓竹可以持续稳定超过一个月以上。 这就是一致性的差异。它不是硬件的问题，硬件复位都能恢复精度，但它是软件控制。你每打完一次，硬件产生的精度偏差，能不能被算法记住？能不能每一次都复原？这是算法的积累，我们确实还在努力追赶当中。 硬氪：所以你们现在才要用大疆的方法论？ 陈波： 我们确实在学习大疆开发产品的方法论。他的软件和算法是我们需要的，还有一点是大疆跟硬件结合的固件开发方法论。不是说看他开发出的固件是怎么样的，而是要看这套体系。整个行业包括拓竹都会出现这种情况：硬件产品做好了，但是软件调优跟不上。如果你把这套方法论拿过来，就能修正我们之前不断踩坑的过程 硬氪：你们之前想过自己做吗？ 陈波： 我们以前是尝试过组建团队自己做的。前几年，我们也招了一帮人来突围。有成效吗？肯定有，但相当于都在试错，效率极低。我们发现硬件是可以逐步积累迭代的，大家已经掌握了规律，但软件它是0和1的关系。我们之前的团队缺乏软件思维，你组建一个团队，他成长需要时间，而你的对手也是在进步的。所以我们现在调转头来，在改进这种方式。 硬氪：如果引入了这套体系，经过验证还是不能出好产品，你们会有更激进的调整吗？ 陈波：我们的表态非常明确，就是“革自己的命”。 如果2024年、2025年的产品做出来还跟不上市场的期待值，或者达不到跟竞对PK的程度， 那就说明管理能力确实在那，到天花板了。 我们的态度是开放的：做不好就让更适合的人来做。我们甚至会考虑引入职业经理人。说实话，如果我们这三个人做不好，那说明我们自己的能力有问题。我对我的管理部门也一样，如果无法带领前进，我就会退位让贤。 硬氪：那这种深度的合作甚至接管，怎么保证自己的掌控度呢？ 陈波： 还是那个逻辑：如果终止合作，你有没有其他的出路？没有。你虽然利润率降低了，但从利润总额来看，如果你以前赚一个亿，将来变成赚三五十亿，这有什么不可以？ 做生意不是玩过家家。 我们起家是华强北，这是非常深圳非常草根的创业，后面转型从跨境电商的模式变成产品开发。当时也是刚好有这个机会，赛道有很高的天花板，我们可以去追逐。但如果我们努力之后，还是不行，那肯定要调整。 Saturn+4...'
