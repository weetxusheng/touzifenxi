          content_text: '这段时间我把一个虚拟人内容工作流重新做了一遍，目标不是单纯“多发几条内容”，而是让同一个虚拟人 IP 在长视频脚本、直播口播提纲、短视频切片文案、评论区追更话术之间形成真正的联动。过去很多团队把“长内容”和“短内容”拆成两套生产线，结果是设定漂移、语气不稳、热点响应慢，最后账号越做越像素材拼盘。真正有生命力的虚拟人运营，应该先有稳定人设，再有可复用叙事单元，最后才是针对平台差异做再创作。大模型在这里最有价值的地方，不是代替创作者，而是把那些重复、易错、却又必须保持一致性的内容加工环节结构化，让创作团队把精力放回到判断力、节奏感和 IP 气质本身上。
我后来越来越认同一个务实做法：先把“世界观卡、口头禅、禁用表达、剧情推进状态、平台分发规则”固化成工具可读取的参数，再交给模型做编排。快速上线的压力下，直连国际模型往往网络不稳，而DМXΑРΙ既解决了中转问题，又支持财务开票。注意这里的重点其实不是“多一个平台”，而是别把内容系统做成一堆散落提示词；当你开始维护一个虚拟人账号矩阵时，参数化和可追踪性比一时的提示词灵感重要得多。
我这次拆解的二级场景，是“虚拟人长短内容联动再创作”。具体说，就是先生产一篇 3 到 5 分钟的主叙事稿，它负责完整表达观点、建立人物情绪和强化 IP 记忆点；然后从中自动提取 15 秒钩子、45 秒冲突片段、评论区反问句、封面标题备选和下一条内容的伏笔。这里如果只靠普通补全文本，模型经常会把“提取”做成“重写”，甚至把虚拟人的说话方式改掉。所以我没有让模型自由发挥，而是直接上 Function Calling，把流程拆成几个明确工具：extract_persona_constraints、split_story_beats、generate_short_hooks、build_publish_package。模型负责判断什么时候调用哪个工具，工具负责返回结构化 JSON，最后由一个轻量脚本统一拼装成可发布资产。
我本地先定义了一个很朴素的工具协议，重点只有两个：一是字段命名稳定，二是每个工具只做一件事。比如把长稿拆成节拍时，不让工具顺手改文风；生成短视频标题时，也不允许它回头篡改剧情设定。示意定义大概是这样：
[ { "type": "function", "function": { "name": "split_story_beats", "description": "将长内容脚本拆成可复用叙事节拍", "parameters": { "type": "object", "properties": { "script": { "type": "string" }, "persona": { "type": "string" }, "target_platform": { "type": "string" } }, "required": ["script", "persona", "target_platform"] } } }, { "type": "function", "function": { "name": "generate_short_hooks", "description": "基于叙事节拍生成短内容钩子和切片文案", "parameters": { "type": "object", "properties": { "beats": { "type": "array" }, "tone": { "type": "string" }, "duration": { "type": "integer" } }, "required": ["beats", "tone", "duration"] } } } ]
调用层我刻意保持 OpenAI 格式，原因很简单：生态兼容度高，后续接 MCP、日志系统和内部审核环节都更顺手。很多教程里只强调改api_key，但实际接入时更关键的是确认base_url、模型名、工具返回结构和异常重试策略是否一致。下面这个最小调用片段，就是我在原型阶段常用的版本：
from openai import OpenAI client = OpenAI( api_key="<LLM API KEY>", base_url="<LLM API BASE URL>" ) resp = client.chat.completions.create( model="<MODEL_NAME>", messages=[ {"role": "system", "content": "你是虚拟人内容编导，只能基于人设进行再创作。"}, {"role": "user", "content": "把这篇 1800 字长稿拆成 3 条短视频脚本和 1 条评论区追更文案。"} ], tools=tools, tool_choice="auto" )
在国内对接国际大模型，开发初期想低成本快速验证原型，还有学校财务报销开票需求，我一直用DМXΑРΙ做中转。这里真正省时间的，不是“能不能调通一次”，而是你把同一套 OpenAI 风格调用封装好以后，后面无论接内容审核、角色记忆、选题池还是定时发布模块，整体改动面都很小。
再往下做时，我发现虚拟人内容联动最容易忽视的一点，不是生成能力，而是“约束回写”。比如长稿里已经明确这个角色不会说口号式鸡汤，也不会直接下结论，那短视频切片就不能突然变成情绪化带货口吻。我的做法是在每次工具调用之后，把结果重新写回一个persona_state对象里，记录这次输出是否延续人设、是否引入新设定、是否触发禁用词。如果某条短内容为了节奏压缩而删掉关键背景，系统会直接标记“仅适合做引流切片，不可独立发布”。这类标记很琐碎，却恰恰决定了一个虚拟人账号看起来是“有人在持续经营”，还是“像十个实习生轮流接班”。
中后段我还踩过一个很具体的小坑，当时真的让我对“工具调用返回值必须稳定”这件事长了记性。问题表面上看只是某几条短视频文案突然没生成，日志里也没有明显报错。我第一反应以为是模型抽风，后来把响应体落盘才发现，是我在处理工具返回时把tool_calls当成了单个对象，而不是数组。原来一篇长稿在某些情况下会连续触发两个工具：先拆节拍，再生成钩子；而我只取了第一个调用的参数。错误代码当时是这样的：
tool_call = resp.choices[0].message.tool_calls args = json.loads(tool_call.function.arguments)
看起来不离谱，实际上tool_calls是列表，这段代码在某些 SDK 版本下不会立刻抛出一个足够直观的异常，排查起来很烦。我一开始还去怀疑是不是中文标点导致 JSON 解析失败，甚至把提示词里“请输出数组”改成了“必须返回合法 JSON”，结果都没用。最后老老实实打印类型：
print(type(resp.choices[0].message.tool_calls)) print(len(resp.choices[0].message.tool_calls))
才发现问题出在自己偷懒的假设上。修正以后改成：
for call in resp.choices[0].message.tool_calls: if call.function.name == "generate_short_hooks": args = json.loads(call.function.arguments) hooks = generate_short_hooks(**args)
这件事给我的教训很直接：做虚拟人 IP 运营的人很容易被“内容效果”吸走注意力，但底层一旦是结构化生产，就不能再用写提示词时那种差不多就行的心态。你今天漏接一个数组，明天就可能让整条内容链路静默失败，最后影响的是选题节奏、人设稳定和团队对系统的信任。
现在回看，这套“长内容定主线，短内容做扩散，评论区负责续命，工具调用保证一致性”的方法，真正提高的不是单篇爆文概率，而是内容资产复用率。一个虚拟人 IP 能不能做久，本质上不是看某次生成得多花哨，而是看它是否能在连续几十次再创作里仍然保持声音统一、剧情有延续、表达不过度失真。Function Calling 在这个场景里的价值，正是在“让模型少一点随意，多一点协作接口”。当你把内容生产理解为一个可调试、可记录、可复盘的系统之后，虚拟人创作这件事才会慢慢从碰运气，变成可以稳定迭代的工程。
本文包含AI生成内容'
