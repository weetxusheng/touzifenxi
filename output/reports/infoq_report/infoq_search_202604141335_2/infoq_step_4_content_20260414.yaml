屏幕上，跳动的数据、流动的曲线共同构成实时“电网画像”。每小时数据采集达78000多条，较过去扩大24.5倍。 “过去靠经验，现在靠算力。”国网江苏电力调度控制中心调度运行处处长仇晨光介绍，依托数字孪生、人工智能等技术，新能源渐入可观测、可调度、可消纳的智慧管理新阶段。 作为国网系统首个现场部署光明电力大模型的省级公司，国网江苏电力算力规模达10亿亿次/秒。AI全面融入电网“毛细血管”——超前推演、预判风险、自动生成预案，推动电网从“事后应对”迈向“事前预防”。 江苏制造业发达、算力强大、绿电资源丰富，有条件先试先行。为此，江苏探索让虚拟电厂、微电网与现货交易机制形成合力，把新能源波动理顺。每天，江苏有68万电力现货客户，根据每15分钟更新的动态电价，科学决策生产计划。 算电协同是涉及政府、企业、科研机构多方协同的生态共建。目前，江苏省已出台算力基础设施发展专项规划，统筹算力中心布局与电力基础设施配套、绿电政策衔接；紫金山实验室的新一代传输技术研发、中国科学院工业人工智能研究所的算力调度算法创新，推动算电协同技术快速落地。 相关人物 243782 构建“绿电+智算+智造”新生态 15 科技热点 科技热点 科技日报 科技日报 2026-04-14 网站声明 关于我们 联系我们 北京国际科技创新中心 微信公众号 中国政府网及国务院部门网站 市级政府部门网站 各区政府网站 新闻媒体网站 中国政府网 外交部 国防部 国家发展和改革委员会 教育部 科学技术部 工业和信息化部 国家民族事务委员会 公安部 国家安全部 民政部 司法部 财政部 人力资源和社会保障部 自然资源部 生态环境部 住房和城乡建设部 交通运输部 水利部 农业农村部 商务部 文化和旅游部 国家卫生健康委员会 退役军人事务部 应急管理部 人民银行 审计署 国家语言文字工作委员会 国家外国专家局 国家航天局 国家原子能机构 国家海洋局 国家核安全局 国务院国有资产监督管理委员会 海关总署 国家税务总局 国家市场监督管理总局 国家广播电视总局 国家体育总局 国家统计局 国家国际发展合作署 国家医疗保障局 国务院参事室 国家机关事务管理局 国家认证认可监督管理委员会 国家标准化管理委员会 国家新闻出版署（国家版权局） 国家宗教事务局 国务院港澳事务办公室 国务院研究室 国务院侨务办公室 国务院台湾事务办公室 国家互联网信息办公室 国务院新闻办公室 新华通讯社 中国社会科学院 中国工程院 国务院发展研究中心 中央广播电视总台 中国气象局 中国银行保险监督管理委员会 中国证券监督管理委员会 国家行政学院 国家信访局 国家粮食和物资储备局 国家能源局 国家国防科技工业局 国家烟草专卖局 国家移民管理局 国家林业和草原局 国家铁路局 中国民用航空局 国家邮政局 国家文物局 国家中医药管理局 国家外汇管理局 国家药品监督管理局 国家知识产权局 出入境管理局 国家公园管理局 国家公务员局 国家档案局 国家保密局 国家密码管理局 市政府办公厅 市发展改革委 市教委 市科委、中关村管委会 市经济和信息化局 市民族宗教委 市公安局 市民政局 市司法局 市财政局 市人力资源社会保障局 市规划自然资源委 市政务服务和数据管理局 市生态环境局 市住房城乡建设委 市城市管理委 市交通委 市水务局 市农业农村局 市商务局 市文化和旅游局 市卫生健康委 市退役军人事务局 市应急管理局 市市场监管局 市审计局 市政府外办 市国资委 市广电局 市文物局 市体育局 市统计局 市园林绿化局 市地方金融监管局 市国动办 市信访办 市知识产权局 市医保局 东城区 西城区 朝阳区 海淀区 丰台区 石景山区 门头沟区 房山区 通州区 顺义区 昌平区 大兴区 怀柔区 平谷区 密云区 延庆区 新华网 人民网 央视国际 中央人民广播电台 中国日报 中国国际广播电台 光明网 经济日报 京报网 北京电视台 北京人民广播电台 千龙网 主办：北京推进科技创新中心建设办公室 承办： 北京市科学技术委员会、中关村科技园区管理委员会 北京市委宣传部 北京市经济和信息化局 北京市政务服务和数据管理局 政府网站标识码：1100000251 京公网安备11040202500067号 京ICP备05060936号-2 活动 日历 移动 端 我要 建议 我要 分享 分享到微信朋友圈 × 用微信“扫一扫”，点击右上角分享按钮， 即可将网页分享给您的微信好友或朋友圈。 返回 顶部'
