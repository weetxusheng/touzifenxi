<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Drag Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eaf3f8, #f8fbfd);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #102235;
    }
    .panel {
      width: min(720px, calc(100vw - 40px));
      padding: 30px;
      border-radius: 24px;
      background: white;
      border: 1px solid #dbe8f2;
      box-shadow: 0 20px 60px rgba(16, 34, 53, .12);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }
    p {
      margin: 0 0 24px;
      color: #5c6f80;
      line-height: 1.7;
    }
    .track {
      position: relative;
      height: 58px;
      border-radius: 18px;
      background: #eef4f8;
      border: 1px solid #d3e2ed;
      overflow: hidden;
      user-select: none;
    }
    .progress {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      background: linear-gradient(90deg, #8ac2a4, #4da37a);
      opacity: .55;
    }
    .thumb {
      position: absolute;
      top: 7px;
      left: 7px;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #0f5ea8;
      box-shadow: 0 8px 18px rgba(15, 94, 168, .28);
      cursor: grab;
    }
    .thumb:active {
      cursor: grabbing;
    }
    .label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      font-weight: 700;
      color: #60788d;
    }
    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f8fbfd;
      color: #33516c;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>本地拖拽研究页</h1>
    <p>这个页面只用于研究 Selenium 鼠标拖拽事件。它不是验证码，也不会提交任何验证结果。</p>
    <div id="track" class="track" aria-label="local drag track">
      <div id="progress" class="progress"></div>
      <div id="label" class="label">拖到右侧完成本地演示</div>
      <div id="thumb" class="thumb" role="button" aria-label="drag thumb"></div>
    </div>
    <div id="status" class="status">等待拖拽</div>
  </main>
  <script>
    const track = document.getElementById("track");
    const thumb = document.getElementById("thumb");
    const progress = document.getElementById("progress");
    const status = document.getElementById("status");
    let dragging = false;
    let startClientX = 0;
    let startLeft = 0;

    function maxLeft() {
      return track.clientWidth - thumb.clientWidth - 14;
    }
    function setLeft(left) {
      const clamped = Math.max(7, Math.min(maxLeft(), left));
      thumb.style.left = `${clamped}px`;
      progress.style.width = `${clamped + thumb.clientWidth / 2}px`;
      const ratio = Math.round((clamped - 7) / (maxLeft() - 7) * 100);
      status.textContent = ratio >= 98 ? "本地拖拽完成" : `拖拽进度：${ratio}%`;
    }
    thumb.addEventListener("pointerdown", (event) => {
      dragging = true;
      thumb.setPointerCapture(event.pointerId);
      startClientX = event.clientX;
      startLeft = thumb.offsetLeft;
    });
    thumb.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      setLeft(startLeft + event.clientX - startClientX);
    });
    thumb.addEventListener("pointerup", (event) => {
      dragging = false;
      thumb.releasePointerCapture(event.pointerId);
    });
  </script>
</body>
</html>
