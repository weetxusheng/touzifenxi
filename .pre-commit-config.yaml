repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff-check
        files: ^(src/touzifenxi/(c114_.*|cli\.py|settings\.py|skill_packaging\.py)|tests/test_.*\.py|skills/.+\.py|pyproject\.toml)$
      - id: ruff-format
        files: ^(src/touzifenxi/(c114_.*|cli\.py|settings\.py|skill_packaging\.py)|tests/test_.*\.py|skills/.+\.py)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
