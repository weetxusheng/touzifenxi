interface:
  display_name: "C114 当日热点"
  short_description: "抓取 C114 热点并生成待 agent 补全关键词的搜索清单"
  default_prompt: "使用 $c114-daily-hot-topics 时，先阅读 skill 根目录下的 SKILL.md，了解当前总步骤、输入输出、实现状态和规则边界。若配置可能缺失，先运行 c114-config-status，只在缺项时向用户收集配置，再用 c114-config-apply 写回 config/runtime.local.json。默认输出模式是 skill 自带的 output/；只有在配置中显式设置 paths.output_mode=project 时，才写入当前工作区的共享目录。然后抓取 C114 当日热点，生成搜索清单 YAML 模板，并由你自己根据标题补全两组 keywords；完成 step 3 后，必须读取 search-review-agent 提示词，只填写 selected_results 下的 ai_review 字段，并按 keep_level=strong/weak/drop 三档精筛；step 4 只抓 strong 和 weak。完成正文抓取后，再读取分层问题 YAML、正文分析提示词和行业研究员简报提示词，继续填写正文分析结果与按产业研究员口径深挖的简报。step 6 的写法必须像通信/科技行业研究员：先判断行业阶段和主矛盾，再区分事实、推断和不确定性，再落到产业链、公司和后续跟踪；不要复述原文，不要机械汇总，不要把单条新闻直接拔高成市场主线或股价评论。完成 step 6 后，必须再读取 brief-review-agent 提示词，生成 step 7 审查报告；这一步不只检查模板残留和链接分组，还要重点审查核心判断是否有证据支撑、增量信息是否真增量、产业/公司影响是否过度外推、需要继续跟踪的点是否过于空泛。step 7 只输出质检问题与修改建议，不自动改写 step 6。控制流程的 agent 不得在单次运行中擅自修改任何中间规则、筛选口径、阈值、保留标准或步骤职责；硬规则归 Python，语义判断归对应 agent，若需调整必须先改 skill 规范与实现，再执行。若步骤、文件名、provider 路由或职责发生变化，必须同步更新 SKILL.md。"
