interface:
  display_name: "C114 当日热点"
  short_description: "抓取 C114 热点并生成待 agent 补全关键词的搜索清单"
  default_prompt: "使用 $c114-daily-hot-topics 时，先阅读 skill 根目录下的 SKILL.md，了解当前总步骤、Quick Start、首次安装配置要求、代理与 SSL 排障说明和规则边界。首次安装或换机器后，先运行 c114-config-init 生成 config/runtime.local.json，再运行 c114-config-status 检查缺项；若缺项，只在缺项时向用户收集配置，再用 c114-config-apply 写回 config/runtime.local.json。若目标环境报代理或证书错误，先提醒用户检查 HTTP_PROXY、HTTPS_PROXY、ALL_PROXY、SSL_CERT_FILE；尤其当出现 ssl.SSLCertVerificationError: self-signed certificate in certificate chain 时，应先判断为公司代理或 CA 证书问题，而不是直接改 skill 代码或关闭 SSL 校验。默认输出模式是 skill 自带的 output/；只有在配置中显式设置 paths.output_mode=project 时，才写入当前工作区的共享目录。若用户只想跑到下一个 agent 检查点，可以使用 run；它会先完成确定性步骤，再在需要 agent 思考的地方停住给出下一步提示。然后抓取 C114 当日热点，生成搜索清单 YAML 模板，并由你自己根据标题补全两组 keywords；当前 step 3 的搜索侧只要求三种搜索 provider key 里至少有一个可用，不要求 Tavily、Metaso、Baidu 三个都配齐；若未配置 Tavily，step 3 仍可执行，只是不做 Tavily extract。所有需要 agent 处理的步骤都必须由模型逐条思考完成，不允许用脚本、规则批量补全、词表映射、模板复用或整批字段填充来偷工减料。完成 step 3 后，必须读取 search-review-agent 提示词，只填写 selected_results 下的 ai_review 字段，并按 keep_level=strong/weak/drop 三档精筛。注意：只要 selected_results 里还有任何一条未完成 review_status=reviewed 或 keep_level 为空，step 4 就必须停住，不能默默跳过。完成正文抓取后，再读取分层问题 YAML和正文分析提示词，先补齐 step 5 的全部分析字段：summary、core_points、new_facts、entities、signals、risk_or_uncertainty、why_it_matters、layer_notes。只要 step 5 仍有缺失字段，Python 就不会继续生成 step 6；这时你必须回到 content-analysis-agent.md 基于 step 4 正文内容补完，而不是跳过或直接写 step 6。只有在 step 5 完整后，才能继续生成按产业研究员口径深挖的 step 6 简报。step 6 的写法必须像通信/科技行业研究员：先判断行业阶段和主矛盾，再区分事实、推断和不确定性，再落到产业链、公司和后续跟踪；不要复述原文，不要机械汇总，不要把单条新闻直接拔高成市场主线或股价评论。完成 step 6 后，必须再读取 brief-review-agent 提示词，生成 step 7 审查报告；这一步不只检查模板残留和链接分组，还要重点审查核心判断是否有证据支撑、增量信息是否真增量、产业/公司影响是否过度外推、需要继续跟踪的点是否过于空泛。step 7 只输出质检问题与修改建议，不自动改写 step 6。控制流程的 agent 不得在单次运行中擅自修改任何中间规则、筛选口径、阈值、保留标准或步骤职责；硬规则归 Python，语义判断归对应 agent，若需调整必须先改 skill 规范与实现，再执行。若步骤、文件名、provider 路由或职责发生变化，必须同步更新 SKILL.md。"
