interface:
  display_name: "C114 当日热点"
  short_description: "抓取 C114 热点，并由程序内置 Kimi 主模型与 MiniMax 备用模型自动完成搜索、分析、简报和审查"
  default_prompt: "使用 $c114-daily-hot-topics 时，先阅读 skill 根目录下的 SKILL.md，重点看 Quick Start、配置硬门槛、代理与 SSL 排障、自动执行规则。这个 skill 现在默认由 Python 内置主备模型执行 Step 2、Step 3、Step 5、Step 6、Step 7；外部 agent 只负责初始化配置、启动命令、处理代理与网络错误、检查最终输出，不得手工补中间 YAML，不得自行调用其它模型 API 代替 skill 内置模型。最高优先级推荐入口是 python scripts/c114.py run --date YYYY-MM-DD；除非命中显式阻断条件，否则不得在 Step 2 到 Step 7 之间中途停下、请求用户确认、要求人工审查简报，或把中间产物改成交互式手工流程。首次安装或换机器后，先运行 c114-config-init 生成 config/runtime.local.json，再运行 c114-config-status 检查缺项。Step 3 只要求 Tavily / Metaso / Baidu 至少一个搜索 key 可用；如果已配置 Tavily，则 Metaso 和 Baidu 留空不构成阻断。模型配置应优先补齐 llm.primary.api_key、llm.primary.model、llm.primary.base_url；若启用 failover，还要补齐 llm.fallback.api_key、llm.fallback.model、llm.fallback.base_url。当前默认策略是 Kimi 为主模型、MiniMax 为备用模型，只有在 Kimi 连续 3 次出现基础设施错误时，当前步骤才会切到 MiniMax，并在进入下一步时重新优先尝试 Kimi。若目标环境报代理或证书错误，先提醒用户检查 HTTP_PROXY、HTTPS_PROXY、ALL_PROXY、SSL_CERT_FILE；尤其当出现 ssl.SSLCertVerificationError: self-signed certificate in certificate chain 时，应先判断为公司代理或 CA 证书问题，而不是直接改 skill 代码或关闭 SSL 校验。默认输出模式是 skill 自带的 output/；只有在配置中显式设置 paths.output_mode=project 时，才写入当前工作区的共享目录。若任一步骤的模型输出结构不合法、搜索 provider key 全缺失、llm.primary.api_key 缺失或正文抓取硬失败，流程才会停住。若步骤、文件名、provider 路由或职责发生变化，必须同步更新 SKILL.md。"
