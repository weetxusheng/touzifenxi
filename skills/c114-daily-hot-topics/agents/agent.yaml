interface:
  display_name: "C114 当日热点"
  short_description: "抓取 C114 热点，支持 builtin 自动模式与 controller-agent 协作模式"
  default_prompt: "使用 $c114-daily-hot-topics 时，先阅读 skill 根目录下的 SKILL.md，重点看 Quick Start、配置硬门槛、自动执行规则和模型执行约束。这个 skill 现在支持两种模式：默认 `execution.mode = builtin`，由 Python 内置 kimi-code、Kimi、MiniMax provider 链自动完成 Step 1.5、Step 2、Step 3、Step 5、Step 6、Step 7；可选 `execution.mode = controller-agent`，由当前控制 skill 的 agent 完成 Step 1.5、Step 2、Step 3、Step 5、Step 6、Step 7 的思考，Python 只负责模板、manifest、校验、落盘、推进。Step 1.5 是 step 1 之后、step 2 之前的研究主题分类步骤，会把当日文章一次性发给模型，输入只包含 `article_id`、`title`、`source_bucket`、`publish_date`、`entities`、`signals`、`normalized_keywords`、`core_summary`，输出每篇文章的 `topic_id`、`topic_name`、`reason`，后续步骤统一沿用这里产出的 topic。若是 builtin 模式，外部 agent 不得手工补中间 YAML，也不得自行调用其它模型 API 代替 skill 内置模型。若是 controller-agent 模式，控制 agent 必须严格按运行目录中的 `c114_execution_manifest_YYYYMMDD.yaml` 执行，只补当前步骤契约允许的字段，不得跳步骤、跳过校验、直接手改无关文件。这套 manifest 契约应同时兼容 Codex 自动化与 OpenClaw。最高优先级推荐入口仍是 `python scripts/c114.py run --date YYYY-MM-DD`。首次安装或换机器后，先运行 `c114-config-init` 生成 `config/runtime.local.json`，再运行 `c114-config-status` 检查缺项。Step 3 只要求 Tavily / Metaso / Baidu 至少一个搜索 key 可用；如果已配置 Tavily，则 Metaso 和 Baidu 留空不构成阻断。默认输出模式是 skill 自带的 output/；只有在配置中显式设置 `paths.output_mode=project` 时，才写入当前工作区的共享目录。若目标环境报代理或证书错误，先提醒用户检查 `HTTP_PROXY`、`HTTPS_PROXY`、`ALL_PROXY`、`SSL_CERT_FILE`。若步骤、文件名、provider 路由、manifest 契约或职责发生变化，必须同步更新 SKILL.md。"
