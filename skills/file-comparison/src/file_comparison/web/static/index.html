<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文件对照任务</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5/dist/reset.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --page-bg: linear-gradient(180deg, #f7f9fc 0%, #edf3fb 100%);
      --page-bg-solid: #edf3fb;
      --card-shadow: 0 10px 28px rgba(32, 58, 96, 0.10);
    }
    html {
      min-height: 100%;
      background: var(--page-bg-solid);
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: var(--page-bg);
      background-color: var(--page-bg-solid);
    }
    #root {
      min-height: 100vh;
    }
    .page-shell {
      padding: 16px;
      max-width: 1360px;
      margin: 0 auto;
    }
    .dense-card {
      border-radius: 14px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
      background: rgba(255, 255, 255, 0.92);
    }
    .workflow-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
    }
    .task-status-card {
      grid-column: 1 / -1;
    }
    .pair-preview-card {
      grid-column: 1 / -1;
    }
    .workflow-grid > .dense-card {
      height: 100%;
    }
    .workflow-grid > .dense-card > .ant-card-body {
      height: 100%;
    }
    .upload-card .ant-card-body {
      display: flex;
      flex-direction: column;
    }
    .upload-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .upload-body-grid {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(0, 2fr);
      gap: 12px;
      align-items: stretch;
    }
    .upload-body-grid .compact-upload {
      height: 100%;
      min-height: 148px;
    }
    .upload-body-grid .compact-upload .ant-upload,
    .upload-body-grid .compact-upload .ant-upload-drag,
    .upload-body-grid .compact-upload .ant-upload-btn {
      height: 100%;
    }
    .upload-body-grid .compact-upload .ant-upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .compact-upload .ant-upload {
      padding: 10px 12px !important;
    }
    .compact-upload .ant-upload-drag-icon {
      margin-bottom: 0 !important;
    }
    .compact-upload .ant-upload-text {
      margin: 0 !important;
      font-size: 13px !important;
    }
    .compact-upload .ant-upload-hint {
      margin-top: 0 !important;
      font-size: 12px !important;
    }
    .compact-upload .ant-upload-list {
      display: none;
    }
    .selected-file-list {
      min-height: 148px;
      height: 100%;
      border: 1px solid #eef2f7;
      border-radius: 10px;
      background: #f8fafc;
      padding: 6px;
    }
    .selected-file-list-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      padding: 0 2px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.2;
    }
    .selected-file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #fff;
      color: #1f2937;
      font-size: 12px;
    }
    .selected-file-row + .selected-file-row {
      margin-top: 6px;
    }
    .selected-file-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .selected-file-remove {
      flex: none;
      border: 0;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 2px 4px;
    }
    .selected-file-remove:hover {
      color: #ef4444;
    }
    .task-progress-summary {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .task-progress-item {
      min-height: 54px;
      border-radius: 10px;
      background: #f8fafc;
      padding: 8px 10px;
    }
    .task-progress-label {
      display: block;
      color: #64748b;
      font-size: 12px;
      line-height: 1.2;
    }
    .task-progress-value {
      display: block;
      margin-top: 4px;
      color: #0f172a;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
    }
    @media (max-width: 1023px) {
      .task-progress-summary {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .upload-body-grid {
        grid-template-columns: 1fr;
      }
      .upload-body-grid .compact-upload {
        min-height: 132px;
      }
      .selected-file-list {
        min-height: 104px;
      }
    }
    @media (max-width: 640px) {
      .task-progress-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    .ant-card-small > .ant-card-head {
      min-height: 36px;
    }
    .ant-card-small > .ant-card-body {
      padding: 12px;
    }
    .ant-table-small .ant-table-cell {
      padding: 6px 8px !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/antd@5/dist/antd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
  <script src="/static/app.js?v=20260505-status-download"></script>
</body>
</html>
