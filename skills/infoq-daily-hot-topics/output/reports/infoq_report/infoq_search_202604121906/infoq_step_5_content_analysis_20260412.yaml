        channel: '首页'
        original_url: 'https://www.infoq.cn/article/02a0f16f3dcb939bb9c05a084'
        original_published_at: '2026-04-12'
        original_content:
          title: 'Java打包时，本地仓库有jar 包，Maven打包却还去远程拉取'
          summary: '在日常开发工作中，总会用到Maven 打包的场景，在maven 打包时，理论上对于本地不存在的包，Maven 会自动从远程拉取指定版本号的最新包。如果本地存在包，Maven 则不会从远程拉取指定版本号的包。但是在实际工作中，有这样一个场景：通过Maven 从远程仓库拉取'
          text: '''问题描述'
          source: 'source_adapter'
          status: 'success'
        selected_contents:
        analysis:
          summary: '本文描述了Maven打包时的一个典型问题：即使本地仓库已存在所需jar包，Maven仍然尝试从远程仓库拉取依赖。'
          core_points:
            - '问题核心：本地仓库存在jar包但Maven仍去远程拉取'
            - '可能原因包括：本地仓库损坏、jar包元数据不完整、Maven缓存与本地仓库不一致、pom文件配置问题等'
            - '典型解决思路：清理Maven本地仓库缓存、检查repository配置、验证jar包完整性'
          new_facts:
          entities:
          signals:
          risk_or_uncertainty:
          why_it_matters: ''
          layer_notes:
