        original_content:
          title: '软件重构：进化视角'
          summary: '软件的腐化一直是架构师面临的一个巨大挑战。不管团队有多优秀，不管在初期建设的时候投入了多大的精力架构设计有多优秀，不管后续有没有严格的CR和测试，一个软件都会或快或慢的出现一些腐化的痕迹。所以大部分软件最终的命运大都是走向腐烂和消亡。'
          text: '''软件的腐化一直是架构师面临的一个巨大挑战。不管团队有多优秀，不管在初期建设的时候投入了多大的精力架构设计有多优秀，不管后续有没有严格的CR和测试，一个软件都会或快或慢的出现一些腐化的痕迹。所以大部分软件最终的命运大都是走向腐烂和消亡。'
