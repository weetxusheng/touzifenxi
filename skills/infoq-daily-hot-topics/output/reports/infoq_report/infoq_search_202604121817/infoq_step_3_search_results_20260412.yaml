            source_tier: 'normal'
            extract_status: 'success'
            extract_text: '# 游戏业大佬实践：AI如何改变游戏编程？程序员招聘标准彻底变天 头像 GameLook 2026-04-09 23:58发布于湖北GameLook官方账号 从全民“养龙虾”的热潮，到GDC大会上激增的AI议题，AI应用近期成为整个游戏圈最关注的话题。相比于美术、动作生成、AI NPC等诸多领域的应用实践，编程一直被视为AI的理想应用领域。 有研究指出，优秀程序员日均产出常为100–150行高质量代码；根据行业调研和腾讯内部数据，‌以代码编写为主要工作的程序员，日均有效新增代码通常在100–200行之间——AI编程工具的落地，正在悄然弥补效率不高的明显短板。 如海外的Claud code，国内也有腾讯对外开放的CodeBuddy等工具推出，编程正以前所未有的速度被AI重塑，高效、稳定地完成大量过去需要初中级程序员耗费大量时间、精力才能完成的工作。 图片 当然，AI在编程领域扮演的角色，从来不是替代者，而是“赋能者”。AI编程现阶段的价值在于，替代初级程序员和经验不足者的部分工作，将他们从重复、基础的编码任务中解放出来，也在无形中进一步拉高了头部程序员的价值。 去年Unity大会上，腾讯天美客户端主程余煜谈及Vibe Coding的现状时表示：“AI的兴起需要很多专家来赋能，让我们这些35+的大龄工程师又迎来了职业第二春。”AI时代的程序员更需要具备与AI协作、驾驭AI解决复杂问题的更高阶能力，因此经验丰富的头部程序员变得更加重要。 近期，《EVE Online》开发商CCP Games高管、《Rust》开发商Facepunch Studios的创始人Garry Newman等多位从业者在接受外媒采访时提到，AI正在加速当下的游戏编程效率，但仍然离不开经验丰富程序员的判断力。 图片 [...] 但他表示，最大的变化体现在非生产代码方面，AI在该领域实现了“变革性”影响。 “我们经常需要编写一些小型脚本来生成数据、调查问题或自动执行一次性任务，”Sigurbergsson说：“这种情况下，我们更关心输出结果，而不是代码的优雅程度。编写脚本与手动工作的价值主张已经发生了巨大变化：以前可能需要半天才能完成的事情，现在几分钟就能搞定。” 独立游戏界元老、 Positech公司的Cliff Harris同样对AI着迷，他形容使用Anthropic的Claude编程“改变了人生”。 “过去一年，我对C++晦涩算法和优化方法的了解，比过去十五年加起来都多，”他在外媒采访中提到：“1981年我11岁就开始编程，至今已有45年的开发经验。我发现，仅仅借助Claude交流想法、查找bug就非常有用。任何不使用TOP级的最新大语言模型（ LLM）编程的人，都是在自缚双手。” 《Rust》《Garry''s Mod》的开发商Facepunch Studios的创始人Garry Newman也表示，AI可以让他的工作更轻松。他指出，使用ChatGPT 或类似的工具向他解释某些事情，而不是使用 Google搜索，是“编程的一次进化”。 “如果我想重构代码，不需要花10分钟把同样的代码复制粘贴到30个不同的文件中；我只需要花5分钟和Claude争论一下，让它替我完成。” 图片 Newman补充道，他不担心AI会取代像他这样的程序员，反而认为这项技术让他的工作能力更强。 “有人担心AI会让任何人都能胜任我的工作，但我并不这么认为。它让我成为了一名更优秀的程序员，让我工作效率更高。我从中学到了东西。也正因为有了它，我才成为了一名更优秀的程序员，”他解释道。“我并不担心，反而很兴奋。” [...] 他眼中最坏的情况是，开发者利用AI创建了大量需要人工调试的代码。“任何与某个系统打交道一段时间的程序员都会对该系统有一个心智模型，尤其是那些参与编写该系统的程序员，” Ogden说。 “但一大堆AI代码会破坏这一切。AI不会在半夜突然意识到系统的某个方面出了问题，也不会在晚上思考是否有更好的实现方法。你实际上已经在研发过程中剔除了通用智能的所有相关部分。” 对AI用于编程表示担忧的人当中，也有声音人认为未来这项技术或许能像鼓吹它的人所说的那样发挥作用——但首先要克服一些重大障碍。 Alex Darby认为，要让AI生成的代码在公司范围内发挥作用，唯一的办法就是围绕它构建整个工作流程。“我认为科技公司更有能力利用这种方法，因为它们大多采用‘大规模自动化测试和持续交付’的流程，”他说道。 “这需要采用不同的软件架构方法，相应地，任何一段代码往往更具模块化和独立性，以便于测试。因此，编写代码所需的上下文信息就更少了。” 与此同时，Mode 7 的 Kilduff-Taylor 认为，AI在游戏编程领域广泛应用的主要障碍是上下文信息。 “AI可能非常愚蠢，也可能出人意料地强大：一方面是‘随机鹦鹉学舌’式愚蠢的自动补全功能，另一方面是物理学领域的重大新发现，两者之间存在着巨大差异，”他说道。“上下文、框架和辅助系统是关键所在。” 他总结道：“在游戏领域，我们还没有合适的框架来解决这个问题。有人认为这是无法克服的。就我个人而言，我没有足够的洞察力来对此做出有效的判断，尤其是从长远发展方面来看。” AI原生程序员招聘新标准：比起编程能力更看重判断力 随着程序员开始与功能日益强大的AI代理协同工作，其工作性质正在发生转变。AI时代的程序员该具备什么样的能力，Augment在招聘过程中率先提出了新标准。 图片'
