            snippet: '# 重构线性视觉Transformer，精度与效率双平衡 | CVPR''25. 【新智元导读】南洋理工、北航与合工大联合提出CARE Transformer，以非对称解耦方式并行建模局部细节与全局依赖，通过通道拆分与双交互机制，显著降低线性注意力计算开销，同时提升特征表达能力。实验证明，该模型在iPhone与iPad上实现超低延迟下的高精度，成功打破移动端视觉Transformer“效率与精度不可兼得”的困局，为端侧AI落地提供全新范式。. 在图像分类、目标检测、语义分割等计算机视觉核心任务中，Transformer 凭借全局感受野与强大的特征建模能力，成为视觉领域的核心技术架构。. 但自注意力固有的二次计算复杂度，严重限制了Transformer 在手机、平板、嵌入式设备等资源受限的移动端场景落地，成为端侧视觉 AI 规模化应用的核心瓶颈。. 一是现有方案大多通过局部注意力限制感受野来降'
