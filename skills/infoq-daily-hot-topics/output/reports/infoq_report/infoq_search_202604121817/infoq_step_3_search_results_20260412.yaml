            result_title: 'Skill vs App：一场入口范式的争夺 - 智源社区'
            url: 'https://hub.baai.ac.cn/view/53799'
            domain: 'hub.baai.ac.cn'
            published_at: '2026-04-09'
            snippet: '# Skill vs App：一场入口范式的争夺. 量子位 2026-04-09 08:50 分享. ##### 田晏林 发自 凹非寺 量子位 | 公众号 QbitAI. 这段时间，以它为代表的智能体技术，正以**Skill调用**取代**App跳转**，让传统应用形态第一次感受到**被“架空”**的危机。. 在**量子位**近期举办的**「龙虾时代，Skill会吃掉App吗？」**主题沙龙上，我们看到深耕传统App生态多年的从业者与“养了50只龙虾”的算法工程师正面交锋。. 大家围绕**Agent生态、Skill能力边界、App未来形态**等话题激烈讨论，现场碰撞出许多有意思的观点：. * Skill VS App不是谁消灭谁，是GUI（图形界面）向 LUI（对话式交互）迁移；. ## Skill是AI时代的“小程序”. 小卡健康是一款为减脂和健身人群设计的AI饮食记录App，通过AI拍'
            score: 0.2558
            is_official: false
            source_tier: 'normal'
            extract_status: 'success'
            extract_text: 'OpenClaw和Claude Code这类工具，已经在尝试给AI做简易记忆库，它们的做法是：用Markdown文件当“AI的小笔记本”，让AI记住和你相关的信息。 但我们觉得可能这些对记忆的处理精度还是不够，做得还是比较粗暴。 真正可用的Agent需要“被养出来”，通过深度记忆越来越懂使用者。 我们将个人记忆拆解为六大核心维度：长期基础信息、个人风格偏好、中短期目标任务、行为规律、人际关系网络，以及更高阶的决策思维模式。 相比简单文件存储，更需要用结构化方式管理记忆，区分长期记忆、动态记忆等不同深度，提升效率与准确性。 所以我们认为还是应该有一套记忆系统去管理，才能让AI更好地理解你。 我们做了一些demo，比如我连接了我的笔记、知识库、SaaS工具、邮件系统等。 可以做的事是，它根据我的数据分析提炼出我的记忆，拿到记忆信息之后，帮我去行动。 例如，自动读取邮件、结合当前任务生成回复草稿。当然我们认为这个步骤不能直接做决策，但至少可以做到帮你写好草稿，你确认一下没问题就可以发送。 这个过程中，才能让AI做成真正的闭环。这也是我们认为AI与笔记办公工具结合的方向。 ## 把进化交给时间 元空AI是一家由北京大学在读博士团队创业而成的公司，其核心产品AI Excel工具——ChatExcel，于2023年2月测试版上线，累计服务用户超千万次。 谈及本次沙龙主题，元空AI创始人&CEO逄大嵬说，AI、Skill与App的发展都是进化过程，如同生物从单细胞到人类的演化，需要时间沉淀且充满变异，无法预见终局。 但他能肯定的是，如同新形态技术从未杀死旧形态，Skill也不会吃掉App。 [...] 我的判断是，App会持续作为服务载体存在，不会被Skill完全取代，而是适配生态进化。 现阶段，Skill发展仍有不少问题：使用成本偏高、多数服务不支持CLI、生态不完善；人类还不擅长精准向机器描述需求，容易浪费token。 更深层的是组织架构问题，当前团队协作依赖人工传递信息，上下文大量丢失，真正的效率提升需要Agent化组织，让AI之间直接对接传递完整信息。 当然，Skill的优势也很明显：服务互联互通，个性化流程更灵活；上下文完整连贯，体验更贴心有情绪价值；多Agent并存提供服务，个体效率将10倍提升。 我建议大家亲自使用GPT、Claude等工具，只有亲身实践才有真实体感。特别是企业管理者，如果不亲自使用AI，就无法搭建适配AI时代的组织架构，创新也只能停留在空想。 最后我想说，AI时代，每个人都值得温柔以待，每个人都配得上更个性化的服务。 ## 你的产品去掉AI后，还存在吗？ 两周前，金山办公WPS的AI原生笔记刚刚完成内测， 补上了WPS产品组件板块的最后一块拼图。 “很多人都在说，WPS为什么没有一个笔记软件？也有人说，已经有WPS了，为什么还要做一个笔记软件？”过去一段时间，两种声音在徐奕成耳边碰撞了太多次。 作为金山办公WPS AI产品总监，徐奕成向沙龙现场的创业者和产品经理抛出一个问题：“你们设计的产品能被Claude Code直接调用吗？” 他的答案很明确，如果一个App应用不能被Agent访问，那么在AI的世界中，它已经消失了，“因为AI看不见它”。 徐奕成用自动驾驶举例，称以前是“人开车”，现在讨论最多的是“车载人”。比如特斯拉，已经推出无方向盘、无踏板的无人出租车了。 放到应用产品上也是同理：从前是人使用App，未来会变成App主动服务人。 [...] 而“破界”的关键，我认为是OpenClaw的出现，它像生物变异一样，让我们的基础能力长出更多新东西。 我们是第一批做AI Agent的团队，也是春节后国内第一个发布小程序版本龙虾的平台。作为平台方，我们能看到用户领养Agent后的真实使用场景。 它已进入生产力环节，比如我们的实习生现在只需要用1小时、10元钱就能完成原本要用半天、花费150元的图文排版工作，还改变了内部工作流程。 其实，行业里总在讨论“新形态是否会杀死旧形态”，但历史已经证明，PC没有杀死大型机，智能手机没有杀死PC，云计算也没有杀死本地服务器，它们只是完成了角色重构。 Skill与App的关系也是如此。 App只是进化过程中的一个阶段，用户真正关注的不是中间过程，而是最终结果。 作为AI创业者，我们2023年从校园创业起步，去年连续融资三轮，服务百万用户，我们自身就是进化的缩影。 当前AI产品迭代已快至以周为单位，比起纠结技术细节，更重要的是团队能否坚持信念、穿越周期。 最后我认为，AI时代产品叫什么不重要，能给用户提供想要的结果、提升体验，才是核心。 ## 超级App仍然难被替代 关于“Skill会不会吃掉App”这一话题，TTC联创&CTO、ClawOS创始人宁辽原的立场更加明确。 他说，吃掉App的不会是Skill，而是Agent产品。 Skill和App都只是过渡态，未来的趋势是从Skill走向Agent Team，乃至Agent Economy。 宁辽原曾在微软从事AI产品与工程师相关工作，后来加入过飞书，如今创办TTC，专门为AI企业和科技企业招募技术人才。 今年，他们公司也推出了Agent产品ClawOS。'
            matched_terms:
