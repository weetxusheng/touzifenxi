            url: 'https://www.cubagarcia.com/posts/2026-04-07-harness-business-model/'
            domain: 'www.cubagarcia.com'
            published_at: '2026-04-07'
            snippet: 'What increasingly shapes the real user experience is the harness. By that I mean the environment the model operates inside. The interface. The memory model. The'
            score: 0.5655
            is_official: false
            source_tier: 'normal'
            extract_status: 'success'
            extract_text: 'That is a much deeper dependency than most teams realize. The model may still be the engine. But the harness is becoming the steering wheel, the dashboard, the gearbox and, increasingly, the monetization layer too. That is where power is consolidating. If you are serious about building AI capability inside a company, I think this is one of the shifts that matters most right now. The question is no longer only which model you choose. It is which operating surface you are willing to build on, how much of it you actually control, and what happens when the owner of that surface changes the rules. That is not a tooling detail. It is strategy. Image 2 ai agents strategy workflow openclaw anthropic infrastructure © 2026 Herbert Cuba Garcia Built by markdown and AI [...] For a while, most of the AI conversation has been trapped in model talk. Which model is smartest. Which one is fastest. Which one writes the best code. Which one wins the benchmark this week. That still matters, obviously. But I think many people are still putting too much weight on that layer alone. What increasingly shapes the real user experience is the harness. By that I mean the environment the model operates inside. The interface. The memory model. The orchestration logic. The approval flows. The tool permissions. The runtime behaviour. The integrations. The way work gets delegated, resumed, reviewed and shipped. That layer used to feel like packaging. Now it is starting to look a lot more like the product. [...] That is where stickiness starts to live. Not only in which model you use, but in where work starts, how context is loaded, what permissions exist, how state is preserved, who verifies outputs, what gets automated, what gets remembered, and how all of it fits into a repeatable operating loop. This is also why I think a lot of companies are underestimating vendor dependency in the AI era. They think they are adopting a model. In practice, they are often adopting a harnessed operating surface shaped by someone else’s pricing logic, policy decisions, incentives and product boundaries. That is a much deeper dependency than most teams realize.'
