            extract_text: 'IBM Newsroom # 新闻稿 # AI 驱动企业 IT 运维迈向预测性与智能化阶段 4月 10, 2026 —— IBM 大中华区技术服务部总经理潘军 北京2026年4月10日 /美通社/ -- AI 正快速融入企业关键业务领域，但支撑其落地运行的 IT 体系尚未完全做好准备。IBM 调研数据显示，77%的受访高管希望加快 AI 应用落地节奏，而仅有25%认为现有 IT 基础设施能够支撑 AI 的规模化落地。 潘军IBM 大中华区技术服务部总经理 这一"就绪度缺口"表明，AI 带来的变革并非单一技术升级，而是对企业整体 IT体系的系统性重构。在 IBM 技术服务部看来，AI 正在融入企业运营模型，推动 IT 运维从传统后端支持职能，向支撑业务创新的关键能力演进。 运维模式重构：从响应式脚本进化为智能体驱动的运维 长期以来，企业 IT 运维以"故障响应"为核心。随着企业 IT 系统复杂度持续攀升，运维模式正从传统自动化脚本向"自主智能体 AI（Agentic AI）"演进。 这一转变的核心在于运维逻辑的升级：基于 IBM watsonx 平台，AI 不再仅执行预设规则，而是具备一定的自主推理能力，能够拆解业务目标并规划端到端运维任务的执行路径。通过多智能体协同，企业运维体系可实现从状态感知到决策执行的闭环管理。在部分场景下，系统可自主完成根因分析并实现故障自愈，平均修复时间可缩短最高 80%。 目前，基于 IBM TLS Support Insights 平台，公司已在全球为超过 3000 家客户管理超过 400 万个 IT 资产。在 IBM 相关实践中，91%的 Call Home 设备告警请求已实现自动化响应和处置，从而缓解运维压力并提升系统稳定性。 技术底座演进：应对 AI 规模化基础设施约束 [...] 在电力方面，智能风控、智能客服等大规模 AI 应用落地，对算力需求持续攀升，但传统数据中心在供电密度与部署周期上难以适配 AI 发展节奏。高性能 GPU 集群，推动单机柜功率从传统的 5–10 千瓦快速提升至 30 千瓦以上，甚至在高密度部署场景中达到更高水平，使得大规模部署面临供电与散热改造的现实约束。同时，能耗成本持续上升，叠加电力资源与 PUE 优化压力，进一步加剧数据中心的运营负担。 人机协同：以业务洞察引导 AI 增强，而非替代 在转型过程中，IBM 强调 AI 的核心价值在于增强专业能力，而非简单替代人力。AI 擅长处理海量数据与重复性任务，而人类专家的核心价值在于对业务场景的理解与决策能力。 调研显示，64%的 CEO 认为，AI 的成功更依赖人的采纳，而非技术本身，这反映出组织与流程因素在 AI 落地过程中的关键作用。在实际落地中，这通常体现为将 AI 能力嵌入一线工作流程。例如，在 IBM 内部"零号客户（Client Zero）"实践中，通过坐席助手（Agent Assist）提供实时建议，初级工程师可借助 AI 完成专家级任务，在缓解技能短缺的同时，将问题解决时间缩短约32%。 这一协作模式的关键在于"释放与重塑"：AI 减少重复性劳动，使运维人员从"救火式"工作中转向更具业务价值的领域。企业转型效果在很大程度上取决于员工技能升级与人机协同能力的提升。 以全生命周期方法构建"AI 就绪"的 IT 体系 企业需从局部单点优化转向体系化的"集成数据中心（Integrated Data Center）"建设。这不仅是技术堆栈的升级，更是基于"AI 优先（AI-First）"理念对 IT 体系的整体重塑，覆盖基础设施规划设计、部署实施、运维优化以及汰新下线的全生命周期管理。 [...] 参考信息： 媒体联络人 李波 libole@cn.ibm.com IBM中国 IBM Corporation logo SOURCE IBM China Download IBM IBM Download IBM_LOGO_1 IBM\_LOGO\_1 #### Release Categories Subscribe to email IBM China news Receive the latest news about IBM by email, customized for your preferences Subscribe now'
