            extract_status: 'success'
            extract_text: '目前研究团队表示，未来将持续深化CARE Transformer的技术和架构的优化。 一方面，将引入神经网络架构搜索（NAS）技术，探索CARE机制的最优架构配置，进一步挖掘模型的精度与效率潜力； 另一方面，将把CARE机制拓展至大参数量视觉模型与多模态大模型中，验证其在更大规模模型中的通用性与有效性。 参考资料： 秒追ASI ## VIP课程推荐 ## APP专享直播 ## 热门推荐 新浪财经公众号 24小时滚动播报最新的财经资讯和视频，更多粉丝福利扫描二维码关注（sinafinance） ## 股市直播 ## 7X24小时 杨伟民 董明珠还能为格力奋战多久？|《至少一个小时》 梁建章：中国人口衰竭的速度前所未有 冷友斌回应网友质疑：说价格高 对飞鹤不公平！ 王中军：我喜欢比较“江湖”一点的人 新浪财经意见反馈留言板 新浪简介|广告服务|About Sina 联系我们|招聘信息|通行证注册 产品答疑|网站律师|SINA English Copyright © 1996-2026 SINA Corporation All Rights Reserved 新浪公司 版权所有 [...] # 重构线性视觉Transformer，精度与效率双平衡 | CVPR''25 新智元报道 编辑：LRST 【新智元导读】南洋理工、北航与合工大联合提出CARE Transformer，以非对称解耦方式并行建模局部细节与全局依赖，通过通道拆分与双交互机制，显著降低线性注意力计算开销，同时提升特征表达能力。实验证明，该模型在iPhone与iPad上实现超低延迟下的高精度，成功打破移动端视觉Transformer“效率与精度不可兼得”的困局，为端侧AI落地提供全新范式。 在图像分类、目标检测、语义分割等计算机视觉核心任务中，Transformer 凭借全局感受野与强大的特征建模能力，成为视觉领域的核心技术架构。 但自注意力固有的二次计算复杂度，严重限制了Transformer 在手机、平板、嵌入式设备等资源受限的移动端场景落地，成为端侧视觉 AI 规模化应用的核心瓶颈。 当前主流的移动端高效视觉 Transformer方案，仍面临两大无法回避的技术痛点： 一是现有方案大多通过局部注意力限制感受野来降低复杂度，直接牺牲了 Transformer 核心的长距离建模能力，导致模型精度大幅下滑； 二是主流线性注意力优化方案采用局部增强与全局注意力堆叠的串行架构，不仅融合方式僵化、计算效率低下，还无法解决线性注意力高熵特性带来的token干扰问题，最终陷入 「效率提升有限、精度损失严重」 的两难境地，难以满足移动端部署对精度与延迟的严苛要求。 图1. (a) 堆叠式串型方案 (b) 和提出的非对称解耦式方法（）。后者将局部归纳偏置与长程依赖分别进行建模，并进一步将线性注意力在通道维度上的二次计算开销缓解为 。其中，局部归纳偏置通过深度卷积来学习，而长程依赖则通过线性注意力来建模。 [...] 为从根本上破解上述行业难题，南洋理工大学联合北京航空航天大学、合肥工业大学的研究团队展开深度技术攻关，跳出传统堆叠式线性注意力的优化思维框架，首次将局部归纳偏置与长距离依赖建模解耦为并行的分治式任务，提出了全新的移动端友好型线性视觉Transformer架构CARE Transformer。 论文链接： 代码链接： 该架构以非对称特征解耦为核心，通过通道维度的非对称拆分，分别完成局部细节与全局上下文的独立学习，有效地降低了线性注意力的二次计算开销；同时创新性地设计了双交互模块，充分挖掘局部与全局特征、跨层级特征之间的互补性，在简化传统串行优化流程的同时，实现了推理效率与视觉任务精度的协同跃升，为视觉Transformer打造了更可靠、更高效、更具落地价值的技术新范式。 从方法论上看，CARE不是简单地对现有线性视觉Transformer做局部修补，而是试图回答一个更本质的问题：移动端模型该如何同时保留局部细节感知能力与全局上下文建模能力。论文给出的答案是「先解耦，再显式交互」，从而将原本耦合在同一流水线中的信息建模过程进行更高效的组织。 图2. CARE Transformer 与近期典型的移动端友好型模型在精度、延迟和 GMACs 平衡关系上的可视化比较。图中，标记越大，表示模型消耗的 GMACs 越多。「SA」、「LA」 和 「GNN」 分别表示这些方法分别基于自注意力、线性注意力和图神经网络。 CARE Transformer的核心突破集中在两大核心维度，重构了线性视觉 Transformer 的设计逻辑，从底层解决了当前视觉Transformer的核心痛点。 其一，提出非对称特征解耦策略，将局部归纳偏置与长距离依赖的学习过程进行分治式解耦，明确回答了 「如何高效兼顾局部细节建模与全局依赖捕捉」 的核心问题。'
