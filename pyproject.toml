[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "touzifenxi"
version = "0.1.0"
description = "Multi-agent A-share research team MVP for daily top-5 stock ideas."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "tzdata>=2024.1",
  "pandas>=2.0,<3",
  "akshare>=1.18.39",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "playwright>=1.58,<2",
  "requests>=2.28.0",
  "python-dotenv>=1.0.0",
  "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.12,<0.13",
  "pre-commit>=4.0,<5",
]

[project.scripts]
touzifenxi = "utils.cli:main"
gzh-fetch = "gzh_pipeline.cli.fetch:main"
gzh-parse = "gzh_pipeline.cli.parse:main"
gzh-repair-url-html = "gzh_pipeline.cli.repair_url_html:main"

[tool.setuptools.package-dir]
"" = "src"
"gzh_pipeline" = "src/gzh/src"

[tool.setuptools.packages.find]
where = ["src", "src/gzh/src"]

[tool.pytest.ini_options]
pythonpath = ["src", "src/gzh/src"]
testpaths = ["tests", "src/gzh/tests"]
python_files = ["test_*.py"]
markers = [
  "c114_network: live fetch to c114 (requires C114_NETWORK_TEST=1)",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]
include = [
  "pyproject.toml",
  "src/**/*.py",
]
extend-exclude = [
  ".venv",
  "alembic",
  "build",
  "reports",
  "src/touzifenxi.egg-info",
  "state",
  "output",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
