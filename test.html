<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>启动与登录页</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "surface": "#fff8f1",
                    "primary-container": "#dd3123",
                    "error-container": "#ffdad6",
                    "on-secondary-container": "#5d1900",
                    "on-tertiary": "#ffffff",
                    "on-primary": "#ffffff",
                    "primary": "#b8110c",
                    "outline": "#906f6a",
                    "surface-container": "#f6edde",
                    "on-error": "#ffffff",
                    "tertiary-fixed-dim": "#83cfff",
                    "on-surface-variant": "#5c403c",
                    "surface-container-highest": "#ebe1d3",
                    "on-primary-container": "#fffbff",
                    "secondary": "#ab3500",
                    "on-tertiary-fixed": "#001e2e",
                    "surface-bright": "#fff8f1",
                    "tertiary-container": "#007dae",
                    "on-surface": "#1f1b12",
                    "on-tertiary-fixed-variant": "#004c6c",
                    "inverse-surface": "#353026",
                    "surface-dim": "#e2d9ca",
                    "outline-variant": "#e5bdb7",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed-variant": "#832600",
                    "on-tertiary-container": "#fcfcff",
                    "on-primary-fixed": "#410000",
                    "on-primary-fixed-variant": "#930002",
                    "secondary-fixed-dim": "#ffb59d",
                    "tertiary": "#00628a",
                    "tertiary-fixed": "#c7e7ff",
                    "surface-container-high": "#f1e7d8",
                    "primary-fixed": "#ffdad5",
                    "background": "#fff8f1",
                    "primary-fixed-dim": "#ffb4a9",
                    "on-background": "#1f1b12",
                    "surface-container-low": "#fcf2e3",
                    "on-secondary-fixed": "#390c00",
                    "secondary-fixed": "#ffdbd0",
                    "inverse-primary": "#ffb4a9",
                    "surface-variant": "#ebe1d3",
                    "secondary-container": "#fe6a34",
                    "inverse-on-surface": "#f9efe1",
                    "error": "#ba1a1a",
                    "surface-tint": "#bc150e",
                    "on-secondary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-gradient {
            background: linear-gradient(135deg, #b8110c 0%, #dd3123 100%);
        }
        .red-envelope-shadow {
            shadow-color: rgba(184, 17, 12, 0.15);
        }
        .festive-blur {
            backdrop-filter: blur(20px);
        }
    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface text-on-surface overflow-hidden min-h-screen selection:bg-primary/20">
<!-- Top Right Action (Skip) -->
<nav class="fixed top-0 right-0 p-6 z-50">
<a class="text-on-surface-variant text-sm font-medium hover:text-primary transition-colors flex items-center gap-1 group" href="#">
        暂不登录
        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">chevron_right</span>
</a>
</nav>
<main class="relative min-h-screen flex flex-col items-center justify-between px-8 py-20">
<!-- Abstract Background Decorative Elements -->
<div class="absolute inset-0 pointer-events-none">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute top-1/4 -right-24 w-64 h-64 bg-secondary/5 rounded-full blur-3xl"></div>
</div>
<!-- Hero Section: Logo & Identity -->
<div class="flex flex-col items-center text-center mt-12 w-full max-w-sm">
<!-- Centered Logo Component -->
<div class="relative mb-8 group">
<div class="absolute inset-0 bg-primary/10 rounded-full blur-2xl scale-125 transition-transform group-hover:scale-150 duration-700"></div>
<div class="relative w-32 h-40 flex items-center justify-center">
<!-- Illustration Placeholder of Red Scroll -->
<div class="w-full h-full editorial-gradient rounded-xl shadow-2xl flex flex-col items-center justify-center transform -rotate-3 group-hover:rotate-0 transition-transform duration-500 overflow-hidden" data-alt="a stylized red paper scroll unfolding vertically with a large glowing golden chinese character for gift in the center">
<div class="w-full h-2 bg-on-primary/20 absolute top-2"></div>
<div class="w-full h-2 bg-on-primary/20 absolute bottom-2"></div>
<span class="text-6xl font-extrabold text-[#facc15] drop-shadow-md select-none" style="font-family: serif;">礼</span>
</div>
</div>
</div>
<!-- App Name & Slogan -->
<div class="space-y-3">
<h1 class="text-4xl font-extrabold tracking-tighter text-primary">
                线上人情礼薄
            </h1>
<p class="text-on-surface-variant font-medium tracking-[0.2em] text-sm uppercase">
                记一份情义 · 留一份温暖
            </p>
</div>
</div>
<!-- Editorial Content / Visual Break -->
<div class="w-full max-w-md hidden md:block">
<div class="grid grid-cols-2 gap-4 opacity-50">
<div class="h-32 bg-surface-container-high rounded-2xl transform rotate-2"></div>
<div class="h-32 bg-surface-container rounded-2xl transform -rotate-1 mt-6"></div>
</div>
</div>
<!-- Login Actions Area -->
<div class="w-full max-w-sm space-y-8 relative z-10">
<!-- Social Login Buttons Container -->
<div class="flex flex-col gap-4">
<!-- Primary WeChat Login -->
<button class="editorial-gradient text-on-primary w-full py-4 rounded-[16px] font-bold text-lg shadow-[0_20px_40px_rgba(184,17,12,0.2)] active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<div class="w-6 h-6 bg-white/20 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
</div>
                微信一键登录
            </button>
<!-- Secondary Douyin Login -->
<button class="bg-surface-container-high text-on-surface w-full py-4 rounded-[16px] font-bold text-lg hover:bg-surface-container-highest transition-colors active:scale-[0.98] flex items-center justify-center gap-3">
<div class="w-6 h-6 bg-on-surface/5 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">music_note</span>
</div>
                抖音一键登录
            </button>
</div>
<!-- Privacy Policy -->
<div class="flex items-start justify-center gap-3 px-4">
<label class="relative flex items-center cursor-pointer">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded-md border border-outline-variant bg-surface transition-all checked:bg-primary checked:border-primary focus:ring-0 focus:ring-offset-0" type="checkbox"/>
<span class="material-symbols-outlined absolute text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none text-[14px]" style="font-variation-settings: 'wght' 700;">check</span>
</label>
<p class="text-[12px] leading-relaxed text-on-surface-variant font-medium">
                我已阅读并同意
                <a class="text-primary hover:underline transition-all" href="#">《用户协议》</a>
                和
                <a class="text-primary hover:underline transition-all" href="#">《隐私政策》</a>
</p>
</div>
</div>
</main>
<!-- Footer Decorative Flourish -->
<footer class="fixed bottom-0 left-0 w-full flex justify-center pointer-events-none opacity-30 h-32 overflow-hidden">
<div class="w-[120%] h-64 bg-primary/5 rounded-[100%] blur-3xl -bottom-32 absolute"></div>
<div class="flex gap-12 mt-12">
<span class="material-symbols-outlined text-primary/10 text-6xl" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="material-symbols-outlined text-primary/10 text-6xl" style="font-variation-settings: 'FILL' 1;">redeem</span>
<span class="material-symbols-outlined text-primary/10 text-6xl" style="font-variation-settings: 'FILL' 1;">celebration</span>
</div>
</footer>
</body></html>
