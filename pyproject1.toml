[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gzh-pipeline"
version = "1.0.0"
description = "微信公众号大佳啦抓取与聚合解析流水线"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28.0",
  "python-dotenv>=1.0.0",
  "beautifulsoup4>=4.12.0",
]

[project.scripts]
gzh-fetch = "gzh_pipeline.cli.fetch:main"
gzh-parse = "gzh_pipeline.cli.parse:main"
gzh-repair-url-html = "gzh_pipeline.cli.repair_url_html:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
